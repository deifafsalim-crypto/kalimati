<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تعلم القراءة — كلماتي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=El+Messiri:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a "sound wall" study desk — lesson rail on the side, one rule at a time in the main column; highlighted letter patterns are the visual signature */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --surface-2:#E9EFF6; --ink:#17233F; --ink-2:#45506A; --line:#D3DCE8;
  --accent:#0E7C7B; --accent-ink:#FFFFFF; --accent-soft:#D5EFEE;
  --mark:#FFE07A; --mark-ink:#17233F; --warn:#C2512F; --warn-soft:#FBE3DA; --ok:#2F8A55; --ok-soft:#DDF2E5;
  --ar:'IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif; --display:'El Messiri','IBM Plex Sans Arabic',Tahoma,serif;
  --en:'Atkinson Hyperlegible','Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1626; --surface:#18223A; --surface-2:#212D49; --ink:#EAF0FA; --ink-2:#AEB9CF; --line:#2F3C5C;
  --accent:#4FC3C1; --accent-ink:#0C1A1A; --accent-soft:#173F44; --mark:#E8C44E; --mark-ink:#17233F;
  --warn:#F08C6C; --warn-soft:#45261F; --ok:#6CCF92; --ok-soft:#1D3A2A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1626; --surface:#18223A; --surface-2:#212D49; --ink:#EAF0FA; --ink-2:#AEB9CF; --line:#2F3C5C;
  --accent:#4FC3C1; --accent-ink:#0C1A1A; --accent-soft:#173F44; --mark:#E8C44E; --mark-ink:#17233F;
  --warn:#F08C6C; --warn-soft:#45261F; --ok:#6CCF92; --ok-soft:#1D3A2A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ar);font-size:17px;line-height:1.75;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.en{font-family:var(--en);direction:ltr;unicode-bidi:isolate}
mark{background:var(--mark);color:var(--mark-ink);border-radius:4px;padding:0 2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.3;margin:0}
/* top bar */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--en);font-weight:700;font-size:22px}
.brand h1{font-size:26px}
.brand p{margin:0;color:var(--ink-2);font-size:14px}
.prog{display:flex;align-items:center;gap:10px;min-width:220px;flex:0 1 320px}
.bar{flex:1;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.prog span{font-size:14px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
/* layout */
.grid{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
nav.rail{flex:1 1 250px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:18px}
.part{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.3px;margin:12px 8px 4px}
.part:first-child{margin-top:2px}
.lnk{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:none;border:0;border-radius:12px;padding:8px 10px;min-height:44px;font-size:15.5px}
.lnk:hover{background:var(--surface-2)}
.lnk[aria-current="true"]{background:var(--accent-soft);font-weight:700}
.dot{width:22px;height:22px;flex:0 0 auto;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px}
.lnk.done .dot{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.final-btn{margin-top:12px;width:100%;border:0;border-radius:14px;padding:12px;background:var(--ink);color:var(--bg);font-weight:700;min-height:48px}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}
.hero{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:13.5px;font-weight:700;color:var(--accent)}
.hero h2{font-size:30px}
.hero .lead{margin:0;max-width:68ch;color:var(--ink-2)}
.rel{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:99px;padding:3px 14px;font-size:14.5px;font-weight:600}
.rel b{font-variant-numeric:tabular-nums}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rule h3{font-size:18px}
.snd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ipa{font-family:var(--en);font-size:22px;font-weight:700;color:var(--accent)}
.arsnd{background:var(--surface-2);border-radius:8px;padding:0 10px;font-weight:700}
.rule p{margin:0;color:var(--ink-2);font-size:15.5px}
.words{display:flex;flex-wrap:wrap;gap:8px;direction:ltr;justify-content:flex-end}
.w{font-family:var(--en);font-size:19px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px 12px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.w:hover{border-color:var(--accent)}
.w svg{width:15px;height:15px;opacity:.55}
.w.playing{background:var(--accent-soft);border-color:var(--accent)}
.box{border-radius:16px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.box h3{font-size:17px}
.box.warn{background:var(--warn-soft)}
.box.warn h3{color:var(--warn)}
.box.tip{background:var(--accent-soft)}
.box p{margin:0}
/* practice */
.prac h3{font-size:21px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--ink-2);font-size:14.5px;font-variant-numeric:tabular-nums}
.q{font-size:20px;font-weight:600;margin:6px 0 4px}
.qword{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 12px}
.qword .big{font-family:var(--en);font-size:34px;font-weight:700;direction:ltr}
.play{border:0;background:var(--accent);color:var(--accent-ink);border-radius:50%;width:52px;height:52px;display:grid;place-items:center}
.play svg{width:24px;height:24px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;min-height:54px;font-size:18px;font-weight:600}
.opt.en{font-family:var(--en);font-size:20px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--warn-soft);border-color:var(--warn)}
.opt:disabled{cursor:default}
.why{margin-top:12px;border-radius:14px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.why.ok{background:var(--ok-soft)} .why.no{background:var(--warn-soft)}
.why p{margin:0;flex:1 1 260px}
.btn{border:0;border-radius:12px;padding:8px 20px;min-height:46px;background:var(--ink);color:var(--bg);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.result .score{font-family:var(--en);font-size:48px;font-weight:700;font-variant-numeric:tabular-nums}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* tables (stress, plan) */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-size:14.5px}
tr:last-child td{border-bottom:0}
.chk{width:24px;height:24px;accent-color:var(--accent)}
.stress b{color:var(--accent)}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pair{display:flex;gap:8px;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:8px;direction:ltr}
.pair span{color:var(--ink-2)}
/* tabs + voice */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 18px;min-height:48px;font-weight:700}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.voice{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:6px 16px;min-height:44px;background:var(--accent-soft);color:var(--ink);font-weight:700;font-size:15px}
.voice svg{width:20px;height:20px}
.voice.playing{background:var(--accent);color:var(--accent-ink)}
.rule .voice{align-self:flex-start;min-height:40px;padding:4px 14px;font-size:14px}
.how{background:var(--surface-2);border-radius:12px;padding:8px 12px;font-size:15px;margin:0}
/* games */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gcard{text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-height:132px}
.gcard:hover:not(:disabled){border-color:var(--accent)}
.gcard:disabled{opacity:.5;cursor:default}
.gtop{display:flex;justify-content:space-between;align-items:center;width:100%}
.gnum{font-family:var(--en);font-weight:700;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2)}
.gtag{font-size:12.5px;font-weight:700;border-radius:99px;padding:1px 10px}
.t-listen{background:#E3DCFB;color:#3B2A80}.t-read{background:#D5EFEE;color:#0B5554}.t-spell{background:#FFEDB8;color:#6B4A00}.t-speak{background:#FFDCE6;color:#7E2142}.t-mem{background:#DDEBFB;color:#1D4A86}
.gcard h4{margin:0;font-size:17.5px;font-family:var(--display)}
.gcard p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.6}
.stars{font-size:15px;letter-spacing:2px;color:#D9A520}
.stars .off{color:var(--line)}
.gbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pill{background:var(--surface-2);border-radius:99px;padding:3px 14px;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.letters{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:ltr}
.lt{font-family:var(--en);font-size:28px;font-weight:700;min-width:50px;min-height:58px;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
.lt.on{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.lt.right{background:var(--ok-soft);border-color:var(--ok)}.lt.wrong{background:var(--warn-soft);border-color:var(--warn)}
.lt:disabled{cursor:default;opacity:.45}
.slot{min-height:70px;border:2px dashed var(--line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;direction:ltr}
.slot.right{border-color:var(--ok);background:var(--ok-soft)}.slot.wrong{border-color:var(--warn);background:var(--warn-soft)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.bucket{border:2px dashed var(--line);border-radius:16px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:6px;background:var(--surface);text-align:center}
.bucket.target{border-color:var(--accent);background:var(--accent-soft)}
.bucket h5{margin:0;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;direction:ltr}
.chip{font-family:var(--en);font-size:18px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:4px 12px;min-height:44px}
.chip.sel{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.chip.right{background:var(--ok-soft);border-color:var(--ok)}.chip.wrong{background:var(--warn-soft);border-color:var(--warn)}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.memg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mem{min-height:96px;border-radius:16px;border:2px solid var(--line);background:var(--ink);color:var(--bg);font-weight:700;font-size:17px;padding:6px}
.mem.up{background:var(--surface);color:var(--ink)}.mem.got{background:var(--ok-soft);color:var(--ink);border-color:var(--ok)}
.mem .en{font-size:20px}
.hunt{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.input{font-family:var(--en);font-size:28px;font-weight:700;padding:8px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%;max-width:420px;direction:ltr}
.mic{border:0;border-radius:16px;padding:10px 22px;min-height:56px;font-weight:700;display:inline-flex;align-items:center;gap:8px;background:var(--warn-soft);color:var(--ink)}
.mic.live{background:var(--warn);color:#fff}
.mic svg,.btn svg{width:22px;height:22px}
.note{font-size:14.5px;color:var(--ink-2);margin:0}
.timer{font-family:var(--en);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.toast{position:fixed;inset:auto 0 0;margin:0 auto;max-width:520px;background:var(--ink);color:var(--bg);border-radius:16px 16px 0 0;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:600;z-index:20}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav dir="rtl" aria-label="التنقل في منصة كلماتي" style="max-width:1180px;margin:0 auto;padding:16px;box-sizing:border-box;font-family:var(--ar);"><a href="./" style="display:inline-flex;align-items:center;min-height:44px;padding:6px 18px;border:2px solid var(--accent);border-radius:12px;color:var(--accent);background:var(--surface);text-decoration:none;font-weight:700;">→ العودة إلى كلماتي</a></nav>


<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">Ab</div>
      <div>
        <h1>مفتاح القراءة الإنجليزية</h1>
        <p>قواعد الـ Phonics بالعربي · نطق بريطاني · اضغطي أي كلمة لتسمعيها</p>
      </div>
    </div>
    <div class="prog" aria-label="تقدّمك">
      <div class="bar"><i id="progBar" style="width:0%"></i></div>
      <span id="progTxt">0 / 0 درس</span>
    </div>
  </header>
  <div class="grid">
    <nav class="rail" id="rail" aria-label="الدروس"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 010 6"/><path d="M18.5 6.5a7.5 7.5 0 010 11"/></svg>';

/* ---------- content: from the guide ---------- */
const PARTS=[
 {id:'start',ar:'البداية'},
 {id:'cons',ar:'الحروف الساكنة'},
 {id:'vow',ar:'حروف العلة'},
 {id:'long',ar:'الكلمات الطويلة'},
 {id:'me',ar:'لكِ أنتِ'}
];
const L=[
{id:'key',part:'start',ar:'مفتاح الأصوات',en:'The sound key',
 lead:'قبل القواعد: هذه الأصوات الإنجليزية التي لا توجد في العربية أو تختلف عنها. اضغطي كل كلمة واسمعيها، وكرّريها بصوت عالٍ. التقريب العربي للمساعدة فقط، والمرجع هو الأذن.',
 rules:[
  {t:'p — باء مهموسة',ipa:'/p/',ar:'پ',d:'نفخة هواء بلا اهتزاز. ضعي ورقة أمام فمك: تتحرك مع p ولا تتحرك مع b.',w:['[p]en','[p]ig','cu[p]','a[pp]le']},
  {t:'v — فاء مجهورة',ipa:'/v/',ar:'ڤ',d:'الأسنان العليا على الشفة السفلى مع اهتزاز في الحلق.',w:['[v]an','[v]ery','fi[v]e','lo[v]e']},
  {t:'g الصلبة',ipa:'/g/',ar:'گ',d:'مثل القاف الخليجية في «گال».',w:['[g]o','ba[g]','[g]ate','[g]reen']},
  {t:'ch — تش',ipa:'/tʃ/',ar:'تش',d:'تاء وشين معًا بسرعة.',w:['[ch]air','lun[ch]','ca[tch]','pic[t]ure']},
  {t:'ng — نون أنفية',ipa:'/ŋ/',ar:'نْ',d:'تنتهي الكلمة بالنون من الأنف، بلا گ بعدها: sing ليست «سينگ».',w:['si[ng]','lo[ng]','thi[n]k','ki[ng]']},
  {t:'th — ث أو ذ',ipa:'/θ/ /ð/',ar:'ث / ذ',d:'موجودان في العربية، فهذا سهل عليكِ.',w:['[th]ink','[th]ree','[th]is','mo[th]er']},
  {t:'s في vision',ipa:'/ʒ/',ar:'ژ',d:'جيم شامية ناعمة.',w:['vi[s]ion','televi[s]ion','u[s]ually']},
  {t:'schwa — أكثر صوت شيوعًا',ipa:'/ə/',ar:'ـَ خفيفة',d:'صوت قصير ضعيف بين الفتحة والكسرة، في المقاطع غير المنبورة.',w:['[a]bout','banan[a]','doct[or]','lem[o]n']}
 ],
 tip:'افتحي Cambridge Dictionary لأي كلمة: فيه زر النطق البريطاني UK ورموز IPA.',
 quiz:[
  {q:'أي حرف إنجليزي يُنطق «پ» بنفخة هواء؟',opts:['p','b'],a:0,why:'p مهموسة بنفخة، وb مجهورة بلا نفخة.'},
  {q:'كيف تنتهي كلمة sing؟',say:'sing',opts:['بنون أنفية فقط /ŋ/','بـ «نگ» /ŋg/'],a:0,why:'ng في آخر الكلمة نون أنفية بلا صوت g.'},
  {q:'أي صوت عربي يقابل th في think؟',say:'think',opts:['ث','ذ','س','ت'],a:0,why:'think /θɪŋk/ بالثاء، أما this فبالذال.'},
  {q:'ما أكثر صوت علة شيوعًا في الإنجليزية؟',opts:['schwa /ə/','/iː/ إي','/æ/'],a:0,why:'الـ schwa صوت المقاطع الضعيفة، مثل a في about.'}
 ]},

{id:'cg',part:'cons',ar:'متى c = س ومتى ك؟ وكذلك g',en:'Soft & hard C / G',rel:'c: 96–98% · g: 64%',
 lead:'القاعدة الذهبية: إذا جاء بعد c أو g أحد الحروف e أو i أو y صار الصوت «ليّنًا». أي حرف آخر، أو نهاية الكلمة، يبقي الصوت «صلبًا».',
 rules:[
  {t:'c + a, o, u أو ساكن',ipa:'/k/',ar:'ك',d:'الصوت الصلب.',w:['[c]at','[c]ot','[c]ut','[c]lap','pi[c]ture']},
  {t:'c + e, i, y',ipa:'/s/',ar:'س',d:'الصوت الليّن.',w:['[c]ent','[c]ity','[c]ycle','i[c]e','[c]ir[c]le']},

function pickVoices(){try{const vs=speechSynthesis.getVoices();enV=vs.find(v=>v.lang==='en-GB')||vs.find(v=>/^en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;arV=vs.find(v=>/^ar/i.test(v.lang))||null}catch(e){}}

let playingEl=null;
function speakSeq(parts,el){
  try{
    pickVoices();speechSynthesis.cancel();
    if(playingEl)playingEl.classList.remove('playing');
    playingEl=el||null;if(el)el.classList.add('playing');
    parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p.t);u.lang=p.ar?'ar-SA':'en-GB';const v=p.ar?arV:enV;if(v)u.voice=v;u.rate=p.ar?.95:.8;
      if(i===parts.length-1)u.onend=u.onerror=()=>{if(el)el.classList.remove('playing')};speechSynthesis.speak(u)});
    if(parts.some(p=>p.ar)&&!arV)toast('ما لقيت صوتًا عربيًّا في جهازك، فقد يُقرأ الشرح بلكنة غريبة. أضيفي صوتًا عربيًّا من إعدادات الجهاز (اللغة والكلام).');

}

/* parse "[c]ity" -> plain word + marked letter positions */
function parse(raw){
  const s=raw.replace(/\s*→.*$/,'');let p='',marks=[],pat='',inM=false;
  for(const ch of s){if(ch==='['){inM=true;continue}if(ch===']'){inM=false;continue}if(ch==='-')continue;if(inM){marks.push(p.length);pat+=ch}p+=ch}
  return {p:p.trim(),marks,pat};
}
function mkp(q,hide){let h='';for(let i=0;i<q.p.length;i++){const c=esc(q.p[i]);h+=q.marks.includes(i)?(hide?'<mark>_</mark>':'<mark>'+c+'</mark>'):c}return h.replace(/<\/mark><mark>/g,'')}
function labOf(r){if(r.ipa&&/^\/[^/]+\/$/.test(r.ipa.trim()))return (r.ar&&r.ar.length<=6?r.ar:r.t)+'  '+r.ipa;return r.t}
function wordBtn(w){const p=parse(w).p;return `<button class="w" data-say="${esc(p)}" aria-label="استمعي: ${esc(p)}">${mk(w)}${SPK}</button>`}
function pool(l){const out=[],seen={};(l.rules||[]).forEach((r,gi)=>{const lab=labOf(r);r.w.forEach(w=>{const q=parse(w);if(seen[q.p.toLowerCase()])return;seen[q.p.toLowerCase()]=1;q.raw=w;q.g=gi;q.lab=lab;q.r=r;q.word=/^[A-Za-z']+$/.test(q.p);out.push(q)})});return out}
function ruleSpeech(r){
  const parts=[{t:r.t.replace(/[‎\-]/g,' ')+'.',ar:1}];
  if(r.ar&&r.ar.length<=8)parts.push({t:'ويُنطق تقريبًا مثل: '+r.ar+'.',ar:1});
  if(r.d)parts.push({t:r.d,ar:1});
  parts.push({t:'أمثلة:',ar:1});
  r.w.forEach(w=>parts.push({t:parse(w).p}));
  return parts;
}
function howLine(r){
  if(r.ar&&r.ar.length<=8&&/^\//.test((r.ipa||'').trim()))return `كيف تقرئينها: الجزء الملوّن في كل مثال يُنطق «${esc(r.ar)}» ورمزه <span class="en">${esc(r.ipa)}</span>.`;
  return '';
}

  h+=`</div>`;

  return h;
}

function misspell(w){
  const res={};const vowels='aeiou';let guard=0;
  while(Object.keys(res).length<3&&guard<200){guard++;
    const a=w.split('');const t=Math.floor(Math.random()*4);const i=1+Math.floor(Math.random()*(a.length-1));
    if(t===0&&i<a.length-1){[a[i],a[i+1]]=[a[i+1],a[i]]}else if(t===1&&a.length>3){a.splice(i,1)}else if(t===2){a.splice(i,0,a[i])}
    else{const ix=[];for(let k=1;k<a.length;k++)if(vowels.includes(a[k]))ix.push(k);if(ix.length){const p=pick(ix);const nv=vowels.replace(a[p],'');a[p]=pick(nv.split(''))}}
    const v=a.join('');if(v.toLowerCase()!==w.toLowerCase())res[v]=1}
  return Object.keys(res).slice(0,3);
}
function labsWith(P,min){const c={};P.forEach(q=>{c[q.lab]=(c[q.lab]||0)+1});return Object.keys(c).filter(k=>c[k]>=min)}
function distinctByLab(P,n){const by={};shuffle(P).forEach(q=>{if(!by[q.lab])by[q.lab]=q});return shuffle(Object.values(by)).slice(0,n)}
function choiceRound(o){return Object.assign({kind:'choice'},o)}

function buildGame(gid,l){
  const P=pool(l);const W=P.filter(q=>q.word);const M=P.filter(q=>q.marks.length&&q.pat.length<q.p.length);const labs=uniq(P.map(q=>q.lab));
  const n=k=>Math.min(k,6);
  switch(gid){
  case 'listen':{if(W.length<3)return null;return shuffle(W).slice(0,n(W.length)).map(q=>choiceRound({prompt:'اسمعي، ثم اختاري الكلمة اللي سمعتيها',say:q.p,q,opts:shuffle([q,...shuffle(W.filter(x=>x!==q)).slice(0,3)]).map(x=>({label:x.p,val:x.p,en:1})),ans:q.p}))}
  case 'sound':{const Mm=P.filter(q=>q.marks.length);if(labs.length<2||Mm.length<3)return null;return shuffle(Mm).slice(0,6).map(q=>choiceRound({prompt:'كيف يُنطق الجزء الملوّن؟ (أو: أي قاعدة تنطبق؟)',show:mkp(q),say:q.p,q,opts:shuffle(uniq([q.lab,...shuffle(labs.filter(x=>x!==q.lab)).slice(0,3)])).map(x=>({label:x,val:x})),ans:q.lab}))}
  case 'tf':{if(labs.length<2)return null;return shuffle(P).slice(0,6).map(q=>{const t=Math.random()<.5;const lab=t?q.lab:pick(labs.filter(x=>x!==q.lab));return choiceRound({prompt:'هل هذه القاعدة تنطبق على الكلمة؟',show:mkp(q),say:q.p,claim:lab,q,opts:[{label:'صح',val:'T'},{label:'خطأ',val:'F'}],ans:t?'T':'F'})})}
  case 'missing':{const pats=uniq(M.filter(q=>q.word).map(q=>q.pat.toLowerCase()));const Mw=M.filter(q=>q.word);if(Mw.length<3||pats.length<2)return null;return shuffle(Mw).slice(0,6).map(q=>{const others=shuffle(pats.filter(x=>x!==q.pat.toLowerCase())).slice(0,3);while(others.length<3){const f=pick('aeiou').repeat(q.pat.length);if(f!==q.pat&&!others.includes(f))others.push(f);else break}return choiceRound({prompt:'أي حروف تكمّل الكلمة؟ اسمعيها لو احتجتي',show:mkp(q,true),say:q.p,q,opts:shuffle([q.pat.toLowerCase(),...others]).map(x=>({label:x,val:x,en:1})),ans:q.pat.toLowerCase()})})}
  case 'tap':{const T=M.filter(q=>q.word&&q.p.length<=11);if(T.length<3)return null;return shuffle(T).slice(0,5).map(q=>({kind:'tap',q,sel:[]}))}
  case 'odd':{const big=labsWith(P,3);if(!big.length||labs.length<2)return null;const rs=[];for(let k=0;k<5;k++){const lab=pick(big);const same=shuffle(P.filter(q=>q.lab===lab)).slice(0,3);const odd=pick(P.filter(q=>q.lab!==lab));rs.push(choiceRound({prompt:'أي كلمة لا تتبع نفس قاعدة الباقي؟',say:null,q:odd,group:lab,opts:shuffle([...same,odd]).map(x=>({label:x.p,val:x.p,en:1,html:mkp(x)})),ans:odd.p}))}return rs}
  case 'match':{const items=distinctByLab(P,5);if(items.length<3)return null;return [{kind:'match',items,left:shuffle(items.map((x,i)=>i)),right:shuffle(items.map((x,i)=>i)),sl:null,got:[],bad:null,miss:0}]}
  case 'memory':{const items=distinctByLab(P,6);if(items.length<3)return null;const cards=[];items.forEach((q,i)=>{cards.push({i,f:'w'});cards.push({i,f:'l'})});return [{kind:'memory',items,cards:shuffle(cards),up:[],got:[],moves:0,lock:false}]}
  case 'sort':{const ls=shuffle(labsWith(P,2)).slice(0,3);if(ls.length<2)return null;const items=shuffle(ls.flatMap(lb=>shuffle(P.filter(q=>q.lab===lb)).slice(0,3)));return [{kind:'sort',labs:ls,items,place:items.map(()=>null),sel:null,checked:false}]}
  case 'scramble':{const S2=W.filter(q=>q.p.length>=3&&q.p.length<=10);if(S2.length<3)return null;return shuffle(S2).slice(0,5).map(q=>{const L2=q.p.toLowerCase().split('');let t=shuffle(L2),g=0;while(t.join('')===L2.join('')&&g++<10)t=shuffle(L2);return {kind:'build',q,tiles:t,built:[]}})}
  case 'dict':{if(W.length<3)return null;return shuffle(W).slice(0,5).map(q=>({kind:'type',q}))}
  case 'spell':{const S3=W.filter(q=>q.p.length>=4);if(S3.length<3)return null;return shuffle(S3).slice(0,5).map(q=>choiceRound({prompt:'اسمعي، ثم اختاري التهجئة الصحيحة',say:q.p,q,opts:shuffle([q.p,...misspell(q.p)]).map(x=>({label:x,val:x,en:1})),ans:q.p}))}
  case 'hunt':{const big=labsWith(P,2);if(!big.length||labs.length<2)return null;const rs=[];shuffle(big).slice(0,3).forEach(lab=>{const yes=P.filter(q=>q.lab===lab).slice(0,4);const no=shuffle(P.filter(q=>q.lab!==lab)).slice(0,Math.max(4,9-yes.length));rs.push({kind:'hunt',lab,r:yes[0].r,grid:shuffle([...yes,...no]),sel:[],checked:false})});return rs}
  case 'speed':{if(labs.length<2)return null;return 'speed'}
  case 'speak':{if(!W.length)return null;return shuffle(W).slice(0,5).map(q=>({kind:'speak',q,status:'idle',heard:''}))}
  }

}
function speedRound(l){const P=pool(l);const labs=uniq(P.map(q=>q.lab));const q=pick(P);return choiceRound({prompt:'أي قاعدة؟',show:mkp(q),say:null,q,opts:shuffle(uniq([q.lab,...shuffle(labs.filter(x=>x!==q.lab)).slice(0,3)])).map(x=>({label:x,val:x})),ans:q.lab})}

/* ---------- speech recognition ---------- */
function listen(){
  const g=S.game;const r=g.rounds[g.i];const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){r.status='blocked';drawGame();return}
  try{
    const rec=new R();rec.lang='en-GB';rec.interimResults=false;rec.maxAlternatives=5;r.status='live';drawGame();
    const norm=s=>s.toLowerCase().replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();
    rec.onresult=ev=>{const alts=[];for(let k=0;k<ev.results[0].length;k++)alts.push(norm(ev.results[0][k].transcript));const t=norm(r.q.p);const ok=alts.some(a=>a===t||(' '+a+' ').includes(' '+t+' '));r.heard=alts[0]||'';if(ok){r.status='ok';resolveRound(true)}else r.status='no';drawGame()};
    rec.onerror=e=>{r.status=(e.error==='no-speech')?'no':'blocked';drawGame()};
    rec.onend=()=>{if(r.status==='live'){r.status='no';drawGame()}};
    rec.start();
  }catch(e){r.status='blocked';drawGame()}
}

/* ---------- final test ---------- */
function buildFinal(){let pool2=[];L.forEach(l=>{if(l.quiz)l.quiz.forEach(q=>pool2.push(Object.assign({from:l.ar},q)))});return {lid:'final',qs:shuffle(pool2).slice(0,15).map(q=>Object.assign({},q,{order:shuffle(q.opts.map((o,i)=>i))})),i:0,picked:null,score:0,done:false}}
function renderFinal(){$('#main').innerHTML=`<section class="card hero"><span class="eyebrow">مراجعة</span><h2>الاختبار الشامل</h2><p class="lead">15 سؤالًا عشوائيًّا من كل الدروس. بعد كل سؤال يظهر الدرس الذي جاء منه.</p></section><section class="card prac"><div id="qbox">${quizHTML(S.final,true)}</div></section>`}
function render(){renderRail();if(S.final)renderFinal();else renderLesson()}
function scrollToTop(){try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){}}

/* ---------- events ---------- */
document.addEventListener('input',e=>{if(e.target.id==='dictIn'&&S.game){S.game.rounds[S.game.i].typed=e.target.value}});
document.addEventListener('keydown',e=>{if(e.target.id==='dictIn'&&e.key==='Enter'){e.preventDefault();const b=document.querySelector('[data-act="typecheck"]');if(b)b.click()}});
document.addEventListener('click',e=>{
  const b=e.target.closest('button,input');if(!b)return;const d=b.dataset;
  if(d.say){say(d.say,b.classList.contains('w')||b.classList.contains('voice')?b:null);return}
  if(d.rsay!==undefined){const r=lessonById(S.cur).rules[+d.rsay];speakSeq(ruleSpeech(r),b);return}
  if(d.lessonSay){const l=lessonById(S.cur);speakSeq([{t:l.ar+'.',ar:1},{t:l.lead,ar:1}].concat(l.tip?[{t:'نصيحة: '+l.tip,ar:1}]:[]),b);return}
  if(d.ruleSay){const g=S.game;const r=g.rounds[g.i];const rule=r.q?r.q.r:r.r;if(rule)speakSeq(ruleSpeech(rule),b);return}
  if(d.go){stopTimer();S.cur=d.go;S.final=null;S.quiz=null;S.game=null;S.view='learn';store.set('ph_cur',S.cur);render();scrollToTop();return}
  if(d.final){stopTimer();S.game=null;S.final=buildFinal();render();scrollToTop();return}
  if(d.view){stopTimer();S.view=d.view;S.game=null;render();return}
  if(d.game){startGame(d.game);return}
  if(d.wk!==undefined){S.plan[d.wk]=b.checked;store.set('ph_plan',S.plan);return}
  const g=S.game;const r=g&&!g.done?g.rounds[g.i]:null;
  if(d.ch!==undefined&&r&&g.picked===null){const o=r.opts[+d.ch];g.picked=o.val;resolveRound(o.val===r.ans);if(g.speed){drawGame();setTimeout(nextRound,450)}else drawGame();return}
  if(d.lt!==undefined&&r){const i=+d.lt;r.sel=r.sel.includes(i)?r.sel.filter(x=>x!==i):r.sel.concat(i);drawGame();return}
  if(d.tile!==undefined&&r){r.built.push(+d.tile);if(r.built.length===r.tiles.length){resolveRound(r.built.map(t=>r.tiles[t]).join('')===r.q.p.toLowerCase())}drawGame();return}
  if(d.unb!==undefined&&r){r.built.splice(+d.unb,1);drawGame();return}
  if(d.si!==undefined&&r){r.sel=+d.si;drawGame();return}
  if(d.bk!==undefined&&r&&r.sel!==null&&!r.checked){r.place[r.sel]=+d.bk;r.sel=null;drawGame();return}
  if(d.ml!==undefined&&r){r.sl=+d.ml;r.bad=null;drawGame();return}
  if(d.mr!==undefined&&r&&r.sl!==null){const i=+d.mr;if(r.items[i].lab===r.items[r.sl].lab){r.got.push(r.sl);if(i!==r.sl)r.got.push(i);say(r.items[r.sl].p);r.sl=null;r.bad=null;if(r.got.length>=r.items.length){const n=r.items.length;resolveRound(true,Math.max(0,n-r.miss),n);nextRound();return}}else{r.miss++;r.bad=[r.sl,i];r.sl=null}drawGame();return}
  if(d.mem!==undefined&&r&&!r.lock){const k=+d.mem;if(r.up.includes(k))return;r.up.push(k);const c=r.cards[k];if(c.f==='w')say(r.items[c.i].p);if(r.up.length===2){r.moves++;const[a,b2]=r.up.map(x=>r.cards[x]);if(a.i===b2.i){r.got.push(a.i);r.up=[];if(r.got.length===r.items.length){const n=r.items.length;resolveRound(true,n,Math.max(n,r.moves));nextRound();return}}else{r.lock=true;setTimeout(()=>{r.up=[];r.lock=false;drawGame()},1000)}}drawGame();return}
  if(d.hu!==undefined&&r){const k=+d.hu;r.sel=r.sel.includes(k)?r.sel.filter(x=>x!==k):r.sel.concat(k);drawGame();return}
  const act=d.act;
  if(act==='tapcheck'&&r){const a=r.sel.slice().sort((x,y)=>x-y).join(),t=r.q.marks.slice().sort((x,y)=>x-y).join();resolveRound(a===t);drawGame();return}
  if(act==='typecheck'&&r){const v=(document.getElementById('dictIn')||{}).value||'';r.typed=v;resolveRound(v.trim().toLowerCase()===r.q.p.toLowerCase());drawGame();return}
  if(act==='sortcheck'&&r){r.checked=true;const ok=r.items.filter((q,k)=>r.labs[r.place[k]]===q.lab).length;resolveRound(ok===r.items.length,ok,r.items.length);drawGame();return}
  if(act==='huntcheck'&&r){r.checked=true;const want=r.grid.map((q,k)=>q.lab===r.lab?k:-1).filter(k=>k>=0).join();resolveRound(r.sel.slice().sort((x,y)=>x-y).join()===want);drawGame();return}
  if(act==='mic'&&r){listen();return}
  if(act==='selfok'&&r){r.status='self';resolveRound(true);drawGame();return}
  if(act==='selfno'&&r){r.status='self';resolveRound(false);drawGame();return}
  if(act==='gnext'){nextRound();return}
  if(act==='replay'&&g){startGame(g.id);return}
  if(act==='games'){stopTimer();S.game=null;S.view='games';render();return}
  const Q=S.final||S.quiz;
  if(d.pick!==undefined&&Q&&Q.picked===null){const k=+d.pick;Q.picked=k;const q=Q.qs[Q.i];if(k===q.a){Q.score++;if(q.say)say(q.say)}redrawQuiz();return}
  if(act==='qnext'&&Q){if(Q.i+1>=Q.qs.length){Q.done=true;if(!S.final&&Q.score/Q.qs.length>=.6){S.done[S.cur]=true;store.set('ph_done',S.done);renderRail()}}else{Q.i++;Q.picked=null}redrawQuiz();return}
  if(act==='retry'){if(S.final)S.final=buildFinal();else S.quiz=buildQuiz(lessonById(S.cur));redrawQuiz();return}
  if(act==='toggleDone'){S.done[S.cur]=!S.done[S.cur];store.set('ph_done',S.done);render();return}
});
function redrawQuiz(){const box=$('#qbox');if(box)box.innerHTML=quizHTML(S.final||S.quiz,!!S.final)}
render();
</script>
