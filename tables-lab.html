<!doctype html><html lang="ar" dir="rtl"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><nav aria-label="التنقل" style="max-width:1120px;margin:16px auto"><a href="./index.html" style="color:var(--accent);font-weight:700;text-decoration:underline">← العودة إلى كلماتي</a></nav>
<title>مختبر الجداول</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap">
<style>
/* Layout: a data lab. Graph-paper ground, bright data colours, white report sheets; each table is a mission. */
:root{
 --bg:#F3F6FB; --surface:#FFFFFF; --sheet:#FAFCFF; --ink:#1C2340; --muted:#5E6684; --line:#E2E7F2;
 --accent:#11808F; --accent-ink:#FFFFFF; --accent-soft:#DDF3F3; --sky:#E6F1FF; --sky-ink:#1F5FA8;
 --mark:#FFE58A; --mark-ink:#5B4300; --ok:#1FA971; --ok-soft:#DDF7EA; --bad:#E5533D; --bad-soft:#FFE6E1; --gold:#F2A900;
 --coral:#FF6F61; --sun:#FFB938; --mint:#2EC4A0; --skyc:#4D9CFF; --grape:#8C6CF0; --rose:#F25C9A;
 --hero1:#0D6E7D; --hero2:#1E9E9A; --hero3:#55C6A9;
 --shadow:rgba(28,35,64,.08);
 --ui:"Readex Pro","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
 --read:"Literata",Georgia,"Times New Roman",serif;
 --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#10162A; --surface:#182037; --sheet:#1B2440; --ink:#E9ECF7; --muted:#A3ABC6; --line:#2A3452;
 --accent:#4FD1C5; --accent-ink:#06201F; --accent-soft:#173A40; --sky:#182D4A; --sky-ink:#A9CBFF;
 --mark:#6B5612; --mark-ink:#FFE9A6; --ok:#4FD69A; --ok-soft:#14352A; --bad:#FF8A76; --bad-soft:#3F211D; --gold:#FFC94D;
 --coral:#FF8A7E; --sun:#FFC85C; --mint:#4FD8B6; --skyc:#73B2FF; --grape:#A994FF; --rose:#FF7DB2;
 --hero1:#0B4E5A; --hero2:#137A78; --hero3:#2E9C86;
 --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#10162A; --surface:#182037; --sheet:#1B2440; --ink:#E9ECF7; --muted:#A3ABC6; --line:#2A3452;
 --accent:#4FD1C5; --accent-ink:#06201F; --accent-soft:#173A40; --sky:#182D4A; --sky-ink:#A9CBFF;
 --mark:#6B5612; --mark-ink:#FFE9A6; --ok:#4FD69A; --ok-soft:#14352A; --bad:#FF8A76; --bad-soft:#3F211D; --gold:#FFC94D;
 --coral:#FF8A7E; --sun:#FFC85C; --mint:#4FD8B6; --skyc:#73B2FF; --grape:#A994FF; --rose:#FF7DB2;
 --hero1:#0B4E5A; --hero2:#137A78; --hero3:#2E9C86;
 --shadow:rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.7;margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
.en{direction:ltr;unicode-bidi:isolate;text-align:left}
.muted{color:var(--muted)}
.small{font-size:13.5px}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.5px}
.brand h1{font-size:19px;font-weight:600}
.brand p{font-size:12.5px;color:var(--muted)}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13.5px;white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px;align-self:flex-start;max-width:100%}
.tab{flex:0 0 auto;border:0;background:none;border-radius:999px;padding:7px 16px;font-size:14.5px;color:var(--muted)}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 4px 14px var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 16px;font-size:14.5px;font-weight:500}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:3px 9px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.icon-btn svg{width:15px;height:15px}
.btn svg{width:16px;height:16px;vertical-align:-3px;margin-inline-end:4px}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;background:var(--accent-soft);color:var(--ink)}
.eyebrow{font-size:12.5px;letter-spacing:.6px;color:var(--accent);font-weight:600}
/* plan */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.hero .today h2{font-size:24px}
.today .meta{display:flex;gap:8px;flex-wrap:wrap}
.meter{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:6px}
.steps5{display:flex;gap:6px;flex-wrap:wrap}
.steps5 span{font-size:12.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps5 span.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.week{display:flex;flex-direction:column;gap:8px}
.week h3{font-size:15px;color:var(--muted);font-weight:500}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.dtile{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.dtile:hover{border-color:var(--accent)}
.dtile .n{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.dtile .t{font-family:var(--read);font-size:15px;direction:ltr;text-align:left;line-height:1.35;min-height:2.7em}
.dtile.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.star{color:var(--gold);font-size:15px}
/* day */
.dayhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.dayhead h2{font-family:var(--read);font-size:27px;font-weight:600;direction:ltr;text-align:left}
.stepbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.stepbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 13px;font-size:14px;display:flex;gap:7px;align-items:center}
.stepbtn .k{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:12px;font-variant-numeric:tabular-nums}
.stepbtn.done .k{background:var(--ok);color:#fff}
.stepbtn[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
/* words */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.wcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--sheet);display:flex;flex-direction:column;gap:6px;min-width:0}
.wcard .w{font-family:var(--read);font-size:19px;font-weight:600;direction:ltr;text-align:left}
.wcard .ar{font-size:16px;font-weight:500;color:var(--accent)}
.wcard .def,.wcard .ex{font-family:var(--read);font-size:14.5px;direction:ltr;text-align:left}
.wcard .ex{color:var(--muted);font-style:italic}
.wcard.known{border-color:var(--ok);background:var(--ok-soft)}
/* reader */
.reader{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px clamp(16px,4vw,40px);font-family:var(--read);direction:ltr;text-align:left;font-size:var(--fs,18px);line-height:1.8}
.reader h3{font-family:var(--read);font-size:1.35em;text-align:center;margin-bottom:6px}
.reader .intro{font-style:italic;color:var(--muted);text-align:center;margin-bottom:14px}
.para{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;margin-bottom:16px}
.para .lab{font-family:var(--ui);font-weight:700;color:var(--accent);font-size:15px;padding-top:4px}
.para .ptools{display:flex;gap:6px;margin-top:6px;font-family:var(--ui);direction:rtl;justify-content:flex-end}
.para .tr{font-family:var(--ui);direction:rtl;text-align:right;background:var(--sky);color:var(--ink);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:15px;line-height:1.8}
.foot{font-size:.8em;color:var(--muted)}
.w{cursor:pointer;border-radius:3px}
.w:hover{background:var(--accent-soft)}
.w.wl{border-bottom:2px solid var(--accent)}
.hl{background:var(--mark);color:var(--mark-ink);border-radius:3px;box-shadow:0 0 0 2px var(--mark)}
.fsz{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fsz button{border:0;background:var(--sheet);padding:3px 10px;font-size:13px}
/* test */
.testgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.testgrid .reader{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 30px);overflow:auto;font-size:16px}
.pane-switch{display:none}
.qgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.qhead{font-weight:600;font-size:15px}
.instr{font-family:var(--read);direction:ltr;text-align:left;font-size:14.5px;color:var(--muted);font-style:italic}
.hint{font-size:13.5px;background:var(--sky);color:var(--sky-ink);border-radius:10px;padding:8px 12px}
.optbox{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;background:var(--sheet)}
.optbox h5{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:500}
.optbox ol{list-style:none;margin:0;padding:0;direction:ltr;text-align:left;font-family:var(--read);font-size:14.5px;display:grid;gap:3px}
.optbox li b{display:inline-block;min-width:34px;color:var(--accent);font-family:var(--ui)}
.optbox.cols ol{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.qitem{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0}
.qn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--sheet)}
.qn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.qn.no{background:var(--bad);border-color:var(--bad);color:#fff}
.qt{font-family:var(--read);direction:ltr;text-align:left;font-size:15.5px}
.choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;direction:ltr}
.choice{border:1.5px solid var(--line);background:var(--sheet);border-radius:9px;padding:4px 11px;font-size:14px;text-align:left}
.choice.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choices.col{flex-direction:column;align-items:stretch}
.choices.col .choice{font-family:var(--read);font-size:14.5px}
.choice b{font-family:var(--ui);color:var(--accent);margin-right:6px}
.gapin{font:inherit;font-family:var(--ui);font-size:14.5px;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:1px 6px;width:9.5em;max-width:100%;color:var(--ink);direction:ltr}
.gapin.ok{border-color:var(--ok);background:var(--ok-soft)}
.gapin.no{border-color:var(--bad);background:var(--bad-soft)}
.gapsel{font:inherit;font-size:14px;border:1.5px solid var(--accent);border-radius:7px;background:var(--accent-soft);color:var(--ink);padding:1px 4px;max-width:100%}
.gnum{font-family:var(--ui);font-weight:700;font-size:12px;background:var(--ink);color:var(--surface);border-radius:5px;padding:0 5px;margin-right:4px}
.ctx{font-family:var(--read);direction:ltr;text-align:left;font-size:15.5px;line-height:2.1}
.ctitle{font-family:var(--read);font-weight:600;text-align:center;direction:ltr}
.flow{display:flex;flex-direction:column;align-items:center;gap:0}
.flow .box{border:1.5px solid var(--ink);border-radius:8px;padding:6px 12px;background:var(--sheet);max-width:560px;width:100%;text-align:center;font-family:var(--read);direction:ltr;font-size:15px;line-height:2}
.flow .arr{height:20px;width:2px;background:var(--ink);position:relative;margin-bottom:6px}
.flow .arr::after{content:"";position:absolute;bottom:-6px;left:-5px;border:6px solid transparent;border-top-color:var(--ink)}
.notes{display:flex;flex-direction:column;gap:4px;font-family:var(--read);direction:ltr;text-align:left;font-size:15px;line-height:2}
.tablewrap{overflow-x:auto}
table.qt2{border-collapse:collapse;direction:ltr;font-family:var(--read);font-size:14.5px;min-width:520px;width:100%}
table.qt2 th,table.qt2 td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left;line-height:2}
table.qt2 th{background:var(--accent-soft)}
.diagram{max-width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
.verdict{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;margin-top:6px}
.verdict .ans{font-family:var(--read);direction:ltr}
.expl{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.expl .src{font-family:var(--read);direction:ltr;text-align:left;font-size:14px}
.expl .k{font-weight:600;color:var(--accent);font-size:12.5px}
.ai{background:var(--sky);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.9}
.score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.score .big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.band{border:2px solid var(--accent);border-radius:12px;padding:4px 14px;text-align:center}
.band b{display:block;font-size:24px;line-height:1.2}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.sheetbar{display:flex;flex-wrap:wrap;gap:4px}
.sheetbar span{width:28px;height:28px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.sheetbar span.f{border-color:var(--accent);background:var(--accent-soft)}
.sheetbar span.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.sheetbar span.no{background:var(--bad);border-color:var(--bad);color:#fff}
/* games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.game{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:start;display:flex;flex-direction:column;gap:4px;min-width:0}
.game:hover{border-color:var(--accent)}
.game h4{font-size:15.5px}
.game p{font-size:13px;color:var(--muted);line-height:1.6}
.game .gb{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.game .best{color:var(--ok);font-weight:600}
.play{display:flex;flex-direction:column;gap:14px}
.prompt{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:16px}
.prompt .big{font-family:var(--read);font-size:26px;font-weight:600;direction:ltr;text-align:center}
.prompt .sent{font-family:var(--read);direction:ltr;text-align:left;font-size:17px;line-height:1.9}
.blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;text-align:center;min-width:0}
.opt.en{font-family:var(--read);direction:ltr}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-size:14.5px}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.flip{min-height:150px;display:grid;place-items:center;text-align:center;cursor:pointer}
.tiles{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.tile{border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;padding:4px 10px;font-family:var(--read);font-size:15.5px}
.tile:disabled{opacity:.3}
.slot{min-height:46px;border:1.5px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.order{display:flex;flex-direction:column;gap:6px}
.order button{text-align:left;direction:ltr;font-family:var(--read);font-size:14.5px;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 10px;display:flex;gap:8px}
.order button .o{font-family:var(--ui);min-width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px}
.order button.picked .o{background:var(--accent);color:var(--accent-ink)}
.input{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--sheet);color:var(--ink);width:100%}
.input.en{font-family:var(--read)}
.diff span{border-radius:4px;padding:0 2px}
.ldiff .miss{color:var(--bad);text-decoration:underline 3px;background:none}
.ldiff .okw{color:var(--ok)}
.diff .miss{background:var(--bad-soft);color:var(--bad)}
.diff .okw{background:var(--ok-soft)}
/* mastery */
.mbadge{display:flex;gap:12px;align-items:center}
.mbadge .medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;background:var(--accent-soft);color:var(--accent);border:2px solid var(--accent)}
.mbadge .medal.gold{background:var(--mark);color:var(--mark-ink);border-color:var(--gold)}
/* sheet popup */
.wsheet{position:fixed;inset:auto 0 0 0;z-index:30;display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.wsheet>div{width:100%;max-width:600px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px var(--shadow);padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px;max-height:75vh;overflow:auto}
.wsheet .ww{font-family:var(--read);font-size:26px;font-weight:600;direction:ltr}
.wsheet .war{font-size:20px;font-weight:600;color:var(--accent)}

 model:['The chart illustrates when people in five different jobs sleep during a typical 24-hour period, according to a Canadian study.',

{id:6,ar:'وقت الفراغ حسب العمر',topic:'حياة يومية',kind:'compare',

 ov:['Overall, watching TV was the main leisure activity for every age group, and as people got older they spent less time on group activities and more on small-group or solo ones.','Overall, teenagers watched 1,200 hours of TV and people in their 20s watched 700 hours.','Overall, older people spent more time on group sports than younger people.'],
 model:['The table shows how many hours per year people of different ages in Someland spend on six leisure activities.',
 'Overall, watching TV and videos was by far the most popular pastime for all age groups. As people get older, they tend to move away from group activities towards smaller social gatherings and individual pursuits.',
 'Teenagers and people over seventy spent the most time in front of a screen, at 1,200 and 1,100 hours respectively, while those in their thirties watched the least, at 400 hours. Cinema followed a similar U-shaped pattern, falling from 100 hours for teenagers to just 25 hours in middle age, before rising slightly again.',
 'Group activities declined sharply with age. Socialising in large groups dropped from 350 hours for teenagers and people in their twenties to only 25 hours from the age of fifty, and group sport fell from 450 hours to zero for the over-sixties. In contrast, socialising with four or fewer people peaked at 300 hours among people in their thirties.'],
 err:[['Teenagers and people in their twenties spend on average 500 hours per year on socialising','Teenagers and people in their twenties spend 500 hours per year socialising','spend + وقت + فعل ing (spend time socialising) أوضح وأدق.'],['People of all ages spend a good part','People of all ages spend a large part','a good part تعبير غير أكاديمي، الأفضل a large/significant part.'],['and that teenagers and retired people spend a lot more time','and that teenagers and retired people spend far more time','a lot عامية شوي، far/considerably أكاديمية أكثر.']]},
{id:7,ar:'الإيجارات والرواتب في لندن',topic:'فلوس',kind:'compare',
 prompt:'The table below provides information on rental charges and salaries in three areas of London.',
 tables:[T('Weekly rents per property (£ per week)',['1 bed','2 bed','3 bed'],[['Notting Hill',375,485,738],['Regent’s Park',325,450,650],['Fulham',215,390,600]],'£'),T('Salaries needed (£ per year)',['1 bed','2 bed','3 bed'],[['Notting Hill',98500,127500,194000],['Regent’s Park',85500,118000,170500],['Fulham',56500,102500,157500]],'£')],
 ov:['Overall, Notting Hill was the most expensive area and Fulham the cheapest, and in all three areas both rents and the salaries required rose with the number of bedrooms.','Overall, a one-bedroom flat in Notting Hill cost £375 a week.','Overall, Fulham was the most expensive area in London.'],
 model:['The tables compare weekly rents for properties with one, two and three bedrooms in three areas of London, together with the annual salary a tenant would need to afford them.',
 'Overall, Notting Hill was the most expensive of the three areas and Fulham the least expensive. Unsurprisingly, rents and the necessary salaries increased with the size of the property in every area.',
 'In Notting Hill, weekly rents ranged from £375 for a one-bedroom property to £738 for three bedrooms, and a tenant would need to earn between £98,500 and £194,000 a year. Regent’s Park was slightly cheaper, with rents of £325 to £650 and required salaries of £85,500 to £170,500.',
 'Fulham was the most affordable option. A one-bedroom property cost only £215 per week, which required a salary of £56,500, little more than half of the equivalent figure in Notting Hill. However, the gap narrowed for larger properties: a three-bedroom home in Fulham cost £600 a week and required an income of £157,500.'],
 err:[['(salary approximately f 100,000)','(a salary of approximately £100,000)','علامة الجنيه £ مو f، وأدق: a salary of.'],['salaries need to be somewhere between £85,000 and £170,000','salaries would need to be between £56,500 and £157,500','الأرقام غلط! جدول Fulham يقول 56,500 إلى 157,500. دايم راجعي الأرقام.'],['Regent\'s Park might be a more suitable district','Regent’s Park offers mid-range prices','Task 1 وصف فقط، لا تعطين نصيحة أو رأي.']]},
{id:8,ar:'الأسر الفقيرة في أستراليا',topic:'مجتمع',kind:'compare',
 prompt:'The table below shows the proportion of different categories of families living in poverty in Australia in 1999.',
 tables:[T('Proportion of people from each household type living in poverty, 1999',['% in poverty','Number of people'],[['Single aged person',6,54000],['Aged couple',4,48000],['Single, no children',19,359000],['Couple, no children',7,211000],['Sole parent',21,232000],['Couple with children',12,933000],['All households',11,1837000]])],
 ov:['Overall, sole parents and single people without children were the most likely to be poor, while elderly households were the least affected; however, couples with children made up the largest number of poor people.','Overall, 6% of single aged people and 4% of aged couples lived in poverty.','Overall, elderly people were the group most affected by poverty.'],
 model:['The table shows the proportion of people in six types of Australian household who were living in poverty in 1999, along with the actual numbers.',
 'Overall, people in single-adult households without a partner, especially sole parents, were the most likely to be poor, while elderly people were the least likely. In total, 11% of all households, or 1,837,000 people, lived in poverty.',
 'Sole parents had the highest poverty rate, at 21%, closely followed by single people without children, at 19%. Couples with children had a lower rate of 12%, but because this is such a common household type, they accounted for the largest number of poor people, at 933,000.',
 'In contrast, older Australians were relatively well off. Only 6% of single aged people and 4% of aged couples lived in poverty, which amounted to around 100,000 people in total. Couples without children also had a low poverty rate of 7%, which corresponded to 211,000 people.'],
 err:[['most of the families who lived alone were reckoned the vast majority','families made up of single adults were the most likely to be poor','جملة معقّدة وغلط: reckoned وthe vast majority ما يناسبون هنا.'],['Aged couple was about a fifth, 4%, of the proportion of sole parents','The rate for aged couples (4%) was about a fifth of that for sole parents (21%)','لازم نقارن rate بـ rate ونذكر الرقمين.'],['around 50 thousands poor family','around 50,000 poor families','thousand بدون s بعد رقم، وfamilies جمع.']]},
{id:9,ar:'وفيات الكحول واستهلاك البيرة',topic:'صحة',kind:'compare',
 prompt:'The table below shows alcohol-related deaths in seven countries in 2005 and the average beer consumption per person.',
 tables:[T('Alcohol-related deaths 2005 and beer consumption per capita 2002',['Total deaths','Male','Female','Beer per capita (litres)'],[['Lithuania',125000,112000,13000,91],['Ireland',582000,413000,169000,104],['Czech Republic',1369000,900000,469000,132],['Canada',580000,505000,75000,86],['Estonia',383000,332000,51000,98],['Germany',1185000,986000,200000,107],['Austria',913000,783000,130000,106]])],
 ov:['Overall, men accounted for the vast majority of alcohol-related deaths in every country, and countries with higher beer consumption generally recorded more deaths, although the link was not perfect.','Overall, Lithuania had 125,000 deaths and Ireland had 582,000.','Overall, more women than men died from alcohol-related causes.'],
 model:['The table compares the number of alcohol-related deaths in seven countries in 2005, divided by gender, with the average amount of beer each person drank per year.',
 'Overall, men made up the great majority of deaths in all seven countries. There also appears to be a general link between beer consumption and alcohol-related deaths, although there are some exceptions.',
 'The Czech Republic had both the highest beer consumption, at 132 litres per person, and the highest number of deaths, at 1,369,000. Germany was second on both measures, with 107 litres and 1,185,000 deaths. Austria and Ireland, where people drank around 104–106 litres, also recorded high totals of 913,000 and 582,000 respectively.',
 'At the other end of the scale, Lithuania had the fewest deaths, at 125,000, with consumption of 91 litres. However, Canada had the lowest beer consumption of all (86 litres) but still recorded 580,000 deaths, far more than Estonia (383,000), where people drank 98 litres. Female deaths ranged from just 13,000 in Lithuania to 469,000 in the Czech Republic.'],
 err:[['and that caused the highest number of alcohol related death','and this country also had the highest number of alcohol-related deaths','الجدول ما يثبت إن البيرة «سبّبت» الوفيات، نقول correlation مو cause. وdeaths جمع.'],['more than 5000000 people died','more than 5 million people died','الأرقام الكبيرة اكتبيها بالكلمات أو بفواصل (5 million).'],['were much lesser than the male counterparts','was much lower than that of men','lesser للصفات المعنوية، مع الأرقام lower.']]},
{id:10,ar:'المسافرين في ٣ مطارات ألمانية',topic:'مواصلات',kind:'time',
 prompt:'The table below highlights data on the number of travellers using three major German airports between 2007 and 2012.',
 tables:[T('Airport visitors, 2007–2012 (millions of travellers per year)',['2007','2008','2009','2010','2011','2012'],[['Dusseldorf',27.2,36.4,48.2,37.1,33.2,45.6],['Frankfurt',36.5,41.9,44.4,47.3,51.1,69.3],['Berlin Tegel',17.3,26.6,39.9,43.3,43.3,43.3]],'million')],

 model:['The table shows the number of passengers, in millions, who used three major German airports each year from 2007 to 2012.',
 'Overall, all three airports were busier at the end of the period than at the beginning. Frankfurt grew steadily and remained the busiest airport for most of the period, whereas Dusseldorf fluctuated and Berlin Tegel levelled off.',
 'Frankfurt began with 36.5 million travellers in 2007 and its numbers rose every year, before jumping to 69.3 million in 2012, almost double the original figure. Berlin Tegel had the fewest passengers at the start, at 17.3 million, but this figure climbed rapidly to 43.3 million in 2010 and then remained unchanged.',
 'Dusseldorf showed the most irregular pattern. Its passenger numbers rose from 27.2 million to a peak of 48.2 million in 2009, briefly overtaking Frankfurt, before falling to 33.2 million in 2011. In the final year, however, it recovered strongly to 45.6 million.'],
 err:[['highest number of travelers used Frankfurt airport','the highest number of travellers used Frankfurt airport','لازم the قبل superlative (the highest).'],['Almost 10 millions more passengers','Almost 10 million more passengers','million بعد رقم بدون s.'],['the Frunkfurt airport','Frankfurt airport','انتبهي للتهجئة، وأسماء الأماكن بدون the غالبًا.']]}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
const fmtN=v=>v==null?'–':(typeof v==='number'?(Math.abs(v)>=1000?v.toLocaleString('en-US'):String(v)):String(v));

let P=store.get('t1_p',{m:{},xp:0,streak:0,last:'',reports:[]});
function MP(id){return P.m[id]||(P.m[id]={explore:0,ov:0,lab:null,order:0,err:null,wrote:0,draft:''})}
function save(){store.set('t1_p',P)}
const dkey=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
function addXP(n){const t=dkey(new Date()),y=dkey(new Date(Date.now()-864e5));if(P.last!==t){P.streak=P.last===y?P.streak+1:1;P.last=t}P.xp+=n;save();renderHud()}
const streakNow=()=>{const t=dkey(new Date()),y=dkey(new Date(Date.now()-864e5));return (P.last===t||P.last===y)?P.streak:0};
function starsOf(id){const m=MP(id);return (m.explore>=3?1:0)+((m.lab||0)>=80?1:0)+(m.wrote?1:0)}
const totalStars=()=>TASKS.reduce((a,t)=>a+starsOf(t.id),0);
const STEPS=[['explore','اكتشفي الجدول'],['ov','الصورة العامة'],['lab','مختبر الجمل'],['order','ركّبي التقرير'],['err','صيّادة الأخطاء'],['write','اكتبي تقريرك']];
function stepDone(id,k){const m=MP(id);return k==='explore'?m.explore>=3:k==='ov'?!!m.ov:k==='lab'?(m.lab!=null):k==='order'?!!m.order:k==='err'?(m.err!=null):!!m.wrote}
function currentM(){for(const t of TASKS)if(starsOf(t.id)<3)return t.id;return 20}

function chartSVG(t,sel){
 if(!sel)return '';const tb=t.tables[sel.ti];let labels,vals,title;
 if(sel.k==='r'){const r=tb.rows[sel.i];labels=tb.cols;vals=r.vals;title=r.name}else{labels=tb.rows.filter(r=>!isTotalRow(r.name)).map(r=>r.name);vals=tb.rows.filter(r=>!isTotalRow(r.name)).map(r=>r.vals[sel.i]);title=tb.cols[sel.i]}
 const n=labels.length,W=640,H=260,L=40,B=64,top=26;const max=Math.max(...vals.filter(v=>v!=null),1);const bw=(W-L-10)/n;

function missions(t){
 if(t.kind==='grid'){const g=t.grid;const tot=g.cols.map((_,c)=>g.asleep.reduce((a,r)=>a+r[c],0));const mx=Math.max(...tot),mn=Math.min(...tot);
  return [{q:'مين نام أكثر عدد ساعات؟ اضغطي على اسم المهنة',sleep:tot.map((v,i)=>v===mx?i:-1).filter(i=>i>=0)},{q:'مين نام أقل عدد ساعات؟',sleep:[tot.indexOf(mn)]},{q:'مين نام في النهار (بعد الظهر) بس؟ اضغطي على الأم أو السائق',sleep:[1,2]}]}
 const cells=numericCells(t).filter(c=>!isTotalRow(c.row));const out=[];
 const byCol={};cells.forEach(c=>{const k=c.ti+':'+c.ci;(byCol[k]=byCol[k]||[]).push(c)});
 const cols=shuffle(Object.values(byCol).filter(a=>a.length>=3));
 if(cols[0]){const a=cols[0];const mx=Math.max(...a.map(c=>c.v));out.push({q:`اضغطي على أكبر رقم في عمود «${a[0].col}»`,ans:a.filter(c=>c.v===mx).map(c=>c.ti+':'+c.ri+':'+c.ci)})}
 if(cols[1]||cols[0]){const a=cols[1]||cols[0];const mn=Math.min(...a.map(c=>c.v));out.push({q:`اضغطي على أصغر رقم في عمود «${a[0].col}»`,ans:a.filter(c=>c.v===mn).map(c=>c.ti+':'+c.ri+':'+c.ci)})}
 const all=cells;const gmx=Math.max(...all.map(c=>c.v));if(t.tables.length===1&&t.tables[0].cols.length>1&&t.kind!=='time')out.push({q:'وين أكبر رقم في الجدول كله؟',ans:all.filter(c=>c.v===gmx).map(c=>c.ti+':'+c.ri+':'+c.ci)});
 if(t.kind==='time'){const tb=t.tables[0];const rows=tb.rows.map((r,ri)=>{const v=r.vals.filter(x=>x!=null);return {ri,d:v.length>1?v[v.length-1]-v[0]:0,r}}).filter(x=>!isTotalRow(x.r.name));const up=rows.reduce((a,b)=>b.d>a.d?b:a);const dn=rows.reduce((a,b)=>b.d<a.d?b:a);
  out.push({q:'أي صف زاد أكثر من أول سنة لآخر سنة؟ اضغطي على أي رقم في هذا الصف',row:{ti:0,ri:up.ri}});if(dn.d<0)out.push({q:'أي صف نقص أكثر؟ اضغطي على أي رقم في صفه',row:{ti:0,ri:dn.ri}})}
 else{const tb=t.tables[0];if(tb.rows.length>=3){const c=Math.floor(Math.random()*tb.cols.length);const rr=tb.rows.map((r,ri)=>({ri,v:r.vals[c]})).filter(x=>x.v!=null&&!isTotalRow(tb.rows[x.ri].name));if(rr.length>=3){const s=rr.slice().sort((a,b)=>b.v-a.v)[1];out.push({q:`مين في المركز الثاني في «${tb.cols[c]}»؟ اضغطي على رقمه`,ans:[`0:${s.ri}:${c}`]})}}}
 if(out.length<4){const byRow={};cells.forEach(c=>{const k=c.ti+':'+c.ri;(byRow[k]=byRow[k]||[]).push(c)});shuffle(Object.values(byRow).filter(a=>a.length>=3)).slice(0,4-out.length).forEach((a,j)=>{const f=j%2?Math.min:Math.max;const v=f(...a.map(c=>c.v));out.push({q:`اضغطي على ${j%2?'أصغر':'أكبر'} رقم في صف «${a[0].row}»`,ans:a.filter(c=>c.v===v).map(c=>c.ti+':'+c.ri+':'+c.ci)})})}
 return out.slice(0,4)}
function labRounds(t){
 const R=[];
 if(t.kind==='grid'){const g=t.grid;const tot=g.cols.map((_,c)=>g.asleep.reduce((a,r)=>a+r[c],0));
  g.cols.forEach((c,i)=>R.push({s:`${c}s slept for a total of ___ hours.`,opts:shuffle([...new Set([tot[i],tot[i]+1,tot[i]-1,tot[i]+2])]).map(String),ans:String(tot[i])}));
  R.push({s:'Doctors slept ___ hours than students.',opts:['fewer','more','the same'],ans:'fewer'},{s:'Students slept in one block, ___ truck drivers slept at three different times.',opts:['whereas','because','so'],ans:'whereas'},{s:'Overall, the amount of sleep ___ depending on the occupation.',opts:['varied','remained stable','doubled'],ans:'varied'});return shuffle(R).slice(0,8)}
 const cells=numericCells(t).filter(c=>!isTotalRow(c.row));
 for(let k=0;k<3;k++){const c=pick(cells);const same=cells.filter(x=>x.ti===c.ti&&x.v!==c.v);const o=shuffle([...new Set(same.map(x=>showV(c.unit,x.v)))]).slice(0,3);R.push({s:`According to the table, the figure for ${c.row} (${c.col}) was ___.`,opts:shuffle([showV(c.unit,c.v),...o]),ans:showV(c.unit,c.v)})}
 for(let k=0;k<2;k++){const c=pick(cells);const d=cells.filter(x=>x.ti===c.ti&&x.ci===c.ci&&x.row!==c.row&&x.v!==c.v);if(!d.length)continue;const e=pick(d);R.push({s:`In terms of ${c.col}, ${c.row} (${showV(c.unit,c.v)}) was ___ than ${e.row} (${showV(e.unit,e.v)}).`,opts:['higher','lower'],ans:c.v>e.v?'higher':'lower'})}
 const tb=t.tables[0];const ci=Math.floor(Math.random()*tb.cols.length);const rr=tb.rows.filter(r=>r.vals[ci]!=null&&!isTotalRow(r.name));if(rr.length>=3){const top=rr.reduce((a,b)=>b.vals[ci]>a.vals[ci]?b:a);R.push({s:`___ had the highest figure for ${tb.cols[ci]}.`,opts:shuffle([top.name,...shuffle(rr.filter(r=>r!==top)).slice(0,3).map(r=>r.name)]),ans:top.name})}
 if(t.kind==='time'){shuffle(tb.rows.filter(r=>!isTotalRow(r.name))).slice(0,3).forEach(r=>{const idx=r.vals.map((v,i)=>v==null?-1:i).filter(i=>i>=0);if(idx.length<2)return;const a=r.vals[idx[0]],b=r.vals[idx[idx.length-1]];const ch=(b-a)/Math.abs(a||1);const verb=Math.abs(ch)<.03?'remained stable':ch>0?'rose':'fell';
   R.push({s:`${r.name} ___ from ${showV(tb.unit,a)} in ${tb.cols[idx[0]]} to ${showV(tb.unit,b)} in ${tb.cols[idx[idx.length-1]]}.`,opts:['rose','fell','remained stable'],ans:verb});
   if(verb!=='remained stable')R.push({s:`${r.name} ${verb==='rose'?'increased':'decreased'} ___ (from ${showV(tb.unit,a)} to ${showV(tb.unit,b)}).`,opts:['sharply','slightly'],ans:Math.abs(ch)>=.25?'sharply':'slightly',why:Math.abs(ch)>=.25?'التغيّر كبير (أكثر من ٢٥٪ تقريبًا) فنقول sharply.':'التغيّر بسيط فنقول slightly.'})})}
 return shuffle(R).slice(0,8)}

 const cmp=(txt.match(/\b(higher|lower|more|less|fewer|highest|lowest|largest|smallest|whereas|while|compared|contrast|than|twice|respectively)\b/gi)||[]).length;
 return [['١٥٠ كلمة أو أكثر ('+w+')',w>=150],['فيه Overview (Overall / In general)',/\b(overall|in general|it is clear that)\b/i.test(txt)],['استخدمتي ٥ أرقام من الجدول ('+hit+')',hit>=5],['٤ كلمات مقارنة أو أكثر ('+cmp+')',cmp>=4],['٣ فقرات أو أكثر',txt.split(/\n\s*\n/).filter(x=>x.trim()).length>=3],['بدون رأي شخصي (I think / I believe)',!/\bI (think|believe|feel)\b/i.test(txt)&&w>0]]}

 mean:()=>shuffle(LANG).slice(0,10).map(w=>ch({p:`<div class="big">${esc(w.e)}</div>`,opts:opt4(w.a,LANG.map(x=>x.a)),ans:w.a,say:w.e,why:`<b class="en">${esc(w.e)}</b> = ${esc(w.a)}<div class="en small" style="margin-top:4px">${esc(w.x)}</div>`})),
 shape:()=>shuffle(LANG.filter(w=>w.sh&&w.past&&['up','down','flat','fluct','peak','level','crash','dip','vee','jump'].includes(w.sh))).filter((w,i,a)=>a.findIndex(y=>y.sh===w.sh)===i).concat(shuffle(LANG.filter(w=>w.sh&&w.past))).slice(0,10).map(w=>{const same=LANG.filter(x=>x.sh===w.sh&&x.past).map(x=>x.e);return ch({p:`<p class="small muted">أي كلمة توصف هذا الخط؟</p><div style="display:flex;justify-content:center">${shapeSVG(w.sh,gcol(w.g),1)}</div>`,opts:opt4(w.e,LANG.filter(x=>x.past&&x.sh&&!same.includes(x.e)&&(x.g!==w.g||(w.g==='flat'&&x.sh!==w.sh))).map(x=>x.e)),ans:w.e,why:`<b class="en">${esc(w.e)}</b> = ${esc(w.a)}<div class="en small">${esc(w.x)}</div>`})}),
 opp:()=>shuffle(LANG.filter(w=>w.opp)).slice(0,10).map(w=>ch({p:`<p class="small muted">وش عكس هذي الكلمة؟</p><div class="big">${esc(w.e)}</div>`,opts:opt4(w.opp,LANG.filter(x=>x.g===w.g||x.g==='speed').map(x=>x.e).filter(x=>x!==w.e)),ans:w.opp,why:`${esc(w.e)} ↔ <b class="en">${esc(w.opp)}</b>`})),
 past:()=>shuffle(LANG.filter(w=>w.past&&w.past!==w.e+'d'&&w.past!==w.e+'ed')).concat(shuffle(LANG.filter(w=>w.past))).filter((w,i,a)=>a.indexOf(w)===i).slice(0,10).map(w=>{const v=w.e.split(' ')[0];const wrong=[v+'ed',v.replace(/e$/,'')+'ed',v+'d',w.pp||'',v+'s'].filter(x=>x!==w.past.split(' ')[0]);return ch({p:`<p class="small muted">الماضي من:</p><div class="big">${esc(w.e)}</div>`,opts:opt4(w.past,wrong.map(x=>x+w.e.slice(v.length))),ans:w.past,why:`${esc(w.e)} → <b class="en">${esc(w.past)}</b>${w.pp?' → '+esc(w.pp):''}<div class="en small">${esc(w.x)}</div>`})}),
 noun:()=>shuffle(LANG.filter(w=>w.noun&&w.noun!=='no change')).slice(0,10).map(w=>ch({p:`<p class="small muted">الاسم من الفعل:</p><div class="big">${esc(w.e)}</div><p class="small muted" style="margin-top:6px">مثال: There was ___ in the number of …</p>`,opts:opt4(w.noun,LANG.filter(x=>x.noun&&x!==w).map(x=>x.noun)),ans:w.noun,why:`<b class="en">${esc(w.noun)}</b>: There was ${esc(w.noun)} in the figure.`})),
 cloze:()=>{const out=[];shuffle(LANG).forEach(w=>{if(out.length>=10)return;const key=(w.past||w.e).replace(/[,.]$/,'');const re=new RegExp('\\b'+key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+')+'\\b','i');if(!re.test(w.x))return;out.push(ch({p:`<p class="small muted">أي تعبير يكمّل الجملة؟</p><div class="sent">${esc(w.x).replace(re,'<span class="blank">&nbsp;</span>')}</div>`,opts:opt4(key,LANG.filter(x=>x.g===w.g).map(x=>(x.past||x.e).replace(/[,.]$/,''))),ans:key,say:w.x,why:`<span class="en">${esc(w.x)}</span>`}))});return out},
 speed:()=>Array.from({length:8},()=>{const a=pick([20,40,50,80,100,120,200,250]);const k=pick(['big','small','mid']);const f=k==='big'?1+(.6+Math.random()*.8):k==='small'?1+(.02+Math.random()*.05):1+(.2+Math.random()*.15);const up=Math.random()>.4;const b=Math.round(up?a*f:a/f);const ans=k==='big'?'dramatically':k==='small'?'slightly':'significantly';
  return ch({p:`<p class="small muted">الرقم ${up?'زاد':'نقص'} من <b>${a}</b> إلى <b>${b}</b>. أي كلمة تناسب؟</p><div class="sent">The figure ${up?'rose':'fell'} ___ from ${a} to ${b}.</div>`,opts:['slightly','significantly','dramatically'],ans,why:`تغيّر ${Math.round(Math.abs(b-a)/a*100)}٪: أقل من ١٠٪ = slightly، حوالي ٢٠–٤٠٪ = significantly، أكثر من ٥٠٪ = dramatically.`})}),
 frac:()=>{const F=[[25,'a quarter'],[33,'a third'],[50,'half'],[67,'two thirds'],[75,'three quarters']];return Array.from({length:8},()=>{const [v,name]=pick(F);const d=pick([-3,-2,2,3,0]);const n=v+d;const ans=d<0?'just under '+name:d>0?'just over '+name:'exactly '+name;return ch({p:`<p class="small muted">كيف تكتبين هذا الرقم بالكلمات؟</p><div class="big">${n}%</div>`,opts:shuffle([...new Set([ans,(d<0?'just over ':'just under ')+name,'just over '+pick(F.filter(x=>x[1]!==name))[1],'exactly '+name])]).slice(0,4).concat([]).filter((x,i,a)=>a.indexOf(x)===i),ans,why:`${n}% ${d<0?'أقل بقليل من':d>0?'أكثر بقليل من':'يساوي'} ${v}% = <b class="en">${ans}</b>`})})},
 listen:()=>shuffle(LANG).slice(0,10).map(w=>ch({p:`<p class="small muted">اسمعي واختاري التعبير:</p><div class="row" style="justify-content:center"><button class="btn" data-say="${esc(w.e)}">🔊 استمعي</button></div>`,opts:opt4(w.e,LANG.filter(x=>x.g===w.g).map(x=>x.e)),ans:w.e,say:w.e,auto:1,why:`<b class="en">${esc(w.e)}</b> = ${esc(w.a)}`})),
 spell:()=>shuffle(LANG.filter(w=>/^[a-z]+$/.test(w.e)&&w.e.length>=5)).slice(0,8).map(w=>({kind:'type',target:w.e,say:w.e,auto:1,a:w.a})),
 build:()=>shuffle(LANG.filter(w=>{const c=w.x.split(/\s+/).length;return c>=6&&c<=12})).slice(0,6).map(w=>{const toks=w.x.replace(/[.]$/,'').split(/\s+/);return {kind:'build',toks,order:shuffle(toks.map((_,i)=>i)),built:[],full:w.x}}),
 data:()=>{const out=[];const T=TASKS.filter(t=>t.kind==='time');for(let k=0;k<30&&out.length<8;k++){const t=pick(T);const tb=t.tables[0];const r=pick(tb.rows.filter(r=>!/^(total|all)/i.test(r.name)));const idx=r.vals.map((v,i)=>v==null?-1:i).filter(i=>i>=0);if(idx.length<2)continue;const i0=idx[0],i1=idx[idx.length-1];const a=r.vals[i0],b=r.vals[i1];if(a===b)continue;const up=b>a;const pc=Math.abs(b-a)/a;const adv=pc<.1?'slightly':pc<.3?'considerably':'sharply';const badv=pc<.1?'dramatically':'slightly';const s=x=>showV(tb.unit,x);const nm='the figure for '+r.name;const N=nm[0].toUpperCase()+nm.slice(1);
  const right=`${N} ${up?'rose':'fell'} ${adv} from ${s(a)} in ${tb.cols[i0]} to ${s(b)} in ${tb.cols[i1]}.`;
  const w1=`${N} ${up?'fell':'rose'} ${adv} from ${s(a)} in ${tb.cols[i0]} to ${s(b)} in ${tb.cols[i1]}.`;
  const w2=`${N} ${up?'rose':'fell'} ${badv} from ${s(a)} in ${tb.cols[i0]} to ${s(b)} in ${tb.cols[i1]}.`;
  const w3=`${N} ${up?'rose':'fell'} ${adv} from ${s(b)} in ${tb.cols[i0]} to ${s(a)} in ${tb.cols[i1]}.`;
  out.push(ch({p:`<p class="small muted">من جدول «${esc(t.ar)}»: ${esc(r.name)} = <b>${s(a)}</b> (${tb.cols[i0]}) ← <b>${s(b)}</b> (${tb.cols[i1]}). أي جملة صحيحة؟</p>`,opts:shuffle([right,w1,w2,w3]),ans:right,list:1,say:right,why:`<span class="en">${esc(right)}</span><br>التغيّر ${Math.round(pc*100)}٪: أقل من ١٠٪ = slightly، ١٠–٣٠٪ = considerably، أكثر = sharply.`}))}return out}
};
let LG_S=null;let LG_FILTER='all';
function langView(){
 if(LG_S)return lgPlay();
 const known=Object.keys(LP.known).length;const list=LANG.filter(w=>LG_FILTER==='all'||w.g===LG_FILTER);
 return `<section class="hero2" style="background:linear-gradient(135deg,var(--grape),var(--skyc) 60%,var(--mint))"><span class="bubble" style="width:220px;height:220px;left:-60px;top:-90px"></span>
 <div class="stack" style="position:relative"><span class="eyebrow">بنك اللغة · ${LANG.length} تعبير</span><h2>كلمات تخلي تقريرك Band 7+</h2><p style="opacity:.95">كل كلمة معها رسم صغير يوضّح معناها، ومثال من جداول كتابك. احفظيها بالـ١٣ لعبة تحت.</p>
 <div class="row"><button class="btn sun" data-lplay="flash">ابدئي بالبطاقات ←</button><span>${known} / ${LANG.length} حفظتيها</span></div></div>
 <div class="ring"><div class="in"><div><b>${known}</b><span style="font-size:13px;opacity:.9">كلمة</span></div></div>${ringSVG(known/LANG.length)}</div></section>
 <section class="card stack"><div class="row" style="justify-content:space-between"><h3>١٣ لعبة على بنك اللغة</h3><span class="pill">${Object.keys(LP.best).length}/13 لعبتيها</span></div>
 <div class="games">${LGAMES.map((g,i)=>{const b=LP.best[g.id];return `<button class="game" style="--gc:var(${COLS[i%6]})" data-lplay="${g.id}"><span class="gb"><span class="gi">${lic(g.ic)}</span>${b!=null?`<span class="best">أفضل ${b}%</span>`:`<span class="muted">${i+1}</span>`}</span><h4>${g.ar}</h4><p>${g.d}</p></button>`}).join('')}</div></section>
 <section class="card stack"><div class="row" style="justify-content:space-between"><h3>الكلمات</h3><div class="row">${[['all','الكل','--accent'],...LG.map(g=>[g.k,g.g,g.c])].map(([k,l,c])=>`<button class="btn sm ${LG_FILTER===k?'':'ghost'}" style="${LG_FILTER===k?`background:var(${c})`:`border-color:var(${c});color:var(${c})`}" data-lfilter="${k}">${l}</button>`).join('')}</div></div>
 ${LG.filter(g=>LG_FILTER==='all'||g.k===LG_FILTER).map(g=>{const ws=LANG.filter(w=>w.g===g.k);const kn=ws.filter(w=>LP.known[w.e]).length;return `<div class="stack" style="gap:8px"><h4 class="row" style="gap:8px;font-size:16px"><span style="width:12px;height:12px;border-radius:4px;background:var(${g.c})"></span>${g.g} <span class="small muted">${kn}/${ws.length}</span></h4><div class="wgrid">${ws.map((w)=>{const k=!!LP.known[w.e];return `<article class="wcard${k?' known':''}" style="--wc:var(${gcol(w.g)})"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="w">${esc(w.e)}</span>${w.sh?shapeSVG(w.sh,gcol(w.g)):''}</div><div class="ar">${esc(w.a)}</div>${w.past||w.noun?`<div class="small en">${w.past?'past: <b>'+esc(w.past)+'</b>':''}${w.noun?' · noun: <b>'+esc(w.noun)+'</b>':''}${w.opp?' · ↔ '+esc(w.opp):''}</div>`:w.opp?`<div class="small en">↔ ${esc(w.opp)}</div>`:''}<div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div class="ex" style="flex:1">${markLang(w.x)}</div><button class="icon-btn" data-say="${esc(w.x)}" aria-label="استمعي">🔊</button></div><button class="btn sm ${k?'soft':'ghost'}" data-lknow="${esc(w.e)}">${k?'حفظتها ✓':'حفظتها'}</button></article>`}).join('')}</div></div>`}).join('')}</section>`}
function lgPlay(){const G=LG_S;const name=LGAMES.find(g=>g.id===G.id).ar;const n=G.R.length;
 if(G.i>=n){const pct=Math.round(G.score/n*100);if(!G.saved){G.saved=1;LP.best[G.id]=Math.max(LP.best[G.id]||0,pct);saveL();addXP(10)}
  return `<section class="card stack" style="align-items:center;text-align:center"><span class="eyebrow">${name}</span><b style="font-size:46px">${G.score} / ${n}</b><p>${pct>=80?'ممتاز! الكلمات صارت معك.':'كويس، جرّبي مرة ثانية بأسئلة جديدة.'}</p><div class="row"><button class="btn" data-lplay="${G.id}">مرة ثانية</button><button class="btn ghost" data-lback="1">بنك اللغة</button></div></section>`}
 const R=G.R[G.i];const done=G.picked!=null;let h=`<section class="card play"><div class="row" style="justify-content:space-between"><button class="icon-btn" data-lback="1">→ رجوع</button><span class="eyebrow">${name}</span><span class="pill">${G.i+1} / ${n} · صح ${G.score}</span></div><div class="meter"><i style="width:${G.i/n*100}%"></i></div>`;
 if(R.kind==='choice'){h+=`<div class="prompt">${R.p}</div><div class="opts"${R.list?' style="grid-template-columns:1fr"':''}>${R.opts.map((o,k)=>{let c='opt en';if(done){if(o===R.ans)c+=' right';else if(o===G.picked)c+=' wrong'}return `<button class="${c}" ${R.list?'style="text-align:left"':''} data-lpick="${k}" ${done?'disabled':''}>${esc(o)}</button>`}).join('')}</div>`;if(done)h+=lfb(G.picked===R.ans,R.why,R.say)}
 if(R.kind==='flash'){const w=R.w;h+=`<div class="prompt flip" data-lflip="1" role="button" tabindex="0" style="text-align:center">${R.f?`<div class="stack" style="align-items:center"><div class="big">${esc(w.e)}</div>${w.sh?shapeSVG(w.sh,gcol(w.g),1):''}<div style="font-size:22px;font-weight:600;color:var(--accent)">${esc(w.a)}</div><div class="sent" style="text-align:center">${markLang(w.x)}</div></div>`:`<div class="stack" style="align-items:center"><div class="big">${esc(w.e)}</div><span class="small muted">تذكّري المعنى، ثم اضغطي البطاقة</span></div>`}</div><div class="row" style="justify-content:center"><button class="icon-btn" data-say="${esc(w.e)}">🔊 الكلمة</button><button class="icon-btn" data-say="${esc(w.x)}">🔊 المثال</button></div>${R.f?`<div class="row" style="justify-content:center"><button class="btn" data-lfk="1">عرفتها</button><button class="btn ghost" data-lfk="0">ما عرفتها</button></div>`:''}`}
 if(R.kind==='type'){h+=`<div class="prompt"><p>اسمعي واكتبي الكلمة بالإنجليزي:</p><div class="row" style="margin-top:8px"><button class="btn" data-say="${esc(R.say)}">🔊 استمعي</button><button class="btn ghost" data-say="${esc(R.say)}" data-slow="1">أبطأ</button><span class="small muted">المعنى: ${esc(R.a)}</span></div></div><input id="ltin" class="input en" autocomplete="off" spellcheck="false" ${done?'disabled':''} value="${esc(R.typed||'')}">${done?lfb(G.picked==='ok',`التهجئة: <b class="en">${esc(R.target)}</b>`,R.say):`<div class="row"><button class="btn" data-ltcheck="1">تحقّقي</button></div>`}`}
 if(R.kind==='build'){h+=`<div class="prompt"><p>رتّبي الكلمات عشان تطلع جملة صحيحة:</p></div><div class="slot">${R.built.map((ti,pos)=>`<button class="tile" data-lunb="${pos}" ${done?'disabled':''}>${esc(R.toks[ti])}</button>`).join('')}</div><div class="tiles">${R.order.map(ti=>`<button class="tile" data-ltile="${ti}" ${R.built.includes(ti)||done?'disabled':''}>${esc(R.toks[ti])}</button>`).join('')}</div>${done?lfb(G.picked==='ok',`<span class="en">${esc(R.full)}</span>`,R.full):`<div class="row"><button class="btn" data-lbcheck="1" ${R.built.length===R.toks.length?'':'disabled'}>تحقّقي</button><button class="icon-btn" data-lbreset="1">امسحي</button><button class="icon-btn" data-say="${esc(R.full)}">🔊 مساعدة</button></div>`}`}
 return h+'</section>'}
function lfb(ok,why,say){return `<div class="fb ${ok?'ok':'no'}"><b>${ok?'صح!':'تعلّمي منها:'}</b> ${why||''}</div><div class="row">${say?`<button class="icon-btn" data-say="${esc(say)}">🔊 اسمعي</button>`:''}<button class="btn" data-lnext2="1">التالي ←</button></div>`}
function lAnswer(v){const G=LG_S;G.picked=v;const R=G.R[G.i];const ok=v==='ok'||v===R.ans;if(ok){G.score++;addXP(2)}render()}
document.addEventListener('click',ev=>{const b=ev.target.closest('button,[data-lflip]');if(!b||S.room!=='lang')return;const d=b.dataset;
 if(d.lplay){LG_S={id:d.lplay,R:LBUILD[d.lplay](),i:0,score:0,picked:null};render();scrollTo({top:0});setTimeout(lAuto,250);return}
 if(d.lback){LG_S=null;render();return}
 if(d.lfilter){LG_FILTER=d.lfilter;render();return}
 if(d.lknow){if(LP.known[d.lknow])delete LP.known[d.lknow];else{LP.known[d.lknow]=1;addXP(1)}saveL();render();return}
 const G=LG_S;if(!G||G.i>=G.R.length)return;const R=G.R[G.i];
 if(d.lpick!=null&&G.picked==null){lAnswer(R.opts[+d.lpick]);return}
 if(d.lnext2){G.i++;G.picked=null;render();setTimeout(lAuto,250);return}
 if(d.lflip!=null){R.f=1;speak(R.w.e,.85);render();return}
 if(d.lfk!=null){if(d.lfk==='1'){G.score++;LP.known[R.w.e]=1;saveL();addXP(1)}G.i++;render();return}
 if(d.ltcheck){const v=(($('#ltin')||{}).value||'').trim().toLowerCase();R.typed=v;lAnswer(v===R.target.toLowerCase()?'ok':'no');return}
 if(d.ltile!=null){R.built.push(+d.ltile);render();return}
 if(d.lunb!=null){R.built.splice(+d.lunb,1);render();return}
 if(d.lbreset){R.built=[];render();return}
 if(d.lbcheck){lAnswer(R.built.map(i=>R.toks[i]).join(' ')===R.toks.join(' ')?'ok':'no');return}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='ltin'){const b=document.querySelector('[data-ltcheck]');if(b)b.click()}});
function lAuto(){const G=LG_S;if(!G||G.i>=G.R.length)return;const R=G.R[G.i];if(R.auto&&G.picked==null)speak(R.say,.85)}

render();
</script>
