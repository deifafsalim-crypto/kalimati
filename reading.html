et a job. In addition, replacing older workers with young people would bring greater benefits to companies [=employers]. This is because youngsters are better at adapting themselves to fast changing information based society. They are generally better at computers and speaking foreign languages than their older counterparts.","Nevertheless, people should not ignore the fact that senior citizens have been playing vital roles both at home and at work for their entire lives. To begin with, a young person's need for a job is no more important than an older person's. Both have a responsibility to support their families. Sadly, few seniors can afford early retirement. Besides, senior workers provide the wisdom and experience that young employees cannot offer. There is strong [=acute] possibility of situations arising that require the knowledge of skilled senior employees.","In summary, the advantages of keeping seasoned workers far outweigh its disadvantages. There are high hopes that employers exercise wisdom [=caution] in dealing with this issue."],"id":131,"t":"opinion","c":4},{"n":132,"topic":"TRAVEL","q":"International entertainers, including sports personalities, often get paid millions of dollars in one year. In your view, with widespread pverty in the world, are these huge earnings justified?","p":["The salaries of many singers, dancers and sports people have increased out of all proportion in recent years, while in places like Sudan people are starving to death. I do not beleive that anyone should be able to earn such enormous salaries whan so many people in the world are living in poverty.","One af the factors which should affect what a person can earn ought to be the benefit of person's work to society. It is unreasonable for a famous singer to be able to earn far more from an evening's entertainment than, for instance, a medical scientist who develops a new drug which produces a treatment for a common disease. The pop star certainly has a value in society, but the value in no way exceeds, or even matches, the value gained from a successful medication.","Secondly. work done should be paid according to the amount of effort and skill that goes into it. Nobody would deny that a famous person works hard and is skillful, yet such people do not work any harder than thousand of other workers who have no claim to fame. Yet market force are such that these superstarts can obtain millions of dolor while other unknown people sometimes earn less than they need to survive. Finally, it should be possible for governments to work together to ensure that the amount of money in circulation should be more more equally and fairly distributed. This seems only fair given that there are so many suffering. To conclude, it is clear that world poverty is a serious problem and yet the problem could be eased if governments and compenies gave more thought to paying salaries on a more equitable basis and if they started to contribute more money to those in need."],"id":132,"t":"opinion","c":3},{"n":133,"topic":"TRAVEL","q":"Many people think that nowadays people are being subjected to more and more pressure in their work, and thus are having less and less time to relax. What is your opinion?","p":["In modern society, especially in big cities, undoubtedly hard work has become a very important feature of ordinary people’s everyday life. It seems that many people are under the impression that their work is becoming more pressing and urgent, and thus they sacrifice more and more leisure time.","In the first place, with the rapid development of science and technology, work today is more demanding than it used to be. For example, college graduates nowadays have to master English, computer science and driving skills before they can find decent jobs. People have to spend more time acquiring new techniques and skills. And their spare time tends to be fully occupied, not with leisure pursuit, but with work-related pursuits.","In the second place, competition is becoming more intense. Many people feel anxious that they may be “laid-off” if they can’t work as hard as others. And they also feel at a disadvantage before new graduates. Therefore, it is understandable that people keep themselves involved in intensely hard work in order to preserve their positions.","In my opinion, the worst aspect of this phenomenon is that the huge pressure of work will gradually affect people’s mental health. Excessively hard work means that people can never get rid of the fatigue of their work, even in their leisure time. This means that they can not enjoy a normal life.","In a word, in modern society overwork is stealing our leisure time. however, I believe this problem will be settled eventually with the development of science and technology."],"id":133,"t":"opinion","c":5},{"n":134,"topic":"TRAVEL","q":"People have different job expectations for jobs. Some people prefer to do the same job for the same company, whereas others prefer to change jobs frequently. Write about the advantages and disadvantages of each viewpoint?","p":["In the modern workplace there is no longer the attitude that ‘a job is for life’. Nowadays, many people take the option to change jobs, while others prefer not to. In my essay, I will explore the good and bad points of the above attitudes.","One of the main benefits of staying in one job is security. Changing employer often means a period of instability, where one may have to think about moving house, or temporarily losing a steady source of income. Staying in one job means these problems are avoided.","Another benefit of not changing occupation is that one is able to gain a lot of experience and expertise in his specific profession, thus enhancing job security. One’s company may recognize their loyalty and reward their service. On the other hand, those who often change jobs may be seen as unreliable, lacking in experience and employers might be reluctant to hire and invest training in them.","However, there are arguments in favour of changing job frequently. One is that a worker improves his employability. Working in several different jobs often means that the individual has more skills. Such people are seen as more dynamic and versatile.","Another benefit of changing jobs frequently is that one never gets stuck in a rut. From my own experience, I got bored when I spent too long in a job. Following this, the quality of my work would suffer. I also believe that employers generally don’t tend to greatly reward loyalty or commitment. Increased wages and promotion are often easier to attain by changing jobs.","Overall, it can be said that the disadvantages of changing jobs are the advantages of staying put, and vice versa... In my opinion, I feel that changing jobs every once in a while is of more benefit."],"id":134,"t":"advdis","c":6},{"n":135,"topic":"GOVERNMENT","q":"Families who do not send their children to government-financed schools should not be required to pay taxes that support universal education. (AGREE)","p":["Families who do not send their children to government-financed school should not be required to pay taxes that support universal education.","When families send their children to non-public (that is, parochial and private) schools, they must pay tuition and other school expenses. Spending additional money to pay taxes creates an even greater financial hardship for these families. They must make sacrifices, trying to have enough money to pay for school in addition to other bills. For example, my friend Amalia is a single mother with an eight-year-old son, Andrew. Because they survive solely on her income, money is tight. Amalia works at least 10 hours of overtime each week to cover Andrew's school expenses. This gives Amalia and Andrew less time to spend together, and she is always so tired that she is impatient with him when they do have family time. Clearly, this extra expense is an unfair burden for hard-working parents like Amalia.","While some people may consider parochial or private school to be a luxury, for many families it is essential because their community's public schools fail to meet their children's needs. Unfortunately, due to shrinking budgets, many schools lack well- qualified, experienced educators. Children may be taught by someone who is not a certified teacher or who knows little about the subject matter. Some problems are even more serious. For example, the public high school in my old neighborhood/neighbourhood had serious safety problems, due to students bringing guns, drugs, and alcohol to school. After a gang-related shooting occurred at the high school, my parents felt that they had no choice but to enroll me in a parochial school that was known for being very safe.","Unfortunately, even when families prefer public schools, sometimes they can't send their children to one. These families are burdened not only for paying expenses at another school, but also by being forced to pay taxes to support a public school that they do not use.","(323 words)"],"id":135,"t":"opinion","c":4},{"n":136,"topic":"GOVERNMENT","q":"Families who do not send their children to government-financed schools should not be required to pay taxes that support universal education. (DISAGREE)","p":["Families who do not send their children to public school should be required to pay taxes that support public education.","Every child in my country is required to attend school and every child is welcome to enroll at his/her local public school. Some families choose to send their children to other schools, and it is their prerogative to do so. However, the public schools are used by the majority of our children and must remain open for everyone. For example, my uncle sent his two children to a private academy for primary school. Then he lost a huge amount of money through some poor investments and he could no longer afford the private school's tuition. The children easily transferred to their local public school and liked it even more than their academy. The public schools supported their family when they had no money to educate their children.","Because the public schools educate so many citizens, everyone in my country-whether a parent or not-should pay taxes to support our educational system. We all benefit from the education that students receive in public school. Our future doctors, fire fighters, and teacherspeople whom we rely on everyday-are educated in local public schools. When a person is in trouble, it's reassuring to know that those who will help you-such as fire fighters-know what they're doing because they received good training in school and later. Providing an excellent education in the public school system is vital to the strength of our community and our country.","Our government must offer the best education available, but it can only do so with the financial assistance of all its citizens. Therefore, everyone-including families who do not send their children to public school-should support public education by paying taxes. (290 words)"],"id":136,"t":"opinion","c":4},{"n":137,"topic":"GOVERNMENT","q":"Some people say the government should not put money into building theatres and sports stadiums; they should spend more money on medical care and education. To what extent do you agree or disagree with this opinion?","p":["What would the world be like without Shakespeare or the Olympics? While medical care and education are perhaps the highest causes to which money can be contributed, the arts and athletics are in some ways just as valuable. So, to ask the government to not extend support to these two areas could be just as detrimental to the welfare of society as the lack of sufficient health care and education.","The Romans believed in “mens sana in corpore sano”. In short, that there is indeed a correlation between a healthy body and healthy mind. When we are healthy, we feel better and so are more likely to be productive academically. Plus, the practice of sports can also teach us the very same discipline we need for our studies. Why even a brisk walk or watching an exciting athletic match can refresh the mind for greater work. Moreover, sports can serve to create healthier bodies, which in turn would serve as a form of “preventive medicine” thereby cutting down on medical costs. In the same vein, the arts are known to induce a sense of well-being in performers and audience alike, reducing mental problems and their associated physical manifestations and again, medical costs. As such, building theatres and stadiums, which spur interest in the arts and sports respectively, actually would be practically identical to spending money on medical care and education!","Now I realize the question specifically addresses the building of theatres and sports stadiums by government. Some people would contend athletics and the arts can still be enjoyed and practiced without such constructions. I would hazard that these buildings stand as the altars to the sports and arts worlds, inspiring would-be athletes and performers. Without such venues where would sports spectators and music aficionados be able to enjoy these events? Now some other people would also say business could support their construction, but we know the avarice of business could very likely jeopardize the lofty spirit of athletics and the arts just as well. Therefore, allowing government to retain some say in the matter on behalf of the people would, I believe, be in the best interest of the people.","In short, as long as the government does no go overboard in its expenditures for these buildings and uses such venues for the benefit of all, then, as mentioned above, people will benefit in terms of both medical care and education as well. This is not to say the government should neglect medical care and education, but rather to think of this not as an either-or choice but as a win-win situation for all.","(434 words)"],"id":137,"t":"opinion","c":4},{"n":138,"topic":"GOVERNMENT","q":"The costs of medical health care are increasing all the time. Governments are finding it difficult to balance the health care budget.","p":["Should citizens be totally responsible for their own health costs and take out private health insurance, or is it better to have a comprehensive health care system which provides free health services for all? Discuss.","A much debated issue these days is whether citizens should take out private health insurance or not. The cost of providing free medical care for both the wealthy and the poor is far too great for any government, and most people agree that if you can pay for insurance, you should. In this essay, I will argue that all who can afford it should be insured, but free medical care must be made available for those too poor to do so.","The most important reason for encouraging people to take out private health insurance is the cost to the government of health care. Free health cover for people who are able to pay for it is a waste of public money. Of course, people will only pay health insurance premiums if they know that they are getting good value for their money. If they get sick, they should pay very little or nothing at all. In addition, the privately insured are entitled to special benefits such as having the choice of their own doctors, and being able to avoid long waiting lists for hospital beds.","On the other hand, those who really cannot afford to pay private insurance premiums, which are often very high, are still entitled as citizens to the best medical care available – they cannot be expected to pay their own medical bills. However, if they are working, they should still pay a percentage of their wage (say 1 to 2%) as a tax which pays towards the cost of providing \"free\" medical services.","In conclusion, most people should privately insure their health, but it is unreasonable to suppose that all citizens can afford it. Therefore, a safety net in the form of a basic free health care system must exist for the very poor and the unemployed.","(300 words)"],"id":138,"t":"other","c":5},{"n":139,"topic":"GOVERNMENT","q":"All education, primary, secondary and further education, should be free to all people and paid for by the government. Do you agree or disagree with this statement?","p":["Different countries have different education systems. I don‛t know all the education systems in the world but all the ones I do know about have free school education at primary and secondary level. I certainly agree with the statement that this should be the case. I believe university education is different.","No matter what standard of income someone has or what society someone comes from, everyone should have the opportunity to have a good standard of education. This is not always what happens but it is what should happen. Private schools can be available for those who want and can afford it but the free schools should always be there. This is certainly one of the best attributes of western democracy and all countries it seems strive to attain situation although some have problems due to the economic and political situations in their countries. Governments should make sure that all their citizens have access to a good standard of free education at primary and secondary level.","Further education is different. In an ideal world this should be free but governments have a lot of demands on their money. I think that students should have to pay, maybe not all, but at least a contribution towards their tuition fees. They will be able to earn it back once they have graduated. The UK has this system whereas in the US students have to pay all their high tuition fees which can run into the tens of thousands of dollars over a full course. I am not sure if I agree with this but it certainly would make sure that students make the best of efforts to pass or all their money would be wasted.","Therefore I conclude that primary and secondary education should be freely available for all if possible but that further education should not necessarily be wholly free.","(309 words)"],"id":139,"t":"opinion","c":4},{"n":140,"topic":"GOVERNMENT","q":"Most writers of fiction do not earn enough money to live from their writing. Do you think the government should give them financial assistance to help encourage good literature?","p":["There are some conditions under which a novelist could reasonably expect some government suport. In general terms, if the writer has already proved that he or she can write well, and if the stories produced are stimulating and interesting, then I consider that some financial help might be given.","Language quality is difficult to define, but if the writing shows, for example, good grammar, a wide vocabulary, and elegance and imagination, then I can see a valid reason for assisting an author to spend some time free from money problems. Such a writing needs to be encouraged. the entertainment value of a book would be also a factor in deciding whether to provide assistance to an author. Further consideration would include social and educational values expressed in the author's work.","However, if the ideas were socially irresponsible, or if the stories contain unnecessary violence or pornography for its own sake, then I would not want to see the author sponsored to write stories which do not benefit society. Other exceptions are the many writers of good books who do not require financial help. Books which proved to be extremely popular, such as the Harry Potter stories, clearly need no subsidy at all because the authors have become rich through their writing.","Views on what good quality writing means will vary widely, and so if any author is to be given money for writing, then the decision would have to be made by a committee or panel of judge. An individual opinion would certainly cause disagreement among the reading public."],"id":140,"t":"opinion","c":4},{"n":141,"topic":"GOVERNMENT","q":"The costs of medical health care are increasing all the time. Governments are finding it difficult to balance the health care budget. Should citizens be totally responsible for their own health costs and take out private health insurance, or is it better to have a comprehensive health care system which provides free health services for all? Discuss.","p":["A much debated issue these days is whether citizens should take out private health insurance or not. The cost of providing free medical care for both the wealthy and the poor is far too great for any government, and most people agree that if you can pay for insurance, you should. In this essay, I will argue that all who can afford it should be insured, but free medical care must be made available for those too poor to do so.","The most important reason for encouraging people to take out private health insurance is the cost to the government of health care. Free health cover for people who are able to pay for it is a waste of public money. Of course, people will only pay health insurance premiums if they know that they are getting good value for their money. If they get sick, they should pay very little or nothing at all. In addition, the privately insured are entitled to special benefits such as having the choice of their own doctors, and being able to avoid long waiting lists for hospital beds.","On the other hand, those who really cannot afford to pay private insurance premiums, which are often very high, are still entitled as citizens to the best medical care available – they cannot be expected to pay their own medical bills. However, if they are working, they should still pay a percentage of their wage (say 1 to 2%) as a tax which pays towards the cost of providing \"free\" medical services.","In conclusion, most people should privately insure their health, but it is unreasonable to suppose that all citizens can afford it. Therefore, a safety net in the form of a basic free health care system must exist for the very poor and the unemployed.","(300 words)"],"id":141,"t":"opinion","c":4},{"n":142,"topic":"GOVERNMENT","q":"Should governments spend money on art, when they have so many other important issues and concerns?","p":["Art is a basic human need. Governments have a responsibility to spend money on art for their citizens. (Shorter version: 260 words)","Many people's lives are richer because of art - music, paintings, calligraphy, pictures, sculpture, poems and dance. However, some people feel that governments should be spending money on housing, medical care, or defence, instead of on art. This essay will discuss whether governments should or should not spend money on the arts.","There are several reasons why governments should not finance artists. First of all, artists should have to follow the same rules as the rest of the market. If there is a demand for their music or sculpture, then they will be rich. Secondly, politicians generally do not have good taste. They will waste public money on popular art or on their own preferences. But the main reason why governments should minimize spending on the art world is that there are more important areas like housing, roads, hospitals, and factories which need the money first.","However, it would be wrong to say that governments should not spend any money at all on art. Everybody needs some beauty in their life, but not everyone can afford a Picasso or a piece of music. Governments should provide money for museums or concert halls for everyone. Another point is that art allows people to express themselves and this is good for society, culture and thought. Thirdly, artists can be good for the economy by producing music, films, and attracting tourists.","All in all, governments should prioritize their spending carefully, but they should also allocate some of their budget for art. It is part of their duty to society and to future generations.","251 words","Sample 2 :","Throughout the ages, man has tried to create beauty through painting, music, sculpture and other artistic expression. It seems to be a basic need of humans to surround themselves with art. However some people feel that government money spent on art is wasted, particularly when there are so many other demands on it. This essay will examine the conflict between those who say art is important and those who feel it is a waste of money.","It can be wrong for governments to spend large sums of money on art. Too often, governments spend unwisely. They spend money on art not because a picture is good or a museum is needed, but for political reasons. Cities end up with huge statues or empty expensive buildings that are used only by a few people or the elite. Another point is that the artworks are often chosen to represent social or political rather than artistic ideas. The city gets yet another statue of the leader or an ugly monument to national aspirations. A third point is that governments often respond to fashions, and tastes in art can change very rapidly. Without careful advice an expensive collection of worthless paintings or tasteless productions can be the result.","However, it would be wrong to say that governments should not spend any money at all on art. Painters, musicians, and composers cannot survive without financial support. Rich people or large companies do finance art, but then it is often inaccessible to ordinary people. Governments have a duty to make this art available to everyone. However, the most important reason why governments should support the arts is because an appreciation of art is one of the things that makes life worthwhile. Humans do not need just shelter and food. Creative people have always tried to look at things in a new way and to make the world a better place through painting, music, poetry, calligraphy, sculpture, dance, and numerous other forms of expression. While art may not make us immortal, it does make the world a richer place for future generations.","In conclusion, although people do need to be provided with the necessities of life, such as housing and medical care, governments also have a duty to provide their citizens with something more. They should make sure that they pass on beauty, ideas and expression to the next generation and make art available to all instead of being the possession of only the few. I firmly believe that spending money on art is a vital part of a government's responsibility, and I am confident that my country will be able to contribute its share to the richness of the world's art and creativity. (447 words)"],"id":142,"t":"opinion","c":6},{"n":143,"topic":"GOVERNMENT","q":"In the fight against crime, police forces and governments are increasingly using security cameras in public places. Some people are opposed to this, saying that it invades our privacy. What do you think?","p":["Security cameras have become ubiquitous in many countries. Whereas before they appeared only in banks and at high-security areas, they are now entering public places such as malls, streets, stadiums and transport. Many people feel this affects their privacy. This essay will examine whether the advantages of these cameras outweigh their negative impact.","Surveillance cameras have several benefits. An obvious benefit is that the police can catch criminals in the act, thus reducing crime. This will make the streets safer for ordinary people. A more important point is that criminals, particularly young offenders or petty criminals will be deterred. They will not be tempted to carry out crimes, and thus society will be a lot safer. Cameras are also cost-effective and unobtrusive. Authorities do not need to spend large amounts of money on police.","However, security cameras are far from being a perfect solution. The biggest objection concerns privacy. Many people feel that they should be free to travel or move around a shop, mall, street or country without being photographed or recorded. They feel that being watched constantly is like being in a jail, and that ordinary people are losing their freedom because of these devices. Another point is that although the police say that only criminals have something to fear from the cameras, many people do not trust governments with too much information. Corrupt authorities could use information in the wrong way or twist it to victimize some groups. Thirdly, cameras and computers can make mistakes.","In conclusion, although there are definite advantages to using surveillance devices such as cameras, we need to balance the need for security with respect for the individual's privacy and freedom. If we do not trust the members of society, a situation like George Orwell's \"1984\" could be the result.","297 words"],"id":143,"t":"opinion","c":5},{"n":144,"topic":"GOVERNMENT","q":"Some governments say how many children a family can hare in their country. They may control the number of children someone has through taxes. It is sometimes necessary and right for a government to control the population in this way. Do you agree or disagree?","p":["It is certainly very understandable that some governments should start looking at ways of limiting their populations to a sustainable figure. In the past, populations were partly regulated by frequent war and widespread disease, but in recent years the effects of those factors have been diminished. Countries can be faced with a population that is growing much faster than she nation's food resources or employment opportunities and whose members can be condemned to poverty by the need to feed extra mouths. They identify population control as a'means to raising living standards.","But how should it be achieved? Clearly, this whole area is a very delicate personal and cultural issue. Many people feel that this is not a matter for the state. They feel this is one area of life where they have the right to make decisions for themselves. For that reason, it would seem that the best. approach would be to work by persuasion rather than compulsion This could be done by a process of education that points out the way a smaller family can mean an improved quality of life for the family members, as well as less strain on the country's perhaps very limited, resources.","This is the preferred way. Of course if this docs not succeed within a reasonable time scale, it may be necessary to consider other measures. such as tax incentives or child- benefit payments for small families only. These are midway between persuasion and compulsion.","So. yes. it is sometimes necessary, but governments should try very hard to persuade first. They should also remember that this is a very delicate area indeed, and that social engineering can create as many problems as it solves?"],"id":144,"t":"opinion","c":4},{"n":145,"topic":"COMPUTER","q":"Using a computer every day can have more negative than positive effects on your children. Do you agree or disagree?","p":["I tend to agree that young children can be negatively affected by too much time spent on the computer every day. This is partly because sitting in front of a screen for too long can be damaging to both the eyes and the physical posture of a young child, regardless of what they are using the computer for.","However, the main concern is about the type of computer activities that attract children. These are often electronic games that tend to be very intense and rather violent. The player is usually the ‘hero’ of the game and too much exposure can encourage children to be self-centred and insensitive to others.","Even when children use a computer for other purposes, such as getting information or emailing friends, it is no substitute for human interaction. Spending time with other children and sharing nonvirtual experiences is an important part of a child's development that cannot be provided by a computer.","In spite of this, the obvious benefits of computer skills for young children cannot be denied. Their adult world will be changing constantly in terms of technology and the Internet is the key to all the knowledge and information available in the world today. Therefore it is important that children learn at an early age to use the equipment enthusiastically and with confidence as they will need these skills throughout their studies and working lives.","I think the main point is to make sure that young children do not overuse computers. Parents must ensure that their children learn to enjoy other kinds of activity and not simply sit at home, learning to live in a virtual world.","(273 words)"],"id":145,"t":"opinion","c":5},{"n":146,"topic":"COMPUTER","q":"Some people believe that computers are more a hindrance than a help in today's world. Others feel that they are such indispensable tools that they would not be able to live or work without them.","p":["• In what ways are computers a hindrance? • What is your opinion?","The advanced `Mind machines' so called `the Computers' are no doubt the best products of latest technology. One cannot imagine the advancement of life and Sciences without these machines.","But like other achievements; they have their own good and bad effects as seen with experience and passage of time. In my opinion they are good if used for educational and beneficial uses for health and living etc.","Basically twentieth century had been famous for its latest Computer techniques and their application on our lives. Datas shown on Computers help us to assess how much education is conducted through this media. The assessment ways as well as examinations are improved. Moreover personal skills of reading and writing are far more improved through Computers.","Moreover Science and technology progressed immensely with computers. Researchers like cloning and transplants are only possible with modern computerized skills.","Good question comes to ones mind ... where will this Computer would take us next?? Certainly no one knows! We might explore new planners. May be we will buy houses on Moon, Mars or Jupitor. Or we might loose our own identity. One cannot forget the end of 2000 millennium when everybody was in chaos to think what will happen if the computers crash? The aeroplanes were going to crash and the trains would colloid. That Show we are forced to think that one should not be dependent on these machine after all we are humans. We are here to command computers not them to order us.","(249 words)"],"id":146,"t":"other","c":5},{"n":147,"topic":"COMPUTER","q":"As the world becomes technologically advanced, computers are replacing more and more jobs. Describe some job positions that may be lost because of computers, and discuss at least one problem that may result.","p":["When computers first made their way into the business sector, everyone believed that they would make people's jobs easier. What was not expected was that computers would eliminate jobs. Besides contributing to unemployment, these automated workers often exhibit inadequate job performance.","A number of jobs have been lost as a direct result of new computer technology. Ticket agents in various transportation facilities, from subway/underground stations to airports are virtually nonexistent these days. Bank tellers have been greatly reduced due to automated bank machines. In addition, many call centers/centres that have help lines are almost entirely computerized/computerised. A few years ago I worked as a helper in our local library. Today this position does not exist, because six new computers have been installed. The number of positions lost to computers grows exponentially, and unemployment continues to get worse.","While a computer may easily achieve the main tasks of these jobs, most computers fall short when customers have a unique request or problem. A pre-paid ticket booth does not have insight about the entertainment district and cannot offer friendly directions to a tourist. Similarly, an automated bank machine cannot provide assistance and reassurance to a customer who has just had his credit card stolen. And, more often than not, automated telephone operators cannot answer the one question that we have, and we end up waiting on the line to speak with someone anyway. Every time I go into the library where I worked I notice elderly people who don't know how to use the computers and can't find anyone to help.","In the future, I believe a new business trend will evolve. As computers eliminate jobs, new positions will have to be invented. More and more people will go into business for themselves, and hopefully put the personal touch back into business. I believe that the human workforce will demonstrate that it is more valuable than computers.","(315 words)"],"id":147,"t":"problem","c":4},{"n":148,"topic":"COMPUTER","q":"Some people say that computers have made life easier and more convenient. Other people say that computers have made life more complex and stressful. What is your opinion? Use specific reasons and examples to support your answer.","p":["Some people say that the invention of computers is one of the greatest humankind's inventions. However, other people think that computers make their life more stressful. I agree with those people who think that computers brought many benefits and play a very important role in our modern life.","First of all, every company nowadays uses a computer to store its data and make different kinds of operations. It is very difficult to imagine life without computers. A company would have to store millions of papers and documents. Moreover, a customer would have to wait hours to check his balance or get a piece of information about his transactions at his bank, while an employee was looking trough those papers. Another important aspect of this is that people are able to type all their information, make corrections, print or send documents using computers. It makes life much easier. One can spend the rest of the time watching TV with his family or working on something new.","We use computers every day sometimes even not knowing it. When we go to a store and use our credit cards many computers process our information and perform transactions. When we need to get some cash we use money access machines that are computerized too.","Second of all, computers provided a great means of communication - the Internet. I think it is the easiest and cheapest way to get in touch with relatives, friends, business colleagues, etc. Nowadays the world becomes smaller and smaller. When I was a little girl, I could not imagine that it would be possible to communicate with people from all around the world in so easy way. A person can get latest news, become friends with someone from another country, find his old friends, ask for a piece of advice, etc.","Finally, in addition to these practical benefits people can shop without leaving their house. They just use an Internet access, a computer and their cards to make a payment. It is kind of difficult to imagine that a few years ago people had to spend their time in lines buying tickets. Now, a person can choose a destination, company, date and time and get tickets delivered to his door. I think it is amazing.","To sum up, I believe that computers made our lives easier. They change our attitude towards life. I think with the invention of computers people became closer and friendlier.","(404 words)"],"id":148,"t":"opinion","c":6},{"n":149,"topic":"COMPUTER","q":"We are becoming increasingly dependent on computers. They are used in businesses, hospitals, crime detection and even to fly planes.","p":["What things will they be used for in the future? Is this dependence on computers a good thing or should we he more auspicious of their benefits?","Computers are a relatively new invention. The first computers were built fifty years ago and it is only in the last thirty or so years that their influence has affected our everyday life. Personal computers were introduced as recently as the early eighties. In this short time they have made a tremendous impact on our lives. We are now so dependent on computers that it is hard to imagine what things would be like today without them. You have only got to go into a bank when their main computer is broken to appreciate the chaos that would occur if computers were suddenly removed world-wide.","In the future computers will be used to create bigger and even more sophisticated computers. The prospects for this are quite alarming. They will be so complex that no individual could hope to understand how they work. They will bring a lot of benefits but they will also increase the potential for unimaginable chaos. They will, for example, be able to fly planes and they will be able to co ordinate the movements of several planes in the vicinity of an airport. Providing all the computers are working correctly nothing can go wrong. If one small program fails disaster.","There is a certain inevitability that technology will progress and become increasingly complex. We should, however, ensure that we are still in a position where we are able to control technology. It will be all too easy to suddenly discover that technology is controlling us. By then it might be too late I believe that it is very important to be suspicious of the benefits that computers will bring and to make sure that we never become totally dependent on a completely technological world.","---------","Sample 2 :","In the last two decades cybernetics have experienced a major breakthrough .This led to the utilization of computers at nearly all parts of our daily life, from personal computers to complicated surgery performing. Surely the uptake of this technology facilitates a lot of difficult tasks but is this excessive dependance ripping the warmth of our lives? In this essay, I will outline how the availability of computers affects our lives.","Most of the daily tasks an individual experiences are time and effort consuming. These two fundemental qualities could be tremendously saved by the use of computers. The average period required to prepare a decent meal for a middle-class family is around an hour to and hour and a half when using traditional methods. This time could be literally reduced to half if computerized decivesare used instead. Moreover, a busy businessman is enabled to easily close a profitable deal just with a touch on this highly programmed laptop while enjoying his family vacation and not having to exert an extra effort of traveling long distances just to sign a deal.","On the other hand, new generations are growing remarkably dependent on these modern utilities, which make them handicapped when it comes to preparing a cup of tea. Inaddition, psychologists suggest that one of the main reasons for sucidal rate increase is recent electric inventions. This is due to that humans by nature stay emotionally healthy through socializing, but due to the importance of modern technology to maintain a financially satisfying standard of life they gradually isulate themselves. As time passes by each of these individuals gets stuck in a vicious circle of loneliness that eventually leads to suicidal attempts specially among youngsters.","In conclusion, similar to every other invention computers has its benefits and drawbacks, I personally think it all depends upon how we use the given tools . Moderation is the key here to keep the balance and allow us to live in harmony.","Good essay, nice vocabulary, a little too long (340 words instead of 250), a few grammatical mistakes. The topic is not fully covered (what about the “things will they be used for in future” part?)."],"id":149,"t":"other","c":5},{"n":150,"topic":"COMPUTER","q":"As computers are being used more and more in education, there will be soon no role for teachers in the classroom.","p":["There have been immense advances in technology in most aspects of people's lives, especially in the field of education. Nowadays, an increasing number of students rely on computers to research for information and to produce a perfect paper for school purposes. Others have decided to leave the original way of learning to get knowledge through online schools. These changes in the learning process have brought a special concern regarding the possible decrease of importance of teachers in the classroom.","Some people believe the role of teachers started to fade because computers have been helping some students to progress in their studies quicker than when compared with an original classroom. For example, in the same classroom, students have different intellectual capacities, thus some would be tied to a slow advance in their studies because of others’ incapacity of understanding. In this way, pupils could progress in their acquisition of knowledge at their own pace using computers instead of learning from teachers.","However, the presence of a teacher is essential for students because the human contact influences them in positive ways. Firstly, students realize that they are not dealing with a machine but with a human being who deserves attention and respect. They also learn the importance of studying in group and respect other students, which helps them to improve their social skills.","Moreover, teachers are required in the learning process because they acknowledge some student's deficiencies and help them to solve their problems by repeating the same explanation, giving extra exercises or even suggesting a private tutor. Hence, students can have a bigger chance not to fail in a subject.","In conclusion, the role for teachers in the learning process is still very important and it will continue to be in the future because no machine can replace the human interaction and its consequences.","This is a great essay. Looks like Band 8 to me. No improvements are necessary, Keep up the good job!"],"id":150,"t":"other","c":6},{"n":151,"topic":"COMPUTER","q":"We are becoming increasingly dependent on computers. They are used in businesses, hospitals, crime detection and even to fly planes.","p":["What things will they be used for in the future? Is this dependence on computers a good thing or should we he more auspicious of their benefits?","Computers are a relatively new invention. The first computers were built fifty years ago and it is only in the last thirty or so years that their influence has affected our everyday life. Personal computers were introduced as recently as the early eighties. In this short time they have made a tremendous impact on our lives. We are now so dependent on computers that it is hard to imagine what things would be like today without them. You have only got to go into a bank when their main computer is broken to appreciate the chaos that would occur if computers were suddenly removed world-wide.","In the future computers will be used to create bigger and even more sophisticated computers. The prospects for this are quite alarming. They will be so complex that no individual could hope to understand how they work. They will bring a lot of benefits but they will also increase the potential for unimaginable chaos. They will, for example, be able to fly planes and they will be able to co ordinate the movements of several planes in the vicinity of an airport. Providing all the computers are working correctly nothing can go wrong. If one small program fails disaster.","There is a certain inevitability that technology will progress and become increasingly complex. We should, however, ensure that we are still in a position where we are able to control technology. It will be all too easy to suddenly discover that technology is controlling us. By then it might be too late I believe that it is very important to be suspicious of the benefits that computers will bring and to make sure that we never become totally dependent on a completely technological world.","Sample 2:","Today computers are used almost everywhere, it is impossible to imagine our life without PCs, Internet, hand phones and other computer devices. It is reasonable that people look to the future of computers. In what field will be computers used for and what role will human has in this world in future? Besides, computers make our life easier, we can easily get information about any product we plan to buy or place we plan to visit over a second using personal computer and Internet. Scientists predict that in the nearest future it will be possible to smell a new perfume using Internet and watch 3D scenes at home like we do in the theater. According to forecasts of HR agencies machines will replace job of cashiers, civil and military pilots. Some corporations in Japan already selling housewife-robots, which help old people to keep their home clean.","Despite the fact that computers help us, they make us dependent. Apparently, people spend more time behind monitors that ever before. And some of them feel a need for more time to be spent with people in live contact. In addition, fall out of one of the important modules of specific computer can entail serious consequences. Suffice to mention computer problem, occurred in the end of 1990s, problem concerned with coming year 2000 (Y2K) and catastrophes that were predicted. Fortunately imminent disasters did not happen. However, it is difficult to imagine what could be if all the predictions had occurred.","We live in technological era, computers penetrated everywhere with all benefits they provide and all dangers they hide. However we are satisfied with them and sometimes we even thank them because they help us in communicating, studying, doing business, entertaining and saving lives in critical situations."],"id":151,"t":"other","c":4},{"n":152,"topic":"TRAFFIC","q":"Traffic and housing problems in major cities could be solved by moving large companies and factories and their employees to the countryside. To what extent do you agree or disagree with this opinion?","p":["These days with increasing urban populations, there are major problems with congestion and not only the price, but also availability of accommodation in large cities of the world. It seems that one possible solution could be to relocate large companies and factories as well as their respective employees out of these urban areas and into more rural ones. In my opinion, I strongly agree that this would have a desired effect in making cities more livable.","To begin with, the traffic problem in cities doesn’t only exist from commuting employees, but also the general public travelling around the city. While this may be a fact, if the number of worker’s vehicles is reduced on city streets, a large percentage of traffic will obviously decline in rush hours. For example, peak hour traffic is undoubtedly made up largely of staff from companies going to and from home.","Secondly, in regards to housing problems, populations will always continue to grow in cities and therefore inadvertently decrease the number of cheap and available apartments. This is certainly obvious, however, a large proportion of these apartments are occupied by employees from large firms and their families. If this workforce is relocated to housing estates in the country, city apartment blocks will fall in price and certainly increase in availability.","In conclusion, by relocating workers to rural areas to work and reside, heavy traffic conditions and lack of adequate accommodation in city centres will obviously change for the better. As far as I’m concerned, I agree that the government should enforce such a law in order to increase our standard of living in our hectic city life.","(272 words)"],"id":152,"t":"opinion","c":4},{"n":153,"topic":"TRAFFIC","q":"Every day traffic seems to get worse on our roads. How can we reduce the number of cars on our roads today? What alternatives can we offer car drivers?","p":["The more people that there are in the world, the more cars there are on the road. People are richer too and often families have more than one car. It has been proved that building more roads does not work; it just encourafes more traffic.","So, what can we do? People like their cars and the freedom and independence that cars give them. One possibility would be to raise car taxes and fuel taxes so that people do not want to spend the extra money. Taxes on new car sales as well could be increased in order to discourage people from buying. Perhaps a used car sales tax could be introduced too. In the same way motorways could have tolls charged for using them although this may just increase congestion on smaller roads as people try and avoid the motorways. The government that introduces such ideas will not be popular though and would probably lose power. Governments would therefore be unlikely to set up such new measures.","I think it would be better to try and change people‛s attitudes and offer them alternatives. Educate them more about the pollution and waste that they are causing. Persuade them to car share, use public transport or even cycle if the distances are not too long. Countries such as Holland and Denmark are well known for how their citizens are passionate about green issues and how they use bicycles when they can.","Reducing traffic is a difficult task. I don‛t think it is possible realistically to reduce car numbers but I do think that we can change people‛s attitudes and get them to use different ways of travelling.","(275 words)","Sample 2 :","Traffic Congestion in Abu Dhabi Abu Dhabi is a modern city but also has a modern problem: traffic jams. In the early mornings, and again in the evening, around 8 pm, the streets are crowded with cars, taxis, and trucks. This essay will explain the causes of gridlock in Abu Dhabi and discuss the effects of this problem.","Abu Dhabi’s traffic problems stem from several causes. The rapid economic growth of the emirate has enabled most residents to buy their own cars. This has put intense pressure on the road system, which although it is highly developed, has not been able to keep up with the expansion in population. Another cause is the absence of any major public transport system such as buses or trains. Because of this, residents rely on hordes of taxis, thus adding to the congestion. Yet another contributing factor is the layout of the island. This limits road construction.","The resulting gridlock has several adverse effects. First of all is the frustration and anger felt by road-users. This can result in tension and accidents, and, ironically, emergency vehicles may not even be able to reach the scene of such accidents. Another effect is the waste of time spent in traffic. This lowers productivity at work and contributes to reduced time at school and with family. There are also additional costs to the city in terms of air pollution and unnecessary fuel consumption. Shopping and daily errands become more of a chore, and the city suffers.","Commuters and road-users will need to cooperate with municipal authorities as they introduce measures to reduce congestion. However, Abu Dhabi has shown its ability to rise to challenges in the past, and most residents are confident that the city will still be an attractive place to live as the problem of traffic is addressed."],"id":153,"t":"problem","c":4},{"n":154,"topic":"COUNTRY","q":"Should wealthy nations be required to share their wealth among poorer nations by providing such things as food and education? Or is it the responsibility of the governments of poorer nations to look after their citizens themselves?","p":["I think wealthy nations should be required to share their wealth among poorer nations. But their helping should only stop at providing such things as food and education because of three following reasons. Firstly, citizens of both wealthy nations and poorer nations are human beings. Therefore, we can not look at, hear of, and talk about people who lack food, education, etc… without compassion and sympathy. Sharing wealth among poorer nations is not only a good deed but also a task itself.","Secondly, many nations in Africa and Asia are very very poor. Famine, diseases, crime and illiteracy are killing their citizens. In the contrary, a lot of nations in Europe and America are too rich. If there are no actions taken, this inequality will increase dramatically. Poor countries will become more and more poorer while rich countries will become more and more richer. As a result, poorest countries will be slaves of richest countries. So, sharing wealth is an useful way to prevent people from that bad future.","Thirdly, although sharing wealth among poorer nations is very necessary but this helping should only stop at providing such things as food, medicine and education. Or else, poor nations may depend on aid. They won’t have enthusiasm to build their countries by themselves. Moreover, rich nations can take advantage of sharing wealth to interfere deeply in poor nations’ governments. This can’t be considered humane action and should be prevented.","In my opinion, sharing wealth among poorer nations has both bad side and good side. What we have to do is avoiding its bad side and practicing its good side.","This is an excellent essay, your arguments are convincing and very well presented. There are only a few minor mistakes, read and consider the comments. Very well done!"],"id":154,"t":"opinion","c":5},{"n":155,"topic":"COUNTRY","q":"Improvements in health, education and trade are essential for the development of poorer nations. However, the governments of richer nations should take more responsibility for helping the poorer nations in such areas.","p":["Today?s world has been divided into developing and industrialised countrieswhich the main difference between them is the amount of money that governments apply in important sectors such as education, health and commerce. Most of the poorer nations are buried in debts as a result of their unbalanced finances which are reflect in a failed health care, an unstructured education system and a weak international trade. This vicious cycle will continue indefinitely unless wealthier nations show interest in minimizing the worldwide economic differences, as well as taking more responsibility for assisting unfortunate countries.","Most of the African countries live in sub-human conditions because of the extreme poverty, upheaval, hunger, disease, unemployment, lack of education and both inexperienced and corrupt administrations. The devastating consequences of the AIDS epidemic in those countries could improve if the infected populations receive free drugs to control the disease, have access to health professionals and get information on how to prevent its spread. But this can only be achieved through international help programs in which leaders of the world?s richest countries donate medicine and also send doctors and nurses to treat and educate those in need.","Moreover, most of the poor countries rely on selling agricultural products and raw material to rich nations and buying industrialized products from them resulting in a huge financial deficit. Consequently, they borrow a significant amount of money from the World Bank to try to improve their broken economies, but sometimes the money disappears with no significant changes and they cannot even pay the interest to the bank. Regarding this issue, last year the G8, which is comprised of leaders of the eight richest nations, decided to forgive billions of dollars worth of debt owed by the world?s poorest nations. In addition, they developed adequate loan programs to financially assist those countries.","In conclusion, leaders of the industrialised countries play an indispensable role in assisting developing nations deal with essential areas such as health, education and trade. Also, their aid is the key to breaking the vicious cycle, which results in poverty and death.","This is an amazing essay, looks like Band 8 to me, nothing to improve here."],"id":155,"t":"opinion","c":5},{"n":156,"topic":"COUNTRY","q":"The wealth gap between 1st world countries and 3rd world countries seems to be increasing. How can we reduce this gap? Do you think that developed countries have a duty to assist developing countries in every way?","p":["Every day the rich countries in the world get richer and the poor countries get poorer. Can we reduce this gap? Of course we can. The question is whether the people in power want to do it?","Reducing the wealth gap can be achieved by cancelling third world debt, cancelling trade and farming subsidies so that third world countries can compete, getting rid of third world corruption and investing and building in third world countries using local people and skills and allowing them ownership of businesses. There are other things as well. Unfortunately there is no profit in business for first world countries to do these things. Some will do them but most will not. The ordinary man on the street wants things to be better for poorer countries and the politicians say that they will help but the politicians will in the end do what business tells them to do. Politicians also rightly feel they have a duty to protect their own countries and keeping economically dominant is part of this duty. Creating effective competition for their own country‛s businesses is not part of what they are expected to do.","This then leads on to whether I believe that developed countries have a duty to help the developing countries. Yes, I do. As an individual I believe that we have a duty to assist the poorer countries with their development in all aspects. We can provide teachers and education and doctors on the small scale and on the larger scale the things that I have talked about in the previous paragraph. Can we do this? Yes. Will we do this? See the previous paragraph again.","In conclusion you can see that I believe that there is a split between what would happen in a perfect world and what actually happens. We have a duty to reduce the wealth gap between developed and developing countries and we can do it, but it is unlikely that this will happen quickly.","(329 words)"],"id":156,"t":"opinion","c":4},{"n":157,"topic":"COUNTRY","q":"Should rich countries help poorer ones?","p":["Or does it only help the rich country by keeping the poorer country dependent?","Today, the world is becoming more and more closely linked. Trade has increased and the movement of people between countries is greater than ever before. However, billions of people still live in poverty, and in many places, the gap between rich and poor is widening. This essay will look at the arguments for and against helping poor countries.","There are many reasons for helping poor countries. First of all, there are humanitarian reasons. Like individuals who give to charity, many countries feel it is their religious, social, or moral duty to help people in other countries who are suffering from famine, drought, war, or disease. However, many rich countries also donate money for political or diplomatic reasons. They want to maintain a relationship of dependency with the recipient, or simply to influence the government and direction of the country. A further reason why many countries help poorer ones is for economic reasons. The donors may want to control the supply of commodities such as oil, water, or wheat. Alternatively, the richer country may want to ensure markets for their own products, whether these are planes, computers or shoes.","However, aid is not necessarily the best way to help a country. For one thing, billions of dollars of aid often goes missing, into corrupt governments or inefficient administration. A second point is that many foreign aid projects are unsuitable for the target country. Many agencies build huge dams or industrial projects that fail after a few years or that do not involve the local people. Furthermore, much aid returns to the donor. This can be in the form of expensive specialized equipment and experts from the donor country.","There are many other ways we can help poor countries. Opening up trade barriers, so that poor countries can sell their goods is one way. Another is to remove subsidies so that imported goods from poorer countries can compete fairly. A third method is to forgive debts. Many poor countries have huge interest repayments on old loans.","The needs of the poorer countries may seem obvious. However, although our humanity makes us want to help eliminate poverty and suffering, we must examine the real needs of poor countries and implement solutions that will benefit both them and us."],"id":157,"t":"opinion","c":6},{"n":158,"topic":"LEISURE","q":"Some people think that it is important to use leisure time for activities that improve the mind, such as reading and doing word puzzles. Other people feel that it is important to rest the mind during leisure time.","p":["It is generally accepted that we all need leisure time to recover from the stresses of work and everyday life. Personally, I prefer to be active during this time, as I think this suits me better. However, what we do with our leisure time is up to us and no one can say that any particular activity is the best.","Some people relax by watching movies, reading or surfing the internet. People who have physically demanding jobs may choose these types of activities. If you are a nurse or builder, you may feel that you don't want to do a five-kilometre run after work, because you are already physically tired.","Other people do very sedentary jobs. Computer analysts, for example, may spend all day sitting in front of a computer screen. At the end of the working day, they may be keen to stretch their limbs and improve their health by swimming or going to the gym.","Another factor that influences our choice of leisure pursuit is where we work. People who work indoors often prefer outdoor hobbies, whereas for people who work outdoors, the reverse may be true. I am a student myself and this involves a lot of sitting in lectures, so I need to get out into the fresh air afterwards.","In any situation, the important thing is that people need to stay healthy by choosing what is best for them. The only wrong way to spend free time, in my view, is to have a sedentary job and then go home and watch television."],"id":158,"t":"other","c":5},{"n":159,"topic":"LEISURE","q":"Some people prefer to plan activities for their free time very carefully. Others choose not to make any plans at all for their free time. Compare the benefits of planning free-time activities with the benefits of not making plans. Which do you prefer - planning or not planning for your leisure time? Use specific reasons and examples to explain your choice.","p":["Nowadays people have so many things to do that they almost always do not have enough time for it. When we go to bed we carefully think and plan our next day and it continues day in and day out. We wake up, recollect our checklist with things to do and in a few minutes we are already in a car on our way to the office. Often people do not have time for themselves. So, when people have some spare time they want to use it wisely. Some people prefer to plan activities for their free time very carefully. However, others prefer not to make any plans. In this essay I will analyze both cases and present my view in favor of planning free-time activities.","From the one side, not making any plans and just letting the time pass by for some time have some benefits. First of all, a person can just relax, enjoy the beautiful moments, spend his or her time with loved ones, watch a movie, listen to relaxing music, observe the flowers in bloom from the window, contemplate about his or her life and just slow down the pace of life. I think it is a very good way to eliminate one's stress and tension and just leave all troubles and worries behind.","From the other side, careful planning can bring many benefits too. First of all, one can travel. However, traveling requires some planning to be made. For example, one most likely will need a hotel room. So, the reservation should be made beforehand. Also, it is wise to check one's car to avoid breakdowns and have an uninterrupted worry-free trip. Second of all, planning one's activities allows to spend one's free time the way he/she likes. For instance, if I want to play tennis on incoming week-end I will certainly make a reservation for a court because in this case I will not be disappointed with the waste of my time. Personally, I prefer to make plans for my free time because it allows me to spend my vacation or week-ends the way I want it.","To sum up, I think careful planning allows people to derive maximum benefits from their free time. However, I must confess sometimes I allow my self just to stay at home with my friends and family and not make any plans. (394 words)"],"id":159,"t":"opinion","c":4},{"n":160,"topic":"ECONOMIC","q":"Do you agree or disagree with the following statement? Businesses should do anything they can to make a profit. Use specific reasons and examples to support your position.","p":["I do not agree with the statement that businesses should do anything they can to make a profit. I state my opinion on the following points.","First of all, every company must have its moral code. It means that a company should treat its clients properly and respect their rights. Of cause a company may lose a part of its profit but security of its clients must be on the first place. Otherwise, clients will switch to another company and never be back. For instance, a few years ago \"Jonson&Jonson\" produced a new type of painkillers. Unfortunately, this product was not tested properly. As a result of this many people died and received injures. The president of the company made a crucial decision to call back all painkillers from all distributors and pay to all injured customers for their treatment. It cost a lot of money for the company but it saved its image and clients. It was a very difficult decision, but the president of the company understood that it would cost him even more in the future because he would not be able to return clients' respect. Loosing customers means for a company loosing its profit.","Second of all, in order to succeed in the modern world companies have to compete with each other. Many companies lose their profit decreasing prices on their products. They do not aspire for extra profit but for clients' satisfaction. Companies do it because they want their products sold and their customers satisfied. They offer discounts, free delivery, free service, free Internet access, good return service, etc. All these are done to make their old customers happy and attract new clients.","To sum up, I think a company, which the only goal is profit will not succeed nowadays. Otherwise, companies that respect their clients and want to see them satisfied will make a fortune.","(311 words)","YOUR OPINION & HOWNTOWN & COUNTRY"],"id":160,"t":"opinion","c":4},{"n":161,"topic":"ECONOMIC","q":"Discuss the advantages and disadvantages of having a car.","p":["Nowadays, as roads are becoming more and more crowded, people are considering both the advantages and disadvantages of having a car before they buy one.","The main advantage of the car is that it gives the freedom to travel when and where you want, without being limited to fixed routes and timetables. What is more, you can carry several passengers and as much luggage as you like, at no extra cost. In addition to this, you can travel in comfort in a car, with a seat to yourself and the possibility of comforts such as a music system and air conditioning.","On the other hand, owning a car is very expensive. As well as the price of the car, the cost of tax, insurance, petrol and repairs must also be considered before buying. Moreover, the increase in traffic means that drivers are spending more and more time stuck in traffic jams. Perhaps the major disadvantage of cars in general is the huge damage that they do to human life and to the environment, and all motorists much accept that they are making a small contribution to this.","To sum up, provided you have access to an efficient public transport system, then buying and running your own car could be considered an expensive luxury.","(213 words)"],"id":161,"t":"advdis","c":4},{"n":162,"topic":"ECONOMIC","q":"Research indicates that the characteristics we are born with have much more influence on our personality and development than any experiences we may have in our life. Which do you consider to be the major influence?","p":["Today the way we consider human psychology and mental development is heavily influenced by the genetic sciences. We now understand the importance of inherited characteristics more than over before. Yet we are still unable to decide whether an individual’s personality and development are more influenced by genetic factors (nature) or by the environment (nurture).","Research, relating to identical twins, has highlighted how significant inherited characteristics can be for an individual's life. But whether these characteristics are able to develop within the personality of an individual surely depends on whether the circumstances allow such a development. It seems that the experiences we have in life are so unpredictable and so powerful, that they can boost or over-ride other influences, and there seems to be plenty of research findings to confirm this.","My own view is that there is no one major influence in a person's life. Instead, the traits we inherit from our parents and the situation and experiences that we encounter in life are constantly interacting. It is the interaction of the two that shapes a person's personality and dictates how that personality develops. If this were not true, we would be able to predict the behavior and character of a person from the moment they were born.","In conclusion, I do not think that either nature or nurture is the major influence on a person, but that both have powerful effects. How these factors interact is still unknown today and they remain largely unpredictable in a person’s life.","(249 words)"],"id":162,"t":"opinion","c":4},{"n":163,"topic":"ECONOMIC","q":"Do you agree or disagree with the following statement? A person should never make an important decision alone. Use specific reasons and examples to support your answer.","p":["From my everyday experience and observation I can claim that discussion of an important decision with other people bring many benefits. In the following paragraphs I will give my reasons to defend this statement.","First of all, different people have different opinions. In order to make the right choice people should discuss every possible decision and its consequences. Making an important decision alone can bring many negative aspects. For instance, a person can reveal his selfishness or impatience and the consequences of that decision can affect many people in the future. I think that a good and wise decision can be born only in discussion because people can share their knowledge and experiences a look at the problem from different sides and aspects.","Second of all, I think that making decision alone is unacceptable especially for a company. Imagine that a chief makes the decision about increasing a production line without discussing it with his employees. In this case a part of company's profit will be spending on extended purchase of raw materials. So, share holders will be left without dividends. This decision may lead to getting rid of company's shares and as a result of this declining the value of a company as a whole.","To sum up, I think that a person should always consult his relatives or colleges when making an important decision to avoid possible mistakes.","(230 words)"],"id":163,"t":"opinion","c":4},{"n":164,"topic":"ECONOMIC","q":"You have decided to give several hours of your time each month to improve the community where you live. What is one thing you will do to improve your community? Why? Use specific reasons and details to explain your choice.","p":["I think the question what would I do if I had a chance to improve my community is difficult. I have in my mind many things, the improvement of which will make our community better place to live but they all require the participation of many people and, moreover, they require investments, which I can not provide. For example, my community is quite noisy. We have the huge mall just in front of our community, so traffic jams are very common for this place. I think that the construction of a few pass-by roads will benefit all people who live here as well as people who drive by every day.","Unfortunately, the question is what I can do for my community giving a few hours of my time every month. I think I can not do much, but I still can help someone in my community. For example, I can baby-sit. I know a couple of families with little children, who can not afford to spend much money on the baby-sitter. One of these families is a single mom with a little girl. Julia, this is her name, is a waitress in a restaurant. She is a great person and we became close friends. So, sometimes I offer her help with her child when she has to work in the evenings. Another family has two funny little twins. One time their parents asked me to babysit their children because they had to attend an unexpected presentation.","I think this kind of help brings many benefits to my community. First of all, people become friendlier. For example, those families, which I mentioned above, became friends after I introduced them to each other. Second of all, people get to know each other and feel more secure in their houses and apartments. Finally, I am ready to help those people because I am sure that they will help me too. One time I lost the keys from my car and Julia offered me her car for a while.","To sum up, I believe that baby-sitting is a great way to help my community in many aspects.","(353 words)"],"id":164,"t":"problem","c":4},{"n":165,"topic":"ECONOMIC","q":"If you could change one important thing about your hometown, what would you change? Use reasons and specific examples to support your answer.","p":["If I could change one thing about my hometown, I think it would be the fact that there’s no sense of community here. People don’t feel connected, they don’t look out for each other, and they don’t get to know their neighbors.","People come and go a lot here. They change jobs frequently and move on. This means that they don’t put down roots in the community. They don’t join community organizations and they’re not willing to get involved in trying to improve the quality of life. If someone has a petition to put in a new street light, she has a very hard time getting a lot of people to sign. They don’t feel it has anything to do with them. They don’t get involved in improving the schools because they don’t think the quality of education is important to their lives. They don’t see the connection between themselves and the rest of their community.","People don’t try to support others around them. They don’t keep a friendly eye on their children, or check in on older folks if they don’t see them for a few days. They’re not aware when people around them may be going through a hard time. For example, they may not know if a neighbor loses a loved one. There’s not a lot of community support for individuals.","Neighbors don’t get to know each other. Again, this is because people come and go within a few years. So when neighbors go on vacation, no one is keeping an eye on their house. No one is making sure nothing suspicious is going on there, like lights in the middle of the night. When neighbors’ children are cutting across someone’s lawn on their bikes, there’s no friendly way of casually mentioning the problem. People immediately act as if it’s a major property disagreement.","My hometown is a nice place to live in many ways, but it would be much nice if we had that sense of community."],"id":165,"t":"problem","c":5},{"n":166,"topic":"ECONOMIC","q":"A foreign visitor has only one day to spend in your country. Where should this visitor go on that
