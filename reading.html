d financial terms? How do we agree about the medical efficacy of various screening programmes, for example, when the medical establishment itself does not agree? A very rigorous process of evaluation is called for, so that we can make informed decisions."],"id":96,"t":"opinion","c":4},{"n":98,"topic":"FOREIGN LANGUARE","q":"Studying the English language in an English-speaking country is the best but not the only way to learn language. Do you agree or disagree with this statement?","p":["Studying a language in a country where it is widely spoken has many advantages. It is, therefore, a good idea to study English in a country such as Britain. However, I believe it is not the only way to learn the language.","In the first place, most students in non-English-speaking countries learn English at secondary school, and sometimes at university nowadays. Although their spoken English is not usually of a very high standard, their knowledge of grammar is often quite advanced. This is certainly useful when students come to an English-speaking country to perfect the language.","Secondly, studying the basics of English at secondary school is less stressful than learning the language while overseas. This is because students living at home do not have to worry about problems such as finding accommodation, paying for their study and living costs, and trying to survive in a foreign country where day to day living causes much stress.","However, there are obvious advantages of learning English in Britain. Every day there are opportunities to practise listening to and speaking with British people. Also, students can experience the culture firsthand, which is a great help when trying to understand the language. This is especially true if they choose to live with a British family, as exchange students for example. Furthermore, if students attend a language school full-time, the teachers will be native speakers. In this case, not only will students' speaking and listening skills improve, but attention can be given to developing reading and writing skills as well.","In general, even though it is preferable to study English in an English-speaking country, a reasonable level of English can be achieved in one's own country, if a student is gifted and dedicated to study."],"id":97,"t":"opinion","c":5},{"n":99,"topic":"FOREIGN LANGUARE","q":"Learning a foreign language offers an insight into how people from other cultures think and see the world. The teaching of a foreign language should be compulsory at all primary schools. To what extent do you agree or disagree with this view?","p":["Clear statement followed by a question based on the premise.) Language is linked to the identity of a nation, and speakers of a common language share many things, but does this give governments the right to restrict the way a language is used or taught?","(Concession mode to the \"For\" case, but followed by the Against' point of view. An example is given which comments on the likely effectiveness of such a policy.) It can be argued that a nation maintains its culture through its language, and so there is a need to restrict the use of foreign words and changes in pronunciation. However, in reality this approach is fruitless, because language is a living thing and it is impossible to stop it from changing. This policy has been tried in some countries, but it never works. People, especially young people, will use the language that they hear around them, and which separates them from others; stopping the use of certain words will only make them appear more attractive.","(Puts the case Against' governments preventing spelling reform, but concedes it may be useful.) As for spelling, we all know that the English system is irregular and, I believe, it would benefit from simplification so that children and other learners do not waste time learning to read and write. On the other hand, some people may feel, perhaps rightly, that it is important to keep the original spelling of words as a link with the past and this view is also held by speakers of languages which do not use the Roman alphabet.","(Puts both sides of the argument about which language to use in schools.) While it is important for people who speak a minority language to be able to learn and use that language, it is practical for education to be in a common language. This creates national pride and links people within the society. Realistically, schools are the best place for this to start.","(Ends with a clear statement.) Ultimately, there is a role for governments to play in the area of language planning, particularly in education, but at no time should governments impose regulations which restrict people's linguistic freedom."],"id":98,"t":"opinion","c":1},{"n":100,"topic":"FOREIGN LANGUARE","q":"Millions of people every year move to English-speaking countries such as Australia, Britain or America, in order to study at school, college or university. Why do so many people want to study in English? Why is English such an important international language?","p":["I am not surprise when I read in the newspapers that many people move to English speaking countries. I am an engineer in a process control since ten years and I understand the necessity of English language. For example, when I read technical English specifications, when I meet Japanese Industrials to build together some electronic materials or when I go on holidays in Italy where the best way (for me) to communicate is to speak English. Therefore, today, it's necessary to learn English and the best way is to study in English as soon as possible when we are at school but also when we have a job. It's so Important to communicate with foreigners, because of work. For example: to seafoods in USA, to build electronic cards with the Japanese, to obtain a certification with FDA (American organization) in order to sell some pharmaceutical products. In fact, jt's Important for everybody, the workers, the visitors, the scientists, etc ...","These are the main reason which explain why so many people go to English speaking countries (the best way to learn) and why English is such an Important International language (the communication between many the people over the world).","Comment:","This is an answer written by a candidate who achieved a Band 6 score. Here is the examiner's comment:","This response is underlength and is marked down because of this. Only a few relevant ideas are presented and these are used rather repetitively and are insufficiently developed or supported. However, the writing communicates fluently and a satisfactory range of structures and vocabulary are used."],"id":99,"t":"two","c":2},{"n":101,"topic":"ETHICAL ISSUES","q":"By punishing murderers with the death penalty, society is also guilt of committing murder. Therefore, life in prison is a better punishment for murderers. To what extent do you agree or disagree with this statement? (AGREE)","p":["\"Do as I say, not as I do.\" This is what society tells us when it punishes murderers with the death penalty. Society tells us that murder is wrong, and in our legal system, murder is against the law. Yet we still see our society kill murderers, and thus we are committing murder ourselves. For this reason, the death penalty should end, and instead murderers should be punished with life in prison.","Society needs to show a positive model of how our lives should be and how people should act. We should always strive to improve our situation, to be at peace and in harmony with others. However, when we kill murderers, we are not working to improve our society. Instead, we are stooping to the criminals' level.","It makes me think about the revenge that came when playing games with my brothers. When we were kids/children, my brother would take my toys, so I would hit him and take my toys back. Then he would hit me harder and take the toys again. Thinking of the death penalty, I imagine a murderer kills someone. Society takes revenge by killing the murderer. This leaves behind the murderer's family and friends, who have tremendous anger inside of them, which they may release onto society. The cycle of killing goes on and on.","Society should not condemn people who are taking the same action that society is taking. Society tells us not to kill, and yet society kills when it exercises the death penalty. Because of this contradiction, we should end the death penalty and instead punish murderers by sentencing them to life in prison.","(273 words)"],"id":100,"t":"opinion","c":4},{"n":102,"topic":"ETHICAL ISSUES","q":"Should animals be used in testing new drugs and procedures?","p":["Every year, millions of animals undergo painful suffering or death as a result of scientific research into the effects of drugs, food additives, cosmetics and other chemical products. While most people think animal testing is necessary, others are upset by what they see as needless suffering. This essay looks at some of the positive and negative aspects of animal testing.","Many medical treatments and procedures have been developed from experiments on animals. Since animals share many features with humans, scientists use animals to test the safety and effectiveness of newly developed drugs before pilot testing on small groups of patients. Medical teams practice new operating techniques such as transplants on animals. Without animal testing, many procedures or new drugs would be extremely unsafe.","However, many people are concerned that animals are suffering unnecessarily and cruelly. They do not believe that every new drug needs to be tested on animals, especially with the huge database of knowledge and modern computer models. They also are worried that many animal tests are ineffective, pointing out that any drugs have had to be withdrawn from the market despite extensive testing. They particularly feel that animal testing should not be used for non-essential products such as cosmetics, shampoos, soaps, and cleaning products. Furthermore, some campaigners would like to see certain tests replaced and more humane methods used.","We need to make sure that the millions of animals who are used for testing new products are treated with the minimum of suffering. Although some animal testing may be unavoidable at present, treating our fellow creatures as mercifully as possible will demonstrate our humanity.","Animal Testing : yes Every day, thousands of people are saved from painful diseases and death by powerful medical drugs and treatments. This incredible gift of medicine would not be possible without animal testing. Despite these overwhelming benefits, however, some people are calling for animal testing to be banned because of alleged cruelty. This essay will examine arguments for and against animal testing. Those against the use of animal testing claim that it is inhumane to use animals in experiments. I disagree completely. It would be much more inhumane to test new drugs on children or adults. Even if it were possible, it would also take much longer to see potential effects, because of the length of time we live compared to laboratory animals such as rats or rabbits. Opponents of animal testing also claim that the results are not applicable to humans. This may be partly true. Some drugs have had to be withdrawn, despite testing. However, we simply do not have alternative methods of testing. Computer models are not advanced enough, and testing on plants is much less applicable to humans than tests on animals such as monkeys. Until we have a better system, we must use animal testing. A further point often raised against animal testing is that it is cruel. Some of the tests certainly seem painful, but the great majority of people on this planet eat meat or wear leather without any guilt. Where is their sympathy for animals? Furthermore, animals clearly do not feel the same way as humans, and scientists are careful to minimize stress in the animals, since this would damage their research. I agree that we need to make sure that animals who are used for testing new products have the minimum of suffering. However, I am convinced that animal testing is necessary, and that it will continue to benefit humans in new and wonderful ways. Animal Testing : no Advantages of Animal Testing in Medical Research Medical research involving animals has dramatically improved the health of the human race. Without animal testing, the cure for polio would not exist and diabetics would suffer or die from their disease. Despite these benefits, some people believe that animals should be not be used for testing medical techniques and drugs. This essay will outline the advantages of animal testing. Animal testing allows scientists to test and create new drugs. Animals such as monkeys or rabbits have similar physical processes to humans. This allows scientists to test the effects of certain drugs. If a drug produces adverse effects in animals it is probably unfit for human use. Animal testing is cheap. There is a large supply of animals for medical research. Animals are easily bred, and maintained safely in controlled labs. The costs of testing in humans would be extremely high. Many people argue that animal testing is cruel. In some cases this is true. However it would be much more cruel to test new drugs on people or children, or to let people die because there was not enough information about a drug. Furthermore, legislation in most countries sets standards for animal treatment, and laboratories have guidelines to prevent cruelty. Opponents of animal research also say that information from animals does not apply to humans. They point to certain commercial drugs which have been withdrawn because of side-effects in humans While it is true that animal systems differ from human systems, there are enough similarities to apply information from animals to humans. Animal rights campaigners claim that we don’t need new tests because we already have vast amounts of information. However, many new deadly infections appear every year and new treatments and drugs are needed to combat these deadly plagues.","Animal testing is needed in the world we live in. Our responsibility is to manage the animals in our care and balance their suffering against the good that comes from them.","321 words"],"id":101,"t":"opinion","c":7},{"n":103,"topic":"BUILDING","q":"It has recently been announced that a new movie theater may be built in your neighborhood. Do you support or oppose this plan? Why? Use specific reasons and details to support your answer.","p":["I live in a small community. From my everyday experience and observation I can say that the idea about building a new theatre in my neighborhood has some advantages as well as disadvantages. In this essay I will first focus on the reasons why I support this idea and then move on to analyzing why I oppose it.","First of all, I like movies and my husband and I sometimes go to the movie theatre to watch premieres. Unfortunately, it is time-consuming for us. We have to drive about 50 minutes to the nearest movies theatre. So, the idea of having a movie theatre in our neighborhood seems very attractive. It would save us an hour just to get there and another hour to get back home. Another important aspect of it is that in this case we will be able to get to the movie theatre by foot. I must to confess that we always have parking troubles in the parking space near the movie theatre.","Second of all, new movie theatre is a very good place for students who want to earn some money. My husband and I live near a student community, so I think it would be a great news for them. In addition to this practical benefit students will be able to watch all movies free of charge. I suppose it is a great way to save some money.","Finally, there are usually many restaurants and entertaining centers around a movie theatre. There people can have dinner or play game machines.","In contrast, I think that the building of a new movie theatre will destroy the silence and beauty of out community. Such entertaining centers are often noisy. Moreover, traffic jams will probably be the result of it.","In conclusion, I think that if the question was about building a new movie theatre in the next neighborhood I would completely agree.","(316 words)"],"id":102,"t":"problem","c":6},{"n":104,"topic":"BUILDING","q":"A company has announced that it wishes to build a large factory near your community. Discuss the advantages and disadvantages of this new influence on your community. Do you support or oppose the factory? Explain your position.","p":["I am from Saint-Petersburg, Russia. I believe that building a large factory near my community has advantages as well as disadvantages. In the following paragraphs I will list basic benefits and losses that will be brought by a new factory.","For several reasons, I think that a new factory will not be a good addition to my neighborhood. First of all, factories often bring pollution. They are prone to contaminating the local air and water. Second of all, factories make noise. Another important aspect of building a new factory near by is that it will make the local traffic heavy. As a result of this, the amount of traffic congestions will increase, as well as contamination of the air. So, all these obviously will not make one's life happier and healthier in my community.","From the other side, I believe that a new factory will bring some advantages to my community. First of all, it will bring new job opportunities. Many specialists will be required to work there. Second of all, I think many local community facilities will have to be renovated to obtain reliable supply of water and electricity. So, some old pipes may be changed. Another important benefit of this is that the local roads in order to manage the increasing traffic will be rebuilt and widened.","However, I do not think that listed above benefits are worth all these troubles including water contamination and the constant pollution of air. From my point of view all factories must be built far from the people communities because they can be really harmful for people's health.","(266 words)","Sample 2:","New factories often bring many good things to a community, such as jobs and increased prosperity. However, in my opinion, the benefits of having a factory are outweighed by the risks. That is why I oppose the plan to build a factory near my community.","I believe that this city would be harmed by a large factory. In particular, a factory would destroy the quality of the air and water in town. Factories bring smog and pollution. In the long run, the environment will be hurt and people’s health will be affected. Having a factory is not worth that rise.","Of course, more jobs will be created by the factory. Our population will grow. To accommodate more workers, more homes and stores will be needed. Do we really want this much growth, so fast? If our town is going in growth, I would prefer slow growth with good planning. I don’t want to see rows of cheaply constructed townhouses. Our quality of life must be considered.","I believe that this growth will change our city too much. I love my hometown because it is a safe, small town. It is also easy to travel here. If we must expand to hold new citizens, the small-town feel will be gone. I mould miss that greatly.","A factory would be helpful in some ways. However, I feel that the dangers are greater than the benefits. I cannot support a plan to build a factory here, and hope that others feel the same way.","(251 words)"],"id":103,"t":"advdis","c":4},{"n":105,"topic":"BUILDING","q":"The government has announced that it plans to build a new university. Some people think that your community would be a good place to locate the university. Compare the advantages and disadvantages of establishing a new university in your community. Use specific details in your discussion.","p":["I think it is a great idea to build a new university in my community. However, I think it is a controversial question whether the building of a new university will bring only benefits to our community. In this essay I will analyze advantages and disadvantages of this issue and present my view in favor of establishing a new university in my community.","From the one side, establishing a new university in my community brings many benefits. First of all, a new construction means more job opportunities. I think it would be good for my community because many people have to spend much time driving to their work day in and day out because they could not find a job in our neighborhood. Second of all, a new university is a good chance to meet new people and I like this opportunity. Many students will live in our community. Finally, if a new university is built in my community there is a big chance that I will be willing to enroll in it. I think it is great because it is not far from my place and I do not have to move to another part of the city. Another important aspect of this is that people from my community will have a chance to use new libraries and facilities of a new university. For example some people can take courses and classes there.","From the other side, building a new university can bring some disadvantages. A new construction means noise, traffic jams and different kinds of pollution. In addition to these disadvantages, many young people in our community can cause more noise especially in the evenings.","To sum up, I think that I would support the decision of the government of establishing a new university in my community despite a few disadvantages that could follow this construction. I believe that a new university will increase a chance of many young people to get a higher education, gain more knowledge and experience, which will help them to succeed in today’s world.","(341 words)"],"id":104,"t":"advdis","c":4},{"n":106,"topic":"BUILDING","q":"Should a city try to preserve its old, historic buildings or destroy them and replace them with modern buildings? Use specific reasons and examples to support your opinion.","p":["Some people think that old, historic buildings are no need for the city and they should be destroyed and replaced with modern ones. However, other people believe that historic buildings must be preserved in order to know and remember our past. For several reasons that I will mention bellow I agree with those people who want to preserve old, historical buildings.","First of all, by preserving historical buildings we pass our history to our future generations. I think that out children should know their history, learn from it and respect it. People need to know their traditions and customs, which are priceless and irreplaceable. Our history is our knowledge and power. From my opinion we need to preserve and restore historical buildings. By destroying them we show our disrespect to our forefathers and their traditions.","Second of all, by preserving historical buildings a city can attract many travelers. Welcoming tourists a city can get many benefits including money, which can be spent on preserving historical buildings as well as on improving roads and facilities.","Also, many tourists mean a lot of new business opportunities. Another important aspect of this is that businessmen will be willing to build new recreational centers, hotels, movie theaters, shopping centers to make a city more attractive for travelers. In addition to those practical benefits, many people will have the opportunity to get a job. All this is good for the economy of the city.","To sum up, I believe that preserving old, historical buildings can bring only benefits to a city and all humankind.","(259 words)"],"id":105,"t":"opinion","c":5},{"n":107,"topic":"BUILDING","q":"In the past, buildings often reflected the culture of a society but today all modern buildings look alike and cities throughout the world are becoming more and more similar. What do you think is the reason for this, and is it a good think or a bad think?","p":["City has its architectural character, but the similarities between cities are more obvious these days than in the past. In my opinion, one reason for this is the high price of land.","In most large cities, land is scarce and consequently it is very valuable. This has led to the construction of tall buildings which occupy only a small area of land while providing lots of floor space where people can live or work. Buildings of this type are made of concrete and steel and can be built comparatively quickly using prefabricated materials. They do not use local materials, such as stone, timber or brick, which used to give cities their individual character. In consequence many cities. now look very much the same and you might not know whether you were in Brisbane, Bangkok or Berlin when you are on the street.","While I realise that we cannot stand in the way of progress, I believe that cities should try to keep some individuality. For example, in Paris it is prohibited to build very tall buildings in the centre of the city, as this would spoil the overall appearance of the skyline.","Other cities have chosen to design unique buildings to ensure they look different. The twin towers in Kuala Lumpur or the Opera House in Sydney are examples of this approach, and I agree with this kind of initiative.","All in all, although it is regrettable that modern cities look similar, I tend to feel that this is unavoidable. However, it can be argued that, even if the buildings are similar, cities will maintain their own character as a result of cultural diversity, the terrain and the climate, which ultimately determine how people live."],"id":106,"t":"opinion","c":5},{"n":108,"topic":"BUILDING","q":"In many major cities of the world, you will find large public buildings, both new and old. Discuss the advantages and disadvantages of such buildings. How important is it for a country to construct impressive public buildings when houses are want is really required?","p":["(Introduction: mention that public buildings exist in all cities and towns, large and small, e.g. post office, court pause, places of worship, theatre) A public building is a building that belongs in some way o the state. The number of public buildings in any town or village will depend on the size of that community and its needs. For example, you will usually find a town hall of some sort, a school and a place of worship at he least. In anger communities there will be a police station, law courts, a library and maybe a theatre funded by he state.","(Pros: city pride, beautiful to look at, useful/necessary buildings, create a city centre.) The desire to build impressive buildings is not new. The ancient cities of the Middle East and South America were designed with large public buildings to impress visitors and enemies and give a sense of pride. In modern times, outstanding public buildings still. create a great sense of local and national pride. They are what gives a city its character and they form asocial centre, a place where people like to meet.","(Cons: waste of public money, intimidating, nationalistic. Give opinion on whether they stop us from building houses or whether they can be compatible.) However, some people argue that governments have constructed unnecessary, and sometimes ugly, buildings simply to make themselves feel important. I tend to feel that such buildings may be a waste of public money but I am not sure we can claim that they prevent houses from being built, because these governments have often ensured that adequate housing was also available. Houses and public buildings can exist side by side.","(Conclusion - sum up the two parts to the answer. Leave the reader thinking.) The answer lies in finding ape right balance. We want o feel pride in our town, but we also want our citizens to have comfortable homes. It is hard to please everyone."],"id":107,"t":"advdis","c":1},{"n":109,"topic":"BUILDING","q":"In the past, buildings often reflected the culture of a society but today all modern buildings look alike and cities throughout the world are becoming more and more similar.","p":["city has its architectural character, but the similarities between cities are more obvious these days than in the past. In my opinion, one reason for this is the high price of land.","In most large cities, land is scarce and consequently it is very valuable. This has led to the construction of tall buildings which occupy only a small area of land while providing lots of floor space where people can live or work. Buildings of this type are made of concrete and steel and can be built comparatively quickly using prefabricated materials. They do not use local materials, such as stone, timber or brick, which used to give cities their individual character. In consequence many cities. now look very much the same and you might not know whether you were in Brisbane, Bangkok or Berlin when you are on the street.","While I realise that we cannot stand in the way of progress, I believe that cities should try to keep some individuality. For example, in Paris it is prohibited to build very tall buildings in the centre of the city, as this would spoil the overall appearance of the skyline.","Other cities have chosen to design unique buildings to ensure they look different. The twin towers in Kuala Lumpur or the Opera House in Sydney are examples of this approach, and I agree with this kind of initiative.","All in all, although it is regrettable that modern cities look similar, I tend to feel that this is unavoidable. However, it can be argued that, even if the buildings are similar, cities will maintain their own character as a result of cultural diversity, the terrain and the climate, which ultimately determine how people live."],"id":108,"t":"other","c":5},{"n":110,"topic":"LIFESTYLE","q":"Some people enjoy change, and they look forward to new experiences. Others like their lives to stay the same, and they do not change their usual habits. Compare these two approaches to life. Which approach do you prefer? Explain why.","p":["Some people like to live in the same house, have the same job and habits all their lives. However, others aspire to changes and new experience. Personally, for the several reasons, which I will explain bellow, I prefer the first approach to life.","First of all, changes in one's life bring many benefits. One tries new things, gains new knowledge and experience. I think it is great because without changes life becomes boring. I always try to make changes in my life. Moreover, when I feel that my life is boring I do not feel well about it. I feel like I spent those days for nothing. I did not do anything exiting, I learnt nothing interesting and I just waisted my time.","Second of all, people need changes. Furthermore, we need obstacles to overcome and reach our goals. I believe that changes make us stronger, more persistent, more self- confident, and more patient. Also, I feel that all people who succeeded in life like changes and new experience because it is impossible to be the best at some field without perfecting the present knowledge and gain new experience. People catch every opportunity to learn more and change their life for the best.","From the other side, people who like their lives to stay the same are very permanent. They have the same job all their life, the same habits, the same week-ends and even the same years in years out. I think it is boring. What will they tell their children about their lives? What kind of contribution will they make for the society? I think such people are just afraid of changes.","I think curiosity and aspiration to the new experience are two of the main reasons of human evolution. People always wanted to break limits and gain more knowledge and experience. So, people who enjoy change are the engine of human development. (314 words)"],"id":109,"t":"two","c":5},{"n":111,"topic":"LIFESTYLE","q":"Some people prefer to eat at food stands or restaurants. Other people prefer to prepare and eat food at home. Which do you prefer? Use specific reasons and examples to support your answer.","p":["Man, through the ages, has undergone any changes from the time when he had to haunt for food to these days when he has to buy it. Some people prefer to buy fresh vegetables, meat and fruits and prepare food at home. However, other people prefer to skip that step with cooking and have dinner at a restaurant. I think that both of these choices have some advantages and disadvantages. Bellow I will give some reasons to support my answer.","Personally, I do not like fast food. So, my choice is always between a restaurant and my home. First of all, I would like to say that cooking is a great tradition. It helps people to relax, reflect on some pleasant moments while peeling or cutting the vegetables. It is a means of eliminating one's stress and tension. Second of all, sometimes I do not want to have something too complicated for my dinner. I just want to have light food like a salad and a glass of milk. So, one of the reasons why I like to eat at home is because I can have what I want at this moment. One greater thing about eating at home is that I can sit in front of the TV and watch an interesting program or a movie. Finally, having dinner at home allows a family communicates with each other, be closer and share some good and bad moments that happened earlier that day. Besides, eating at home is a great way to save some money.","As for restaurants, I see some positive aspects about eating there too. First of all, I sometimes get tired from peeling, cutting, washing, frying, etc. It does not mean I do it a lot. Sometimes I just use the microwave and a preprocessed food that I bought earlier. I want to have something more delicious than I have in my refrigerator, something that is time-consuming to prepare at home. So, for me it is a good reason to go to a restaurant. There one may meet old friends or just has a great time listening to music and tasting some delicious meats.","Also, restaurants are a good place to celebrate something. One does not have to prepare food for all friends who are coming, wash dish, put in order all that mess after the party, etc.","In conclusion, I think that it does not important where one has one's dinner. What important is that it must be full and nutritious."],"id":110,"t":"discuss","c":5},{"n":112,"topic":"LIFESTYLE","q":"Fashion trends are difficult to follow these days and it’s widely believed that they primarily exist just to sell clothes. Some people believe that we shouldn’t follow them and that we should dress in what we like and feel comfortable in. To what extent do you agree or disagree with this opinion?.","p":["It’s widely believed in today’s materialistic world that the latest innovative fashion trends hold great significance. On the other hand, such trends are believed to be set only in the pursuit of profits for large designer companies. It seems that in recent times, people are now changing their minds in regards to wearing clothes for comfort and as a personal choice. Personally I agree that we should pay more attention to individuality and comfort in the way we dress.","Firstly, fashion designs exist as a form of creative artistic expression of the designer. Although this may be true, undoubtedly such designs take away individuality once a trend is set in place. By this I mean that there is nothing unique about wearing what everybody else does. More specifically, if everyone sports the latest colour and design in summer skirts, do we not look the same?","Secondly, It is possible that fashion trends can look extremely stylish to the general public. However, it can be argued that the main purpose of wearing clothes is for more functional reasons. This is primarily due to the fact that clothes were traditionally worn to protect people from climatic conditions. For instance, clothes are still worn basically to keep people warm and dry in winter and cool in summer.","Finally, fashion certainly gives us a sense of confidence and pride in our appearance. While this is certainly a good point, it also means that following such changeable trends proves to be expensive. For example, purchasing every latest season’s fashion item will of course blow the budget of many young people.","In conclusion, there are various arguments to support the dismissal of fashion trends, consisting of not conforming, comfort and price, which I strongly agree with.","(290 words)"],"id":111,"t":"opinion","c":5},{"n":113,"topic":"LIFESTYLE","q":"Nowadays, food has become easier to prepare. Has this change improved the way people live? Use specific reasons and examples to support your answer. The twentieth century has brought with it many advances. With those advances, human lives have changed dramatically. In some ways life is worse, but mostly it is better. Changes in food preparation methods, for example, have improved our lives greatly.","p":["The convenience of preparing food today is amazing. Even stoves have gotten too slow for us. Microwave cooking is much easier. We can press a few buttons and a meal is completely cooked in just a short time. People used to spend hours preparing an oven- cooked meal, and now they can use that time for other, better things. Plus, there are all kinds of portable, prepackaged foods we can buy. Heat them in the office microwave, and lunch at work is quick and easy.","Food preparation today allows for more variety. With refrigerators and freezers, we can preserve a lot of different foods in our homes. Since technology makes cooking so much faster, people are willing to make several dishes for even a small meal. Parents are more likely to let children be picky, now that they can easily heat them up some prepackaged macaroni and cheese on the side. Needless to say, adults living in the same house may have very different eating habits as well. If they don’t want to cook a lot of different dishes, it’s common now to eat out at restaurants several times a week.","Healthful eating is also easier than ever now. When people cook, they use new fat substitutes and cooking sprays to cut fat and calories. This reduces the risk of heart disease and high cholesterol. Additionally, we can buy fruits and vegetable fresh, frozen or canned. They are easy to prepare, so many of us eat more of those nutritious items daily. A hundred years ago, you couldn’t imagine the process of taking some frozen fruit and ice from the freezer, adding some low-fat yogurt from a plastic cup and some juice from a can in the refrigerator, and whipping up a low-fat smoothie in the blender!","Our lifestyle is fast, but people still like good food. What new food preparation technology has given us is more choices. Today, we can prepare food that is more convenient, healthier, and of greater variety than ever before in history."],"id":112,"t":"problem","c":4},{"n":114,"topic":"LIFESTYLE","q":"Nowadays food has become easier to prepare. Has this change improved the way people live?","p":["Food is a basic part of life, so it follows that improved methods of food preparation have made our lives better. Nowadays we can prepare meals much faster than we could in the past. We can also enjoy a greater variety of food and eat more healthfully, all because of modern methods of food preparation.","Microwave ovens have made it possible to prepare delicious food quickly. People these days rarely have time to shop and prepare meals the old-fashioned way. We live very fast lives. We are busy working, caring for our families travelling, playing sports, and many other things. Because of microwave ovens, we have time to enjoy a good meal with our family and then play soccer, go to a movie, study, or do anything else we want to afterwards.","Modern methods of preserving food have made it possible to enjoy a wide variety of food. Because of refrigerators, freezers, canning, and freeze-drying, we can eat fruits and vegetables that come from far away places. We can prepare a meal one day and save the leftovers in the refrigerator or freezer to eat at another time. We can keep different kinds of food in the refrigerator or on the shelf. Its easy to always have food available and to be able to eat completely different meals every day.","Healthful eating is easier now than it ever was. Because of modern transportation methods, fresh fruits and vegetables are available all year round. Modern kitchen appliances make it easy to prepare fruits and vegetables fro cooking. Bread machines make it possible to enjoy healthful, home-baked bread whenever we like. We can eat fresh and healthful food everyday because modern methods have made preparation easy.","Our lifestyle is fast, but people still like good food. New food preparation methods have given us is more choices. Today we can prepare food that is more convenient healthier, and of greater variety than ever before in history.","Some people prefer to spend their lives doing the same things and avoiding change. Others, however, think that change is always a good thing.","Discuss both these views and give your own opinion.","Over the last half century the pace of change in the life of human beings has increased beyond our wildest expectations. This has been driven by technological and scientific breakthroughs that are changing the whole way we view the world on an almost daily basis. This means that change is not always a personal option, but an inescapable fact of life, and we need to constantly adapt to keep pace with it.","Those people who believe they have achieved some security by doing the same, familiar things are living in denial. Even when people believe they are resisting change themselves, they cannot stop the world around them from changing. Sooner or later they will find that the familiar jobs no longer exist, or that the ‘safe’ patterns of behaviour are no longer appropriate.","However, reaching the conclusion that change is inevitable is not the same as assuming that ‘change is always for the better’. Unfortunately, it is not always the case that new things are promoted because they have good impacts for the majority of people. A lot of innovations are made with the aim of making money for a few. This is because it is the rich and powerful people in our society who are able to impose changes (such as in working conditions or property developments) that are in their own interests.","In conclusion, I would say that change can be stimulating and energising for individuals when they pursue it themselves, but that all change, including that which is imposed on people, does not necessarily have good outcomes."],"id":113,"t":"two","c":11},{"n":115,"topic":"SPORT","q":"Popular events like the football World Cup and other international sporting occasions are essential in easing international tensions and releasing patriotic emotions in a safe way.","p":["Every four years, the whole world stops to watch international sporting events such as the Olympics and the Football World Cup in which athletes show their best performance to make their country proud of them. These sporting occasions have proved to be helpful in easing international tensions in difficult times when powerful leaders were trying to control the world's economy and other governments were fighting over land.","The Olympic Games are one of the best examples which prove how sporting events can bring nations together, at least temporarily. From ancient History, when Greeks and Romans would interrupt battles to participate in the games, to the more recent international disputes, when athletes from Palestine and Israel would forget their differences, compete pacifically and even embrace each other after an event. Moreover, these popular events have called the world's attention to the terrible consequences of wars; thus some leaders have tried to accept agreements to end their dispute and live peacefully.","Similarly, international sporting events show benefits in some developing countries which live in a daily internal civil war. For example, Brazil has a high rate of unemployment, lack of education, hunger, crime, poverty and corruption which leads to an immense embarrassment of being Brazilian and a low self-esteem. However, when the Football World Cup starts, the Brazilian squad, which is considered the best team in the world, provokes an amazing feeling of pride in their country. Most people seem to forget all their problems and even the criminal activity decreases. They paint roads with the national colors, use wear the Brazilian team shirt and buy national flags. Moreover, the competition brings families and neighbors together and even rival gangs watch the games and celebrate peacefully.","In conclusion, popular sporting events play an important role in decreasing international tensions and liberating patriotic feelings as History has shown.","This is a great essay, the ideas, language, structure of paragraphs and sentences, grammar show high level of English. In my opinion it is Band 8. Keep up the good work."],"id":114,"t":"other","c":5},{"n":115,"topic":"SPORT","q":"Should dangerous sports be banned? Yes!","p":["Millions of people play sport every day, and, inevitably, some suffer injury or pain. Most players and spectators accept this risk. However, some people would like to see dangerous sports such as boxing banned. This essay will examine some of the reasons for banning certain sports.","Some sports are nothing but an excuse for violence. Boxing is a perfect example. The last thing an increasingly violent world needs is more violence on our television. The sight of two men (or even women) bleeding, with faces ripped open, trying to obliterate each other is barbaric. Other sports, such as American football or rugby, are also barely-concealed violence.","Some people argue that the players can choose to participate. However this is not always the case. Many boxers, for example, come from disadvantaged backgrounds. They are lured by money or by social or peer pressure and then cannot escape. Even in richer social groups, schools force unwilling students to play aggressive team sports, claiming that playing will improve the students' character (or the school's reputation), but in fact increasing the risk of injury.","Even where people can choose, they sometimes need to be protected against themselves. Most people approve of governments' efforts to reduce smoking. In the same way, governments need to act if there are unacceptably high levels of injuries in sports such as football, diving, mountaineering, or motor-racing.","I accept that all sports involve challenge and risk. However violence and aggression should not be permitted in the name of sport. Governments and individuals must act to limit brutality and violence, so that children and adults can enjoy and benefit from sport.","272 words"],"id":115,"t":"opinion","c":6},{"n":116,"topic":"SPORT","q":"Save our Sports!","p":["Today, many sports are becoming increasingly regulated. Boxing, rugby, soccer, and other games are being targeted by sports bodies and medical organizations in an effort to improve safety standards and to reduce injuries. However, for some people, this is not enough, and they would rather see some dangerous sports banned completely. In this essay, I will examine some arguments against banning dangerous sports.","Sports, competition, and games seem to be natural to humans. Young children learn their own limits and strengths through play with others, but they also learn valuable social lessons about what acceptable behavior and the rights of others. Sport therefore is not just a physical phenomenon, but a mental and social one.","Challenging sport provides a healthy, largely safe, physical outlet for aggression. There is very little evidence to show that people who take part in dangerous sports become violent as a result. In fact it is more likely that apart from the many friendships created in playing, sport acts as a safety valve for a society by reducing stress. Moreover, sport teaches and requires discipline, training, and respect for the rules - valuable lessons in any society.","Almost all sports involve some risk. Young rugby players are paralysed every year in scrums. Scuba-diving accidents can lead to brain damage or death. Even golf or jogging can lead to pain or injury. Without some elements of risk or challenge, sport becomes meaningless. A marathon runner trying to improve his time, basketball players fiercely battling an opposing team, or a sky-diving team defying gravity - all are trying to push themselves to their maximum. There is therefore no sport without danger.","There is also the issue of freedom. Without a wide range of sports, many people would feel trapped or limited. People should be free to participate in activities with others as long as it does not affect the safety of non-participants.","There also should be limits to the power of governments to ban sports. If one sport is banned because of alleged danger, then what sport would be next? Boxing is the most common target of opponents of dangerous sports. But if boxing is banned, would motor racing follow, then rugby, wrestling, or weightlifting? Furthermore, many sports would go underground, leading to increased injury and illegal gambling.","Nobody denies that regulation is needed. Medical bodies have introduced safety rules in boxing, in soccer, and these safety regulations have been welcomed by players. But the role of government should be reduced.","In conclusion, our society would be healthier if more people took part in sports of all kinds. We should continue to try to prevent accidents and injuries. However, we should also ensure that sports are challenging, exciting, and, above all, fun.","(454 words)"],"id":116,"t":"other","c":8},{"n":117,"topic":"SCIENTIFIC RESEARCH","q":"What discovery in the last 100 years has been most beneficial for people in your country? Use specific reasons and examples to support your choice.","p":["I am from Russia. From my opinion the most beneficial discovery for people in our country has been the discovery of the outer space. Russia is the first country that launched a spacecraft with a man on the board into the space. This event was a big step towards the new discoveries and brought many benefits not only for people in my country. Bellow I will give my reasons to support my answer.","First of all, all humankind made a huge step towards the mystery of our creation. Scientists had the opportunity to do the new research and experiments. Many new discoveries were made on the boards of the spacecrafts in the outer space. People from all over the world watched these events. Many books with real colorful photos were written about the beginning of the space exploration. Nowadays we have a big station called \"Mir\" in the outer space created on the base of collaboration USA and Russia. Many people work there doing amazing experiments.","Second of all, the world became \"smaller\". People learnt how to exchange information very quickly by use of satellites. Television is broad-casted all over the world by use of satellites. Here in Houston I can watch Russian programs. People got the opportunity to exchange news very quickly.","To sum up, I believe that space exploration will bring much more benefits in the future and someday we will learn what is beyond our current galaxy.","(240 words)"],"id":117,"t":"problem","c":4},{"n":118,"topic":"SCIENTIFIC RESEARCH","q":"The 21st century has begun. What changes do you think this new century will bring? Use examples and details in your answer.","p":["Man, through the ages, has undergone many changes from the time when he depicted a herd of mammoths on the walls of his cave to these days when he can create beautiful pictures and even make coffee by use of computer technologies without leaving his favorite chair. The 20th century made huge steps in developing computer technologies and reached many goals that made our life much easier. What should we expect in the 21st century?","First of all, I think that the pace of our life will speed up: we will move faster from one place to another, from one continent to another using high speed jet airplanes. Second of all, I believe that we will be able to do many things that take much time now without leaving our house. Computers will be everywhere including out clothes. Many people will have chips and mini computers inserted in their heads to hold huge amount of information and have a quick access to it.","But what will be the most amazing thing in the 21st century is the flights to the outer space and Mars that will be available to all people. Scientists say that Mars has many things similar to the Earth's. Moreover, they say that with the help of modern technology people can artificially create conditions that will allow people to live there on the constant basis.","To sum up, I am sure that many amazing changes will be brought by the 21st century. Furthermore, I think that with the help of the contemporary technologies people can do many things that were even difficult to imagine a century ago. So, nowadays it is rather difficult and even impossible to imagine all changes that will happen in the next decades.","(290 words)"],"id":118,"t":"opinion","c":4},{"n":119,"topic":"SCIENTIFIC RESEARCH","q":"It has been more than 30 years since man first landed on the moon. Some people think that space research is a waste of money. Discuss.","p":["For over fifty years, a number of nations have been involved in the exploration of outer space. This research has been very costly, of course. Has this money been well-spent or wasted?","Some people believe that all or most space research should be eliminated because of its incredible expense, not only in terms of money, but also in terms of scientific and human resources. These people point out the fact that it cost billions of dollars to send astronauts to the moon, but all they brought back were some worthless rocks. These people say that the money and effort now being wasted in outer space could be spent for homeless people, improving the education system, saving the environment, and finding cures for diseases.","However, other people believe that space research has provided many benefits to mankind. They point out that hundreds of useful products, from personal computers to heart pacemakers to freeze-dried foods, are the direct or indirect results of space research. They say that weather and communication satellites, which are also products of space programs, have benefited people all over the globe. In addition to these practical benefits, supporters of the space program point to the scientific knowledge that has been acquired about the sun, the moon, the planets and even our own earth as a result of space research.","I agree with those people who support space research and want it to continue. Space research, as shown, has already brought many benefits to humanity. Perhaps it will bring even more benefits in the future, ones that we can not even imagine now. Moreover, just as individual people need challenges to make their lives more interesting, I believe the human race itself needs a challenge, and I think that the peaceful exploration of outer space provides just such a challenge."],"id":119,"t":"other","c":4},{"n":120,"topic":"TRAVEL","q":"According to those in the travel business, the nature of the average 'holiday' is changing. Rather than seeking a relaxing break in a far-away place, people now want exitement on their holidays and are keen to participate in unusual and challenging activities. Do you agree or disagree?","p":["Holidays are important because they provide a break from our normal daily routine and from the world of work. Traditionally, holidays have been seen as a time for relaxation and as an opportunity to visit another country in order to find out about its geography and customs. Nowadays, however, it seems that other types of holiday are becoming popular.","Some people want their holiday to be a kind of adventure, and find this more exciting than going to the beach or visiting museums. On an adventure holiday, you may stay in quite basic accommodation, rather than a luxurious hotel. Activities may involve things such as bush walking or cycling, or may form part of an aid project designed to help communities in remote areas. Holidays such as these are popular with people of all ages and can often help to promote tourism in rural environments.","The increasing popularity of dangerous sports has also boosted the number of adventure holidays; for example, water sports, mountain climbing or paragliding. These holidays are more popular with the younger generation, as they can be both physically and mentally demanding. Participants are often seeking the sort of thrills that they cannot get in ordinary life.","There is now greater awareness of the damaging effects of mass tourism and this may be one reason for the changing nature of holidays. This can only be a good thing. But perhaps people are also discovering that it is just as refreshing to take an active holiday, as it is to lie on a beach - though that is still a question of personal preference.","(266 words)"],"id":120,"t":"opinion","c":4},{"n":121,"topic":"TRAVEL","q":"You have the opportunity to visit a foreign country for two weeks. Which country would you like to visit? Use specific reasons and details to explain your choice.","p":["I am a person who likes to travel. I think traveling is a great opportunity to meet new people, gain more knowledge and experience, and learn new customs and traditions. I did not travel a lot yet, but I am sure I will have a chance to do it. So, if I had the opportunity to visit a foreign country I would visit Egypt. I think it is a great and very interesting country with marvellous history. In the following paragraphs I will give some reasons to support my choice.","First of all, I always dreamed to visit Egypt pyramids. My aunt visited Egypt a few years ago. She was very excited after that trip and said that she would return there one more time at any cost. She said that Egypt had impressed her very much with its glorious pyramids and ancient buildings. Second of all, I think that in that country one can touch history, feel the hard breath of workers building a pyramid under the parching sun, and see the chain of camels walking in the desert with the huge trunks full of presents for Cleopatra on their humps. Finally, I want to see a real dessert and ride the camel. All my friends who rode the camel say that it is an unforgettable experience.","I believe that I will have a chance to visit this beautiful country someday. Unfortunately, now I have plenty of plans and things to do, so, I am afraid that I will not be able to travel for the next two years. I want to finish my education and then find a job, and these things have higher priority then traveling. My husband wants to visit this country too and we made an agreement to make our trip to Egypt on our five years anniversary which is in two years.","In conclusion, I want to add that after my trip to Egypt I will definitely visit Australia. This country is the second one on my list the most wanted to see.","(339 words)"],"id":121,"t":"problem","c":4},{"n":122,"topic":"TRAVEL","q":"Nowadays, international tourism is the biggest industry in the world. Unfortunately, international tourism creates tension rather than understanding between people from different cultures. To what extent do you agree or disagree with this opinion?","p":["The growth of tourism and the numbers of people travelling to other countries for their vacations has led to debate as to whether this is beneficial. I believe that there are many problems which arise out of the tourist industry, and will examine these in detail.","Many people argue that travel broadens the mind. However, this statement does not fully hold water. I would argue that spending a few weeks in another country is not long enough to gain a proper understanding of an alien culture. A foreigner visiting Britain might be met with the traditional British reserve, and mistakenly conclude that the British are unfriendly. Furthermore, some people are unwilling to open their minds. A Western traveller to an Arab country is unlikely to consider that the veiling of women is acceptable.","Being a tourist in a foreign country brings with it problems that can lead to dislike of the native people. Firstly, a foreigner is vulnerable, and is often ripped off by locals. Secondly, the language barrier can lead to misunderstandings. Thirdly, tourists are often hassled to buy goods, which can ruin a holiday. When I went to Bali, people tried to sell me something every five minutes, and this totally spoilt my sunbathing.","Local people also often end up disliking foreigners. Visitors may mistakenly act contrary to local norms, or they may just be plain offensive, as many drunken British holidaymakers must seem to the Spanish. Global tourism can lead to hostility from the native people, who may feel their traditional way of life is under threat. Additionally, the relative wealth of the foreign visitors can cause envy and resentment.","In conclusion, I would say that I largely agree with the argument that global tourism creates misunderstanding between people from different cultures, and that the differences are often a cause for conflict rather than celebration.","JOB"],"id":122,"t":"opinion","c":6},{"n":123,"topic":"TRAVEL","q":"Some people prefer to work for a large company. Others prefer to work for a small company. Which would you prefer? Use specific reasons and examples to support your choice.","p":["The issue whether working for a large company is better than working for a small company is a controversial one. From my everyday experience and observation I think that every option has its advantages and disadvantages. I base my opinion on the following points.","From the one side working for a large company brings many benefits. First of all, one has better medical insurance, higher salary. Often employees of a large company have less responsibility. Moreover, they feel more secure because their company has more clients and this means better chance to survive on the modern market. However, one working for a large company has less chance to be promoted because one's manager does not want to lose his or her job unless she or he is promoted too. Also, from my observation, managers of a large company do not pay much attention to one's solutions and suggestions.","From the other side working for a small company has many advantages too. Firstly, one has better chance to be promoted. Secondly, one can talk to the owner of the company about any improvements that can be done in order to get more profit. Another important aspect of working for a small company is the opportunities to find out more about how company works. As a result of this one can gain more experience and get better recommendations. However, this also has some disadvantages. For instance, one can get less salary, worse medical benefits, etc.","To sum up, I think that every person chooses for himself what he or she wants. If one wants better career and more responsibilities then a small company is better choice. Otherwise, working for a large company may be a good option too. (286 words)"],"id":123,"t":"discuss","c":4},{"n":124,"topic":"TRAVEL","q":"We all work or will work in our jobs with many different kinds of people. In your opinion, what are some important characteristics of a co-worker (someone you work closely with)? Use reasons and specific examples to explain why these characteristics are important.","p":["A large number of people spend most of their time at work. Our life is divided into three equal parts: 8 hours - sleep, 8 hours - work, 8 hours - family time. So, in the most cases, one's co-worker plays an important role in one's life. From my opinion, the essential characteristics of a co-worker are the following.","First of all, a person who works closely with me must like his job. I think it is very important for a person to feel satisfaction with his job. My husband is a software developer. He is fond of his job and people enjoy working with him because they see how many energy he puts into his job.","Second of all, my co-worker must be persistent and never give up. I like when people who came across a problem try to solve it, find a good decision instead of looking for another person to hand it over. Another important aspect of this is that a good worker should always ask himself \"What can be improved?\" and suggests new solutions.","In addition, he must be a good team player. In the modern world good communication skills and the ability to work in a team are among the common position requirements. Personally, I think it is great to help each other, share new ideas, develop new solutions, etc. It helps to create a team spirit and improve labor productivity.","Finally, my co-worker must be punctual. He or she should finish the job on time I think that It is unacceptable to make the rest of a team wait while a person finishes his or her job. Also, my \"ideal co-worker\" should always be ready to offer his or her help and be supportive.","To summarize, I think if a co-worker possesses all of these qualities mentioned above he can make work with him really enjoyable and productive.","(314 words)"],"id":124,"t":"opinion","c":6},{"n":125,"topic":"TRAVEL","q":"What are some important qualities of a good supervisor (boss)? Use specific details and examples to explain why these qualities are important.","p":["Many people have to work under somebody's supervision. In most cases an employee does not choose his or her boss, unless a supervisor is elected. In the following paragraphs I will list the most important qualities of my \"ideal boss\".","First of all, he must be impartial. I believe that it is very important to make a technical decision, think about somebody's promotion, etc. impartially. For instance, my friend is a supervisor on a dairy mill. It is his family's business so a lot of his relatives work there. But he never promotes someone because he or she is his family. I think it is a good quality for a boss.","Second of all, my \"ideal boss\" must be honest, patient and attentive. He should pay attention to people's feelings, encourage them by increasing their salary, listen to their suggestions about improving labor conditions and productivity. For instance, if he does not satisfied with the result he should understand the origin of the problem and explain people how to fix it. In addition, he must know how to solve conflicts that can arise between employees.","Another important quality of a boss is the ability to choose the right decisions and to learn on somebody's mistakes.","Finally, I think a good boss must value his or her employees because the profit directly depends on the people who work there.","In conclusion, I think a good boss should be able to make his people enjoy the work they are doing and encourage their diligence. (252 words)"],"id":125,"t":"two","c":6},{"n":126,"topic":"TRAVEL","q":"Businesses should hire employees for their entire lives. Do you agree or disagree? Use specific reasons and examples to support your answer.","p":["I would have to completely disagree with the statement above. In the following paragraphs I will outline the basic concepts of my position.","First of all, I will least the major disadvantages for employers. On the today's market a company must be very flexible in order to compete with other firms. So, imagine the situation when a company can not fire its employees to stay on the market. It will lead to loosing not only a profit, but the clients, market share and competitive ability. Now, imagine the situation when a company is growing fast, everything is good and the next few years are going to be excellent. So, employers need more people to extend the production. However, nobody can tell what will happen in a few years. In this case, employers will be afraid to hire new people and extend their business because they will not be able to fire them if something goes wrong. Another important aspect of this is that a company can not have the best employees. It can not hire the better one without dismissing another employee.","What kind of disadvantages will have an employee in exchange for this kind of job security? First of all, it will be very difficult to find a job if one is not the best, because an employer does not want to spend money on one's education. Besides, employer will not have a chance to fire one if he does not do his job well. Second of all, employees with this kind of security tend not to perfect themselves because after they are hired they can not lose their job.","In conclusion, I would like to add that this statement has some positive aspects too such as constancy, a strong spirit of the company, etc. This system takes place in Japan and some companies succeeded in it. But I think that the reason of it subsists in the Japanese traditions, the particular cultural features, habits and customs. However, on today's market here in the United States a company can not afford to hire employees for their entire life.","(349 words)"],"id":126,"t":"opinion","c":4},{"n":127,"topic":"TRAVEL","q":"Some people like to do only what they already do well. Other people prefer to try new things and take risks. Which do you prefer? Use specific reasons and examples to support your choice.","p":["Form my everyday experience and observation I think that all people who succeeded in life had to work hard and gain more knowledge and experience in order to reach their goals. From the other hand, people who all their life do things they already do well and do not improve their knowledge do not move forward. I base my statement on the following points.","First of all, people who want to succeed must constantly improve their knowledge and gain more experience. Moreover, they must be the best at their profession. So, they need to try new things, take risks sometimes and work hard.","Second of all, it is impossible to live without trying new things. Imagine one wants to learn how to drive. He will never be able to do it without learning new things such as driving rules.","Personally, I think that it is very interesting to learn new, to gain more experience, to make new goals and reach them. Life is too short to stay on one place. People need changes because they make our lives more beautiful and exiting. We find out new things, learn new things and dream to know other things. People need challenges because while overcoming obstacles we make new discoveries, become stronger, perfect ourselves and move forward.","To sum up, I believe that people's aspiration for learning new things is the main reason the way we live now. People make many discoveries and inventions that make our lives easier, happier and longer.","(249 words)"],"id":127,"t":"discuss","c":5},{"n":128,"topic":"TRAVEL","q":"Companies should encourage employees who work in a high position to leave at the age of 55 in order to give opportunities to the new generation.","p":["To what extent do you agree or disagree with this opinion?","I totally disagree with the idea of high-level employees leaving at the age of 55 to make room for the upcoming generation. While it is true that the energy level and fresh ideas of youth can rejuvenate a company, the steady hand of experience can still best guide a company in most cases.","In English there is a saying, “You can’t teach an old dog new tricks.” In the fast-paced world of business, bolstered by even faster hi-tech innovations, a younger more pliant mind would seem to be able to adapt with greater flexibility, while such an environment might boggle an older more set-in-its-ways mind. Take, for example, Microsoft’s Bill Gates, whose energy and brilliant insights as a youth helped him to pioneer new territory in the computer software world and establish a digital empire. Now as a more mature CEO, this king of the “computer” mountain is constantly on the verge of being knocked down by upcoming digeratti entrepreneurs. However, it is now the experience he has accumulated as an older man which keeps him on top. So, combining the vigour and innovation of younger workers with the experience of older workers would seem to be the winning hand in the world of business.","The assertion is to give opportunities to the younger generation. If everyone retires at 55, there will be smaller pool of experience at the company. So, who will show them the ropes of the trade? It would be as if we lopped off the last few chapters of a textbook. On this point the argument would seem to be built on false presumptions.","And think of all the other problems retirement at 55 would create. With life expectancy in many advanced nations at 70-plus years, how would the state along with private enterprises be able to support their retirement pensions? The economic repercussions of such an idea could be great.","Besides, the Western form of capitalism is built on competition and merit and not seniority according to age, and democracy is built on equality for all regardless of one’s age, so the argument clearly goes against these two pillars of Western society.","Granted, my counter-arguments are perhaps as simplistic as the original assertion itself, but without qualifying the assertion with greater supporting evidence or background information, both sides can be argued. Nevertheless, even after thoroughly considering the argument, I believe I would still adhere to my viewpoint that the assertion lacks merit for the aforementioned reasons. Besides, when I am 55 I do not fancy the idea of being put out to pasture. I think I will still be full of vitality and have a desire to work, so I hope my workplace will view me as a treasure house of valuable experience to pass along to the next generation and keep me on until I am at least 65 if not older.","(478 words)"],"id":128,"t":"opinion","c":7},{"n":129,"topic":"TRAVEL","q":"In some countries the average worker is obliged to retire at the age of 50, while in others people can work until they are 65 or 70. Meanwhile, we see some politicians enjoying power well into their eighties. Clearly, there is little agreement on an appropriate retirement age. Until what age do you think people should be encouraged to remain in paid employment?","p":["Mandatory retirement age varies from society to society, perhaps a reflection of economics, population pressures or simply value systems. Indeed, retirement at 50 can probably be as easily justified as that at 70. It is my belief, however, that the longer an able person is allowed to work, the better for both the individual worker and the employer.","Chronological age is not always a true indicator of ability. While some 65¬ year-olds may not perform as well as they did in their past, many workers at this age do just as well or better than they used to. People's suitability for a position should be a reflection of their performance in the job, rather than the number of wrinkles or grey hairs they have. Employers concerned about the increasing age of their employees need only observe their work records. Those doing poorly may be asked to retire, but those as yet unaffected by age should stay on. Indeed, it would appear economical for an organisation to retain its older employees when possible rather than spend time and money on training new workers.","Remaining in one's job for as long as one is able makes sense as life expectancies increase around the world. As people live longer, they are longer able to contribute to society in the form of meaningful work. But they are also in need of income for a longer period, so a mandatory retirement age of 55 for someone who is statistically likely to live to 77 becomes increasingly difficult to justify. At a time when populations are ageing, governments are less able to provide for their senior citizens, so by keeping able workers in paid employment for as long as is practicable, public expenditures are less strained.","Thus, workers who can still demonstrate their capacity to carry out their work should not be asked to retire simply because they have reached a certain age. Societies that insist on early retirement may do well to look again at their policies."],"id":129,"t":"opinion","c":4},{"n":130,"topic":"TRAVEL","q":"When should people be made to retire? 55? 65? Should there be a compulsory retirement age?","p":["Many old people work well into their 70s and 80s, running families, countries or corporations. Other people, however, despite being fit and highly talented, are forced to retire in their or even earlier because of company or national regulations. This essay will examine whether people should be allowed to continue working for as long as they want or whether they should be encouraged to retire at a particular stage.","There are several arguments for allowing older people to continue working as long as they are able. First of all, older employees have an immense amount of knowledge and experience which can be lost to a business or organization if they are made to retire. A second point is that older employees are often extremely loyal employees and are more willing to implement company policies than younger less committed staff. However, a more important point is regarding the attitudes in society to old people. To force someone to resign or retire at 60 or 65 indicates that the society does not value the input of these people and that effectively their useful life is over.","Allowing older people to work indefinitely however is not always a good policy. Age alone is no guarantee of ability. Many younger employees have more experience or skills than older staff, who may have been stuck in one area or unit for most of their working lives. Having compulsory retirement allows new ideas in an organization. In addition, without age limits, however arbitrary, many people would continue to work purely because they did not have any other plans or roles. A third point of view is that older people should be rewarded by society for their life’s labor by being given generous pensions and the freedom to enjoy their leisure.","With many young people unemployed or frustrated in low-level positions, there are often calls to compulsorily retire older workers. However, this can affect the older individual’s freedom - and right - to work and can deprive society of valuable experience and insights. I feel that giving workers more flexibility and choice over their retirement age will benefit society and the individual."],"id":130,"t":"opinion","c":4},{"n":131,"topic":"TRAVEL","q":"Some people insist that senior workers 65 or over should retire but others believe that they should continue working. What is you opinion?","p":["Over the past few decades [In the past], there have been many advances in medical technology. Because of this, senior citizens are healthier and more active than before and may choose to work beyond the age of 65. Nowadays, however, there has been a growing debate as to whether or not these people should retire in order to create jobs for the younger generation. Despite the advantages of early retirement, I strongly believe that it is better for senior workers to continue working as long as they are physically and mentally capable.","Those who believe that senior workers need to retire for younger generation base their case on the following arguments. First, the unemployment rate, especially for college graduates, has never been so high so it is today. This is largely due to the slow economy. Therefore, firing some elderly workers who are well-paid would allow those unemployed young people to have good opportunities to g
