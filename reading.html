day? Why? Use specific reasons and details to support your choice.","p":["Traveling is a good way to find out more about different countries with different traditions and customs. Some travelers prefer to spend in one country just a few days or one day and then leave for another country. This way of traveling allows people to visit more countries in fewer days. Unfortunately, in this case such travelers have to hurry in order to visit more places.","I am from Saint-Petersburg, Russia. So, if a foreign visitor has only one day to spend in my country I think I would advice him to visit the \"Hermitage\" - the most well known and amazing museum in Russia. The \"Hermitage\" has 3 floors and more then 100 halls. It is really amazing to visit that place. Many people from all over the world every day enter its walls. Some of the rooms devoted to the history of other countries. Others devoted to the art of a famous painter and the history of his life. However, most of the halls conclude many things such as paintings, royal belongings, sculptures from Russian history.","Some people say that it is impossible to feel deeply and see all these amazing historical values for one visit. I have to completely agree with this statement. When I first visited the \"Hermitage\" I was 14 years old. It impressed me so much that I was back next day to see what I had not been able to see the day before.","The \"Hermitage\" is an impressive and beautiful museum. I think it is worth to spend there a whole day and I believe that after that a foreign visitor can claim with a proud that he or she saw Russia.","(280 words)"],"id":166,"t":"opinion","c":4},{"n":167,"topic":"VALUE","q":"Successful sports professionals can earn a great deal more money than people in other important professions. Some people think this is fully justified while others think it is unfair. Discuss both these views and give your own opinion.","p":["As a result of constant media attention, sports professionals in my country have become stars and celebrities, and those at the top are paid huge salaries. Just like movie stars, they live extravagant lifestyles with huge houses and cars.","Many people find their rewards unfair, especially when comparing these super salaries with those of top surgeons or research scientists, or even leading politicians who have the responsibility of governing the country. However, sports salaries are not determined by considering the contribution to society a person makes, or the level of responsibility he or she holds. Instead, they reflect the public popularity of sport in general and the level of public support that successful stars can generate. So the notion of ‘fairness’ is not the issue.","Those who feel that sports stars’ salaries are justified might argue that the number of professionals with real talent are very few, and the money is a recognition of the skills and dedication a person needs to be successful. Competition is constant and a player is tested every time they perform in their relatively short career. The pressure from the media is intense and there is little privacy out of the spotlight. So all of these factors may justify the huge earnings.","Personally, I think that the amount of money such sports stars make is more justified than the huge earnings of movie stars, but at the same time, it indicates that our society places more value on sport than on more essential professions and achievements."],"id":167,"t":"discuss","c":4},{"n":168,"topic":"VALUE","q":"It is generally agreed that society benefits from the work of its members. Compare the contributions of artists to society with the contributions of scientists to society. Which type of contribution do you think is valued more by your society? Give specific reasons to support your answer.","p":["From my everyday experience and observation I think that artists as well as scientists bring many benefits to society. It is a controversial question weather the contributions of artists are more or less then the contributions of scientists to the society. For several reasons, which I will mention bellow, I think that both types are valuable, priceless and irreplaceable for every society.","The contributions of artists to the society are very essential. Art can form person’s spiritual sense, their views and personalities. People learn history, the traditions of their country trough the art. We also watch movies that entertain and at the same time extend our range of interests. Another important aspect of this is that art is an ancient means of communication. In old times people depicted the herds of mammoths on the walls of their caves. They performed different rituals around the fireplace asking their gods for health, good harvest and weather. Our language is a result of people's need to communicate.","From the other side, the contribution of scientists is could not be exaggerated. All humankind is indebted to the scientists because of their work and achievements. Scientists make our life easier. We have cars and airplanes to move fast from one place to another. We have microwaves and a bunch of preprocessed food to make the cooking much easier. We have different devices that simplify all we do. Finally, scientists are making great achievements in medicine that make our life longer and happier. Nowadays people have a great opportunity to do many things faster by use of computers.","To sup up, I believe that artists nourish our souls when scientists and technology feed our minds. So, we can not eliminate or underestimate one of them."],"id":168,"t":"opinion","c":4},{"n":169,"topic":"VALUE","q":"People who have original ideas are of much greater value to society than those who are simply able to copy the ideas of others well. To what extent do you agree or disagree with this statement?","p":["I certainly agree that people who come up with new ideas; in other words those who 'invent' or 'discover' things are terribly important to society as a whole. However, I also think there is a role in society for good imitators.","No one would deny that key individuals must be thanked for providing us with certain facilities that we use every day. Where, would we be, for example, without basic items such as the washing machine, the television and, more recently, the computer? These items are now used so regularly that we tend to take them for granted.","In fact, the society we live in today has become increasingly consumer-oriented, and while it may be possible to constantly update and improve consumer goods, not everyone where I live can afford the prices of these innovations. Furthermore not everyone lives in an area that has accessibility to the latest models on the market. For this reason, there is a value to be placed on being able to provide good copies of expensive items.","Having said that, certain innovations have a more serious impact on our lives than consumer goods and cannot easily be replicated. Vital medicines like penicillin and vaccines against dangerous diseases also exist because people made continual efforts to develop them. Scientific ideas such as these enable us to live longer and escape illness.","(225 words)"],"id":169,"t":"opinion","c":4}]</script>

async function explainEssay(id){
  const e=byId(id);const dps=displayParas(e);if(!AI||S.explLoading===id)return;

Essay question: "${e.q}"
For EACH numbered paragraph below, write in simple Modern Standard Arabic:
- "ar": 2-3 short sentences: what the paragraph says and its job in the essay (introduction / body idea / conclusion / extra comment). If the paragraph contains a clear grammar mistake, mention it briefly.
- "phrase": one useful English phrase copied from that paragraph that the learner can reuse (or "" if none).
Reply with ONLY JSON of this shape, with exactly ${dps.length} items in the same order: {"paras":[{"ar":"...","phrase":"..."}]}

${dps.map((x,k)=>`[${k+1}] ${x.p.slice(0,1800)}`).join('\n\n')}`;
  try{
    const r=await ask(prompt,{modelTier:'quick',cache:{gcTime:86400000}});
    const arr=r&&Array.isArray(r.paras)?r.paras:[];S.expl[id]=dps.map((x,k)=>arr[k]&&arr[k].ar?{ar:String(arr[k].ar),phrase:String(arr[k].phrase||'')}:{ar:'—',phrase:''});
    const keys=Object.keys(S.expl);if(keys.length>60)delete S.expl[keys[0]];store.set('es_expl',S.expl);
  }catch(err){S.explLoading=null;if(S.essay===id){render();const el=$('#explErr');if(el)el.textContent=errText(err)}return}
  S.explLoading=null;if(S.essay===id&&(S.room==='library'||S.room==='plan'))render();
}

function aiReport(A,text){

const lkDisp=w=>w.replace(/\bi\b/g,'I').replace(/^./,c=>c.toUpperCase());
/* mastery with spaced review: level 0-5, next due date */
const LK_GAP=[0,1,3,7,14,30];
let LKM=store.get('es_lk',{});
const lkLv=w=>(LKM[w]&&LKM[w].lv)||0;
const lkKnown=w=>lkLv(w)>=3;
function lkMark(w,ok){if(!LK_INFO[w])return;const m=LKM[w]||{lv:0,due:0,seen:0};m.seen++;m.lv=ok?Math.min(5,m.lv+1):Math.max(0,m.lv-1);m.due=Date.now()+LK_GAP[m.lv]*864e5;LKM[w]=m;store.set('es_lk',LKM)}
function lkDue(){const now=Date.now();return Object.keys(LK_INFO).filter(w=>!LKM[w]||LKM[w].due<=now)}
/* words to practise first: due & weak, then the rest */
function lkQueue(filter){const all=Object.keys(LK_INFO).filter(filter||(()=>true));const now=Date.now();const due=shuffle(all.filter(w=>LKM[w]&&LKM[w].due<=now&&LKM[w].lv<5));const fresh=shuffle(all.filter(w=>!LKM[w]));const rest=shuffle(all.filter(w=>!due.includes(w)&&!fresh.includes(w)));return [...due,...fresh,...rest]}
function lkBookSent(w){const re=new RegExp('\\b'+w.replace(/ /g,'\\s+')+'\\b','i');const f=allSents().filter(x=>re.test(x.s)&&x.s.length<200);if(!f.length)return null;return f.sort((a,b)=>a.s.length-b.s.length)[Math.min(2,f.length-1)]}
/* games */
function lkMeanRounds(n){return lkQueue().slice(0,n).map(w=>{const I=LK_INFO[w];const c=lkCat(w);const others=shuffle(Object.keys(LK_INFO).filter(x=>lkCat(x)!==c&&LK_INFO[x].ar!==I.ar)).slice(0,3);return {kind:'choice',skill:'الربط',lkw:w,prompt:`<p style="margin:0">وش معنى هذي الأداة؟</p><div class="cloze" style="text-align:center;font-size:26px">${esc(lkDisp(w))} <button class="btn ghost sm" data-sayt="${esc(w)}" aria-label="استمعي">استمعي</button></div>`,opts:shuffle([w,...others]).map(x=>({label:LK_INFO[x].ar,val:x})),ans:w,why:`<b class="en">${esc(lkDisp(w))}</b> = ${esc(I.ar)}. مثال: <span class="en">${esc(I.ex)}</span>`}})}
function lkGramRounds(n){return lkQueue(w=>LK_INFO[w].d).slice(0,n).map(w=>{const I=LK_INFO[w];const re=new RegExp(w.replace(/ /g,'\\s+'),'i');const m=I.ex.match(re);const cap=m&&m.index===0||(m&&/[.]\s$/.test(I.ex.slice(0,m.index)));const show=x=>cap?lkDisp(x):x;return {kind:'choice',skill:'الربط',lkw:w,prompt:`<p style="margin:0">أي أداة تركب في الجملة <b>معنى وقاعدة</b>؟</p><div class="cloze">${esc(I.ex).replace(re,'<span class="blank">______</span>')}</div>`,opts:shuffle([w,...I.d]).map(x=>({label:show(x),val:x,en:1})),ans:w,why:`<b class="en">${esc(lkDisp(w))}</b>: ${esc(LK_PAT[I.p].tip)}<br>${I.d.map(x=>`<span class="en">${esc(lkDisp(x))}</span>: ${esc(LK_PAT[LK_INFO[x].p].ar)}`).join(' · ')}`}})}
function lkListenRounds(n){return lkQueue().slice(0,n).map(w=>{const c=lkCat(w);const same=shuffle(Object.keys(LK_INFO).filter(x=>x!==w&&lkCat(x)===c)).slice(0,3);return {kind:'choice',skill:'الاستماع',lkw:w,say:w,prompt:`<p style="margin:0">اسمعي واختاري الأداة اللي سمعتيها:</p><div class="row"><button class="btn acc" data-sayt="${esc(w)}">استمعي</button><button class="btn ghost sm" data-sayt="${esc(w)}" data-slow="1">أبطأ</button></div>`,opts:shuffle([w,...same]).map(x=>({label:lkDisp(x),val:x,en:1})),ans:w,why:`سمعتي <b class="en">${esc(lkDisp(w))}</b> = ${esc(LK_INFO[w].ar)}.`}})}
function lkUseRounds(n){return lkQueue(w=>LK_INFO[w].p!=='op').slice(0,n).map(w=>({kind:'lkw',skill:'الكتابة',lkw:w,typed:''}))}

      :`<p style="margin:0">اسمعي الجملة واكتبيها كاملة:</p><div class="row"><button class="btn acc" data-sayfull="1">استمعي</button><button class="btn ghost sm" data-sayslow="1">أبطأ</button></div>`;
    h+=`<label class="note" for="typeIn">${isP?'اللي سمعه الجهاز من نطقك':'اكتبي هنا'}</label><textarea id="typeIn" class="input" style="font-size:18px;min-height:70px;max-width:100%" ${done?'disabled':''} spellcheck="false">${esc(R.typed||'')}</textarea>`;

function diffWords(target,heard){
  const T=clean(target).split(' ');const H=new Set(clean(heard).split(' '));const raw=target.replace(/[.!?]+$/,'').split(/\s+/);let ok=0;
  const html=raw.map((w,i)=>{const good=clean(w).split(' ').every(x=>!x||H.has(x));if(good)ok++;return `<span class="${good?'ok':'miss'}">${esc(w)}</span>`}).join(' ');
  return {html,ok,total:raw.length};
}
function feedback(ok,txt,eid){const inTest=S.room==='test';const last=inTest?(S.test.i+1>=S.test.items.length):(!S.game.speed&&S.game.i+1>=S.game.rounds.length);return `<div class="why ${ok?'ok':'no'}"><p><b>${ok?'صح!':'ولا يهمك.'}</b> ${txt}</p><div class="row">${eid!=null&&!inTest?`<button class="btn ghost sm" data-open="${eid}">افتحي المقالة</button>`:''}<button class="btn" data-next="1">${last?'النتيجة':'التالي'}</button></div></div>`}
async function pronTips(R){

}

function finishTest(){
  const T=S.test;T.stage='done';const by={};T.res.forEach(r=>{by[r.skill]=by[r.skill]||{ok:0,n:0};by[r.skill].n++;if(r.ok)by[r.skill].ok++});if(T.introRes)by['الكتابة']={ok:Math.round(T.introRes.score),n:10};

function go(room){S.room=room;S.word=null;render();try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){}}
function answer(holder,val){
  const R=holder===S.test?S.test.items[S.test.i]:S.game.rounds[S.game.i];holder.picked=val;
  const ok=val===R.ans||val==='ok';if(R.lkw)lkMark(R.lkw,ok);
  if(holder===S.test)S.test.res.push({skill:R.skill,ok});else if(ok){S.game.score++;addXP(S.game.speed?5:10)}
  if(holder===S.game&&S.game.speed){render();setTimeout(()=>{if(S.game&&!S.game.done){S.game.rounds.push(linkSortRound());S.game.i++;S.game.picked=null;render()}},450);return}
  render();
}
document.addEventListener('click',ev=>{
  const tok=ev.target.closest('.tok');if(tok){const s=tok.closest('.sent');openWord(tok.dataset.w,s?s.dataset.sent:'');return}
  const b=ev.target.closest('button,input');if(!b)return;const d=b.dataset;const H=S.room==='test'?S.test:S.game;
  if(d.room){if(d.room==='plan'){S.dayCtx=null;S.game=null;S.write=null}if(d.room==='library')S.essay=null;if(d.room==='practice'){S.game=null;S.write=null;stopSpeed()}go(d.room);return}
  if(d.jump){const t=document.getElementById(d.jump);if(t)t.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(d.dopen){openDay(+d.dopen);return}
  if(d.plan){stopSpeed();stopW();S.dayCtx=null;S.game=null;S.write=null;render();try{window.scrollTo({top:0})}catch(e){}return}
  if(d.step!==undefined&&S.dayCtx){openStep(S.dayCtx.n,+d.step);return}
  if(d.dtick!==undefined&&S.dayCtx){const n=S.dayCtx.n,k=+d.dtick;const st=PLAN[n-1].steps[k];if(st.k==='read'&&!S.read[st.essay]){S.read[st.essay]=true;store.set('es_read',S.read)}tickStep(n,k);const nx=nextStepAfter(n,k);if(nx>=0)openStep(n,nx);else render();return}
  if(d.dgame!==undefined&&S.dayCtx){stopSpeed();newGame(PLAN[S.dayCtx.n-1].steps[+d.dgame].g,scopeFor(S.dayCtx.n,+d.dgame));return}
  if(d.dwrite!==undefined&&S.dayCtx){const st=PLAN[S.dayCtx.n-1].steps[+d.dwrite];startWrite(st.topic==='*'?'*':st.topic);if(st.timed){S.write.running=true;wTimer=setInterval(()=>{const W=S.write;if(!W){stopW();return}W.secs=Math.max(0,W.secs-1);const el=$('#wTime');if(el)el.textContent=fmt(W.secs);if(W.secs===0)stopW()},1000)}render();return}
  if(d.dchat!==undefined&&S.dayCtx){const st=PLAN[S.dayCtx.n-1].steps[+d.dchat];S.chat={mode:st.mode||'p1',turns:[],topic:st.topic?TOPIC_AR[st.topic]+' ('+st.topic.toLowerCase()+')':'',autoSpeak:S.chat.autoSpeak};store.set('es_chat',S.chat);go('chat');return}
  if(d.closeword){S.word=null;drawSheet();return}
  if(d.sayt){speak(d.sayt,d.slow?.55:.85);return}
  if(d.lk){openLinker(d.lk);return}
  if(d.lkknow&&S.word&&S.word.lk){const w=S.word.lk;LKM[w]={lv:Math.max(3,lkLv(w)),due:Date.now()+7*864e5,seen:((LKM[w]||{}).seen||0)+1};store.set('es_lk',LKM);addXP(3,'حفظتِ أداة');render();return}
  if(d.lkagain&&S.word&&S.word.lk){const w=S.word.lk;LKM[w]={lv:0,due:Date.now(),seen:((LKM[w]||{}).seen||0)+1};store.set('es_lk',LKM);toast('بترجع لك في مراجعة اليوم');render();return}
  if(d.lktry&&S.word&&S.word.lk){const W=S.word;const t=(W.typed||'').trim();if(words(t)<4){toast('اكتبي جملة كاملة (٤ كلمات أو أكثر)');return}if(!AI){W.res={ok:new RegExp('\\b'+W.lk.replace(/ /g,'\\s+')+'\\b','i').test(t),ar:'المدرّبة غير متاحة الحين. قارني جملتك بالمثال والقاعدة فوق.',better:''};drawSheet();return}W.busy=true;W.err='';W.res=null;drawSheet();lkCheck(W.lk,t).then(r=>{if(S.word===W){W.res=r&&typeof r.ok==='boolean'?r:null;if(!W.res)W.err='ما وصلني رد واضح. جرّبي مرة ثانية.';if(W.res&&W.res.ok){lkMark(W.lk,true);addXP(5,'جملة صحيحة')}}}).catch(e=>{W.err=errText(e)}).finally(()=>{W.busy=false;if(S.word===W)drawSheet()});return}
  if(d.lkreview){stopSpeed();S.room='practice';S.dayCtx=null;newGame('lkmix');try{window.scrollTo({top:0})}catch(e){}return}
  if(d.lkgame){stopSpeed();S.room='practice';S.dayCtx=null;newGame(d.lkgame);try{window.scrollTo({top:0})}catch(e){}return}
  if(d.lkwcheck&&S.game){const G=S.game;const R=G.rounds[G.i];const t=(R.typed||'').trim();if(words(t)<4){toast('اكتبي جملة كاملة (٤ كلمات أو أكثر)');return}
    const has=new RegExp('\\b'+R.lkw.replace(/ /g,'\\s+')+'\\b','i').test(t);
    if(!AI){R.res={ok:has,ar:has?'استخدمتي الأداة. قارني جملتك بالمثال والقاعدة.':'جملتك ما فيها الأداة المطلوبة.',better:''};answer(G,has?'ok':'no');return}
    R.busy=true;R.err='';render();lkCheck(R.lkw,t).then(r=>{R.busy=false;if(!r||typeof r.ok!=='boolean'){R.err='ما وصلني رد واضح. جرّبي مرة ثانية.';render();return}R.res=r;if(S.game===G&&G.rounds[G.i]===R)answer(G,r.ok&&has?'ok':'no')}).catch(e=>{R.busy=false;R.err=errText(e);render()});return}
  if(d.sayword){speak(S.word.key,.8);return}
  if(d.retryword){S.word.err='';translate(S.word.key,S.word.sent);return}
  if(d.saveword){const D=S.dict[S.word.key];const i=S.vocab.findIndex(v=>v.w===S.word.key);if(i>=0)S.vocab.splice(i,1);else S.vocab.unshift({w:S.word.key,ar:D.ar});store.set('es_vocab',S.vocab);drawSheet();return}
  if(d.savesent){const e=byId(S.essay);const i=S.saved.findIndex(s=>s.text===S.word.sent);if(i>=0)S.saved.splice(i,1);else if(e)S.saved.unshift({text:S.word.sent,id:e.id,n:e.n});store.set('es_saved',S.saved);drawSheet();return}
  if(d.tick){S.ticks[d.tick]=b.checked;store.set('es_ticks',S.ticks);if(b.checked){addXP(15,'مهمة');const dn=+d.tick.split('_')[0];if(dayDone(PLAN[dn-1])){celebrate();setTimeout(()=>toast('خلّصتِ اليوم '+dn+'! أبدعتِ'),400)}}render();return}
  if(d.day){S.dayOpen=+d.day;render();const t=$('#dayT');if(t)t.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(d.open!==undefined){S.essay=+d.open;S.room='library';S.word=null;render();try{window.scrollTo({top:0})}catch(e){}if(AI&&!S.expl[S.essay])explainEssay(S.essay);return}
  if(d.back){S.essay=null;S.word=null;render();return}
  if(d.explain){explainEssay(+d.explain);return}
  if(d.libtype){S.lib={topic:'',type:d.libtype,q:''};S.essay=null;go('library');return}
  if(d.speak!==undefined){speak(byId(S.essay).p[+d.speak]);return}
  if(d.togglelk){S.showLk=!S.showLk;render();return}
  if(d.markread){if(S.read[d.markread])delete S.read[d.markread];else{S.read[d.markread]=true;addXP(20,'قراءة مقالة')}store.set('es_read',S.read);render();return}
  if(d.writeQ){startWrite(+d.writeQ);go('practice');return}
  if(d.write){startWrite(d.write);go('practice');return}
  if(d.chatTopic){const e=byId(+d.chatTopic);S.chat={mode:'p3',turns:[],topic:e.q.slice(0,240),autoSpeak:S.chat.autoSpeak};go('chat');return}
  if(d.game){stopSpeed();newGame(d.game,S.game&&S.game.id===d.game?S.game.scope:null);return}
  if(d.gback){stopSpeed();S.game=null;render();return}
  if(d.pick!==undefined&&H&&H.picked==null){const R=H===S.test?S.test.items[S.test.i]:S.game.rounds[S.game.i];answer(H,R.opts[+d.pick].val);return}
  if(d.next&&H){H.i++;H.picked=null;if(H===S.test&&H.i>=H.items.length)H.stage='intro';render();return}
  if(d.op!==undefined&&H){const R=H.rounds[H.i];const pi=+d.op;const k=R.picked.indexOf(pi);if(k>=0)R.picked.splice(k,1);else R.picked.push(pi);render();return}
  if(d.orderreset&&H){H.rounds[H.i].picked=[];render();return}
  if(d.ordercheck&&H){const R=H.rounds[H.i];answer(H,R.picked.every((p,k)=>p===k)?'ok':'no');return}
  if(d.tile!==undefined&&H){const R=H===S.test?H.items[H.i]:H.rounds[H.i];R.built.push(+d.tile);render();return}
  if(d.unb!==undefined&&H){const R=H===S.test?H.items[H.i]:H.rounds[H.i];R.built.splice(+d.unb,1);render();return}
  if(d.buildcheck&&H){const R=H===S.test?H.items[H.i]:H.rounds[H.i];answer(H,R.built.map(i=>R.toks[i]).join(' ')===R.toks.join(' ')?'ok':'no');return}
  if((d.sayfull||d.sayslow)&&H){const R=H===S.test?H.items[H.i]:H.rounds[H.i];speak(R.full||R.target,d.sayslow?.65:.85);return}
  if(d.mic){micInto('typeIn');return}
  if(d.typecheck&&H){const R=H===S.test?H.items[H.i]:H.rounds[H.i];R.typed=($('#typeIn')||{}).value||'';const D=diffWords(R.target,R.typed);answer(H,D.ok/D.total>=.8?'ok':'no');return}
  if(d.prontips&&S.game){pronTips(S.game.rounds[S.game.i]);return}
  if(d.wback){stopW();S.write=null;render();return}
  if(d.newq){stopW();startWrite(null);render();return}
  if(d.wtimer){const W=S.write;W.running=!W.running;if(W.running){wTimer=setInterval(()=>{W.secs=Math.max(0,W.secs-1);const el=$('#wTime');if(el)el.textContent=fmt(W.secs);if(W.secs===0)stopW()},1000)}else stopW();b.textContent=W.running?'إيقاف مؤقت':'ابدئي المؤقت';b.className='btn '+(W.running?'ghost':'acc')+' sm';return}
  if(d.wcheck){S.write.text=($('#wText')||{}).value||S.write.text;evaluateStructure();if(words(S.write.text)>=150)dayWriteDone();render();return}
  if(d.aiEval){aiEvaluate();return}
  if(d.sayimproved){const W=S.write;if(W&&W.ai)speak(W.ai.improved);return}
  if(d.starttest){newTest();S.room='test';render();return}
  if(d.introeval){introEval();return}
  if(d.finishtest){finishTest();render();return}
  if(d.mode){S.chat={mode:d.mode,turns:[],autoSpeak:S.chat.autoSpeak,topic:S.chat.topic};store.set('es_chat',S.chat);render();return}
  if(d.chatsend){chatSend();return}
  if(d.chatmic){micInto('chatIn');return}
  if(d.chatreset){S.chat={mode:S.chat.mode,turns:[],autoSpeak:S.chat.autoSpeak};store.set('es_chat',S.chat);render();return}
  if(d.sayturn!==undefined){try{speak(JSON.parse(S.chat.turns[+d.sayturn].content).reply)}catch(e){}return}
  if(d.saybetter!==undefined){try{speak(JSON.parse(S.chat.turns[+d.saybetter].content).better)}catch(e){}return}
  if(b.id==='autoSpeak'){S.chat.autoSpeak=b.checked;store.set('es_chat',S.chat);return}
  if(d.unsave!==undefined){S.saved.splice(+d.unsave,1);store.set('es_saved',S.saved);render();return}
  if(d.saySaved!==undefined){speak(S.saved[+d.saySaved].text);return}
  if(d.sayv!==undefined){speak(S.vocab[+d.sayv].w,.8);return}
  if(d.unvocab!==undefined){S.vocab.splice(+d.unvocab,1);store.set('es_vocab',S.vocab);render();return}
  if(d.deldraft!==undefined){S.drafts.splice(+d.deldraft,1);store.set('es_drafts',S.drafts);render();return}
});
function stopW(){if(wTimer){clearInterval(wTimer);wTimer=null}if(S.write)S.write.running=false}
document.addEventListener('keydown',ev=>{if(ev.target.id==='chatIn'&&ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();chatSend()}if(ev.key==='Escape'&&S.word){S.word=null;drawSheet()}});
document.addEventListener('input',ev=>{
  const id=ev.target.id;
  if(id==='wText'){S.write.text=ev.target.value;const c=$('#wCount');if(c)c.textContent=words(ev.target.value)+' كلمة';return}
  if(id==='chatIn'){S.chat.draft=ev.target.value;return}
  if(id==='introIn'&&S.test){S.test.intro=ev.target.value;return}
  if(id==='lkTry'&&S.word){S.word.typed=ev.target.value;return}
  if(id==='typeIn'){const H=S.room==='test'?S.test:S.game;if(H){const R=H===S.test?H.items[H.i]:H.rounds[H.i];R.typed=ev.target.value}return}
  if(id==='fQ'){S.lib.q=ev.target.value;clearTimeout(window._fq);window._fq=setTimeout(()=>{const pos=ev.target.selectionStart;render();const f=$('#fQ');if(f){f.focus();try{f.setSelectionRange(pos,pos)}catch(e){}}},250)}
});
document.addEventListener('change',ev=>{if(ev.target.id==='fTopic'){S.lib.topic=ev.target.value;render()}if(ev.target.id==='fType'){S.lib.type=ev.target.value;render()}});
render();

</script>

</body></html>
