t animals from books and not be able to see them alive. I think it is shameful for humankind to explain our children that we are the reason why those animals disappeared.","In conclusion, I would like to say that the issue about losing important natural resources is topical and open for debate nowadays. I believe that together people can make a difference. From my point of view, the first problem we should find a solution for is human's overpopulation. As I mentioned above people's demands are growing and this means we consume more and more natural resources. The second question, which is on the list of most important issues, is pollution including the air pollution, water pollution, etc.","(325 words)"],"id":24,"t":"opinion","c":4},{"n":26,"topic":"THE ENVIRONMENT & NATURAL SOURCE","q":"The rising levels of congestion and air pollution found in most of the world's cities can be attributed directly to the rapidly increasing number of private cars in use. In order to reverse this decline in the quality of life in cities, attempts must be made to encourage people to use their cars less and public transport more. Discuss possible ways to encourage the use of public transport.","p":["Anyone who lives in a city is aware of the increasing number of cars on the road and the kinds of problems this creates: traffic jams, air pollution and longer commuting periods. As economies grow and access to cars spreads to increasing numbers of people, this trend is likely to worsen. The solution, it would seem, is for governrnment to encourage the use of public transport in urban areas, thus decreasing dependence on the car.","One way to stimulate public transport use is to make private car use more expensive and inconvenient. The introduction of tolls along urban motorways has been successfully employed in many cities. Other such measures are high-priced permits for parking in urban areas and the restriction of parking to a limited number of cars. Faced with high costs or no place to park, commuters would perhaps be more willing to abandon their cars in favour of buses or trains.","There are also less punishing ways of spurring public transport use. The construction of free carparks at suburban train stations has proven successful in quite a number of countries. This allows commuters to drive part of the way, but take public transport into the central, most congested, urban areas.","Indeed, making public transport more comfortable and convenient should work to attract more commuters and decrease traffic congestion. Public transport that is convenient and comfortable retains its passengers, much like any business that satisfies its customers. The more commuters committed to taking public transport, the less congestion on city streets."],"id":25,"t":"other","c":4},{"n":27,"topic":"THE ENVIRONMENT & NATURAL SOURCE","q":"The earth is being filled with waste material such as plastic bags and other rubbish. Is this really happening? What are some solutions to this problem?","p":["Over the past few decades, the increasing amount of industrial wastes and household garbage has become a major problem in many countries. People have questioned what caused this problem and what can be done to improve the situation. In my opinion, two of the most critical causes of this waste material problem are the increased consumption and a shortage of space for landfill.","To begin with, modern lifestyle has contributed greatly to the increasing amount of waste and garbage we produce everyday. In other words, we have turned into a materialistic and mass-consumption society where we use more and throw away more than ever before. Moreover, countries are running out of space to store garbage and waste material. In fact, securing land for waste disposal raises controversies in many countries.","To solve this intractable problem, every citizen needs to participate in producing less garbage. For example, we can bring our own personal shopping bags instead of using plastic bags provided by stores and shops. Besides, the government can enforce stricter laws on companies to use biodegradable packaging or use recycled material. Indeed, this alone can eliminate much of the waste which is sent to at land fills. Companies can also contribute by developing new raw material which is recyclable and will ultimately lead to less garbage. One good example of this is that tire companies develop new tires for cars which are not made of rubber but of new biodegradable material.","As discussed above, individuals, business and the government can share the responsibility to reduce the amount of waste material and to save the earth. I hope that in the future our offspring will be better off with the well-preserved environment.","(282 words)"],"id":26,"t":"problem","c":4},{"n":28,"topic":"SCIENCE & TECHNOLOGY","q":"With all the troubles in the world today, money spent on space exploration is a complete waste. The money could be better spent on other things.","p":["Nations after nations, everyday, every year, celebrate their achievements in space exploration . However, it is now time to question how meaningful these blasts are. This essay aims to explain why it is questionable.","First, until all urgent and important matters in this globe have been solved, money bumped on space exploration is of no meaning. It is not a common sense at all to invest million dollars researching and producing foods for astronauts (for space exploration purpose), while everyday thousands of people are starving. Furthermore, the discovery of outer space only serves a minor group of people if the majority are even not well- educated. Those in rural areas or third-world nations do no even know how to prevent common threatening diseases like AIDS and lung cancer.","Then, some may argue that the purpose of space exploration are to discover new lands, new energy resources or to deter potential threat to globe. Nevertheless, is it effective to do so while other alternatives are available? Lands on earth are no yet effectively used. New energy resources (e.g. solar and nuclear energy) have not yet been widely-used. Threats of plagues have not yet been deterred. All these ?not- yets? need money. That is why costly space discovery programs are a waste of money.","In the nutshell, people should only invest in space exploration providing that () early- mentioned urgent and important matters have been solved. Also, purposes of space exploration campaign should be studied carefully and other alternatives should be considered before money is wasted.","This is a very good essay, well done."],"id":27,"t":"other","c":5},{"n":29,"topic":"SCIENCE & TECHNOLOGY","q":"Some say that the internet is making the world smaller by bringing people together. To what extent do to you agree that the internet is making it easier for people to communicate with one another.","p":["A global village, that is certainly what the world feels like nowadays. With the help of the world wide web, you can reach out and get to know people you might never meet in person. Articles can be coauthored, business deals can be finalized, degrees can be earned and at times even medical advice can be given?and all of this is just a click away.","Electronic mail, instant messages, web cameras and microphones; all these gadgets and programs make the presence of the other the person more real. Who knows; with the help of visual reality you might even get a 3-D image of the speaker! I believe that the internet is one the best inventions of the last century, you can hardly get to miss anyone and nobody is really out of reach. You will get to keep the channels patent with your friends, and will be able to do your work from your bedroom in your pajamas!","However, the internet can also be a major source of harassment. Spammers and hackers can invade your privacy and get personal/confidential information, which otherwise they will never get access to. You are never out of anybody’s reach, unless you make a conscious decision of not checking your email, there can be always more work waiting for you in your inbox and you might never have a moment for yourself. Worse, if you were a workaholic, you might never experience that stress-free vacation ever again in your life?simply, because you have your mobile workplace with you.","As a romantic, I will always look forward to getting an occasional letter in the snail mail. A personal letter, where I can sense the mood of the writer by the slants in his/her handwriting and get to know him/her better. But as a type A personality person, the internet gives me all what I dream of in communication?speed, reliability, and convenience of time and place. I can certainly tolerate its shortcomings any day, as long as it keeps me close to my loved ones.","This is a great essay, at least band 7 and maybe even 8. It is longer than required (340 words instead of 250) which means that it took you more time to write and less time to check your work."],"id":28,"t":"opinion","c":5},{"n":30,"topic":"SCIENCE & TECHNOLOGY","q":"Internet when used as a source of information, has more drawbacks than advantages. To what extent do you agree with this statement?","p":["Some people believe that internet access creates problems. There are several possible reasons why it can happen.","First, some data may be unverifiable. For example, everytime they search for a data, there would be lots of choices that would appear on the screen. They would not be sure if the data they are reading has accurate information. Some sources have even outdated informations. Second, some sites may be unreliable. For instance, people sign up on one site that sells goods using online purchases. The goods would be paid for by credit card but the purchaser would not receive anything. And finally, not everything is available through the net. When my friend had tried to research for some pictures of 18th century paintings, he did not find any results. Then he was told by his teacher that it would only be available in the library.","Others believe that internet is very useful and these are the justifications. First, it is hard to get data, that is available in the net by other means. For example, if directory information could not give me the accurate address and contact number of the place I want to visit, I normally check that information from the Internet. In just one click, I would get all the details of that certain company. Second, research becomes more comprehensive. For instance, I do not have to buy lots of reading materials to complete my research. Most of the needed information can be found if I have Internet access. And finally, data is easily compared and contrasted. I remember, my cousin researched the study about overweight children a decade ago and at present. He was able to finish his research in just one day, as compared to week if he would not use the Internet.","In conclusion, let me reiterate that the Internet plays a big role in our life, because it makes data retrieval and comparison easier.","It?s a good essay, the arguments are clear, the language and the grammar are also good. Structure needs to be improved little bit - make paragraphs smaller, re-divide so there would be 5 paragraphs instead of 4. In case it is argument essay ? give your opinion in the conclusion only. In case of opinion essay ? give your opinion in the introduction"],"id":29,"t":"advdis","c":5},{"n":31,"topic":"SCIENCE & TECHNOLOGY","q":"Some people say that the Internet is making the world smaller by bringing people together. To what extent do you agree that the internet is making it easier for people to communicate with one another?","p":["In today world _ due to the advancement of technology new inventions are coming into existence. It is a certainty that ?necessity is a mother of invention?. _ Internet is just like a wonder box, which contains every type of information. Besides it has also proved as a very important tool to connect people with each other.","In today?s modernized era nobody has sufficient time to write letters to their loved ones. Moreover it also takes longer to send or receive any information. But through an internet it is an easiest way to send massages to our loved ones. Either it can be in the form of an e- mail or by text messages from internet to cell phones. We can send and receive messages straight way.","In other hand today?s youth generation mostly prefer to do chatting on () internet. Through this chatting we can write messages and straight way can get their reply. Moreover voice chatting is going to be very popular day-by-day.","As it is a reality that advantages and disadvantages are like both sides of a coin, which usually runs parallel. So like other things internet also have some downsides, like people are facing some health problems for example, poor eye-sight, back ache, migrane. Today?s teenagers usually prefer to spend their time on internet rather than to participating in other physical activities, so that?s why they are going to be weaker in their physical health.","To conclude, I would like to say that internet is one of the most modernized and most successful tools, not only for communication, even to get most relevant information regarding every field in a very short period of time.","This is a great essay, well done! Remember ?the Internet? is a proper noun, currently, there is only one. Pay attention to your punctuation - many commas are missing after linking words. Otherwise, the essay is well argued and set out."],"id":30,"t":"opinion","c":6},{"n":32,"topic":"SCIENCE & TECHNOLOGY","q":"We have been living in the nuelear age now for over half a century. Since the first atomic bombs were developed, nuclear technology has provided governments with the ability to totally destroy the planet. Yet the technology has been put to positive use as an energy source and in certain areas of medicine. To what extent is nuclear technology a danger to life on Earth? What are the benefits and risks associated with its use?","p":["These days, many people are afraid of nuclear technology because of the dangers associated with its use. In my opinion, although it is true that nuclear weapons pose the greatest threat to life, the use of nuclear technology for peaceful purposes also carries some serious risks.","Nuclear power stations provide an important source of cheap power for many industrialised nations and some developing countries. However, there is always the danger of radiation leaking from these plants. Even though safety precautions are taken, there have been numerous disasters such as the explosion of a nuclear plant in Russia not long ago.","Nuclear technology is even used to help cure some diseases such as cancer. Radiation can be applied to the body to burn away cancerous cells. This is, however, a dangerous procedure, and the application of radiation is almost always painful and not always successful. The most worrying aspect of nuclear technology, though, is its use for military purposes. Enough atomic bombs have already been built to completely destroy the planet, and the real danger is that one day some country will start a war with these weapons. Too many countries now have the technology required to make such bombs, and there is currently much debate about how to control the situation.","In conclusion, nuclear technology certainly has positive uses, but is, nonetheless, dangerous. However, it would have been better if it had never been used to create nuclear weapons. If life on Earth is to continue."],"id":31,"t":"advdis","c":4},{"n":33,"topic":"SCIENCE & TECHNOLOGY","q":"'Telecommuting' refers to workers doing their jobs from home for part of each week and communicating with their office using computer technology. Telecommuting is growing in many countries and is expected to be common for most office workers in the coming decades. How do you think society will be affected by the growth of telecommuting?","p":["The spread of telecommuting is sure to have far-reaching effects on society. By itself, telecommuting refers to offiice workers spending much of their time working from home and using electronic technologies to communicate with their employers. The broader implications of telecommuting, however, may involve changes to corporate structure, workers' lifestyles and even urban planning.","The most obvious changes may be apparent in the `normal' offices of companies, governments and other organisations. If even half the working week is spent telecommuting from home, then we would initially expect many empty desks in the offiice. As offices grow smaller, workers coming in for the day would be expected to share desks with their absent colleagues. This, in turn, may affect the social atmosphere of an organisation, however, as less social contact with one's colleagues could harm morale and loyalty.","For the individual office worker, telecommuting would mean spending more time at home. For a parent with young children, this may be a blessing. Moreover, many telecommuters would be able to work the hours they wished: having a nap in the afternrnoon, for example, but working some hours in the evening. One substantial benefit for all telecommuting workers is that there will be no need to travel to work, allowing more free time.","The structure of urban life is also likely to be affected by telecommuting. We would expect to see fewer cars on the road during peak hours and, eventually, a smaller concentration of offiices in cities' central business districts. In short, people will have less reason to travel to city centres from outlying areas. As more people work and live in the same location, shops and cultural events will likely relocate themselves out of the city centre.","In sum, telecommuting will serve not only to change the way we work but also the way we live."],"id":32,"t":"opinion","c":5},{"n":34,"topic":"SCIENCE & TECHNOLOGY","q":"Telecommuting: will it change the world?","p":["Telecommuting will have major effects in the worlds of work and family life. However, its biggest effect will be in the area of individual freedom, responsibility, and time management.","Work and workplaces will alter dramatically. Offices may become smaller, as fewer desks are needed. There will be greater need for high-bandwidth connections to link the office and the home, and even homes to other homes, as other employees and supervisors also begin working at home. Hours spent commuting, traffic jams, and fights for parking should diminish, as workers make fewer journeys or work staggered hours.","Family life will also change. Workers, both husbands and wives, can arrange their work around family commitments such as taking children to school, cooking, leisure activities, etc. However, households will also have to set aside areas for work - particularly if both spouses are telecommuting.","However, although the ideas of more time at home and less time traveling are attractive, there are some drawbacks to telecommuting. People may feel unable to escape their work, and may even work longer or more unsocial hours. The quality of work may suffer because of the reduced face-to-face interaction with other employees. There may be delays if other workers are not immediately available. Telecommuters may feel isolated or unmotivated, or insecure about decisions. A major change will be in the way people think about work as a place or an institution. Instead, they will focus on the task or product. Workers may feel less loyal to a company and more inclined to change jobs or work part- time or on contract.","In conclusion, the effects are difficult to predict because they depend on the extent to which telecommuting becomes popular. However, telecommuting could be the start of a major societal shift, possibly as big as the Industrial Revolution which created our present ideas of work.","(305 words)"],"id":33,"t":"two","c":5},{"n":35,"topic":"SCIENCE & TECHNOLOGY","q":"With the increasing popularity of computers and calculators, student literacy is decreasing dramatically. What are the positive and negative effects the progress of science and technology has brought about?","p":["It has been widely noted that, with the growing use of computers and calculators both in the classroom and in the home, the level of literacy and mathematical ability of students is dropping. This raises serious doubts about the value of the progress of science and technology. Here I will discuss the pros and cons of this question.","First of all, advances in science and technology have certainly brought about many benefits for mankind. They have made our lives more comfortable and healthier. In addition, they have eased the burden of work for most people and provided them with more leisure opportunities, while at the same time increasing productivity dramatically.","Nevertheless, it cannot be denied that technology has some negative side-effects. As mentioned above, with computers which check spelling, grammar and calculation for them, students have little incentive to learn how to do these things for themselves. Also, the availability of TV programs and videos encourages an unhealthy, sedentary lifestyle.","Another aspect of this issue is that technology may be good or bad, depending on how we use it. For instance, dynamite may be used to make road construction easier, or it may be used to kill people. Again, nuclear reactors can supply huge amounts of cheap electricity, but if they are carelessly handled they can cause devastating pollution.","We can conclude that the progress of science and technology has both positive and negative effects. What we must do is to make sure that the positive ones are encouraged and the negative ones are eliminated as far as possible. Among other things, this means that students are warned not to let computers and calculators do all their work for them."],"id":34,"t":"problem","c":5},{"n":36,"topic":"THE MEDIA","q":"Compare the advantages and disadvantages of three of the following as media for communicating information. State which you consider to be the most effective.","p":["• Comics , books , radio , television , film , theatre In our daily life, we always communicate information through the media, such as television, radio, film, These media have different advantages and disadvantages for us. Now, I am going to compare the advantages and disadvantages of books, television and film.","Books bring us different knowledge. It bases on what Book we read. A famous Chinese traditional verse which described books is a treasure. We can find a golden house in there. Moreover, when we want to read it, we can find it easily, such as bookstore, library. We can also learn a lot of words from books. And it can improve our reading and writing skills.","However, books always are not attractive for children or youngster. It is because books are quite boring. A lot of words and less pictures inside the books, compare to television, television has pictures and sound, we don't have to read a lot of words in television. But some artist in television programme or film, bring a bad image to us. Then some children or youngers will imitate their behaviour. Some film also bring a wrong message to us, For example, they are always smoking in films. It seems that smoking is good and smart. It caused many youngers imitate them smoking.","In conclusion, bookds, television and film have many advantages and disadvantages. I cannot write all in here. And we have choose the media carefully.","(231 words)"],"id":35,"t":"advdis","c":4},{"n":37,"topic":"THE MEDIA","q":"Do you agree or disagree with the following statement? Television has destroyed communication among friends and family. Use specific reasons and examples to support your opinion.","p":["The invention of television is undoubtedly one of humankind's greatest inventions. It is a way of communication among people of one country and different countries and nations. People watch TV to find out about the latest news, weather, sports, etc. It is a great way to learn new and extend one's range of interests. Scientists say that children spend the same amount of hours in front of TV as they do in school. I think that this can be said about many grown people too. Also, television is a great means of eliminating stress and tension. One can relax and leave one's troubles behind lying on one's favorite sofa and watching a comedy. However, some people believe that television has destroyed communication among friends and family.","Personally, I do not agree with this statement. A couple centuries ago people spent their time gambling, reading, gossiping or playing chess. I do not think that television is a cause of destroyed communication among family members and friends. First of all, if members of a family have common interests and they want to make each other happy they will always find many ways to spend their time together and be close. Otherwise, if people avoid each other and they do not have anything to share with each other they will find television a great way to escape from this miserable existence. I believe that many people chose family and their friends over some soap operas or a movie.","Second of all, I think that television can be a great resource of subjects to discuss. Many people watch different educational programs to find out more about their environment, nature, wild life animals, economic situations, etc. So, when they gather with their friends they discuss important issues and arque with each other in looking for the truth.","My husband and I often watch the news channel to keep abreast of the latest news. After that we always discuss some issues we concerned about. Also, we like to watch a TV show \"the funniest animals\". We like this program because it makes us laugh. I can not imagine how these programs can prevent our communication and be harmful to our relations.","To summarize, I would like to add that if people want to communicate with each other they will find a way to do it. Otherwise, if television were not existent, people would find other escapes and reasons not to be with each other such as drugs, gambling, etc.","(413 words)"],"id":36,"t":"opinion","c":5},{"n":38,"topic":"THE MEDIA","q":"News editors decide what to broadcast on television and what to print in newspapers. What factors do you think influence these decisions? Do we become used to bad news? Would it he better if more good news was reported?","p":["It has often been said that. Good news is bad news. because it does not sell newspapers. A radio station that once decided to present only good news soon found that it had gone out of business for lack of listeners. Bad news on the other hand is so common that in order to cope with it, we often simply ignore it. We have become immune to bad news and the newspapers and radio stations are aware of this.","While newspapers and TV stations may aim to report world events accurately, be they natural or human disasters, political events or the horrors of war, it is also true that their main objective is to sell newspapers and attract listeners and viewers to their stations. For this reason TV and radio stations attempt to reflect the flavour of their station by providing news broadcasts tailor-made to suit their listeners. preferences. Programmes specialising in pop music or TV soap operas focus more on local news, home issues and up-to-date traffic reports. The more serious stations and newspapers like to provide .so called. objective news reports with editorial comment aimed at analysing the situation.","If it is true, then, that newspapers and TV stations are tailoring their news to their readers. and viewers. requirements, how can they possibly be reporting real world events in an honest and objective light? Many radio and TV stations do, in fact, report items of good news but they no longer call this news. They refer to these as human interest stories and package them in programmes specialising, for instance, in consumer affairs or local issues. Good news now comes to us in the form of documentaries the fight against children.s cancer or AIDS, or the latest developments in the fight to save the planet from environmental pollution.","---------------------","Sample 2:","News editors decide what to broadcast on television and what to print in newspapers. There are two factors that influence their decisions. The first is the kind of customers they tend on. Because each kind of readers and watchers has its own features. For example, if your customers are almost teenagers, you have to concentrate on something attracting them such as stories, photographs about singer stars, film stars, funny tales, and young fashion. It will be very silly if you try to provide teenagers with economic, politic news. On the contrary, besiness men and politicians may never read news about James Blunt or Keira Knightley. Therefore, what influence news editors’ decisions the most is the taste of their customers.","The second is the hot, the attraction of news. Who will reads or watchs your news if it was one year, one month ago even last week? The answer is nobody absolutely. In the energetic and competitive world nowadays, people always ask for really new news. So that to satisfy customers, there is a pressure on all editors to find continually what has already happened not only yesterday but even an hour ago. Or else, they will lose their customers. None of editors wants that bad future.","On television or in newspaper, we seem to become used to bad news. It is a little of difficult for us to meet a piece of good news. We can’t deny that bad things occur on the earth day by day. However, news editors try to gain more and more customer, which means more and more money, by bad news. Because bad news makes us curious. We want to know why it is bad, what it is about, whether it influences us or not. As a result, we will buy newspapers or watch television to find out. And the happiest people are, of course, news editors.","I think it would be better if more good news was reported. Bad news makes us worry and sad. Whereas good news makes us happy. How much bad news is, there should be the same amount of good news. So, we can give something bad a lot of thought while still be joyful with good news. Any inequalities between good news and bad news should be avoided. That is the best solution.","Now, we can’t live without news. Thereby, the role of news editors is very important. We should support them. And what they have to do is try their best to provide us useful news, both good and bad.","Some of your sentences are too short - they would look better joined together. Overall, a very good essay ? to me it looks like Band 7 candidate."],"id":37,"t":"opinion","c":4},{"n":39,"topic":"THE MEDIA","q":"Many people believe that television programs are of no value for children. Do you agree? Why or why not? Provide reasons and examples to support your response.","p":["Televisual media has become a pervasive force in the lives of families around the world today. Yet, a central question remains regarding whether watching television is harmful or beneficial for children. An analysis of this question reveals that television programs present three major concerns in the case of children, including depictions of violence, the use of profane language, and the representation of poor moral role models.","Television programs that portray violence are a paramount concern for parents nowadays. Recent research has shown that children may commit acts of violence because they wish to emulate the behavior that they see on television. This is especially true when violent acts are committed by well-known action “heroes.” In addition, television programs show cartoon figures, as well as actors, committing violent acts. Using comic situations to depict violent themes causes further problems with the way in which young people view violence.","Television programs that contain profane or disrespectful language also worry parents with young children. Because censorship laws have relaxed over the past few decades, it has become very common for television programs of each and every kind to show characters expressing impolite, rude, and insulting utterances to one another. Bearing resemblance to the case of portrayals of violence, children unfortunately often try to imitate these actions they watch on their television screens.","Finally, some parents are upset about the moral behavior depicted on television. As they struggle to teach their children moral and ethical values, parents might despair about the lack of morals and ethics represented in some of the so-called role models on television. For instance, certain characters not only have no remorse for their immoral actions, but also frequently go unpunished by larger society.","Because of these factors, many parents believe that television programs send their youth the wrong kinds of messages. The emulation of this poor behavior by their children is something they wish to avoid at all costs, and they have accordingly decided to ban television in their households for these reasons."],"id":38,"t":"opinion","c":5},{"n":40,"topic":"THE MEDIA","q":"Television has had a significant influence on the culture of many societies. To what extent would you say that television has positively or negatively affected the cultural development of your society?","p":["It has been around forty years since television was first introduced into Australian households and people today still have mixed views on whether it has a positive or a negative influence on the society.","Many people believe that television damages culture. It promotes the stronger cultures of countries such as Britain and North America and weakens the cultures of less wealthy countries. This is because the stronger, wealthier countries are able to assert their own culture by producing more programs that are shown widely around the world. These programs then influence people, particularly young people, in the countries where they are shown.","Also, because television networks need to attract large audiences to secure their financial survival, they must produce programs which are interesting to a broad range of people. In Australia this range is very broad because we are a multicultural society and people of all ages like to watch television. To interest all these different people, most television programs are short in length, full of action and excitement, do not require much intelligence or knowledge to understand, and follow universal themes common to all cultures, such as love and crime. Television programs which concentrate on or develop themes pertinent to one particular culture are not so successful because they interest a smaller audience.","Nevertheless we much acknowledge that television does have some positive effects on the cultures within a society as well. People who do not live within their own culture can, in a limited way, access it through the multicultural station on the television. For example, Aboriginal children who have grown up in white families, or migrants and international students living in Australia, can watch programs from their own culture on the television.","In conclusion, I hold the view that television promotes and strengthens those cultures that are wealthy and influential while it weakens the cultures that are already in a weakened position."],"id":39,"t":"opinion","c":5},{"n":41,"topic":"THE MEDIA","q":"The mass media, including television, radio and newspapers, have great influence in shaping people's ideas. To what extent do you agree or disagree with this statement?","p":["The mass media have a powerful influence in shaping our lives. We have come to depend on them for information and entertainment, and in doing so we let them affect important aspects of our lives.","The undeniable usefulness of the media in almost instantly providing information about events around the world is largely taken for granted. But in our dependence on the media we have allowed them to mould our notions and opinions of events, places and people. Though few of us probably think about it, our conceptions of, say, our elected officials spring from television images and newspaper stories. Most of us will never meet prime ministers or presidents, but anyone who is regularly exposed to the media will have an opinion of them. When it is time to cast our vote, we will make our decision based on how the media portray the candidates. We are similarly swayed by coverage of wars. The media, representing the values of their owners, societies and governments, tend to report wars with a bias; which is the 'good' side and which the 'bad' is determined for us by reporters, editors and commentators, and sure enough the public begins to form opinions that reflect the coverage they see, hear and read in the major media.","The media are also influential in the way they facilitate the spread of culture and lifestyle. The so-called 'global youth culture', in which one finds young people around the world displaying a common interest in music, clothing styles and films, is an example of the media's enormous sway in this regard. A popular figure such as Michael Jackson would never be so well known were it not for the media's extensive reach into every society on the globe.","Thus I would argue that the mass media's influence is certainly great. Indeed, with technological advancements such as the Internet bringing even more forms of electronic media to our homes and workplaces, it is likely the media's influence will grow even stronger."],"id":40,"t":"opinion","c":4},{"n":42,"topic":"ADVERTISEMENT AND CUSTOMER","q":"Advertising is all around us, it is an unavoidable part of everyone?s life. Some people say that advertising is a positive part of our lives while others say it is negative. Discuss both views and give your own opinion. Give reasons for your answer and include any relevant examples from your own knowledge or experience. You should write at least 250 words.","p":["Many people wonder about advertisement. Some people think that it has negative impact in our life. However, others said it has been playing as positive effect in this world. This is not an easy essay to be answered, but I will look at this issue.","Why advertisement has been playing a negative effect in our life ? Of Course for several reasons: firstly, it motivates the psychological point in every body especially women. They will run to buy this advertised product especially if it’s from cosmetic roof, just to show their beauty to men, which will leads to more offender and raped cases. Secondly, you can sit comfortably with your family and suddenly the telephone is ringing, nothing important, rather than one of the companies try to convince you to buy one of their products. It is a real intrusive example of advertisement. Lastly, sometimes you do not have the financial ability to buy something, but with these new methods of advertisement, you will run to buy it, which will affect your budget.","On the other hand, there are some good things. Such as, it compares the prices of the most of companies which benefit the consumer. Beside, it really opens our vision to see more products which we do not knowit unless TV and Radio show these things. In addition to, it cut down our daily routine to see new faces and know more language with daily update for their method of advertisement.","In conclusion, as we can see there are many aspects to this essay. I feel that there is no benefit at all from advertisement, it plays on minds of people buy more thing that they do not need it at all."],"id":41,"t":"discuss","c":4},{"n":43,"topic":"ADVERTISEMENT AND CUSTOMER","q":"When people need to complain about a product or poor service, some prefer to complain in writing and others prefer to complain in person. Which way do you prefer? Use specific reasons and examples to support your answer.","p":["It is rather difficult for me to answer the question how I prefer to complain: in writing or in person because sometimes I just do not have a choice. For example, if I order a product using the Internet from another state or even country, I will more likely have the opportunity to speak to a representative of a company in person. So, in some cases I choose to speak in person and in others I prefer to complain in writing. However, I believe that every option has its advantages.","From the one side, complaining in writing brings many benefits. First of all, one does not have to spend his precious time driving, waiting for his turn and talking with a representative. He can just send mail or e-mail and get all explanation he needs. Second of all, I think it is the best way to avoid an unpleasant conversation. Personally, I do not like to complain about anything especially, in person. Finally, sometimes it is impossible to have a face-to-face conversation because a company which provided a poor product or service is too far away.","From the other side, complaining in person has some benefits too. First, this type of complaining provides an immediate feedback. So, if I have some complains about company's products I will receive all information and explanation right away. However, sending a company a letter and getting a feedback can take more then a month. Second, face-to-face conversation is often more effective. People talk to each other, see each other facial gestures and body movements, which can tell a lot about a person. In addition to these practical benefits, in the case if one can not receive creditable explanation from one representative he always can require to talk to another person. For instance, my husband recently had some extra withdraws from his account by his bank and he was not aware of it. So, he went to the bank and explained to the bank's representative the situation and they together found the solution and that money was given back to my husband's account. I think, in this case face-to-face conversation is the best way to complain and get feedback fast.","In conclusion, I think that if I have to complain about a product or poor service I will do it in person. However, if face-to-face conversation is impossible I think I have nothing left but to send a letter or write an e-mail there.","(409 words)"],"id":42,"t":"discuss","c":4},{"n":44,"topic":"ADVERTISEMENT AND CUSTOMER","q":"Do you agree or disagree with the following statement? Advertising can tell you a lot about a country. Use specific reasons and examples to support your answer.","p":["Every country has its own culture and traditions. There is no doubt that an advertising campaign conducted in Russia will not have the same affect here in the United States. Let us take for example advertisement of food and restaurants.","A huge amount of fast food stands suggest their services for breakfast, lunch, dinner and supper here in Houston. The competition is very strong. Every week you get in your mail- box an envelope with different types of discounts in exchange for visiting them or ordering pizza. Watching TV you are also from time to time invited to visit a restaurant in order to taste some delicious food. It is not because it is easy to make money cooking but because the demand for such service is high. First of all, people like to go out sometimes to have dinner with friends. Second of all, it is often impossible to drive home for lunch. It can be time consuming.","As for Russia, it is a great tradition to have dinner at home with the family and go to the restaurant for big holidays. Additionally fast food is not popular in Russia. So you will see advertisements of yogurts, coffee, dairy products and juice instead of restaurants and fast food stands.","In conclusion I would like to add that in order to succeed in advertising campaign especially on the international market company must know traditions, language and history of the country.","(239 words)"],"id":43,"t":"opinion","c":4},{"n":45,"topic":"ADVERTISEMENT AND CUSTOMER","q":"Some people say that advertising encourages us to buy things we really do not need. Others say that advertisements tell us about new products that may improve our lives. Which viewpoint do you agree with? Use specific reasons and examples to support your answer.","p":["I think that everyone can divide all advertising products and services into useless ones and useful ones. It is like looking through an information desk when you pay attention to those messages that interest you. Take me for example.","I do not like jewelry. It does not mean I do not have it at all, I have a couple of inexpensive rings as gifts from my parents. I just think, people pay too much attention to this stuff. I believe it is the result of mass advertising. Every day when I am watching TV, listening to the radio or reading the paper I notice many ads about getting an expensive ring, chain, necklace or ear-rings. From my point of view these kinds of advertising contaminate people's minds. In this case you are encouraged to buy things you do not really need. They make you believe you need such products in order to succeed or be happy.","From the other side, I think that advertisements of the new detergents with up-to-date formulas to help you maintain your cloth in perfect conditions, the new cars with some extra futures that make your traveling more comfortable and sports goods that make your life healthier may help you to improve your life.","Recently my husband and I saw an ad on the Internet about a very interesting and inexpensive vocation to Japan for a week. Is not it awesome? We like traveling. So now we are planning to find out more about it and, may be, make reservations. I believe that without advertisements we would be unaware about plenty of oppotunities that may make your life happier, easier and less stressful.","My point is that every person has his own scale of values. So if he is vegetarian he will consider an ad about meat products useless for him.","(305 words)"],"id":44,"t":"discuss","c":5},{"n":46,"topic":"ADVERTISEMENT AND CUSTOMER","q":"Some people say that advertising encourages us to buy things that we really do not need. Others say that advertisements tell us about new products that may improve our lives. Which viewpoint do you agree with?","p":["The purpose of advertising is to tell the consumer about any new product or service or any new promotion on the existing product and service. We need it so we can make good decisions when we go shopping. Advertising tells us when new and improved products become available and lets us know which ones have the best price.","Through advertising we learn about new products. For example, many grocery stores now sell prepackaged lunches. These are very convenient for busy parents. They can give these lunches to their children to take to school. Busy parents don’t have time to look at every item on the store shelf, so without advertising they might not know about such a convenient new product.","Even products we are familiar with may be improved, and advertising lets us know about this. Most people use cell phones, but new types of cell phone service become available all the time. There are different plans that give you more hours to talk on the phone, you can send text messages and photos, and next week probably some even newer type of service will be available. By watching advertisements on TV it is easy to find out about new improvements to all kinds of products.","Advertisements keep us informed about prices. Prices change all the time, but everyone can look at the ads in the newspaper and see what the latest prices are. Advertisements also inform us about sales. In fact, some people buy the newspaper only in order to check the prices and plan their weekly shopping.","Advertisements improve our lives by keeping us informed about the latest products developments and the best prices. Advertisements serve a useful purpose.","(281 words)"],"id":45,"t":"discuss","c":5},{"n":47,"topic":"CHILDREN","q":"In some countries children have very strict rules of behaviour, in other countries they are allowed to do almost anything they want. To what extent should children have to follow rules?","p":["Freedom plays a mandatory role in everybody?s life. We can see in today?s modernized era nobody likes to get some restrictions upon them, whether it would be a child or an adult. Some people think that there should have some strict rules of behaviour for children, but I disagree with this statement.","Wherever it is a reality that sometimes more restrictions can cause more frustration in children, which leads to many other mental diseases as well. Morever they can be, behave like a stubborn. Sometimes they feel themselves under pressure, which can be a main reason for their poor performance in their field. In some cases children would be crazier to do these things from where we?ll try to keep them away.","In other words _ we have to look for other aspects as well, like if we usually ignore our children?s bad habits, then they can?t be good human beings in their future life. Moreover_ if we never draw attention upon the children?s main activities then they may be acquiring bad company. They can know regarding the value of respect for their elders. They can know the importance of relationships. They can know regarding their cultural values as well.","In a nutshell, I would like to say that children should be teach regarding the value of their customs, rituals and respect towards their elders for their future life, but most of the extra restriction should be being avoided. It would be better to make them good human beings in their coming future.","A good essay, set out well. Some sentences are too short and could be combined together to create more complex structure. There are also some repetitions of the same words, that should be avoided. Overall, nicely done."],"id":46,"t":"opinion","c":5},{"n":48,"topic":"CHILDREN","q":"Do you agree or disagree with the following statement? Parents are the best teachers. Use specific reasons and examples to support your answer.","p":["Parents shape their children from the beginning of their children's lives. They teach their children values. They share their interests with them. They develop close emotional ties with them. Parents can be very important teachers in their children's lives; however, they are not always the best teachers.","Parents may be too close to their children emotionally. For example, they may limit a child's freedom in the name of safety. A teacher may organize an educational trip to a big city, but a parent may think this trip is too dangerous. A school may want to take the children camping, but a parent may be afraid of the child getting hurt.","Another problem is that parents sometimes expect their children's interests to be similar to their own. If the parents love science, they may try to force their child to love science too. But what if the child prefers art? If the parents enjoy sports, they may expect their child to participate on different teams. But what if the child prefers to read?","Parents want to pass on their values to their children. However, things change. The children of today are growing up in a world different from their parents' world. Sometimes parents, especially older ones, can't keep up with rapid social or technological changes. A student who has friends of different races at school may find that his parents have narrower views. A student who loves computers may find that her parents don't understand or value the digital revolution.","Parents are important teachers in our lives, but they aren't always the best teachers. Fortunately, we have many teachers in our lives. Our parents teach us, our teachers teach us, and we learn from our peers. Books and newspapers also teach us. All of them are valuable. -------------------","Sample 2 :","Throughout my life, I have been lucky enough to have a very good relationship with my parents. They have supported me, given me necessary criticism, and taught me a great deal about how to live my life. Parents can be very important teachers in our lives; however, they are not always the best teachers.","Parents may be too close to their children emotionally. Sometimes they can only see their children though the eyes of a protector. For example, they may limit a child’s freedom in the name of safety. A teacher might see a trip to a big city as a valuable new experience. However, it might seem too dangerous to a parent.","Another problem is that parents may expect their children’s interests to be similar to their own. They can’t seem to separate from their children in their mind. If they love science, they may try to force their child to love science too. But what if their child’s true love is art, or writing, or car repair?","Parents are usually eager to pass on their value to their children. But should children always believe what their parents do? Maybe different generations need different ways of thinking. When children are young, they believe that their parents are always rights. But when they get older, they realize there are other views. Sometimes parents, especially older ones, can’t keep up with rapid social or technology changes. A student who has friends of all different races and backgrounds at school may find that her parents don’t really understand or value the digital revolution. Sometimes kids have to find their own ways to what they believe in.","The most important thing to realize is that we all have many teachers in our lives. Our parents teach us, our teachers teach us, and our peers teach us. Books and newspapers and television also teach us. All of them are valuable.","(316 words)"],"id":47,"t":"opinion","c":5},{"n":49,"topic":"CHILDREN","q":"The number of overweight children in developed countries is increasing. Some people think this is due to problems such as the growing number of fast food outlets. Others believe that parents are to blame for not looking after their children's health. To what extent do you agree with these views?","p":["There is plenty of evidence to suggest that children are overweight and the situation is getting worse, according to the medical experts. I feel there are a number of reasons for this.","Some people blame the fact that we are surrounded by shops selling unhealthy, fatty foods such as chips and fried chicken, at low prices. This has created a whole generation of adults who have never cooked a meal for themselves. If there were fewer of these restaurants, then children would not be tempted to buy take-away food.","There is another argument that blames the parents for allowing their children to become overweight. I tend to agree with this view, because good eating habits begin early in life, long before children start to visit fast food outlets. If children are given chips and chocolate rather than nourishing food, or are always allowed to choose what they eat, they will go for the sweet and salty foods every time, and this will carry on throughout their lives.","There is a third factor, however, which contributes to the situation. Children these days take very little exercise. They do not walk to school. When they get home, they sit in front of the television or their computers and play video games. Not only is this an unhealthy pastime, it also gives them time to eat more junk food. What they need is to go outside and play active games or sport.","The two views discussed play an equal role in contributing to the problem, but I think we have to encourage young people to be more active, as well as steering them away from fast food outlets and bad eating habits. We need to have a balanced approach.","Position: Writer refers to a number of reasons in the introduction, and to the need for a balanced view in the conclusion.","Main ideas: First sentence of the second paragraph; first and second sentences of the third paragraph; second sentence of the fourth paragraph.","Linkers: and, according to, some people, such as, if, then, there is another argument, because, or, there is a third factor, however, not only, also, the two views discussed, but, as well as Reference words: the, this, who, themselves, these, this view, they, their, them Topic vocabulary: medical experts, shops, unhealthy, fatty foods, chips, cooked, take- away food, chocolate, sweet and salty, exercise, walk, television, computers, video games, unhealthy pastime, junk food, active games, sport, fast food outlets Sentence types: A wide range of complex structures and sentences is used.","Length: 286 words"],"id":48,"t":"opinion","c":9},{"n":50,"topic":"CHILDREN","q":"In many countries today, the eating habits and lifestyle of children are different from those of previous generations. Some people say this has had a negative effect on their health. To what extent do you agree or disagree with this opinion?","p":["It has recently been suggested that the way children eat and live nowadays has led to a deterioration in their health. I entirely agree with this view, and believe that this alarming situation has come about for several reasons.","To begin with, there is the worrying increase in the amount of processed food that children are eating at home, with little or none of the fresh fruit and vegetables that earlier generations ate every day. Secondly, more and more young people are choosing to eat in fast-food restaurants, which may be harmless occasionally, but not every day. What they eat there is extremely high in fat, salt and sugar, all of which can be damaging to their health.","There is also a disturbing decline in the amount of exercise they get. Schools have become obsessed with exams, with the shocking result that some pupils now do no sports at all. To make matters worse, few even get any exercise on the way to and from school, as most of them go in their parents’ cars rather than walk or cycle. Finally, children are spending far more time at home, playing computer games, watching TV or surfing the Internet. They no longer play outside with friends or take part in challenging outdoor activities.","To sum up, although none of these changes could, on its own, have caused widespread harm to children’s health, there can be little doubt that all of them together have had a devastating effect. This, in my opinion, can only be reversed by encouraging children to return to move traditional ways of eating and living.","(267 words)"],"id":49,"t":"opinion","c":4},{"n":51,"topic":"CHILDREN","q":"In many countries children are engaged in some kind of paid work. Some people regard this as completely wrong, while others consider it as valuable work experience, important for learning and taking responsibility. What is your opinion on this?","p":["Nowadays, many children involved in different types of jobs to have some kind of financial assurance for themselves. However, whether this is good for their development and personality is a much debatable issue. I personally believe that paid works is harmful for children for several reasons.","It is said that children learn valuable experience in the work place. This may be true. However, I would argue that children are mainly employed for jobs that require manual work and are low paid. The recent statistic reveals the common tasks that children are assigned are washing dishes, cleaning floors or serving food in restaurants. Meanwhile, this kind of jobs actually do not provide children with necessary and useful skills so that they can apply in their future carrer.","This brings me to the second point. Defenders of child work argues that it is an effective method of learning. The point is children should be able to apply knowledge taught to them in a real life working environment. Although this is undoubtedly true, it also means that children may neglect the classroom study and even fail the class. The worst thing is yet to come. They may become so occupied with the benefits ahead of them like small salary and leave school.","Finally, supporters said that it helps them to build responsibility in the family. They will understand how it is difficult to earn money and therefore have a compassionate view with their parents. This is true to a certain extent, but may have a totally adverse effect on children. As children can make money at an early age, they would feel that it is appropriate to spend on luxury things by their own money, which could be recovered later.","In conclusion, I think that parents should take measures to restrict their child to work, otherwise it would have a negative consequences on their futures.","This is a great essay, Band 7+ candidate. My only suggestion is to divide your arguments so that you have 2 paragraphs covering arguments ?against? and one covering arguments ?for? or vise versa. Don?t mix ?for? and ?against? in one paragraph."],"id":50,"t":"opinion","c":6},{"n":52,"topic":"CHILDREN","q":"Children should never be educated at home by their parents. Do you agree or disagree? Discuss the advantages and disadvantages for young people who decide to do this.","p":["Nobody can say with confidence that children should be taught at home or at any children's institutions. There are many different children and every one demand of education suitable only for him.","But for most of children the best way of learning the life is being in the children's institutions. Nobody would argue that contacts between children of the same age are very important for bringing your child up. Such a contact is very important for playing, entertaining and learning living with other people. The harmonious living with other people, to my mind, is the first task for any man. Lack of this harmony sets problems and troubles.","The children need space to run and make noise, to jump and cry. Do you or your neighbours allow these actions for your child? If you live in town, it is difficult to find a safe place to play. Kindergartens give such a possibility. They give space, a lot of toys and constructions for physical exercises. So, if you have bad living conditions, the kindergarten is the best way for you. But if you have a large family with many children and enough space, you may keep your child at home. You should be sure that the child feels, dressed and comfortable. His brothers and sisters give him necessary contacts. It's noticed long ago that children in big families are much more easy-tempered and calm. They are located in more harmonic world than others.","Sometimes differences in age put troubles in contacts between children in large families. Then it is better for child to be sent to the kindergarten (school). But if quarrels don't last for a long time, everything is all right. In general, quarrels develop ability to cooperate with people. They develop a personal initiative and force setting the balance. In such a way the child gets lessons of life. Addly, the quarrels often take place in kindergartens and schools and we shouldn't fear it.","Side by side with quarrels parents often are afraid of colds which happen in kindergartens more frequently. Parents prefer keeping the child at home. But for a healthy child odd cold (if illness occurs, it goes its normal course) can't make big harm to the child. And if the child is adaptable to the conditions of public places earlier it would be better for him in future.","In general, I am a follower of the theory of keeping children in adapted places such as good kindergartens. But keeping children in such a place can't replace family and home. Only together they make harmonic and beautiful union.","(431 words)"],"id":51,"t":"advdis","c":6},{"n":53,"topic":"CHILDREN","q":"Some people think that a sense of competition in children should be encouraged. Others believe that children who are taugh to co-operate rather than compete become more useful adults. Discuss both these views and give your own opinion.","p":["Nowadays, purpose of education being changed in Korea. There are some People who think that competition in children should be made, also others believe that children who are taught to co-operate as well as become more usefwl adults. There are advantages and disadvantages for both of the arguments.","To begin with, what is good if a sense of competition m children is made? They could develope themselves more and more as they learn and study a lot to win from the competitbn. To prove this, in Korea, it is popular - even common now - to have a tutor who come to student's house to teach extra pieces of study with paying a lot of money. They learn faster than what they learn at school. Furthermore, during the vacations, students study abroad to learn English for a month instead of revise school work. If they have experiments such as study abroad, it is one of the greatest plus point to go to the famous well-known high-school. Moreover, there are four big school exam and two national examinations to test students' level of studies. Generally, only the highest 40% can go to the good quatrty highschools and colleges. Children learn as much as they can, to wim the competition to obtain good quality schools.","On the other hand, as they are busy to enter the schools and study individually with their own tutors, there are problems. They become selfish. They become careless and don't help others alot if it is about studies. There will be no co-operations for them. Then, why are there companies for many people to work in? Each of them are clever, however, there are weak parts and strong parts for each person. To co-operate is to improve this part. People talk and listen to what others thmking of and learn. That could also be a great opportunity to learn instead of learning alone with one teacher.","In conclusion, I strongly agree with that children should be taught to co-operate rather than compete. Nobody is perfect. People learn together, work together to develop each other. Therefore, I want parents and teachers to educate children concentrating on co- operation, not compete and ranking them.","(365 words)"],"id":52,"t":"discuss","c":4},{"n":54,"topic":"CHILDREN","q":"Do you agree or disagree with the following statement? Classmates are a more important influence than parents on a child’s success in school. Use specific reasons and examples to support your answer.","p":["I can not completely agree with the statement that classmates are a more important influence than parents on a child's success in school. In this essay I will first focus on the reasons why I agree with this statement and then list a few points why from my opinion in some cases is not true.","From the one side, classmates have a significant influence on child's behavior and his or her success in school. First of all, children spend much time at school. Classmates have many things in common such as age, interests, homework and classes after all. So, they discuss their impressions about a new teacher, solve problems together, learn their homework, gain new knowledge and experience and even make their own discoveries. Sharing all these makes them closer. Some of them become friends and they spend after- school time together. In addition friends tend to copy each other's habits and manners. For instance, my little sister became friends with the girl who did not have good grades at school at that time. It does not mean she could not have better grades; she just had many friends who did not care about their grades. So, when they started to spend their time together and share their interests, girl's grades improved. They did their homework together, shared their dreams and exciting moments. From this point I must agree that classmates can change child’s attitude towards school.","From the other side, parents have a great influence on children' success in school too. For example if parents show an interest in their child's progress and talk to him or her about the importance of learning I think their child will listen to them and do his or her best.","Personally, I believe that relationships between parents and a child play an essential role in child's success in school. If these relationships are close and wholehearted I am sure that parents should not be afraid of bad influence from the outside.","(328 words)"],"id":53,"t":"opinion","c":4},{"n":55,"topic":"CHILDREN","q":"It is better for children to grow up in the countryside than in a big city. Do you agree or disagree? Use specific reasons and examples to develop your essay.","p":["Some people believe that it is better for children to grow up in the countryside than in a big city. However, other people think that a big city gives more opportunities and it is good for the long run. Personally, for several reasons I think that it is better for children's health to grow up in the country.","First of all, it is very important for a child to grow up in a healthy environment. Children need fresh air, not polluted by the huge amount of cars and factories of the modern city. In the country they can spend more time exercising and walking with their friends. Scientists say that now children spend the same amount of time watching TV as they do at school. Probably, the possibility to join their friends for a play will change this proportion. Another important aspect of this is that parents will have more time to spend with their children as a result of eliminating traffic jams and decreasing driving time as a whole.","From the other side, children have some advantages living in a big city. For example, they have more opportunities to choose from what they want to do. They can choose to attend ballet school, school of art, gymnastics, etc. For the long run, it is good for them. They will be better prepared for a live in a \"real world\" and they will have more chances to make a good career and succeed. Moreover, a big city usually has many entertaining centers with movie theatres and play stations. When I was a child I liked to go to the movie theatre with my parents to watch a premiere.","One more reason to choose a big city for a child is that a city provides better live conditions and services such as medical, dental, etc. My friend lived in the country for a while and one time he and his family had to drive a couple of hours to the nearest medical center when his child got a heavy cough.","To summarize, I agree with those people who want to raise their children in a city. The plenty of opportunities offered by a city helps children to find what they really like and be the best at it. Moreover, despite the air pollution, children get a better medical service that is good for their health.","(394 words)"],"id":54,"t":"opinion","c":5},{"n":56,"topic":"CHILDREN","q":"Some people think that children should begin their formal education at a very early age and should spend most of their time on school studies. Others believe that young children should spend most of their time playing. Compare these two views. Which view do you agree with? Why?","p":["People learn through their entire lives. Curiosity was always the basic characteristic of a human being. We always want to break limits and learn more. At this point some people think that children should begin their formal education at a very early age and spend most of their time on school studies. This will help them to succeed in the future. However, for several reasons, which I will explain bellow, I think that children should not study at a very early age.","Of cause, children who begin to study at a very early age have more chances to succeed in the future. They gain more knowledge and experience which are priceless and valuable. In addition, studying more now they will give them the opportunity to perfect their knowledge in the future and become better professionals.","However, I think that every child must have his or her childhood. Children should learn through playing and communication with their friends and parents. I think that such basic qualities as kindness, self-confidence and just a good sense of humor can not be gained from studying. Children should more time spend with their family, playing and learning with their parents. Imagine that a child instead of playing with his friends does his homework and feel exhausted and tired. Another important aspect of this is that children at their early ages need more exercise because at this age the development of their body is a very essential aspect. Children first of all must be healthy.","To sum up, I think that children should have their careless childhood with no responsibilities. Moreover, I am sure that playing helps them develop not only their bones and muscles but their ability to make decisions, analyze things, make conclusions, which is very good for their future.","(296 words)"],"id":55,"t":"discuss","c":4},{"n":57,"topic":"CHILDREN","q":"Do you agree or disagree with the following statement? Children should begin learning a foreign language as soon as they start school. Use specific reasons and examples to support your opinion.","p":["Language is the best means of communication. In the modern globalization era it is not enough to be able to speak one language to communicate with the outside world. I strongly support the idea that children should begin learning a foreign language as soon as they start school. They faster become familiar with a strange language, improve their hearing ability to understand new words as time goes by and learn new words. In the following paragraphs I will list some reasons to support my position.","First of all, if one wants to see outcome soon, one must start sooner. So, the early children begin to learn new language the better will be the result. Scientists say that a child does not confuse two different languages but learns them more effectively.","Second of all, adults are often afraid to make mistakes when they are speaking in a new language. This fear is one of the biggest barriers for a person in his efforts to speak freely. Otherwise, children do not afraid of making grammatical mistakes because basically they just repeat words and sentences in the way they hear them. Also, children have a better chance to get rid of an accent. They faster get used to the right pronunciation and better feel the melody of a language.","To sum up, I think that it is very essential for children to begin learning a foreign language in their early ages. It is brings many benefits such as great pronunciation. Also, it helps a child develop and gain more knowledge which is good for a long run.","(264 words)"],"id":56,"t":"opinion","c":4},{"n":58,"topic":"CHILDREN","q":"Do you agree or disagree with the following statement? Watching television is bad for children. Use specific reasons and examples to support your opinion.","p":["Some parents believe that watching television is bad for their children. So, they try to restrict their children from watching TV. However, other parents think that there is nothing bad in watching TV. Personally, I think that watching TV brings children only benefits unless they spend in front of TV set less then a couple of hours daily. For the following reasons, which I will mention bellow, I believe that television plays an essential role in child's development.","First of all, television helps a child to extent his or her range of interests. Children can find out many new things and make many exiting discoveries for themselves. In addition to these practical benefits television improves children's vocabulary, their memory and gives them the opportunity to gain more knowledge. I think it is very essential for a child. Of cause, someone can say that there are plenty of different recourses of information such as books and teachers. But, I think, in our modern world children must learn faster and use all contemporary technology in order to succeed. Second of all, watching cognitive programs helps children to learn more about wild life, our environment and about the importance of preserving our forest and wild animals that live there.","Scientists say that a child should not watch TV more then 40 minutes successively. For example, my mother always made us have a break after watching TV more then half an hour and let our eyes rest for several minutes before turning on the TV again. I think it is the best solution.","To sum up, I believe that television gives children and all people the opportunity to learn what can not be learn from books. Television and movies in particular allow people to feel the reality and see what they will most likely not be able to see in their lives. Personally, when I was a child I liked to watch cognitive programs about wild animals. Unfortunately, my family had only one TV, but these programs were the only ones we all wanted to watch. So, we gathered in our living room and watched them in complete silence and I always remember those moments with a smile on my face.","(367 words)"],"id":57,"t":"opinion","c":4},{"n":59,"topic":"CHILDREN","q":"Do you agree or disagree with the following statement? Parents or other adult relatives should make important decisions for their (15 to 18 year-old) teenage children. Use specific reasons and examples to support your opinion.","p":["Parents are in most cases our first teachers and friends. From my everyday experience I have to agree with the statement that important decisions should be made by our parents or adult relatives. In the following paragraphs I will give my reasons to support this statement.","First of all, teenage children have the tendency to live in their own fantasies. They do not clearly understand the rules of a real life. When I was 18 years old I thought that the world was perfect and everything seemed to be simple. Teenagers are basically inexperienced; they aspire for independence and try to make their first steps towards freedom. I think that it is like starting to walk when a baby needs its parents for support. An independent life is a big and significant part in a person's life. So, my point is that it is very important to make this step right.","Second of all, I think that parents have right to interfere in their children's lives. They need to know what kind of friends their children have and how children spend their spare time. For example I had an eighteen years old friend who got really angry with his parents when they prohibited him to be friends with a young man. Somehow his parents found out that that young man was occasionally taking drugs. That man was dead in a year because of drug abuse. After that accident my friend thanked his parents for that interference.","Finally, I think teenage children should be more open-minded with their parents. It will help them to make the right choice and avoid many mistakes.","To sum up, I believe that young people should trust their parents because they wish their children only the best."],"id":58,"t":"opinion","c":5},{"n":60,"topic":"CHILDREN","q":"It is better for children to grow up in the countryside than in a big city. Do you agree or disagree? Use specific reasons and examples to develop your essay.","p":["Some people believe that it is better for children to grow up in the countryside than in a big city. However, other people think that a big city gives more opportunities and it is good for the long run. Personally, for several reasons I think that it is better for children's health to grow up in the country.","First of all, it is very important for a child to grow up in a healthy environment. Children need fresh air, not polluted by the huge amount of cars and factories of the modern city. In the country they can spend more time exercising and walking with their friends. Scientists say that now children spend the same amount of time watching TV as they do at school. Probably, the possibility to join their friends for a play will change this proportion. Another import
