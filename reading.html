<!doctype html><html lang="ar" dir="rtl"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>بارت القراءة — كلماتي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* Layout: an exam-prep workbench — top nav of five rooms (plan, basics, library, practice, notebook); essays read like marked-up exam scripts with colour-coded linkers */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EAEEF4; --ink:#1B2433; --ink-2:#4D586B; --line:#D6DCE6;
  --accent:#2F3E9E; --accent-ink:#FFFFFF; --accent-soft:#E2E6FA;
  --ok:#21804F; --ok-soft:#DDF2E5; --warn:#B4432C; --warn-soft:#FBE3DC;
  --l-add:#DCEBFF; --l-con:#FFE1D6; --l-cau:#E3F4DC; --l-exa:#FFF1C2; --l-opi:#EEE0FF; --l-end:#D9F1F2;
  --ar:'Readex Pro',Tahoma,system-ui,sans-serif; --essay:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151F; --surface:#18202D; --surface-2:#222C3D; --ink:#E8EDF5; --ink-2:#A9B4C7; --line:#2F3A4E;
  --accent:#8F9DF5; --accent-ink:#10153A; --accent-soft:#262E5C; --ok:#6CCF96; --ok-soft:#173A28; --warn:#F2957C; --warn-soft:#45251E;
  --l-add:#1E3554; --l-con:#4A2A22; --l-cau:#24402A; --l-exa:#4A3E14; --l-opi:#38295A; --l-end:#1A4245; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151F; --surface:#18202D; --surface-2:#222C3D; --ink:#E8EDF5; --ink-2:#A9B4C7; --line:#2F3A4E;
  --accent:#8F9DF5; --accent-ink:#10153A; --accent-soft:#262E5C; --ok:#6CCF96; --ok-soft:#173A28; --warn:#F2957C; --warn-soft:#45251E;
  --l-add:#1E3554; --l-con:#4A2A22; --l-cau:#24402A; --l-exa:#4A3E14; --l-opi:#38295A; --l-end:#1A4245; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ar);font-size:16.5px;line-height:1.75;margin:0}
.wrap{max-width:1160px;margin:0 auto;padding-block:18px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.35;text-wrap:balance}
.en{direction:ltr;unicode-bidi:isolate}
header.top{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.5px}
.brand h1{font-size:23px}.brand p{margin:0;font-size:13.5px;color:var(--ink-2)}
nav.rooms{display:flex;flex-wrap:wrap;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;margin-bottom:18px}
.room{border:0;background:none;border-radius:11px;padding:8px 16px;min-height:44px;font-weight:600;color:var(--ink-2)}
.room[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.2px}
.lead{margin:0;color:var(--ink-2);max-width:72ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:11px;padding:8px 18px;min-height:44px;font-weight:600;background:var(--ink);color:var(--bg)}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:99px;padding:2px 12px;font-size:13.5px;font-weight:600;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:28px;font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;color:var(--ink-2)}
.bar{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
/* plan */
.week{display:flex;flex-direction:column;gap:8px}
.week h3{font-size:17px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.day{text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-height:104px}
.day:hover{border-color:var(--accent)}
.day.done{background:var(--ok-soft);border-color:var(--ok)}
.day.today{box-shadow:0 0 0 2px var(--accent)}
.day small{color:var(--ink-2);font-size:13px}
.day b{font-size:15.5px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.task input{width:22px;height:22px;accent-color:var(--accent);flex:0 0 auto;margin-top:4px}
.task label{flex:1;min-width:0}
/* basics */
.type{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.type h3{font-size:18px}
.sig{font-size:14px;background:var(--surface-2);border-radius:10px;padding:6px 10px;direction:ltr;text-align:left}
.tmpl{margin:0;padding-inline-start:20px;font-size:15px}
.tmpl li{margin-bottom:4px}
.phr{font-family:var(--essay);direction:ltr;text-align:left;font-size:15.5px;color:var(--ink);background:var(--accent-soft);border-radius:10px;padding:6px 10px}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lgroup{border-radius:14px;padding:12px 14px}
.lgroup h4{font-size:15.5px;margin-bottom:6px}
.lgroup .chips{display:flex;flex-wrap:wrap;gap:6px;direction:ltr;justify-content:flex-end}
.lgroup .chips span{background:var(--surface);border-radius:8px;padding:1px 8px;font-family:var(--essay);font-size:15px}
.c-add{background:var(--l-add)}.c-con{background:var(--l-con)}.c-cau{background:var(--l-cau)}.c-exa{background:var(--l-exa)}.c-opi{background:var(--l-opi)}.c-end{background:var(--l-end)}
table{border-collapse:collapse;width:100%;min-width:560px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top;font-size:15px}
th{background:var(--surface-2)}tr:last-child td{border-bottom:0}
/* library */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:600;color:var(--ink-2);flex:1 1 180px;min-width:0}
.field select,.field input{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:44px;font-size:15px;color:var(--ink);width:100%}
.elist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.eitem{text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.eitem:hover{border-color:var(--accent)}
.eitem.read{border-inline-start:0;background:linear-gradient(var(--surface),var(--surface))}
.eq{font-family:var(--essay);direction:ltr;text-align:left;font-size:15.5px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.t-opinion{background:#E2E6FA;color:#26307E}.t-discuss{background:#FFE6D6;color:#7A3412}.t-advdis{background:#DDF2E5;color:#1D5E3A}.t-problem{background:#FFF0C2;color:#6A4A00}.t-two{background:#EEE0FF;color:#4E2A86}.t-other{background:#E6EAF0;color:#3A4558}
/* reader */
.prompt{font-family:var(--essay);direction:ltr;text-align:left;font-size:19px;line-height:1.55;font-weight:600;background:var(--surface-2);border-radius:14px;padding:14px 18px}
.essay{display:flex;flex-direction:column;gap:12px}
.para{position:relative;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface)}
.para .role{font-size:12.5px;font-weight:700;color:var(--accent);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.ptext{font-family:var(--essay);direction:ltr;text-align:left;font-size:17.5px;line-height:1.75;margin:0}
.sent{cursor:pointer;border-radius:4px}
.sent:hover{background:var(--surface-2)}
.sent.saved{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
.lk{border-radius:4px;padding:0 2px;font-weight:600}
.lk.add{background:var(--l-add)}.lk.con{background:var(--l-con)}.lk.cau{background:var(--l-cau)}.lk.exa{background:var(--l-exa)}.lk.opi{background:var(--l-opi)}.lk.end{background:var(--l-end)}
.nolk .lk{background:none;font-weight:inherit}
.note{font-size:14px;color:var(--ink-2);margin:0}
.lkchip{background:var(--surface);border:0;border-radius:10px;padding:4px 10px;font-family:var(--essay);font-size:15.5px;color:var(--ink);cursor:pointer;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.06);transition:transform .12s}
.lkchip:hover{transform:translateY(-2px)}.lkchip:focus-visible{outline:3px solid #6A4CFF;outline-offset:2px}
.lkchip.seen::after,.lkchip.known::after{content:'';position:absolute;top:-3px;left:-3px;width:10px;height:10px;border-radius:50%;background:#FFC23C;border:2px solid #fff}
.lkchip.known::after{background:#19C39B}
.lksheet{max-height:78vh;overflow:auto;display:flex;flex-direction:column;gap:9px}
.lvdots{display:inline-flex;gap:3px;margin-inline-start:auto}.lvdots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.lvdots i.on{background:#19C39B}
.lkrule{background:#F4F0FF;border-radius:12px;padding:8px 12px;font-size:15px}
.lkex{background:#EEF6FF;border-radius:12px;padding:10px 12px;font-family:var(--essay);font-size:16.5px}.lkex.book{background:#ECFAF4}
.lkex mark,.lksheet mark{background:#FFE48A;border-radius:4px;padding:0 2px}
.lkhow{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:0 6px 18px var(--shadow)}
.lkhow h4{font-size:17px;margin:0 0 8px}
.lkpats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.lkpat{display:flex;flex-direction:column;gap:4px;background:#F7F5FF;border-radius:14px;padding:10px 12px;align-items:flex-start}
.lkpat .en{font-family:var(--essay);font-size:16px}
.lksteps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:5px;font-size:15px}
.lkprog{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.lkprog .bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}.lkprog .bar i{display:block;height:100%;background:linear-gradient(90deg,#19C39B,#3BA8FF)}
.scope{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#EEF6FF;border:1.5px dashed #3BA8FF;border-radius:14px;padding:8px 12px;font-size:14px;color:var(--ink)}.scope .pill{background:#fff}.sc-src{margin-inline-start:auto;font-size:13px;color:#12A57F;font-weight:700}
.side{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.side>.main{flex:999 1 560px;min-width:0}
.side>aside{flex:1 1 260px;display:flex;flex-direction:column;gap:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend span{font-size:13px;border-radius:8px;padding:2px 8px}
/* practice */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.game{text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:150px}
.game:hover{border-color:var(--accent)}
.game h3{font-size:18px}
.game p{margin:0;font-size:14.5px;color:var(--ink-2)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:52px;font-weight:600}
.opt.enf{font-family:var(--essay);direction:ltr}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}.opt.wrong{background:var(--warn-soft);border-color:var(--warn)}
.why{border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.why.ok{background:var(--ok-soft)}.why.no{background:var(--warn-soft)}
.why p{margin:0;flex:1 1 260px}
.cloze{font-family:var(--essay);direction:ltr;text-align:left;font-size:18px;line-height:1.7;background:var(--surface-2);border-radius:14px;padding:14px 16px}
.blank{display:inline-block;min-width:90px;border-bottom:2px solid var(--accent);text-align:center;color:var(--accent);font-weight:600}
.order{display:flex;flex-direction:column;gap:8px}
.opara{text-align:left;direction:ltr;font-family:var(--essay);font-size:15.5px;line-height:1.6;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.opara .num{font-family:var(--ar);flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:14px}
.opara.picked{border-color:var(--accent)}.opara.picked .num{background:var(--accent);color:var(--accent-ink)}
.opara.right{border-color:var(--ok);background:var(--ok-soft)}.opara.wrong{border-color:var(--warn);background:var(--warn-soft)}
.writer{display:flex;flex-direction:column;gap:10px}
.writer textarea{width:100%;min-height:340px;border:1.5px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);font-family:var(--essay);font-size:17px;line-height:1.7;direction:ltr;text-align:left;resize:vertical}
.wbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.check li{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:8px 12px}
.check li.ok{background:var(--ok-soft)}.check li.no{background:var(--warn-soft)}
.check b{flex:0 0 auto}
.empty{text-align:center;border:1.5px dashed var(--line);border-radius:14px;padding:22px;color:var(--ink-2)}
.saved-item{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.saved-item p{margin:0;font-family:var(--essay);direction:ltr;text-align:left;font-size:16px;flex:1;min-width:0}
/* v2: words, explanations, AI tutor, chat */
.tok{cursor:pointer;border-radius:3px}
.tok:hover{background:var(--surface-2);box-shadow:inset 0 -2px 0 var(--accent)}
.tok.known{box-shadow:inset 0 -2px 0 var(--ok)}
.explain{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.explain b{color:var(--ink)}
.explain .phr{font-size:14.5px}
.sheet{position:fixed;inset:auto 0 0;z-index:30;display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-left,0px)) 0 max(12px,env(safe-area-inset-right,0px))}
.sheet>div{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.sheet .wd{font-family:var(--essay);font-size:26px;font-weight:600;direction:ltr;text-align:left}
.sheet .tr{font-size:19px;font-weight:600}
.ai-note{background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:14.5px;margin:0}
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.band{background:var(--surface-2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.band b{font-size:26px;font-variant-numeric:tabular-nums}
.band span{font-size:13px;color:var(--ink-2)}
.band.main{background:var(--accent);color:var(--accent-ink)}
.band.main span{color:var(--accent-ink);opacity:.85}
.errs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.errs li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.errs .pair{font-family:var(--essay);direction:ltr;text-align:left;font-size:16px}
.errs del{color:var(--warn);text-decoration-thickness:2px}
.errs ins{color:var(--ok);text-decoration:none;font-weight:600}
.mytext{font-family:var(--essay);direction:ltr;text-align:left;font-size:16.5px;line-height:1.8;white-space:pre-wrap;background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:0}
.mytext mark{background:var(--warn-soft);color:var(--ink);border-bottom:2px solid var(--warn);border-radius:3px}
.diff{font-family:var(--essay);direction:ltr;text-align:left;font-size:18px;line-height:1.8}
.diff .ok{color:var(--ok);font-weight:600}.diff .miss{color:var(--warn);text-decoration:underline wavy}
.chatbox{display:flex;flex-direction:column;gap:10px;max-height:62vh;overflow-y:auto;padding:4px}
.msg{max-width:88%;border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.msg.ai{align-self:flex-end;background:var(--surface-2);border-end-end-radius:4px}
.msg.me{align-self:flex-start;background:var(--accent);color:var(--accent-ink);border-end-start-radius:4px}
.msg .en-t{font-family:var(--essay);direction:ltr;text-align:left;font-size:17px}
.msg .fix{background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:14.5px}
.msg .fix .en-t{font-size:15.5px;color:var(--ok)}
.composer{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.composer textarea{flex:1 1 260px;min-height:56px;max-height:160px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);color:var(--ink);font-family:var(--essay);font-size:16.5px;direction:ltr;text-align:left;resize:vertical}
.chips2{display:flex;flex-wrap:wrap;gap:8px}
.chip2{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;min-height:44px;font-weight:600}
.chip2[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.skill{display:grid;grid-template-columns:minmax(110px,160px) 1fr auto;gap:10px;align-items:center}
.wtile{font-family:var(--essay);font-size:17px;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 10px;min-height:44px}
.wtile:disabled{opacity:.35}
.tiles{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.slot2{min-height:60px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.slot2.right{border-color:var(--ok);background:var(--ok-soft)}.slot2.wrong{border-color:var(--warn);background:var(--warn-soft)}

<script id="essaysData" type="application/json">[{"n":1,"topic":"EDUCATION","q":"As computers are being used more and more in education, there will be soon no role for teachers in the classroom.","p":["There have been immense advances in technology in most aspects of people's lives, especially in the field of education. Nowadays, an increasing number of students rely on computers to research for information and to produce a perfect paper for school purposes. Others have decided to leave the original way of learning to get knowledge through online schools. These changes in the learning process have brought a special concern regarding the possible decrease of importance of teachers in the classroom.","Some people believe the role of teachers started to fade because computers have been helping some students to progress in their studies quicker than when compared with an original classroom. For example, in the same classroom, students have different intellectual capacities, thus some would be tied to a slow advance in their studies because of others’ incapacity of understanding. In this way, pupils could progress in their acquisition of knowledge at their own pace using computers instead of learning from teachers.","However, the presence of a teacher is essential for students because the human contact influences them in positive ways. Firstly, students realize that they are not dealing with a machine but with a human being who deserves attention and respect. They also learn the importance of studying in group and respect other students, which helps them to improve their social skills.","Moreover, teachers are required in the learning process because they acknowledge some student's deficiencies and help them to solve their problems by repeating the same explanation, giving extra exercises or even suggesting a private tutor. Hence, students can have a bigger chance not to fail in a subject.","In conclusion, the role for teachers in the learning process is still very important and it will continue to be in the future because no machine can replace the human interaction and its consequences.","Sample 2 :","Nobody can argue that the acquisition of knowledge is more fun and easier with computers. The mere activity of touching and exploring this device constitutes an enjoyable task for a kid. This, accompanied with the relaxing attitude and software interactivity, usually conduce to a better grasping of new knowledge. At a higher educational level; the availability of digital books, simulator and other academic materials, provide the student with an ever accessible source of information, that otherwise would not be at hand.","But, besides the increasing complexity and behavior of intelligent software, which is usually embedded in the academic digital material, the need of human interaction in the learning process will always be present, at least in the foreseeable future. There is the necessity for a human being to be able to determine what the specifics needs of each individual are. The expertise of a teacher in how to explain and adapt complex concepts to different individuals can hardly be mimicked by a computer, no matter how sophisticated its software is.","As computers are becoming a common tool for teaching, teachers should be more aware of their role as guides in the acquisition of knowledge rather than transmitters of facts. They have to be open minded to the changes that are taking places, keep updated and serve as a problem solvers in the learning process, thus allowing students to discover the fact for themselves.","To summarize, in my personal view, teachers play and will() play an important role in the classroom, especially at the primary level. No matter how complex computers become, there will be no replacement for the human interaction, but in the way haw this interaction takes place.","Excellent essay! Are you a native English speaker? Well done. The only problem: too long, 365 words instead of 250-265 maximum."],"id":0,"t":"other","c":5},{"n":2,"topic":"EDUCATION","q":"In some countries young people are encouraged to work or travel for a year between finishing high school and starting university studies. Discuss the advantages and disadvantages for young people who decide to do this.","p":["It is quite common these days for young people in many countries to have a break from studying after graduating from high school. This trend is not restricted to rich students who have the money to travel, but is also evident among poorer students who choose to work and become economically independent for a period of time.","The reasons for this trend may involve the recognition that a young adult who passes directly from school to university is rather restricted in terms of general knowledge and experience of the world. By contrast, those who have spent some time earning a living or traveling to other places have a broader view of life and better personal resources to draw on. They tend to be more independent, which is a very important factor in academic study and research, as well as giving them an advantage in terms of coping with the challenges of student life.","However, there are certainly dangers in taking time off at that important age. Young adults may end up never returning to their studies or finding it difficult to readapt to an academic environment. They may think that it is better to continue in a particular job, or to do something completely different from a university course. But overall, I think this is less likely today, when academic qualifications are essential for getting a reasonable career.","My view is that young people should be encouraged to broaden their horizons. That is the best way for them to get a clear perspective of what they are hoping to do with their lives and why. Students with such a perspective are usually the most effective and motivated ones and taking a year off may be the best way to gain this.","(291 words)"],"id":1,"t":"advdis","c":4},{"n":3,"topic":"EDUCATION","q":"Some people believe that a college or university education should be available to all students. Others believe that higher education should be available only to good students. Discuss these views. Which view do you agree with? Explain why.","p":["People learn through their entire lives. They constantly improve their knowledge and develop. I think that a college or university education should be available to all students because every person has the right to choose the way to self-perfection. Bellow I will give some of my reasons to support my position.","First of all, every person should have the chance to get a higher degree, gain new knowledge and experience. However, some people believe that higher education should be available only to good students. I think it is silly. It is like to make unavailable traveling for one who does not have IQ high enough.","Second of all, some young people do not do well at school but they have great personality and ability to learn. They are self-confident, persistent and patient. With these qualities they can get higher grades then their classmates who are talented but lazy. Imagine for example situation when a teenager gets high grades because his or her parents constantly make him or her study and help to do most of the homework. In this case a child does very well at school but I think a college can show the opposite results.","Finally, it is a discrimination against students to make available higher education only for good ones. So, if a student does poor and gets low grades he/she should be sent down. But if a person was never given a chance to try himself/herself at college, what to do in this case?","To sum up, I think that all young people should have the chance to get a higher education. To take or not this chance must be up to them.","(277 words)"],"id":2,"t":"discuss","c":5},{"n":4,"topic":"EDUCATION","q":"Some people believe that the best way of learning about life is by listening to the advice of family and friends. Other people believe that the best way of learning about life is through personal experience. Compare the advantages of these two different ways of learning about life. Which do you think is preferable? Use specific examples to support your preference.","p":["From my everyday experience and observation I can stand that the best way of learning about life is through personal experience. However, some people think that it is wiser to learn about life through listening to the advice of family and friends. It does not mean I totally disagree with this way of learning. Moreover, I think that it is wise for a person to take an intermediate position because each of these ways has its own advantages. Bellow I will give my reasons to support my point of view.","From the one side, learning through one's personal experience brings many benefits. First of all, scientists say that personal experience has greater impact on a person. I have to agree with this. Take for example children. They will not believe their parents that something can hurt them until they try it and make sure in it. Furthermore, most likely they will remember this experience longer. Second of all, people learn how to analyze their mistakes, make conclusions and next time try to avoid them. So, I think it is a great experience that makes people stronger, more self-confident and persistent. They gain more knowledge and experience that will be very helpful and valuable in the future.","From the other side, listening to the advice of family and friends brings many benefits too. Parents with great patience pass down their knowledge and experience to their children. They teach them all they know and they want their children do not make the same mistakes. In addition to those practical benefits, learning from someone's advice is painless. For example, parents nowadays very often talk to their children about drugs. I think it is a great example when one should not try drugs in order to gain new experience. I think it is a case when children must trust their parents.","To sum up, I think it is wise to combine both of these ways to learn and try to analyze personal mistakes as well as not personal. I think together they can greatly simplify one's life and make the way to success shorter.","(350 words)"],"id":3,"t":"advdis","c":4},{"n":5,"topic":"EDUCATION","q":"With the pressures on today’s young people to succeed academically, some people believe that non-academic subjects at school (eg: physical education and cookery) should be removed from the syllabus so that children can concentrate wholly on academic subjects.","p":["To what extent do you agree or disagree?","What young people should study at school has long been the subject of intense debate and this is a question that certainly does not have one correct answer.","We need to provide young people the best possible chance of doing well at school. In traditional curriculum there is a wide variety of subjects with a mix of academic and non- academic subjects. In this way a young person is formed with a rounded education. Non- academic subjects would include sports, cooking, woodwork and metalwork. I believe this is the best form of education. A young person should learn things other than academic subjects. Sport is particularly important. Young people have to learn to love sport so that they can be fit and healthy later in life. If not we will be raising an obese and unfit generation.","I totally understand the point of view that education is so important that students must be pushed as hard as possible to achieve their best. It sounds a good idea to only expose the students to academic subjects as then they can spend all of their school hours on studying areas that will get them into university and good jobs later in life. I just feel a more rounded education would produce a better individual. We must remember too that a lot of people, maybe even most people, aren‛t academically minded and would benefit more from a more vocationally based education. Forcing academic studies onto them would lead to failure and the student leaving school too early.","Therefore I agree that although a wholly academic curriculum would suit and benefit some young people, I believe that for most students non-academic subjects are important inclusions still in today‛s syllabuses."],"id":4,"t":"opinion","c":5},{"n":6,"topic":"EDUCATION","q":"In many countries, sports and exercise classes are replaced with the academic subjects. Discuss the effects of this trend.","p":["Over the past few decades, academic subjects have become increasingly important in this fast-changing information-based society. Nowadays, there has been a growing debate as to whether it would be more effective to replace physical education classes with academic subjects. Despite the importance of sports, I highly believe that it is inevitable and more efficient to focus more on academic subjects for several reasons.","Those who argue that sports and exercise classes are needed in school base their case on the following arguments. First of all, sports are a good way to build character and develop personality. That is, there are necessary for learning about competition, cooperation, and good sportsmanship. In addition, as a majority of children these days are addicted to the Internet, they find it hard to leave their computer. Consequently, a growing number of children are becoming overweight or obese due to a lack of exercise. So, if schools foster an environment that deprives students of getting a proper physical education, it will have a long-term negative effect on children both mentally and physically.","Nevertheless, people should not ignore the fact that devoting more time and energy to academic subjects will benefit students more in the long run. The time devoted to physical education now would be better spent teaching students English. This is because speaking fluent English will give young people an advantage over other college applicants and job seekers in the near future. Besides, science will undoubtedly benefit youth more than physical education as well. The principles learned in science will provide the necessary foundation for solving and difficult problems that are sure to arise in students' futures.","In summary, there are high hopes that educators and parents exercise wisdom in teaching young generations.","(300 words)","Some people say that physical exercise should be a required part of every school day. Other people believe that students should spend the whole school day on academic studies. Which opinion do you agree with? Use specific reasons and details to support your answer.","Although honesty, intelligence, and a sense of humor are all worthwhile characteristics, I feel the most important one in life to have is sensitivity. A sensitive person is aware of him/herself and the way their actions affect others. A sensitive person knows the place of honesty, intelligence, and a sense of humor. Honesty is not always the best policy. There is such a thing as a white lie. You don't want to insult someone by saying that their new dress doesn't fit properly or that you wouldn't live in their new house if they paid you. You must be sensitive to when it is necessary to tell the truth and when it is better to tell a white lie. Intelligence is a wonderful thing to have, but not all intelligent people use their intelligence sensitively. You don't want to show off and make others feel stupid. You must be sensitive to the reactions of the people around you. It might be appropriate for you to admit that you have the right answer, but in some cases, you might have to say, \"I think this is the answer, but we might want to check it.\" A sensitive person would not make someone else look dumb. A sense of humor is always valued. Different people, however, laugh at different things. You don't want to make someone feel uncomfortable by laughing at his/her mistakes. A sensitive person would understand whether a person could be teased or whether a person would appreciate a certain joke. A sensitive person would make everyone feel comfortable. A sensitive person understands that people are different and that the values of honesty, intelligence and humor can be applied differently.","## While physical exercise is important, I do not believe that it is the school's responsibility to provide physical training for its students. That is something that everyone can take care of on his or her own.","Many students get plenty of physical exercise as part of their daily life or recreation. A student who bicycles ten miles to and from school does not need more exercise. A good physical education program must take a student's outside activity into consideration. Otherwise, some students will spend valuable class hours repeating physical exercise.","If a school offers such activities, it also suggests that students will be graded on them. The range of possible physical activities is great: football, swimming, weight lifting, ballet, ballroom dance, yoga, skiing, horseback riding, and golf are just a few. However, the number that a school could offer is small. Some students could get bad grades in physical education simply because the school could not provide an activity they enjoy or do well. This seems unfair. Research suggests that participation, not excellence, in these activities determines the physical benefits the body will get.","Another issue is economic. Many schools do not have the money to provide gym facilities, playing fields, and athletic equipment for their students. Other schools are located in cities where that kind of space just isn't available. A few schools would rather keep money for academic purposes.","Schools can certainly encourage physical activity. They can provide space for notices about activities, events, and classes for physical activities. They can encourage students to plan time away from academic studies to get some exercise. However, I think that providing exercise should not be the school's responsibility."],"id":5,"t":"problem","c":4},{"n":7,"topic":"EDUCATION","q":"Some people think high school graduates should travel or work for a period of time instead of going directly to study at university. Discuss the advantages and disadvantages of both approaches. Give reasons for your answer and include any relevant examples from your own knowledge or experience.","p":["High school students face many decisions as they prepare to graduate, including what they are going to do after graduation. Some high school students go directly to college or university after graduation. Others prefer to travel or work for some time before going to university.","For those who choose to go college or university after graduation, there are advantages and disadvantages. One of the big advantages of going directly from high school to college is that you are still in the habit of studying. By going to college after graduation, you do not lose the study skills that you developed during high school. The big disadvantages, however, is that you may not be ready for college. You may not know exactly what you want to study, or you may be more interested in freedom and parties than in your courses. At that age, it is often difficult for students to take on the responsibilities of college.","There are also advantages and disadvantages to working or traveling befor starting college. Working or traveling allows you a better idea of what you want to do with your life. You gain practical experience that helps you define what you want to study. You also are well prepared for the responsibilities of college or university studies. On the other hand, by the time you start college, you will probably have obligations, like a job or spouse, which keep you from focusing on studies. In addition, travelling or working before college may cause you to spend enough time out of school that you forget how to study.","The desicion of what to do after hich school graduation can be a difficult one. Deciding whether to go straight into college or university or take time to work or travel is something that faces every high school student. After thinking about the advantages and disadvantages of both options, the decision should be based on what is best for you."],"id":6,"t":"advdis","c":4},{"n":8,"topic":"EDUCATION","q":"The student who study from the school to university get benefit less and contribute less too, than those of student who go to travel or job and get skills and experience before going high. Do you agree or disagree?","p":["Nowadays, in our competitive world, to succeed, knowledge from school and university is not enough. Therefore, the student who study from the school to university get benefit less and contribute less too, than those of student who go to travel or job and get experience and skills before going high. There are two following reasons to prove for my opinion. I call the group of people who study from school to university is group A and the other group is group B.","Firstly, at school and university, what group A gain is almost theory, theory and theory. Of course, theory is very neccessary, however, you can’t do everything with theory. You must have praticeable experience. This is what group A lack very much. Although in the third of forth year at university, group A can be apprentices in some companies, to help them approach their future jobs, they aren’t trained well because of short time. And the real job is still very strange with them. After graduating, without experience, group A can’t accomplish their work perfectly. On the other hand, it take them time and money to keep up with other experienced ones and may be scorned. Therefore, group A can contribute less than group B who have the most two important things: skills and experience.","Secondly, as group A is contribute less, they surely get less benefit. Moreover, many companies which employ people in group A have to train them from the back-ground.","These companies take this cost from group A’s salary to get rid of the fact that their employees may leave after being trained to other companies. So, less benefit is unavoidable and certain, Whereas group B are more loyal and effective workers. They also have useful experience and skills. Besides, their education is the same as or even higher than group A. As the result, group B get more benefit absolutely.","In conclusion, I think student should go to travel or job before going high. Therefore, they can’t only have basic knowledge but also skills and experience which are useful for them to get a good job and a brilliant future.","This essay is too long (350 words instead of 250). To fight this problem, try to write more in general and provide fewer details. The language and ideas are good and so is the essay?s structure. Looks like Band 7 to me."],"id":7,"t":"opinion","c":6},{"n":9,"topic":"EDUCATION","q":"Disruptive school students have a negative influence on others. Students who are noisy and disobedient should be grouped together and taught separately. Do you agree or disagree?","p":["There is no doubt that some students in schools behave badly and their behaviour causes difficulty for others either because it has a negative effect on the group or because ordinary students find it difficult to study with them.","One solution is to take these students away and teach them on their own. However, if we simply have them removed after one or two warnings, we are limiting their educational opportunities because it seems to me that a school which caters for difficult students is a sort of \"prison\" whatever name you give it and the people who go there may never recover from the experience. This can then cause problems for the wider society.","Perhaps we need to look at why the disruptive students behave badly before we separate them. Disruptive students may be very intelligent and find the classes boring because the work is too easy. Perhaps these students need extra lessons rather than separate lessons. Or perhaps the teachers are uninspiring and this results in behavioural problems so we need better teachers. On the other hand, most students put up with this situation rather than cause trouble, and some people argue that we have to learn to suffer bad teachers and boring situations and that students who can't learn this lesson need to be taught separately.","So before we condemn the students to a special school, we should look at factors such as the teaching, because once the children have been separated, it is very unlikely that they will be brought back."],"id":8,"t":"opinion","c":4},{"n":10,"topic":"EDUCATION","q":"Some people think that universities should not provide so much theoretical knowledge but give more practical training throughout their courses. To what extent do you agree or disagree with this opinion?","p":["In the past, a majority of academics have held the opinion that universities should only offer a theoretically-based approach to teaching throughout their courses, as opposed to the more recent trend towards empirical acquisition of knowledge involving more “hands on” experience. Is this the most effective way for students to learn vital academic information while undertaking their degrees? Undoubtedly, advantages and disadvantages of both academic learning styles have to be evaluated.","Firstly, on the one hand, despite being the more traditional educational approach, learning from theory in relevant academic discourses to identify established knowledge allows us to gain a professional insight. For example, students can easily identify facts and opinions from past discourses. In addition, students acquire knowledge more easily when given relative theoretical examples to build upon. For instance, in subjects such as history or sociology, studying textbook examples allows students to unravel complex academic theories which they could expand on. Alternatively, there are some disadvantages for students.","On the other hand, there is no doubt that students could find themselves reading tedious and monotonous academic papers. For instance, university degrees involving the evaluation of numerous ‘long-winded’ academic discourses provide little inspiration for students, discouraging enthusiasm. Obviously, interest can be stimulated through empirical research in class. By this I mean that ‘the human brain learns best by doing’. Although time-consuming, there is no substitute for learning from making mistakes.","In conclusion, while both approaches have benefits and drawbacks in our ever-changing academic world, I honestly believe that a more practical approach promotes a stronger acquisition of academic knowledge. In spite of the comprehensive nature which theoretical teaching can possibly provide, practical learning equals more positive learning for future generations.","(280 words)"],"id":9,"t":"opinion","c":4},{"n":11,"topic":"EDUCATION","q":"People attend college or university for many defferent reasons (for example, new experiences, career preparation, increased knowledge). Why do you think people attend college or university?","p":["People attend college for a lot of different reasons. I believe that the three most common reasons are to prepare for a career, to have new experiences, and to increase their knowledge of themselves and of the world around them.","Career preparation is probably the primary reason that people attend college. These days, the job market is very competitive. Careers such as information technology will need many new workers in the near future. At college, students can learn new skills for these careers and increase their opportunities for the future.","Students also go to college to have new experiences. For many, it is their first time away from home. At college, they can meet new people from many different places. They can see what life is like in a different city. They can learn to live on their own and take care of themselves without having their family always nearby.","At college, students have the opportunity to increase their knowledge. As they decide what they want to study, pursue their studies, and interact with their classmates, they learn a lot about themselves. They also, of course, have the opportunity to learn about many subjects in their classes. In addition to the skills and knowledge related to their career, college students also have the chance to take classes in other areas. For many, this will be their last chance to study different subjects.","Colleges offer much more than career preparation. They offer the opportunity to have new experiences and to learn many kinds of things. I think all of these are reasons why people attend college.","Sample 2:","People attend colleges or universities for a lot of different reasons. I believe that the three most common reasons are to prepare for a career, to have new experiences, and to increase their knowledge of themselves and the world around them.","Career preparation is becoming more and more important to young people. For many, this is the primary reason to go to college. They know that the job market is competitive. At college, they can learn new skill for careers with a lot of opportunities. This means careers, such as information technology, that are expected to need a large workforce in the coming years.","Also, students go to colleges and universities to have new experiences. This often means having the opportunity to meet people different from those in their hometowns. For most students, going to college is the first time they’ve been away from home by themselves. In additions, this is the first time they’ve had to make decisions on their own. Making these decisions increases their knowledge of themselves.","Besides looking for self-knowledge, people also attend a university or college to expand their knowledge in subjects they find interesting. For many, this will be their last chance for a long time to learn about something that doesn’t relate to their career.","I would recommend that people not be so focused on a career. They should go to college to have new experiences and learn about themselves and the world they live in.","(243 words)"],"id":10,"t":"opinion","c":5},{"n":12,"topic":"EDUCATION","q":"Nowadays, education overseas has become more accessible and growing numbers of people send their offspring to study in other countries. However, this trend has its detractors. I strongly believe that the pros far outweigh the cons, and will examine both below.","p":["One of the greatest advantages is that the children learn to be independent. Having to cook, clean, and pay bills instills this in them. Often they have to work part-time to make ends meet, and this impresses upon them the importance of work and money management.","Another important factor is that these children will be exposed to different cultures and ways of thinking. They will become more open-minded and tolerant and are likely to become more adaptable individuals.","One of the main motives for sending young people abroad to study is that it enhances their employment prospects. In my experience of living in foreign countries and speaking to various youths, it seems that a foreign education is regarded as something desirable and helpful in getting a decent job. A degree from Britain, for example, is seen as being of a higher standard than one from a developing country. Furthermore, living in a foreign country may lead to fluency in a second language, which is another selling point for prospective employers. In addition, many companies are keen to recruit people with a global outlook.","There are a few drawbacks however. For instance, without parental supervision, the new found freedom children experience may lead to harmful practices such as drug-taking and drinking. Reluctance or inability to reintegrate into their mother country is another. To sum up, it can be seen that the advantages of studying abroad for children are more numerous than the disadvantages. Of course a lot depends on the age of the child, but I believe that for most teenagers it would be a positive experience."],"id":11,"t":"advdis","c":4},{"n":13,"topic":"EDUCATION","q":"It has been said, \"Not everything that is learned is contained in books.\" Compare and contrast knowledge gained from experience with knowledge gained from books. In your opinion, which source is more important? Why?","p":["\"Experience is the best teacher\" is an old cliché, but I agree with it. We can learn a lot of important things from books, but the most important lessons in life come from our own experiences. Throughout the different stages of life, from primary school to university to adulthood, experience teaches us many skills we need for life.","As children in primary school, we learn facts and information from books, but that is not all we learn in school. On the playground we learn how to make friends. In our class work, we learn how it feels to succeed and what we do when we fail. We start to learn about the things we like to do and the things we don't. We don't learn these things from books, but from our experiences with our friends and classmates.","In our university classes, we learn a lot of information and skills we will need for our future careers, but we also learn a lot that is not in our textbooks. In our daily lives both in class and out of class, we learn to make decisions for ourselves. We learn to take on responsibilities. We learn to get along with our classmates, our roommates, and our workmates. Our successes and failures help us develop skills we will need in our adult lives. They are skills that no book can teach us.","Throughout our adulthood, experience remains a constant teacher. We may continue to read or take classes for professional development. However, our experiences at work, at home, and with our friends teach us more. The triumphs and disasters of our lives teach us how to improve our careers and also how to improve our relationships and how to be the person each one of us wants to be.","Books teach us a lot, but there is a limit to what they teach. They can give us information or show us another person's experiences. These are valuable things, but the lessons we learn from our own experiences, from childhood through adulthood, are the most important ones we learn.","* People are learning and practicing through their entire life. I believe that life experience and practice are the basic reasons of the humankind's evolution. However, in my opinion, knowledge gained from books plays a very important role in the modern life.","The most obviously important advantage of books is that they hold all knowledge gained by previous generations. People write books about their discoveries and inventions, which are gained through practice and experience. This knowledge is accumulated in books that are passed from generation to generation. So, basically, people get all knowledge about the previous achievements from books, analyze it and than, according to their experience and new data, write new books. In this case, books are the holders of humankind's experience.","For example, at old times people thought that the Earth was flat. It was concluded from observations and studdying. However, the next generations, using the experience of their ancestors, proved that the Earth was round.","Personally, I think that books are very important because they are able to give people the basic and fundamental knowledge. Books store history, the important events and discoveries. Without them it is difficult and sometimes impossible to move forward, make new discoveries and inventions.","To summarize, I think a person should take basic knowledge from books because it will help him to make his own inventions, conclusions and discoveries. Only using both books and one’s experience one can move forward.","(237 words)"],"id":12,"t":"opinion","c":10},{"n":14,"topic":"EDUCATION","q":"Do you agree or disagree with the following statement? People should read only those books that are about real events, real people, and established facts. Use specific reasons and details to support your opinion.","p":["Some people think that fiction books have no use at all. They claim that people should read about real events that took place, real people, and established facts. I have to totally disagree with this statement. From my everyday experience and observation I can stand that fiction, miracles and fairy tails are required in our life. For several reasons, which I will mention below, I believe that fiction books play an essential role in our life.","First of all, it is kind of difficult to imagine a six year old child reading about politics or history with the real facts that are not always pleasant. I think that children need miracles and Santa Claus because the real world is too complicated for them. They are too innocent and inexperienced to know the real facts and understand what a real life is about. In addition, I am sure that making a child read only non-fiction books can result in shock.","Second of all, following this statement about refusing from reading books about fiction events we also should refuse from festivals, parades, and celebration such holidays as Halloween because most of the characters there are fictional. Moreover, comic books will disappear as well as animated films and fiction movies. The disadvantage of non-fiction lies in the facts that nothing happens to excite the mind and spirit. From the other side, fiction provides a great slope for a mind to think creatively.","In conclusion, I think that people need miracles. We can not be satisfied with only naked truth. Human kind must believe in something and this belief helps people break limits and make new inventions.","(273 words)"],"id":13,"t":"opinion","c":4},{"n":15,"topic":"EDUCATION","q":"Going overseas for university study is an exciting prospect for many people. But while it may offer some advantages, it is probably better to stay home because of the difficulties a student inevitably encounters living and studying in a different culture. To what extent do you agree or disagree with this statement?","p":["There is no doubt that going to study in a foreign country, with its different language and culture, can be a frustrating and sometimes painful experience. But while overseas study has its drawbacks, the difficulties are far outweighed by the advantages. Indeed, people who go abroad for study open themselves up to experiences that those who stay at home will never have.","The most obvious advantage to overseas university study is real-life use of a different language. While a person can study a foreign language in his or her own country, it cannot compare with constant use of the language in academic and everyday life. There is no better opportunity to improve second-language skills than living in the country in which it is spoken. Moreover, having used the language during one's studies offers a distinct advantage when one is applying for jobs back home that require the language.","On a university campus, the foreign student is not alone in having come from far away. He or she will likely encounter many others from overseas and it is possible to make friends from all around the world. This is not only exciting on a social level, but could lead to important overseas contacts in later professional life.","Finally, living and studying abroad offers one a new and different perspective of the world and, perhaps most important, of one's own country. Once beyond the initial shock of being in a new culture, the student slowly begins to get a meaningful understanding of the host society. On returning home, one inevitably sees one's own country in a new, often more appreciative, light.","In conclusion, while any anxiety about going overseas for university study is certainly understandable, it is important to remember that the benefits offered by the experience make it well worthwhile."],"id":14,"t":"advdis","c":5},{"n":16,"topic":"EDUCATION","q":"Many students do not finish school. Why is this, and how can the problem be solved? School Drop-Outs: Problems and Solutions","p":["Today, although most students in the UAE complete school, a large number still drop out because of family, social and work pressures. This problem requires serious action from both individuals and the government.","Most students who do not complete school do so because of family problems. Girls, especially, want to get married and start a family. Some parents are not interested in education and do not support their children in studying. Social problems are also a contributing factor. Education is compulsory but, despite this, some people do not take it seriously. Furthermore, jobs are available even if students do not have a good education. The third reason is work pressure. Some families are poor and need their children to work in order to increase the income. All these problems will create young people who do not have any skills and who will not be able to improve their lives for the family and the country.","There are several things that can be done about these problems. Parents should be encouraged to send their children to school. Schools with baby-minding facilities should be opened specially for married students. The government needs to stress the importance of education and even offer financial support to students to continue. This will encourage students to stay at school rather than start working.","In conclusion, there are several things that the government can do to allow more people to finish school. However, a number of society attitudes also have to change if the country’s young people are to achieve their full potential.","256 words"],"id":15,"t":"problem","c":5},{"n":17,"topic":"EDUCATION","q":"Does a university education lead to success in life?","p":["It is very difficult to answer the claim that a person needs a university education to be successful in life because success in life means different things to different people. This essay starts by defining three different ideas of success. Following this, it looks at which types of success are dependent on a university education.","Success in life can be achieved in different ways. Many magazines and television programmes tell us that success means having a lot of money, having a fulfilling career, and being powerful. In contrast, most religious and spiritual organizations claim that success means finding spiritual happiness and being at peace with God and with yourself. Another idea of success focuses on relationships - being surrounded by people who love you and care about you, spending time with family and friends.","A university education can help you achieve some types of success, but it makes little or no difference to whether or not you are successful in other areas of life. Undoubtedly, a university education is essential if you want to have a career in a profession such as law, engineering, teaching, or medicine. However, you do not need a university degree to become a wealthy and powerful movie star, sports star or businessperson. In fact, a university education does not generally enable you to achieve spiritual happiness, or to have successful relationships with family and friends.","sIn conclusion, there are many different types of success. A university education may help you to achieve professional success in some careers. However, it will not help you to achieve success in other areas of your life such as your spiritual life or your relationships.","275 words Author unknown, edited slightly"],"id":16,"t":"two","c":5},{"n":18,"topic":"EDUCATION","q":"Education: Losing its Value","p":["Today, it seems to be universally accepted that increased education is a good thing. Thousands of colleges and millions of students spend vast amounts of time and money chasing pieces of paper. But what is the value of these qualifications? This essay will discuss whether education has been devalued.","Supporters of education (usually teachers or educators, or those who have an interest in stopping people thinking for themselves) say that increased levels of education will open doors for students. Certificates, diplomas, and degrees are held up as a status symbol, a passport to a private club of money and power.","However, the truly powerful are not those who have taken degrees, but people who have stood back and looked at what is really important in life. They have seen opportunity and followed dreams. These people are found in every part of society. Like many brilliant people, Einstein was a weak student at math. Like many successful businessmen, Bill Gates never completed college. Like many inventive and creative people, Edison never went to school. The greatest religious teachers do not have letters after their name, but have looked into their hearts for meaning. Similarly, the world’s political leaders do not have master’s degrees or doctorates. These are the people who shaped our century, and they are too busy with real life to spend time in the paper chase.","Students in college are being sold an illusion. They are made to believe that self- understanding and society approval will come with the acquisition of a piece of paper. Instead of thinking for themselves, and finding their own personality and strengths, they are fitted like square pegs into round holes.","The role of education is to prepare masses of people to operate at low levels of ability in a very limited and restricted range of activities. Some of these activities are more challenging than perhaps the assembly lines of the past, but still the ultimate purpose is equally uninteresting. More worryingly, despite the increased level of education, people are still not genuinely expected to think for themselves. In fact, the longer years of schooling make the job of brainwashing even easier.","There is still a role for study, research, and education. However, we need to examine our emphasis on education for the sake of a piece of paper, and to learn the real meaning and revolutionary challenge of knowledge."],"id":17,"t":"other","c":6},{"n":19,"topic":"EDUCATION","q":"Education: Still Invaluable!","p":["In the past, degrees were very unusual in my family. I remember the day my uncle graduated. We had a huge party, and for many years my mother called him \"the genius\" and listened to his opinion. Today, in comparison five of my brothers and sisters have degrees, and two are studying for their masters'. However, some people think that this increased access to education is devaluing degrees. In this essay, I will look at some of the arguments for and against the increased emphasis on degrees in our society.","People have several arguments against the need for degrees. They say that having so many graduates devalues a degree. People lose respect for the degree holder. It is also claimed that education has become a rat race. Graduates have to compete for jobs even after years of studying. Another point is that studying for such a long time leads to learners becoming inflexible. They know a lot about one narrow subject, but are unable to apply their skills. Employers prefer more flexible and adaptable workers.","However, I feel strongly that this move to having more qualifications is a positive development. In the past education was only for the rich and powerful. Now it is available to everyone, and this will have many advantages for the country and the individual. First of all, it is impossible to be overeducated. The more people are educated, the better the world will be, because people will be able to discuss and exchange ideas. A further point is that people with degrees have many more opportunities. They can take a wider variety of jobs and do what they enjoy doing, instead of being forced to take a job they dislike. Finally, a highly educated workforce is good for the economy of the country. It attracts foreign investment.","In conclusion, although there are undoubtedly some problems with increased levels of education, I feel strongly that the country can only progress if all its people are educated to the maximum of their ability.","339 words"],"id":18,"t":"other","c":5},{"n":20,"topic":"EDUCATION","q":"It is often said that the subjects taught in schools are too academic in orientation and that it would be more useful for children to learn about practical matters such as home management, work and interpersonal skills. To what extent do you agree or disagree?","p":["A criticism often heard these days is that the subjects taught in schools tend to be too academic, and contribute little to preparing a young person for the real-life tasks he or she will have to perform after graduation. They say that academic subjects are rooted in the past, and are not useful for solving modern problems. I disagree with this point of view for three reasons.","My first reason is that it is the duty of parents, not teachers, to prepare their children to deal with the practical affairs of life. The home, not the classroom, is the ideal place to learn about home management and interpersonal skills. As for work abilities and attitudes, they are best learned “on the job” and under the supervision of an experienced older worker.","My second reason is that academic subjects have withstood the test of time. They represent the accumulated wisdom of our ancestors down through the ages, and, far from being impractical, they equip us with the knowledge and confidence to make sound judgements about any problems which may crop up. In addition, academic subjects are good for training us in mental discipline, while practical subjects are weak in this regard.","My third reason is based on the saying “Man does not live by bread alone.” Schooldays devoted solely to instruction in down-to-earth practical matters would be dull indeed! Lessons in the best literature of the world, and the epoch-making scientific and geographical discoveries of the past enrich our lives and make us feel that we are part of the great family of mankind.","All in all, the teaching of academic subjects in schools is entirely appropriate. It is my firmly held view that practical subjects have no place in the classroom. On the contrary, the curriculum should be more academic!"],"id":19,"t":"opinion","c":5},{"n":21,"topic":"EDUCATION","q":"It has been said, “Not every thing that is learned is contained in books.” Compare and contrast knowledge gained from experience with knowledge gained from books. In your opinion, which source is more important? Why?","p":["“Experience is the best teacher” is an old cliché, but I agree with it. The most important, and sometimes the hardest, lessons we learn in life come from our participation in situations. You can’ learn everything from a book.","Of course, learning from books in a formal educational setting is also valuable. It’s in schools that we learn the information we need to function in our society. We learn how to speak and write and understand mathematical equations. This is all information that we need to live in our communities and earn a living.","Nevertheless, I think that the most important lessons can’t be taught; they have to be experienced. No one can teach us how to get along with others or how to have self- respect. As we grow from children into teenagers, no one can teach us how to deal with peer pressure. As we leave adolescence behind and enter adult life, no one can teach us how to fall in love and get married.","This shouldn’t stop us from looking for guidelines along the way. Teachers and parents are valuable sources of advice when we’re young. As we enter into new stages in our lives, the advice we receive from them is very helpful because they have already bad similar experiences. But experiencing our own triumphs and disasters is really the only way to learn how to deal with life.","(252 words)"],"id":20,"t":"opinion","c":4},{"n":22,"topic":"THE ENVIRONMENT & NATURAL SOURCE","q":"Nowadays environmental problems are too big to be managed by individual persons or individual countries. In other words, it is an international problem. To what extent do you agree or disagree?","p":["An essential problem of the 21st century is world pollution. Currently the environment is so much contaminated that urgent measures should be taken. The single individual cannot be blamed for the world pollution, however every person should take care of his or her habitat. In addition, it is vital that environmental issues should be treated internationally.","Lately, many presentations, conferences and international summits are held regarding waste treatment, recycling, soil and water contamination. For sure joint efforts and consolidation can only help in the mutual war towards the environmental disaster, which is going on. For instance, governments should offer support to companies and organizations, involved in manufacturing, industry or agriculture in order to find environment friendly approaches. These could be special law regulations, recycling programs, helping courses in order to implement ISO certificates and many more.","However, the influence of individuals over environment should not be ignored. If we do not confess that our planet is our home, we will never be able to take adequately care of it. We have to contribute every day to the preservation of nature and environment. For example, always remember to save energy by switching off lamps, computers and everything that we do not use. Our next obligation is to separate waste and throw bulk only in the designated areas. Driving vehicles can also be environment friendly. For example, we have to avoid accelerating the engines too rapidly or using the air condition in the country, where it will be better to save energy and simply open the windows.","To sum up, environmental problems should be handled by local and international authorities also. Every single person should take care of environment and moreover we have to bring up our children to be conscious citizens of a clean and preserved planet.","This is a very good essay, Band 7+ candidate. The structure of essay and sentences is correct as well as the spelling and punctuation. Good job!"],"id":21,"t":"opinion","c":5},{"n":23,"topic":"THE ENVIRONMENT & NATURAL SOURCE","q":"Nowadays we are producing more and more rubbish. Why do you think this is happening? What can governments do to help reduce the amount of rubbish produced?","p":["I think it is true that in almost every country today each household and family produces a large amount of waste every week. Most of this rubbish comes from the packaging from the things we buy, such as processed food. But even if we buy fresh food without packaging, we still produce rubbish from the plastic bags used everywhere to carry shopping home.","The reason why we have so much packaging is that we consume so much more on a daily basis than families did in the past. Convenience is also very important in modern life, so we buy packaging or canned food that can be transported from long distances and stored untill we need it, first in the supermarket, and then at home.","However, I think the amount of waste produce is also a result of our tendency to use something once and throw it away. We forget that even the cheapest plastic bag has used up valuable resources and energy to produce. We also forget that it is a source of pollution and difficult to dispose of.","I think, therefore, that governments need to raise this awareness in the general public. Children can be educated about environmental issues at school, but adults need to take action. Governments can encourage such action by putting taxes on packaging, such as plastic bags, by providing recycling services and by thing households and shops that do not attempt to recycle their waste.","With the political will, such measures could really reduce the amount of rubbish we produce. Certainly nobody wants to see our resources used up and our planet poisoned by waste.","(270 words)"],"id":22,"t":"opinion","c":5},{"n":24,"topic":"THE ENVIRONMENT & NATURAL SOURCE","q":"Scientists and the news media are presenting ever more evidence of climate change. Governmnets cannot be expected to solve this problem. It is the responsibility of individuals to change their lifestyle to prevent further damage. What are your views?","p":["Recently scientists worried about climate change have urged governments to introduce measures to reduce the greenhouse gas emissions that are seen as its main cause. Simoultaneouslty, politicians and environmentalists have urged individuals to make changes to their lifestyle. I shall argue that governments and individuals should take join responsibility for this problem.","Firstly, industry accounts for a large proportion of the greenhouse gas emissions, and this can only be controlled by government action. Measures could be taken to discourage pollution, such as limiting or taxing the use of fossil fuels. Alternatively, subsidies could be offered to industries to clean up their production processes. If these ideas were adopted, I believe that businesses would regard pollution as a financial issue.","Secondly, only discussion between governments can ensure that solutions are successful. The Kyoto agreement, for example, tried to reach global agreement on how to address the problem. Without such co-operating, it seems to me that efforts to reduce fuel consumption are unlikely to be effective.","However, national and international policies will only secceed if individuals also change their lifestyle. For example, people could think more carefully about how they use energy in their homes. By using less electricity, installing energy-efficient light bulbs and electrical appliances, or investing in solar panels, individuals can make a real difference.","In addition, I think individual attitudes to transport need to change. Instead of making short tips by car, people could choose to walk, cycle, or take a bus. Since cars are a major source of the problem, changing our behaviour in this area would have a major impact.","In conclusion, I would maintain that only a combination of international agreement, national policies, and changes in individual behaviour will succeed in preventing further damage to the environment.","(291 words)"],"id":23,"t":"opinion","c":6},{"n":25,"topic":"THE ENVIRONMENT & NATURAL SOURCE","q":"Many parts of the world are losing important natural resources, such as forests, animals, or clean water. Choose one resource that is disappearing and explain why it needs to be saved. Use specific reasons and examples to support your opinion.","p":["As human's population is dramatically rising every year, people's requirements are increasing too. We need more food, more fresh water, more places to live. As a result of this many parts of the world are losing essential and sometimes irreplaceable resources, such as forest, animals, or fresh water. In this essay I will focus on the threat of disappearing many wild animals.","The reason why I think that animals should be preserved is that all living creatures on this planet are connected with each other. So, the disappearance of only one species can cause dramatic changes in the planet and even death of many other living creatures. For example, the disappearance of bats will cause the huge increasing of insect population and this will reflect on all animals and plants. Another example is that if the population of bats increases, the population of insects will decrease significantly, and this will cause the disappearance of many plants because insects are the main pollinators. So, I think it is very important to preserve all species on our planet and live in harmony with our environment.","Another important reason why I think that animals should be saved is that I, personally, do not want my child to learn about differen
