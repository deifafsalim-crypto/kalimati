ant aspect of this is that parents will have more time to spend with their children as a result of eliminating traffic jams and decreasing driving time as a whole.","From the other side, children have some advantages living in a big city. For example, they have more opportunities to choose from what they want to do. They can choose to attend ballet school, school of art, gymnastics, etc. For the long run, it is good for them. They will be better prepared for a live in a \"real world\" and they will have more chances to make a good career and succeed. Moreover, a big city usually has many entertaining centers with movie theatres and play stations. When I was a child I liked to go to the movie theatre with my parents to watch a premiere.","One more reason to choose a big city for a child is that a city provides better live conditions and services such as medical, dental, etc. My friend lived in the country for a while and one time he and his family had to drive a couple of hours to the nearest medical center when his child got a heavy cough.","To summarize, I agree with those people who want to raise their children in a city. The plenty of opportunities offered by a city helps children to find what they really like and be the best at it. Moreover, despite the air pollution, children get a better medical service that is good for their health."],"id":59,"t":"opinion","c":5},{"n":61,"topic":"CHILDREN","q":"Do you agree or disagree with the following statement? Children should be required to help with household tasks as soon as they are able to do so. Use specific reasons and examples to support your answer.","p":["The issue about whether children should help with household tasks as soon as they are able to do so is open for debate. Some people say that children should devote more time for playing with their friends, watching TV and studying. However, other people believe that children should help their parents with household tasks. Personally, for several reasons, which I will explain bellow, I adhere to the latter point of view.","First of all, I think that every child should have his or her own responsibilities. When I was a child my parents taught me how to make breakfast in the morning. So, I woke up, went to the kitchen and prepared a couple of toasts for breakfast. It was easy and I enjoyed doing it because I liked the way my parents thanked me and I felt that they were proud of me. Also, my mom always wanted me to know how to cook, clean and iron my cloth. Thanks to the learning, nowadays, when my maid can not come to my house I handle all household tasks myself.","Second of all, performing household tasks teaches children to value the job of people who did it. When I was a child I did not imagine that cleaning house could be so time and energy consuming. So, when I began to do some of the household tasks by myself I began to respect the job of others and tryed to collect all my toys after my playing with them.","Finally, doing household tasks teaches children to arrange their time. In addition to those practical benefits, help from children allows parents to have more spare time for their personal lives and for the children. A family can have more time to spend with each other talking, watching movies or just enjoying the beautiful moments. To sum up, I think that children should help their parents with household tasks. Doing household tasks helps them to grow into independent, self-confident, and attentive persons who respect their parents.","(334 words)"],"id":60,"t":"opinion","c":4},{"n":62,"topic":"CHILDREN","q":"Children's lives these days are quite different from our generation's. Describe what are the biggest changes in younger generation and explain some factors of this phenomenon.","p":["Over the past few decades, the world has significantly changed. Nowadays, many have begun to wonder what the reasons behind [=for] these changes are. Two major factors contributing to this phenomenon are advances in media and change family dynamics [=organization].","First, advances in media, such as the Internet and TV, have meant that children spend a large portion of their leisure time in front of a screen. Consequently, they are not getting proper amounts of exercise, which results in an increase in the number of children who are overweight and obese. In addition, fast food restaurants have become increasingly popular, which has also contributed to children's health problems Moreover, another leading force of this trend is changes in the family unit. Compared with a half century ago, nuclear families have become way more common in modern society. People tend to have only one child, which has caused personality disorders such as depression, loneliness, and selfishness. This is mainly because parents with one child have tendency to put all their focus and money into their only son or daughter. Studies have indicated that over 65% of children who are brought up without siblings show self- centered behavior find it difficult cooperating with their peers.","In summary, there are many factors that have caused children to live very differently from the generation before them. There are high hopes that parents exercise(s) wisdom in treating their children. (270 words)"],"id":61,"t":"other","c":3},{"n":63,"topic":"CHILDREN","q":"It is widely believed that children of different levels of intelligence should be taught together, while others think that more intelligent children should be taught separately. Discuss and present your own opinion.","p":["In past educational institutions, children have been taught together based on age regardless of intellectual ability displayed at school. Alternatively, a large proportion of the population believes there should be a strong move towards the separation of children of different intellectual capabilities in current educational institutions. From my own educational perspective, I honestly believe that younger students possessing higher intelligence levels than their peers ought to be separated into alternative levels based on their gift, for a number of reasons.","Admittedly, although young learners have the chance to learn a lot from associating with classmates their own age, it is widely believed that such a process isn’t considered to be vital for a healthy educational upbringing. The argument for intellectual separation holds some strong advantages. Firstly, by allocating students to classes based on levels of intelligence, high achievers have the opportunity to excel in a way that they couldn’t in a normal class. Owing to the fact that they can be placed into an unrestricted educational environment, students can excel with intellectual freedom.","Secondly, there is a strong argument in regards to inhibiting a child’s intellectual growth by restricting them from moving above their peers if their mental capability permits. Why should we limit the intelligence of our future generation? For instance, many of today’s highly successful artists and entrepreneurs in the world have come from an unrestricted educational background and have been allowed to explore their mind and careers to the fullest extent.","In conclusion, although I believe an educational environment for young learners should promote equal opportunity, I honestly think that creating a more liberal environment which enhances the learning capabilities of intellectually-gifted children will not only benefit individual’s careers but future society as a whole.","(288 words)"],"id":62,"t":"opinion","c":4},{"n":64,"topic":"CHILDREN","q":"Some people believe that childrens leisure activities must be educational, otherwise they are a complete waste of time. Do you agree or disagree?","p":["Today, education has become a priority for many parents seeking to secure a good future for their children in this rapidly changing world. They believe that if their children apply themselves and work hard at school, then they will increase their opportunities for going to higher education and eventually getting a good job. Of course they are right, and as access to the best education and best jobs is becoming more competitive, then it is true that children have to make the best of their study time when they are young.","However, the parents who do not allow their children sufficient free time for leisure activities outside school hours, are misguided. Such activities are far from being a waste of time for the children simply because they are not academic. It is important to remember that children need to develop skills other than intellectual ones, and the best way to do this is through activities such as sports, games and playing with other kids. If they cannot play make-believe games, how can they develop their imagination? How can they learn physical co-ordination or learn important social lessons about winning and losing if they do not practise any sports? Many children form strong, personal relationships with the friends they play with, and without the opportunity to do this, they could grow up emotionally immature or unformed.","Finally, I think it is also important to remember that children need to relax as well as work. If everything they do must have some educational or academic relevance, then they will soon get tired of studying altogether, which is the last thing parents would want."],"id":63,"t":"opinion","c":3},{"n":65,"topic":"CHILDREN","q":"Physical Punishment for Children ?","p":["There have been big changes in the attitudes of most parents over the last few years. Very few parents would agree with using force regularly as a way of dealing with discipline problems in their children. Physical punishment is banned in schools in most countries, and in many countries, there are moves to ban all corporal punishment of children even in the home. However, many parents still believe that they have a right to use some physical punishment to deal with certain misbehaviors at certain ages. This essay will ask if some physical punishment is acceptable today, and will ask how parents can know what the limits are.","It is easy to find reasons to allow some physical punishment. One issue is that many parents find it very difficult to abandon physical punishment completely. Parents argue that this was the way they were brought up themselves and that it didn’t do any harm to them. They believe that for the child’s sake that they have the right to discipline the child in any way they see fit, including using corporal punishment. A second point is that corporal punishment can be quick and effective: there is not much point reasoning with a screaming child in the supermarket. Finally, most parents are reasonable and fair, and very very few would ever consider hurting their children by using unnecessary physical force.","There are several reasons however why we should stop using physical punishment even in the home. One point is that most parents are not trained to deal with misbehaving children. They do not have enough resources or choices to handle the situation. As a result, they immediately react by smacking or hitting the child, even if there are other solutions to the problem. Another point is that unless people are challenged or forced to change their beliefs they may keep following negative habits. An example is seatbelt use - now most people wear seat belts without thinking, whereas years ago the idea of using safety belts was strange to most people. In the same way, banning physical punishment in the home will allow people to change their habits and break a cycle of violence. However, the most obvious reason for banning all physical punishment of children is to prevent child abuse. If all parents are allowed to hit their children in the name of discipline, some parents will go too far and will inflict severe emotional and physical damage on their children. It may only be a smll minority of parents, but we need to protect all our children.","In conclusion, parents have to change some of their beliefs and ideas about how children should be raised. It is possible to avoid the use of physical force in the home, and doing so will help us move closer to dream of removing violence from our society. (474! Much too long! You only have one hour! But there is no penalty in IELTS for writing over 250 words in Task 2 - if you can do it!)"],"id":64,"t":"two","c":4},{"n":66,"topic":"CHILDREN","q":"Should parents use corporal punishment to discipline children?","p":["Effective when used wisely Many parents use physical punishment to discipline their children. Others prefer to use different methods to reward good behavior or punish misbehavior. This essay will look at some of the arguments for and against physical punishment of children.","It is often claimed that physical punishment will damage children in later life. Opponents of corporal punishment claim that the children will grow up to become delinquents or even beat their wives. However, many happily married adults today were slapped when they were younger but have never hit their spouses. Another point often made is that physical punishment teaches children that you can use force to make others do what you want. In fact children brought up well soon learn that force by itself is nothing - it must be associated with right. Finally, some people say that punishing a child by smacking him will damage the relationship between the child and the parents. This is clearly wrong. Children who understand the reasons for rules will be happier than children who are not given clear guidelines.","There are definitely concerns about physical punishment. Some parents lose control and can injure children - even breaking bones or causing bruises. Others can use violence excessively or as the only method of discipline. In this case, the child will be hurt, fearful and anxious and will not learn to distinguish right from wrong. The biggest problem with physical violence is when it is not appropriate to the age of the child. It can be very effective to quickly smack a two-year-old who is screaming. However, it is not effective to beat a 16-year-old who is late for school once again.","In conclusion, physical punishment can be a useful method of discipline. However it should be the last choice for parents. If we want to build a world with less violence we must begin at home, and we must teach our children to be responsible.","(317 words)"],"id":65,"t":"opinion","c":4},{"n":67,"topic":"CHILDREN","q":"Should children be educated at home or in school?","p":["Are parents really helping their children by teaching them at home?","In most countries in the world, governments require children to attend schools in which trained teachers are responsible for educating the children using an approved curriculum. However a significant number of parents believe that it is much better for their children to be educated at home by the people who know them and their needs best. This essay will examine the question of home schooling and discuss which the best option for the child is An increasing number of parents are deciding that home schooling is the best option for their children. They are unhappy with the quality or depth of education offered in the schools, or have other reasons why they feel that traditional schools are not suitable for their children. One reason is social factors. Parents worry that their children will suffer from bullying or will be forced into antisocial behavior by peer pressure. They believe that the good behavior they have taught the child will be lost in school. Another reason is concern over the quality of schooling available. Schools frequently have large classes. They are often under-funded, and staffed by teachers without sufficient knowledge of their subjects. Subjects such as the family’s religion or language may not even be available in the school. Other parents may disagree with the aims of the school curriculum, preferring for academic, social or cultural reasons to keep their children separate. Finally, some children with special needs may need particular parental care.","However, there are many arguments in favor of sending children to conventional schools. The first is that the children will be exposed to other children. These children may represent either a cross-section of society or a narrow group, but in either case the children will interact with each other and develop social skills. A second point is that the children will learn to function outside the family. They will not be dependent on their parents for their educational, emotional and social needs. A third point is that the children will find it easier to integrate when they finish school, as they eventually will, when they start work or college.","Overall, while many parents work hard to teach their children at home, conventional schools are still the right choice for most children. Schools are not perfect, but they seem to be a proven way of preparing our children for the real world. (392 words)"],"id":66,"t":"opinion","c":4},{"n":68,"topic":"CHILDREN","q":"Do children learn more quickly than adults?","p":["Small children seem to learn very quickly, while adults sometimes appear to lose the ability to pick up new subject such as languages, music, games, or computer programs. In this essay, I will discuss whether children or adults make the best learners.","It is undoubtedly true that children seem to learn very quickly. In just a few years, they can learn how to play a musical instrument, speak one or even two new languages, and deal with many subjects at school. They even have time for sports and hobbies, and become experts in their favorite pastimes. However, how much of this is social pressure and how much is genetic? I am convinced that while children's brains have a natural ability to absorb new information as part of their developmental growth, much of their achievement is because of social pressure. Schools force them to take many subjects. Parents force them to practice new sports or to learn music. Even their playmates force them to become better at computer games or to read Harry Potter novels faster. In summary, children may enjoy learning, but their environment also is a big motivating factor.","Adults on the other hand are supposed to be poor learners. However, I disagree with people who say that adults cannot learn quickly. Adults have many skills that compensate for the decline in the ability of the brain to grasp and remember new material. They can organize their learning by setting times for reading or practice. They can build on skills and experiences they know already. Adults usually cannot learn to do ballet or to play the violin, but even despite these physical challenges, their motivation can often be higher than a child's. Unfortunately, society does not encourage many adults to learn. People are busy with families and work, and some adults may feel that further learning is pointless, since they have already achieved many goals at work or in their personal life.","In conclusion, I feel that we cannot generalize about children or adults being better learners. It depends on the situation and the motivation of the person, and the level of enthusiasm he or she has for learning. (360 words)"],"id":67,"t":"two","c":4},{"n":69,"topic":"CHILDREN","q":"Children who are brought up in the family that do not have a lot of money are better prepared to deal with problems when they become adults than children who are brought up by wealthy parent. Do you agree or disagree with this statement?","p":["Gives reasons for your answer and include any relevant examples from your own knowledge or experience. Over the past few decades, along with growing interest in child education, people's attention to the family environment where a child is brought up has also significantly increased. Some people have begun to feel that a child who has grown up in a poor family tend to be better prepared to deal with problems. In my opinion, however, family environment alone does not much influence a child's ability to solve problems.","A child who was born into a poor family would have had more situations where they had to solve a problem or make a decision on their own. This is because in most unfortunate families, both parents are usually working and children are put into situations where they have to take care of themselves. By contrast, due to their wealth, rich children can experience and learn things that unfortunate children cannot. For example, they usually go to the best schools and receive a higher education there, which prepares them better for solving problems in their life.","However, few would disagree with the fact that each individual is different. That is, problem solving skills come more from life experience. That is, the more a person experiences in life, the more they can use these experiences to adjust, to adapt and to solve problems they encounter. Personality also can be a factor in dealing with problems. A person who is optimistic, outgoing, confident and open-minded can look at and solve problems more effectively.","As discussed above, nature and nurture have an equal influence on a child's ability to face challenges. Parents should spare no effort to figure out how they can help their children to be independent. I hope that in the future the next generation will grow up as mature citizens. (291 words)"],"id":68,"t":"opinion","c":4},{"n":70,"topic":"YOUNG PEOPLE","q":"A lot of people believe that the amount of violence shown on TV and in the cinema affects the actions of our young people and therefore increases the amount of violence in our society today. Do you agree or disagree with this statement? What can be done to reduce violence in our society today?","p":["The question of whether the amount of violence on TV and cinema has affected young people in our society is something which cannot be quantified or proved. My opinion is though that the answer is “yes, it has”.","TV and cinema today do show a large amount of violence and, although we try and shield our young people from seeing too much, they still get to watch it. At the age of eighteen in my country they can see everything anyway. Violence on the streets has increased. That has been proved. The connection between TV‛s and the cinema‛s obsession with violence and today‛s street violence cannot be proved but it is logical that the two are connected. Young people imitate what they see and it is logical that they see glamour in what they do when they commit violence.","How can we lessen violence? Reducing the amount of violence on TV and in the cinema would certainly be a good start. Being more vigilant about what age children are when they see violence in these media, and raising the age limits would also help. Another good idea would be to channel the violence of young people. I don‛t think that national service should be re-established in this country but, if people are convicted of violence and sent to prison, then why not give them the option of serving in the army. Their violence will be controlled and they will be subjected to discipline so that they will be better able to control themselves when they leave.","Thus I agree with the statement that cinema and TV violence affects the young people in our society. There are some things that can be done to better the situation but I doubt whether anything will be done.","(294 words)"],"id":69,"t":"opinion","c":4},{"n":71,"topic":"YOUNG PEOPLE","q":"Action movies with spectacular car chases are very popular with young people. it is often said that these sorts of movies lead to an increase in car accidents among young drivers as they try to copy what they have seen in the films. Do you agree that such movies increase the amount of bad driving? What can be done to encourage young people to drive more safely?","p":["Movies tend to have a very large influence on young people who are influenced both by what they see and hear. Because this is the case, it is true that car chases in action movies tend to lead to an increase in the number of car accidents among young drivers because they try to copy what they have seen in the films. They drive too fast and take unnecessary risks and the difficulty is that most young people lack the skills and experience to do this.","There are a variety of ways in which young people can be encouraged to practise safer driving habits. Firstly, the Government should launch a safe driving campaign to convey the fact that driving safely is not uncool. In effect, it should be cool to stay alive and healthy! Secondly, every movie should make it clear that dangerous car chases are undertaken only in strict safety conditions with experienced drivers, and often special movie-making tricks are used to enhance the action. Thirdly, young people should be forced to take safe driving courses every year for the first five years that they have their driver's licence. In this way, they are forced to perfect their driving skills or their licence will be taken away.","Finally, as part of this course, young drivers should go to hospitals and witness the effects of poor or dangerous driving on other people. When they see hospitalised people whose lives have been destroyed due to stupid risk-taking, they will surely change their minds about whether it is cool to copy action heroes and drive fast.","264 words"],"id":70,"t":"opinion","c":4},{"n":72,"topic":"OLD PEOPLE","q":"In Britain, when someone gets old they often go to live in a home with other old people where there are nurses to look after them. Sometimes the government has to pay for this care. Who should be responsible for our old people?","p":["Many old people in Britain, after a lifetime of hard work and the toil of bringing up children, are put into homes for the elderly by their families. There, they are looked after by professional nurses, and this is sometimes at the expense of the government. However, this situation has raised controversy about whether we extend to our elders the care and respect they deserve.","The critics of this system say that it is the duty of the family to look after its senior members in the years when they are no longer able to work. They point out that in retirement homes old people tend to feel useless and unwanted by their family members, who seldom come to see them. In addition, there is evidence that younger people benefit from the experience and wisdom of older people who live with them on a daily basis.","On the other had, those who support the system say that retired parents can be a burden to young families. Not only is it expensive to support old people who have little or no income, but the fact that old people are often ill and need a great deal of looking after can be too much for their busy children.","In my opinion, neither side is completely right. Old people in good health and with enough finances to support themselves can be a great help to their children. For instance, they can look after their grandchildren while children are out at work. On the other had, sick and penniless old people are better off being looked after in retirement homes at government expense."],"id":71,"t":"opinion","c":4},{"n":73,"topic":"SOCIAL","q":"Some people think that human needs for farmland, housing, and industry are more important than saving land for endangered animals. Do you agree or disagree with this point of view? Why or why not? Use specific reasons and examples to support your answer.","p":["As human population is significantly rising every year, people's requirements are increasing too. We need more food, more machines, more place to live. As a result of this people need more land to satisfy their requirements. We cultivate and irrigate more and more land to plant vegetables, build new buildings, airports, roads, etc. I think sometimes we forget that we are not alone on this planet. I have to disagree with those people who think that human needs are more important than saving land for endangered animals. I base my opinion on the following points.","First of all, as I already mentioned, we are not alone on this planet. A few centuries ago we were the part of wild nature. I think we need to remember this fact and respect all creatures around us.","Second of all, I believe that we all need to think of the problem of overpopulation. The human population is dramatically increasing and we have to do something about it. From my opinion, every family should have no more than two children. It will help to stop the growth of population, decrease human needs for farmland, housing and industry.","In conclusion, I think it is a very topical question nowadays. My point is that all people should answer this question and find the solution.","(218 words)"],"id":72,"t":"opinion","c":4},{"n":74,"topic":"SOCIAL","q":"Trade and travel would be a lot easier with a single, global currency that we all use. Do you agree or disagree with this statement? Would a single currency cause any problems?","p":["It is clear to me that the idea of a single global currency is an excellent ideal to work towards. There can be no doubt that trade and travel would be vastly easier. On the other hand I believe that it would cause problems today.","The benefits of a single currency can be seen with the use in Europe of the Euro. Whenever you are travelling between countries using the Euro, the problems of currency changing and exchange rates are history. Similarly business between countries using the Euros is so much easier; no more worrying about exchange rate risk and pricing. Everyone‛s money is the same. The same thing is true with the US dollar. Most countries do not use the US dollar but it is accepted in many places. There are many countries that you can travel to and just take US dollars to use.","At present though a global currency would be impossible. Firstly most countries would not accept the idea. Secondly all countries are in different economic states. Some are economically very strong and some are in a state of collapse with inflation ruining the economy. Such countries could not be brought into a world currency as it would cause massive financial instability worldwide. So it is clear that a global currency would indeed cause some serious problems.","So, in conclusion I see a global currency as a future ideal but it will not happen in my lifetime. It would make trade and travel much easier but the problems it would cause nowadays would be insurmountable.","(259 words)"],"id":73,"t":"opinion","c":4},{"n":75,"topic":"SOCIAL","q":"All education, primary, secondary and further education, should be free to all people and paid for by the government. Do you agree or disagree with this statement?","p":["Different countries have different education systems. I don‛t know all the education systems in the world but all the ones I do know about have free school education at primary and secondary level. I certainly agree with the statement that this should be the case. I believe university education is different.","No matter what standard of income someone has or what society someone comes from, everyone should have the opportunity to have a good standard of education. This is not always what happens but it is what should happen. Private schools can be available for those who want and can afford it but the free schools should always be there. This is certainly one of the best attributes of western democracy and all countries it seems strive to attain situation although some have problems due to the economic and political situations in their countries. Governments should make sure that all their citizens have access to a good standard of free education at primary and secondary level.","Further education is different. In an ideal world this should be free but governments have a lot of demands on their money. I think that students should have to pay, maybe not all, but at least a contribution towards their tuition fees. They will be able to earn it back once they have graduated. The UK has this system whereas in the US students have to pay all their high tuition fees which can run into the tens of thousands of dollars over a full course. I am not sure if I agree with this but it certainly would make sure that students make the best of efforts to pass or all their money would be wasted.","Therefore I conclude that primary and secondary education should be freely available for all if possible but that further education should not necessarily be wholly free.","(309 words)"],"id":74,"t":"opinion","c":4},{"n":76,"topic":"SOCIAL","q":"\"Although abuse of the system are inevitable, social welfare payments are essential to protect the rights citizens have to a guaranteed minimum income in a democratic society\" Discuss.","p":["Social welfare is an essential element of an advanced society. Good systems are always abused, but that does not mean they are faulty. In my opinion, the two main reasons why welfare payments are necessary are as follows:","First of all, critics forget that there are many forms of welfare besides payments to the unemployed. Their negative opinions harm those who are not capable of earning a wage, such as single-parent mothers, the disabled, and the sick. Moreover, the unemployed have the right to an income, too. They are not always at fault for not having a job, and in most cases the tax they have paid in the past entitles them to assistance.","The second reason is that crime increases when people have no means of support. The desperately poor inevitably turn to crime, which is not only dangerous but costly. Policing the streets is more expensive than providing welfare. A policeman's wage is four or five times higher than a \"dole\" payment.","Certain members of society believe that people should look after themselves. They point out that welfare increases dependency on others and destroys dignity. This may be true, but in the case of the unemployed, the relief payments are usually temporary. It is surely the fault of the government if there are long-term unemployed. Welfare critics also believe that it is the responsibility of a victim's family to provide financial assistance. However, it is too expensive to provide complete help for a severely disabled person.","To conclude, it is vital to understand the need for welfare in a modern democratic society. Without welfare payments the poor are destined to become poorer. The first duty of a government is to provide a financial safety net for all disadvantaged persons, and that includes those without work."],"id":75,"t":"other","c":5},{"n":77,"topic":"SOCIAL","q":"The world is experiencing a dramatic increase in population, This is causing problems not only for poor, undeveloped countries, but also for industrialised and developing nations. Describe some of the problems that overpopulation causes, and suggest at least one possible solution.","p":["In most countries of the world the population is increasing alarmingly. This is especially true in poor, undeveloped countries. Overpopulation causes a considerable number of problems.","In poor countries it is difficult to provide enough food to feed even the present number of people. In addition, education to limit the number of children per family is not always successful. Poorer countries usually have a lot of unemployment too, and an increase in population simply makes the situation worse. The environment also suffers when there are too many people living on the land.","In rich, industrialised and developing countries it is very difficult for governments to provide effective public services in overcrowded cities. Moreover, there is usually a great deal more crime, which is often due to high rates of unemployment. Further large increases in population only cause more overcrowding, unemployment and crime.","There are two main solutions to the overpopulation problem. Firstly, every woman who is pregnant, but who does not want to give birth, should be allowed by law to have an abortion. Secondly, governments must educate people to limit the size of the family. In China, couples are penalised financially if they have more than one child. This may seem cruel, but the \"one-child policy\" is beginning to have an effect in the world's most populous nation. Eventually, similar policies might also be necessary in other crowded nations such as India, for example.","To sum up, if the population explosion continues, many more people will die of starvation in poor countries, and life in the cities, even in affluent nations, will become increasingly difficult."],"id":76,"t":"problem","c":5},{"n":78,"topic":"SOCIAL","q":"The position of women in society has changed markedly in the last twenty years. Many of the problems young people now experience, such as juvenile delinquency, arise from the fact that many married women now work and are not at home to care for their children. To what extent do you agree or disagree with this opinion?","p":["It is certainly true that the position of women in society has undergone a dramatic change in the past twenty years but I do not feel that this is a direct cause of the indisputable increase in juvenile-related problems during this period.","It is now accepted that young women should find work on leaving school; indeed to rely totally on their parents' financial support is no longer an option in many families. Likewise, once they get married, the majority of women continue working since the financial pressures of setting up a house and establishing a reasonable standard of living often require two incomes.","Twenty years ago it was common for women to give up work once they had children and devote their time to caring for their children. This is no longer the general rule and the provision of professionally-run child care facilities and day nurseries have removed much of the responsibility for child rearing that used to fall to mothers. However, these facilities come at a cost and often require two salaries coming into a family to be afforded.","I do not believe that the increase in the number of working mothers has resulted in children being brought up less well than previously. Indeed it could be argued that by giving mothers the opportunity to work and earn extra money children can be better provided for than previously. There is more money for luxuries and holidays and a more secure family life is possible. Of course there are limits as to the amount of time that ideally should be spent away from home and the ideal scenario would be for one of the parents (often the wife) to have a part-time job and thus be available for their children before and after school. It is important to establish the correct balance between family life and working life."],"id":77,"t":"opinion","c":4},{"n":79,"topic":"SOCIAL","q":"Causes and Effects Worksheet: The Rainforest","p":["by Julie Wallace, ADMC Rainforest destruction is now recognized as one of the greatest environmental tragedies of all time. By why are the rainforests disappearing so quickly ?","• In 1800, there were 2.9 billion hectares of tropical forest worldwide. There are 1.5 billion hectares of tropical forest remaining. • Almost 65% of Central America has been cleared to create pastureland for grazing cattle • Rainforest land cleared for pasture or farming degrades quickly and is usually abandoned. • At least 42 million acres of tropical forest are lost each year, approximately 100 acres/minute. • Between 1960-1990, 445 million hectares of tropical forest were cleared.","We lose 50 species every day - 2 species per hour - due to tropical deforestation."],"id":78,"t":"problem","c":3},{"n":80,"topic":"SOCIAL","q":"Why is fast-food so popular in the UAE? What are some of the implications for society?","p":["Fast-food and the UAE Past: In the past people in the UAE used to eat healthy, freshly prepared food with their families in the home. Present: Today however, many people, particularly young people, prefer to eat fast food such as hamburgers, fried chicken, shawarma, or pizza. TOPIC SENTENCE: There are many reasons why this change has occurred, but fast-food also has some serious effects on individuals and society.","Causes Topic Sentence: There are many reasons for the popularity of fast food. Cause 1: One of the main reasons is the change in lifestyle. Example 1a: Many people in the UAE are working long hours, shifts, or extended school days. They don’t have time to find ingredients or prepare good food. Example 1b: Women are now starting to work in the Emirates, and this can result in less time being available for preparing family meals. Cause 2: Another cause is the huge number of young, affluent people in the UAE. Example 2: The rapid development of the country has meant that young people, who comprise over 75% of the population, have money to spend. Cause 3: A third reason is advertising. Example 3: The UAE is a very modern, free-market country, with all forms of media such as the Internet and satellite television, and people like to try new products and different kinds of fast food.","Effects Topic Sentence: However, this change in diet can have some serious effects. Effect 1: One effect is on health. Example 1: Many individuals in the UAE are becoming obese. These people will be less productive and have conditions such as heart disease and diabetes. Effect 2: Another result of fast food is the loss of the family tradition of eating together. Example 2: Children and adults rarely eat together now, and thus get less opportunity to talk. Effect 3: A further effect is economic. Example 3a: Although fast food is not very expensive, it is more expensive than cooking properly for yourself. Example 3b: Many of the fast-food companies are franchisees of foreign corporations, so profits leave the country.","Conclusion: Summary: In conclusion, fast food, although it is convenient and a tasty addition to a diet, can have serious health and social effects. Future statement: People should learn to choose fast food carefully and remember the pleasure of eating good food in good company."],"id":79,"t":"two","c":4},{"n":81,"topic":"SOCIAL","q":"Without capital punishment (the death penalty) our lives are less secure and crimes of violence increase. Capital punishment in essential to control violence in society. To what extent do you agree or disagree with this opinion?","p":["Before talking about the essential role of death penalty, you have to think about the meaning, and the purpose, of any kind of punishment. If you consider that the purpose is to prevent the guilty from being nasty again, you can be seduced by an argumentation in favour of the suppression of capital punishment. But you have to think about another aspect of the problem: a punishment is also useful to impress people, to make them fear the law. In fact, let's take the example of a young misfit, which has grown in a violent atmosphere, influenced by older delinquents, etc ... He lives in the streets, he's got no aim but to survive. This is the kind of person who could possibly kill someone for money, or even for fun ... Why would he fear prison? Life would be easier for him there. In addition, in many cases, when you behave normally, you can benefit from penalty reductions. This young misfit needs to be impressed, he needs to know that the law is a frontier. When you cross it, you can lose your life. That is why capital punishment helps keeping a distance between robbery and murder. If you abolish it, you suppress the difference between these two types of crime, which are completely different.","But there is also a limit to define: even if death penalty is unavoidable, it would be a crime to apply it to inadequate cases. If there is no premeditation or past facts which can justify such a punishment, it is far too strict to apply death penalty. That is why the lawmakers have to establish precisely the context in which capital punishment car be pronounced. That is the price to pay to limit violence without using excessive violence.","Capital punishment is always associated with ignorance and intolerance. In fact, we must acknowledge that some people disagree with this kind of penalty but others are totally in favour. Portugal was the first European country to end this kind of penalty. Since the 19th century, tolerance and respect for life are important values. Moreover, we can affirm that all the Europe remains under the same codes. Maybe because of a religious view point, life respect is a typical value in the Old Catholic world.","Those who are in favour of capital punishment are particularly in radical countries. It is not surprising to watch some barbarian behaviours in Islamic countries like public stoning to death. The population is invited to participate on the trial and in the final sentence - death- itself. However, this is not just an image of third world countries. Actually, USA is where this kind of punishment has its higher rates. The state of Texas, in particular, is at the top, supporting this measure against crime, especially those related with serial killers and those involving children. In a society dominated by fear and government control, it is foreseen that this penalty will continue into a future next.","Maybe this is not a clear question. As we can see there are several values here and of course cultural behaviours. The roots of the question are religious, cultural, ethical and even geographical. The world is divided and the law systems show those divisions. The solutions, however can lead us to other questions concerning revenge and justice. It will be better to kill a person because of his crimes? Can we admit that life sentence could be a much better sentence? In fact, rehabilitation is the right way especially with an accurate psychological evaluation first. Some people are lost forever, and in my opinion some murderers and other perverted people will suffer more in jail. In this sense, capital punishment is a soft release.","This is a very good essay, you should do well in the Task 2 Writing Test."],"id":80,"t":"opinion","c":6},{"n":82,"topic":"FAMILY","q":"In some countries, marriages are arranged by the parents but in other cases, people choose their own marriage partner. Discuss both systems.","p":["The idea that a marriage should be arranged by the parents of the couple, or by other members-of the family, is quite acceptable to some societies, yet completely out of the question for others. It all depends on your cultural expectations.","In so-called western societies, it is very unusual for marriages to be arranged. Most young people would not welcome the idea that their parents have the right to choose their partner for life. They feel that arranged marriages deny them their fundamental right to choose, even if they make a bad decision.","However, if we are honest about it, we might acknowledge that some parents organise their children's lives in such a way that they are likely to meet and marry partners the parents approve o£ It could be said that this is, to some extent, similar to an arranged marriage. It is always better when families support the relationship and welcome the grandchildren.","People for whom arranged marriages are the cultural norm often argue that the likelihood of the marriage lasting is greater when it is set up in this manner. Parents can be assured that their children are joining a family of similar standing and cultural background, and this, in the long run, makes for a more stable society if your parents' marriage was arranged, and has worked well, then why should you question the custom?","The important thing to ensure is that people are never forced into a marriage which will make them unhappy or lead to an unequal relationship where one partner is exploited by the other. This applies in all societies and situations.","(269 words)"],"id":81,"t":"discuss","c":5},{"n":83,"topic":"FAMILY","q":"Many people believe that women make better parents than men and that this is why they have the greater role in raising children in most societies. Others claim that men are just as good as women at parenting. Write an essay expresing your point of view.","p":["The view that women are better parents than men has shown itself to be true throughout history. This is not to say that men are not of importance in child- rearing indeed, they are most necessary if children are to appreciate fully the roles of both sexes. But women have proven themselves superior parents as a result of their conditioning, their less aggressive natures and their generally better communication skills.","From the time they are little girls, females learn about nurturing. First with dolls and later perhaps with younger brothers and sisters, girls are given the role of carer. Girls see their mothers in the same roles and so it is natural that they identify this as a female activity. Boys, in contrast, learn competitive roles far removed from what it means to nurture. While boys may dream of adventures, girls' conditioning means they tend to see the future in terms of raising families.","Girls also appear to be less aggressive than boys. In adulthood, it is men, not women, who prove to be the aggressors in crime and in war. Obviously, in raising children, a more patient, gentle manner is preferable to a more aggressive one. Although there certainly exist gentle men and aggressive women, by and large, females are less likely to resort to violence in attempting to solve problems.","Finally, women tend to be better communicators than men. This is shown is intelligence tests, where females, on average, do better in verbal communication than males. Of course, communication is of utmost importance in rearing children, as children tend to learn from and adopt the communication styles of their parents.","Thus, while it is all very well to suggest a greater role for men in raising children, let us not forget that women are generally better suited to the parenting role."],"id":82,"t":"other","c":5},{"n":84,"topic":"FAMILY","q":"It is generally acknowledged that families are now not as close as they used to be. Give possible reasons and your recommendations.","p":["There is much discussion nowadays as to whether or not the relation-ship between family members is as close as before. Diverse contributing factors can be identified. In the following, I would like to present my point of view.","Great changes have taken place in family life along with the development of society. One of them is that the once-extended family tends to become smaller and smaller. Many children have to leave their parents at an early age to study or work elsewhere. As time passes, children become emotionally estranged from their parents.","Compared with the past, social competition is becoming increasingly fierce. People are urged to concentrate their efforts upon work, so that they can achieve success, or at least a good standard of living. As a result, they can’t afford to spend their leisure hours with their families. The importance of bonds of kinship is gradually fading from their minds.","In addition, the availability of various kinds of recreational facilities also diverts people from enjoying chats with the members of their families. Their free time is mostly occupied by watching TV, surfing the Internet or playing video games. They come to lose interest in communicating with the other members of their families.","In view of such alienation within families, urgent steps must be taken, in my opinion. For members of families who live away from one another, regular contact on the phone can bring them the care that they need. Family reunions on holidays or other important occasions can make a difference as well. For those living together, it is a good idea to take some time off work or recreation periods to spend more time with each other. In the final analysis, a close family relationship can surely be maintained as long as we realize the significant role it plays in our lives and attach importance to it."],"id":83,"t":"problem","c":5},{"n":85,"topic":"FAMILY","q":"\"Fatherhood ought to be emphasised as much as motherhood. The idea that women are solely responsible for deciding whether or not to have babies leads on to the idea that they are also responsible for bringing the children up.\" To what extent do you agree or disagree?","p":["believe that child-rearing should be the responsibility of both parents and that, whilst the roles within that partnership may be different, they are nevertheless equal in importance. In some societies, it has been made easier over the years for single parents to raise children on their own. However, this does not mean that the traditional family, with both parents providing emotional support and role-models for their children, is not the most satisfactory way of bringing up children.","Of crucial importance, in my opinion, is how we define 'responsible for bringing the children up'. At its simplest, it could mean giving the financial support necessary to provide a home, food and clothes and making sure the child is safe and receives an adequate education. This would be the basic definition.","There is, however, another possible way of defining that part of the quotation. That would say it is not just the fathers responsibility to provide the basics for his children, while his wife involves herself in the everyday activity of bringing them up. Rather, he should share those daily duties, spend as much time as his job allows with his children, play with them, read to them, help directly with their education, participate very fully in their lives and encourage them to share his.","It is this second, fuller, concept of 'fatherhood' that I am in favour of, although I also realise how difficult it is to achieve sometimes. The economic and employment situation in many countries means that jobs are getting more, not less, stressful, requiring long hours and perhaps long journeys to work as well. Therefore it may remain for many a desirable ideal rather than an achievable reality."],"id":84,"t":"opinion","c":4},{"n":86,"topic":"CULTURE","q":"Some people think that it is important to have a single language as an international official language. Others think that it will make it difficult to identify countries and cause a loss of culture. What are your opinions on this?","p":["With the advent of globalization, a common language to facilitate trade and communication seems inevitable. Some oppose the development of a single language on the grounds that it may lead to cultural erosion and a loss of local linguistic knowledge. Yet, I am of the opinion that it is possible to use an official international language and still retain one’s own language and culture.","Firstly, many countries already use an official language or languages. For example, in India there are two official languages: Hindi and English. In a country such as India where there are innumerable languages spoken, there is a need for official languages to ensure communication between different sections of the population and the different states. In China, where different dialects are spoken, Mandarin, the official language, enables people from different provinces to comprehend each other.","Secondly, in an age of rampant globalization there is no doubt that an international language is inevitability. How is an African businessman going to conduct business in China when there are such differences between languages? In this sense, not only is an international language inevitable, but also a necessity for trade, commerce and economic expansion in the 21st century.","The critics opposing the adoption of an international official language argue that it would lead to a loss of cultural identity. However, the use of an international official language doesn’t mean that local languages will die out. For example, English already functions as a kind of unofficial international language but this doesn’t mean that people solely converse in English or they neglect their own language. English is used in specific contexts (trade, business, etc) and native languages are used for everyday instruction.","In brief, as the world becomes smaller the need for an official international language seems unavoidable. English has already assumed this role although its status is unofficial. In my view, the use of either an official or unofficial international language is necessary to facilitate communication in a time of rapid globalization.","(330 words)"],"id":85,"t":"opinion","c":5},{"n":87,"topic":"CULTURE","q":"Describe a custom from your country that you would like people from other countries to adopt. Explain your choice, using specific reasons and examples.","p":["In our modern stressful world we often forget about our customs and traditions. However, I think that people should keep their traditions because they help to remember our forefathers and value the beautiful moments we have in our lives.","In my country we have a great custom called \"Maslenica\". It is a holiday, which is celebrated at the end of the winter. Many people gather on the biggest square of the city and see of the winter. They say to the winter good-bye and ask the spring to change the winter. They celebrate the beginning of the life when everything starts to grow.","People at this holiday bake pancakes and treat each other with them. Also, many people gathered on the square play different games. For example, the most well-known game \"pulling a rope\" subsists in that two teams pull a rope. The winner is the team, witch has a longer rope. Other people draw on the icy pole. People have fun at this holiday even if they just observe those games and do not participate.","In conclusion, I am sure that \"Maslenica\" would benefit many countries all over the world. People have the opportunity to relax, leave their troubles and worries behind and have fun. Also, this holiday helps people to find out more about each other, communicate and meet new people. In addition to those practical benefits, \"Maslenica\" helps people to slow down their life pace and enjoy the present moments that are irreplaceable and beautiful.(248 words)"],"id":86,"t":"problem","c":4},{"n":88,"topic":"CULTURE","q":"When people move to another country, some of them decide to follow the customs of the new country. Others prefer to keep their own customs. Compare these two choices. Which one do you prefer? Support your answer with specific details.","p":["People may choose to keep their old traditions from their native country or to accept new ones. Keeping the old customs will help one to overcome the cultural shock and the change of the environment. From the other side, accepting the new traditions will help one to adapt and make new friends with residents. In this essay I will give different reasons why people decide to follow the customs of the new country or to keep their own customs.","If one is from the country with strong and old traditions, I think it will be rather difficult for him to adapt to the new customs and moreover to reject his own. That is why some people from the same country try to live together and to create their own community where the old traditions are kept. They can not break the customs that were created by their ancestors. For example, some nations are restricted in certain kinds of food by their traditions. So, they do not go to the restaurants unless their traditional food is served there. Some nations according to their customs have to wear certain types of cloth because their religion tells them to do so.","From the other side, if one is from the country with traditions similar to ones of the new country it will be easy for him to adopt and to follow the customs of the new place. He will not feel much difference. Probably, the most difficult part of his relocation will be to accustom to the new climate.","I think that people of the new country are friendlier when they see that foreigner follows their customs. I belief that traditions of every country deserve respect, especially, when one lives there. In summary, I think that every country has its own beauty and if one wants to find out more about it he will love it.","(313 words)"],"id":87,"t":"discuss","c":4},{"n":89,"topic":"CULTURE","q":"Do you agree or disagree with the following statement? Modern technology is creating a single world culture. Use specific reasons and examples to support your opinion.","p":["Man, through the ages, has undergone many changes from the time when he depicted a herd of mammoths on the walls of the cave to these days when he can chart with someone on the other side of the globe. Modern technology is rapidly changing the world's living standards that results in creating a single world culture. New technologies including Internet, television, electronic media, means of transportation, etc has a great impact on creating a similar culture all around the globe. Bellow I will list my reasons to support my opinion.","First of all, Internet and e-mail have changed the way people communicate to each other. Internet brought many benefits. It is a new means of communication, a fast access to information and news. People communicate with each other, share their ideas, happiness and difficulties. We have a great opportunity to find out more about countries and their history.","Second of all, the modern means of transportation allows people to move from one place to another very quickly. A few centuries ago it was impossible to imagine waking up in one country and falling asleep in another.","Finally, as a result of all mentioned above the boundaries between countries, their traditions and customs are erased. Many people migrate during their lives. Some of them are looking for a better place to live, others want to get new experience and knowledge or just pleasure. So, many families are created between people from different countries. Traditions fuse and evolve into other ones or just vanish.","To sup up, modern technology has a great impact on the way people live now. It is creating a new single world culture where traditions and distances are no longer of that importance.","(286 words)"],"id":88,"t":"opinion","c":5},{"n":90,"topic":"DRUG","q":"Some businesses now say that no one can smoke cigarettes in any of their offices. Some governments have banned smoking in all public places. Do you agree or disagree? Give reasons.","p":["Most of the firms, organization and companies as well as Government make restrictions to smoke in work places and public amenities respectively. It has become fashionable in the world today to blame smoking. However, although I feel that smoking can be harmful, but I don’t think it should be forbidden completely. I would also argue that people should have the right whether they smoke or not.","Let me deal with the three positive sides of smoking. Firstly, smoking certainly helps many people to relax. For some, it even improves concentration. If someone is upset owing to debt or they have exam, like to smoke to reduce the pressure or tension. Most of the people like to smoke when they are relaxing with friends. Secondly, governments throughout the world make huge profits from taxes on cigarettes. The income obtained from taxes provide funds which are used for building school, hospital and public places such as parks, gardens, sports ground and foot paths. Thirdly, tobacco industry also employs tens of thousands of people all over the world, particularly in poorer countries like Zimbabwe or India. Without cigarettes, these people would have no jobs.","Despite these positive effects there are lots of negative effects of smoking too. Initially, smoking has been proven to be too dangerous for health. As one cigarette contain more then 4000 chemical substances, therefore, it causes for many injurious diseases like heart attacks, asthma, bronchitis, lung cancer and cough. According to the current report, in Britain about 3,500 people are killed each year in road accidents and 120,000 are killed by smoking. Furthermore, smoking costs government millions of dollars because of the large number of people who need treatment in hospitals for smoking-related problems. Moreover, there is also concern today about passive smoking. Recent research shows that non-smokers can suffer health problems if they spend long period of time among people who do smoke. In UK children whose parents are smoke are three times as likely to start smoking themselves _.","In short, I think the world would be a better place without cigarettes. However, the decision as to whether _ smoke or not should be for each individual to make. I suggest people should not smoke in a room or place where there are non smokers but surely they should be free to smoke elsewhere.","This a very good essay, you have made your arguments well and set the paragraphs out as required. However, take care with your use of definitive statements e.g. Without cigarettes, these people would have no jobs. Maybe they would gain employment in another industry, we cannot be sure. Over all, well done!"],"id":89,"t":"opinion","c":5},{"n":91,"topic":"DRUG","q":"Should the same laws which prohibit the sale and consumption of heroin be applied to tobacco?","p":["Recently, a hostile debate arouse when a few well reputable health organizations suggested the application of a similar act of heroin selling and usage prohibition _. In this assay, I will analyse why the adoption of such a law could be a breakthrough in our youngsters safety, according to my vision.","Firstly , tobacco does not differ much from heroin when it comes to the later addictive effect. Nicotin , the active ingredient in tobacco, exerts its effect by acting directly on smoker’s brain cells. Numerous experiments carried out by scientist on animals, specailly rats, proved that this toxic chemical does lead by time to dependency, just similar to the effect experienced with herion.","Secondly, restriction on cigerattes selling will surely show an instant decline in tobacco smoking. ” Having an easy access to cigarettes puts a tremendous pressure, specially on teenagers,to resist such a temptation” Dr.Hisham , head of Pschycology department at Alexandria Medical college , states firmly. “Giving the new generation the sense that the severity of smoking is equivilant to other lethal drugs usage woulod be a life saving step,they will thank us for() as they get older.” he continues.","To recapitulate, applying of a futuristic law as the suggested one will definetly have a positive impact ,not only on young people’s health but on our society as a whole.","Well done! This is a very good essay but take care of your spelling."],"id":90,"t":"opinion","c":4},{"n":92,"topic":"DRUG","q":"People in all modern societies use drugs, but today's youth are expertimenting with both legal and illegal drugs, and at an increasingly early age. Some sociologists claim that parents and other members of society often set a bad example. Discuss the causes and some effects of widespread drug use by young people in modern day society. Make any recommendations you feel are necessary to help fight youth drug abuse.","p":["Youth drug abuse is a serious problem nowadays in many cultures. Not only is illegal drug use on the rise, but children as young as 10 years old are experimenting with alcohol and tobacco. The reasons for this behaviour are unclear, but certain sociologists blame the examples set by their elders.","Parents who drink and smoke to excess are, in effect, telling their children that it is acceptable to abuse their bodies with drugs. Consequently, children may have a similar view towards illegal drugs, even if their parents are against their use. In addition, drug use shown on television and in films can only confuse children who are also taught at school that drug abuse is wrong.","The pressure on young people to perform well at school in order to compete for jobs is a possible cause of the problem. Many believe they cannot live up to their parents' expectations, and feel a sense of hopelessness. Also, the widespread availability of drugs means teenagers are faced with the temptation to experiment. Drugs are used as a means of expressing dissatisfaction with the pressures they face in society.","The effects of drug abuse are well known. Many young people's talents are wasted, and addiction to hard drugs can cost a user his or her life. Furthermore, those who drink and drive may be involved in fatal road accidents. The cost to society is great, and enormous amounts of money are spent on convicting drug dealers and on education programmes.","To conclude, I recommend that the only sensible way to solve this problem is to educate young people about the dangers of drug use, and to take steps to reduce the pressure of competition placed upon them."],"id":91,"t":"problem","c":5},{"n":93,"topic":"DRUG","q":"Drug abuse is becoming a problem in our society. What are the causes of this and what are some solutions?","p":["Drug abuse is rife in many countries. Billions of dollars are spent internationally preventing drug use, treating addicts, and fighting drug-related crime. Although drugs threaten many societies, their effects can also be combated successfully. This essay looks at some of the effects of drug use on society, and suggests some solutions to the problem.","Drug abuse causes multiple problems for countries and communities. The medical and psychological effects are very obvious. Addicts cannot function as normal members of society. They neglect or abuse their families, and eventually require expensive treatment or hospitalization. The second effect is on crime. Huge police resources are needed to fight smuggling and dealing. Criminal gangs and mafia underworlds develop with the money from drugs.","However, the menace of drugs can be fought. Education is the first battle. Children need to be told at home and in school about drugs. People need to be aware of the effects so that they can make avoid this problem. A second approach is to increase police manpower and powers to stop dealers and to enforce the law. However the main target should be the user. Families and counselors need to talk to children and people at risk. Parents need to look at their children and help them to Jobs are needed to give people a role in society.","In conclusion, although the problem of drugs may seem impossible to eliminate, there are concrete steps that can be taken to weaken the hold of drugs on society. The danger from drugs is too great to ignore.","256 words"],"id":92,"t":"problem","c":5},{"n":94,"topic":"DRUG","q":"Should Smoking be Banned?","p":["It has become fashionable in the world today to condemn smoking. However, although I feel that smoking can be harmful, I do not think it should be banned completely.","Let me deal first with the positive side of smoking. First, smoking undoubtedly helps many people to relax. For some, it even improves concentration. Many people like to smoke before exams or when they are relaxing with friends.","A further point is that governments throughout the world make huge profits from levying taxes on cigarettes. This provides funds which are used for building schools, hospitals and other public amenities.","The tobacco industry also employs tens of thousands of people throughout the world, particularly in poorer countries like Zimbabwe or India. Without cigarettes, these people would have no jobs.","I would also argue that people should have the right to choose whether they smoke or not. People should not smoke in a room where there are non-smokers but surely they should be free to smoke elsewhere.","The arguments against smoking are well known. Smoking has been shown to be dangerous to health. Heart disease, bronchitis and lung cancer have all been linked.","A further issue is that smoking costs governments millions of pounds because of the large number of people who need treatment in hospitals for smoking related problems.","There is also concern today about passive smoking. Recent research has shown that non-smokers can suffer health problems if they spend long periods of time among people who do smoke.","In general, I think the world would be a better place without cigarettes. However, the decision as to whether to smoke or not should be for each individual to make."],"id":93,"t":"opinion","c":9},{"n":95,"topic":"HEALTH","q":"Smokers can cause themselves serious health problems. The choice to smoke is made freely and with knowledge of dangers. Smokers should therefore expect to pay more for medical treatment than non- smokers.","p":["Everyone has the choice of being a smoker or not. The people who choose to smoke do so knowing there is a risk of causing harmful damage to themselves. However, I do not entirely agree that these people should have to pay more to receive all the medical treatment they need.","I think there are many situations in which a medical problem has nothing to do with whether a person smokes or not. In these cases, where an illness has no relation to smoking, then I believe that smokers should not be required to pay more than other people for their medical treatment. Most car accidents, for example, have no connection with smoking, and the people who are injured ought to have the same medical help, regardless of the cost. And what about the common flu - it does not seem justifiable to me that a smoker should have to pay more to see a doctor for an illness we can all contract.","On the other hand, I agree that a smoker should pay more than a non-smoker for the necessary treatment of any condition which has been caused by smoking. The principle that people should take responsibility for their own actions is a good one. Consequently, if a person chooses to smoke knowing that this habit can cause serious health problems, then there is no reason why the community or an insurance company should have to pay for medical treatment for an illness which could have been avoided. In many countries, cigarette packets have a clear warning that smoking can cause health problems and so no smoker can claim not to know the danger. Lung cancer is sometimes a fatal disease and the treatment is both lengthy and expensive, and it is unfair for the smoker to expect the hospital or the community to carry the cost. In fact, it could also be argued that those who smoke in public should be asked to pay extra because of the illness caused to passive smokers.","In conclusion, I feel that smokers should pay more in cases related to smoking, but for any other illness they should pay the same as anyone else."],"id":94,"t":"opinion","c":4},{"n":96,"topic":"HEALTH","q":"Should parents be obliged to immunise their children against childhood diseases? Or do individuals have the right to choose not to immunise their children?","p":["Some people argue that the state does not have the right to make parents immunise their children. However, I feel the question is not whether they should immunise but whether, as members of society, they have the right not to.","Preventative medicine has proved to be the most effective way of reducing the incidence of fatal childhood diseases. As a result of the widespread practice of immunising young children in our society, many lives have been saved and the diseases have been reduced to almost zero.","In previous centuries children died from ordinary illnesses such as influenza and tuberculosis and because few people had immunity, the diseases spread easily. Diseases such as dysentery were the result of poor hygiene but these have long been eradicated since the arrival of good sanitation and clean water. Nobody would suggest that we should reverse this good practice now because dysentery has been wiped out.","Serious diseases such as polio and smallpox have also been eradicated through national immunisation programmes. In consequence, children not immunised are far less at risk in this disease-free society than they would otherwise be. Parents choosing not to immunise are relying on the fact that the diseases have already been eradicated. If the number of parents choosing not to immunise increased, there would be a similar increase in the risk of the diseases returning.","Immunisation is not an issue like seatbelts which affects only the individual. A decision not to immunise will have widespread repercussions for the whole of society and for this reason, I do not believe that individuals have the right to stand aside. In my opinion immunisation should be obligatory.","* The issue of whether we should force parents to immunise their children against common diseases is, in my opinion, a social rather than a medical question. Since we are free to choose what we expose our bodies to in the way of food, drink, or religion for that matter, why should the question of medical 'treatment' be any different?","Medical researchers and governments are primarily interested in overall statistics and trends and in money-saving schemes which fail to take into consideration the individual's concerns and rights. While immunisation against diseases such as tetanus and whooping cough may be effective, little information is released about the harmful effects of vaccinations which can sometimes result in stunted growth or even death.","The body is designed to resist disease and to create its own natural immunity through contact with that disease. So when children are given artificial immunity, we create a vulnerable society which is entirely dependent on immunisation. In the event that mass immunisation programmes were to cease, the society as a whole would be more at risk than ever before.","In addition there is the issue of the rights of the individual. As members of a society, why should we be obliged to subject our children to this potentially harmful practice? Some people may also be against immunisation on religious grounds and their needs must also be considered.","For these reasons I feel strongly that immunisation programmes should not be obligatory and that the individual should have the right to choose whether or not to participate."],"id":95,"t":"opinion","c":10},{"n":97,"topic":"HEALTH","q":"\"Prevention is better than cure.\" Out of a country's health budget, a large proportion should be diverted from treatment to spending on health education and preventative measures. To what extent do you agree or disagree with this statement?","p":["Of course it goes without saying that prevention is better than cure. That is why, in recent years, there has been a growing body of opinion in favour of putting more resources into health education and preventive measures. The argument is that ignorance of, for example, basic hygiene or the dangers of an unhealthy diet or lifestyle needs to be combatted by special nationwide publicity campaigns, as well as longer-term health education.","Obviously,there is a strong human argument for catching any medical condition as early as possible. There is also an economic argument for doing so. Statistics demonstrate the cost-effectiveness of treating a condition in the early stages, rather than delaying until more expensive and prolonged treatment is necessary. Then there are social or economic costs, perhaps in terms of loss of earnings for the family concerned or unemployed benefit paid by the state.","So far so good, but the difficulties start when we try to define what the 'proportion' of the budget should be, particularly if the funds will be 'diverted from treatment'. Decisions on exactly how much of the total health budget should be spent in this way are not a matter for the non-specialist, but should be made on the basis of an accepted health service model.","This is the point at which real problems occur - the formulation of the model. How do we accurately measure which health education campaigns are effective in both medical an
