<style>
/* Layout: a calm study desk. Sage-grey ground, white "paper" sheets, one deep-teal accent, a yellow highlighter for answers. */
:root{
 --bg:#F3F6FB; --surface:#FFFFFF; --sheet:#FAFCFF; --ink:#1C2340; --muted:#5E6684; --line:#E2E7F2;
 --accent:#11808F; --accent-ink:#FFFFFF; --accent-soft:#DDF3F3; --sky:#E6F1FF; --sky-ink:#1F5FA8;
 --mark:#FFE58A; --mark-ink:#5B4300; --ok:#1FA971; --ok-soft:#DDF7EA; --bad:#E5533D; --bad-soft:#FFE6E1; --gold:#F2A900;
 --coral:#FF6F61; --sun:#FFB938; --mint:#2EC4A0; --skyc:#4D9CFF; --grape:#8C6CF0; --rose:#F25C9A;
 --hero1:#0D6E7D; --hero2:#1E9E9A; --hero3:#55C6A9;
 --shadow:rgba(28,35,64,.08);
 --ui:"Readex Pro","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
 --read:"Literata",Georgia,"Times New Roman",serif;
 --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#10162A; --surface:#182037; --sheet:#1B2440; --ink:#E9ECF7; --muted:#A3ABC6; --line:#2A3452;
 --accent:#4FD1C5; --accent-ink:#06201F; --accent-soft:#173A40; --sky:#182D4A; --sky-ink:#A9CBFF;
 --mark:#6B5612; --mark-ink:#FFE9A6; --ok:#4FD69A; --ok-soft:#14352A; --bad:#FF8A76; --bad-soft:#3F211D; --gold:#FFC94D;
 --coral:#FF8A7E; --sun:#FFC85C; --mint:#4FD8B6; --skyc:#73B2FF; --grape:#A994FF; --rose:#FF7DB2;
 --hero1:#0B4E5A; --hero2:#137A78; --hero3:#2E9C86;
 --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#10162A; --surface:#182037; --sheet:#1B2440; --ink:#E9ECF7; --muted:#A3ABC6; --line:#2A3452;
 --accent:#4FD1C5; --accent-ink:#06201F; --accent-soft:#173A40; --sky:#182D4A; --sky-ink:#A9CBFF;
 --mark:#6B5612; --mark-ink:#FFE9A6; --ok:#4FD69A; --ok-soft:#14352A; --bad:#FF8A76; --bad-soft:#3F211D; --gold:#FFC94D;
 --coral:#FF8A7E; --sun:#FFC85C; --mint:#4FD8B6; --skyc:#73B2FF; --grape:#A994FF; --rose:#FF7DB2;
 --hero1:#0B4E5A; --hero2:#137A78; --hero3:#2E9C86;
 --shadow:rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.7;margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
.en{direction:ltr;unicode-bidi:isolate;text-align:left}
.muted{color:var(--muted)}
.small{font-size:13.5px}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.5px}
.brand h1{font-size:19px;font-weight:600}
.brand p{font-size:12.5px;color:var(--muted)}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13.5px;white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px;align-self:flex-start;max-width:100%}
.tab{flex:0 0 auto;border:0;background:none;border-radius:999px;padding:7px 16px;font-size:14.5px;color:var(--muted)}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 4px 14px var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 16px;font-size:14.5px;font-weight:500}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:3px 9px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.icon-btn svg{width:15px;height:15px}
.btn svg{width:16px;height:16px;vertical-align:-3px;margin-inline-end:4px}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;background:var(--accent-soft);color:var(--ink)}

/* plan */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.hero .today h2{font-size:24px}
.today .meta{display:flex;gap:8px;flex-wrap:wrap}
.meter{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:6px}
.steps5{display:flex;gap:6px;flex-wrap:wrap}
.steps5 span{font-size:12.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps5 span.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.week{display:flex;flex-direction:column;gap:8px}
.week h3{font-size:15px;color:var(--muted);font-weight:500}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.dtile{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.dtile:hover{border-color:var(--accent)}
.dtile .n{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.dtile .t{font-family:var(--read);font-size:15px;direction:ltr;text-align:left;line-height:1.35;min-height:2.7em}
.dtile.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.star{color:var(--gold);font-size:15px}
/* day */
.dayhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.dayhead h2{font-family:var(--read);font-size:27px;font-weight:600;direction:ltr;text-align:left}
.stepbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.stepbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 13px;font-size:14px;display:flex;gap:7px;align-items:center}
.stepbtn .k{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:12px;font-variant-numeric:tabular-nums}
.stepbtn.done .k{background:var(--ok);color:#fff}
.stepbtn[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
/* words */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.wcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--sheet);display:flex;flex-direction:column;gap:6px;min-width:0}
.wcard .w{font-family:var(--read);font-size:19px;font-weight:600;direction:ltr;text-align:left}
.wcard .ar{font-size:16px;font-weight:500;color:var(--accent)}
.wcard .def,.wcard .ex{font-family:var(--read);font-size:14.5px;direction:ltr;text-align:left}
.wcard .ex{color:var(--muted);font-style:italic}
.wcard.known{border-color:var(--ok);background:var(--ok-soft)}
/* reader */
.reader{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px clamp(16px,4vw,40px);font-family:var(--read);direction:ltr;text-align:left;font-size:var(--fs,18px);line-height:1.8}
.reader h3{font-family:var(--read);font-size:1.35em;text-align:center;margin-bottom:6px}
.reader .intro{font-style:italic;color:var(--muted);text-align:center;margin-bottom:14px}
.para{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;margin-bottom:16px}
.para .lab{font-family:var(--ui);font-weight:700;color:var(--accent);font-size:15px;padding-top:4px}
.para .ptools{display:flex;gap:6px;margin-top:6px;font-family:var(--ui);direction:rtl;justify-content:flex-end}
.para .tr{font-family:var(--ui);direction:rtl;text-align:right;background:var(--sky);color:var(--ink);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:15px;line-height:1.8}
.foot{font-size:.8em;color:var(--muted)}
.w{cursor:pointer;border-radius:3px}
.w:hover{background:var(--accent-soft)}
.w.wl{border-bottom:2px solid var(--accent)}
.hl{background:var(--mark);color:var(--mark-ink);border-radius:3px;box-shadow:0 0 0 2px var(--mark)}
.fsz{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fsz button{border:0;background:var(--sheet);padding:3px 10px;font-size:13px}
/* test */
.testgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.testgrid .reader{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 30px);overflow:auto;font-size:16px}
.pane-switch{display:none}
.qgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.qhead{font-weight:600;font-size:15px}
.instr{font-family:var(--read);direction:ltr;text-align:left;font-size:14.5px;color:var(--muted);font-style:italic}
.hint{font-size:13.5px;background:var(--sky);color:var(--sky-ink);border-radius:10px;padding:8px 12px}
.optbox{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;background:var(--sheet)}
.optbox h5{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:500}
.optbox ol{list-style:none;margin:0;padding:0;direction:ltr;text-align:left;font-family:var(--read);font-size:14.5px;display:grid;gap:3px}
.optbox li b{display:inline-block;min-width:34px;color:var(--accent);font-family:var(--ui)}
.optbox.cols ol{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.qitem{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0}
.qn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--sheet)}
.qn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.qn.no{background:var(--bad);border-color:var(--bad);color:#fff}
.qt{font-family:var(--read);direction:ltr;text-align:left;font-size:15.5px}
.choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;direction:ltr}
.choice{border:1.5px solid var(--line);background:var(--sheet);border-radius:9px;padding:4px 11px;font-size:14px;text-align:left}
.choice.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choices.col{flex-direction:column;align-items:stretch}
.choices.col .choice{font-family:var(--read);font-size:14.5px}
.choice b{font-family:var(--ui);color:var(--accent);margin-right:6px}
.gapin{font:inherit;font-family:var(--ui);font-size:14.5px;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:1px 6px;width:9.5em;max-width:100%;color:var(--ink);direction:ltr}
.gapin.ok{border-color:var(--ok);background:var(--ok-soft)}
.gapin.no{border-color:var(--bad);background:var(--bad-soft)}
.gapsel{font:inherit;font-size:14px;border:1.5px solid var(--accent);border-radius:7px;background:var(--accent-soft);color:var(--ink);padding:1px 4px;max-width:100%}
.gnum{font-family:var(--ui);font-weight:700;font-size:12px;background:var(--ink);color:var(--surface);border-radius:5px;padding:0 5px;margin-right:4px}
.ctx{font-family:var(--read);direction:ltr;text-align:left;font-size:15.5px;line-height:2.1}
.ctitle{font-family:var(--read);font-weight:600;text-align:center;direction:ltr}
.flow{display:flex;flex-direction:column;align-items:center;gap:0}
.flow .box{border:1.5px solid var(--ink);border-radius:8px;padding:6px 12px;background:var(--sheet);max-width:560px;width:100%;text-align:center;font-family:var(--read);direction:ltr;font-size:15px;line-height:2}
.flow .arr{height:20px;width:2px;background:var(--ink);position:relative;margin-bottom:6px}
.flow .arr::after{content:"";position:absolute;bottom:-6px;left:-5px;border:6px solid transparent;border-top-color:var(--ink)}
.notes{display:flex;flex-direction:column;gap:4px;font-family:var(--read);direction:ltr;text-align:left;font-size:15px;line-height:2}
.tablewrap{overflow-x:auto}
table.qt2{border-collapse:collapse;direction:ltr;font-family:var(--read);font-size:14.5px;min-width:520px;width:100%}
table.qt2 th,table.qt2 td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left;line-height:2}
table.qt2 th{background:var(--accent-soft)}
.diagram{max-width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
.verdict{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;margin-top:6px}
.verdict .ans{font-family:var(--read);direction:ltr}
.expl{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.expl .src{font-family:var(--read);direction:ltr;text-align:left;font-size:14px}
.expl .k{font-weight:600;color:var(--accent);font-size:12.5px}
.ai{background:var(--sky);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.9}
.score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.score .big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.band{border:2px solid var(--accent);border-radius:12px;padding:4px 14px;text-align:center}
.band b{display:block;font-size:24px;line-height:1.2}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.sheetbar{display:flex;flex-wrap:wrap;gap:4px}
.sheetbar span{width:28px;height:28px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.sheetbar span.f{border-color:var(--accent);background:var(--accent-soft)}
.sheetbar span.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.sheetbar span.no{background:var(--bad);border-color:var(--bad);color:#fff}
/* games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.game{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:start;display:flex;flex-direction:column;gap:4px;min-width:0}
.game:hover{border-color:var(--accent)}
.game h4{font-size:15.5px}
.game p{font-size:13px;color:var(--muted);line-height:1.6}
.game .gb{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.game .best{color:var(--ok);font-weight:600}
.play{display:flex;flex-direction:column;gap:14px}
.prompt{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:16px}
.prompt .big{font-family:var(--read);font-size:26px;font-weight:600;direction:ltr;text-align:center}
.prompt .sent{font-family:var(--read);direction:ltr;text-align:left;font-size:17px;line-height:1.9}
.blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;text-align:center;min-width:0}
.opt.en{font-family:var(--read);direction:ltr}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-size:14.5px}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.flip{min-height:150px;display:grid;place-items:center;text-align:center;cursor:pointer}
.tiles{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.tile{border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;padding:4px 10px;font-family:var(--read);font-size:15.5px}
.tile:disabled{opacity:.3}
.slot{min-height:46px;border:1.5px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.order{display:flex;flex-direction:column;gap:6px}
.order button{text-align:left;direction:ltr;font-family:var(--read);font-size:14.5px;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 10px;display:flex;gap:8px}
.order button .o{font-family:var(--ui);min-width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px}
.order button.picked .o{background:var(--accent);color:var(--accent-ink)}
.input{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--sheet);color:var(--ink);width:100%}
.input.en{font-family:var(--read)}
.diff span{border-radius:4px;padding:0 2px}
.ldiff .miss{color:var(--bad);text-decoration:underline 3px;background:none}
.ldiff .okw{color:var(--ok)}
.diff .miss{background:var(--bad-soft);color:var(--bad)}
.diff .okw{background:var(--ok-soft)}
/* mastery */
.mbadge{display:flex;gap:12px;align-items:center}
.mbadge .medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;background:var(--accent-soft);color:var(--accent);border:2px solid var(--accent)}
.mbadge .medal.gold{background:var(--mark);color:var(--mark-ink);border-color:var(--gold)}
/* sheet popup */
.wsheet{position:fixed;inset:auto 0 0 0;z-index:30;display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.wsheet>div{width:100%;max-width:600px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px var(--shadow);padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px;max-height:75vh;overflow:auto}

/* strategy */
.strat{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}

 .hero{grid-template-columns:1fr}
 .testgrid{grid-template-columns:1fr}

 .testgrid[data-pane="p"] .qcol{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== v2: bright study-quest look ===== */
#main{display:flex;flex-direction:column;gap:18px;min-width:0}
.days{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1000px){.days{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
body{background:radial-gradient(900px 500px at 100% -10%,color-mix(in srgb,var(--sun) 18%,transparent),transparent 60%),radial-gradient(800px 500px at -10% 20%,color-mix(in srgb,var(--skyc) 14%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
.logo{background:linear-gradient(135deg,var(--coral),var(--sun));color:#fff;border-radius:14px;box-shadow:0 6px 14px color-mix(in srgb,var(--coral) 35%,transparent)}
.chip{border:0;box-shadow:0 3px 10px var(--shadow);font-weight:500}
.chip.c1{background:color-mix(in srgb,var(--coral) 16%,var(--surface))}
.chip.c2{background:color-mix(in srgb,var(--sun) 22%,var(--surface))}
.chip.c3{background:color-mix(in srgb,var(--grape) 16%,var(--surface))}
.tabs{border:0;box-shadow:0 4px 14px var(--shadow)}
.tab[aria-current="true"]{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff}
.card{border:0;box-shadow:0 8px 24px var(--shadow)}
.btn{border:0;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent);transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn.ghost{border:1.5px solid var(--accent);box-shadow:none}
.btn.sun{background:var(--sun);color:#2B1D00;box-shadow:0 6px 16px color-mix(in srgb,var(--sun) 45%,transparent);font-weight:700;font-size:16.5px;padding:12px 24px;border-radius:14px}
/* hero */
.hero2{position:relative;overflow:hidden;border-radius:26px;padding:28px clamp(18px,4vw,36px);color:#fff;background:linear-gradient(135deg,var(--hero1),var(--hero2) 55%,var(--hero3));box-shadow:0 18px 40px color-mix(in srgb,var(--hero1) 35%,transparent);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center}
.hero2 .bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.hero2 .eyebrow{color:var(--sun);letter-spacing:.8px}
.hero2 h2{font-size:clamp(24px,4vw,34px);font-weight:700}
.hero2 .ttl{font-family:var(--read);font-size:clamp(20px,3vw,26px);direction:ltr;text-align:right;opacity:.95}
.hero2 .sp{display:flex;gap:6px;flex-wrap:wrap}
.hero2 .sp span{font-size:13px;padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.14)}
.hero2 .sp span.done{background:var(--sun);color:#2B1D00;font-weight:600}
.ring{position:relative;width:150px;height:150px;flex:0 0 auto}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.2}
.ring .in b{font-size:34px;display:block}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;background:var(--surface);box-shadow:0 8px 20px var(--shadow)}
.stat .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.stat .ic svg{width:24px;height:24px}
.stat b{font-size:22px;display:block;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
/* journey */
.week{background:var(--surface);border-radius:22px;padding:16px;box-shadow:0 8px 22px var(--shadow);border-top:5px solid var(--wk)}
.week h3{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:16.5px;font-weight:600}
.week h3 .wn{width:30px;height:30px;border-radius:10px;background:var(--wk);color:#fff;display:grid;place-items:center;font-size:14px}
.week h3 small{color:var(--muted);font-weight:400;font-size:13px}
.dtile{border:0;background:color-mix(in srgb,var(--wk) 9%,var(--sheet));border-radius:16px;padding:12px;transition:transform .15s,box-shadow .15s}
.dtile:hover{transform:translateY(-3px);box-shadow:0 10px 20px var(--shadow)}
.dtile .num{width:38px;height:38px;border-radius:50%;background:var(--wk);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
.dtile.cur{box-shadow:0 0 0 3px var(--wk),0 10px 22px var(--shadow)}
.dtile.cur .num{animation:pulse 1.8s ease-in-out infinite}
.dtile.star{background:linear-gradient(135deg,color-mix(in srgb,var(--sun) 30%,var(--sheet)),var(--sheet))}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--wk) 50%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.dots i.on{background:var(--wk)}
/* day banner */
.banner{position:relative;overflow:hidden;border-radius:24px;padding:22px clamp(18px,4vw,30px);color:#fff;background:linear-gradient(135deg,var(--wk),color-mix(in srgb,var(--wk) 55%,var(--hero1)));box-shadow:0 14px 32px color-mix(in srgb,var(--wk) 35%,transparent);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.banner h2{font-family:var(--read);font-size:clamp(24px,4vw,32px);direction:ltr;text-align:left;font-weight:600}
.banner .eyebrow{color:#fff;opacity:.9}
.banner .icon-btn{background:rgba(255,255,255,.18);border:0;color:#fff}
.banner .bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.banner .medal{background:var(--sun);color:#2B1D00;border-color:#fff}
.bprog{min-width:180px;display:flex;flex-direction:column;gap:6px}
.bprog .meter{background:rgba(255,255,255,.25)}
.bprog .meter i{background:var(--sun)}
.stepbtn{border:0;background:var(--surface);box-shadow:0 4px 12px var(--shadow);border-radius:14px;padding:8px 14px}
.stepbtn .k{background:var(--sc);color:#fff}
.stepbtn[aria-current="true"]{background:var(--sc);color:#fff}
.stepbtn[aria-current="true"] .k{background:#fff;color:var(--sc)}
.stepbtn.done .k{background:var(--ok);color:#fff}
/* games */
.game{border:0;border-radius:18px;padding:14px;background:color-mix(in srgb,var(--gc) 11%,var(--surface));box-shadow:0 6px 16px var(--shadow);transition:transform .15s}
.game:hover{transform:translateY(-3px) rotate(-.4deg)}
.game .gi{width:42px;height:42px;border-radius:13px;background:var(--gc);color:#fff;display:grid;place-items:center;font-weight:700}
.game .gi svg{width:22px;height:22px}
.game .best{background:var(--ok);color:#fff;padding:1px 8px;border-radius:999px}
.play .meter i{background:linear-gradient(90deg,var(--mint),var(--skyc))}
.opt{border-radius:14px;border-width:2px;transition:transform .12s}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.wcard{border:0;border-radius:16px;background:var(--surface);box-shadow:0 6px 16px var(--shadow);border-top:4px solid var(--wc)}
.wcard.known{border-top-color:var(--ok)}
.wcard .ar{color:var(--wc)}
.qgroup{border:0;box-shadow:0 8px 22px var(--shadow);border-top:4px solid var(--accent)}
.reader{border:0;box-shadow:0 8px 22px var(--shadow)}
.strat .card{border-top:5px solid var(--sc)}
@media (max-width:860px){.hero2{grid-template-columns:1fr}.ring{justify-self:center}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---- IELTS academy additions ---- */

 No, I can’t."]}, {"h": "أسئلة WH", "t": "Where (وين), Why (ليش), What (وش), When (متى), Which (أي), Who (مين), How (كيف). الترتيب: WH + فعل مساعد + فاعل + فعل.", "en": ["Where did you go last night?", "When does Laila go to bed?"]}, {"h": "أسئلة How", "t": "How many (كم عدد)، How old (كم العمر)، How long (كم المدة)، How far (كم المسافة)، How tall (كم الطول)، How often (كم مرة).", "en": ["How long did you stay in Moscow? Two weeks.", "How often do you go shopping? Twice a week."]}], "ex": [{"k": "fill", "q": "Choose.", "s": "[[Does]] Ahmed work in a school? Yes, he does.", "opts": ["Does", "Do", "Is", "Did"], "why": "Ahmed مفرد مضارع → Does."}, {"k": "fill", "q": "Choose.", "s": "Were you at home when I came? Yes, we [[were]].", "opts": ["were", "was", "did", "are"], "why": "نجاوب بنفس الفعل."}, {"k": "fill", "q": "Choose.", "s": "Will you go to Muscat tomorrow? No, I [[won’t]].", "opts": ["won’t", "don’t", "didn’t", "can’t"], "why": "Will → won’t."}, {"k": "choose", "q": "Answer: \"By bus.\" Question?", "opts": ["How do you come to school?", "Where do you come to school?", "What do you come to school?"], "a": 0, "why": "How = الطريقة."}, {"k": "choose", "q": "Answer: \"60 kms.\" Question?", "opts": ["How far is your town from the capital city?", "How long is your town?", "How many is your town?"], "a": 0, "why": "How far = المسافة."}, {"k": "choose", "q": "Answer: \"Twice a week.\" Question?", "opts": ["How often do you go shopping?", "How many do you go shopping?", "When often do you go shopping?"], "a": 0, "why": "How often = كم مرة."}, {"k": "order", "q": "Put the words in order.", "items": ["Where", "did", "you", "go", "last night?"], "why": "WH + did + you + go."}], "bank": ["qw"], "samples": [5], "types": [], "phase": 1, "graph": false}, {"key": "g5", "title": "Present Simple", "ar": "المضارع البسيط", "color": "--coral", "icon": "sun", "pages": "26–32", "cards": [{"h": "متى نستخدمه؟", "t": "١) الروتين والعادات: My mother cooks every day. ٢) الحقائق العامة: The sun rises in the east. ٣) المواقف الدائمة: She works in a school. ٤) الحالات مو الأفعال: This burger tastes delicious. ٥) الجداول: The train leaves at 4 pm. ٦) التعليق الرياضي وعناوين الأخبار.", "en": ["Water boils at 100 degrees Celsius.", "The film starts at 7:30.", "Police catch the criminal."]}, {"h": "s للمفرد", "t": "مع He / She / It نضيف s للفعل: He works. ومع الأفعال المنتهية بـ o, ch, sh, ss, z نضيف es: go → goes، teach → teaches، wash → washes، miss → misses، buzz → buzzes.", "en": ["She washes the dishes after meals.", "The bee buzzes."]}, {"h": "النفي والسؤال", "t": "النفي: don’t / doesn’t + مصدر (بدون s). السؤال: Do / Does + فاعل + مصدر. الـ s تروح للفعل المساعد: He doesn’t work، Does he work?", "en": ["She doesn’t cook big meals.", "Does she like painting?", "Do they live in France?"]}, {"h": "دائم ولا مؤقت؟", "t": "المضارع البسيط للدائم: She works in a school. المستمر للمؤقت: She is working in a small shop this year. وأفعال الحالة (like, seem, taste) ما ناخذها ing.", "en": ["Ali lives in a big city. (permanently)", "Ali is living with his uncle. (temporarily)"]}], "ex": [{"k": "fill", "q": "Complete.", "s": "Ahmed [[cleans]] his room twice a week.", "opts": ["cleans", "clean", "cleaning", "is clean"], "why": "Ahmed مفرد → cleans."}, {"k": "fill", "q": "Complete.", "s": "Ahlam [[lives]] in Muscat.", "opts": ["lives", "live", "lived", "living"], "why": "مفرد → lives."}, {"k": "fill", "q": "Complete.", "s": "[[Does]] Saif play football?", "opts": ["Does", "Do", "Did", "Doesn’t"], "why": "Saif مفرد → Does."}, {"k": "fill", "q": "Complete.", "s": "Fahad doesn’t [[drive]] a car.", "opts": ["drive", "drives", "drove", "driven"], "why": "بعد doesn’t المصدر."}, {"k": "fill", "q": "Complete.", "s": "When [[do]] your parents go shopping?", "opts": ["do", "does", "did", "don’t"], "why": "parents جمع → do."}, {"k": "sort", "q": "Why present simple?", "cats": ["Routine", "General truth", "Schedule"], "items": [["She cleans the house twice a week.", 0], ["Tigers eat meat.", 1], ["The shop opens at 8 am.", 2], ["Earth goes around the sun.", 1], ["The bus arrives at 4 o’clock.", 2], ["She waters the plants four times a week.", 0]], "why": "روتين، حقيقة، جدول."}, {"k": "choose", "q": "Which is correct?", "opts": ["This house seems very suitable for us.", "This house is seeming very suitable for us."], "a": 0, "why": "seem فعل حالة."}], "bank": ["pres"], "samples": [6, 7], "types": [], "phase": 2, "graph": false}, {"key": "g6", "title": "Adverbs of Frequency", "ar": "ظروف التكرار", "color": "--sun", "icon": "clock", "pages": "13–15", "cards": [{"h": "كم مرة؟", "t": "always 100%، usually 90%، generally/normally 80%، often/frequently 70%، sometimes 50%، occasionally 30%، rarely/hardly ever 5%، never 0%. نستخدمها غالبًا مع المضارع البسيط.", "en": ["I never drink coffee at night.", "He always goes to the gym on Fridays."]}, {"h": "مكانها في الجملة", "t": "قبل الفعل العادي: He always goes. وبعد am/is/are: She is never happy at work. وبعد الأفعال المساعدة والناقصة: You should always clean the cut. I have never been to Australia.", "en": ["It is sometimes difficult to walk on ice.", "He can sometimes read long words."]}, {"h": "في أول الجملة", "t": "usually, normally, often, sometimes, frequently, occasionally تقدر تجي أول الجملة. أما always, rarely, hardly ever, never ما نحطها أول الجملة في الكلام العادي.", "en": ["Sometimes, she forgets our names.", "Usually, I do my homework at home."]}, {"h": "التكرار المحدد", "t": "once a week، twice a month، three times a day، every day، daily، weekly، monthly، annually، every four years. والسؤال: How often…?", "en": ["I brush my teeth twice a day.", "The World Cup is held every four years."]}], "ex": [{"k": "choose", "q": "Which is correct?", "opts": ["She is never happy at work.", "She never is happy at work.", "Never she is happy at work."], "a": 0, "why": "بعد is."}, {"k": "choose", "q": "Which is correct?", "opts": ["He always goes to the gym on Fridays.", "He goes always to the gym on Fridays.", "Always he goes to the gym on Fridays."], "a": 0, "why": "قبل الفعل العادي."}, {"k": "choose", "q": "Which is correct?", "opts": ["I have never been to Australia.", "I never have been to Australia.", "I have been never to Australia."], "a": 0, "why": "بعد have."}, {"k": "fill", "q": "Complete.", "s": "I brush my teeth [[twice]] a day.", "opts": ["twice", "two", "second", "double"], "why": "twice = مرتين."}, {"k": "fill", "q": "Complete.", "s": "We get an electricity bill [[monthly]].", "opts": ["monthly", "month", "months", "a month"], "why": "monthly = كل شهر."}, {"k": "choose", "q": "\"How often do you go shopping?\" Best answer:", "opts": ["Twice a week.", "For two weeks.", "Last week."], "a": 0, "why": "How often → عدد المرات."}, {"k": "order", "q": "From most often to least often.", "items": ["always", "usually", "sometimes", "rarely", "never"], "why": "100% ← 0%."}], "bank": ["freq"], "samples": [8], "types": [], "phase": 2, "graph": false}, {"key": "g7", "title": "Present Continuous", "ar": "المضارع المستمر", "color": "--skyc", "icon": "play", "pages": "33–38", "cards": [{"h": "الحين!", "t": "am / is / are + فعل ing: لحدث يصير وقت الكلام: The dog is swimming now. My mother is cooking the lunch now. كلمات تساعدك: now, at the moment.", "en": ["The sheep are grazing in the field at the moment.", "My friends are playing football now."]}, {"h": "مؤقت", "t": "لحدث مؤقت مو دائم: Laila is staying with her cousins this week. They are working for this company this year.", "en": ["Linda is studying English in the UK this summer."]}, {"h": "خطط مرتّبة للمستقبل", "t": "لخطة قررناها ورتبناها: We are travelling to France next Monday (= We are going to travel…).", "en": ["I am cooking fish for the lunch."]}, {"h": "تغيّر مستمر وتكرار مزعج", "t": "للتغيّر: The price of oil is decreasing. Global warming is increasing. ولتصرّف يتكرر ويزعج مع always / constantly: The teacher is always complaining about my handwriting.", "en": ["You are getting fatter.", "They are constantly visiting their parents."]}, {"h": "النفي والسؤال", "t": "النفي: isn’t / aren’t / am not + ing. السؤال: Is / Are / Am + فاعل + ing؟", "en": ["He isn’t eating his dinner now.", "Are they cooking the lunch now?"]}], "ex": [{"k": "fill", "q": "Complete.", "s": "Ahmed is [[cleaning]] his room now.", "opts": ["cleaning", "clean", "cleans", "cleaned"], "why": "is + ing."}, {"k": "fill", "q": "Complete.", "s": "I [[am]] driving to work at the moment.", "opts": ["am", "is", "are", "be"], "why": "I → am."}, {"k": "fill", "q": "Complete.", "s": "[[Are]] you visiting your uncle tomorrow?", "opts": ["Are", "Is", "Do", "Am"], "why": "you → Are."}, {"k": "fill", "q": "Complete.", "s": "Fahad [[isn’t]] cleaning his room now.", "opts": ["isn’t", "aren’t", "doesn’t", "not"], "why": "He → isn’t."}, {"k": "sort", "q": "Why present continuous?", "cats": ["Happening now", "Temporary", "Future plan", "Changing"], "items": [["The dog is swimming now.", 0], ["Laila is staying with her cousins this week.", 1], ["We are travelling to France next Monday.", 2], ["The price of oil is decreasing.", 3]], "why": "أربع استخدامات."}, {"k": "choose", "q": "Which is correct?", "opts": ["She works in a school. (permanently)", "She is working in a school forever."], "a": 0, "why": "الدائم بالبسيط."}, {"k": "choose", "q": "Which is correct?", "opts": ["The number of cars is increasing every year.", "The number of cars are increase every year."], "a": 0, "why": "The number → is + ing."}], "bank": ["cont"], "samples": [9], "types": [], "phase": 2, "graph": false}, {"key": "g8", "title": "Past Simple", "ar": "الماضي البسيط", "color": "--rose", "icon": "calendar", "pages": "47–52, 59–60", "cards": [{"h": "حدث خلص في الماضي", "t": "نستخدمه لأحداث صارت وخلصت في الماضي: Dinosaurs lived on the earth millions of years ago. Last weekend my family and I went on a picnic.", "en": ["We left home at 7 o’clock in the morning.", "My father cooked the lunch."]}, {"h": "منتظم وشاذ", "t": "المنتظم + ed: played, cleaned, visited. الشاذ له شكل خاص: went, ate, swam, saw, bought, made, drank, caught.", "en": ["They went shopping last week.", "I drank milk yesterday."]}, {"h": "النفي والسؤال بـ did", "t": "النفي: didn’t + مصدر. السؤال: Did + فاعل + مصدر. الفعل يرجع مصدر لأن did حملت الماضي.", "en": ["He didn’t watch a horror film last night.", "Did she play volleyball last Friday?"]}, {"h": "was / were و had", "t": "حالات في الماضي: Ali was short last year. We were free yesterday. والملكية: Ali had a phone last year, but he didn’t have a bike.", "en": ["I was sick last night.", "My parents were at the zoo yesterday."]}, {"h": "كلمات الماضي", "t": "yesterday، last night / week / year، ago، in 2009، when I was a child.", "en": ["We travelled to the UK in 2009."]}], "ex": [{"k": "fill", "q": "Complete.", "s": "Yesterday, I [[went]] to the funfair.", "opts": ["went", "go", "gone", "going"], "why": "yesterday → went."}, {"k": "fill", "q": "Complete.", "s": "I didn’t [[visit]] my uncle last Friday.", "opts": ["visit", "visited", "visits", "visiting"], "why": "didn’t + مصدر."}, {"k": "fill", "q": "Complete.", "s": "Last Sunday, Ahmed [[saw]] a snake under his bed.", "opts": ["saw", "see", "seen", "sees"], "why": "see → saw."}, {"k": "fill", "q": "Complete.", "s": "Did she [[clean]] her room this morning?", "opts": ["clean", "cleaned", "cleaning", "cleans"], "why": "Did + مصدر."}, {"k": "fill", "q": "Complete.", "s": "Where did you [[meet]] the tourist yesterday?", "opts": ["meet", "met", "meeting", "meets"], "why": "did + مصدر."}, {"k": "choose", "q": "Which is correct?", "opts": ["Shamsa didn’t go to the zoo yesterday.", "Shamsa doesn’t went to the zoo yesterday.", "Shamsa didn’t went to the zoo yesterday."], "a": 0, "why": "didn’t + go."}, {"k": "choose", "q": "Which is correct?", "opts": ["Did you water the plants last night?", "Do you watered the plants last night?", "Did you watered the plants last night?"], "a": 0, "why": "Did + water."}, {"k": "sort", "q": "Present or past?", "cats": ["Present simple", "Past simple"], "items": [["Ali eats pizza twice a week.", 0], ["Ali ate pizza last week.", 1], ["Kate plays tennis at weekends.", 0], ["Kate played tennis last month.", 1], ["We make coffee every day.", 0], ["We made tea yesterday.", 1]], "why": "كلمات الزمن تساعدك."}], "bank": ["irr", "past"], "samples": [10, 11], "types": [], "phase": 3, "graph": false}, {"key": "g9", "title": "Used to", "ar": "used to للعادات القديمة", "color": "--grape", "icon": "history", "pages": "53–55", "cards": [{"h": "عادة في الماضي ما عادت", "t": "used to + مصدر = كنت أسوي شي بالماضي وخلاص ما أسويه الحين: I used to play with dolls when I was young.", "en": ["There used to be more wildlife in Oman.", "I used to live in a small village, but now I live in a big city."]}, {"h": "النفي والسؤال", "t": "النفي والسؤال: didn’t use to / Did … use to (بدون d لأن did حملت الماضي).", "en": ["People didn’t use to live in cement houses in Oman a hundred years ago.", "Did you use to drive tractors 10 years ago?", "What did you use to eat 50 years ago?"]}, {"h": "never used to", "t": "مع never نخلي used: My father never used to ride bikes when he was young.", "en": ["In the past, people never used to eat out."]}, {"h": "الماضي والحاضر", "t": "Years ago, people used oil lamps. Now, people use electric lights. نقارن الماضي بـ used to أو الماضي البسيط، والحاضر بالمضارع البسيط.", "en": ["Years ago, people washed their clothes by hand.", "Now, people wash their clothes in washing machines."]}], "ex": [{"k": "fill", "q": "Complete.", "s": "Omani people [[used]] to travel on camels and donkeys.", "opts": ["used", "use", "using", "uses"], "why": "إثبات → used to."}, {"k": "fill", "q": "Complete.", "s": "My grandparents didn’t [[use]] to go to schools.", "opts": ["use", "used", "using", "uses"], "why": "didn’t use to."}, {"k": "fill", "q": "Complete.", "s": "I used to [[play]] with toys when I was a child.", "opts": ["play", "played", "playing", "plays"], "why": "used to + مصدر."}, {"k": "fill", "q": "Complete.", "s": "Ancient Egyptians didn’t use to [[travel]] by planes.", "opts": ["travel", "travelled", "travelling", "travels"], "why": "use to + مصدر."}, {"k": "choose", "q": "Which is correct?", "opts": ["I didn’t use to wash clothes by hand.", "I didn’t used to wash clothes by hand.", "I don’t used to wash clothes by hand."], "a": 0, "why": "didn’t use to."}, {"k": "choose", "q": "Which is correct?", "opts": ["Where did you use to sleep in summer?", "Where did you used to sleep in summer?", "Where you used to sleep in summer?"], "a": 0, "why": "did … use to."}], "bank": ["past"], "samples": [12], "types": [], "phase": 3, "graph": false}, {"key": "g10", "title": "Past Continuous", "ar": "الماضي المستمر", "color": "--coral", "icon": "film", "pages": "62–66", "cards": [{"h": "حدث مستمر في الماضي", "t": "was / were + ing: لحدث كان مستمر في وقت معين في الماضي: It was raining. The wind was blowing.", "en": ["She was wearing a blue dress at the party."]}, {"h": "الحدث الطويل والقصير", "t": "الحدث الطويل بالماضي المستمر، والحدث القصير المفاجئ اللي قاطعه بالماضي البسيط: I was driving to my village when I saw Salim.", "en": ["She was cooking dinner when I arrived.", "While Ali was sleeping, someone stole his car."]}, {"h": "when و while", "t": "while + الحدث الطويل (مستمر)، when + الحدث القصير (بسيط) غالبًا. While I was peeling an apple, I cut my finger. Tim was skiing when he broke his leg.", "en": ["While I was swimming in the sea, a shark attacked me."]}, {"h": "النفي والسؤال", "t": "wasn’t / weren’t + ing. السؤال: Was / Were + فاعل + ing؟", "en": ["She wasn’t cooking the lunch when I arrived.", "Were they running to the school when I arrived?"]}], "ex": [{"k": "fill", "q": "Complete.", "s": "While I was [[cooking]] the lunch, my friend called me.", "opts": ["cooking", "cook", "cooked", "cooks"], "why": "was + ing."}, {"k": "fill", "q": "Complete.", "s": "I was walking on the beach when I [[saw]] a turtle.", "opts": ["saw", "was seeing", "see", "seen"], "why": "الحدث القصير بالبسيط."}, {"k": "fill", "q": "Complete.", "s": "My sister was [[wearing]] a red dress at the party.", "opts": ["wearing", "wear", "wore", "worn"], "why": "was + ing."}, {"k": "fill", "q": "Complete.", "s": "Ali was having a shower when the tank [[ran]] out of water.", "opts": ["ran", "run", "was running", "runs"], "why": "قصير → ran."}, {"k": "choose", "q": "Which is correct?", "opts": ["While I was cleaning my room, my mother called me.", "While I were clean my room, my mother call me."], "a": 0, "why": "I was cleaning … called."}, {"k": "choose", "q": "Which is correct?", "opts": ["The wind was blowing hard last night.", "The wind is blowing hard last night."], "a": 0, "why": "last night → was blowing."}, {"k": "sort", "q": "Long or short action?", "cats": ["Long (was/were + ing)", "Short (past simple)"], "items": [["was fishing", 0], ["caught a big fish", 1], ["were talking", 0], ["arrived", 1], ["was digging a hole", 0], ["found an old box", 1]], "why": "الطويل يقاطعه القصير."}], "bank": ["pcont"], "samples": [13], "types": [], "phase": 3, "graph": false}, {"key": "g11", "title": "Present Perfect", "ar": "المضارع التام", "color": "--mint", "icon": "link", "pages": "39–46", "cards": [{"h": "have / has + التصريف الثالث", "t": "للربط بين الماضي والحاضر: I have lived in this house since my childhood. ولتجارب الحياة: I have been to Germany many times. ولحدث في الماضي أثره الحين: She has lost her car key (ما عندها مفتاح الحين).", "en": ["It has rained a lot this week.", "Salim has broken his leg."]}, {"h": "ever و تجارب الحياة", "t": "Have you ever…? = هل سبق لك…؟ Have you ever ridden an elephant? Have you ever swum in a lake?", "en": ["Have you ever been to Australia?"]}, {"h": "وقت منتهي ولا غير منتهي؟", "t": "وقت منتهي (yesterday, last Monday, at 7 o’clock, in 2009) → ماضي بسيط. وقت غير منتهي (this week, this year, ever, just, already) → مضارع تام. فما نقول: I have played the piano five years ago ✗.", "en": ["Hilal lost his book last Monday.", "Hilal has lost his book this week."]}, {"h": "just / already / still / yet", "t": "just و already للأشياء اللي خلصت، ومكانهم بين have والفعل: I have just drunk tea. still و yet للي ما صار للحين: still قبل haven’t، و yet في آخر الجملة: I still haven’t drunk my tea. She hasn’t cleaned her room yet. Has he arrived yet?", "en": ["She has already cleaned her room.", "They haven’t arrived home yet."]}, {"h": "has gone ولا has been؟", "t": "He has been to Paris = راح ورجع. He has gone to Paris = راح وهو هناك الحين.", "en": ["He has gone to Paris. He is still there now."]}], "ex": [{"k": "fill", "q": "Complete.", "s": "Have you ever [[eaten]] a snake?", "opts": ["eaten", "ate", "eat", "eating"], "why": "have + eaten."}, {"k": "fill", "q": "Complete.", "s": "I have [[been]] to the USA many times.", "opts": ["been", "be", "went", "being"], "why": "have been to."}, {"k": "fill", "q": "Complete.", "s": "My sister [[still]] hasn’t made the tea.", "opts": ["still", "already", "yet", "just"], "why": "still قبل haven’t."}, {"k": "fill", "q": "Complete.", "s": "Have you ever [[driven]] a tractor?", "opts": ["driven", "drove", "drive", "driving"], "why": "التصريف الثالث."}, {"k": "fill", "q": "Complete.", "s": "I have [[just]] eaten my breakfast.", "opts": ["just", "yet", "still", "now"], "why": "just بين have والفعل."}, {"k": "fill", "q": "Complete.", "s": "My mother has [[gone]] shopping.", "opts": ["gone", "goes", "went", "going"], "why": "has gone."}, {"k": "choose", "q": "Which is correct?", "opts": ["I played the piano five years ago.", "I have played the piano five years ago."], "a": 0, "why": "ago وقت منتهي → ماضي بسيط."}, {"k": "sort", "q": "Past simple or present perfect?", "cats": ["Past simple", "Present perfect"], "items": [["I ate my breakfast at 7 o’clock.", 0], ["I have just eaten my breakfast.", 1], ["When did you visit China?", 0], ["Have you ever visited China?", 1], ["I visited Salalah last August.", 0], ["I have visited Salalah this year.", 1]], "why": "منتهي → بسيط، غير منتهي → تام."}], "bank": ["irr", "perf"], "samples": [14, 15], "types": [], "phase": 4, "graph": false}, {"key": "g12", "title": "Present Perfect Continuous", "ar": "المضارع التام المستمر", "color": "--skyc", "icon": "hourglass", "pages": "72–74", "cards": [{"h": "has / have been + ing", "t": "لحدث بدأ في الماضي ولسا مستمر: It has been raining for two days. She has been waiting at the bus stop for half an hour.", "en": ["I have been writing this essay for a week."]}, {"h": "أثره واضح الحين", "t": "لحدث كان مستمر وأثره باين الحين (تعب، ضغط): They have been preparing a big meal all day.", "en": ["I have been studying for 3 hours."]}, {"h": "for ولا since؟", "t": "for + مدة: for 5 days, for many years, for 3 hours, for a long time. since + بداية: since my birthday, since 2005, since 4 o’clock, since April, since morning.", "en": ["She has been studying for 6 hours.", "I have been cleaning my room since 4 o’clock."]}, {"h": "النفي والسؤال", "t": "hasn’t / haven’t been + ing. السؤال: Has / Have + فاعل + been + ing؟", "en": ["He hasn’t been fishing since the afternoon.", "Has she been waiting since 3 o’clock?"]}], "ex": [{"k": "fill", "q": "Complete.", "s": "She has been [[studying]] for 6 hours.", "opts": ["studying", "study", "studied", "studies"], "why": "been + ing."}, {"k": "fill", "q": "Complete.", "s": "Fahad [[has]] been playing football for a long time.", "opts": ["has", "have", "is", "had"], "why": "Fahad → has."}, {"k": "fill", "q": "Complete.", "s": "They have been walking [[for]] 3 hours.", "opts": ["for", "since", "from", "during"], "why": "مدة → for."}, {"k": "fill", "q": "Complete.", "s": "I have been cleaning my room [[since]] 4 o’clock.", "opts": ["since", "for", "from", "at"], "why": "بداية → since."}, {"k": "sort", "q": "for or since?", "cats": ["for", "since"], "items": [["5 days", 0], ["my birthday", 1], ["many years", 0], ["2005", 1], ["a long time", 0], ["April", 1], ["3 hours", 0], ["4 o’clock", 1]], "why": "مدة أو بداية."}, {"k": "choose", "q": "Which is correct?", "opts": ["I have been running for two hours.", "I has been run since two hours."], "a": 0, "why": "have been running for."}], "bank": ["ppc"], "samples": [16], "types": [], "phase": 4, "graph": false}, {"key": "g13", "title": "Past Perfect & Wish", "ar": "الماضي التام و wish", "color": "--rose", "icon": "rewind", "pages": "67–71", "cards": [{"h": "had + التصريف الثالث", "t": "لما يكون عندنا حدثين في الماضي: الحدث الأول (الأقدم) بالماضي التام، والثاني بالماضي البسيط: She had done her homework before she watched TV.", "en": ["When I arrived at the bus stop, the bus had left.", "Ali walked to work because his car had broken down."]}, {"h": "before و after", "t": "after + الحدث الأول: She cooked the lunch after she had washed the clothes. before + الحدث الثاني: I had brushed my teeth before I went to bed.", "en": ["Reem had had breakfast before she left home."]}, {"h": "الندم: wish / If only", "t": "للندم على شي صار في الماضي: I wish I had remembered my umbrella. If only I hadn’t forgotten the meeting.", "en": ["I wish I had studied hard for the final exams."]}, {"h": "في الكلام المنقول", "t": "The teacher said he had finished marking our exams. My mother asked me who had broken the glass.", "en": []}], "ex": [{"k": "fill", "q": "Complete.", "s": "The teacher had [[left]] the class before I arrived.", "opts": ["left", "leave", "leaves", "leaving"], "why": "had + left."}, {"k": "fill", "q": "Complete.", "s": "If only I hadn’t [[eaten]] junk food.", "opts": ["eaten", "ate", "eat", "eating"], "why": "hadn’t + eaten."}, {"k": "fill", "q": "Complete.", "s": "I wish I had [[studied]] hard for the final exams.", "opts": ["studied", "study", "studying", "studies"], "why": "had + studied."}, {"k": "fill", "q": "Complete.", "s": "The police asked me where I had [[seen]] the thief.", "opts": ["seen", "saw", "see", "seeing"], "why": "had + seen."}, {"k": "choose", "q": "Which happened first? \"When I arrived home, the snake had disappeared.\"", "opts": ["The snake disappeared.", "I arrived home."], "a": 0, "why": "had disappeared = الأول."}, {"k": "choose", "q": "Which is correct?", "opts": ["I wish I hadn’t forgotten my key.", "I wish I hadn’t forget my key."], "a": 0, "why": "hadn’t + forgotten."}, {"k": "choose", "q": "Which is correct?", "opts": ["Sara watched TV after she had done her homework.", "Sara watch TV after she had did her homework."], "a": 0, "why": "watched … had done."}], "bank": ["irr", "pperf"], "samples": [17], "types": [], "phase": 4, "graph": false}, {"key": "g14", "title": "Future: will & going to", "ar": "المستقبل: will و going to", "color": "--sun", "icon": "rocket", "pages": "75–78", "cards": [{"h": "will", "t": "١) قرار لحظة الكلام: I am hungry! I think I will buy a sandwich. ٢) توقع ورأي: I think fuel prices will go up next month. ٣) وعد وعرض: I promise I will come on time. I will lend you my bike.", "en": ["Okay, I will come with you.", "Maybe it won’t rain today."]}, {"h": "going to", "t": "١) خطة قررناها من قبل: Sara is going to travel to the UK next week. ٢) شي باين إنه بيصير (عندنا دليل): Look! That blind man is going to fall in the hole.", "en": ["I am going to buy a new car tomorrow.", "The weather is going to be very cold today."]}, {"h": "كيف تختارين؟", "t": "لو القرار توه الحين أو وعد → will. لو الخطة جاهزة ومرتّبة (حجزنا، قررنا) → going to أو المضارع المستمر.", "en": ["Laila has just booked the tickets. We are going to travel to Japan tomorrow."]}, {"h": "النفي", "t": "won’t (= will not)، و am / is / are not going to.", "en": ["I am not going to visit your company tomorrow."]}], "ex": [{"k": "fill", "q": "Complete.", "s": "Ahmed is [[travelling]] to the USA next Monday.", "opts": ["travelling", "travel", "travels", "travelled"], "why": "خطة مرتّبة → is travelling."}, {"k": "fill", "q": "Complete.", "s": "\"I have forgotten my money.\" \"I will [[lend]] you some.\"", "opts": ["lend", "lending", "lent", "lends"], "why": "will + مصدر."}, {"k": "fill", "q": "Complete.", "s": "I promise I will [[give]] you a call.", "opts": ["give", "giving", "gave", "gives"], "why": "وعد → will + give."}, {"k": "choose", "q": "\"What would you like to drink?\"", "opts": ["I think I will have some tea.", "I think I am going to have some tea."], "a": 0, "why": "قرار لحظي → will."}, {"k": "choose", "q": "\"I have already booked a room online.\"", "opts": ["I am going to stay in a hotel in Paris.", "I will stay in a hotel in Paris."], "a": 0, "why": "خطة جاهزة → going to."}, {"k": "choose", "q": "\"I feel thirsty.\"", "opts": ["I think I will buy some fresh orange juice.", "I am going to buy juice since last week."], "a": 0, "why": "قرار لحظي → will."}, {"k": "sort", "q": "will or going to?", "cats": ["will", "going to"], "items": [["A promise", 0], ["A plan decided before", 1], ["A decision now", 0], ["We can see it is about to happen", 1], ["An offer to help", 0]], "why": "استخدامات كل واحد."}], "bank": ["fut"], "samples": [18], "types": [], "phase": 4, "graph": false}, {"key": "g15", "title": "Modal Verbs", "ar": "الأفعال الناقصة", "color": "--grape", "icon": "key", "pages": "10–12", "cards": [{"h": "المعاني", "t": "can = قدرة أو إذن، could = طلب مؤدب، may = احتمال أو إذن، might = احتمال، would like = عرض مؤدب، should = نصيحة، must = لازم، mustn’t = ممنوع، have to = إلزام، don’t have to = مو لازم، shall we…? = اقتراح.", "en": ["Could you tell me the way to the bus station, please?", "This medicine may be suitable for your illness.", "Shall we go to the cinema?"]}, {"h": "should و must و have to", "t": "should للنصيحة: You should see a doctor. must للضروري والقوانين: Students must come to school on time. have to للإلزام: In Britain, you have to drive on the left.", "en": ["You shouldn’t waste your time on computer games.", "You mustn’t use your mobile phone in this place."]}, {"h": "انتبهي: mustn’t ≠ don’t have to", "t": "mustn’t = ممنوع: Students mustn’t copy from each other in exams. don’t have to = مو لازم (براحتك): I don’t have to see the doctor.", "en": ["You don’t need to buy this product if you feel that it is useless."]}, {"h": "دايم مصدر", "t": "بعد كل الأفعال الناقصة المصدر بدون to (إلا ought to, have to, need to): She can play the piano. You ought to do more exercise.", "en": ["My mother can play the guitar."]}], "ex": [{"k": "sort", "q": "What does it mean?", "cats": ["Advice", "Prohibition", "Obligation", "Polite request"], "items": [["You should see a doctor.", 0], ["You mustn’t park your car here.", 1], ["You have to leave the city immediately.", 2], ["Could you tell me the way, please?", 3]], "why": "المعاني الأساسية."}, {"k": "choose", "q": "\"You mustn’t use your phone while driving.\" means…", "opts": ["It is not allowed.", "It is not necessary.", "It is a suggestion."], "a": 0, "why": "mustn’t = ممنوع."}, {"k": "choose", "q": "\"I don’t have to see the doctor.\" means…", "opts": ["It is not necessary.", "It is not allowed.", "I can’t."], "a": 0, "why": "don’t have to = مو لازم."}, {"k": "fill", "q": "Complete.", "s": "I think you [[should]] see a doctor.", "opts": ["should", "mustn’t", "may", "shall"], "why": "نصيحة → should."}, {"k": "fill", "q": "Complete.", "s": "[[Would]] you like a cup of tea?", "opts": ["Would", "Shall", "Must", "Should"], "why": "عرض مؤدب."}, {"k": "fill", "q": "Complete.", "s": "When you travel abroad, you [[have]] to take your passport.", "opts": ["have", "must", "should", "need"], "why": "have to."}, {"k": "choose", "q": "Which is correct?", "opts": ["She can play the piano.", "She can plays the piano.", "She can to play the piano."], "a": 0, "why": "can + مصدر."}], "bank": ["modal"], "samples": [19], "types": [], "phase": 5, "graph": false}, {"key": "g16", "title": "Comparatives & Superlatives", "ar": "المقارنة والتفضيل", "color": "--coral", "icon": "chart", "pages": "16–21", "cards": [{"h": "الصفات القصيرة", "t": "المقارنة: صفة + er + than: The tiger is faster than the camel. التفضيل: the + صفة + est: Blue whales are the biggest animals in the world. التهجئة: big → bigger, hot → hotter، easy → easier، heavy → heavier، lazy → laziest.", "en": ["Elephants are bigger than goats.", "Bahla Fort is the oldest fort in Oman."]}, {"h": "الصفات الطويلة", "t": "more / less + صفة + than: Skiing is more dangerous than tennis. the most / the least + صفة: Mountaineering is the most dangerous sport in the world.", "en": ["Football is more popular than hockey.", "Swimming is the least interesting hobby for me."]}, {"h": "الشواذ", "t": "good → better → the best، bad → worse → the worst. ولا نجمع more مع er: more better ✗، more faster ✗.", "en": ["Yoghurt is better than cola."]}, {"h": "as … as", "t": "للتساوي: as + صفة + as: I am as tall as my father. والنفي: not as … as: Dogs are not as fast as tigers.", "en": ["Arabic is as important as English.", "Studying English is not as difficult as studying physics."]}], "ex": [{"k": "fill", "q": "Complete.", "s": "I was the [[best]] student in the class last year. (good)", "opts": ["best", "better", "goodest", "most good"], "why": "good → the best."}, {"k": "fill", "q": "Complete.", "s": "This tree is [[taller than]] the building. (tall)", "opts": ["taller than", "more tall than", "tallest", "the tallest"], "why": "tall → taller than."}, {"k": "fill", "q": "Complete.", "s": "Snakes are [[more dangerous than]] scorpions. (dangerous)", "opts": ["more dangerous than", "dangerouser than", "the most dangerous", "dangerous than"], "why": "طويلة → more … than."}, {"k": "fill", "q": "Complete.", "s": "Africa is [[drier than]] Europe. (dry)", "opts": ["drier than", "dryer than", "more dry", "driest"], "why": "y → ier."}, {"k": "choose", "q": "Which is correct?", "opts": ["I am taller than my father.", "I am tallest than my father.", "I am more taller than my father."], "a": 0, "why": "taller than."}, {"k": "choose", "q": "Which is correct?", "opts": ["Cheetahs are the fastest animals in the world.", "Cheetahs are the faster animals in the world."], "a": 0, "why": "in the world → the fastest."}, {"k": "choose", "q": "Which is correct?", "opts": ["Tigers are as fast as lions.", "Tigers are as faster as lions.", "Tigers are as fast than lions."], "a": 0, "why": "as fast as."}], "bank": ["adj"], "samples": [20, 21], "types": [], "phase": 5, "graph": false}, {"key": "g17", "title": "The Passive Voice", "ar": "المبني للمجهول", "color": "--mint", "icon": "box", "pages": "8, 56–58, 120", "cards": [{"h": "ليش المبني للمجهول؟", "t": "نركّز على الحدث والشي اللي صار له، مو على الشخص اللي سوّاه، أو لما ما نعرف مين سوّاه: Somebody took my pens → My pens were taken.", "en": ["Nizwa Fort was built by Sultan bin Saif.", "This snake was killed."]}, {"h": "التركيب", "t": "be + التصريف الثالث. المضارع: is / are + p.p. (Traditional food is prepared here). الماضي: was / were + p.p. (The window was broken yesterday). المستقبل: will be + p.p. (New bikes will be sold here next week).", "en": ["New computers are sold in this shop.", "Traditional food will be prepared here next week."]}, {"h": "من المعلوم للمجهول", "t": "١) المفعول يصير فاعل. ٢) نحط be بنفس زمن الجملة. ٣) الفعل تصريف ثالث. ٤) الفاعل الأصلي بعد by (إذا مهم): Graham Bell invented the telephone → The telephone was invented by Graham Bell.", "en": ["The cat ate my fish. → My fish was eaten by the cat."]}, {"h": "was ولا were؟", "t": "مفرد → was، جمع → were: Four chickens were cooked by my wife. The lunch was cooked yesterday.", "en": []}], "ex": [{"k": "fill", "q": "Complete.", "s": "The pyramids [[were]] built by the ancient Egyptians.", "opts": ["were", "was", "are", "is"], "why": "جمع ماضي → were."}, {"k": "fill", "q": "Complete.", "s": "The telephone was [[invented]] by Graham Bell.", "opts": ["invented", "invent", "inventing", "invents"], "why": "was + p.p."}, {"k": "fill", "q": "Complete.", "s": "My book was [[taken]].", "opts": ["taken", "took", "take", "taking"], "why": "take → taken."}, {"k": "fill", "q": "Complete.", "s": "New bikes will [[be]] sold in this shop next week.", "opts": ["be", "been", "are", "being"], "why": "will be + p.p."}, {"k": "choose", "q": "Passive of \"Laila cooked the lunch yesterday.\"", "opts": ["The lunch was cooked yesterday.", "The lunch cooked yesterday.", "The lunch is cooked yesterday."], "a": 0, "why": "was + cooked."}, {"k": "choose", "q": "Passive of \"A farmer grew tomatoes on my farm.\"", "opts": ["Tomatoes were grown on my farm.", "Tomatoes was grown on my farm.", "Tomatoes were grew on my farm."], "a": 0, "why": "were + grown."}, {"k": "sort", "q": "Active or passive?", "cats": ["Active", "Passive"], "items": [["Salim broke the window.", 0], ["The window was broken.", 1], ["My mother prepared the meal.", 0], ["The meal was prepared.", 1]], "why": "be + p.p. = مجهول."}], "bank": ["irr", "pas"], "samples": [22], "types": [], "phase": 5, "graph": false}, {"key": "g18", "title": "Conditionals", "ar": "الجمل الشرطية", "color": "--rose", "icon": "branch", "pages": "22–25", "cards": [{"h": "القواعد العامة", "t": "جملتين، وجملة if تقدر تجي أول أو ثاني. إذا جات أول نحط فاصلة بعدها. وعندنا ٤ أنواع.", "en": ["If I get sick, I go to the doctor.", "I go to the doctor if I get sick."]}, {"h": "الصفري Zero", "t": "للحقائق والعادات اللي دايم صحيحة: If + مضارع بسيط، مضارع بسيط: If you heat ice, it melts.", "en": ["If you eat healthy food, you become healthy and strong."]}, {"h": "الأول First", "t": "لشي ممكن يصير في المستقبل (احتمال كبير): If + مضارع بسيط، will + مصدر: If I see him tomorrow, I will talk to him.", "en": ["If we leave now, we will catch our plane."]}, {"h": "الثاني Second", "t": "لموقف خيالي أو احتمال ضعيف: If + ماضي بسيط، would + مصدر: If I had any time this week, I would clean my room. ومع be نقول were: If he were late again, I would not let him in.", "en": ["If you ate too much, you would feel lazy."]}, {"h": "الثالث Third", "t": "لماضي ما صار (احتمال صفر)، وللندم: If + ماضي تام، would have + p.p.: If we had looked at the weather report, we would have stayed at home.", "en": ["If you had come earlier, you would have had more time."]}], "ex": [{"k": "sort", "q": "Which conditional?", "cats": ["Zero", "First", "Second", "Third"], "items": [["If you heat ice, it melts.", 0], ["If it rains tomorrow, we will stay at home.", 1], ["If I won a million, I would travel the world.", 2], ["If I had seen him, I would have talked to him.", 3]], "why": "شوفي الأزمنة."}, {"k": "fill", "q": "Complete.", "s": "If you are late again, I [[will]] not let you in.", "opts": ["will", "would", "would have", "am"], "why": "First → will."}, {"k": "fill", "q": "Complete.", "s": "If I finished work earlier, I [[would]] go to the beach.", "opts": ["would", "will", "would have", "did"], "why": "Second → would."}, {"k": "fill", "q": "Complete.", "s": "If I had been sick, I would have [[gone]] to the doctor.", "opts": ["gone", "went", "go", "going"], "why": "would have + p.p."}, {"k": "fill", "q": "Complete.", "s": "If you [[heat]] ice, it melts.", "opts": ["heat", "heated", "will heat", "had heated"], "why": "Zero → مضارع."}, {"k": "fill", "q": "Complete.", "s": "If we [[leave]] now, we will catch our plane.", "opts": ["leave", "will leave", "left", "had left"], "why": "First → If + مضارع."}, {"k": "choose", "q": "Which is correct?", "opts": ["If I saw him tomorrow, I would talk to him.", "If I saw him tomorrow, I will talk to him."], "a": 0, "why": "Second → would."}], "bank": ["cond"], "samples": [23], "types": [], "phase": 5, "graph": false}, {"key": "g19", "title": "Reported Speech", "ar": "الكلام المنقول", "color": "--grape", "icon": "quote", "pages": "79–82", "cards": [{"h": "ننقل كلام غيرنا", "t": "\"I like my family,\" Ali said. → Ali said (that) he liked his family. نغيّر الضمائر (I → he, my → his) ونرجّع الزمن خطوة للماضي (Back shifting).", "en": ["He said, \"You are an excellent student.\" → He told me that I was an excellent student."]}, {"h": "إرجاع الأزمنة", "t": "مضارع بسيط → ماضي بسيط. مضارع مستمر → ماضي مستمر. مضارع تام → ماضي تام. ماضي بسيط → ماضي تام. will → would، can → could، may → might، must → had to. أما could, should, would, might تبقى نفسها.", "en": ["Laila said, \"I have broken my arm.\" → Laila said that she had broken her arm.", "\"You must pay the charges.\" → The manager said that I had to pay the charges."]}, {"h": "الأسئلة", "t": "أسئلة نعم/لا: asked if / whether + فاعل + فعل، بدون علامة سؤال وبدون قلب: \"Do you like coffee?\" → The waiter asked me if I liked coffee. أسئلة WH: نحط كلمة السؤال ثم الفاعل ثم الفعل: \"Where do you live?\" → She asked me where I lived. (تصحيح من المنصة: الصحيح asked where my homework was، مو where was my homework.)", "en": ["\"Can you swim?\" → He asked if I could swim.", "\"Who will come with you?\" → My mother asked me who would come with me."]}, {"h": "الأوامر", "t": "told + to + مصدر، والنهي told + not to: \"Stand up.\" → The teacher told me to stand up. \"Don’t smoke here.\" → He told me not to smoke there.", "en": ["\"Be quiet.\" → They told me to be quiet."]}, {"h": "كلمات تتغيّر", "t": "here → there، this → that، now → then، tomorrow → the next day، yesterday → the day before.", "en": []}], "ex": [{"k": "fill", "q": "Complete.", "s": "\"I like my family.\" → Ali said that he [[liked]] his family.", "opts": ["liked", "likes", "like", "has liked"], "why": "مضارع → ماضي."}, {"k": "fill", "q": "Complete.", "s": "\"I am staying here.\" → She told me that she [[was]] staying there.", "opts": ["was", "is", "were", "has"], "why": "am → was."}, {"k": "fill", "q": "Complete.", "s": "\"I will attend your wedding.\" → He told me he [[would]] attend my wedding.", "opts": ["would", "will", "can", "had"], "why": "will → would."}, {"k": "fill", "q": "Complete.", "s": "\"You can leave early.\" → He said that I [[could]] leave early.", "opts": ["could", "can", "would", "might"], "why": "can → could."}, {"k": "choose", "q": "\"Do you like coffee?\" The waiter asked me…", "opts": ["if I liked coffee.", "do I like coffee?", "if did I like coffee."], "a": 0, "why": "if + فاعل + فعل."}, {"k": "choose", "q": "\"Where do you live?\" She asked me…", "opts": ["where I are green Omani golden hunting bag.", "en": ["a beautiful old Omani silver dagger", "two valuable round gold rings"]}, {"h": "ظروف الطريقة (ly)", "t": "تجي قبل الفعل أو بعد المفعول، ولا تجي بين الفعل والمفعول: He drove his car carefully ✓، He carefully drove his car ✓، He drove carefully his car ✗. وإذا ما فيه مفعول تجي بعد الفعل: She cooked quickly in the kitchen.", "en": ["She talked to the doctor politely.", "I shut the door quickly."]}], "ex": [{"k": "fill", "q": "Complete.", "s": "The film was boring and the audience were [[bored]].", "opts": ["bored", "boring", "bore", "bores"], "why": "الناس → ed."}, {"k": "fill", "q": "Complete.", "s": "The snake was [[frightening]].", "opts": ["frightening", "frightened", "fright", "frighten"], "why": "الشي → ing."}, {"k": "fill", "q": "Complete.", "s": "I was very [[excited]] to see my favourite celebrity.", "opts": ["excited", "exciting", "excite", "excitement"], "why": "شعوري → excited."}, {"k": "choose", "q": "Which order is correct?", "opts": ["a beautiful old Omani silver dagger", "an Omani silver old beautiful dagger", "a silver beautiful Omani old dagger"], "a": 0, "why": "رأي ← عمر ← أصل ← مادة."}, {"k": "choose", "q": "Which order is correct?", "opts": ["a pretty classic red Italian car", "a red Italian pretty classic car", "an Italian red classic pretty car"], "a": 0, "why": "رأي ← عمر/نوع ← لون ← أصل."}, {"k": "choose", "q": "Which is correct?", "opts": ["They drove the car dangerously.", "They drove dangerously the car."], "a": 0, "why": "الظرف بعد المفعول."}, {"k": "sort", "q": "-ed or -ing?", "cats": ["Feeling (person)", "Cause (thing)"], "items": [["interested", 0], ["interesting", 1], ["tired", 0], ["tiring", 1], ["confused", 0], ["confusing", 1]], "why": "ed للشعور."}], "bank": ["edi", "adv"], "samples": [26], "types": [], "phase": 6, "graph": false}, {"key": "g22", "title": "Relative Clauses & Some/Any/No", "ar": "جمل الوصل و some / any / no", "color": "--coral", "icon": "puzzle", "pages": "92, 95, 102–10 function speakChain(list,done){let k=0;const next=()=>{if(k>=list.length||!speaking){speaking=false;done&&done();return}const u=new SpeechSynthesisUtterance(list[k++]);u.lang='en-GB';if(enV)u.voice=enV;u.rate=.9;u.onend=next;try{speechSynthesis.speak(u)}catch(e){}};try{speechSynthesis.cancel()}catch(e){}speaking=true;next()}

/* ---------- dictionary ---------- */
function lemmaOf(w){
 let k=w.toLowerCase().replace(/[’]/g,"'").replace(/^'+|'+$/g,'');
 k=k.replace(/'s$/,'');
 if(DICT.g[k])return k;
 if(DICT.f[k]&&DICT.g[DICT.f[k]])return DICT.f[k];
 const tries=[[/ies$/,'y'],[/ied$/,'y'],[/ing$/,''],[/ing$/,'e'],[/ed$/,''],[/ed$/,'e'],[/es$/,''],[/s$/,''],[/ly$/,''],[/er$/,''],[/est$/,'']];
 for(const [re,r] of tries){if(re.test(k)){const b=k.replace(re,r);if(DICT.g[b])return b;if(DICT.f[b]&&DICT.g[DICT.f[b]])return DICT.f[b]}}
 return null}
function glossOf(w){
 const k=lemmaOf(w);if(k)return {lem:k,ar:DICT.g[k]};
 const lw=w.toLowerCase();
 if(/-/.test(w)){const parts=w.split('-').map(x=>{const l=lemmaOf(x);return l?DICT.g[l].split(' / ')[0]:x});return {lem:lw,ar:parts.join(' + ')}}
 if(PROPER.has(lw)||/^[A-Z]/.test(w))return {lem:lw,ar:'اسم علم (شخص أو مكان أو جهة)'};
 return {lem:lw,ar:''}}
function tokHTML(text){
 return String(text==null?'':text).split(/([A-Za-z]+(?:[’'-][A-Za-z]+)*)/).map((p,i)=>i%2===0?esc(p):`<span class="w" data-w="${esc(p)}">${esc(p)}</span>`).join('')}
function splitSent(t){return String(t).split(/(?<=[.!?]["”’']?)\s+(?=[A-Z“‘"'(])/).filter(x=>x.trim())}

/* ---------- language-bank matcher (highlights useful language in any text) ---------- */
const MATCH=(()=>{const L=[];BANK.items.forEach(it=>{(it.f||[]).forEach(f=>{if(f.length>2&&!/^(million|billion|about|stage|stages|first|along|near|centre|then|next|highest|lowest|while|compare|illustrate|the same|like)$/i.test(f))L.push([f,it.id])});});
 ['then','next','while','highest','lowest','about','first'].forEach(f=>{const it=BANK.items.find(x=>(x.f||[]).includes(f));if(it)L.push([f,it.id])});
 L.sort((a,b)=>b[0].length-a[0].length);
 return L.map(([f,id])=>{let src='\\b'+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+')+'\\b';if(BI[id].k==='approx')src+='(?=\\s+(?:[A-Za-z-]+\\s+){0,2}[$£]?\\d)';return [new RegExp(src,'gi'),id]})})();
function bankHits(text){const hits=[];MATCH.forEach(([re,id])=>{re.lastIndex=0;let m;while((m=re.exec(text))){const a=m.index,b=a+m[0].length;if(!hits.some(h=>a<h[1]&&b>h[0]))hits.push([a,b,id])}});return hits.sort((x,y)=>x[0]-y[0])}
function hlHTML(text,on){if(!on)return tokHTML(text);const H=bankHits(text);let out='',i=0;H.forEach(([a,b,id])=>{out+=tokHTML(text.slice(i,a))+`<span class="bl c-${BI[id].k}" data-bi="${id}">${tokHTML(text.slice(a,b))}</span>`;i=b});return out+tokHTML(text.slice(i))}

const S={room:'plan',les:null,step:'learn',sam:null,sstep:'look',filter:'all',bcat:'up',game:null,word:null,xs:{},hl:true,timer:null,tests:null,open:{}};
function graphSVG(xs,ys,opt){opt=opt||{};const W=320,H=170,l=34,r=10,t=14,b=26;const n=xs.length;const max=Math.max(110,...ys.filter(v=>v!=null));
 const X=i=>l+(W-l-r)*i/(n-1),Y=v=>t+(H-t-b)*(1-v/max);let g='';
 [0,25,50,75,100].forEach(v=>{if(v<=max)g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${l-5}" y="${Y(v)+4}" font-size="9" text-anchor="end" fill="var(--muted)">${v}</text>`});
 const step=n>10?Math.ceil(n/7):1;xs.forEach((x,i)=>{if(i%step===0||i===n-1)g+=`<text x="${X(i)}" y="${H-8}" font-size="9" text-anchor="middle" fill="var(--muted)">${esc(x)}</text>`});
 let d='';ys.forEach((v,i)=>{if(v==null)return;d+=(d&&ys[i-1]!=null?'L':'M')+X(i)+' '+Y(v)});
 g+=`<path d="${d}" fill="none" stroke="var(--skyc)" stroke-width="2.6" stroke-linejoin="round"/>`;
 if(opt.seg){const [a,c]=opt.seg;if(a===c)g+=`<circle cx="${X(a)}" cy="${Y(ys[a])}" r="9" fill="none" stroke="var(--coral)" stroke-width="3"/>`;else{let s='';for(let i=a;i<=c;i++)s+=(i===a?'M':'L')+X(i)+' '+Y(ys[i]);g+=`<path d="${s}" fill="none" stroke="var(--coral)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>`}}
 ys.forEach((v,i)=>{if(v!=null)g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="var(--skyc)"/>`});
 return `<figure class="mgraph"><figcaption class="en">${esc(opt.title||'')}</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.title||'line graph')}" style="direction:ltr">${g}</svg></figure>`}
function sampleImg(n,cls){const s=SBY[n];if(!s.img)return `<div class="t2q ${cls&&/sm/.test(cls)?'sm':''}"><span class="pill">Task 2 · ${esc(TYPES[s.type][0])}</span><div class="en">${tokHTML(s.q)}</div></div>`;return `<img class="${cls||'chart'}" src="${s.img}" alt="${esc(s.q)}" data-zoom="${n}">`}
function fillParts(s){const out=[];let re=/\[\[(.+?)\]\]/g,m,i=0;while((m=re.exec(s))){out.push({t:s.slice(i,m.index)});out.push({a:m[1].split('|')});i=re.lastIndex}out.push({t:s.slice(i)});return out}
function fillFull(s){return s.replace(/\[\[(.+?)\]\]/g,(m,a)=>a.split('|')[0])}

 C.push({ok:!rep.length,t:'بدون تكرار',d:rep.length?'كررتي كلمات أكثر من ٣ مرات في نفس الفقرة: '+rep.slice(0,4).join('، ')+'. استخدمي مرادف أو ضمير.':'ما فيه كلمة تتكرر أكثر من ٣ مرات في الفقرة. ممتاز.'});
 const cx=(text.match(/\b(because|although|though|which|who|while|whereas|if|unless|since|when|where|whether|that|as a result|due to)\b/gi)||[]).length;C.push({ok:cx>=4,t:'جمل معقدة',d:cx>=4?'فيه جمل معقدة كافية (because, which, although…).':'زيدي جمل معقدة: because, although, which, if… عشان Grammatical Range.'});
 const con=/\b(in conclusion|to conclude|in summary|to sum up|overall)\b/i.test(paras[paras.length-1]||'');C.push({ok:con,t:'الخاتمة',d:con?'فيه خاتمة واضحة.':'آخر فقرة لازم تبدأ بـ In conclusion / In summary.'});
 const tv=[...new Set(bankHits(text).map(h=>h[2]))];C.push({ok:tv.length>=4,t:'كلمات وعبارات من بنك الملف',d:`استخدمتي ${tv.length}${tv.length?': '+tv.slice(0,8).map(id=>BI[id].e).join(', '):''}.${tv.length<4?' استخدمي collocations من قسم الموضوع في بنك اللغة.':''}`});
 const ct=(text.match(/\b(don't|can't|won't|isn't|aren't|doesn't|didn't|it's|i'm|they're)\b/gi)||[]).length;C.push({ok:!ct,t:'أسلوب أكاديمي',d:ct?'فيه اختصارات (don\'t, can\'t). اكتبيها كاملة: do not, cannot.':'ما فيه اختصارات. أسلوب رسمي.'});

 if(kind==='ex'){const m=ref.match(/^L:(\w+):(\d+)$/);if(!m||!LBY[m[1]])return null;const w=LBY[m[1]].ex[+m[2]];const R=w&&exToRound(w,m[1],+m[2]);if(R)R.mk=k;return R}

  if(!done)h+=`<div class="row"><button class="btn" data-tcheck="1">تحقّقي</button></div>`;else h+=fbHTML(G.picked==='ok',R.fb||`التهجئة: <b class="en">${esc(R.target)}</b> = ${esc(R.ar||'')}`,R);return h}
 if(R.kind==='build'){let h=`<div class="prompt"><p>رتّبي الكلمات عشان تطلع جملة صحيحة. اضغطي كلمة لتضيفيها.</p></div><div class="slot">${R.built.map((ti,pos)=>`<button class="tile" data-unb="${pos}" ${done?'disabled':''}>${esc(R.toks[ti])}</button>`).join('')}</div><div class="tiles">${R.order.map(ti=>`<button class="tile" data-tile="${ti}" ${R.built.includes(ti)||done?'disabled':''}>${esc(R.toks[ti])}</button>`).join('')}</div>`;

function answerRound(val){const G=S.game;const R=G.rounds[G.i];G.picked=val;const ok=val==='ok'||(R.kind==='choice'&&val===R.ans);
 if(ok){G.score++;addXP(G.ctx.kind==='mastery'?3:2);if(R.mk)delete P.mist[R.mk];if(R.it)P.known[R.it.id]=P.known[R.it.id]||0}else{G.wrong.push(R);if(R.ref&&/^L:/.test(R.ref))logMist('ex',R.ref)}
 save();render()}
function endView(G){const pct=Math.round(G.score/G.rounds.length*100);
 if(!G.done){G.done=true;const c=G.ctx;
  if(c.kind==='mastery'){const m=LP(c.les).mastery;m.tries++;m.best=Math.max(m.best||0,pct);if(pct===100&&!m.passed){m.passed=true;addXP(80);setTimeout(celebrate,100)}}
  else if(c.kind==='les'){const p=LP(c.les);p.games[G.id]=Math.max(p.games[G.id]||0,pct);addXP(8)}
  else if(c.kind==='bank'){const k='bank_'+(c.cat||'');P.tests[k]=P.tests[k]||{};P.tests[k][G.id]=Math.max(P.tests[k][G.id]||0,pct);addXP(8)}
  else if(c.kind==='sam'){const p=SP(c.n);p.prac=Math.max(p.prac||0,pct);addXP(10)}
  else if(c.kind==='mixed'){P.tests.mixed={best:Math.max((P.tests.mixed||{}).best||0,pct)};addXP(15)}
  if(pct>=80&&c.kind!=='mastery')setTimeout(celebrate,100);save()}
 const c=G.ctx;const pass=c.kind==='mastery'&&pct===100;
 return `<section class="card stack" style="align-items:center;text-align:center"><span class="eyebrow">${esc(gname(G))}</span>${c.kind==='mastery'?`<div class="medal${pass?' gold':''}">${pass?'★':pct+'%'}</div>`:''}<b style="font-size:44px;font-variant-numeric:tabular-nums">${G.score} / ${G.rounds.length}</b><p>${pass?'متمكّنة ١٠٠٪! أخذتي نجمة الدرس.':pct>=80?'ممتاز!':'كويس، جرّبي مرة ثانية بأسئلة جديدة.'}</p>
 ${G.wrong.length&&c.kind!=='bank'&&c.kind!=='les'?`<div class="stack" style="width:100%;text-align:start">${G.wrong.slice(0,8).map(r=>`<div class="fb no small">${r.prompt?r.prompt.replace(/<img[^>]*>|<figure[\s\S]*?<\/figure>|<button[\s\S]*?<\/button>/g,''):esc(r.full||r.target||'')}${r.kind==='choice'?`<div>الإجابة: <b class="en">${esc((r.opts.find(o=>o.val===r.ans)||{}).label||'')}</b></div>`:''}</div>`).join('')}</div>`:''}
 <div class="row"><button class="btn" data-again="1">مرة ثانية</button><button class="btn ghost" data-gback="1">رجوع</button>${pass&&LES[LES.indexOf(LBY[c.les])+1]?`<button class="btn sun" data-les="${LES[LES.indexOf(LBY[c.les])+1].key}">الدرس الجاي ←</button>`:''}</div></section>`}
