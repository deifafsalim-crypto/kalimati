<style>
/* Layout: a calm study desk. Sage-grey ground, white "paper" sheets, one deep-teal accent, a yellow highlighter for answers. */
:root{
 --bg:#F3F6FB; --surface:#FFFFFF; --sheet:#FAFCFF; --ink:#1C2340; --muted:#5E6684; --line:#E2E7F2;
 --accent:#11808F; --accent-ink:#FFFFFF; --accent-soft:#DDF3F3; --sky:#E6F1FF; --sky-ink:#1F5FA8;
 --mark:#FFE58A; --mark-ink:#5B4300; --ok:#1FA971; --ok-soft:#DDF7EA; --bad:#E5533D; --bad-soft:#FFE6E1; --gold:#F2A900;
 --coral:#FF6F61; --sun:#FFB938; --mint:#2EC4A0; --skyc:#4D9CFF; --grape:#8C6CF0; --rose:#F25C9A;
 --hero1:#0D6E7D; --hero2:#1E9E9A; --hero3:#55C6A9;
 --shadow:rgba(28,35,64,.08);
 --ui:"Readex Pro","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
 --read:"Literata",Georgia,"Times New Roman",serif;
 --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#10162A; --surface:#182037; --sheet:#1B2440; --ink:#E9ECF7; --muted:#A3ABC6; --line:#2A3452;
 --accent:#4FD1C5; --accent-ink:#06201F; --accent-soft:#173A40; --sky:#182D4A; --sky-ink:#A9CBFF;
 --mark:#6B5612; --mark-ink:#FFE9A6; --ok:#4FD69A; --ok-soft:#14352A; --bad:#FF8A76; --bad-soft:#3F211D; --gold:#FFC94D;
 --coral:#FF8A7E; --sun:#FFC85C; --mint:#4FD8B6; --skyc:#73B2FF; --grape:#A994FF; --rose:#FF7DB2;
 --hero1:#0B4E5A; --hero2:#137A78; --hero3:#2E9C86;
 --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#10162A; --surface:#182037; --sheet:#1B2440; --ink:#E9ECF7; --muted:#A3ABC6; --line:#2A3452;
 --accent:#4FD1C5; --accent-ink:#06201F; --accent-soft:#173A40; --sky:#182D4A; --sky-ink:#A9CBFF;
 --mark:#6B5612; --mark-ink:#FFE9A6; --ok:#4FD69A; --ok-soft:#14352A; --bad:#FF8A76; --bad-soft:#3F211D; --gold:#FFC94D;
 --coral:#FF8A7E; --sun:#FFC85C; --mint:#4FD8B6; --skyc:#73B2FF; --grape:#A994FF; --rose:#FF7DB2;
 --hero1:#0B4E5A; --hero2:#137A78; --hero3:#2E9C86;
 --shadow:rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.7;margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
.en{direction:ltr;unicode-bidi:isolate;text-align:left}
.muted{color:var(--muted)}
.small{font-size:13.5px}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.5px}
.brand h1{font-size:19px;font-weight:600}
.brand p{font-size:12.5px;color:var(--muted)}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13.5px;white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px;align-self:flex-start;max-width:100%}
.tab{flex:0 0 auto;border:0;background:none;border-radius:999px;padding:7px 16px;font-size:14.5px;color:var(--muted)}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 4px 14px var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 16px;font-size:14.5px;font-weight:500}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:3px 9px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.icon-btn svg{width:15px;height:15px}
.btn svg{width:16px;height:16px;vertical-align:-3px;margin-inline-end:4px}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;background:var(--accent-soft);color:var(--ink)}
.eyebrow{font-size:12.5px;letter-spacing:.6px;color:var(--accent);font-weight:600}
/* plan */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.hero .today h2{font-size:24px}
.today .meta{display:flex;gap:8px;flex-wrap:wrap}
.meter{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:6px}
.steps5{display:flex;gap:6px;flex-wrap:wrap}
.steps5 span{font-size:12.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps5 span.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.week{display:flex;flex-direction:column;gap:8px}
.week h3{font-size:15px;color:var(--muted);font-weight:500}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.dtile{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.dtile:hover{border-color:var(--accent)}
.dtile .n{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.dtile .t{font-family:var(--read);font-size:15px;direction:ltr;text-align:left;line-height:1.35;min-height:2.7em}
.dtile.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.star{color:var(--gold);font-size:15px}
/* day */
.dayhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.dayhead h2{font-family:var(--read);font-size:27px;font-weight:600;direction:ltr;text-align:left}
.stepbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.stepbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 13px;font-size:14px;display:flex;gap:7px;align-items:center}
.stepbtn .k{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:12px;font-variant-numeric:tabular-nums}
.stepbtn.done .k{background:var(--ok);color:#fff}
.stepbtn[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
/* words */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.wcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--sheet);display:flex;flex-direction:column;gap:6px;min-width:0}
.wcard .w{font-family:var(--read);font-size:19px;font-weight:600;direction:ltr;text-align:left}
.wcard .ar{font-size:16px;font-weight:500;color:var(--accent)}
.wcard .def,.wcard .ex{font-family:var(--read);font-size:14.5px;direction:ltr;text-align:left}
.wcard .ex{color:var(--muted);font-style:italic}
.wcard.known{border-color:var(--ok);background:var(--ok-soft)}
/* reader */
.reader{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px clamp(16px,4vw,40px);font-family:var(--read);direction:ltr;text-align:left;font-size:var(--fs,18px);line-height:1.8}
.reader h3{font-family:var(--read);font-size:1.35em;text-align:center;margin-bottom:6px}
.reader .intro{font-style:italic;color:var(--muted);text-align:center;margin-bottom:14px}
.para{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;margin-bottom:16px}
.para .lab{font-family:var(--ui);font-weight:700;color:var(--accent);font-size:15px;padding-top:4px}
.para .ptools{display:flex;gap:6px;margin-top:6px;font-family:var(--ui);direction:rtl;justify-content:flex-end}
.para .tr{font-family:var(--ui);direction:rtl;text-align:right;background:var(--sky);color:var(--ink);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:15px;line-height:1.8}
.foot{font-size:.8em;color:var(--muted)}
.w{cursor:pointer;border-radius:3px}
.w:hover{background:var(--accent-soft)}
.w.wl{border-bottom:2px solid var(--accent)}
.hl{background:var(--mark);color:var(--mark-ink);border-radius:3px;box-shadow:0 0 0 2px var(--mark)}
.fsz{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fsz button{border:0;background:var(--sheet);padding:3px 10px;font-size:13px}
/* test */
.testgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.testgrid .reader{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 30px);overflow:auto;font-size:16px}
.pane-switch{display:none}
.qgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.qhead{font-weight:600;font-size:15px}
.instr{font-family:var(--read);direction:ltr;text-align:left;font-size:14.5px;color:var(--muted);font-style:italic}
.hint{font-size:13.5px;background:var(--sky);color:var(--sky-ink);border-radius:10px;padding:8px 12px}
.optbox{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;background:var(--sheet)}
.optbox h5{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:500}
.optbox ol{list-style:none;margin:0;padding:0;direction:ltr;text-align:left;font-family:var(--read);font-size:14.5px;display:grid;gap:3px}
.optbox li b{display:inline-block;min-width:34px;color:var(--accent);font-family:var(--ui)}
.optbox.cols ol{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.qitem{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0}
.qn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--sheet)}
.qn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.qn.no{background:var(--bad);border-color:var(--bad);color:#fff}
.qt{font-family:var(--read);direction:ltr;text-align:left;font-size:15.5px}
.choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;direction:ltr}
.choice{border:1.5px solid var(--line);background:var(--sheet);border-radius:9px;padding:4px 11px;font-size:14px;text-align:left}
.choice.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choices.col{flex-direction:column;align-items:stretch}
.choices.col .choice{font-family:var(--read);font-size:14.5px}
.choice b{font-family:var(--ui);color:var(--accent);margin-right:6px}
.gapin{font:inherit;font-family:var(--ui);font-size:14.5px;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:1px 6px;width:9.5em;max-width:100%;color:var(--ink);direction:ltr}
.gapin.ok{border-color:var(--ok);background:var(--ok-soft)}
.gapin.no{border-color:var(--bad);background:var(--bad-soft)}
.gapsel{font:inherit;font-size:14px;border:1.5px solid var(--accent);border-radius:7px;background:var(--accent-soft);color:var(--ink);padding:1px 4px;max-width:100%}
.gnum{font-family:var(--ui);font-weight:700;font-size:12px;background:var(--ink);color:var(--surface);border-radius:5px;padding:0 5px;margin-right:4px}
.ctx{font-family:var(--read);direction:ltr;text-align:left;font-size:15.5px;line-height:2.1}
.ctitle{font-family:var(--read);font-weight:600;text-align:center;direction:ltr}
.flow{display:flex;flex-direction:column;align-items:center;gap:0}
.flow .box{border:1.5px solid var(--ink);border-radius:8px;padding:6px 12px;background:var(--sheet);max-width:560px;width:100%;text-align:center;font-family:var(--read);direction:ltr;font-size:15px;line-height:2}
.flow .arr{height:20px;width:2px;background:var(--ink);position:relative;margin-bottom:6px}
.flow .arr::after{content:"";position:absolute;bottom:-6px;left:-5px;border:6px solid transparent;border-top-color:var(--ink)}
.notes{display:flex;flex-direction:column;gap:4px;font-family:var(--read);direction:ltr;text-align:left;font-size:15px;line-height:2}
.tablewrap{overflow-x:auto}
table.qt2{border-collapse:collapse;direction:ltr;font-family:var(--read);font-size:14.5px;min-width:520px;width:100%}
table.qt2 th,table.qt2 td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left;line-height:2}
table.qt2 th{background:var(--accent-soft)}
.diagram{max-width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
.verdict{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;margin-top:6px}
.verdict .ans{font-family:var(--read);direction:ltr}
.expl{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.expl .src{font-family:var(--read);direction:ltr;text-align:left;font-size:14px}
.expl .k{font-weight:600;color:var(--accent);font-size:12.5px}
.ai{background:var(--sky);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.9}
.score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.score .big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.band{border:2px solid var(--accent);border-radius:12px;padding:4px 14px;text-align:center}
.band b{display:block;font-size:24px;line-height:1.2}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.sheetbar{display:flex;flex-wrap:wrap;gap:4px}
.sheetbar span{width:28px;height:28px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.sheetbar span.f{border-color:var(--accent);background:var(--accent-soft)}
.sheetbar span.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.sheetbar span.no{background:var(--bad);border-color:var(--bad);color:#fff}
/* games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.game{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:start;display:flex;flex-direction:column;gap:4px;min-width:0}
.game:hover{border-color:var(--accent)}
.game h4{font-size:15.5px}
.game p{font-size:13px;color:var(--muted);line-height:1.6}
.game .gb{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.game .best{color:var(--ok);font-weight:600}
.play{display:flex;flex-direction:column;gap:14px}
.prompt{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:16px}
.prompt .big{font-family:var(--read);font-size:26px;font-weight:600;direction:ltr;text-align:center}
.prompt .sent{font-family:var(--read);direction:ltr;text-align:left;font-size:17px;line-height:1.9}
.blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;text-align:center;min-width:0}
.opt.en{font-family:var(--read);direction:ltr}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-size:14.5px}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.flip{min-height:150px;display:grid;place-items:center;text-align:center;cursor:pointer}
.tiles{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.tile{border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;padding:4px 10px;font-family:var(--read);font-size:15.5px}
.tile:disabled{opacity:.3}
.slot{min-height:46px;border:1.5px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.order{display:flex;flex-direction:column;gap:6px}
.order button{text-align:left;direction:ltr;font-family:var(--read);font-size:14.5px;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 10px;display:flex;gap:8px}
.order button .o{font-family:var(--ui);min-width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px}
.order button.picked .o{background:var(--accent);color:var(--accent-ink)}
.input{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--sheet);color:var(--ink);width:100%}
.input.en{font-family:var(--read)}
.diff span{border-radius:4px;padding:0 2px}
.ldiff .miss{color:var(--bad);text-decoration:underline 3px;background:none}
.ldiff .okw{color:var(--ok)}
.diff .miss{background:var(--bad-soft);color:var(--bad)}
.diff .okw{background:var(--ok-soft)}
/* mastery */
.mbadge{display:flex;gap:12px;align-items:center}
.mbadge .medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;background:var(--accent-soft);color:var(--accent);border:2px solid var(--accent)}
.mbadge .medal.gold{background:var(--mark);color:var(--mark-ink);border-color:var(--gold)}
/* sheet popup */
.wsheet{position:fixed;inset:auto 0 0 0;z-index:30;display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.wsheet>div{width:100%;max-width:600px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px var(--shadow);padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px;max-height:75vh;overflow:auto}
.wsheet .ww{font-family:var(--read);font-size:26px;font-weight:600;direction:ltr}

/* strategy */
.strat{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}

 .hero{grid-template-columns:1fr}
 .testgrid{grid-template-columns:1fr}

 .testgrid[data-pane="p"] .qcol{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== v2: bright study-quest look ===== */
#main{display:flex;flex-direction:column;gap:18px;min-width:0}
.days{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1000px){.days{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
body{background:radial-gradient(900px 500px at 100% -10%,color-mix(in srgb,var(--sun) 18%,transparent),transparent 60%),radial-gradient(800px 500px at -10% 20%,color-mix(in srgb,var(--skyc) 14%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
.logo{background:linear-gradient(135deg,var(--coral),var(--sun));color:#fff;border-radius:14px;box-shadow:0 6px 14px color-mix(in srgb,var(--coral) 35%,transparent)}
.chip{border:0;box-shadow:0 3px 10px var(--shadow);font-weight:500}
.chip.c1{background:color-mix(in srgb,var(--coral) 16%,var(--surface))}
.chip.c2{background:color-mix(in srgb,var(--sun) 22%,var(--surface))}
.chip.c3{background:color-mix(in srgb,var(--grape) 16%,var(--surface))}
.tabs{border:0;box-shadow:0 4px 14px var(--shadow)}
.tab[aria-current="true"]{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff}
.card{border:0;box-shadow:0 8px 24px var(--shadow)}
.btn{border:0;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent);transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn.ghost{border:1.5px solid var(--accent);box-shadow:none}
.btn.sun{background:var(--sun);color:#2B1D00;box-shadow:0 6px 16px color-mix(in srgb,var(--sun) 45%,transparent);font-weight:700;font-size:16.5px;padding:12px 24px;border-radius:14px}
/* hero */
.hero2{position:relative;overflow:hidden;border-radius:26px;padding:28px clamp(18px,4vw,36px);color:#fff;background:linear-gradient(135deg,var(--hero1),var(--hero2) 55%,var(--hero3));box-shadow:0 18px 40px color-mix(in srgb,var(--hero1) 35%,transparent);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center}
.hero2 .bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.hero2 .eyebrow{color:var(--sun);letter-spacing:.8px}
.hero2 h2{font-size:clamp(24px,4vw,34px);font-weight:700}
.hero2 .ttl{font-family:var(--read);font-size:clamp(20px,3vw,26px);direction:ltr;text-align:right;opacity:.95}
.hero2 .sp{display:flex;gap:6px;flex-wrap:wrap}
.hero2 .sp span{font-size:13px;padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.14)}
.hero2 .sp span.done{background:var(--sun);color:#2B1D00;font-weight:600}
.ring{position:relative;width:150px;height:150px;flex:0 0 auto}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.2}
.ring .in b{font-size:34px;display:block}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;background:var(--surface);box-shadow:0 8px 20px var(--shadow)}
.stat .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.stat .ic svg{width:24px;height:24px}
.stat b{font-size:22px;display:block;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
/* journey */
.week{background:var(--surface);border-radius:22px;padding:16px;box-shadow:0 8px 22px var(--shadow);border-top:5px solid var(--wk)}
.week h3{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:16.5px;font-weight:600}
.week h3 .wn{width:30px;height:30px;border-radius:10px;background:var(--wk);color:#fff;display:grid;place-items:center;font-size:14px}
.week h3 small{color:var(--muted);font-weight:400;font-size:13px}
.dtile{border:0;background:color-mix(in srgb,var(--wk) 9%,var(--sheet));border-radius:16px;padding:12px;transition:transform .15s,box-shadow .15s}
.dtile:hover{transform:translateY(-3px);box-shadow:0 10px 20px var(--shadow)}
.dtile .num{width:38px;height:38px;border-radius:50%;background:var(--wk);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
.dtile.cur{box-shadow:0 0 0 3px var(--wk),0 10px 22px var(--shadow)}
.dtile.cur .num{animation:pulse 1.8s ease-in-out infinite}
.dtile.star{background:linear-gradient(135deg,color-mix(in srgb,var(--sun) 30%,var(--sheet)),var(--sheet))}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--wk) 50%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.dots i.on{background:var(--wk)}
/* day banner */
.banner{position:relative;overflow:hidden;border-radius:24px;padding:22px clamp(18px,4vw,30px);color:#fff;background:linear-gradient(135deg,var(--wk),color-mix(in srgb,var(--wk) 55%,var(--hero1)));box-shadow:0 14px 32px color-mix(in srgb,var(--wk) 35%,transparent);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.banner h2{font-family:var(--read);font-size:clamp(24px,4vw,32px);direction:ltr;text-align:left;font-weight:600}
.banner .eyebrow{color:#fff;opacity:.9}
.banner .icon-btn{background:rgba(255,255,255,.18);border:0;color:#fff}
.banner .bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.banner .medal{background:var(--sun);color:#2B1D00;border-color:#fff}
.bprog{min-width:180px;display:flex;flex-direction:column;gap:6px}
.bprog .meter{background:rgba(255,255,255,.25)}
.bprog .meter i{background:var(--sun)}
.stepbtn{border:0;background:var(--surface);box-shadow:0 4px 12px var(--shadow);border-radius:14px;padding:8px 14px}
.stepbtn .k{background:var(--sc);color:#fff}
.stepbtn[aria-current="true"]{background:var(--sc);color:#fff}
.stepbtn[aria-current="true"] .k{background:#fff;color:var(--sc)}
.stepbtn.done .k{background:var(--ok);color:#fff}
/* games */
.game{border:0;border-radius:18px;padding:14px;background:color-mix(in srgb,var(--gc) 11%,var(--surface));box-shadow:0 6px 16px var(--shadow);transition:transform .15s}
.game:hover{transform:translateY(-3px) rotate(-.4deg)}
.game .gi{width:42px;height:42px;border-radius:13px;background:var(--gc);color:#fff;display:grid;place-items:center;font-weight:700}
.game .gi svg{width:22px;height:22px}
.game .best{background:var(--ok);color:#fff;padding:1px 8px;border-radius:999px}
.play .meter i{background:linear-gradient(90deg,var(--mint),var(--skyc))}
.opt{border-radius:14px;border-width:2px;transition:transform .12s}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.wcard{border:0;border-radius:16px;background:var(--surface);box-shadow:0 6px 16px var(--shadow);border-top:4px solid var(--wc)}
.wcard.known{border-top-color:var(--ok)}
.wcard .ar{color:var(--wc)}
.qgroup{border:0;box-shadow:0 8px 22px var(--shadow);border-top:4px solid var(--accent)}
.reader{border:0;box-shadow:0 8px 22px var(--shadow)}
.strat .card{border-top:5px solid var(--sc)}
@media (max-width:860px){.hero2{grid-template-columns:1fr}.ring{justify-self:center}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---- IELTS academy additions ---- */

Great. How old are you, Roger?", "I’m eighteen.", "And where are you living at the moment?", "Well, during the week I’m staying in a hostel near the college, but I go home at weekends.", "What’s your postal address?", "It’s seventeen Buckleigh Street, Stamford, Lincs. Buckleigh is B-U-C-K-L-E-I-G-H.", "And the postcode?", "P-E-nine, seven-Q-T.", "Are you working or studying?", "Both, really. I’m a student, and I have a part-time job as a waiter in a restaurant. I used to work in a shop, but I left last year.", "What are you studying?", "My major subject is politics, and history is my minor subject.", "And your hobbies?", "I do a lot of cycling, and I’m interested in the environment."], "labels": ["L1", "L2", "L3", "L4", "L5", "L6", "L7", "L8", "L9", "L10", "L11", "L12", "L13", "L14", "L15", "L16"], "words": 0, "type": "p1", "task": 1, "note": []}, {"level": 4, "part": 2, "kind": "gap", "title": "Farm park", "ar": "حديقة المزرعة (أسئلة قصيرة)", "instr": "Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.", "script": [["W", "Welcome to Green Hill Farm Park. We’re open every day from March to October. Be at the gates at nine thirty when Farmer Tom unlocks, and you can be the first visitors inside."], ["W", "Voted favourite feature for the past five years, our pet area has been knocked off pole position this year by a new boating lake and the miniature steam train."], ["W", "We love it that many of our guests come back time and time again, and we’re always working to develop the park for the future. Over this winter, we’ll be digging and stocking a trout fishing lake. You can bring your own rod or hire one on-site."], ["W", "We also intended to install a bouncy castle, until a visitor survey revealed that outdoor trampolines would be far more popular, so we’re going to give you what you’ve asked for."]], "qs": [{"k": "gap", "label": "1 What time does the farm park open? ____", "a": ["9.30", "9:30", "9.30 am", "9.30am", "9.30 a.m."]}, {"k": "gap", "label": "2 Most popular attraction: ____", "a": ["boating lake", "new boating lake", "steam train", "miniature steam train"]}, {"k": "gap", "label": "3 Most popular attraction: ____", "a": ["steam train", "miniature steam train", "boating lake", "new boating lake"]}, {"k": "gap", "label": "4 Planned improvement: ____", "a": ["fishing lake", "trout fishing lake", "trampolines", "outdoor trampolines"]}, {"k": "gap", "label": "5 Planned improvement: ____", "a": ["trampolines", "outdoor trampolines", "fishing lake", "trout fishing lake"]}], "img": null, "form": null, "notes": ["كالعادة لازم أول نخمّن نوع الكلمة: ١ وقت، ٢–٥ اسم (ومعه صفة؟).", "المرادفات: open ← unlocks، attractions ← feature، most popular ← favourite، improvements ← develop، planned ← intended، next season ← over this winter.", "الـ bouncy castle مو الإجابة: «intended … until»."], "expl": [[0, "open", "be at the gates at 9.30 when Farmer Tom unlocks"], [1, "most popular", "favourite feature … knocked off pole position by a new boating lake and the miniature steam train"], [3, "improvements planned", "over this winter, we’ll be digging a trout fishing lake"], [4, "planned", "we intended to install a bouncy castle, until a survey revealed outdoor trampolines"]], "src": "file", "page": "22–23", "n": 14, "q": "Farm park", "paras": ["Welcome to Green Hill Farm Park. We’re open every day from March to October. Be at the gates at nine thirty when Farmer Tom unlocks, and you can be the first visitors inside.", "Voted favourite feature for the past five years, our pet area has been knocked off pole position this year by a new boating lake and the miniature steam train.", "We love it that many of our guests come back time and time again, and we’re always working to develop the park for the future. Over this winter, we’ll be digging and stocking a trout fishing lake. You can bring your own rod or hire one on-site.", "We also intended to install a bouncy castle, until a visitor survey revealed that outdoor trampolines would be far more popular, so we’re going to give you what you’ve asked for."], "labels": ["L1", "L2", "L3", "L4"], "words": 0, "type": "p2", "task": 2, "note": []}, {"level": 4, "part": 2, "kind": "mc2", "title": "Volunteering", "ar": "التطوع (اختاري اثنين)", "instr": "Choose TWO letters, A–E, for each question.", "script": [["M", "Volunteers can do all sorts of things, depending on their own abilities and interests. If they’re supporting a family that’s struggling, for example, they may be able to give them tips on cooking, or recommend how to plan their budget or how to shop sensibly on their income."], ["M", "They might even do some painting or wallpapering, perhaps alongside any members of the family who are able to do it. Or even do some babysitting so that parents can go out for a while."], ["M", "So what do volunteers get out of it? Well, people often think it will help them get a job, and sometimes it does, but most of our volunteers tell us something different. They say it gives them a real sense of purpose. They also say that working with people in difficult situations makes them realise how lucky they are."]], "qs": [{"k": "mc2", "label": "Which TWO activities that volunteers do are mentioned?", "opts": ["A decorating", "B cleaning", "C delivering meals", "D shopping", "E childcare"], "a": ["A decorating", "E childcare"]}, {"k": "mc2", "label": "Which TWO benefits do volunteers mention?", "opts": ["A learning how to be part of a team", "B having a sense of purpose", "C realising how lucky they are", "D improved ability at time management", "E boosting their employment prospects"], "a": ["B having a sense of purpose", "C realising how lucky they are"]}], "img": null, "form": null, "notes": ["نقرا السؤال قبل التسجيل ونحفظ الخيارات، ونحدد الكلمات المفتاحية (team, purpose, lucky, time management, employment).", "painting or wallpapering = decorating، babysitting = childcare.", "«shop sensibly» نصيحة، مو إنهم يتسوقون لهم ← D غلط.", "«help them get a job… but most say something different» ← E تشتيت."], "expl": [], "src": "file", "page": "10–13", "n": 15, "q": "Volunteering", "paras": ["Volunteers can do all sorts of things, depending on their own abilities and interests. If they’re supporting a family that’s struggling, for example, they may be able to give them tips on cooking, or recommend how to plan their budget or how to shop sensibly on their income.", "They might even do some painting or wallpapering, perhaps alongside any members of the family who are able to do it. Or even do some babysitting so that parents can go out for a while.", "So what do volunteers get out of it? Well, people often think it will help them get a job, and sometimes it does, but most of our volunteers tell us something different. They say it gives them a real sense of purpose. They also say that working with people in difficult situations makes them realise how lucky they are."], "labels": ["L1", "L2", "L3"], "words": 0, "type": "p2", "task": 2, "note": []}, {"level": 4, "part": 2, "kind": "mc2", "title": "The Castle Feast", "ar": "وليمة القلعة (اختاري اثنين)", "instr": "Choose TWO letters, A–E.", "script": [["W", "Now, one of the most popular events this summer is the Castle Feast. It takes place in the great hall every Saturday evening."], ["W", "Everyone eats the same traditional meal, so I’m afraid there’s no menu to choose from. And just like in the Middle Ages, you eat with your fingers: there are no knives and forks on the tables."], ["W", "Visitors are welcome to come in their normal clothes, although the staff will all be dressed in historical costume."], ["W", "During the meal, there’s entertainment from musicians and jugglers. Some people ask about horse races, but those only take place at the summer fair, not at the feast. And after the meal, the hall becomes a dance floor, so bring your dancing shoes!"]], "qs": [{"k": "mc2", "label": "Which TWO things does the speaker say about the Castle Feast?", "opts": ["A Visitors can dance after the meal.", "B There is a choice of food.", "C Visitors wear historical costume.", "D Knives and forks are not used.", "E The entertainment includes horse races."], "a": ["A Visitors can dance after the meal.", "D Knives and forks are not used."]}], "img": null, "form": null, "notes": ["هذا النوع خياراته جمل طويلة: حددي الكلمات المفتاحية (dance, food, costume, knives and forks, horse races).", "costume: الموظفين يلبسونها مو الزوار ← C غلط. horse races في الـ fair مو الـ feast ← E غلط."], "expl": [], "src": "plat", "page": "11", "n": 16, "q": "The Castle Feast", "paras": ["Now, one of the most popular events this summer is the Castle Feast. It takes place in the great hall every Saturday evening.", "Everyone eats the same traditional meal, so I’m afraid there’s no menu to choose from. And just like in the Middle Ages, you eat with your fingers: there are no knives and forks on the tables.", "Visitors are welcome to come in their normal clothes, although the staff will all be dressed in historical costume.", "During the meal, there’s entertainment from musicians and jugglers. Some people ask about horse races, but those only take place at the summer fair, not at the feast. And after the meal, the hall becomes a dance floor, so bring your dancing shoes!"], "labels": ["L1", "L2", "L3", "L4"], "words": 0, "type": "p2", "task": 2, "note": []}, {"level": 4, "part": 2, "kind": "letter", "title": "Croft Valley Park", "ar": "خريطة حديقة كروفت فالي", "instr": "Write the correct letter, A–H.", "script": [["M", "Welcome to Croft Valley Park. Let me tell you where everything is. If you come in through the North gate, the café is immediately on your left, at B, next to the adventure playground."], ["M", "Follow the path towards the lake. Just before you get to the old museum, on the left, you’ll see the toilets. Actually, no, the toilets have moved. They’re now on the far side of the old museum, at D."], ["M", "If you want to have a picnic, the best place is beside the South gate on’t do it.", "script": [["X", "So, for example, the Media Studies option will cover quite a lot of the same area you did in the core module on mass communications this semester, the development of the media through the last two centuries, in relation to political and social issues."], ["M", "Mmm. Well, that was interesting, but I’ve decided I’d rather do something completely new. There’s a Women’s Studies option, isn’t there?"], ["X", "Yes, Women and Power. Again it has a historical focus. It aims to contextualise women’s studies by looking at the legal and social situation in the nineteenth and early twentieth centuries."], ["M", "So, it would be useful if I intended to specialise in women’s studies. But I’m not sure I do, actually."], ["X", "Well, it might still be useful to give you an idea of the issues involved. It’s taught by Doctor Steed."], ["M", "Oh, really? I’ll sign up for that, then. What about the option on Culture and Society?"], ["X", "That addresses the historical debate on the place of culture since the Industrial Revolution in Britain."], ["M", "So a historical focus again."], ["X", "Do I get the message you’re not so keen on history?"], ["M", "Well, it’s just we seem to have done quite a lot this semester. Anyway, I’ll think about that one."], ["X", "If you’re interested in a course focusing on current issues, there’s the option on Identity and Popular Culture. That approaches the subject through things like contemporary film, adverts, soap operas and so on."], ["M", "Oh? That sounds interesting. Can you tell me who runs it?"], ["X", "Well, it’s normally Doctor Stevens, but he’s on sabbatical next semester, so I’m not sure who’ll be running it. It should be decided by next week, though."], ["M", "Right. Well, I might wait until then to decide. And the last one, Introduction to Cultural Theory?"], ["X", "It’s quite theoretical, with a lot of reading."], ["M", "To be honest, I don’t think that’s for me. I’ll leave that one."]], "qs": [{"k": "letter ddresses the historical debate on the place of culture since the Industrial Revolution in Britain.", "So a historical focus again.", "Do I get the message you’re not so keen on history?", "Well, it’s just we seem to have done quite a lot this semester. Anyway, I’ll think about that one.", "If you’re interested in a course focusing on current issues, there’s the option on Identity and Popular Culture. That approaches the subject through things like contemporary film, adverts, soap operas and so on.", "Oh? That sounds interesting. Can you tell me who runs it?", "Well, it’s normally Doctor Stevens, but he’s on sabbatical next semester, so I’m not sure who’ll be running it. It should be decided by next week, though.", "Right. Well, I might wait until then to decide. And the last one, Introduction to Cultural Theory?", "It’s quite theoretical, with a lot of reading.", "To be honest, I don’t think that’s for me. I’ll leave that one."], "labels": ["L1", "L2", "L3", "L4", "L5", "L6", "L7", "L8", "L9", "L10", "L11", "L12", "L13", "L14", "L15", "L16"], "words": 0, "type": "p3", "task": 3, "note": []}, {"level": 5, "part": 3, "kind": "gap", "title": "Project tutorial: water treatment", "ar": "خطة مشروع (Flow chart)", "instr": "Complete the flow chart. Write ONE OR TWO WORDS for each answer.", "script": [["W", "So, our project topic this term is to design a water treatment system. How should we organise the tutorial?"], ["X", "Well, first of all, I think we should go over the project aims together, so that everyone understands what we’re trying to achieve."], ["W", "Good idea. And after that?"], ["X", "Then we need to think about research methods. We’ll search online databases using good search terms, of course."], ["W", "Should we also look at what other groups have done?"], ["X", "Yes, definitely. We could use case studies from other projects. That would save us a lot of time."], ["W", "And then, I suppose, we develop an action plan, with deadlines for each person."], ["X", "Exactly. An action plan is the most important part."]], "qs": [{"k": "gap", "label": "Step 1: go over 21 ____", "a": ["project aims", "the project aims", "aims"]}, {"k": "gap", "label": "Step 2: think about research 22 ____", "a": ["methods"]}, {"k": "gap", "label": "e.g. 23 ____ from other projects", "a": ["case studies"]}, {"k": "gap", "label": "Step 3: develop an 24 ____", "a": ["action plan"]}], "img": null, "form": "Session outline|Project topic: design a water treatment system", "notes": ["خمّني نوع الكلمة قبل التسجيل: كلها أسماء.", "الكلمات اللي بعد الفراغ تساعدك: research ____ = methods."], "expl": [], "src": "plat", "page": "19", "n": 19, "q": "Project tutorial: water treatment", "paras": ["So, our project topic this term is to design a water treatment system. How should we organise the tutorial?", "Well, first of all, I think we should go over the project aims together, so that everyone understands what we’re trying to achieve.", "Good idea. And after that?", "Then we need to think about research methods. We’ll search online databases using good search terms, of course.", "Should we also look at what other groups have done?", "Yes, definitely. We could use case studies from other projects. That would save us a lot of time.", "And then, I suppose, we develop an action plan, with deadlines for each person.", "Exactly. An action plan is the most important part."], "labels": ["L1", "L2", "L3", "L4", "L5", "L6", "L7", "L8"], "words": 0, "type": "p3", "task": 3, "note": []}, {"level": 6, "part": 4, "kind": "gap", "title": "Sydney Opera House", "ar": "دار أوبرا سيدني (Summary)", "instr": "Complete the summary. Write ONLY ONE WORD OR A NUMBER for each answer.", "script": [["N", "Today I’d like to talk about one of the most famous buildings in the world: the Sydney Opera House."], ["N", "Its unique roof design, which looks like a series of gleaming white sails, makes it one of the most-photographed buildings in the world."], ["N", "An international competition to design the building was held in the nineteen fifties. This was won by Danish architect Jørn Utzon. Construction began in nineteen fifty-nine, but it was fourteen years later, in nineteen seventy-three, that it was completed."], ["N", "The roof has over a million tiles, made in Sweden, covering its surface. As evening falls, these are illuminated to create a colourful display."], ["N", "Inside, there are several performance halls, as well as theatre and exhibition spaces. Remarkably, in excess of forty performances take place each week. Every year, more than eight million visitors come to see this Australian landmark."]], "qs": [{"k": "gap", "label": "Famous for its roof’s architecture resembling 32 ____", "a": ["sails"]}, {"k": "gap", "label": "Built between 1959 and 33 ____", "a": ["1973"]}, {"k": "gap", "label": "Roof tiles manufactured in 34 ____", "a": ["Sweden"]}, {"k": "gap", "label": "Every evening the roof is lit up in a 35 ____ spectacle", "a": ["colourful", "colorful"]}, {"k": "gap", "label": "More than 36 ____ shows are staged every week", "a": ["40", "forty"]}], "img": null, "form": null, "notes": ["نحاول نتوقع الإجابة ونوعها.", "المرادفات: roof’s architecture ← roof design، resembling ← looks like، more than ← over / in excess of، manufactured ← made in، lit up ← illuminated، spectacle ← display، shows ← performances، are staged ← take place."], "expl": [[0, "resembling", "looks like a series of gleaming white sails"], [1, "built between", "construction began in 1959 … completed in 1973"], [2, "manufactured in", "made in Sweden"], [3, "lit up", "illuminated to create a colourful display"], [4, "more than", "in excess of 40 performances take place each week"]], "src": "file", "page": "18–19", "n": 20, "q": "Sydney Opera House", "paras": ["Today I’d like to talk about one of the most famous buildings in the world: the Sydney Opera House.", "Its unique roof design, which looks like a series of gleaming white sails, makes it one of the most-photographed buildings in the world.", "An international competition to design the building was held in the nineteen fifties. This was won by Danish architect Jørn Utzon. Construction began in nineteen fifty-nine, but it was fourteen years later, in nineteen seventy-three, that it was completed.", "The roof has over a million tiles, made in Sweden, covering its surface. As evening falls, these are illuminated to create a colourful display.", "Inside, there are several performance halls, as well as theatre and exhibition spaces. Remarkably, in excess of forty performances take place each week. Every year, more than eight million visitors come to see this Australian landmark."], "labels": ["L1", "L2", "L3", "L4", "L5"], "words": 0, "type": "p4", "task": 4, "note": []}, {"level": 6, "part": 4, "kind": "gap", "title": "The operational cycle", "ar": "دورة العوامات (Diagram)", "instr": "Complete the notes on the diagram. Write NO MORE THAN THREE WORDS AND/OR A NUMBER for each answer.", "script": [["X", "The operational cycle goes like this: each of the floats is dropped in the ocean from a boat at a set point and activated from a satellite."], ["X", "It then sinks to a depth of about two thousand metres. It stays at this depth for about ten days and is carried around by the currents which operate in the ocean at this level. During this time, it’s possible for it to cover quite large distances, but the average is fifty kilometres."], ["W", "So, what is it actually recording?"], ["X", "Well, at this stage nothing, but as it rises to the surface it collects all sorts of data. Most importantly, variations in salinity, that’s salt levels, and the changes in temperature, a bit like underwater weather balloons."]], "qs": [{"k": "gap", "label": "Float dropped into ocean and 23 ____ by satellite", "a": ["activated", "is activated"]}, {"k": "gap", "label": "Average distance travelled: 24 ____", "a": ["50 kilometres", "50 km", "50 kilometers", "fifty kilometres", "about 50 kilometres", "50km"]}, {"k : difficult, complex, original, admired, material, easy, fundamental.", "script": [["N", "Good morning. Today’s lecture is about language. Think about the wheel. It is one invention that has had a major impact on the material aspects of life: transport, farming, industry."], ["N", "But no invention, in my view, has had an impact as fundamental as that of language. Everything else depends on it."], ["N", "Language is very complex, yet it is composed of just a small number of sounds, usually between thirty and fifty in any one language."], ["N", "And because children pick it up so naturally, language appears to be easy to use. However, its sophistication is often overlooked."]], "qs": [{"k": "mc", "label": "The wheel has had a major impact on 1 ____ aspects of life.", "opts": ["difficult", "complex", "original", "admired", "material", "easy", "fundamental"], "a": ["material"]}, {"k": "mc", "label": "No impact has been as 2 ____ as that of language.", "opts": ["difficult", "complex", "original", "admired", "material", "easy", "fundamental"], "a": ["fundamental"]}, {"k": "mc", "label": "Language is very 3 ____, yet composed of a small number of sounds.", "opts": ["difficult", "complex", "original", "admired", "material", "easy", "fundamental"], "a": ["complex"]}, {"k": "mc", "label": "Language appears to be 4 ____ to use.", "opts": ["difficult", "complex", "original", "admired", "material", "easy", "fundamental"], "a": ["easy"]}], "img": null, "form": null, "notes": ["اقري الملخص والكلمات قبل التسجيل، وحددي نوع كل فراغ (كلها صفات هنا).", "yet = لكن: «very ____, yet composed of just a small number» ← كلمة عكس البساطة = complex."], "expl": [], "src": "file", "page": "5", "n": 22, "q": "The importance of language", "paras": ["Good morning. Today’s lecture is about language. Think about the wheel. It is one invention that has had a major impact on the material aspects of life: transport, farming, industry.", "But no invention, in my view, has had an impact as fundamental as that of language. Everything else depends on it.", "Language is very complex, yet it is composed of just a small number of sounds, usually between thirty and fifty in any one language.", "And because children pick it up so naturally, language appears to be easy to use. However, its sophistication is often overlooked."], "labels": ["L1", "L2", "L3", "L4"], "words": 0, "type": "p4", "task": 4, "note": []}], "types": {"p0": ["تمرين", "Drill"], "p1": ["Part 1", "Part 1"], "p2": ["Part 2", "Part 2"], "p3": ["Part 3", "Part 3"], "p4": ["Part 4", "Part 4"]}}</script>

let VOX={};
function pickVox(){try{const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));const by=re=>v.filter(x=>re.test(x.lang+' '+x.name));const f=/female|libby|sonia|serena|kate|martha|hazel|susan|samantha|karen|moira|tessa|zira|aria|jenny|natasha|emma|amy/i,m=/male|ryan|thomas|daniel|george|arthur|oliver|alex|fred|guy|david|mark|james|william|liam/i;
 const gb=by(/en-GB/i),us=by(/en-US/i),au=by(/en-(AU|IE|NZ|ZA|IN)/i);const pickF=(L)=>L.find(x=>f.test(x.name)&&!m.test(x.name))||L[0];const pickM=(L)=>L.find(x=>m.test(x.name)&&!/female/i.test(x.name))||L[1]||L[0];
 VOX={N:pickF(gb)||enV||v[0],M:pickM(gb)||pickM(us)||v[0],W:pickF(au)||pickF(us)||pickF(gb)||v[0],X:pickM(us)||pickM(au)||pickM(gb)||v[0]}}catch(e){VOX={}}}

function plLine(){clearTimeout(PL.timer);if(!PL.on||PL.paused)return;const t=SBY[PL.n];if(PL.i>PL.to){plStop();return}const [sp,txt]=t.script[PL.i];const parts=lineChunks(txt);let k=0;const tok=PL.tok;plPaint();

  setTimeout(()=>{if(tok===PL.tok&&!started&&PL.on&&!PL.paused){try{speechSynthesis.cancel()}catch(e){}nextPart()}},4000)};
