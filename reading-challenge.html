ws versus Apple Mac battles showed.","foot":false},{"L":null,"t":"But “dual-mode” systems might just succeed where PRT seems doomed to fail. The Danish RUF system envisaged by Palle Jensen, for example, resembles PRT but with one key difference: vehicles have wheels as well as a slot allowing them to travel on a monorail, so they can drive off the rail onto a normal road. Once on a road, the occupant would take over from the computer, and the RUF vehicle—the term comes from a Danish saying meaning to “go fast”—would become an electric car.","foot":false},{"L":null,"t":"Build a fast network of guideways in a busy city centre and people would have a strong incentive not just to use public RUF vehicles, but also to buy their own dual-mode vehicle. Commuters could drive onto the guideway, sit back and read as they are chauffeured into the city. At work, they would jump out, leaving their vehicles to park themselves. Unlike PRT, such a system could grow organically, as each network would serve a large area around it and people nearby could buy into it. And a dual-mode system might even win the support of car manufacturers, who could easily switch to producing dual-mode vehicles.","foot":false},{"L":null,"t":"Of course, creating a new transport system will not be cheap or easy. But unlike adding a dedicated bus lane here or extending the underground railway there, an innovative system such as Jensen’s could transform cities.","foot":false},{"L":null,"t":"And it’s not just a matter of saving a few minutes a day. According to the Red Cross, more than 30 million people have died in road accidents in the past century—three times the number killed in the First World War—and the annual death toll is rising. And what’s more, the Red Cross believes road accidents will become the third biggest cause of death and disability by 2020, ahead of diseases such as AIDS and tuberculosis. Surely we can find a better way to get around?","foot":false}],"groups":[{"a":1,"b":6,"k":"tf","instr":["Do the following statements agree with the information given in Reading Passage 1?","In boxes 1–6 on your answer sheet, write"],"items":[{"n":1,"t":"City transport developed slower than other means of communication.","opts":[]},{"n":2,"t":"The pollution caused by city transport has been largely ignored.","opts":[]},{"n":3,"t":"Most states in America have taken actions to reduce vehicle growth.","opts":[]},{"n":4,"t":"Public transport is particularly difficult to use on steep hills.","opts":[]},{"n":5,"t":"Private cars are much more convenient for those who tend to buy a lot of things during shopping.","opts":[]},{"n":6,"t":"Government should impose compulsory restrictions on car use.","opts":[]}],"opts":[],"ctx":[]},{"a":7,"b":12,"k":"match","instr":["Classify the following descriptions as referring to","Write the correct letter in boxes 7–12 on your answer sheet."],"items":[{"n":7,"t":"It is likely to be resisted by both individuals and manufacturers.","opts":[]},{"n":8,"t":"It can run at high speed in cities.","opts":[]},{"n":9,"t":"It is not necessary to share with the general public.","opts":[]},{"n":10,"t":"It is always controlled by a computer.","opts":[]},{"n":11,"t":"It can run on existing roads.","opts":[]},{"n":12,"t":"It can be bought by private buyers.","opts":[]}],"opts":[{"k":"A","t":"PRT only"},{"k":"B","t":"RUF only"},{"k":"C","t":"both PRT and RUF"}],"ctx":[]},{"a":13,"b":13,"k":"multi","instr":["Choose THREE letters, A–G.","Write the correct letters in box 13 on your answer sheet."],"items":[],"opts":[{"k":"A","t":"economy"},{"k":"B","t":"space"},{"k":"C","t":"low pollution"},{"k":"D","t":"suitability for families"},{"k":"E","t":"speed"},{"k":"F","t":"safety"},{"k":"G","t":"suitability for children"}],"ctx":[],"count":3,"q":"Which THREE of the following are advantages of the new transport system?"}],"ans":{"1":{"raw":"True","v":"T","ex":"City transport developed slower than other means of communication. Meaning: Did city transport develop slower in comparison with other means of communication? Answer: True Part of the passage: THIS is ludicrous! We can talk to people anywhere in the world or fly to meet them in a few hours. We can even send probes to other planets. But when it comes to getting around our cities, we depend on systems that have scarcely changed since the days of Gottlieb Daimler. Explanation: Talking to people, sending probes to other planets are two means of communication which are faster than getting around in cities."},"2":{"raw":"False","v":"F","ex":"The pollution caused by city transport has been largely ignored. Meaning: Has the issue of pollution from city transport been largely ignored? Answer: False Part of the passage: In recent years, the pollution belched out by millions of vehicles has dominated the debate about transport. The problem has even persuaded Califor- nia—that home of car culture—to curb traffic growth. Explanation: It has NOT been ignored, in fact the opposite is true: it dominated the debate, even persuaded California to curb (limit) traffic growth."},"3":{"raw":"Not Given","v":"NG","ex":"Most states in America have taken actions to reduce vehicle growth. Meaning: Have the majority of states in America taken action to reduce vehicle growth? Answer: Not Given Part of the passage: The problem has even persuaded California—that home of car culture—to curb traffic growth. But no matter how green they become, cars are unlikely to get us around crowded cities any faster. Explanation: This part of the passage mentions only California, but no any other state."},"4":{"raw":"Not Given","v":"NG","ex":"Public transport is particularly difficult to use on steep hills. Meaning: Is it difficult to use public transport on steep hills? Answer: Not Given Part of the passage: And persuading people to use trains and buses will always be an uphill struggle. Cars, after all, are popular for very good reasons, as anyone with small children or heavy shopping knows. Explanation: an uphill struggle/battle/fight (idiom) - needing a large amount of effort (it is not related to steep hills at all)"},"5":{"raw":"True","v":"T","ex":"Private cars are much more convenient for those who tend to buy a lot of things during shopping. Meaning: Are private cars much more convenient for those with heavy shopping? Answer: True Part of the passage:Cars, after all, are popular for very good reasons, as anyone with small children or heavy shopping knows."},"6":{"raw":"False","v":"F","ex":"Government should impose compulsory restrictions on car use. Meaning: Should governments introduce compulsory (must) restrictions on car use? Answer: False Part of the passage: So politicians should be trying to lure people out of their cars, not forcing them out. Explanation: NOT force them out = opposite of compulsory restrictions"},"7":{"raw":"A PRT only","v":"A","ex":"It is likely to be resisted by both individuals and manufacturers. Answer: A PRT only Part of the passage: With PRT, the infrastructure would have to come first—and that would cost megabucks. What’s more, any transport system that threatened the car’s dominance would be up against all those with a stake in maintaining the status quo, from private car owners to manufacturers and oil multinationals. ....Unlike PRT, such a system (RUF) could grow organically, as each network would serve a large area around it and people nearby could buy into it. And a dual-mode system might even win the support of car manufacturers, who could easily switch to producing dual-mode vehicles."},"8":{"raw":"C both PRT and RUF","v":"C","ex":"It can run at high speed in cities. Answer: C both PRT and RUF Part of the passage: with no traffic lights, pedestrians or parked cars to slow things down, PRT guideways can carry far more traffic, nonstop, than any inner city road.... the RUF vehicle—the term comes from a Danish saying meaning to “go fast”—would become an electric car."},"9":{"raw":"C both PRT and RUF","v":"C","ex":"It is not necessary to share with the general public. Answer: C both PRT and RUF Part of the passage: You wouldn’t have to share your space with strangers, and with no traffic lights, pedestrians or parked cars to slow things down, PRT guideways can carry far more traffic, nonstop, than any inner city road. Explanation: there is nothing about sharing with regard to RUF (dual-mode driving) system."},"10":{"raw":"A PRT only","v":"A","ex":"It is always controlled by a computer. Answer: A PRT only Part of the passage: The Danish RUF system envisaged by Palle Jensen, for example, resembles PRT but with one key difference: vehicles have wheels as well as a slot allow- ing them to travel on a monorail, so they can drive off the rail onto a normal road. Explanation: with PRT, you hop into a computer-controlled car, but what makes RUF different from PRT is that it can also be converted into a usual human-drive car mode."},"11":{"raw":"B RUF only","v":"B","ex":"It can run on existing roads. Answer: B RUF only Part of the passage: The Danish RUF system envisaged by Palle Jensen, for exam- ple, resembles PRT but with one key difference: vehicles have wheels as well as a slot allowing them to travel on a monorail, so they can drive off the rail onto a normal road. Explanation: See Q10 explanation."},"12":{"raw":"B RUF only","v":"B","ex":"It can be bought by private buyers. Answer: B RUF only Part of the passage: Build a fast network of guideways in a busy city centre and people would have a strong incentive not just to use public RUF vehicles, but also to buy their own dual-mode vehicle. Explanation: the text does not mention that PRT can be owned by individuals, but makes it clear that this idea is not accepted by private car owners, so one can make the inference that PRT vehicles cannot be bought."},"13":{"raw":"C low pollution, E speed, F safety","v":"C,E,F","ex":"Answer: C low pollution Part of the passage: In recent years, the pollution belched out by millions of vehicles has dominated the debate about transport. The problem has even persuaded Califor- nia—that home of car culture—to curb traffic growth. But no matter how green they be- come, cars are unlikely to get us around crowded cities any faster. And persuading peo- ple to use trains and buses will always be an uphill struggle. Cars, after all, are popular for very good reasons, as anyone with small children or heavy shopping knows. So politicians should be trying to lure people out of their cars, not forcing them out. There’s certainly no shortage of alternatives. Perhaps the most attractive is the concept known as personal rapid transit (PRT), independently invented in the US and Europe in the 1950s. Answer: E speed Part of the passage: and with no traffic lights, pedestrians or parked cars to slow things down, PRT guideways can carry far more traffic, nonstop, than any inner city road. Answer: F safety Part of the passage: Of course, creating a new transport system will not be cheap or easy. But unlike adding a dedicated bus lane here or extending the underground railway there, an innovative system such as Jensen’s could transform cities. And it’s not just a matter of saving a few minutes a day. According to the Red Cross, more than 30 million people have died in road accidents in the past century—three times the number killed in the First World War—and the annual death toll is rising. And what’s more, the Red Cross believes road accidents will become the third biggest cause of death and disability by 2020, ahead of diseases such as AIDS and tuberculosis. Surely we can find a better way to get around?"}},"words":[{"w":"Scarcely","pos":"adv","def":"only just or almost not","lvl":"C2","ex":"I was scarcely able to move my arm after the accident","ar":"بالكاد"},{"w":"Belch out","pos":"v","def":"to produce a large amount of a substance such as gas or smoke, especially when this is unpleasant or harmful, or to be produced like this","lvl":"","ex":"The exhaust pipe belched out dense black smoke","ar":"ينفث"},{"w":"Curb","pos":"v","def":"to control or limit something that is not wanted","lvl":"C2","ex":"The government should act to curb tax evasion","ar":"يحدّ من"},{"w":"Uphill struggle","pos":"n","def":"something that is very difficult to do and needs a lot of efforts and determination","lvl":"","ex":"Rehabilitation will be an uphill struggle","ar":"معركة صعبة"},{"w":"Lure","pos":"n","def":"the quality or power that something or someone has that make it, him, or her attractive","lvl":"C2","ex":"The lure of fame/power/money","ar":"إغراء / جاذبية"},{"w":"Hop into","pos":"v","def":"to go somewhere quickly or to go into or out of a vehicle quickly","lvl":"C1","ex":"We hopped over to Bruges for the weekend","ar":"يقفز إلى (السيارة)"},{"w":"Stack","pos":"v","def":"a pile of things arranged one on top of another","lvl":"","ex":"He chose a cartoon from the stack of DVDs on the shelf","ar":"كومة / يكدّس"},{"w":"Status quo","pos":"n","def":"the present situation","lvl":"","ex":"Certain people always want to maintain the status quo","ar":"الوضع الراهن"},{"w":"Doomed","pos":"adj","def":"certain to fail, die, or be destroyed","lvl":"","ex":"This is a doomed city","ar":"محكوم عليه بالفشل"},{"w":"Envisage","pos":"v","def":"to imagine or expect something in the future, especially something good","lvl":"C1","ex":"Train fare of 15 percent are envisaged for the next year","ar":"يتصوّر"},{"w":"Incentive","pos":"n","def":"something that encourages a person to do something","lvl":"C2","ex":"Tax incentives have been very effective in encouraging people to save and invest more of their income","ar":"حافز"}]},{"n":17,"pp":2,"title":"Bird Migration","untitled":false,"intro":null,"paras":[{"L":"A","t":"Birds have many unique design features that enable them to perform such amazing feats of endurance. They are equipped with lightweight, hollow bones, intricately designed feathers providing both lift and thrust for rapid flight, navigation systems superior to any that man has developed, and an ingenious heat conserving design that, among other things, concentrates all blood circulation beneath layers of warm, waterproof plumage, leaving them fit to face life in the harshest of climates. Their respiratory systems have to perform efficiently during sustained flights at altitude, so they have a system of extracting oxygen from their lungs that far exceeds that of any other animal. During the later stages of the summer breeding season, when food is plentiful, their bodies are able to accumulate considerable layers of fat, in order to provide sufficient energy for their long migratory flights.","foot":false},{"L":"B","t":"The fundamental reason that birds migrate is to find adequate food during the winter months when it is in short supply. This particularly applies to birds that breed in the temperate and Arctic regions of the Northern Hemisphere, where food is abundant during the short growing season. Many species can tolerate cold temperatures if food is plentiful, but when food is not available they must migrate. However, intriguing questions remain.","foot":false},{"L":"C","t":"One puzzling fact is that many birds journey much further than would be necessary just to find food and good weather. Nobody knows, for instance, why British swallows, which could presumably survive equally well if they spent the winter in equatorial Africa, instead fly several thousands of miles further to their preferred winter home in South Africa’s Cape Province. Another mystery involves the huge migrations performed by arctic terns and mudflat-feeding shorebirds that breed close to Polar Regions. In general, the further north a migrant species breeds, the further south it spends the winter. For arctic terns this necessitates an annual round trip of 25,000 miles. Yet, en route to their final destination in far-flung southern latitudes, all these individuals overfly other areas of seemingly suitable habitat spanning two hemispheres. While we may not fully understand birds’ reasons for going to particular places, we can marvel at their feats.","foot":false},{"L":"D","t":"One of the greatest mysteries is how young birds know how to find the traditional wintering areas without parental guidance. Very few adults migrate with juveniles in tow, and youngsters may even have little or no inkling of their parents’ appearance. A familiar example is that of the cuckoo, which lays its eggs in another species’ nest and never encounters its young again. It is mind boggling to consider that, once raised by its host species, the young cuckoo makes it own way to ancestral wintering grounds in the tropics before returning single-handedly to northern Europe the next season to seek out a mate among its own kind. The obvious implication is that it inherits from its parents an inbuilt route map and direction- finding capability, as well as a mental image of what another cuckoo looks like. Yet nobody has the slightest idea as to how this is possible.","foot":false},{"L":"E","t":"Mounting evidence has confirmed that birds use the positions of the sun and stars to obtain compass directions. They seem also to be able to detect the earth’s magnetic field, probably due to having minute crystals of magnetite in the region of their brains. However, true navigation also requires an awareness of position and time, especially when lost. Experiments have shown that after being taken thousands of miles over an unfamiliar landmass, birds are still capable of returning rapidly to nest sites. Such phenomenal powers are the product of computing a number of sophisticated cues, including an inborn map of the night sky and the pull of the earth’s magnetic field. How the birds use their ‘instruments’ remains unknown, but one thing is clear: they see the world with a superior sensory perception to ours. Most small birds migrate at night and take their direction from the position of the setting sun. However, as well as seeing the sun go down, they also seem to see the plane of polarized light caused by it, which calibrates their compass. Traveling at night provides other benefits. Daytime predators are avoided and the danger of dehydration due to flying for long periods in warm, sunlit skies is reduced. Furthermore, at night the air is generally cool and less turbulent and so conducive to sustained, stable flight.","foot":false},{"L":"F","t":"Nevertheless, all journeys involve considerable risk, and part of the skill in arriving safely is setting off at the right time. This means accurate weather forecasting, and utilizing favorable winds. Birds are adept at both, and, in laboratory tests, some have been shown to detect the minute difference in barometric pressure between the floor and ceiling of a room. Often birds react to weather changes before there is any visible sign of them. Lapwings, which feed on grassland, flee west from the Netherlands to the British Isles, France and Spain at the onset of a cold snap. When the ground surface freezes the birds could starve. Yet they return to Holland ahead of a thaw, their arrival linked to a pressure change presaging an improvement in the weather.","foot":false},{"L":"G","t":"In one instance a Welsh Manx shearwater carried to America and released was back in its burrow on Skokholm Island, off the Pembrokeshire coast, one day before a letter announcing its release! Conversely, each autumn a small number of North American birds are blown across the Atlantic by fast-moving westerly tail winds. Not only do they arrive safely in Europe, but, based on ringing evidence, some make it back to North America the following spring, after probably spending the winter with European migrants in sunny African climes.","foot":false}],"groups":[{"a":14,"b":20,"k":"head","instr":["Reading passage 2 has seven paragraphs, A–G.","Choose the correct heading for each paragraph from the list of headings below.","Write the correct number, i–x, in boxes 14–20 on your answer sheet."],"items":[{"n":14,"t":"Paragraph A","opts":[]},{"n":15,"t":"Paragraph B","opts":[]},{"n":16,"t":"Paragraph C","opts":[]},{"n":17,"t":"Paragraph D","opts":[]},{"n":18,"t":"Paragraph E","opts":[]},{"n":19,"t":"Paragraph F","opts":[]},{"n":20,"t":"Paragraph G","opts":[]}],"opts":[{"k":"i","t":"The best moment to migrate"},{"k":"ii","t":"The unexplained rejection of closer feeding ground"},{"k":"iii","t":"The influence of weather on the migration route"},{"k":"iv","t":"Physical characteristics that allow birds to migrate"},{"k":"v","t":"The main reason why birds migrate"},{"k":"vi","t":"The best wintering grounds for birds"},{"k":"vii","t":"Research findings on how birds migrate"},{"k":"viii","t":"Successful migration despite trouble of wind"},{"k":"ix","t":"Contrast between long-distance migration and short-distance migration"},{"k":"x","t":"Mysterious migration despite lack of teaching"}],"ctx":[],"optTitle":"List of headings"},{"a":21,"b":22,"k":"multi","instr":["Choose TWO letters, A–E.","Write the correct letters in boxes 21 and 22 on your answer sheet."],"items":[],"opts":[{"k":"A","t":"Birds often fly further than they need to."},{"k":"B","t":"Birds traveling in family groups are safe."},{"k":"C","t":"Birds flying at night need less water."},{"k":"D","t":"Birds have much sharper eye-sight than humans."},{"k":"E","t":"Only shorebirds are resistant to strong winds."}],"ctx":[],"count":2,"q":"Which TWO of the following statements are true of bird migration?"},{"a":23,"b":26,"k":"gap","instr":["Complete the sentences below using NO MORE THAN ONE WORD OR A NUMBER from the passage.","Write your answers in boxes 23–26 on your answer sheet."],"items":[{"n":23,"t":"It is a great mystery that young birds like cuckoos can find their wintering grounds without …………… .","opts":[]},{"n":24,"t":"Evidence shows birds can tell directions like a ……………. by observing the sun and the stars.","opts":[]},{"n":25,"t":"One advantage for birds flying at night is that they can avoid contact with …………… .","opts":[]},{"n":26,"t":"Laboratory tests show that birds can detect weather without …………… signs.","opts":[]}],"opts":[],"ctx":[]}],"ans":{"14":{"raw":"IV Physical characteristics that allow birds to migrate","v":"iv","ex":"Paragraph A Answer: IV Physical characteristics that allow birds to migrate Part of the passage: Birds have many unique design features that enable them to perform such amazing feats of endurance. They are equipped with lightweight, hollow bones, intricately designed feathers providing both lift and thrust for rapid flight, naviga- tion systems superior to any that man has developed, and an ingenious heat conserv- ing design that, among other things, concentrates all blood circulation beneath layers of warm, waterproof plumage, leaving them fit to face life in the harshest of climates. Their respiratory systems have to perform efficiently during sustained flights at altitude, so they have a system of extracting oxygen from their lungs that far exceeds that of any other an- imal. During the later stages of the summer breeding season, when food is plentiful, their bodies are able to accumulate considerable layers of fat, in order to provide sufficient energy for their long migratory flights."},"15":{"raw":"V The main reason why birds migrate","v":"v","ex":"Paragraph B Answer: V The main reason why birds migrate Part of the passage: The fundamental reason that birds migrate is to find adequate food during the winter months when it is in short supply. This particularly applies to birds that breed in the temperate and Arctic regions of the Northern Hemisphere, where food is abundant during the short growing season. Many species can tolerate cold temperatures if food is plentiful, but when food is not available they must migrate. However, intriguing questions remain."},"16":{"raw":"II The unexplained rejection of closer feeding ground","v":"ii","ex":"Paragraph C Answer: II The unexplained rejection of closer feeding ground Part of the passage: One puzzling fact is that many birds journey much further than would be necessary just to find food and good weather. Nobody knows, for instance, why British swallows, which could presumably survive equally well if they spent the winter in equatorial Africa, instead fly several thousands of miles further to their preferred winter home in South Africa’s Cape Province. Another mystery involves the huge migrations performed by arctic terns and mudflat-feeding shorebirds that breed close to Polar Re- gions. In general, the further north a migrant species breeds, the further south it spends the winter. For arctic terns this necessitates an annual round trip of 25,000 miles. Yet, en route to their final destination in far-flung southern latitudes, all these individuals overfly other areas of seemingly suitable habitat spanning two hemispheres. While we may not fully understand birds’ reasons for going to particular places, we can marvel at their feats."},"17":{"raw":"X Mysterious migration despite lack of teaching","v":"x","ex":"Paragraph D Answer: X Mysterious migration despite lack of teaching Part of the passage: One of the greatest mysteries is how young birds know how to find the traditional wintering areas without parental guidance. Very few adults migrate with juveniles in tow, and youngsters may even have little or no inkling of their parents’ appearance. A familiar example is that of the cuckoo, which lays its eggs in another species’ nest and never encounters its young again. It is mind boggling to consider that, once raised by its host species, the young cuckoo makes it own way to ancestral winter- ing grounds in the tropics before returning single-handedly to northern Europe the next season to seek out a mate among its own kind. The obvious implication is that it inherits from its parents an inbuilt route map and direction-finding capability, as well as a mental image of what another cuckoo looks like. Yet nobody has the slightest idea as to how this is possible."},"18":{"raw":"VII Research findings on how birds migrate","v":"vii","ex":"Paragraph E Answer: VII Research findings on how birds migrate Part of the passage: Mounting evidence has confirmed that birds use the positions of the sun and stars to obtain compass directions. They seem also to be able to detect the earth’s magnetic field, probably due to having minute crystals of magnetite in the region of their brains. However, true navigation also requires an awareness of position and time, especially when lost. Experiments have shown that after being taken thousands of miles over an unfamiliar landmass, birds are still capable of returning rapidly to nest sites. Such phenomenal powers are the product of computing a number of sophisticated cues, including an inborn map of the night sky and the pull of the earth’s magnetic field. How the birds use their ‘instruments’ remains unknown, but one thing is clear: they see the world with a superior sensory perception to ours. Most small birds migrate at night and take their direction from the position of the setting sun. However, as well as seeing the sun go down, they also seem to see the plane of polarized light caused by it, which calibrates their compass. Traveling at night provides other benefits. Daytime predators are avoided and the danger of dehydration due to flying for long periods in warm, sunlit skies is reduced. Furthermore, at night the air is generally cool and less turbulent and so conducive to sustained, stable flight. Explanation: At first, I thought the correct heading was I The best moment to migrate, and I disregarded the heading VII Research findings on how birds migrate because I focused on the word “findings”, rather than more important part “how birds migrate”. Now I highlighted this part in blue as well the part of the passage which paraphrases this idea in the same color. I hope"},"19":{"raw":"I The best moment to migrate","v":"i","ex":"Paragraph F Answer: I The best moment to migrate Part of the passage: Nevertheless, all journeys involve considerable risk, and part of the skill in arriving safely is setting off at the right time. This means accurate weather forecasting, and utilizing favorable winds. Birds are adept at both, and, in laboratory tests, some have been shown to detect the minute difference in barometric pressure between the floor and ceiling of a room. Often birds react to weather changes before there is any visible sign of them. Lapwings, which feed on grassland, flee west from the Netherlands to the British Isles, France and Spain at the onset of a cold snap. When the ground surface freezes the birds could starve. Yet they return to Holland ahead of a thaw, their arrival linked to a pressure change presaging an improvement in the weather."},"20":{"raw":"VIII Successful migration despite trouble of wind","v":"viii","ex":"Paragraph G Answer: VIII Successful migration despite trouble of wind Part of the passage: In one instance a Welsh Manx shearwater carried to America and released was back in its burrow on Skokholm Island, off the Pembrokeshire coast, one day before a letter announcing its release! Conversely, each autumn a small number of North American birds are blown across the Atlantic by fast-moving westerly tail winds. Not only do they arrive safely in Europe, but, based on ringing evidence, some make it back to North America the following spring, after probably spending the winter with European migrants in sunny African climes."},"21":{"raw":"A Birds often fly further than they need to.","v":"A","ex":"Answer: A Birds often fly further than they need to. Part of the passage [Par C]: that many birds journey much further than would be necessary just to find food and good weather. Answer: C Birds flying at night need less water. Part of the passage [Par E]: Traveling at night provides other benefits. Daytime pred- ators are avoided and the danger of dehydration due to flying for long periods in warm, sunlit skies is reduced. Furthermore, at night the air is generally cool and less turbulent and so conducive to sustained, stable flight. Comment: B is incorrect because Par C mentions how young birds can find their way while migrating without parental guidance (no family, but still safe); D is very close, but still not 100% correct because even though Par E mentions birds see the world with a superior sensory perception to ours, it does not specifically say birds have sharper eye-sight than humans. Sensory perception is not only about vision, but also includes other senses such as taste, smell, touch and etc. E is incorrect because of the limiting word ‘only’.","set":["A","C"]},"22":{"raw":"C Birds flying at night need less water.","v":"C","ex":"Answer: A Birds often fly further than they need to. Part of the passage [Par C]: that many birds journey much further than would be necessary just to find food and good weather. Answer: C Birds flying at night need less water. Part of the passage [Par E]: Traveling at night provides other benefits. Daytime pred- ators are avoided and the danger of dehydration due to flying for long periods in warm, sunlit skies is reduced. Furthermore, at night the air is generally cool and less turbulent and so conducive to sustained, stable flight. Comment: B is incorrect because Par C mentions how young birds can find their way while migrating without parental guidance (no family, but still safe); D is very close, but still not 100% correct because even though Par E mentions birds see the world with a superior sensory perception to ours, it does not specifically say birds have sharper eye-sight than humans. Sensory perception is not only about vision, but also includes other senses such as taste, smell, touch and etc. E is incorrect because of the limiting word ‘only’.","set":["A","C"]},"23":{"raw":"guidance","v":"guidance","ex":"It is a great mystery that young birds like cuckoos can find their wintering grounds without …………… . Answer: guidance Part of the passage [Par D]: One of the greatest mysteries is how young birds know how to find the traditional wintering areas without parental guidance."},"24":{"raw":"compass","v":"compass","ex":"Evidence shows birds can tell directions like a ……………. by observing the sun and the stars. Answer: compass Part of the passage [Par E]: Mounting evidence has confirmed that birds use the positions of the sun and stars to obtain compass directions."},"25":{"raw":"predators","v":"predators","ex":"One advantage for birds flying at night is that they can avoid contact with …………… . Answer: predators Part of the passage [Par E]: Traveling at night provides other benefits. Daytime predators are avoided..."},"26":{"raw":"visible","v":"visible","ex":"Laboratory tests show that birds can detect weather without …………… signs. Answer: visible Part of the passage [Par F]: Often birds react to weather changes before there is any visible sign of them."}},"words":[{"w":"Superior","pos":"adj","def":"better than average or better than other people or things of the same type","lvl":"C1","ex":"This is clearly the work of a superior artist","ar":"متفوّق"},{"w":"Ingenious","pos":"adj","def":"very clever and skillful, or cleverly made and involving new ideas and methods","lvl":"","ex":"An ingenious solution","ar":"عبقري / بارع"},{"w":"Plentiful","pos":"adj","def":"if something is plentiful, there is a lot of it available","lvl":"","ex":"Strawberries are plentiful in the summer","ar":"وفير"},{"w":"Accumulate","pos":"v","def":"to collect a large number of things over a long period of time","lvl":"C2","ex":"As people accumulate more wealth, they tend to spend a greater proportion of their incomes","ar":"يجمع / يتراكم"},{"w":"Abundant","pos":"adj","def":"more than enough","lvl":"","ex":"An abundant supply of food","ar":"وفير جدًا"},{"w":"Intriguing","pos":"adj","def":"very interesting because of being unusual or mysterious","lvl":"C2","ex":"An intriguing possibility/question","ar":"مثير للفضول"},{"w":"Puzzling","pos":"adj","def":"difficult to explain and understand","lvl":"","ex":"it is a rather puzzling film","ar":"محيّر"},{"w":"Presumably","pos":"adv","def":"used to say what you think is the likely situation","lvl":"B2","ex":"They can presumably afford to buy a bigger apartment","ar":"على الأرجح"},{"w":"En route","pos":"adv","def":"on the way to or from somewhere","lvl":"","ex":"I stopped en route to the party and got some wine","ar":"في الطريق"},{"w":"Span","pos":"v","def":"to exist or continue for a particular length of time","lvl":"","ex":"Tennis has a history spanning several centuries","ar":"يمتد (زمنيًا)"},{"w":"Marvel","pos":"v","def":"to show or experience great surprise or admiration","lvl":"","ex":"We paused to marvel at the view","ar":"يتعجّب"},{"w":"Juvenile","pos":"adj","def":"relating to a young person who is not yet old enough to be considered an adult","lvl":"C1","ex":"Juvenile crime/offenders","ar":"صغير السن / يافع"},{"w":"Mind-boggling","pos":"adj","def":"extremely surprising and difficult to understand or imagine","lvl":"","ex":"She was paid the mind-boggling sum of ten million pounds for that film","ar":"يحيّر العقل"},{"w":"Implication","pos":"n","def":"the effect that an action or decision will have on something else in the future","lvl":"C1","ex":"The company is cutting back its spending and I wonder what the implication will be for our department","ar":"تبعة / أثر"},{"w":"Inbuilt","pos":"adj","def":"describes something that is an original part of something or someone and cannot be separated from them","lvl":"","ex":"An inbuilt advantage","ar":"فطري / مدمج"},{"w":"Mounting","pos":"adj","def":"gradually increasing","lvl":"","ex":"Mounting anxiety","ar":"متزايد"},{"w":"Dehydration","pos":"n","def":"to lose water, or to cause water to be lost from something, especially from a person’s body","lvl":"","ex":"Air travel dehydrates the body","ar":"الجفاف"},{"w":"Turbulent","pos":"adj","def":"involving a lot of sudden changes, arguments, or violence","lvl":"C2","ex":"A turbulent marriage","ar":"مضطرب"},{"w":"Conducive","pos":"adj","def":"providing the right conditions for something good to happen or exist","lvl":"","ex":"Such a noisy environment was not conducive to a good night’s sleep","ar":"مُهيِّئ / مساعد على"},{"w":"Sustained","pos":"adj","def":"continuing for a long time","lvl":"","ex":"The president’s speech was greeted by sustained applause","ar":"مستمر"},{"w":"Forecast","pos":"v","def":"to say what you expect to happen in the future","lvl":"","ex":"The forecast a large drop in unemployment over the next two years","ar":"يتنبّأ"},{"w":"Minute","pos":"adj","def":"extremely small","lvl":"C2","ex":"a minute amount","ar":"ضئيل جدًا"}]},{"n":18,"pp":3,"title":"Preschoolers and video games","untitled":true,"intro":null,"paras":[{"L":null,"t":"Although video games were first developed for adults, they are no longer exclusively reserved for the grown ups in the home. In 2006, Rideout and Hamel reported that as many as 29 percent of preschool children (children between two and six years old) in the United States had played console video games, and 18 percent had played hand- held ones. Given young children’s insatiable eagerness to learn, coupled with the fact that they are clearly surrounded by these media, we predict that preschoolers will both continue and increasingly begin to adopt video games for personal enjoyment Although the majority of gaming equipment is still designed for a much older target audience, once a game system enters the household it is potentially available for all family members, including the youngest. Portable systems have done a particularly good job of penetrating the younger market.","foot":false},{"L":null,"t":"Research in the video game market is typically done at two stages: some time close to the end of the product cycle, in order to get feedback from consumers, so that a marketing strategy can be developed; and at the very end of the product cycle to ‘fix bugs’ in the game. While both of those types of research are important, and may be appropriate for dealing with adult consumers, neither of them aids in designing better games, especially when it comes to designing for an audience that may have particular needs, such as preschoolers or senior citizens. Instead, exploratory and formative research has to be undertaken in order to truly understand those audiences, their abilities, their perspective, and their needs. In the spring of 2007, our preschool-game production team at Nickelodeon had a hunch that the Nintendo DS* — with its new features, such as the microphone, small size and portability, and its relatively low price point — was a ripe gaming platform for preschoolers. There were a few games on the market at the time which had characters that appealed to the younger set, but our game producers did not think that the game mechanics or design were appropriate for preschoolers. What exactly preschoolers could do with the system, however, was a bit of a mystery. So we set about doing a study to answer the query: What could we expect preschoolers to be capable of in the context of hand-held game play, and how might the child development literature inform us as we proceeded with the creation of a new outlet for this age group?","foot":false},{"L":null,"t":"Our context in this case was the United States, although the games that resulted were also released in other regions, due to the broad international reach of the characters. In order to design the best possible DS product for a preschool audience we were fully committed to the ideals of a ‘user-centered approach’, which assumes that users will be at least considered, but ideally consulted during the development process. After all, when it comes to introducing a new interactive product to the child market, and particularly such a young age group within it, we believe it is crucial to assess the range of physical and cognitive abilities associated with their specific developmental stage.","foot":false},{"L":null,"t":"Revelle and Medoff (2002) review some of the basic reasons why home entertainment systems, computers, and other electronic gaming devices, are often difficult for preschoolers to use. In addition to their still developing motor skills (which make manipulating a controller with small buttons difficult), many of the major stumbling blocks are cognitive. Though preschoolers are learning to think symbolically, and understand that pictures can stand for real-life objects, the vast majority are still unable to read and write. Thus, using text-based menu selections is not viable. Mapping is yet another obstacle since preschoolers may be unable to understand that there is a direct link between how the controller is used and the activities that appear before them on screen. Though this aspect is changing, in traditional mapping systems real life movements do not usually translate into game-based activity.","foot":false},{"L":null,"t":"Over the course of our study, we gained many insights into how preschoolers interact with various platforms, including the DS. For instance, all instructions for preschoolers need to be in voiceover, and include visual representations, and this has been one of the most difficult areas for us to negotiate with respect to game design on the DS. Because the game cartridges have very limited memory capacity, particularly in comparison to console or computer games, the ability to capture large amounts of voiceover data via sound files or visual representations of instructions becomes limited. Text instructions take up minimal memory, so they are preferable from a technological perspective. Figuring out ways to maximise sound and graphics files, while retaining the clear visual and verbal cues that we know are critical for our youngest players, is a constant give and take. Another of our findings indicated that preschoolers may use either a stylus, or their fingers, or both although they are not very accurate with either. One of the very interesting aspects of the DS is that the interface, which is designed to respond to stylus interactions, can also effectively be used with the tip of the finger. This is particularly noteworthy in the context of preschoolers for two reasons. Firstly, as they have trouble with fine motor skills and their hand-eye coordination is still in development, they are less exact with their stylus movements; and secondly, their fingers are so small that they mimic the stylus very effectively, and therefore by using their fingers they can often be more accurate in their game interactions.","foot":false},{"L":null,"t":"* a brand of hand-held electronic games","foot":true}],"groups":[{"a":27,"b":31,"k":"yn","instr":["Do the following statements agree with the claims of the writer in Reading Passage 3?","In boxes 27–31 on your answer sheet, write"],"items":[{"n":27,"t":"Video game use amongst preschool children is higher in the US than in other countries.","opts":[]},{"n":28,"t":"The proportion of preschool children using video games is likely to rise.","opts":[]},{"n":29,"t":"Parents in the US who own gaming equipment generally allow their children to play with it.","opts":[]},{"n":30,"t":"The type of research which manufacturers usually do is aimed at improving game design.","opts":[]},{"n":31,"t":"Both old and young games consumers require research which is specifically targeted.","opts":[]}],"opts":[],"ctx":[]},{"a":32,"b":36,"k":"match","instr":["Complete the summary using the list of words/phrases, A–I, below.","Write the correct letter, A–I, in boxes 32–36 on your answer sheet."],"items":[],"opts":[{"k":"A","t":"actions"},{"k":"B","t":"buttons"},{"k":"C","t":"cognitive skills"},{"k":"D","t":"concentration"},{"k":"E","t":"fingers"},{"k":"F","t":"pictures"},{"k":"G","t":"sounds"},{"k":"H","t":"spoken instructions"},{"k":"I","t":"written menus"}],"ctx":["Preschool children find many electronic games difficult, because neither their motor skills nor their 32 …………… are sufficiently developed. Certain types of control are hard for these children to manipulate: for example, 33 …………… can be more effective than styluses. Also, although they already have the ability to relate 34 …………… to real-world objects, preschool children are largely unable to understand the connection between their own 35 …………… and the movements they can see on the screen.Finally, very few preschool children can understand 36 …………… ."],"mode":"sum","ctitle":"Problems for preschool users of video games"},{"a":37,"b":40,"k":"mcq","instr":["Choose the correct letter, A, B, C or D.","Write the correct letter in boxes 37–40 on your answer sheet."],"items":[{"n":37,"t":"In 2007, what conclusion did games producers at Nickelodeon come to?","opts":[{"k":"A","t":"The preschool market was unlikely to be sufficiently profitable."},{"k":"B","t":"One of their hardware products would probably be suitable for preschoolers."},{"k":"C","t":"Games produced by rival companies were completely inappropriate for preschoolers."},{"k":"D","t":"They should put their ideas for new games for preschoolers into practice."}]},{"n":38,"t":"The study carried out by Nickelodeon","opts":[{"k":"A","t":"was based on children living in various parts of the world."},{"k":"B","t":"focused on the kinds of game content which interests preschoolers."},{"k":"C","t":"investigated the specific characteristics of the target market."},{"k":"D","t":"led to products which appealed mainly to the US consumers."}]},{"n":39,"t":"Which problem do the writers highlight concerning games instructions for young children?","opts":[{"k":"A","t":"Spoken instructions take up a lot of the available memory."},{"k":"B","t":"Written instructions have to be expressed very simply."},{"k":"C","t":"The children do not follow instructions consistently."},{"k":"D","t":"The video images distract attention from the instructions."}]},{"n":40,"t":"Which is the best title for Reading Passage 3?","opts":[{"k":"A","t":"An overview of video games software for the preschool market"},{"k":"B","t":"Researching and designing video games for preschool children"},{"k":"C","t":"The effects of video games on the behaviour of young children"},{"k":"D","t":"Assessing the impact of video games on educational achievement"}]}],"opts":[],"ctx":[]}],"ans":{"27":{"raw":"Not Given","v":"NG","ex":"Video game use amongst preschool children is higher in the US than in other countries. Meaning: Is it higher in the US than in other countries? Is there comparison with other countries? Answer: Not Given Part of the passage: Although video games were first developed for adults, they are no longer exclusively reserved for the grown ups in the home. In 2006, Rideout and Hamel reported that as many as 29 percent of preschool children (children between two and six years old) in the United States had played console video games, and 18 percent had played hand-held ones. Explanation: We do not know whether this figure is higher than in other countries; because the text only mentions the US."},"28":{"raw":"Yes","v":"Y","ex":"The proportion of preschool children using video games is likely to rise. Meaning: Is it going to increase in the future? Answer: Yes Part of the passage: Given young children’s insatiable eagerness to learn, coupled with the fact that they are clearly surrounded by these media, we predict that preschoolers will both continue and increasingly begin to adopt video games for personal enjoyment."},"29":{"raw":"Not Given","v":"NG","ex":"Parents in the US who own gaming equipment generally allow their children to play with it. Meaning: Are children allowed to use their parents’ gaming equipment in the US? Answer: Not Given Part of the passage: once a game system enters the household it is potentially available for all family members, including the youngest. Explanation: It does not necessarily mean that parents are explicitly giving their permission for children to use the game."},"30":{"raw":"No","v":"N","ex":"The type of research which manufacturers usually do is aimed at improving game design. Meaning: Is research usually aimed at improving the design? Answer: No Part of the passage: Research in the video game market is typically done at two stag- es: some time close to the end of the product cycle, in order to get feedback from con- sumers, so that a marketing strategy can be developed; and at the very end of the product cycle to ‘fix bugs’ in the game. While both of those types of research are im- portant, and may be appropriate for dealing with adult consumers, neither of them aids in designing better games, especially when it comes to designing for an audience that may have particular needs, such as preschoolers or senior citizens."},"31":{"raw":"Yes","v":"Y","ex":"Both old and young games consumers require research which is specifically targeted. Meaning: Do they need to conduct specific research to meet the needs of both old and young customers? Answer: Yes Part of the passage: ...especially when it comes to designing for an audience that may have particular needs, such as preschoolers or senior citizens. Instead, exploratory and formative research has to be undertaken in order to truly understand those audiences, their abilities, their perspective, and their needs."},"32":{"raw":"C cognitive skills","v":"C","ex":"Preschool children find many electronic games difficult, because neither their motor skills nor their …………… are sufficiently developed. Answer: C cognitive skills Part of the passage: In addition to their still developing motor skills (which make manip- ulating a controller with small buttons difficult), many of the major stumbling blocks are cognitive."},"33":{"raw":"E fingers","v":"E","ex":"Certain types of control are hard for these children to manipulate: for exam- ple, …………… can be more effective than styluses. Answer: E fingers Part of the passage: One of the very interesting aspects of the DS is that the interface, which is designed to respond to stylus interactions, can also effectively be used with the tip of the finger. This is particularly noteworthy in the context of preschoolers for two reasons. Firstly, as they have trouble with fine motor skills and their hand-eye coordina- tion is still in development, they are less exact with their stylus movements; and secondly, their fingers are so small that they mimic the stylus very effectively, and therefore by using their fingers they can often be more accurate in their game interactions."},"34":{"raw":"F pictures","v":"F","ex":"Also, although they already have the ability to relate 34 …………… to real-world objects... preschool children are largely unable to understand the con- nection between their own 35 …………… and the movements they can see on the screen. 34 Answer: F pictures Part of the passage: Though preschoolers are learning to think symbolically, and under- stand that pictures can stand for real-life objects. 35 Answer: A actions Part of the passage: Mapping is yet another obstacle since preschoolers may be unable to understand that there is a direct link between how the controller is used and the activ- ities that appear before them on screen."},"35":{"raw":"A actions","v":"A","ex":"Also, although they already have the ability to relate 34 …………… to real-world objects... preschool children are largely unable to understand the con- nection between their own 35 …………… and the movements they can see on the screen. 34 Answer: F pictures Part of the passage: Though preschoolers are learning to think symbolically, and under- stand that pictures can stand for real-life objects. 35 Answer: A actions Part of the passage: Mapping is yet another obstacle since preschoolers may be unable to understand that there is a direct link between how the controller is used and the activ- ities that appear before them on screen."},"36":{"raw":"I written menus","v":"I","ex":"Finally, very few preschool children can understand …………… . Answer: I written menus Part of the passage: the vast majority are still unable to read and write. Thus, using text-based menu selections is not viable."},"37":{"raw":"B One of their hardware products would probably be suitable for","v":"B","ex":"In 2007, what conclusion did games producers at Nickelodeon come to? Answer: B One of their hardware products would probably be suitable for preschoolers. Part of the passage: In the spring of 2007, our preschool-game production team at Nickelodeon had a hunch that the Nintendo DS* — with its new features, such as the microphone, small size and portability, and its relatively low price point — was a ripe gaming platform for preschoolers."},"38":{"raw":"C investigated the specific characteristics of the target market.","v":"C","ex":"The study carried out by Nickelodeon Answer: C investigated the specific characteristics of the target market. Part of the passage: What exactly preschoolers could do with the system, however, was a bit of a mystery. So we set about doing a study to answer the query: What could we expect preschoolers to be capable of in the context of hand-held game play, and how might the child development literature inform us as we proceeded with the creation of a new outlet for this age group? Explanation: It shows that the aim of the study was to find out what preschoolers might be able to do with a hand-held game and what the literature could tell them about child development."},"39":{"raw":"A Spoken instructions take up a lot of the available memory.","v":"A","ex":"Which problem do the writers highlight concerning games instructions for young children? Answer: A Spoken instructions take up a lot of the available memory. Part of the passage: Over the course of our study, we gained many insights into how preschoolers interact with various platforms, including the DS. For instance, all instruc- tions for preschoolers need to be in voiceover, and include visual representations, and this has been one of the most difficult areas for us to negotiate with respect to game design on the DS. Because the game cartridges have very limited memory capacity, particularly in comparison to console or computer games, the ability to capture large amounts of voiceover data via sound files or visual representations of instructions be- comes limited. Text instructions take up minimal memory, so they are preferable from a technological perspective."},"40":{"raw":"B Researching and designing video games for preschool children","v":"B","ex":"Which is the best title for Reading Passage 3? Answer: B Researching and designing video games for preschool children Explanation: The passage deals with a piece of research which helped to design video games for preschool children; the passage does not deal with the issues."}},"words":[{"w":"Exclusively","pos":"adv","def":"only","lvl":"C1","ex":"This offer is available exclusively to our established customers","ar":"حصريًا"},{"w":"Grown-up","pos":"n","def":"an adult, used especially when talking to children","lvl":"B2","ex":"Ask a grown-up to cut the shape out for you","ar":"شخص بالغ"},{"w":"Insatiable","pos":"adj","def":"too great to be satisfied","lvl":"","ex":"Like so many politicians, he had an insatiable appetite","ar":"لا يشبع"},{"w":"Eagerness","pos":"n","def":"wanting very much to do or have something, especially something interesting or enjoyable","lvl":"B2","ex":"The children’s eager faces","ar":"حماس / لهفة"},{"w":"Penetrate","pos":"v","def":"to move into or through something","lvl":"","ex":"Amazingly, the bullet did not penetrate his brain","ar":"يخترق / يدخل"},{"w":"Ripe","pos":"adj","def":"completely developed and ready to be used","lvl":"B2","ex":"Those bananas are not ripe yet – they are still green","ar":"ناضج / مهيّأ"},{"w":"Appeal","pos":"v","def":"to interest or attract someone","lvl":"B2","ex":"It is a programme designed to appeal mainly to 16 to 25-years-olds","ar":"يجذب"},{"w":"Proceed","pos":"v","def":"to continue as planed","lvl":"C1","ex":"His lawyers have decided not to proceed with the case","ar":"يمضي قُدُمًا"},{"w":"Stumbling block","pos":"n","def":"something that prevents action or agreement","lvl":"","ex":"Lack of willingness to compromise on both sides is the main stumbling block to reaching a settlement","ar":"عقبة"},{"w":"Insight","pos":"n","def":"a clear, deep, and sometimes sudden understanding of a complicated problem or situation","lvl":"C1","ex":"It was an interesting book, full of fascinating insights into human relationships","ar":"فهم عميق"},{"w":"Retain","pos":"v","def":"to keep or continue to have something","lvl":"C2","ex":"She has lost her battle to retain control of the company","ar":"يحتفظ بـ"},{"w":"Cue","pos":"n","def":"a signal for someone to do something","lvl":"","ex":"They started washing up, so that was our cue to leave the party.","ar":"إشارة / تلميح"}]},{"n":19,"pp":1,"title":"The MIT factor: celebrating 150 years of maverick genius","untitled":false,"intro":"by Ed Pilkington The Massachusetts Institute of Technology has led the world into the future for 150 years with scientific innovations.","paras":[{"L":null,"t":"The musician Yo-Yo Ma’s cello may not be the obvious starting point for a journey into one of the world’s great universities. But, as you quickly realise when you step inside the Massachusetts Institute of Technology, there’s precious little going on that you would normally see on a university campus. The cello, resting in a corner of MIT’s celebrated media laboratory – a hub of creativity – looks like any other electric classical instrument. But it is much more. Machover, the composer, teacher and inventor responsible for its creation, calls it a ‘hyperinstrument’, a sort of thinking machine that allows Ma and his cello to interact with one another and make music together. ‘The aim is to build an instrument worthy of a great musician like Yo-Yo Ma that can understand what he is trying to do and respond to it,’ Machover says. The cello has numerous sensors across its body and by measuring the pressure, speed and angle of the virtuoso’s performance it can interpret his mood and engage with it, producing extraordinary new sounds. The virtuoso cellist frequently performs on the instrument as he tours around the world.","foot":false},{"L":null,"t":"Machover’s passion for pushing at the boundaries of the existing world to extend and unleash human potential is not a bad description of MIT as a whole. This unusual community brings highly gifted, highly motivated individuals together from a vast range of disciplines, united by a common desire: to leap into the dark and reach for the unknown.","foot":false},{"L":null,"t":"The result of that single unifying ambition is visible all around. For the past 150 years, MIT has been leading the world into the future. The discoveries of its teachers and students have become the common everyday objects that we now all take for granted. The telephone, electromagnets, radars, high-speed photography, office photocopiers, cancer treatments, pocket calculators, computers, the Internet, the decoding of the human genome, lasers, space travel … the list of innovations that involved essential contributions from MIT and its faculty goes on and on.","foot":false},{"L":null,"t":"From the moment MIT was founded by William Barton Rogers in 1861, it was clear what it was not. While Harvard stuck to the English model of a classical education, with its emphasis on Latin and Greek, MIT looked to the German system of learning based on research and hands-on experimentation. Knowledge was at a premium, but it had to be useful.","foot":false},{"L":null,"t":"This down-to-earth quality is enshrined in the school motto, Mens et manus – Mind and hand – as well as its logo, which shows a gowned scholar standing beside an ironmonger bearing a hammer and anvil. That symbiosis of intellect and craftsmanship still suffuses the institute’s classrooms, where students are not so much taught as engaged and inspired.","foot":false},{"L":null,"t":"Take Christopher Merrill, 21, a third-year undergraduate in computer science. He is spending most of his time on a competition set in his robotics class. The contest is to see which student can most effectively program a robot to build a house out of blocks in under ten minutes. Merrill says he could have gone for the easiest route – designing a simple robot that would build the house quickly. But he wanted to try to master an area of robotics that remains unconquered – adaptability, the ability of the robot to rethink its plans as the environment around it changes, as would a human. ‘I like to take on things that have never been done before rather than to work in an iterative way just making small steps forward,’ he explains.","foot":false},{"L":null,"t":"Merrill is already planning the start-up he wants to set up when he graduates in a year’s time. He has an idea for an original version of a contact lens that would augment reality by allowing consumers to see additional visual information. He is fearful that he might be just too late in taking his concept to market, as he has heard that a Silicon Valley firm is already developing something similar. As such, he might become one of many MIT graduates who go on to form companies that fail. Alternatively, he might become one of those who go on to succeed in spectacular fashion. And there are many of them. A survey of living MIT alumni* found that they have formed 25,800 companies, employing more than three million people, including about a quarter of the workforce of Silicon Valley. What MIT delights in is taking brilliant minds from around the world in vastly diverse disciplines and putting them together. You can see that in its sparkling new David Koch Institute for Integrative Cancer Research, which brings scientists, engineers and clinicians under one roof. Or in its Energy Initiative, which acts as a bridge for MIT’s combined work across all its five schools, channeling huge resources into the search for a solution to global warming. It works to improve the efficiency of existing energy sources, including nuclear power. It is also forging ahead with alternative energies from solar to wind and geothermal, and has recently developed the use of viruses to synthesise batteries that could prove crucial in the advancement of electric cars.","foot":false},{"L":null,"t":"In the words of Tim Berners-Lee, the Briton who invented the World Wide Web, ‘It’s not just another university. Even though I spend my time with my head buried in the details of web technology, the nice thing is that when I do walk the corridors, I bump into people who are working in other fields with their students that are fascinating, and that keeps me intellectually alive.’","foot":false},{"L":null,"t":"adapted from the Guardian *people who have left a university or college after completing their studies there","foot":true}],"groups":[{"a":1,"b":5,"k":"tf","instr":["Do the following statements agree with the information in the passage?","In boxes 1–5 on your answer sheet, write"],"items":[{"n":1,"t":"The activities going on at the MIT campus are like those at any other university.","opts":[]},{"n":2,"t":"Harvard and MIT shared a similar approach to education when they were founded.","opts":[]},{"n":3,"t":"The school motto was suggested by a former MIT student.","opts":[]},{"n":4,"t":"MIT’s logo reflects the belief that intellect and craftsmanship go together.","opts":[]},{"n":5,"t":"Silicon Valley companies pay higher salaries to graduates from MIT.","opts":[]}],"opts":[],"ctx":[]},{"a":6,"b":9,"k":"gap","instr":["Complete the notes below.","Choose NO MORE THAN TWO WORDS from the passage for each answer.","Write your answers in boxes 6–9 on your answer sheet."],"items":[],"opts":[],"ctx":["Degree subject: — 6………………","Competition: — to 7……………… the automated construction of a house","Special focus on: — the 8……………… of robots","Future plans: — to develop new type of 9 ………………"],"mode":"notes","ctitle":"Christopher Merrill – student at MIT"},{"a":10,"b":13,"k":"gap","instr":["Answer the questions below.","Choose NO MORE THAN TWO WORDS from the passage for each answer.","Write your answers in boxes 10–13 on your answer sheet."],"items":[{"n":10,"t":"What proportion of workers at Silicon Valley are employed in companies set up by MIT graduates?","opts":[]},{"n":11,"t":"What problem does MIT’s Energy Initiative aim to solve?","opts":[]},{"n":12,"t":"Which ‘green’ innovation might MIT’s work with viruses help improve?","opts":[]},{"n":13,"t":"In which part of the university does Tim Berners-Lee enjoy stimulating conversations with other MIT staff?","opts":[]}],"opts":[],"ctx":[]}],"ans":{"1":{"raw":"False","v":"F","ex":"The activities going on at the MIT campus are like those at any other university. Meaning: Is MIT similar to other universities in terms of activities on campus? Answer: False Part of the passage: But, as you quickly realise when you step inside the Massachu- setts Institute of Technology, there’s precious little going on that you would normally see on a university campus. Explanation: little – negative; a little – positive"},"2":{"raw":"False","v":"F","ex":"Harvard and MIT shared a similar approach to education when they were founded. Meaning: Do Harvard and MIT share a similar approach to education right from the start? Answer: False Part of the passage: While Harvard stuck to the English model of a classical education, with its emphasis on Latin and Greek, MIT looked to the German system of learning based on research and hands-on experimentation."},"3":{"raw":"Not Given","v":"NG","ex":"The school motto was suggested by a former MIT student. Meaning: Did former MIT student come up with the school motto? Answer: Not Given Part of the passage: This down-to-earth quality is enshrined in the school motto, Mens et manus – Mind and hand – as well as its logo, which shows a gowned scholar standing beside an ironmonger bearing a hammer and anvil. That symbiosis of intellect and crafts- manship still suffuses the institute’s classrooms, where students are not so much taught as engaged and inspired. Explanation: There is information in the text about who suggested this motto"},"4":{"raw":"True","v":"T","ex":"MIT’s logo reflects the belief that intellect and craftsmanship go together. Meaning: Does MIT’s logo show intellect and craftsmanship together? Answer: True Part of the passage: as well as its logo, which shows a gowned scholar standing beside an ironmonger bearing a hammer and anvil. That symbiosis of intellect and craftsman- ship still suffuses the institute’s classrooms, where students are not so much taught as engaged and inspired."},"5":{"raw":"Not Given","v":"NG","ex":"Silicon Valley companies pay higher salaries to graduates from MIT. Meaning: Do MIT graduates receive higher salaries from Silicon Valley? Answer: Not Given Part of the passage: As such, he might become one of many MIT graduates who go on to form companies that fail. Alternatively, he might become one of those who go on to succeed in spectacular fashion. And there are many of them. A survey of living MIT alumni* found that they have formed 25,800 companies, employing more than three million people, including about a quarter of the workforce of Silicon Valley. Explanation: The text does not mention salaries, let alone comparing MIT graduates with other employees."},"6":{"raw":"computer science","v":"computer science","ex":"Degree subject: Answer: computer science Key words: 3rd year undergraduate"},"7":{"raw":"program","v":"program","ex":"Competition: to ……………… the automated construction of a house Answer: program Key words: a competition to see which student can most effectively program a robot to build a house...","alts":["program","programme"]},"8":{"raw":"adaptability","v":"adaptability","ex":"Special focus on: the ……………… of robots Answer: adaptability Key words: wanted to master an area of robotics that remain unconquered"},"9":{"raw":"contact lens","v":"contact lens","ex":"Future plans: to develop new type of ……………… Answer: contact lens Key words: he has an idea for an original version of a contact lens"},"10":{"raw":"a quarter","v":"a quarter","ex":"What proportion of workers at Silicon Valley are employed in companies set up by MIT graduates? Answer: a quarter Part of the passage: A survey of living MIT alumni* found that they have formed 25,800 companies, employing more than three million people, including about a quarter of the workforce of Silicon Valley","alts":["a quarter","quarter","25%","one quarter"]},"11":{"raw":"global warming","v":"global warming","ex":"What problem does MIT’s Energy Initiative aim to solve? Answer: global warming Part of the passage: Or in its Energy Initiative, which acts as a bridge for MIT’s com- bined work across all its five schools, channeling huge resources into the search for a solution to global warming."},"12":{"raw":"electric cars","v":"electric cars","ex":"Which ‘green’ innovation might MIT’s work with viruses help improve? Answer: electric cars Part of the passage: It is also forging ahead with alternative energies from solar to wind and geothermal, and has recently developed the use of viruses to synthesise batteries that could prove crucial in the advancement of electric cars."},"13":{"raw":"(the) corridors","v":"(the) corridors","ex":"In which part of the university does Tim Berners-Lee enjoy stimulating conversations with other MIT staff? Answer: (the) corridors Part of the passage: Even though I spend my time with my head buried in the details of web technology, the nice thing is that when I do walk the corridors, I bump into people who are working in other fields with their students that are fascinating, and that keeps me intellectually alive.’"}},"words":[{"w":"Boundary","pos":"n","def":"the limit of a subject or principle","lvl":"C1","ex":"Electronic publishing is blurring the boundaries between dictionaries and encyclopedia","ar":"حدّ"},{"w":"Unleash","pos":"v","def":"to suddenly release a violent force that cannot be controlled","lvl":"","ex":"At worst, nuclear war could be unleashed","ar":"يطلق العنان"},{"w":"Leap into","pos":"v","def":"to make a large jump or sudden movement, usually from one place to another","lvl":"C2","ex":"He leaped out of his car and ran towards the house","ar":"يقفز إلى"},{"w":"Down-to-earth","pos":"n","def":"practical, reasonable, and friendly","lvl":"C1","ex":"She is down-to-earth sort of woman with no pretensions","ar":"واقعي / عملي"},{"w":"Enshrine","pos":"v","def":"to contain or keep something as if in a holy place","lvl":"","ex":"Almost two and a half million war dead are enshrined at Yasukuni","ar":"يكرّس / يخلّد"},{"w":"Standing","pos":"n","def":"reputation, rank, or position in an area of activity, system, or organization","lvl":"","ex":"As a pathologist of considerable standing, his opinion will have a lot of influence","ar":"مكانة / سمعة"},{"w":"Suffuse","pos":"v","def":"to spread through or over something completely","lvl":"","ex":"His voice was low and suffused with passion","ar":"يغمر / ينتشر في"},{"w":"Conquer","pos":"v","def":"to deal with or successfully fight against a problem or an unreasonable fear","lvl":"C1","ex":"He has finally conquered his fear of spiders","ar":"يتغلّب على"},{"w":"Iterative","pos":"adj","def":"doing something again and again usually to improve it","lvl":"","ex":"Iterative processes","ar":"تكراري"},{"w":"Sparkling","pos":"adj","def":"energetic and interesting","lvl":"C1","ex":"A sparkling performance","ar":"حيوي ومشرق"},{"w":"Channel into","pos":"v","def":"to direct something into a particular place or situation","lvl":"C2","ex":"Ditches were constructed to channel water away from the buildings","ar":"يوجّه إلى"},{"w":"Forge ahead","pos":"v","def":"to suddenly make a lot of progress with something","lvl":"","ex":"The organizers are forging ahead with a programme of public events","ar":"يتقدّم بسرعة"},{"w":"Bury yourself in something","pos":"","def":"to give all your attention to something","lvl":"C2","ex":"Since her marriage ended, she has buried herself in her work","ar":"ينهمك في"}]},{"n":20,"pp":2,"title":"Gold dusters","untitled":false,"intro":"They are the Earth’s pollinators and they come in more than 200,000 shapes and sizes.","paras":[{"L":"A","t":"Row upon row, tomato plants stand in formation inside a greenhouse. To reproduce, most flowering plants depend on a third party to transfer pollen between their male and female parts. Some require extra encouragement to give up that golden dust. The tomato flower, for example, needs a violent shake, a vibration roughly equivalent to 30 times the pull of Earth’s gravity, explains Arizona entomologist Stephen Buchmann. Growers have tried numerous ways to rattle pollen from tomato blossoms. They have used shaking tables, air blowers and blasts of sound. But natural means seem to work better.","foot":false},{"L":"B","t":"It is no surprise that nature’s design works best. What’s astonishing is the array of workers that do it: more than 200,000 individual animal species, by varying strategies, help the world’s 240,000 species of flowering plants make more flowers. Flies and beetles are the original pollinators, going back to when flowering plants first appeared 130 million years ago. As for bees, scientists have identified some 20,000 distinct species so far. Hummingbirds, butterflies, moths, wasps and ants are also up to the job. Even non-flying mammals do their part: sugar-loving opossums, some rainforest monkeys, and lemurs in Madagascar, all with nimble hands that tear open flower stalks and furry coats to which pollen sticks. Most surprising, some lizards, such as geckos, lap up nectar and pollen and then transport the stuff on their faces and feet as they forage onward.","foot":false},{"L":"C","t":"All that messy diversity, unfortunately, is not well suited to the monocrops and mega-yields of modern commercial farmers. Before farms got so big, says conservation biologist Claire Kremen of the University of California, Berkeley, ‘we didn’t have to manage pollinators. They were all around because of the diverse landscapes. Now you need to bring in an army to get pollination done.’ The European honeybee was first imported to the US some 400 years ago. Now at least a hundred commercial crops rely almost entirely on managed honeybees, which beekeepers raise and rent out to tend to big farms. And although other species of bees are five to ten times more efficient, on a per-bee basis, at pollinating certain fruits, honeybees have bigger colonies, cover longer distances, and tolerate management and movement better than most insects. They’re not picky – they’ll spend their time on almost any crop. It’s tricky to calculate what their work is truly worth; some economists put it at more than $200 billion globally a year.","foot":false},{"L":"D","t":"Industrial-scale farming, however, may be wearing down the system. Honeybees have suffered diseases and parasite infestations for as long as they’ve been managed, but in 2006 came an extreme blow. Around the world, bees began to disappear over the winter in massive numbers. Beekeepers would lift the lid of a hive and be amazed to find only the queen and a few stragglers, the worker bees gone. In the US, a third to half of all hives crashed; some beekeepers reported colony losses near 90 percent. The mysterious culprit was named colony collapse disorder (CCD) and it remains an annual menace – and an enigma.","foot":false},{"L":"E","t":"When it first hit, many people, from agronomists to the public, assumed that our slathering of chemicals on agricultural fields was to blame for the mystery. Indeed, says Jeff Pettis of the USDA Bee Research Laboratory, ‘we do find more disease in bees that have been exposed to pesticides, even at low levels.’ But it is likely that CCD involves multiple stressors. Poor nutrition and chemical exposure, for instance, might wear down a bee’s immunities before a virus finishes the insect off. It’s hard to tease apart factors and outcomes, Pettis says. New studies reveal that fungicides – not previously thought toxic to bees – can interfere with microbes that break down pollen in the insects’ guts, affecting nutrient absorption and thus long-term health and longevity. Some findings pointed to viral and fungal pathogens working together. ‘I only wish we had a single agent causing all the declines,’ Pettis says, ‘that would make our work much easier.’","foot":false},{"L":"F","t":"However, habitat loss and alteration, he says, are even more of a menace to pollinators than pathogens. Claire Kremen encourages farmers to cultivate the flora surrounding farmland to help solve habitat problems. ‘You can’t move the farm,’ she says, ‘but you can diversify what grows in its vicinity: along roads, even in tractor yards.’ Planting hedgerows and patches of native flowers that bloom at different times and seeding fields with multiple plant species rather than monocrops ‘not only is better for native pollinators, but it’s just better agriculture,’ she says. Pesticide-free wildflower havens, adds Buchmann, would also bolster populations of useful insects. Fortunately, too, ‘there are far more generalist plants than specialist plants, so there’s a lot of redundancy in pollination,’ Buchmann says. ‘Even if one pollinator drops out, there are often pretty good surrogates left to do the job.’ The key to keeping our gardens growing strong, he says, is letting that diversity thrive.","foot":false},{"L":"G","t":"Take away that variety, and we’ll lose more than honey. ‘We wouldn’t starve,’ says Kremen. ‘But what we eat, and even what we wear – pollinators, after all, give us some of our cotton and flax – would be limited to crops whose pollen travels by other means. ‘In a sense,’ she says, ‘our lives would be dictated by the wind.’ It’s vital that we give pollinators more of what they need and less of what they don’t, and ease the burden on managed bees by letting native animals do their part, say scientists.","foot":false},{"L":null,"t":"adapted from National Geographic Magazine","foot":true}],"groups":[{"a":14,"b":20,"k":"head","instr":["The reading passage has seven sections, A–G.","Choose the correct heading for each section from the list of headings below.","Write the correct number, i–x, in boxes 14–20 on your answer sheet."],"items":[{"n":14,"t":"Section A","opts":[]},{"n":15,"t":"Section B","opts":[]},{"n":16,"t":"Section C","opts":[]},{"n":17,"t":"Section D","opts":[]},{"n":18,"t":"Section E","opts":[]},{"n":19,"t":"Section F","opts":[]},{"n":20,"t":"Section G","opts":[]}],"opts":[{"k":"i","t":""},{"k":"ii","t":"Looking for clues Blaming the beekeepers"},{"k":"iii","t":"Solutions to a more troublesome issue"},{"k":"iv","t":"Discovering a new bee species"},{"k":"v","t":"An impossible task for any human"},{"k":"vi","t":"The preferred pollinator"},{"k":"vii","t":"Plant features designed to suit the pollinator"},{"k":"viii","t":"Some obvious and less obvious pollen carriers"},{"k":"ix","t":"The undesirable alternative"},{"k":"x","t":"An unexpected setback"}],"ctx":[],"optTitle":"List of Headings"},{"a":21,"b":24,"k":"gap","instr":["Complete the sentences below.","Choose NO MORE THAN THREE WORDS from the passage for each answer.","Write your answers in boxes 21–24 on your answer sheet."],"items":[{"n":21,"t":"Both …………… were the first creatures to pollinate the world’s plants.","opts":[]},{"n":22,"t":"Monkeys transport pollen on their …………… .","opts":[]},{"n":23,"t":"Honeybees are favored pollinators among bee species partly because they travel …………… .","opts":[]},{"n":24,"t":"A feature of CCD is often the loss of all the …………… .","opts":[]}],"opts":[],"ctx":[]},{"a":25,"b":26,"k":"multi","instr":["Choose TWO letters, A–E.","Write the correct letters in boxes 25 and 26 on your answer sheet."],"items":[],"opts":[{"k":"A","t":"using more imported pest controllers"},{"k":"B","t":"removing microbes from bees’ stomachs"},{"k":"C","t":"cultivating a wide range of flowering plants"},{
