<!doctype html><html lang="ar" dir="rtl"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><nav aria-label="التنقل" style="max-width:1120px;margin:16px auto"><a href="./index.html" style="color:var(--accent);font-weight:700;text-decoration:underline">← العودة إلى كلماتي</a></nav>
<title>تحدّي القراءة ٣٠ يومًا</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap">
<style>
/* Layout: a calm study desk. Sage-grey ground, white "paper" sheets, one deep-teal accent, a yellow highlighter for answers. */
:root{
 --bg:#F3F6FB; --surface:#FFFFFF; --sheet:#FAFCFF; --ink:#1C2340; --muted:#5E6684; --line:#E2E7F2;
 --accent:#11808F; --accent-ink:#FFFFFF; --accent-soft:#DDF3F3; --sky:#E6F1FF; --sky-ink:#1F5FA8;
 --mark:#FFE58A; --mark-ink:#5B4300; --ok:#1FA971; --ok-soft:#DDF7EA; --bad:#E5533D; --bad-soft:#FFE6E1; --gold:#F2A900;
 --coral:#FF6F61; --sun:#FFB938; --mint:#2EC4A0; --skyc:#4D9CFF; --grape:#8C6CF0; --rose:#F25C9A;
 --hero1:#0D6E7D; --hero2:#1E9E9A; --hero3:#55C6A9;
 --shadow:rgba(28,35,64,.08);
 --ui:"Readex Pro","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
 --read:"Literata",Georgia,"Times New Roman",serif;
 --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#10162A; --surface:#182037; --sheet:#1B2440; --ink:#E9ECF7; --muted:#A3ABC6; --line:#2A3452;
 --accent:#4FD1C5; --accent-ink:#06201F; --accent-soft:#173A40; --sky:#182D4A; --sky-ink:#A9CBFF;
 --mark:#6B5612; --mark-ink:#FFE9A6; --ok:#4FD69A; --ok-soft:#14352A; --bad:#FF8A76; --bad-soft:#3F211D; --gold:#FFC94D;
 --coral:#FF8A7E; --sun:#FFC85C; --mint:#4FD8B6; --skyc:#73B2FF; --grape:#A994FF; --rose:#FF7DB2;
 --hero1:#0B4E5A; --hero2:#137A78; --hero3:#2E9C86;
 --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#10162A; --surface:#182037; --sheet:#1B2440; --ink:#E9ECF7; --muted:#A3ABC6; --line:#2A3452;
 --accent:#4FD1C5; --accent-ink:#06201F; --accent-soft:#173A40; --sky:#182D4A; --sky-ink:#A9CBFF;
 --mark:#6B5612; --mark-ink:#FFE9A6; --ok:#4FD69A; --ok-soft:#14352A; --bad:#FF8A76; --bad-soft:#3F211D; --gold:#FFC94D;
 --coral:#FF8A7E; --sun:#FFC85C; --mint:#4FD8B6; --skyc:#73B2FF; --grape:#A994FF; --rose:#FF7DB2;
 --hero1:#0B4E5A; --hero2:#137A78; --hero3:#2E9C86;
 --shadow:rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.7;margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
.en{direction:ltr;unicode-bidi:isolate;text-align:left}
.muted{color:var(--muted)}
.small{font-size:13.5px}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.5px}
.brand h1{font-size:19px;font-weight:600}
.brand p{font-size:12.5px;color:var(--muted)}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13.5px;white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px;align-self:flex-start;max-width:100%}
.tab{flex:0 0 auto;border:0;background:none;border-radius:999px;padding:7px 16px;font-size:14.5px;color:var(--muted)}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 4px 14px var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 16px;font-size:14.5px;font-weight:500}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:3px 9px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.icon-btn svg{width:15px;height:15px}
.btn svg{width:16px;height:16px;vertical-align:-3px;margin-inline-end:4px}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;background:var(--accent-soft);color:var(--ink)}
.eyebrow{font-size:12.5px;letter-spacing:.6px;color:var(--accent);font-weight:600}
/* plan */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.hero .today h2{font-size:24px}
.today .meta{display:flex;gap:8px;flex-wrap:wrap}
.meter{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:6px}
.steps5{display:flex;gap:6px;flex-wrap:wrap}
.steps5 span{font-size:12.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps5 span.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.week{display:flex;flex-direction:column;gap:8px}
.week h3{font-size:15px;color:var(--muted);font-weight:500}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.dtile{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.dtile:hover{border-color:var(--accent)}
.dtile .n{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.dtile .t{font-family:var(--read);font-size:15px;direction:ltr;text-align:left;line-height:1.35;min-height:2.7em}
.dtile.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.star{color:var(--gold);font-size:15px}
/* day */
.dayhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.dayhead h2{font-family:var(--read);font-size:27px;font-weight:600;direction:ltr;text-align:left}
.stepbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.stepbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 13px;font-size:14px;display:flex;gap:7px;align-items:center}
.stepbtn .k{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:12px;font-variant-numeric:tabular-nums}
.stepbtn.done .k{background:var(--ok);color:#fff}
.stepbtn[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
/* words */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.wcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--sheet);display:flex;flex-direction:column;gap:6px;min-width:0}
.wcard .w{font-family:var(--read);font-size:19px;font-weight:600;direction:ltr;text-align:left}
.wcard .ar{font-size:16px;font-weight:500;color:var(--accent)}
.wcard .def,.wcard .ex{font-family:var(--read);font-size:14.5px;direction:ltr;text-align:left}
.wcard .ex{color:var(--muted);font-style:italic}
.wcard.known{border-color:var(--ok);background:var(--ok-soft)}
/* reader */
.reader{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px clamp(16px,4vw,40px);font-family:var(--read);direction:ltr;text-align:left;font-size:var(--fs,18px);line-height:1.8}
.reader h3{font-family:var(--read);font-size:1.35em;text-align:center;margin-bottom:6px}
.reader .intro{font-style:italic;color:var(--muted);text-align:center;margin-bottom:14px}
.para{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;margin-bottom:16px}
.para .lab{font-family:var(--ui);font-weight:700;color:var(--accent);font-size:15px;padding-top:4px}
.para .ptools{display:flex;gap:6px;margin-top:6px;font-family:var(--ui);direction:rtl;justify-content:flex-end}
.para .tr{font-family:var(--ui);direction:rtl;text-align:right;background:var(--sky);color:var(--ink);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:15px;line-height:1.8}
.foot{font-size:.8em;color:var(--muted)}
.w{cursor:pointer;border-radius:3px}
.w:hover{background:var(--accent-soft)}
.w.wl{border-bottom:2px solid var(--accent)}
.hl{background:var(--mark);color:var(--mark-ink);border-radius:3px;box-shadow:0 0 0 2px var(--mark)}
.fsz{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fsz button{border:0;background:var(--sheet);padding:3px 10px;font-size:13px}
/* test */
.testgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.testgrid .reader{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 30px);overflow:auto;font-size:16px}
.pane-switch{display:none}
.qgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.qhead{font-weight:600;font-size:15px}
.instr{font-family:var(--read);direction:ltr;text-align:left;font-size:14.5px;color:var(--muted);font-style:italic}
.hint{font-size:13.5px;background:var(--sky);color:var(--sky-ink);border-radius:10px;padding:8px 12px}
.optbox{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;background:var(--sheet)}
.optbox h5{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:500}
.optbox ol{list-style:none;margin:0;padding:0;direction:ltr;text-align:left;font-family:var(--read);font-size:14.5px;display:grid;gap:3px}
.optbox li b{display:inline-block;min-width:34px;color:var(--accent);font-family:var(--ui)}
.optbox.cols ol{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.qitem{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0}
.qn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--sheet)}
.qn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.qn.no{background:var(--bad);border-color:var(--bad);color:#fff}
.qt{font-family:var(--read);direction:ltr;text-align:left;font-size:15.5px}
.choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;direction:ltr}
.choice{border:1.5px solid var(--line);background:var(--sheet);border-radius:9px;padding:4px 11px;font-size:14px;text-align:left}
.choice.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choices.col{flex-direction:column;align-items:stretch}
.choices.col .choice{font-family:var(--read);font-size:14.5px}
.choice b{font-family:var(--ui);color:var(--accent);margin-right:6px}
.gapin{font:inherit;font-family:var(--ui);font-size:14.5px;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:1px 6px;width:9.5em;max-width:100%;color:var(--ink);direction:ltr}
.gapin.ok{border-color:var(--ok);background:var(--ok-soft)}
.gapin.no{border-color:var(--bad);background:var(--bad-soft)}
.gapsel{font:inherit;font-size:14px;border:1.5px solid var(--accent);border-radius:7px;background:var(--accent-soft);color:var(--ink);padding:1px 4px;max-width:100%}
.gnum{font-family:var(--ui);font-weight:700;font-size:12px;background:var(--ink);color:var(--surface);border-radius:5px;padding:0 5px;margin-right:4px}
.ctx{font-family:var(--read);direction:ltr;text-align:left;font-size:15.5px;line-height:2.1}
.ctitle{font-family:var(--read);font-weight:600;text-align:center;direction:ltr}
.flow{display:flex;flex-direction:column;align-items:center;gap:0}
.flow .box{border:1.5px solid var(--ink);border-radius:8px;padding:6px 12px;background:var(--sheet);max-width:560px;width:100%;text-align:center;font-family:var(--read);direction:ltr;font-size:15px;line-height:2}
.flow .arr{height:20px;width:2px;background:var(--ink);position:relative;margin-bottom:6px}
.flow .arr::after{content:"";position:absolute;bottom:-6px;left:-5px;border:6px solid transparent;border-top-color:var(--ink)}
.notes{display:flex;flex-direction:column;gap:4px;font-family:var(--read);direction:ltr;text-align:left;font-size:15px;line-height:2}
.tablewrap{overflow-x:auto}
table.qt2{border-collapse:collapse;direction:ltr;font-family:var(--read);font-size:14.5px;min-width:520px;width:100%}
table.qt2 th,table.qt2 td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left;line-height:2}
table.qt2 th{background:var(--accent-soft)}
.diagram{max-width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
.verdict{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;margin-top:6px}
.verdict .ans{font-family:var(--read);direction:ltr}
.expl{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.expl .src{font-family:var(--read);direction:ltr;text-align:left;font-size:14px}
.expl .k{font-weight:600;color:var(--accent);font-size:12.5px}
.ai{background:var(--sky);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.9}
.score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.score .big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.band{border:2px solid var(--accent);border-radius:12px;padding:4px 14px;text-align:center}
.band b{display:block;font-size:24px;line-height:1.2}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.sheetbar{display:flex;flex-wrap:wrap;gap:4px}
.sheetbar span{width:28px;height:28px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.sheetbar span.f{border-color:var(--accent);background:var(--accent-soft)}
.sheetbar span.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.sheetbar span.no{background:var(--bad);border-color:var(--bad);color:#fff}
/* games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.game{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:start;display:flex;flex-direction:column;gap:4px;min-width:0}
.game:hover{border-color:var(--accent)}
.game h4{font-size:15.5px}
.game p{font-size:13px;color:var(--muted);line-height:1.6}
.game .gb{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.game .best{color:var(--ok);font-weight:600}
.play{display:flex;flex-direction:column;gap:14px}
.prompt{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:16px}
.prompt .big{font-family:var(--read);font-size:26px;font-weight:600;direction:ltr;text-align:center}
.prompt .sent{font-family:var(--read);direction:ltr;text-align:left;font-size:17px;line-height:1.9}
.blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;text-align:center;min-width:0}
.opt.en{font-family:var(--read);direction:ltr}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-size:14.5px}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.flip{min-height:150px;display:grid;place-items:center;text-align:center;cursor:pointer}
.tiles{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.tile{border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;padding:4px 10px;font-family:var(--read);font-size:15.5px}
.tile:disabled{opacity:.3}
.slot{min-height:46px;border:1.5px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.order{display:flex;flex-direction:column;gap:6px}
.order button{text-align:left;direction:ltr;font-family:var(--read);font-size:14.5px;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 10px;display:flex;gap:8px}
.order button .o{font-family:var(--ui);min-width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px}
.order button.picked .o{background:var(--accent);color:var(--accent-ink)}
.input{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--sheet);color:var(--ink);width:100%}
.input.en{font-family:var(--read)}
.diff span{border-radius:4px;padding:0 2px}
.ldiff .miss{color:var(--bad);text-decoration:underline 3px;background:none}
.ldiff .okw{color:var(--ok)}
.diff .miss{background:var(--bad-soft);color:var(--bad)}
.diff .okw{background:var(--ok-soft)}
/* mastery */
.mbadge{display:flex;gap:12px;align-items:center}
.mbadge .medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;background:var(--accent-soft);color:var(--accent);border:2px solid var(--accent)}
.mbadge .medal.gold{background:var(--mark);color:var(--mark-ink);border-color:var(--gold)}
/* sheet popup */
.wsheet{position:fixed;inset:auto 0 0 0;z-index:30;display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.wsheet>div{width:100%;max-width:600px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px var(--shadow);padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px;max-height:75vh;overflow:auto}
.wsheet .ww{font-family:var(--read);font-size:26px;font-weight:600;direction:ltr}

<script id="dData" type="application/json">[{"n":1,"pp":1,"title":"William Kamkwamba","untitled":false,"intro":"At only 14 years old, William Kamkwamba built a series of windmills that could generate electricity in his African village, Masitala, in Malawi, south-eastern Africa.","paras":[{"L":null,"t":"In 2002, William Kamkwamba had to drop out of school, as his father, a maize and tobacco farmer, could no longer afford his school fees. But despite this setback, William was determined to get his education. He began visiting a local library that had just opened in his old primary school, where he discovered a tattered science book. With only a rudimentary grasp of English, he taught himself basic physics – mainly by studying photos and diagrams. Another book he found there featured windmills on the cover and inspired him to try and build his own.","foot":false},{"L":null,"t":"He started by constructing a small model. Then, with the help of a cousin and friend, he spent many weeks searching scrap yards and found old tractor fans, shock absorbers, plastic pipe and bicycle parts, which he used to build the real thing.","foot":false},{"L":null,"t":"For windmill blades, William cut some bath pipe in two lengthwise, then heated the pieces over hot coals to press the curried edges flat. To bore holes into the blades, he stuck a nail through half a corncob, heated the metal red and twisted it through the blades. It took three hours to repeatedly heat the nail and bore the holes. He attached the blades to a tractor fan using proper nuts and bolts and then to the back axle of a bicycle. Electricity was generated through the bicycle dynamo. When the wind blew the blades, the bike chain spun the bike wheel, which charged the dynamo and sent a current through wire to his house.","foot":false},{"L":null,"t":"What he had built was a crude machine that produced 12 volts and powered four lights. When it was all done, the windmill’s wingspan measured more than eight feet and sat on top of a rickety tower 15 feet tall that swayed violently in strong gales. He eventually replaced the tower with a sturdier one that stands 39 feet, and built a second machine that watered a family garden.","foot":false},{"L":null,"t":"The windmill brought William Kamkwamba instant local fame, but despite his accomplishment, he was still unable to return to school. However, news of his magetsi a mphepo – electric wind – spread beyond Malawi, and eventually things began to change. An educational official, who had heard news of the windmill, came to visit his village and was amazed to learn that William had been out of school for five years. He arranged for him to attend secondary school at the government’s expense and brought journalists to the farm to see the windmill. Then a story published in the Malawi Daily Mail caught the attention of bloggers, which in turn caught the attention of organisers for the Technology Entertainment and Design conference.","foot":false},{"L":null,"t":"In 2007, William spoke at the TED Global conference in Tanzania and got a standing ovation. Businessmen stepped forward with offers to fund his education and projects, and with money donated by them, he was able to put his cousin and several friends back into school and pay for some medical needs of his family. With the donation, he also drilled a borehole for a well and water pump in his village and installed drip irrigation in his father’s fields.","foot":false},{"L":null,"t":"The water pump has allowed his family to expand its crops. They have abandoned tobacco and now grow maize, beans, soybeans, potatoes and peanuts. The windmills have also brought big lifestyle and health changes to the other villagers. ‘The village has changed a lot,’ William says. ‘Now, the time that they would have spent going to fetch water, they are using for doing other things. And also the water they are drinking is clean water, so there is less disease.’ The villagers have also stopped using kerosene and can use the money previously spent on fuel to buy othwwer things.","foot":false},{"L":null,"t":"William Kamkwamba’s example has inspired other children in the village to pursue science. William says they now see that if they put their mind to something, they can achieve it. ‘It has changed the way people think,’ he says.","foot":false}],"groups":[{"a":1,"b":5,"k":"gap","instr":["Complete the flow chart below.","Choose NO MORE THAN TWO WORDS from the passage for each answer.","Write your answers in boxes 1–5 on your answer sheet."],"items":[],"opts":[],"ctx":["William learned some 1 …………… from a library book.","First, he built a 2 …………… of the windmill.","Then he collected materials from 3 …………… with a relative.","He made the windmill blades from pieces of 4 …………… .","He fixed the blades to a 5 …………… and then to part of a bicycle.","He raised the blades on a tower."],"mode":"flow","ctitle":"Building the Windmill"},{"a":6,"b":10,"k":"tf","instr":["Do the following statements agree with the information given in Reading Passage 1?","In boxes 6–10 on your answer sheet, write"],"items":[{"n":6,"t":"William used the electricity he created for village transport.","opts":[]},{"n":7,"t":"At first, William’s achievement was ignored by local people.","opts":[]},{"n":8,"t":"Journalists from other countries visited William’s farm.","opts":[]},{"n":9,"t":"William used money he received to improve water supplies in his village.","opts":[]},{"n":10,"t":"The health of the villagers has improved since the windmill was built.","opts":[]}],"opts":[],"ctx":[]},{"a":11,"b":13,"k":"gap","instr":["Answer the questions below.","Use NO MORE THAN ONE WORD AND/OR A NUMBER from the passage for each answer.","Write your answers in boxes 11–13 on your answer sheet."],"items":[{"n":11,"t":"How tall was the final tower that William built?","opts":[]},{"n":12,"t":"What did the villagers use for fuel before the windmill was built?","opts":[]},{"n":13,"t":"What school subject has become more popular in Will blades)."},"5":{"raw":"tractor fan","v":"tractor fan","ex":"He fixed the blades to a ............... and then to part of a bicycle. Answer: tractor fan Part of the passage: He attached the blades to a tractor fan using proper nuts and bolts and then to the back axle of a bicycle. Explanation: fixed = attached; the back axle = part of a bicycle."},"6":{"raw":"False","v":"F","ex":"William used the electricity he created for village transport. Answer: False Part of the passage: Electricity was generated through the bicycle dynamo. When the wind blew the blades, the bike chain spun the bike wheel, which charged the dynamo and sent a current through wire to his house. ...He eventually replaced the tower with a sturdier one that stands 39 feet, and built a second machine that watered a family garden. Explanation: He used the electricity generated for his own household purposes (send- ing electrical current to his house, and later watering a family garden), NOT for village transport (otherwise it would’ve been mentioned)."},"7":{"raw":"False","v":"F","ex":"At first, William’s achievement was ignored by local people. Answer: False Part of the passage: The windmill brought William Kamkwamba instant local fame, but despite his accomplishment, he was still unable to return to school. Explanation: instant local fame = he instantly became famous (NOT ignored by local people)."},"8":{"raw":"Not Given","v":"NG","ex":"Journalists from other countries visited William’s farm. Answer: Not Given Part of the passage: He arranged for him to attend secondary school at the govern- ment’s expense and brought journalists to the farm to see the windmill. Then a story published in the Malawi Daily Mail caught the attention of bloggers, which in turn caught the attention of organisers for the Technology Entertainment and Design conference. Explanation: We don’t know whether or not the journalists were from other countries. The text only mentions that journalists came to the farm to the windmill."},"9":{"raw":"True","v":"T","ex":"William used the money he received to improve water supplies in his village. Answer: True Part of the passage: With the donation, he also drilled a borehole for a well and wa- ter pump in his village and installed drip irrigation in his father’s fields. Explanation: donation = money received; a well and water pump = water supplies."},"10":{"raw":"True","v":"T","ex":"The health of villagers improved since the windmill was built. Answer: True Part of the passage: The windmills have also brought big lifestyle and health changes to the other villagers. ‘The village has changed a lot,’ William says. ‘Now, the time that they would have spent going to fetch water, they are using for doing other things. And also the water they are drinking is clean water, so there is less disease.’ Explanation: It is straightforward, the text clearly says the windmills brought lifestyle and health changes and there is less disease because of it."},"11":{"raw":"39 feet","v":"39 feet","ex":"How tall was the final tower that William built? Answer: 39 feet Part of the passage: He eventually replaced the tower with a sturdier one that stands 39 feet, and built a second machine that watered a family garden. Explanation: final tower = eventually replaced the tower; ‘stands’ shows how tall something is.","alts":["39","39 feet","39ft","39 ft"]},"12":{"raw":"kerosene","v":"kerosene","ex":"What did villagers use for fuel before the windmill was built? Answer: kerosene Part of the passage: The villagers have also stopped using kerosene and can use the money previously spent on fuel to buy other things. Explanation: Very easy question; no need for explanation."},"13":{"raw":"science","v":"science","ex":"What school subject became more popular in William’s village? Answer: science Part of the passage: William Kamkwamba’s example has inspired other children in the village to pursue science. Explanation: the trap here is physics because it was mentioned earlier in the passage, but since the answers to ‘short-answer questions’ follow the same order as in the pas- sage, the answer to Q 13 comes after Q12’s answer, so you should look further. And most Uzbek students may not translate ‘science’ as a subject, since direct translation is slightly different. But in English ‘science’ is the general subject including chemistry, biol- ogy and physics."}},"words":[{"w":"Drop out of","pos":"v","def":"abandon a course of study or stop participating in something","lvl":"","ex":"She had dropped out of college","ar":"يترك الدراسة / ينسحب"},{"w":"Rudimentary","pos":"adj","def":"basic","lvl":"B2","ex":"Hew knowledge is still only rudimentary","ar":"بدائي / أساسي"},{"w":"Grasp of","pos":"n","def":"understanding of something","lvl":"C1","ex":"I think I managed to grasp the main points of the lecture","ar":"فهم / إلمام بـ"},{"w":"Rickety","pos":"adj","def":"in bad conditions, weak or likely to break","lvl":"","ex":"That chair is a bit rickety","ar":"متهالك / آيل للسقوط"},{"w":"Standing ovation","pos":"n","def":"an occasion when the people in audience stand up to clap at the end","lvl":"","ex":"The Chancellor was given a standing ovation","ar":"تصفيق حار وقوفًا"},{"w":"Step forward","pos":"v","def":"to offer to provide or to help with something","lvl":"","ex":"No one is sure whether this plan will work, but it is a step forward","ar":"يتقدّم للمساعدة"},{"w":"Put somebody’s mind to something","pos":"v","def":"to decide you are going to do something and to put a lot of efforts into doing it","lvl":"C1","ex":"If you’d just put your mind to it, I am sure you could do it","ar":"يعزم على شيء ويركّز عليه"},{"w":"Setback","pos":"n","def":"something that happens which delays or prevents a process from advancing","lvl":"","ex":"Sally had been recovering well from her operation, but yesterday she experienced a setback","ar":"انتكاسة / عقبة"},{"w":"Initiative","pos":"n","def":"a new plan or process to achieve something or solve a problem","lvl":"C1","ex":"The peace initiative was welcomed by both sides","ar":"مبادرة"},{"w":"Take action","pos":"v","def":"do something official or concerted to achieve an aim or deal with a problem","lvl":"","ex":"If there is a breach of regulations, we will take action","ar":"يتّخذ إجراءً"},{"w":"Resident","pos":"n","def":"a person who lives or has their home in a place","lvl":"","ex":"A resident of the UK","ar":"مقيم / ساكن"},{"w":"Inhabitant","pos":"n","def":"a person or animal that lives in a particular place","lvl":"","ex":"A city of five million inhabitants","ar":"ساكن (إنسان أو حيوان)"}]},{"n":2,"pp":2,"title":"White mountain, green tourism","untitled":false,"intro":"The French Alpine town of Chamonix has been a magnet for tourists since the 18th century. But today, tourism and climate change are putting pressure on the surrounding environment. Marc Grainger reports.","paras":[{"L":"A","t":"The town of Chamonix-Mont-Blanc sits in a valley at 1,035 metres above sea level in the Haute-Savoie department in south-eastern France. To the northwest are the red peaks of the Aiguilles Rouges massif; to the south-east are the permanently white peaks of Mont Blanc, which at 4,810 metres is the highest mountain in the Alps. It’s a typical Alpine environment, but one that is under increasing strain from the hustle and bustle of human activity.","foot":false},{"L":"B","t":"Tourism is Chamonix’s lifeblood. Visitors have been encouraged to visit the valley ever since it was discovered by explorers in 1741. Over 40 years later, in 1786, Mont Blanc’s summit was finally reached by a French doctor and his guide, and this gave birth to the sport of alpinism, with Chamonix at its centre. In 1924, it hosted the first Winter Olympics, and the cable cars and lifts that were built in the years that followed gave everyone access to the ski slopes.","foot":false},{"L":"C","t":"Today, Chamonix is a modern town, connected to the outside world via the Mont Blanc Road Tunnel and a busy highway network. It receives up to 60,000 visitors at a time during the ski season, and climbers, hikers and extreme-sports enthusiasts swarm there in the summer in even greater numbers, swelling the town’s population to 100,000. It is the third most visited natural site in the world, according to Chamonix’s Tourism Office and, last year, it had 5.2 million visitor bed nights – all this in a town with fewer than 10,000 permanent inhabitants.","foot":false},{"L":"D","t":"This influx of tourists has put the local environment under severe pressure, and the authorities in the valley have decided to take action. Educating visitors is vital. Tourists are warned not to drop rubbish, and there are now recycling points dotted all around the valley, from the town centre to halfway up the mountains. An internet blog reports environmental news in the town, and the ‘green’ message is delivered with all the tourist office’s activities.","foot":false},{"L":"E","t":"Low-carbon initiatives are also important for the region. France is committed to reducing its carbon emissions by a factor of four by 2050. Central to achieving this aim is a strategy that encourages communities to identify their carbon emissions on a local level and make plans to reduce them. Studies have identified that accommodation accounts for half of all carbon emissions in the Chamonix valley. Hotels are known to be inefficient operations, but those around Chamonix are now cleaning up their act. Some are using low-energy lighting, restricting water use and making recycling bins available for guests; others have invested in huge projects such as furnishing and decorating using locally sourced materials, using geothermal energy for heating and installing solar panels.","foot":false},{"L":"F","t":"Chamonix’s council is encouraging the use of renewable energy in private properties too, by making funds available for green renovations and new constructions. At the same time, public sector buildings have also undergone improvements to make them more energy efficient and less wasteful. For example, the local ice rink has reduced its annual water consumption from 140,000 cubic metres to 10,000 cubic metres in the space of three years.","foot":false},{"L":"G","t":"Improving public transport is another feature of the new policy, as 80 percent of carbon emissions from transport used to come from private vehicles. While the Mont Blanc Express is an ideal way to travel within the valley – and see some incredible scenery along the route – it is much more difficult to arrive in Chamonix from outside by rail. There is no direct line from the closest airport in Geneva, so tourists arriving by air normally transfer by car or bus. However, at a cost of 3.3 million euros a year, Chamonix has introduced a free shuttle service in order to get people out of their cars and into buses fitted with particle filters.","foot":false},{"L":"H","t":"If the valley’s visitors and residents want to know why they need to reduce their environmental impact, they just have to look up; the effects of climate change are there for everyone to see in the melting glaciers that cling to the mountains. The fragility of the Alpine environment has long been a concern among local people. Today, 70 percent of the 805 square kilometres that comprise Chamonix– Mont-Blanc is protected in some way. But now, the impact of tourism has led the authorities to recognise that more must be done if the valley is to remain prosperous: that they must not only protect the natural environment better, but also manage the numbers of visitors better, so that its residents can happily remain there.","foot":false}],"groups":[{"a":14,"b":18,"k":"para","instr":["Reading Passage 2 has eight paragraphs, A–H.","Which paragraph contains the following information?","Write the correct letter, A–H, in boxes 14–18 on your answer sheet.","NB You may use any letter more than once."],"items":[{"n":14,"t":"a list of the type of people who enjoy going to Chamonix","opts":[]},{"n":15,"t":"refer
