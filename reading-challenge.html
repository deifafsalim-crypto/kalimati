ng solar panels.","set":["D","E"]},"22":{"raw":"E harnessing energy from the sun","v":"E","ex":"The writer mentions several ways that hotels are reducing their carbon emissions. Answer: D providing places for rubbish Part of the passage [Par E]: Hotels are known to be inefficient operations, but those around Chamonix are now cleaning up their act. Some are using low-energy lighting, restricting water use and making recycling bins available for guests; Answer: E harnessing energy from the sun Part of the passage [Par E]: others have invested in huge projects such as furnishing and decorating using locally sourced materials, using geothermal energy for heating and installing solar panels.","set":["D","E"]},"23":{"raw":"explorers","v":"explorers","ex":"The first people to discover the Chamonix valley were …………… . Answer: explorers Part of the passage [Par B]: Tourism is Chamonix’s lifeblood. Visitors have been encouraged to visit the valley ever since it was discovered by explorers in 1741."},"24":{"raw":"summer","v":"summer","ex":"Chamonix’s busiest tourist season is the …………… . Answer: summer Part of the passage [Par C]: Today, Chamonix is a modern town, connected to the outside world via the Mont Blanc Road Tunnel and a busy highway network. It receives up to 60,000 visitors at a time during the ski season, and climbers, hikers and extreme-sports enthusiasts swarm there in the summer in even greater numbers, swelling the town’s population to 100,000."},"25":{"raw":"ice rink","v":"ice rink","ex":"Public areas, such as the …………… in Chamonix, are using fewer resources. Answer: ice rink Part of the passage [Par F]: Chamonix’s council is encouraging the use of renewable energy in private properties too, by making funds available for green renovations and new constructions. At the same time, public sector buildings have also undergone improvements to make them more energy efficient and less wasteful. For example, the local ice rink has reduced its annual water consumption from 140,000 cubic metres to 10,000 cubic metres in the space of three years."},"26":{"raw":"melting glaciers","v":"melting glaciers","ex":"The …………… on the mountains around Chamonix provide visual evidence of global warming. Answer: melting glaciers Part of the passage [Par H]: If the valley’s visitors and residents want to know why they need to reduce their environmental impact, they just have to look up; the effects of climate change are there for everyone to see in the melting glaciers that cling to the mountains. The fragility of the Alpine environment has long been a concern among local people."}},"words":[{"w":"A magnet for something","pos":"n","def":"a thing or place that other people feel strongly attached to","lvl":"","ex":"The United States has always acted as a magnet for people seeking fame and fortune","ar":"مكان جاذب لـ"},{"w":"Put pressure","pos":"v","def":"to make demands on someone or to try get someone to do something","lvl":"B2","ex":"Teachers are under increasing pressure to work longer hours","ar":"يضغط على"},{"w":"Permanently","pos":"adv","def":"always and be forever","lvl":"B2","ex":"Smoking is likely to damage your health permanently","ar":"بشكل دائم"},{"w":"Strain","pos":"n","def":"a force that puts pressure on something, sometimes causing damage","lvl":"B2","ex":"The hurricane put such a strain on the bridge that it collapsed","ar":"ضغط / إجهاد"},{"w":"Hustle and bustle","pos":"n","def":"a large amount of activity and work, usually in a noisy surrounding","lvl":"","ex":"Sometimes you need a break from the hustle and bustle of the city life","ar":"الزحمة والصخب"},{"w":"Lifeblood","pos":"n","def":"the thing that is most important to the continuing success","lvl":"","ex":"Tourism is the lifeblood of Hawaii’s economy","ar":"شريان الحياة"},{"w":"Swarm","pos":"v","def":"move in a large group and numbers","lvl":"","ex":"After the game, thousands of football fans swarmed onto the pitch","ar":"يتدفّق بأعداد كبيرة"},{"w":"Swell","pos":"v","def":"to become larger and increase in size","lvl":"C2","ex":"It was obvious she had broken her toe, because it immediately started to swell","ar":"يتضخّم / يزداد"},{"w":"Severe","pos":"adj","def":"causing very great pain or damage","lvl":"","ex":"This is a school for children with severe learning difficulties","ar":"شديد / حاد"},{"w":"Warn out","pos":"v","def":"to make someone realize a possible danger or problem, especially on in the future","lvl":"","ex":"We were warned not to eat the fish which might give us a slight stomach upset","ar":"يحذّر"},{"w":"Carbon emissions","pos":"n","def":"carbon dioxide that planes, cars produce, thought to be harmful to the environment","lvl":"","ex":"We all need to do more to reduce carbon emissions","ar":"انبعاثات الكربون"},{"w":"Account for","pos":"v","def":"to form a total of something","lvl":"","ex":"Students account for the vast majority of our customers","ar":"يُشكّل (نسبة)"},{"w":"Renewable energy","pos":"n","def":"energy that is produced using the sun, wind, rather than using fuels such as oil","lvl":"C1","ex":"Renewable energy sources such as wind and wave power","ar":"الطاقة المتجددة"},{"w":"Cling to","pos":"n","def":"hold on tightly to something","lvl":"C2","ex":"He clung on to power for another ten years","ar":"يتشبّث / يلتصق بـ"},{"w":"Fragility","pos":"n","def":"the quality of being easily damaged","lvl":"C2","ex":"The assassination could be serious damage to the fragile peace agreement that was signed last month","ar":"هشاشة"}]},{"n":3,"pp":3,"title":"Reading in a whole new way","untitled":false,"intro":"As technology improves, how does the act of reading change?","paras":[{"L":null,"t":"Reading and writing, like all technologies, are constantly changing. In ancient times, authors often dictated their books. Dictation sounded like an uninterrupted series of words, so scribes wrote these down in one long continuous string, just as they occur in speech. For this reason, text was written without spaces between words until the 11th century. This continuous script made books hard to read, so only a few people were accomplished at reading them aloud to others. Being able to read silently to yourself was considered an amazing talent; writing was an even rarer skill. In fact, in 15th century Europe, only one in 20 adult males could write.","foot":false},{"L":null,"t":"After Gutenberg’s invention of the printing press in about 1440, mass-produced books changed the way people read and wrote. The technology of printing increased the number of words available, and more types of media, such as newspapers and magazines, broadened what was written about. Authors no longer had to produce scholarly works, as was common until then, but could write, for example, inexpensive, eart-rending love stories or publish autobiographies, even if they were unknown.","foot":false},{"L":null,"t":"In time, the power of the written word gave birth to the idea of authority and expertise. Laws were compiled into official documents, contracts were written down and nothing was valid unless it was in this form. Painting, music, architecture, dance were all important, but the heartbeat of many cultures was the turning pages of a book. By the early 19th century, public libraries had been built in many cities.","foot":false},{"L":null,"t":"Today, words are migrating from paper to computers, phones, laptops and game consoles. Some 4.5 billion digital screens illuminate our lives. Letters are no longer fixed in black ink on paper, but flitter on a glass surface in a rainbow of colors as fast as our eyes can blink. Screens fill our pockets, briefcases, cars, living-room walls and the sides of buildings. They sit in front of us when we work – regardless of what we do. And of course, these newly ubiquitous screens have changed how we read and write.","foot":false},{"L":null,"t":"The first screens that overtook culture, several decades ago – the big, fat, warm tubes of television – reduced the time we spent reading to such an extent that it seemed as if reading and writing were over. Educators and parents worried deeply that the TV generation would be unable to write. But the interconnected, cool, thin displays of computer screens launched an epidemic of writing that continues to swell. As a consequence, the amount of time people spend reading has almost tripled since 1980. By 2008, the World Wide Web contained more than a trillion pages, and that total grows rapidly every day.","foot":false},{"L":null,"t":"But it is not book reading or newspaper reading, it is screen reading. Screens are always on, and, unlike books, we never stop staring at them. This new platform is very visual, and it is gradually merging words with moving images. You might think of this new medium as books we watch, or television we read. We also use screens to present data, and this encourages numeracy: visualising data and reading charts, looking at pictures and symbols are all part of this new literacy.","foot":false},{"L":null,"t":"Screens engage our bodies, too. The most we may do while reading a book is to flip the pages or turn over a corner, but when we use a screen, we interact with what we see. In the futuristic movie Minority Report, the main character stands in front of a screen and hunts through huge amounts of information as if conducting an orchestra. Just as it seemed strange five centuries ago to see someone read silently, in the future it will seem strange to read without moving your body.","foot":false},{"L":null,"t":"In addition, screens encourage more utilitarian (practical) thinking. A new idea or unfamiliar fact will cause a reflex to do something: to research a word, to question your screen ‘friends’ for their opinions or to find alternative views. Book reading strengthened our analytical skills, encouraging us to think carefully about how we feel. Screenreading, on the other hand, encourage quick responses, associating this idea with another, equipping us to deal with the thousands of new thoughts expressed every day. For example, we review a movie for our friends while we watch it; we read the owner’s manual of a device we see in a shop before we purchase it, rather than after we get home and discover that it can’t do what we need it to do.","foot":false},{"L":null,"t":"Screens provoke action instead of persuasion. Propaganda is less effective, and false information is hard deliver in a world of screens because while misinformation travels fast, corrections do, too. On a screen, it is often easier to correct a falsehood than to tell one in the first place. Wikipedia works so well because it removes an error in a single click. In books, we find a revealed truth; on the screen, we assemble our own truth from pieces. What is more, a screen can reveal the inner nature of things. Waving the camera eye of a smartphone over the bar code of a manufactured product reveals its price, origins and even relevant comments by other owners. It is as if the screen displays the object’s intangible essence. A popular children’s toy (Webkinz) instills stuffed animals with a virtual character that is ‘hidden’ inside; a screen enables children to play with this inner character online in a virtual world.","foot":false},{"L":null,"t":"In the near future, screens will be the first place we’ll look for answers, for friends, for news, for our sense of who we are and who we can be.","foot":false}],"groups":[{"a":27,"b":31,"k":"mcq","instr":["Choose the correct letter, A, B, C or D.","Write the correct letter in boxes 27–31 on your answer sheet."],"items":[{"n":27,"t":"What does the writer say about dictation?","opts":[{"k":"A","t":"It helped people learn to read."},{"k":"B","t":"It affected the way people wrote."},{"k":"C","t":"It was not used until the 11th century."},{"k":"D","t":"It was used mainly for correspondence."}]},{"n":28,"t":"According to the writer, what changed after the invention of the printing press?","opts":[{"k":"A","t":"Romance became more popular than serious fiction."},{"k":"B","t":"Newspapers became more popular than books."},{"k":"C","t":"Readers asked for more autobiographies."},{"k":"D","t":"Authors had a wider choice of topics."}]},{"n":29,"t":"In the third paragraph, the writer focuses on the","opts":[{"k":"A","t":"legal concerns of authors."},{"k":"B","t":"rapid changes in public libraries."},{"k":"C","t":"growing status of the written word."},{"k":"D","t":"recognition of the book as an art form."}]},{"n":30,"t":"What does the writer say about screens in the fourth paragraph?","opts":[{"k":"A","t":"They are hard to read."},{"k":"B","t":"They are bad for our health."},{"k":"C","t":"They can improve our work."},{"k":"D","t":"They can be found everywhere."}]},{"n":31,"t":"According to the writer, computers differ from television because they","opts":[{"k":"A","t":"encourage more reading."},{"k":"B","t":"attract more criticism."},{"k":"C","t":"take up more of our leisure time."},{"k":"D","t":"include more educational content."}]}],"opts":[],"ctx":[]},{"a":32,"b":36,"k":"yn","instr":["Do the following statements agree with the views of writer in Reading Passage 3?","In boxes 32–36 on your answer sheet, write"],"items":[{"n":32,"t":"Screen reading has reduced the number of books and newspapers people read.","opts":[]},{"n":33,"t":"Screen literacy requires a wider range of visual skills than book-based literacy.","opts":[]},{"n":34,"t":"Screen reading is more active than book reading.","opts":[]},{"n":35,"t":"Screens and books produce similar thought patterns in their readers.","opts":[]},{"n":36,"t":"People are easily persuaded to believe lies on the screen.","opts":[]}],"opts":[],"ctx":[]},{"a":37,"b":40,"k":"match","instr":["Complete each sentence with the correct ending, A–F, below.","Write the correct letter, A–F, in boxes 37–40 on your answer sheet."],"items":[{"n":37,"t":"The film Minority Report illustrates","opts":[]},{"n":38,"t":"Our behaviour when we watch a film shows","opts":[]},{"n":39,"t":"Wikipedia’s success relies on","opts":[]},{"n":40,"t":"Webkinz is an example of","opts":[]}],"opts":[{"k":"A","t":"the accuracy of its information."},{"k":"B","t":"people’s ability to concentrate."},{"k":"C","t":"the global use of the Internet."},{"k":"D","t":"how people behave physically when they read screens."},{"k":"E","t":"the screen’s ability to make an object seem real."},{"k":"F","t":"how rapidly opinions can be communicated."}],"ctx":[]}],"ans":{"27":{"raw":"B It affected the way people wrote.","v":"B","ex":"What does the writer say about dictation? Answer: B It affected the way people wrote. Part of the passage: Reading and writing, like all technologies, are constantly changing. In ancient times, authors often dictated their books. Dictation sounded like an uninter- rupted series of words, so scribes wrote these down in one long continuous string, just as they occur in speech. For this reason, text was written without spaces between words until the 11th century. This continuous script made books hard to read, so only a few people were accomplished at reading them aloud to others. Being able to read silent- ly to yourself was considered an amazing talent; writing was an even rarer skill. In fact, in 15th century Europe, only one in 20 adult males could write."},"28":{"raw":"D Authors had a wider choice of topics.","v":"D","ex":"According to the writer, what changed after the invention of the printing press? Answer: D Authors had a wider choice of topics. Part of the passage: After Gutenberg’s invention of the printing press in about 1440, mass-produced books changed the way people read and wrote. The technology of printing increased the number of words available, and more types of media, such as newspapers and magazines, broadened what was written about. Authors no longer had to produce scholarly works, as was common until then, but could write, for example, inexpensive, heart-rending love stories or publish autobiographies, even if they were unknown."},"29":{"raw":"C growing status of the written word.","v":"C","ex":"In the third paragraph, the writer focuses on the Answer: C growing status of the written word. Part of the passage: In time, the power of the written word gave birth to the idea of authority and expertise. Laws were compiled into official documents, contracts were written down and nothing was valid unless it was in this form. Painting, music, ar- chitecture, dance were all important, but the heartbeat of many cultures was the turning pages of a book. By the early 19th century, public libraries had been built in many cities."},"30":{"raw":"D They can be found everywhere.","v":"D","ex":"What does the writer say about screens in the fourth paragraph? Answer: D They can be found everywhere. Part of the passage: Some 4.5 billion digital screens illuminate our lives. Letters are no longer fixed in black ink on paper, but flitter on a glass surface in a rainbow of colors as fast as our eyes can blink. Screens fill our pockets, briefcases, cars, living-room walls and the sides of buildings. They sit in front of us when we work – regardless of what we do. And of course, these newly ubiquitous screens have changed how we read and write."},"31":{"raw":"A encourage more reading.","v":"A","ex":"According to the writer, computers differ from television because they Answer: A encourage more reading. Part of the passage: The first screens that overtook culture, several decades ago – the big, fat, warm tubes of television – reduced the time we spent reading to such an extent that it seemed as if reading and writing were over. Educators and parents worried deeply that the TV generation would be unable to write. But the interconnected, cool, thin displays of computer screens launched an epidemic of writing that continues to swell. As a consequence, the amount of time people spend reading has almost tripled since 1980."},"32":{"raw":"Not Given","v":"NG","ex":"Screen reading has reduced the number of books and newspapers people read. Answer: Not Given Part of the passage: But it is not book reading or newspaper reading, it is screen reading. Screens are always on, and, unlike books, we never stop staring at them. This new platform is very visual, and it is gradually merging words with moving images. You might think of this new medium as books we watch, or television we read. We also use screens to present data, and this encourages numeracy: visualising data and reading charts, looking at pictures and symbols are all part of this new literacy. Explanation: The authors says screen reading is different from book reading or newspaper reading, but does not claim that it has affected the number of books or newspapers people read."},"33":{"raw":"Yes","v":"Y","ex":"Screen literacy requires a wider range of visual skills than book-based literacy. Answer: Yes Part of the passage: But it is not book reading or newspaper reading, it is screen read- ing. Screens are always on, and, unlike books, we never stop staring at them. This new platform is very visual, and it is gradually merging words with moving images.You might think of this new medium as books we watch, or television we read. We also use screens to present data, and this encourages numeracy: visualising data and reading charts, looking at pictures and symbols are all part of this new literacy. Explanation: The writer is comparing screen literacy to book-based literacy by claiming that this new platform is very visual. Later, he lists these new visual skills we’ve gained as a result: visualizing data, reading charts, looking at pictures and symbols."},"34":{"raw":"Yes","v":"Y","ex":"Screen reading is more active than book reading. Answer: Yes Part of the passage: Screens engage our bodies, too. The most we may do while reading a book is to flip the pages or turn over a corner, but when we use a screen, we interact with what we see. In the futuristic movie Minority Report, the main charac- ter stands in front of a screen and hunts through huge amounts of information as if con- ducting an orchestra. Just as it seemed strange five centuries ago to see someone read silently, in the future it will seem strange to read without moving your body. Explanation: First two sentences show how screen reading moves our body more than the book reading."},"35":{"raw":"No","v":"N","ex":"Screens and books produce similar thought patterns in their readers. Answer: No Part of the passage: In addition, screens encourage more utilitarian (practical) thinking. A new idea or unfamiliar fact will cause a reflex to do something: to research a word, to question your screen ‘friends’ for their opinions or to find alternative views. Book reading strengthened our analytical skills, encouraging us to think carefully about how we feel. Screen reading, on the other hand, encourage quick responses, associating this idea with another, equipping us to deal with the thousands of new thoughts expressed every day. Explanation: Book reading encouraged more analytical thinking. Screen reading, on the other hand (shows contrast), encourages practical thinking."},"36":{"raw":"No","v":"N","ex":"People are easily persuaded to believe lies on the screen. Answer: No Part of the passage: Screens provoke action instead of persuasion. Propaganda is less effective, and false information is hard to deliver in a world of screens because while misinformation travels fast, corrections do, too. On a screen, it is often easier to correct a falsehood than to tell one in the first place. Explanation: 1st and the 2nd sentence contradict the given statement."},"37":{"raw":"D how people behave physically when they read screens.","v":"D","ex":"The film Minority Report illustrates Answer: D how people behave physically when they read screens. Part of the passage: In the futuristic movie Minority Report, the main character stands in front of a screen and hunts through huge amounts of information as if conducting an orchestra. Just as it seemed strange five centuries ago to see someone read silently, in the future it will seem strange to read without moving your body."},"38":{"raw":"F how rapidly opinions can be communicated.","v":"F","ex":"Our behaviour when we watch a film shows Answer: F how rapidly opinions can be communicated. Part of the passage: Screen reading, on the other hand, encourage quick responses, associating this idea with another, equipping us to deal with the thousands of new thoughts expressed every day. For example, we review a movie for our friends while we watch it;"},"39":{"raw":"A the accuracy of its information.","v":"A","ex":"Wikipedia’s success relies on Answer: A the accuracy of its information. Part of the passage: On a screen, it is often easier to correct a falsehood than to tell one in the first place. Wikipedia works so well because it removes an error in a single click."},"40":{"raw":"E the screen’s ability to make an object seem real.","v":"E","ex":"Webkinz is an example of Answer: E the screen’s ability to make an object seem real. Part of the passage: It is as if the screen displays the object’s intangible essence. A popular children’s toy (Webkinz) instills stuffed animals with a virtual character that is ‘hidden’ inside; a screen enables children to play with this inner character online in a vir- tual world."}},"words":[{"w":"Constantly","pos":"adv","def":"all the time and often","lvl":"B2","ex":"He is constantly changing his mind","ar":"باستمرار"},{"w":"Continuous","pos":"adj","def":"without a pause or interruption","lvl":"B2","ex":"My computer makes a continuous low buzzing noise","ar":"متواصل"},{"w":"Heart-rending","pos":"adj","def":"causing great sympathy or sadness","lvl":"","ex":"A hear-rending story","ar":"مُفطر للقلب"},{"w":"Expertise","pos":"n","def":"a high level of knowledge or skill","lvl":"","ex":"We admired the expertise with which he prepared the meal","ar":"خبرة"},{"w":"Compile into","pos":"v","def":"to collect information from different places and arrange it in a book, report","lvl":"C1","ex":"We are compiling some facts and figures for a documentary on the subject","ar":"يجمع في"},{"w":"Heartbeat of something","pos":"n","def":"the person or thing that is most important in forming the character of a place and giving it energy","lvl":"","ex":"A steady heartbeat","ar":"قلب الشيء / محرّكه الأساسي"},{"w":"Ubiquitous","pos":"adj","def":"seeming to be everywhere","lvl":"","ex":"Leather is very much in fashion this season, as is ubiquitous denim","ar":"منتشر في كل مكان"},{"w":"Overtake","pos":"v","def":"to go past something by being a greater amount or degree","lvl":"C1","ex":"Our Us sales have now overtaken our sales in Europe","ar":"يتجاوز"},{"w":"Stare at","pos":"v","def":"to look for a long time with the eyes wide open, especially when surprised","lvl":"","ex":"Don’t stare at people like that, it’s rude","ar":"يحدّق في"},{"w":"Literacy","pos":"n","def":"the ability to read and write","lvl":"C1","ex":"Far more resources are needed to improve adult literacy","ar":"القدرة على القراءة والكتابة"},{"w":"Interact","pos":"v","def":"to communicate with others or react to","lvl":"B2","ex":"It is interesting at parties to see how people interact well with the other children","ar":"يتفاعل"},{"w":"Futuristic","pos":"adj","def":"strange and very modern, or intended to come from some imagined time in the future","lvl":"","ex":"At the unspoiled North Bay, three white pyramids rise like futuristic sails from the sea","ar":"مستقبلي"},{"w":"Equip someone","pos":"v","def":"to give someone the skills they need to do a particular thing","lvl":"","ex":"The course aims to equip people with the skills necessary for a job in this technological age","ar":"يجهّز شخصًا (بمهارات)"},{"w":"Manual of something","pos":"n","def":"a book that gives you practical instructions or how to do something","lvl":"B2","ex":"The computer comes with a 600-page instruction manual","ar":"دليل استخدام"},{"w":"Provoke","pos":"v","def":"to cause a reaction, especially a negative one","lvl":"C2","ex":"The prospects of increased prices has already provoked an outcry","ar":"يُثير (ردّ فعل)"},{"w":"Assemble","pos":"v","def":"to come together in a single place or bring parts together in a single group","lvl":"C2","ex":"We assembled in the meeting room after lunch","ar":"يجمّع / يتجمّع"},{"w":"Intangible","pos":"adj","def":"a feeling or quality exists but you cannot describe it exactly","lvl":"","ex":"She has that intangible quality which you might call charisma","ar":"غير ملموس"},{"w":"Essence","pos":"n","def":"the basic or the most important idea or quality of something","lvl":"C2","ex":"The essence of his argument was that education should continue throughout life","ar":"جوهر"}]},{"n":4,"pp":1,"title":"The domestication of horses","untitled":false,"intro":null,"paras":[{"L":"A","t":"Horses have been racing across the landscape for around 55 million years – much longer than our own species has existed. However, prehistoric remains show that at the end of the Ice Age, some 10,000 years ago, wild horses died out in the Americas and dwindled in western Europe, for reasons that are not clear. But they continued to thrive on the steps of eastern Europe and Central Asia, where short grasses and shrubs grow on vast, dry stretches of land. Most scholars believe it was here that people domesticated the horse. However, the DNA of domestic horses is very diverse. This suggests they may be descended from a number of different wild horse populations, in several locations.","foot":false},{"L":"B","t":"Once horses and humans encountered each other, our two species became powerfully linked. Humans domesticated horses some 6,000 years ago, and over time, we have created more than 200 breeds. The first domestic horses were likely to have been kept mainly as a source of food, rather than for work or for riding. There is evidence of horses being raised for meat in Kazakhstan, in Central Asia, around 5,500 years ago; later they began to pull chariots, and horseback riding became common in Afghanistan and Iran about 4,000 years ago. As we have shaped horses to suit our needs on battlefields, farms and elsewhere, these animals have shaped human history. The ways we travel, trade, play, work and fight wars have all been profoundly shaped by our use of horses.","foot":false},{"L":"C","t":"When people domesticate animals, they control their behavior in many ways. For example, animals that are being domesticated no longer choose their own mates. Instead, people control their breeding. Individuals with traits that humans prefer are more likely to produce offspring and pass on their genes. In the course of several generations, both the body and behavior of the animal are transformed. In the wild, animals that are well adapted to their environment live long and reproduce, while others die young. In this way, nature “chooses” the traits that are passed on to the next generation. This is the process of evolution by natural selection. Domestic animals also evolve, but people do the selecting. Humans seek out qualities like tameness, and help animals with those traits to survive and bear young. This is evolution by artificial selection. Most domestic animals are naturally social. Their wild ancestors lived in groups, with individuals responding to each other – some led, others followed. In domestic animals, the tendency to submit to others is especially strong. Generations of breeding have encouraged them to let people take the lead.","foot":false},{"L":"D","t":"For more than 3,000 years, a fighter on horseback or horse-drawn chariot was the ultimate weapon. Time after time, from Asia to Europe to the Americas, the use of horses has changed the balance of power between civilizations. When people with horses clashed with those without, horses provided a huge advantage. When both sides had horses, battles turned on the strength and strategy of their mounted horsemen, or cavalry. Horses continued to define military tactics well into the 1900s, until they finally became outmoded by machine guns, tanks, airplanes and other modern weapons.","foot":false},{"L":"E","t":"Horses are built for power. Their muscular bodies are heavier in the front than in the back, making them well balanced to pull heavy loads. Yet they can also be agile and quick – fit to carry out difficult tasks at top speed. So for more than a thousand years, people have called on the power of horses to cultivate the land and manage livestock.","foot":false},{"L":"F","t":"For most of human history, there was no faster way to travel over land than on a horse. When it comes to carrying people and their possessions, horses have two important advantages – they can run very fast and very far. Their speed and endurance are unusual for a creature so large, making them the most suitable animals to carry people and goods around the world. Horses offer other advantages as well. Since they eat grass, they can go almost anywhere that humans can, eating as they go. And unlike cows and camels, which must sit and rest to digest food, a horse’s digestive system allows it to graze and walk the whole day without stopping. By carrying people, goods and ideas between civilizations, horses changed history.","foot":false},{"L":"G","t":"Today’s horses are not used to carry soldiers into battle, and do not pull plows and stage-coaches as they once did. But horses are still part of our lives. Today the 58 million horses in the world are used more for companionship, sport and recreation than for work and warfare.","foot":false}],"groups":[{"a":1,"b":7,"k":"head","instr":["Reading Passage 1 has seven paragraphs, A–G.","Choose the correct heading for each paragraph from the list of headings below.","Write the correct number, i–x, in boxes 1–7 on your answer sheet."],"items":[{"n":1,"t":"Section A","opts":[]},{"n":2,"t":"Section B","opts":[]},{"n":3,"t":"Section C","opts":[]},{"n":4,"t":"Section D","opts":[]},{"n":5,"t":"Section E","opts":[]},{"n":6,"t":"Section F","opts":[]},{"n":7,"t":"Section G","opts":[]}],"opts":[{"k":"i","t":"The fastest breeds of horses"},{"k":"ii","t":"Developing desirable characteristics"},{"k":"iii","t":"Playing a less essential role"},{"k":"iv","t":"Influencing the outcome of conflicts"},{"k":"v","t":"What different breeds do best"},{"k":"vi","t":"A wide range of uses for domestic horses"},{"k":"vii","t":"Horses in agriculture"},{"k":"viii","t":"An ancient species"},{"k":"ix","t":"An ideal form of transport"},{"k":"x","t":"What the earliest horses looked like"}],"ctx":[],"optTitle":"List of Headings"},{"a":8,"b":10,"k":"tf","instr":["Do the following statements agree with the information given in Reading Passage 1?","In boxes 8–10 on your answer sheet, write"],"items":[{"n":8,"t":"The last of the wild horses lived around 10,000 years ago.","opts":[]},{"n":9,"t":"Initially people probably used domesticated horses to supplement their diet.","opts":[]},{"n":10,"t":"Methods of artificial selection have changed over the centuries.","opts":[]}],"opts":[],"ctx":[]},{"a":11,"b":13,"k":"gap","instr":["Complete the sentences below.","Choose NO MORE THAN TWO WORDS from the passage for each answer.","Write your answers in boxes 11–13 on your answer sheet."],"items":[{"n":11,"t":"Having greater weight at the …………… helps horses to pull heavy items.","opts":[]},{"n":12,"t":"As well as being quicker, horses have greater …………… than most other large animals.","opts":[]},{"n":13,"t":"Because of the way their …………… works, horses can keep moving all day long.","opts":[]}],"opts":[],"ctx":[]}],"ans":{"1":{"raw":"viii An ancient species","v":"viii","ex":"Highlighted in red = Question 1 Highlighted in blue = Question 8 Part of the passage [Par A]: Horses have been racing across the landscape for around 55 million years – much longer than our own species has existed. However, prehistoric remains show that at the end of the Ice Age, some 10,000 years ago, wild horses died out in the Americas and dwindled in western Europe, for reasons that are not clear. But they continued to thrive on the steps of eastern Europe and Cen- tral Asia, where short grasses and shrubs grow on vast, dry stretches of land. Most scholars believe it was here that people domesticated the horse. However, the DNA of domestic horses is very diverse. This suggests they may be descended from a number of different wild horse populations, in several locations. Main idea in paragraph A: Horses have been around since prehistoric times. Possible headings: viii An ancient species x What the earliest horses looked like Comment: Any other heading does not look even close, but if you look attentively, only one of these two possible headings match the paragraph. Does it (the 1st para- graph) mention how the earliest horses looked (their appearance)? No, it generally mentions that horses have lived on Earth for so many years since prehistoric (ancient) times. So the correct answer is: Q 1. Section A: viii An ancient species Comment: After reading the 1st paragraph, can we answer any other question from a different set? Q 8. The last of the wild horses lived around 10,000 years ago. Meaning: Did wild horses die out completely (last) around 10,000 years ago? Answer: No. Therefore, False Explanation: Wild horses in America died out around that time; in Western Europe, their numbers dwindled (declined), but in Eastern Europe and Central Asia, they continued to live."},"2":{"raw":"vi A wide range of uses for domestic horses","v":"vi","ex":"Highlighted in red = Question 2 Highlighted in blue = Question 9 Part of the passage [Par B]: Once horses and humans encountered each other, our two species became powerfully linked. Humans domesticated horses some 6,000 years ago, and over time, we have created more than 200 breeds. The first domestic horses were likely to have been kept mainly as a source of food, rather than for work or for riding. There is evidence of horses being raised for meat in Kazakhstan, in Central Asia, around 5,500 years ago; later they began to pull chariots, and horseback riding became common in Afghanistan and Iran about 4,000 years ago. As we have shaped horses to suit our needs on battlefields, farms and elsewhere, these animals have shaped human history. The ways we travel, trade, play, work and fight wars have all been profoundly shaped by our use of horses. Main idea in paragraph B: Use of horses influenced how we travel, trade, play, work and fight. Possible headings: vi A wide range of uses for domestic horses v What different breeds do best iv Influencing the outcome of conflicts Comment: For paragraph B, it is easier to decide. Let’s eliminate two unsuitable headings first: Comment: Even though it says “we have created 200 breeds”, the paragraph does not focus on what each breed does best. It just mentions what domesticated horses were used for generally (travel, trade, play etc) v What different breeds do best Comment: Another heading some students might choose is iv, which is about war. The text mentions that horses were used in battlefields and other places, but does not go in depth about the outcome (result) of these wars. iv Influencing the outcome of conflicts Comment: The whole paragraph discusses a wide range of uses for domestic horses: being a source of food at first, and later being used for horseback riding or pull- ing chariots. The last sentence summarizes this by again listing different aspects of human lives (work, play, trade etc) being shaped (influenced) by domesticated horses: Q 2. Section B: vi A wide range of uses for domestic horses Comment: Is there any other question we can answer in paragraph B? Q 9. Initially people probably used domesticated horses to supplement their diet. Meaning: Is it true that at first people may have used domesticated horses for food? Answer: Yes. Therefore, True Explanation: According to the text, the first domesticated horses were probably kept as a source of food, rather than other purposes (see the highlighted part)."},"3":{"raw":"ii Developing desirable characteristics","v":"ii","ex":"Highlighted in red = Question 3 Highlighted in blue = Question 10 Part of the passage [Par C]: When people domesticate animals, they control their behavior in many ways. For example, animals that are being domesticated no longer choose their own mates. Instead, people control their breeding. Individuals with traits that humans prefer are more likely to produce offspring and pass on their genes. In the course of several generations, both the body and behavior of the animal are transformed. In the wild, animals that are well adapted to their environ- ment live long and reproduce, while others die young. In this way, nature “chooses” the traits that are passed on to the next generation. This is the process of evolution by nat- ural selection. Domestic animals also evolve, but people do the selecting. Humans seek out qualities like tameness, and help animals with those traits to survive and bear young. This is evolution by artificial selection. Most domestic animals are natu- rally social. Their wild ancestors lived in groups, with individuals responding to each oth- er – some led, others followed. In domestic animals, the tendency to submit to others is especially strong. Generations of breeding have encouraged them to let people take the lead. Main idea in paragraph C: Domesticated horses develop qualities that humans prefer. Possible headings: ii Developing desirable characteristics iii Playing a less essential role Comment: When searching for the most suitable heading, make sure the heading you choose reflects the main idea. For paragraph B, some students may be trapped and think domesticated horses play a less essential role than wild horses. It is true that this paragraph compares these two different types, but does not claim one is more essential than the other. iii Playing a less essential role Comment: The main idea of the paragraph is expressed at the beginning and it is about the different traits (qualities) that domesticated horses have. And these traits are developed because that is what humans desire in their domesticated horses: Q 3. Section C: ii Developing desirable characteristics Comment: There is another question we can answer using the information in this paragraph: Q 10. Methods of artificial selection have changed over the centuries. Meaning: Have people changed their methods of artificial selection over the centuries? Answer: We don’t know. Therefore, Not Given Explanation: This paragraph applies the law of ‘natural selection’ to ‘artificial selection’ where humans, not the nature, select the desirable traits. However, it does not mention any methods being changed over time."},"4":{"raw":"iv Influencing the outcome of conflicts","v":"iv","ex":"Section D: iv Influencing the outcome of conflicts"},"5":{"raw":"vii Horses in agriculture","v":"vii","ex":"Highlighted in red = Question 5 Highlighted in blue = Question 11 Part of the passage [Par E]: Horses are built for power. Their muscular bodies are heavier in the front than in the back, making them well balanced to pull heavy loads. Yet they can also be agile and quick – fit to carry out difficult tasks at top speed. So for more than a thousand years, people have called on the power of horses to cultivate the land and manage livestock. Main idea in paragraph E: Horses have been used in agriculture for over a thousand years. Comment: It is a short paragraph, and the main idea is expressed at the end with help of the signal word ‘so’. Previous sentences support this main idea. Again because the paragraph is short, the most suitable heading is easy to spot: Q 5. Section E: vii Horses in agriculture Comment: There is a sentence-completion question from this paragraph: Q 11. Having greater weight at the ……………… helps horses to pull heavy items. Part of the passage [Par E]: Their muscular bodies are heavier in the front than in the back, making them well balanced to pull heavy loads. Comment: Having greater weight = their muscular bodies are heavier Comment: Helps horses to pull heavy items = making them well balanced to pull heavy loads Answer: front"},"6":{"raw":"ix An ideal form of transport","v":"ix","ex":"Highlighted in red = Question 6 Highlighted in blue = Questions 12 and 13 Part of the passage [Par F]: For most of human history, there was no faster way to travel over land than on a horse. When it comes to carrying people and their possessions, horses have two important advantages – they can run very fast and very far. Their speed and endurance are unusual for a creature so large, making them the most suitable animals to carry people and goods around the world. Horses offer other advantages as well. Since they eat grass, they can go almost anywhere that humans can, eating as they go. And unlike cows and camels, which must sit and rest to digest food, a horse’s digestive system allows it to graze and walk the whole day without stopping. By carrying people, goods and ideas between civilizations, horses changed history. Main idea in paragraph F: Horses were the best way to travel on land for most of the human history. Possible headings: ix An ideal form of transport i ZO The fastest breeds of horses Comment: Even though paragraph F talks about speed, it only mentions it as one of the advantages of travelling on horses. And it definitely does NOT compare different breeds of horses based on speed. i The fastest breeds of horses Comment: The main idea of the paragraph is how horses were ideal form of transport and it is supported by giving a number of reasons: They are fast (speed), they can go far (endurance), and most importantly, they can go without stopping while eating (grazing): Q 6. Section F: ix An ideal form of transport Comment: We have two more sentence-completion questions taken out of this paragraph: Q 12. As well as being quicker, horses have greater ………….… than most other large animals. Part of the passage [Par F]: Their speed and endurance are unusual for a creature so large, making them the most suitable animals to carry people and goods around the world. Comment: As well as being quicker = their speed and Comment: They have two advantages over other large animals: speed and endurance. Since speed is already given in the question, the noun we are looking for is endurance. Answer: endurance Q 13. Because of the way their ……………… works, horses can keep moving all day long. Part of the passage [Par F]: a horse’s digestive system allows it to graze and walk the whole day without stopping. Answer: digestive system"},"7":{"raw":"iii Playing a less essential role","v":"iii","ex":"Section G: iii Playing a less essential role"},"8":{"raw":"No. Therefore, False","v":"F","ex":"Highlighted in red = Question 1 Highlighted in blue = Question 8 Part of the passage [Par A]: Horses have been racing across the landscape for around 55 million years – much longer than our own species has existed. However, prehistoric remains show that at the end of the Ice Age, some 10,000 years ago, wild horses died out in the Americas and dwindled in western Europe, for reasons that are not clear. But they continued to thrive on the steps of eastern Europe and Cen- tral Asia, where short grasses and shrubs grow on vast, dry stretches of land. Most scholars believe it was here that people domesticated the horse. However, the DNA of domestic horses is very diverse. This suggests they may be descended from a number of different wild horse populations, in several locations. Main idea in paragraph A: Horses have been around since prehistoric times. Possible headings: viii An ancient species x What the earliest horses looked like Comment: Any other heading does not look even close, but if you look attentively, only one of these two possible headings match the paragraph. Does it (the 1st para- graph) mention how the earliest horses looked (their appearance)? No, it generally mentions that horses have lived on Earth for so many years since prehistoric (ancient)
