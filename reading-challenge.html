 const D=S.day?DAYS[S.day-1]:null;
 // words
 if(d.know&&D){const p=DP(D.n);if(p.words[d.know])delete p.words[d.know];else{p.words[d.know]=1;addXP(1)}if(D.words.every(w=>p.words[hw(w)]))p.steps.words=1;save();render();return}
 if(d.wdone&&D){DP(D.n).steps.words=1;addXP(5);save();S.step='read';render();try{window.scrollTo({top:0})}catch(e){}return}
 // reading
 if(d.fs){P.fs=Math.max(14,Math.min(26,(P.fs||18)+2*(+d.fs)));save();render();return}
 if(d.readall&&D){if(speaking){stopSpeak();render();return}const ps=D.paras.filter(p=>!p.foot).map(p=>p.t);
  // read paragraphs one by one
  const chain=k=>{if(k>=ps.length){speaking=false;render();return}try{speechSynthesis.cancel()}catch(e){}const u=new SpeechSynthesisUtterance(ps[k]);u.lang='en-GB';if(enV)u.voice=enV;u.rate=.9;u.onend=()=>{if(speaking)chain(k+1)};speaking=true;speechSynthesis.speak(u)};
  try{chain(0)}catch(e){toast('الصوت غير متاح')}render();return}
 if(d.sayp!=null&&D){speak(D.paras[+d.sayp].t,.9);return}
 if(d.trp!=null&&D){const key=D.n+':'+d.trp;S.ptrOn=S.ptrOn||{};if(S.ptr[key]){S.ptrOn[key]=!S.ptrOn[key];render();return}
  b.disabled=true;b.textContent='المدرّبة تترجم…';try{const t=await askAI(`Translate this English paragraph from an IELTS reading passage into clear, simple Modern Standard Arabic suitable for a learner. Keep names in English letters. Return only the Arabic translation.\n\n${D.paras[+d.trp].t}`);S.ptr[key]=t;S.ptrOn[key]=true;store.set('r30_tr',S.ptr)}catch(e){toast(aiErr(e))}render();return}
 if(d.readdone&&D){const p=DP(D.n);if(!p.read){p.read=true;addXP(10)}save();S.step='test';render();try{window.scrollTo({top:0})}catch(e){}return}
 // book test
 if(d.qa&&d.scope){if(locked(d.scope))return;const A=ansObj(d.scope);A[d.qa]=A[d.qa]===d.v?null:d.v;save();render();return}
 if(d.multi&&d.scope){if(locked(d.scope))return;const A=ansObj(d.scope);const Dd=dayOfScope(d.scope);const g=groupOf(Dd,+d.multi);let v=String(A[d.multi]||'').split(',').filter(Boolean);if(v.includes(d.v))v=v.filter(x=>x!==d.v);else if(v.length<g.count)v.push(d.v);else{toast('اخترتي العدد المطلوب. شيلي حرف أول.');return}A[d.multi]=v.sort().join(',');save();render();return}
 if(d.check&&D){const p=DP(D.n);const filled=Object.values(p.test.a).filter(v=>v!=null&&v!=='').length;p.test.checked=true;const g=grade(D,p.test.a);p.test.score=g.score;p.test.best=Math.max(p.test.best||0,g.score);addXP(15+g.score*2);if(S.timer&&S.timer.day===D.n){S.timer.running=false}save();render();try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){}if(g.score===g.total)celebrate();return}
 if(d.retest&&D){const p=DP(D.n);p.test={a:{},checked:false,score:null,best:p.test.best};S.open={};S.aiex={};S.hl=null;S.timer=null;save();render();return}
 if(d.timer&&D){if(!S.timer||S.timer.day!==D.n)S.timer={day:D.n,left:20*60,running:false};S.timer.running=!S.timer.running;render();return}
 if(d.pane){S.pane=d.pane;render();return}
 if(d.expl){const n=+d.expl;S.open[n]=!S.open[n];render();return}
 if(d.where){const Dd=dayOfScope(d.scope);const r=findAnswer(Dd,+d.where);if(!r){toast('ما قدرت أحدد المكان بالضبط. اقرئي «شرح الكتاب».');S.open[+d.where]=true;render();return}S.hl={day:Dd.n,set:r.hl,first:r.first};if(d.scope==='b')S.pane='p';else S.fpane[Dd.n]='p';render();return}
 if(d.aiex){const Dd=dayOfScope(d.scope);const n=+d.aiex;const g=groupOf(Dd,n);const it=g.items.find(x=>x.n===n);b.disabled=true;b.textContent='المدرّبة تكتب…';
  try{const t=await askAI(`You are an IELTS reading tutor for an Arabic-speaking learner. Explain in simple Arabic (4-5 short sentences) why the correct answer is right, and point to the paraphrase between the question and the passage. Question type: ${g.k}. Question: "${it?it.t:(g.q||g.ctx.join(' '))}". Correct answer: "${Dd.ans[n].raw}". Book explanation: "${(Dd.ans[n].ex||'').slice(0,1200)}". Reply in Arabic only.`,'default');S.aiex[n]=t;S.open[n]=true}catch(e){toast(aiErr(e))}render();return}
 // games
 if(d.play){if(D){S.step='games';startGame(D,d.play)}return}
 if(d.mastery&&D){S.step='mastery';startGame(D,'mastery');return}
 if(d.gback){stopSpeak();S.game=null;render();return}
 const G=S.game;
 if(G&&!G.done){const R=G.rounds[G.i];
  if(d.pick!=null&&G.picked==null){answerRound(R.opts[+d.pick].val);return}
  if(d.next){G.i++;G.picked=null;render();return}
  if(d.flip!=null){R.flipped=true;speak(hw(R.w),.8);render();return}
  if(d.fk!=null){G.picked=d.fk==='1'?'ok':'no';if(G.picked==='ok'){G.score++;addXP(1);const p=DP(G.day);p.words[hw(R.w)]=1;save()}G.i++;G.picked=null;render();return}
  if(d.tcheck){const v=($('#tin')||{}).value||'';R.typed=v;let ok=false;if(R.mode==='spell')ok=v.trim().toLowerCase()===R.target.toLowerCase();else if(R.mode==='dict'){const x=diffWords(R.target,v);ok=x.ok/x.total>=.85}else ok=gapOK(R.a,v);answerRound(ok?'ok':'no');return}
  if(d.tile!=null){R.built.push(+d.tile);render();return}
  if(d.unb!=null){R.built.splice(+d.unb,1);render();return}
  if(d.breset){R.built=[];render();return}
  if(d.bcheck){answerRound(R.built.map(i=>R.toks[i]).join(' ')===R.toks.join(' ')?'ok':'no');return}
  if(d.ord!=null){const j=+d.ord;const k=R.picked.indexOf(j);if(k>=0)R.picked.splice(k,1);else R.picked.push(j);render();return}
  if(d.oreset){R.picked=[];render();return}
  if(d.ocheck){answerRound(R.picked.every((j,i)=>j===i)?'ok':'no');return}
  if(d.msel){const k=d.msel;if(R.sel.includes(k))R.sel=R.sel.filter(x=>x!==k);else if(R.sel.length<R.ans.length)R.sel.push(k);render();return}
  if(d.mcheck){answerRound(R.sel.length===R.ans.length&&R.sel.every(x=>R.ans.includes(x))?'ok':'no');return}
  if(d.pcheck&&R.kind==='pron'){const h=(($('#tin')||{}).value||'').trim();if(!h){toast('ما وصلني شي. اضغطي المربع وتكلّمي بميكروفون الكيبورد.');return}pronTry(R,h);return}
  if(d.pskip&&R.kind==='pron'){answerRound('no');return}
  if(d.mic&&R.kind==='pron'){listenOnce(t=>{const i=$('#tin');if(i)i.value=t;pronTry(R,t)});return}
  if(d.pai&&R.kind==='pron'){const last=R.tries[R.tries.length-1];R.aiBusy=true;render();try{R.ai=await askAI(`An Arabic-speaking learner tried to pronounce the English word "${R.target}". Speech recognition heard "${last.h}". In simple Gulf-friendly Arabic, in 3 short lines: which sound/syllable was probably wrong, how to place the mouth/tongue, and the stressed syllable written like this: land-SCAPE. Plain text.`)}catch(e){R.ai=aiErr(e)}R.aiBusy=false;render();return}
  if(d.peek!=null){peek(DAYS[G.day-1],+d.peek);return}
  if(d.peekall){peek(DAYS[G.day-1],null);return}
 }
 // word sheet
 if(d.wsave&&S.word){const W=S.word;const i=P.nb.findIndex(x=>x.w.toLowerCase()===W.w.toLowerCase());if(i>=0)P.nb.splice(i,1);else{P.nb.unshift({w:W.w,ar:glossOf(W.w).ar,s:W.sent,d:W.D?W.D.n:null});addXP(1)}save();drawSheet();return}
 if(d.wai&&S.word){const W=S.word;W.busy=true;drawSheet();try{W.ai=await askAI(`An Arabic-speaking IELTS learner clicked the word "${W.w}" in this sentence: "${W.sent}". In Arabic, give: 1) its exact meaning in this sentence (2-5 words), 2) one short note on usage, 3) the Arabic translation of the whole sentence. Keep it short, plain text, no markdown.`)}catch(e){W.ai=aiErr(e)}W.busy=false;drawSheet();return}
 // notebook
 if(d.nbdel!=null){P.nb.splice(+d.nbdel,1);save();render();return}
 if(d.nbgame){const ws=P.nb.filter(x=>x.ar);S.game={id:'nb',day:1,rounds:shuffle(ws).slice(0,10).map(x=>{const o=shuffle(ws.filter(y=>y!==x&&y.ar!==x.ar)).slice(0,3);return choiceRound({prompt:`<div class="big">${esc(x.w)}</div>${x.s?`<div class="sent small muted" style="margin-top:6px">${esc(x.s)}</div>`:''}`,opts:shuffle([x,...o]).map(y=>({label:y.ar,val:y.w})),ans:x.w,say:x.w,autosay:1,why:`${esc(x.w)} = ${esc(x.ar)}`})}),i:0,score:0,picked:null,done:false,wrong:[]};render();return}
 // final
 if(d.fnew){newFinal();S.frun=false;S.hl=null;S.open={};render();return}
 if(d.ftab!=null){S.ftab=+d.ftab;S.hl=null;render();try{window.scrollTo({top:0})}catch(e){}return}
 if(d.fpane){const Dd=DAYS[P.final.days[S.ftab]-1];S.fpane[Dd.n]=d.fpane;render();return}
 if(d.ftimer){S.frun=!S.frun;render();return}
 if(d.fcheck){P.final.checked=true;S.frun=false;let s=0,t=0;P.final.days.forEach(n=>{const g=grade(DAYS[n-1],P.final.a[n]||{});s+=g.score;t+=g.total});addXP(30+s);save();render();try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){}return}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(S.word){S.word=null;drawSheet()}const e=$('#peek');if(e)e.remove()}
 if(ev.key==='Enter'&&ev.target.id==='tin'){const b=document.querySelector('[data-tcheck],[data-pcheck]');if(b)b.click()}
 if((ev.key==='Enter'||ev.key===' ')&&ev.target.dataset&&ev.target.dataset.flip!=null){ev.preventDefault();ev.target.click()}});
document.addEventListener('input',ev=>{const t=ev.target;
 if(t.classList.contains('gapin')&&t.dataset.scope){if(locked(t.dataset.scope))return;ansObj(t.dataset.scope)[t.dataset.q]=t.value;save();const D=dayOfScope(t.dataset.scope);const sb=document.querySelectorAll('.sheetbar span');sb.forEach(s=>{if(s.textContent===t.dataset.q)s.classList.toggle('f',!!t.value.trim())});return}
 if(t.id==='tin'&&S.game){const R=S.game.rounds[S.game.i];if(R)R.typed=t.value}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.classList.contains('gapsel')&&t.dataset.scope){if(locked(t.dataset.scope))return;ansObj(t.dataset.scope)[t.dataset.q]=t.value;save();render()}});
setInterval(()=>{
 const T=S.timer;if(T&&T.running&&S.room==='plan'&&S.day===T.day&&S.step==='test'){T.left=Math.max(0,T.left-1);const e=$('#tmr');if(e)e.textContent=fmt(T.left);if(T.left===0){T.running=false;toast('خلص الوقت! صحّحي إجاباتك.');render()}}
 if(S.frun&&P.final&&!P.final.checked&&S.room==='final'){P.final.left=Math.max(0,P.final.left-1);const e=$('#ftmr');if(e)e.textContent=fmt(P.final.left);if(P.final.left%15===0)save();if(P.final.left===0){S.frun=false;toast('خلص الوقت!');render()}}
},1000);
render();

</script>
