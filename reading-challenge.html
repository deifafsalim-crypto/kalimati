rt of the passage: Cotton, one of the most popular fibres used in clothing manufac- ture, also has a significant environmental footprint. This crop accounts for a quarter of all the pesticides used in the United States. (C) Answer: G production of unwanted dangerous materials Part of the passage: The manufacture of polyester and other synthetic fabrics is an energy-intensive process requiring large amounts of crude oil and releasing emissions which can cause or aggravate respiratory disease. The Environmental Protection Agen- cy (EPA) considers many textile manufacturing facilities to be hazardous waste genera- tors. (G)","set":["A","C","G"]},"9":{"raw":"polyester","v":"polyester","ex":"What is the name of one material that is not natural? Answer: polyester Part of the passage: For example, polyester, the most widely used manufactured fibre, is made from petroleum."},"10":{"raw":"4%","v":"4%","ex":"What percentage of household garbage is made up of clothes? Answer: 4% Part of the passage: Americans throw away more than 68 pounds of clothing and tex- tiles per person per year, and this represents about 4% of the municipal solid waste. But this figure is rapidly growing.","alts":["4%","4 percent","4 per cent","four percent"]},"11":{"raw":"1920s","v":"1920s","ex":"In what era did Americans stop reusing old clothes? Answer: 1920s Part of the passage: However, the spirit of conservation did not last long; by the mid-1920s, consumerism was back in style.","alts":["1920s","the 1920s","mid-1920s"]},"12":{"raw":"the internet","v":"the internet","ex":"What has caused the selling of used clothing to increase in the US? Answer: the internet Part of the passage: Domestic resale has boomed in the era of the internet. Many people sell directly to other individuals through auction websites such as eBay."},"13":{"raw":"Japan","v":"Japan","ex":"To which country does America export a lot of its good quality used clothing? Answer: Japan Part of the passage: Certain brands and rare collectible items are imported by Japan."}},"words":[{"w":"Leaf thorough","pos":"v","def":"to quickly turn the pages of a book or magazine, reading only a little of it","lvl":"","ex":"The waiting room was full of people leafing through magazines","ar":"يتصفّح سريعًا"},{"w":"Glossy","pos":"adj","def":"smooth and shiny","lvl":"","ex":"She has wonderfully glossy hair","ar":"لامع"},{"w":"Brim with","pos":"v","def":"to become full of something, especially a liquid","lvl":"","ex":"Her eyes brimmed with tears when she heard that she was alive","ar":"يمتلئ بـ"},{"w":"Disparate","pos":"adj","def":"different in every way","lvl":"","ex":"The two cultures were so utterly disparate that she found it hard to adopt from one to the other","ar":"متباين"},{"w":"Disposable","pos":"adj","def":"describes a product that is intended to be thrown away after use","lvl":"C2","ex":"Disposable nappies","ar":"يُستعمل مرة واحدة"},{"w":"Equivalent","pos":"adj","def":"having the same amount, value, qualities and etc.:","lvl":"","ex":"She is doing equivalent job in the new company but for more money","ar":"مكافئ / معادل"},{"w":"Aggravate","pos":"v","def":"to make a disease worse","lvl":"","ex":"The treatment only aggravated the condition","ar":"يزيد سوءًا"},{"w":"Hazardous","pos":"adj","def":"dangerous","lvl":"C2","ex":"A hazardous journey","ar":"خطِر"},{"w":"Assemble","pos":"v","def":"to come together in a single place or bring parts together in a single group","lvl":"C2","ex":"We assembled in the meeting room after lunch","ar":"يجمّع / يتجمّع"},{"w":"Mend","pos":"v","def":"to repair something that is broken or damaged","lvl":"B1","ex":"Could you mend this hole in my shirt?","ar":"يصلح"},{"w":"Landfill","pos":"n","def":"the process of getting rid of large amount of rubbish by burying it, or a place where rubbish is buried","lvl":"","ex":"90 percent of American rubbish is dumped in landfill sites","ar":"مكبّ النفايات"},{"w":"Casts-offs","pos":"n","def":"things, usually clothes that you no longer want","lvl":"","ex":"I always had to wear my sisters’ cast-offs as a child","ar":"ملابس مستغنى عنها"},{"w":"Absorb","pos":"v","def":"to take in, especially gradually","lvl":"B2","ex":"Plants absorb carbon dioxide","ar":"يمتص"},{"w":"High-end","pos":"adj","def":"intended for people who want very good quality products and who do not mind how much they cost","lvl":"","ex":"High-end video equipment","ar":"فاخر / عالي الجودة"},{"w":"Accelerate","pos":"v","def":"when a vehicle or its driver accelerates, the speed of the vehicle increases","lvl":"C2","ex":"I accelerated to overtake the bus","ar":"يسرّع"}]},{"n":23,"pp":2,"title":"Selling the health benefits of enriched ‘phoods’","untitled":false,"intro":null,"paras":[{"L":"A","t":"The introduction of iodine to Morton Salt in 1924 was instrumental in eradicating a dangerous thyroid condition called goiter from the U.S. population. It was also the first time a food company purposely added a medically beneficial ingredient to food to help market that product. Eighty years later, the food industry is intensively researching all kinds of other healthful ingredients it hopes to use to help sell otherwise everyday foods. Functional foods, or ‘phoods’ as they’re sometimes called to connote the intersection of food and pharmaceuticals, have been trickling into supermarkets over the past several years – think of calcium-enhanced orange juice and cholesterol-lowering margarine, for example. But they met with mixed success at first because consumers didn’t know or care enough about the new ingredients.","foot":false},{"L":"B","t":"Now, though, consumers’ growing awareness of health and nutrition, and new regulatory rulings that will make it easier for manufacturers to make health claims on packaging, are re-energizing the ‘phood’ business. Once again, food companies see functional foods as a way to boost sales in a highly competitive market. ‘It’s definitely a big deal,’ said David Lockwood, editor of a recent report on functional foods by market research giant Mintel International Group Ltd. ‘We expect [the functional foods business] to grow about 7.6 percent annually – that’s about twice as fast as the overall food market is going to be growing.’ At the recent annual meeting of the Food Marketing Institute, fully half of the 75 new products one major food company introduced had a ‘health and wellness’ focus, the company said. That’s up from 15 percent of its new products the year before.","foot":false},{"L":"C","t":"Many of these products have added vitamins and minerals, such as a new juice drink that provides 100 percent of a child’s daily vitamin C requirement, and a smoothie boosted with calcium. Lutein, linked to vision health, is now added to prune juice. Soy protein, which can help prevent heart disease, is being added to new breakfast cereals. Major food giants are actively unveiling products overseas, including yogurt with probiotic bacteria, to aid digestion. These nutritionally oriented products make up just 8 percent of company sales but account for 20 percent of its research budget, according to company spokesman Hans-Joerg Renk.","foot":false},{"L":"D","t":"‘There’s a lot of research and development going on into what kinds of products people want, what kinds of products we can produce to meet the demand – that taste good and will be successful in the marketplace – and how we communicate the benefits,’ said Michael E. Diegel, a spokesman for the Grocery Manufacturers of America. Vitamin water drinks, spiked with nutrients such as taurine, vitamin C, calcium and potassium, can be found on shelves of gourmet shops and supermarkets. Officials at privately owned Energy Brands Inc. attribute much of the dramatic growth in sales to consumers’ rising interest in nutrition and wellness.","foot":false},{"L":"E","t":"Food marketing professor Nancy Childs, of St. Joseph’s University in Philadelphia, said the widespread awareness of the low-carb phenomenon has led many consumers to check food labels while trying to lose weight. ‘It starts to make them think about their food in terms of its nutritional components,’ she said, which makes it easier to introduce other ingredients such as soy, fiber and many lesser-known compounds. Although more consumers may be ready to try the new products, the real driver behind the reborn interest of food manufacturers comes from science and the government. Government labs, universities and private companies are doing more research on the health effects of many nutrients, food scientists say, but much of it falls short of the full-scale clinical trials that the Food and Drug Administration has required for use in marketing.","foot":false},{"L":"F","t":"Beginning this spring, the FDA started allowing ‘qualified health claims’ on foods, telling consumers about ingredients that current science ‘suggests’ might be helpful in preventing certain diseases and medical conditions. ‘FDA feels that this does provide more information to the consumer,’ said Kathleen C. Ellwood, director of the agency’s division of Nutrition Programs and Labeling. ‘It’s more to empower the consumer, to make them more aware of possible health benefits in these foods.’","foot":false},{"L":null,"t":"That allowance has opened the floodgates. Dozens of petitions have been filed with the agency seeking permission for such claims: sports drink maker American Longevity wants to claim that lycopene reduces the risk of cancer; coral calcium producer Marine Bio USA has petitioned for a claim that calcium can reduce the risk of kidney stones; and the North American Olive Oil Association wants permission to use a claim that monounsaturated fatty acids can reduce the risk of heart disease. Consumers will start seeing these claims on packages soon, though some nutritionists and scientists are worried that the findings aren’t rock solid. The non-profit Center for Science in the Public Interest has filed suit against the FDA, arguing the new program violates the 1990 Nutrition Labeling and Education Act, which mandated a higher level of scientific agreement for marketing the health benefits of ingredients.","foot":false},{"L":"G","t":"Others fear there will be so many claims they will just become more noise to already bewildered consumers, ‘I’m concerned that too many such claims will cause consumers to tune out and make all of them ineffective’ said Clare Hasler, executive director of the Robert Mondavi Institute for Wine and Food Science at the University of California at Davis. So far, the FDA has approved only a handful of qualified health claims, and they show the limitations that this new system may have, for consumers and food companies. The California Walnut Commission, for example, wanted permission to put this claim on packages of walnuts, which are high in Omega-3 polyunsaturated fatty acids: ‘Diets including walnuts can reduce the risk of heart disease.’ The agency approved wording that is not quite as snappy for package design: ‘Supportive but not conclusive research shows that eating 1.5 oz. walnuts per day, as part of a low saturated fat and low cholesterol diet, and not resulting in increased caloric intake, may reduce the risk of coronary heart disease.’","foot":false}],"groups":[{"a":1,"b":8,"k":"para","instr":["The Reading Passage has seven sections, A–G.","Which section contains the following information?","Write the correct letter, A–G, in boxes 1–8 on your answer sheet.","NB You may use any letter more than once."],"items":[{"n":1,"t":"the significance of the link between consumers reading food labels and functional foods","opts":[]},{"n":2,"t":"a mention of large companies that are marketing functional foods in several manufacturers","opts":[]},{"n":3,"t":"a reference to the success of one functional food in eliminating a disease","opts":[]},{"n":4,"t":"the reason why the FDA’s new ‘qualified health claims’ may not benefit countries","opts":[]},{"n":5,"t":"a prediction of the future sales figures for functional foods","opts":[]},{"n":6,"t":"a mention of the diet that caused consumers to focus on the ingredients in food","opts":[]},{"n":7,"t":"concern about the limitations of research being carried out into the health benefits of functional foods","opts":[]},{"n":8,"t":"the questions regarding functional foods that researchers are concentrating on","opts":[]}],"opts":[{"k":"A","t":""},{"k":"B","t":""},{"k":"C","t":""},{"k":"D","t":""},{"k":"E","t":""},{"k":"F","t":""},{"k":"G","t":""}],"ctx":[]},{"a":9,"b":13,"k":"match","instr":["Complete each sentence with the correct ending, A–G, below.","Write the correct letter, A–G, in boxes 9–13 on your answer sheet.","NB You may use any letter more than once."],"items":[{"n":9,"t":"Early attempts to produce functional foods were not very successful because","opts":[]},{"n":10,"t":"People are now buying more functional foods because","opts":[]},{"n":11,"t":"The FDA has decided to allow health claims on foods because","opts":[]},{"n":12,"t":"The Center for Science in the Public Interest has taken legal action against the FDA because","opts":[]},{"n":13,"t":"The Mondavi Institute for Wine and Food Science is worried because","opts":[]}],"opts":[{"k":"A","t":"consumers did not like the taste of the extra ingredients."},{"k":"B","t":"it wants more researchers to support health claims before food is advertised."},{"k":"C","t":"it wants consumers to know that certain foods can improve their health."},{"k":"D","t":"consumers were ignorant of the benefits of the added ingredients."},{"k":"E","t":"it thinks the abundance of health claims will confuse consumers."},{"k":"F","t":"they are more concerned about their health."},{"k":"G","t":"they are attracted by the design of the packaging."}],"ctx":[]}],"ans":{"1":{"raw":"Par E","v":"E","ex":"the significance of the link between consumers reading food labels and functional foods Answer: Par E Part of the passage: ‘It starts to make them think about their food in terms of its nutri- tional components,’ she said, which makes it easier to introduce other ingredients such as soy, fiber and many lesser-known compounds."},"2":{"raw":"Par C","v":"C","ex":"a mention of large companies that are marketing functional foods in several countries Answer: Par C Part of the passage: Major food giants are actively unveiling products overseas, including yogurt with probiotic bacteria, to aid digestion."},"3":{"raw":"Par A","v":"A","ex":"a reference to the success of one functional food in eliminating a disease Answer: Par A Part of the passage: The introduction of iodine to Morton Salt in 1924 was instrumental in eradicating a dangerous thyroid condition called goiter from the U.S. population. It was also the first time a food company purposely added a medically beneficial ingredient to food to help market that product."},"4":{"raw":"Par G","v":"G","ex":"the reason why the FDA’s new ‘qualified health claims’ may not benefit manufacturers Answer: Par G Part of the passage: So far, the FDA has approved only a handful of qualified health claims and they show the limitations that this new system may have, for consumers and food companies. ...The agency approved wording that is not quite as snappy for package design..."},"5":{"raw":"Par B","v":"B","ex":"a prediction of the future sales figures for functional foods Answer: Par B Part of the passage: ‘We expect [the functional foods business] to grow about 7.6 per- cent annually – that’s about twice as fast as the overall food market is going to be grow- ing.’"},"6":{"raw":"Par E","v":"E","ex":"a mention of the diet that caused consumers to focus on the ingredients in food Answer: Par E Part of the passage: Food marketing professor Nancy Childs, of St. Joseph’s Uni- versity in Philadelphia, said the widespread awareness of the low-carb phenomenon has led many consumers to check food labels while trying to lose weight. ‘It starts to make them think about their food in terms of its nutritional components,’ she said, which makes it easier to introduce other ingredients such as soy, fiber and many lesser-known compounds."},"7":{"raw":"Par F","v":"F","ex":"concern about the limitations of research being carried out into the health benefits of functional foods Answer: Par F Part of the passage: Consumers will start seeing these claims on packages soon, though some nutritionists and scientists are worried that the findings aren’t rock solid."},"8":{"raw":"Par D","v":"D","ex":"the questions regarding functional foods that researchers are concentrating on Answer: Par D Part of the passage: ‘There’s a lot of research and development going on into what kinds of products people want, what kinds of products we can produce to meet the demand – that taste good and will be successful in the marketplace – and how we communicate the benefits..."},"9":{"raw":"D consumers were ignorant of the benefits of the added ingredients.","v":"D","ex":"Early attempts to produce functional foods were not very successful because Answer: D consumers were ignorant of the benefits of the added ingredients. Part of the passage: [Par A] Functional foods, or ‘phoods’ as they’re sometimes called to connote the intersection of food and pharmaceuticals, have been trickling into su- permarkets over the past several years – think of calcium-enhanced orange juice and cholesterol-lowering margarine, for example. But they met with mixed success at first because consumers didn’t know or care enough about the new ingredients."},"10":{"raw":"F they are more concerned about their health.","v":"F","ex":"People are now buying more functional foods because Answer: F they are more concerned about their health. Part of the passage: [Par D] Officials at privately owned Energy Brands Inc. attribute much of the dramatic growth is sales to consumers’ rising interest in nutrition and well- ness."},"11":{"raw":"C it wants consumers to know that certain foods can improve their health.","v":"C","ex":"The FDA has decided to allow health claims on foods because Answer: C it wants consumers to know that certain foods can improve their health. Part of the passage: [Par F] ‘FDA feels that this does provide more information to the consumer,’ said Kathleen C. Ellwood, director of the agency’s division of Nutrition Pro- grams and Labeling. ‘It’s more to empower the consumer, to make them more aware of possible health benefits in these foods.’"},"12":{"raw":"B it wants more researchers to support health claims before food is ad-","v":"B","ex":"The Center for Science in the Public Interest has taken legal action against the FDA because Answer: B it wants more researchers to support health claims before food is ad- vertised. Part of the passage: [Par F] The non-profit Center for Science in the Public Interest has filed suit against the FDA, arguing the new program violates the 1990 Nutrition Labeling and Education Act, which mandated a higher level of scientific agreement for marketing the health benefits of ingredients."},"13":{"raw":"E it thinks the abundance of health claims will confuse consumers.","v":"E","ex":"The Mondavi Institute for Wine and Food Science is worried because Answer: E it thinks the abundance of health claims will confuse consumers. Part of the passage: [Par G] Others fear there will be so many claims they will just become more noise to already bewildered consumers, ‘I’m concerned that too many such claims will cause consumers to tune out and make all of them ineffective’ said Clare Hasler, executive director of the Robert Mondavi Institute for Wine and Food Science at the University of California at Davis."}},"words":[{"w":"Eradicate","pos":"v","def":"to get rid of something completely or destroy something bad","lvl":"C2","ex":"The government claims to be doing all it can to eradicate corruption","ar":"يستأصل / يقضي على"},{"w":"Boost with","pos":"v","def":"to improve or increase something","lvl":"B2","ex":"The theatre managed to boost its audiences by cutting ticket prices","ar":"يعزّز بـ"},{"w":"Unveil","pos":"v","def":"if you unveil something, you show it or make it known for the first time","lvl":"","ex":"A new government policy on forests is due to be unveiled in April","ar":"يكشف عن"},{"w":"Attribute","pos":"v","def":"to say or think that something is the result or work of something","lvl":"C2","ex":"The doctors have attributed the cause of the illness to an unknown virus","ar":"ينسب إلى"},{"w":"Empower","pos":"v","def":"to give someone official authority or the freedom to do something","lvl":"","ex":"This amendment empowers the president to declare an emergency for a wide range of reasons","ar":"يمكّن"},{"w":"Rock solid","pos":"adj","def":"not likely to move or break","lvl":"","ex":"I have fixed the table – it is rock-solid now","ar":"ثابت جدًا / قوي"},{"w":"Bewildered","pos":"adj","def":"feeling confused","lvl":"","ex":"Arriving in a strange city at night, I felt alone and bewildered","ar":"مرتبك / حائر"},{"w":"Conclusive","pos":"adj","def":"proving that something is true, or ending any doubt","lvl":"C2","ex":"They had conclusive evidence of her guilt","ar":"قاطع / حاسم"}]},{"n":24,"pp":3,"title":"Swarm theory","untitled":false,"intro":null,"paras":[{"L":null,"t":"I used to think that ants knew what they were doing. The ones marching across my kitchen bench looked so confident that I figured they had a plan, knew where going and what needed to be done. How else could ants organise highways, build elaborate nests, stage epic raids and do all of the other things ants do? But it turns out I was wrong. Ants aren’t clever little engineers, architects or warriors after all – at least not as individuals. When it comes to deciding what to do next, most ants don’t have a clue. ‘If you watch an ant trying to accomplish something, you’ll be impressed by how inept it is,’ says Deborah M Gordon, a biologist at Stanford University. How do we explain, then, the success of Earth’s 12,000 or so known ant species? They must have learned something in 140 million years.","foot":false},{"L":null,"t":"‘Ants aren’t smart,’ Gordon says. ‘Ant colonies are.’ A colony can solve problems unthinkable to individual ants, such as finding the shortest path to the best food source, allocating workers to different tasks, defending territory from neighbours. As individuals, ants might be tiny dummies, but as colonies they respond quickly and effectively to their environment. They do this with something called swarm intelligence. Where this intelligence comes from raises a fundamental question in nature: how do the simple actions of individuals add up to the complex behaviour of a group? How do hundreds of honeybees make a critical decision about their hive if many of them disagree? What enables a school of herring to coordinate its movements so precisely it can change direction in a flash, like a single organism? One key to an ant colony is that no one’s in charge. No generals command ant warriors. No managers boss ant workers. The queen plays no role except to lay eggs. Even with half a million ants, a colony functions just fine with no management at all – at least none that we would recognise. It relies instead upon countless interactions between individual ants, each of which is following simple rules of thumb. Scientists describe such a system as ‘self-organising’.","foot":false},{"L":null,"t":"Consider the problem of job allocation. In the Arizona desert, where Deborah Gordon studies red harvester ants, a colony calculates each morning how many workers to send out foraging for food. The number can change, depending on conditions. Have foragers recently discovered a bonanza of tasty seeds? More ants may be needed to haul the bounty home. Was the nest damaged by a storm last night? Additional maintenance workers may be held back to make repairs. An ant might be a nest worker one day, a trash collector the next. But how does a colony make such adjustments if no one’s in charge? Gordon has a theory.","foot":false},{"L":null,"t":"Ants communicate by touch and smell. When one ant bumps into another, it sniffs with its antennae to find out if the other belongs to the same nest and where it has been working. (Ants that work outside the nest smell different to those that stay inside.) Before they leave the nest each day, foragers normally wait for early morning patrollers to return. As patrollers enter the nest, they touch antennae briefly with foragers. ‘When a forager has contact with a patroller, it’s a stimulus for the forager to go out,’ Gordon says. ‘But the forager needs several contacts more than ten seconds apart before it will go out.’ To see how this works, Gordon and her team captured patroller ants as they left a nest one morning. After waiting half an hour, they simulated the ants’ return by dropping glass beads into the nest entrance at regular intervals – some coated with patroller scent, some with maintenance worker scent, some with no scent. Only the beads coated with patroller scent stimulated foragers to leave the nest. Their conclusion: foragers use the rate of their encounters with patrollers to tell if it’s safe to go out. (If you bump into patrollers at the right rate, it’s time to go foraging. If not, it’s better to wait. It might be too windy, or there might be a hungry lizard out there.) Once the ants start foraging and bringing back food, other ants join the effort, depending on the rate at which they encounter returning foragers. ‘So nobody’s deciding whether it’s a good day to forage. The collective is, but no particular ant is.’ That’s how swarm intelligence works: simple creatures following simple rules, each one acting on local information.","foot":false},{"L":null,"t":"When it comes to swarm intelligence, ants aren’t the only insects with something useful to teach us. Thomas Seeley, a biologist at Cornell University, has been looking into the uncanny ability of honeybees to make good decisions. With as many as 50,000 workers in a single hive, honeybees have evolved ways to work through individual difference of opinion to do what’s best for the colony. Seeley and others have been studying colonies of honeybees to see how they choose a new home. To find out, Seeley’s team applied paint dots and tiny plastic tags to all 4,000 bees in each of several swarms that they ferried to Appledore Island. There, they released each swarm to locate nest boxes they had placed on one side of the island. In one test, they put out five nest boxes. Scout bees soon appeared at all five boxes. When they returned to the swarm, each performed a dance urging other scouts to go and have a look. These dances include a code to give directions to a box’s location. The strength of each dance reflected the scout’s enthusiasm for the site. After a while, a small cloud of bees was buzzing around each box. As soon as the number of scouts visible near the entrance to a box reached about 15, the bees at that box sensed that a decision had been reached and returned to the swarm with the news. The bees’ rules for decision-making – seek a diversity of opinions, encourage a free competition among ideas, and use effective mechanisms to narrow choices – so impressed Seeley that he now uses them at Cornell in his role as chairman of his department.","foot":false}],"groups":[{"a":1,"b":5,"k":"mcq","instr":["Choose the correct letter A, B, C or D.","Write the correct letter in boxes 1–5 on your answer sheet."],"items":[{"n":1,"t":"In the first paragraph, what does the writer conclude about ants?","opts":[{"k":"A","t":"They are invasive pests in the home."},{"k":"B","t":"They can achieve great things working alone."},{"k":"C","t":"They form social groups that are similar to human ones."},{"k":"D","t":"They are less impressive as individuals than she thought."}]},{"n":2,"t":"According to the second paragraph, what is the ‘fundamental question’ in nature?","opts":[{"k":"A","t":"How do large groups of animals appoint a leader?"},{"k":"B","t":"How do large groups of animals reach an agreement?"},{"k":"C","t":"Do different species of animals use similar behaviour?"},{"k":"D","t":"Why are small insects better organised than larger mammals?"}]},{"n":3,"t":"What is the focus of Deborah Gordon’s research?","opts":[{"k":"A","t":"The effects of bad weather on ant colonies."},{"k":"B","t":"The number of ants required to maintain the nest."},{"k":"C","t":"The methods ants use to assign different jobs."},{"k":"D","t":"The role of the queen ant in organising the colony."}]},{"n":4,"t":"In the fourth paragraph, what are we told about forager and patroller ants?","opts":[{"k":"A","t":"A colony needs more forager ants than patroller ants."},{"k":"B","t":"Patrollers’ movements determine what foragers will do."},{"k":"C","t":"Patrollers are the first ants to bring food back to the nest."},{"k":"D","t":"Foragers spend more time out of the nest than patroller ants."}]},{"n":5,"t":"In an experiment, Deborah Gordon’s team","opts":[{"k":"A","t":"mimicked patroller ants returning to the nest."},{"k":"B","t":"left a trail of food for patroller ants to follow."},{"k":"C","t":"followed patroller ants to see where they went to."},{"k":"D","t":"changed the scent of patroller ants to that of forager ants."}]}],"opts":[],"ctx":[]},{"a":6,"b":9,"k":"gap","instr":["Complete the following sentences using NO MORE THAN TWO WORDS AND/OR A","NUMBER from the passage.","Write your answers in boxes 6–9 on your answer sheet."],"items":[{"n":6,"t":"Approximately …………… different types of ant have been identified.","opts":[]},{"n":7,"t":"Ants use their …………… to identify another ant.","opts":[]},{"n":8,"t":"A …………… is one animal that preys on ants.","opts":[]},{"n":9,"t":"Ant colonies use …………… to reach a decision.","opts":[]}],"opts":[],"ctx":[]},{"a":10,"b":13,"k":"match","instr":["Complete the summary using the list of words, A–G, below.","Write the correct letter, A–G, in boxes 10–13 on your answer sheet."],"items":[],"opts":[{"k":"A","t":"attracted"},{"k":"B","t":"found"},{"k":"C","t":"gathered"},{"k":"D","t":"located"},{"k":"E","t":"signalled"},{"k":"F","t":"marked"},{"k":"G","t":"relocated"}],"ctx":["First, the scientists 10 …………… each of the bees involved in their experiment. Next the bees were 11 …………… . The scientists placed several nest boxes in an area away from the bees. Scout bees inspected the nest boxes and 12 …………… to other bees where the boxes were. They chose their nest box once enough bees had 13 …………… there."],"mode":"sum","ctitle":"Appledore Island honeybee study"}],"ans":{"1":{"raw":"D They are less impressive as individuals than she thought.","v":"D","ex":"In the first paragraph, what does the writer conclude about ants? Answer: D They are less impressive as individuals than she thought. Part of the passage: I used to think that ants knew what they were doing. The ones marching across my kitchen bench looked so confident that I figured they had a plan, knew where going and what needed to be done. How else could ants organise high- ways, build elaborate nests, stage epic raids and do all of the other things ants do? But it turns out I was wrong. Ants aren’t clever little engineers, architects or warriors after all – at least not as individuals. When it comes to deciding what to do next, most ants don’t have a clue. ‘If you watch an ant trying to accomplish something, you’ll be impressed by how inept it is,’ says Deborah M Gordon, a biologist at Stanford University. How do we explain, then, the success of Earth’s 12,000 or so known ant species? They must have learned something in 140 million years. Explanation: (A) is wrong because although it is mentioned, the writer does not conclude this; (B) is wrong because they achieve great things as a group; (C) is wrong because although it is mentioned, the writer does not conclude this."},"2":{"raw":"B How do large groups of animals reach an agreement?","v":"B","ex":"According to the second paragraph, what is the ‘fundamental question’ in nature? Answer: B How do large groups of animals reach an agreement? Part of the passage: As individuals, ants might be tiny dummies, but as colonies they respond quickly and effectively to their environment. They do this with something called swarm intelligence. Where this intelligence comes from raises a fundamental question in nature: how do the simple actions of individuals add up to the complex behaviour of a group? How do hundreds of honeybees make a critical decision about their hive if many of them disagree? What enables a school of herring to coordinate its movements so precisely it can change direction in a flash, like a single organism? One key to an ant colony is that no one’s in charge. No generals command ant warriors. No managers boss ant workers. The queen plays no role except to lay eggs. Explanation: (A) is wrong because we are told they do not have a leader; (C) is wrong because though different species are mentioned, comparing them is not the fundamental question; (D) is wrong because no contrast is raised between insects and mammals."},"3":{"raw":"C The methods ants use to assign different jobs.","v":"C","ex":"What is the focus of Deborah Gordon’s research? Answer: C The methods ants use to assign different jobs. Part of the passage: Consider the problem of job allocation. In the Arizona desert, where Deborah Gordon studies red harvester ants, a colony calculates each morning how many workers to send out foraging for food. The number can change, depending on conditions. Have foragers recently discovered a bonanza of tasty seeds? More ants may be needed to haul the bounty home. Was the nest damaged by a storm last night? Additional maintenance workers may be held back to make repairs. An ant might be a nest worker one day, a trash collector the next. But how does a colony make such adjust- ments if no one’s in charge? Explanation: (A) is wrong because though bad weather is mentioned, this wasn’t the focus of the research; (B) is wrong because the number of maintenance ants was not the main focus; (D) is wrong because the queen does not organise the colony."},"4":{"raw":"B Patrollers’ movements determine what foragers will do.","v":"B","ex":"In the fourth paragraph, what are we told about forager and patroller ants? Answer: B Patrollers’ movements determine what foragers will do. Part of the passage: Before they leave the nest each day, foragers normally wait for ear- ly morning patrollers to return. As patrollers enter the nest, they touch antennae briefly with foragers. ‘When a forager has contact with a patroller, it’s a stimulus for the forager to go out,’ Gordon says. ‘But the forager needs several contacts more than ten seconds apart before it will go out.’ … Once the ants start foraging and bringing back food, other ants join the effort, depending on the rate at which they encounter returning foragers. Explanation: (A) is wrong because no comparison is made between numbers of patroller or forager ants; (C) is wrong because foragers bring back the food and no mention is made of patrollers carrying food; (D) is wrong because we do not know how long any of the ants spend outside of the nest."},"5":{"raw":"A mimicked patroller ants returning to the nest.","v":"A","ex":"In an experiment, Deborah Gordon’s team Answer: A mimicked patroller ants returning to the nest. Part of the passage: To see how this works, Gordon and her team captured patroller ants as they left a nest one morning. After waiting half an hour, they simulated the ants’ return by dropping glass beads into the nest entrance at regular intervals – some coated with patroller scent, some with maintenance worker scent, some with no scent. Only the beads coated with patroller scent stimulated foragers to leave the nest. Explanation: (B) is wrong because the researchers did not use food; (C) is wrong because they captured the patrollers ants, they didn’t follow them; (D) is wrong because they added different scents to beads, not to the ants."},"6":{"raw":"12,000","v":"12,000","ex":"Approximately …………… different types of ant have been identified. Answer: 12,000 Part of the passage: How do we explain, then, the success of Earth’s 12,000 or so known ant species?","alts":["12,000","12000"]},"7":{"raw":"antennae","v":"antennae","ex":"Ants use their …………… to identify another ant. Answer: antennae Part of the passage: When one ant bumps into another, it sniffs with its antennae to find out if the other belongs to the same nest and where it has been working."},"8":{"raw":"lizard","v":"lizard","ex":"A …………… is one animal that preys on ants. Answer: lizard Part of the passage: If not, it’s better to wait. It might be too windy, or there might be a hungry lizard out there"},"9":{"raw":"swarm intelligence","v":"swarm intelligence","ex":"Ant colonies use …………… to reach a decision. Answer: swarm intelligence Part of the passage: As individuals, ants might be tiny dummies, but as colonies they respond quickly and effectively to their environment. They do this with something called swarm intelligence."},"10":{"raw":"F marked","v":"F","ex":"First, the scientists …………… each of the bees involved in their experiment. Answer: F marked Part of the passage: Seeley and others have been studying colonies of honeybees to see how they choose a new home. To find out, Seeley’s team applied paint dots and tiny plastic tags to all 4,000 bees in each of several swarms that they ferried to Appledore Island."},"11":{"raw":"G relocated","v":"G","ex":"Next the bees were …………… . Answer: G relocated Part of the passage: ...Seeley’s team applied paint dots and tiny plastic tags to all 4,000 bees in each of several swarms that they ferried to Appledore Island."},"12":{"raw":"E signalled","v":"E","ex":"Scout bees inspected the nest boxes and …………… to other bees where the boxes were. Answer: E signalled Part of the passage: There, they released each swarm to locate nest boxes they had placed on one side of the island. In one test, they put out five nest boxes. Scout bees soon appeared at all five boxes. When they returned to the swarm, each performed a dance urging other scouts to go and have a look. These dances include a code to give directions to a box’s location."},"13":{"raw":"C gathered","v":"C","ex":"They chose their nest box once enough bees had …………… there. Answer: C gathered Part of the passage: After a while, a small cloud of bees was buzzing around each box. As soon as the number of scouts visible near the entrance to a box reached about 15, the bees at that box sensed that a decision had been reached and returned to the swarm with the news."}},"words":[{"w":"Elaborate","pos":"adj","def":"containing a lot of careful detail or many detailed parts","lvl":"C2","ex":"They’re making the most elaborate preparations for the wedding","ar":"مفصّل ومتقن"},{"w":"Epic","pos":"adj","def":"describes events that happen over a long period and involve a lot of action and difficulty","lvl":"","ex":"an epic struggle/journey","ar":"ملحمي / هائل"},{"w":"Inept","pos":"adj","def":"not skilled or effective","lvl":"","ex":"He was always rather inept at sport","ar":"غير بارع"},{"w":"Add up to","pos":"v","def":"to become particular amount","lvl":"","ex":"The various building programmes to several thousand new homes","ar":"يصل مجموعه إلى"},{"w":"Haul","pos":"v","def":"to pull something heavy slowly and with difficulty","lvl":"C2","ex":"They hauled the boat out of the water","ar":"يسحب / ينقل بصعوبة"},{"w":"Stimulate","pos":"v","def":"to make someone excited and interested about something","lvl":"B2","ex":"The film was intended to stimulate and amuse","ar":"يحفّز"},{"w":"To be in charge of","pos":"v","def":"having control or being responsible for someone or something","lvl":"","ex":"He was in charge of civil aviation matters","ar":"يكون مسؤولًا عن"},{"w":"Ferry","pos":"v","def":"to transport people or goods in a vehicle, especially regularly and often","lvl":"","ex":"I spend most of time ferrying the children about","ar":"ينقل ذهابًا وإيابًا"},{"w":"Uncanny","pos":"adj","def":"strange or mysterious; difficult or impossible to explain","lvl":"","ex":"An uncanny resemblance","ar":"غريب عجيب"},{"w":"Buzz","pos":"v","def":"to make a continuous, low sound such as the one a bee makes","lvl":"C2","ex":"I can hear something buzzing","ar":"يطنّ"}]},{"n":25,"pp":1,"title":"The history of the poster","untitled":false,"intro":"The appearance of the poster has changed continuously over the past two centuries.","paras":[{"L":null,"t":"The first posters were known as ‘broadsides’ and were used for public and commercial announcements. Printed on one side only using metal type, they were quickly and crudely produced in large quantities. As they were meant to be read at a distance, they required large lettering.","foot":false},{"L":null,"t":"There were a number of negative aspects of large metal type. It was expensive, required a large amount of storage space and was extremely heavy. If a printer did have a collection of large metal type, it was likely that there were not enough letters. So printers did their best by mixing and matching styles.","foot":false},{"L":null,"t":"Commercial pressure for large type was answered with the invention of a system for wood type production. In 1827, Darius Wells invented a special wood drill – the lateral router – capable of cutting letters on wood blocks. The router was used in combination with William Leavenworth’s pantograph (1834) to create decorative wooden letters of all shapes and sizes. The first posters began to appear, but they had little colour and design; often wooden type was mixed with metal type in a conglomeration of styles.","foot":false},{"L":null,"t":"A major development in poster design was the application of lithography, invented by Alois Senefelder in 1796, which allowed artists to hand-draw letters, opening the field of type design to endless styles. The method involved drawing with a greasy crayon onto finely surfaced Bavarian limestone and offsetting that image onto paper. This direct process captured the artist’s true intention; however, the final printed image was in reverse. The images and lettering needed to be drawn backwards, often reflected in a mirror or traced on transfer paper.","foot":false},{"L":null,"t":"As a result of this technical difficulty, the invention of the lithographic process had little impact on posters until the 1860s, when Jules Cheret came up with his ‘three-stone lithographic process’. This gave artists the opportunity to experiment with a wide spectrum of colours. Although the process was difficult, the result was remarkable, with nuances of colour impossible in other media even to this day. The ability to mix words and images in such an attractive and economical format finally made the lithographic poster a powerful innovation.","foot":false},{"L":null,"t":"Starting in the 1870s, posters became the main vehicle for advertising prior to the magazine era and the dominant means of mass communication in the rapidly growing cities of Europe and America. Yet in the streets of Paris, Milan and Berlin, these artistic prints were so popular that they were stolen off walls almost as soon as they were hung. Cheret, later known as ‘the father of the modern poster’, organised the first exhibition of posters in 1884 and two years later published the first book on poster art. He quickly took advantage of the public interest by arranging for artists to create posters, at a reduced size, that were suitable for in-home display.","foot":false},{"L":null,"t":"Thanks to Cheret, the poster slowly took hold in other countries in the 1890s and came to celebrate each society’s unique cultural institutions: the café in France, the opera and fashion in Italy, festivals in Spain, literature in Holland and trade fairs in Germany. The first poster shows were held in Great Britain and Italy in 1894, Germany in 1896 and Russia in 1897. The most important poster show ever, to many observers, was held in Reims, France, in 1896 and featured an unbelievable 1,690 posters arranged by country.","foot":false},{"L":null,"t":"In the early 20th century, the poster continued to play a large communication role and to go through a range of styles. By the 1950s, however, it had begun to share the spotlight with other media, mainly radio and print. By this time, most posters were printed using the mass production technique of photo offset, which resulted in the familiar dot pattern seen in newspapers and magazines. In addition, the use of photography in posters, begun in Russia in the twenties, started to become as common as illustration.","foot":false},{"L":null,"t":"In the late fifties, a new graphic style that had strong reliance on typographic elements in black and white appeared. The new style came to be known as the International Typographic Style. It made use of a mathematical grid, strict graphic rules and black-and-white photography to provide a clear and logical structure. It became the predominant style in the world in the 1970s and continues to exert its influence today.","foot":false},{"L":null,"t":"It was perfectly suited to the increasingly international post-war marketplace, where there was a strong demand for clarity. This meant that the accessibility of words and symbols had to be taken into account. Corporations wanted international identification, and events such as the Olympics called for universal solutions, which the Typographic Style could provide.","foot":false},{"L":null,"t":"However, the International Typographic Style began to lose its energy in the late 1970s. Many criticised it for being cold, formal and dogmatic. A young teacher in Basel, Wolfgang Weingart, experimented with the offset printing process to produce posters that appeared complex and chaotic, playful and spontaneous – all in stark contrast to what had gone before. Weingart’s liberation of typography was an important foundation for several new styles. These ranged from Memphis and Retro to the advances now being made in computer graphics.","foot":false}],"groups":[{"a":1,"b":5,"k":"gap","instr":["Complete the table below.","Choose NO MORE THAN THREE WORDS from the passage for each answer.","Write your answers in boxes 1–5 on your answer sheet."],"items":[],"opts":[],"ctx":[],"mode":"table","ctitle":"Early Printing Methods","table":{"head":["","Features","Problems"],"rows":[["Metal type",["produced large print"],["cost, weight and 1 …………… difficulties","mixed styles"]],["Wood type",["Darius’s wood drill used in connection with another 2 ……………","produced a range of letters"],["lacked both 3 ……………","mixed type"]],["Lithography",["letters drawn by hand","design tool – a 4 ……………"],["had to use a mirror or 5 …………… to achieve correct image"]]]}},{"a":6,"b":9,"k":"gap","instr":["Complete the flow chart below.","Choose NO MORE THAN THREE WORDS from the passage for each answer.","Write your answers in boxes 6–9 on your answer sheet."],"items":[],"opts":[],"ctx":["1860s – invention of ‘three-stone lithographic process’ combination of both 6 ………………… on coloured posters","1870s – posters used for advertising and 7 ………………… in Europe","1884–86 – Cheret’s poster 8 ………………… and book on poster art","1890s – posters represent 9 ………………… around the world"],"mode":"flow","ctitle":"Jules Cheret"},{"a":10,"b":13,"k":"tf","instr":["Do the following statements agree with the information in the reading passage?","In boxes 10–13 on your answer sheet, write"],"items":[{"n":10,"t":"By the 1950s, photographs were more widely seen than artists’ illustrations on posters.","opts":[]},{"n":11,"t":"Features of the Typographic Style can be seen in modern-day posters.","opts":[]},{"n":12,"t":"The Typographic Style met a global need at a particular time in history.","opts":[]},{"n":13,"t":"Weingart got many of his ideas from his students in Basel.","opts":[]}],"opts":[],"ctx":[]}],"ans":{"1":{"raw":"storage (space)","v":"storage (space)","ex":"cost, weight and ………………… difficulties Answer: storage (space) Part of the passage: There were a number of negative aspects of large metal type. It was expensive, required a large amount of storage space and was extremely heavy. Explanation: cost = expensive; heavy = weight. ‘Space’ is incorrect because it does not convey the idea that there is a problem with storing it. However, both storage or storage space are correct."},"2":{"raw":"invention","v":"invention","ex":"Darius’s wood drill used in connection with another ………………… Answer: invention Part of the passage: Commercial pressure for large type was answered with the in- vention of a system for wood type production. In 1827, Darius Wells invented a special wood drill – the lateral router – capable of cutting letters on wood blocks. The router was used in combination with William Leavenworth’s pantograph (1834) to create decorative wooden letters of all shapes and sizes. Explanation: Both Darius’s wood drill and William Leavenworth’s pantograph are in- ventions. The word ‘another’ means we need a general noun that would describe both of these tools. The only general descriptive noun is ‘invention’. Pantograph is the most common incorrect answer and the reason for that it (pantograph) cannot be considered another wood drill."},"3":{"raw":"colour and design","v":"colour and design","ex":"lacked both ………………… Answer: colour and design Part of the passage: The first posters began to appear, but they had little colour and design; often wooden type was mixed with metal type in a conglomeration of styles. Explanation: little = not enough (negative)"},"4":{"raw":"(greasy) crayon","v":"(greasy) crayon","ex":"design tool – a ………………… Answer: (greasy) crayon Part of the passage: The method involved drawing with a greasy crayon onto finely surfaced Bavarian limestone and offsetting that image onto paper. Explanation: The tool that is used for designing was a (greasy) crayon."},"5":{"raw":"transfer paper","v":"transfer paper","ex":"had to use a mirror or ………………… to achieve correct image Answer: transfer paper Part of the passage: The images and lettering needed to be drawn backwards, often reflected in a mirror or traced on transfer paper. Explanation: Here the word ‘transfer’ is not optional (cannot be omitted) otherwise the meaning is slightly different."},"6":{"raw":"words and images","v":"words and images","ex":"combination of both ………………… on coloured posters Answer: words and images Part of the passage: Although the process was difficult, the result was remarkable, with nuances of colour impossible in other media even to this day. The ability to mix words and images in such an attractive and economical format finally made the lithographic poster a powerful innovation."},"7":{"raw":"mass communication","v":"mass communication","ex":"1870s – posters used for advertising and ………………… in Europe Answer: mass communication Part of the passage: Starting in the 1870s, posters became the main vehicle for adver- tising prior to the magazine era and the dominant means of mass communication in the rapidly growing cities of Europe and America."},"8":{"raw":"exhibition","v":"exhibition","ex":"1884–86 – Cheret’s poster ………………… and book on poster art Answer: exhibition Part of the passage: Cheret, later known as ‘the father of the modern poster’, organised the first exhibition of posters in 1884 and two years later published the first book on poster art. Explanation: exhibition of posters = poster exhibition"},"9":{"raw":"(unique) cultural institutions","v":"(unique) cultural institutions","ex":"1890s – posters represent ………………… around the world Answer: (unique) cultural institutions Part of the passage: Thanks to Cheret, the poster slowly took hold in other countries in the 1890s and came to celebrate each society’s unique cultural institutions: the café in France, the opera and fashion in Italy, festivals in Spain, literature in Holland and trade fairs in Germany."},"10":{"raw":"False","v":"F","ex":"By the 1950s, photographs were more widely seen than artists’ illustrations on posters. Meaning: Were photographs more popular/common than artists’ illustrations on posters? Answer: False Part of the passage: By the 1950s, however, it had begun to share the spotlight with other media, mainly radio and print. By this time, most posters were printed using the mass production technique of photo offset, which resulted in the familiar dot pattern seen in newspapers and magazines. In addition, the use of photography in posters, begun in Russia in the twenties, started to become as common as illustration. Explanation: ‘begun in Russia in the twenties’ is just an additional information and given as a non-defining relative clause (should be left out to understand the main idea)."},"11":{"raw":"True","v":"T","ex":"Features of the Typographic Style can be seen in modern-day posters. Meaning: Can we still see some features of the Typographic Style in modern-day posters? Answer: True Part of the passage: The new style came to be known as the International Typographic Style. It made use of a mathematical grid, strict graphic rules and black-and-white photography to provide a clear and logical structure. It became the predominant style in the world in the 1970s and continues to exert its influence today."},"12":{"raw":"True","v":"T","ex":"The Typographic Style met a global need at a particular time in history. Meaning: Did it meet a global need at a particular time in history? Answer: True Part of the passage: it was perfectly suited to the increasingly international post-war marketplace, where there was a strong demand for clarity. This meant that the accessibility of words and symbols had to be taken into account. Corporations wanted international identification, and events such as the Olympics called for universal solutions, which the Typographic Style could provide. Explanation: Particular time in history = post-war; need = demand;"},"13":{"raw":"Not Given","v":"NG","ex":"Weingart got many of his ideas from his students in Basel. Meaning: Did he get his ideas from his students in Basel? Answer: Not Given Part of the passage: However, the International Typographic Style began to lose its energy in the late 1970s. Many criticised it for being cold, formal and dogmatic. A young teacher in Basel, Wolfgang Weingart, experimented with the offset printing process to produce posters that appeared complex and chaotic, playful and spontaneous – all in stark contrast to what had gone before. Weingart’s liberation of typography was an important foundation for several new styles. These ranged from Memphis and Retro to the advances now being made in computer graphics. Explanation: The information in the text is not sufficient as we are not informed neither about his students nor the origins of his ideas."}},"words":[{"w":"Offset","pos":"v","def":"to balance one influence against an opposing influence, so that there is no great difference as a result","lvl":"C2","ex":"The extra cost of travelling to work is offset by the lower price of houses here","ar":"يعوّض / يوازن"},{"w":"Nuance","pos":"n","def":"a very slight difference in appearance, meaning, sound, etc.:","lvl":"","ex":"The painter has managed to capture every nuance of the woman’s expression","ar":"فارق دقيق"},{"w":"Spotlight","pos":"n","def":"receiving the public attention","lvl":"C2","ex":"The senator has been in the spotlight recently since the revelation of his tax frauds","ar":"دائرة الضوء"},{"w":"Exert","pos":"v","def":"to use something such as authority, power, influence, in order to make something happen","lvl":"","ex":"If you were to exert your influence, they might change their decision","ar":"يمارس (تأثيرًا)"},{"w":"Accessibility","pos":"n","def":"able to be reached or easily got","lvl":"B2","ex":"The resort is easily accessible by road, rail, and air","ar":"سهولة الوصول"},{"w":"Chaotic","pos":"adj","def":"in a state of chaos","lvl":"C1","ex":"The house is a bit chaotic at the moment – we have got all these extra people staying and we are still decorating","ar":"فوضوي"},{"w":"Stark","pos":"adj","def":"completely or extremely","lvl":"","ex":"The children were splashing in the river, stark naked","ar":"صارخ / تام"}]},{"n":26,"pp":2,"title":"Last man standing","untitled":false,"intro":"Some 50,000 years ago, Homo sapiens beat other hominids to become the only surviving species. Kate Ravilious reveals how we did it.","paras":[{"L":"A","t":"Today, there are over seven billion people living on Earth. No other species has exerted as much influence over the planet as us. But turn the clock back 80,000 years and we were one of a number of species roaming the Earth.Our own species, Homo sapiens (Latin for ‘wise man’), was most successful in Africa. In western Eurasia, the Neanderthals dominated, while Homo erectus may have lived in Indonesia. Meanwhile, an unusual finger bone and tooth, discovered in Denisova cave in Siberia in 2008, have led scientists to believe that yet another human population – the Denisovans – may also have been widespread across Asia. Somewhere along the line, these other human species died out, leaving Homo sapiens as the sole survivor. So what made us the winners in the battle for survival?","foot":false},{"L":"B","t":"Some 74,000 years ago, the Toba ‘supervolcano’ on the Indonesian island of Sumatra erupted. The scale of the event was so great that ash from the eruption was flung as far as eastern India, more than 2,000 kilometers away. Oxford archaeologist Mike Petraglia and his team have uncovered thousands of stone tools buried underneath the Toba ash. The mix of hand axes and spear tips have led Petraglia to speculate that Homo sapiens and Homo erectus were both living in eastern India prior to the Toba eruption. Based on careful examination of the tools and dating of the sediment layers where they were found, Petraglia and his team suggest that Homo sapiens arrived in eastern India around 78,000 years ago, migrating out of Africa and across Arabia during a favourable climate period. After their arrival, the simple tools belonging to Homo erectus seemed to lessen in number and eventually disappear completely. ‘We think that Homo sapiens had a more efficient hunting technology, which could have given them the edge,’ says Petraglia. ‘Whether the eruption of Toba also played a role in the extinction of the Homo erectus-like species is unclear to us.’","foot":false},{"L":"C","t":"Some 45,000 years later, another fight for survival took place. This time, the location was Europe and the protagonists were another species, the Neanderthals. They were a highly successful species that dominated the European landscape for 300,000 years. Yet within just a few thousand years of the arrival of Homo sapiens, their numbers plummeted. They eventually disappeared from the landscape around 30,000 years ago, with their last known refuge being southern Iberia, including Gibraltar. Initially, Homo sapiens and Neanderthals lived alongside each otherand had no reason to compete. But then Europe’s climate swung into a cold, inhospitable, dry phase. ‘Neanderthal and Homo sapiens populations had to retreat to refugia (pockets of habitable land). This heightened competition between the two groups,’ explains Chris Stringer, anthropologist at the Natural History Museum in London.","foot":false},{"L":"D","t":"Both species were strong and stockier than the average human today, but Neanderthals were particularly robust. ‘Their skeletons show that they had broad shoulders and thick necks,’ says Stringer. ‘Homo sapiens, on the other hand, had longer forearms, which undoubtedly enabled them to throw a spear from some distance, with less danger and using relatively little energy,’ explains Stringer. This long-range ability may have given Homo sapiens an advantage in hunting. When it came to keeping warm, Homo sapiens had another skill: weaving and sewing. Archaeologists have uncovered simple needles fashioned from ivory and bone alongside Homo sapiens, dating as far back as 35,000 years ago. ‘Using this technology, we could use animal skins to make ourselves tents, warm clothes and fur boots,’ says Stringer. In contrast, Neanderthals never seemed to master sewing skills, instead relying on pinning skins together with thorns.","foot":false},{"L":"E","t":"A thirst for exploration provided Homo sapiens with another significant advantage over Neanderthals. Objects such as shell beads and flint tools, discovered many miles from their source, show that our ancestors travelled over large distances, in order to barter and exchange useful materials, and share ideas and knowledge. By contrast, Neanderthals tended to keep themselves to themselves, living in small groups. They misdirected their energies by only gathering resources from their immediate surroundings and perhaps failing to discover new technologies outside their territory.","foot":false},{"L":"F","t":"Some of these differences in behavior may have emerged because the two species thought in different ways. By comparing skull shapes, archaeologists have shown that Homo sapiens had a more developed temporal lobe – the regions at the side of the brain, associated with listening, language and long-term memory. ‘We think that Homo sapiens had a significantly more complex language than Neanderthals and were able to comprehend and discuss concepts such as the distant past and future,’ says Stringer. Penny Spikins, an archaeologist at the University of York, has recently suggested that Homo sapiens may also have had a greater diversity of brain types than Neanderthals. ‘Our research indicates that high-precision tools, new hunting technologies and the development of symbolic communication may all have come about because they were willing to include people with “different” minds and specialised roles in their society,’ she explains. ‘We see similar kinds of injuries on male and female Neanderthal skeletons, implying there was no such division of labour,’ says Spikins.","foot":false},{"L":"G","t":"Thus by around 30,000 years ago, many talents and traits were well established in Homo sapiens societies but still absent from Neanderthal communities. Stringer thinks that the Neanderthals were just living in the wrong place at the wrong time. ‘They had to compete with Homo sapiens during a phase of very unstable climate across Europe. During each rapid climate fluctuation, they may have suffered greater losses of people than Homo sapiens, and thus were slowly worn down,’ he says. If the climate had remained stable throughout, they might still be here.”","foot":false}],"groups":[{"a":14,"b":18,"k":"para","instr":["The Reading passage 2 has seven paragraphs, A–G.","Which paragraph contains the following information?","Write the correct letter, A–G, in boxes 14–18 on your answer sheet."],"items":[{"n":14,"t":"a comparison of a range of physical features of Neanderthals and Homo sapiens","opts":[]},{"n":15,"t":"reference to items that were once used for trade","opts":[]},{"n":16,"t":"mention of evidence for the existence of a previously unknown human species","opts":[]},{"n":17,"t":"mention of the part played by ill fortune in the downfall of Neanderthal society","opts":[]},{"n":18,"t":"reference to the final geographical location of Neanderthals","opts":[]}],"opts":[{"k":"A","t":""},{"k":"B","t":""},{"k":"C","t":""},{"k":"D","t":""},{"k":"E","t":""},{"k":"F","t":""},{"k":"G","t":""}],"ctx":[]},{"a":19,"b":22,"k":"gap","instr":["Complete the sentences below.","Choose NO MORE THAN THREE WORDS from the passage for each answer.","Write your answers in boxes 19–22 on your answer sheet."],"items":[{"n":19,"t":"Analysis of stone tools and …………… has enabled Petraglia’s team to put forward an arrival date for Homo sapiens in eastern India.","opts":[]},{"n":20,"t":"Homo sapiens used both …………… to make sewing implements.","opts":[]},{"n":21,"t":"The territorial nature of Neanderthals may have limited their ability to acquire resources and ……………","opts":[]},{"n":22,"t":"Archaeologists examined …………… in order to get an insight into Neanderthal and Homo sapiens’ capacity for language and thought.","opts":[]}],"opts":[],"ctx":[]},{"a":23,"b":26,"k":"match","instr":["Look at the following statements and the list of researchers, A–C, below.","Match each statement with the correct researcher.","Write the correct letter, A–C, in boxes 23–26 on your answer sheet."],"items":[{"n":23,"t":"No evidence can be found to suggest that Neanderthal communities allocated tasks to different members.","opts":[]},{"n":24,"t":"Homo sapiens may have been able to plan ahead.","opts":[]},{"n":25,"t":"Scientists cannot be sure whether a sudden natural disaster contributed to the loss of a human species.","opts":[]},{"n":26,"t":"Environmental conditions restricted the areas where Homo sapiens and Neanderthals could live.","opts":[]}],"opts":[{"k":"A","t":"Mike Petraglia"},{"k":"B","t":"Chris Stringer"},{"k":"C","t":"Penny Spikins"}],"ctx":[],"optTitle":"List of Researchers"}],"ans":{"14":{"raw":"Par D","v":"D","ex":"a comparison of a range of physical features of Neanderthals and Homo sapiens Answer: Par D Part of the passage: Both species were strong and stockier than the average human today, but Neanderthals were particularly robust. ‘Their skeletons show that they had broad shoulders and thick necks,’ says Stringer. ‘Homo sapiens, on the other hand, had longer forearms, which undoubtedly enabled them to throw a spear from some distance, with less danger and using relatively little energy,’ explains Stringer."},"15":{"raw":"Par E","v":"E","ex":"reference to items that were once used for trade Answer: Par E Part of the passage: Objects such as shell beads and flint tools, discovered many miles from their source, show that our ancestors travelled over large distances, in order to bar- ter and exchange useful materials, and share ideas and knowledge."},"16":{"raw":"Par A","v":"A","ex":"mention of evidence for the existence of a previously unknown human spe- cies Answer: Par A Part of the passage: Meanwhile, an unusual finger bone and tooth, discovered in Den- isova cave in Siberia in 2008, have led scientists to believe that yet another human pop- ulation – the Denisovans – may also have been widespread across Asia."},"17":{"raw":"Par G","v":"G","ex":"mention of the part played by ill fortune in the downfall of Neanderthal society Answer: Par G Part of the passage: Stringer thinks that the Neanderthals were just living in the wrong place at the wrong time. ‘They had to compete with Homo sapiens during a phase of very unstable climate across Europe. During each rapid climate fluctuation, they may have suffered greater losses of people than Homo sapiens, and thus were slowly worn down,’ he says. If the climate had remained stable throughout, they might still be here.”"},"18":{"raw":"Par C","v":"C","ex":"reference to the final geographical location of Neanderthals Answer: Par C Part of the passage: Some 45,000 years later, another fight for survival took place. This time, the location was Europe and the protagonists were another species, the Neander- thals. They were a highly successful species that dominated the European landscape for 300,000 years. Yet within just a few thousand years of the arrival of Homo sapiens, their numbers plummeted. They eventually disappeared from the landscape around 30,000 years ago, with their last known refuge being southern Iberia, including Gibraltar."},"19":{"raw":"sediment layers","v":"sediment layers","ex":"Analysis of stone tools and …………… has enabled Petraglia’s team to put for- ward an arrival date for Homo sapiens in eastern India. Answer: sediment layers Part of the passage: Based on careful examination of the tools and dating of the sed- iment layers where they were found, Petraglia and his team suggest that Homo sapi- ens arrived in eastern India around 78,000 years ago"},"20":{"raw":"ivory and bone","v":"ivory and bone","ex":"Homo sapiens used both …………… to make sewing implements. Answer: ivory and bone Part of the passage: [Par D] Homo sapiens had another skill: weaving and sewing. Ar- chaeologists have uncovered simple needles fashioned from ivory and bone alongside Homo sapiens, dating as far back as 35,000 years ago."},"21":{"raw":"(new) technologies","v":"(new) technologies","ex":"The territorial nature of Neanderthals may have limited their ability to acquire resources and …………… Answer: (new) technologies Part of the passage: [Par E] By contrast, Neanderthals tended to keep themselves to themselves, living in small groups. They misdirected their energies by only gathering resources from their immediate surroundings and perhaps failing to discover new tech- nologies outside their territory."},"22":{"raw":"skull shapes","v":"skull shapes","ex":"Archaeologists examined …………… in order to get an insight into Neanderthal and Homo sapiens’ capacity for language and thought. Answer: skull shapes Part of the passage: [Par F] By comparing skull shapes, archaeologists have shown that Homo sapiens had a more developed temporal lobe – the regions at the side of the brain, associated with listening, language and long-term memory."},"23":{"raw":"C","v":"C","ex":"No evidence can be found to suggest that Neanderthal communities allocated tasks to different members. Answer: C Part of the passage: [Par F] ‘We see similar kinds of injuries on male and female Ne- anderthal skeletons, implying there was no such division of labour,’ says Spikins."},"24":{"raw":"B","v":"B","ex":"Homo sapiens may have been able to plan ahead. Answer: B Part of the passage: [Par F] ‘We think that Homo sapiens had a significantly more com- plex language than Neanderthals and were able to comprehend and discuss concepts such as the distant past and future,’ says Stringer."},"25":{"raw":"A","v":"A","ex":"Scientists cannot be sure whether a sudden natural disaster contributed to the loss of a human species. Answer: A Part of the passage: [Par B] ‘We think that Homo sapiens had a more efficient hunt- ing technology, which could have given them the edge,’ says Petraglia. ‘Whether the eruption of Toba also played a role in the extinction of the Homo erectus-like species is unclear to us.’"},"26":{"raw":"B","v":"B","ex":"Environmental conditions restricted the areas where Homo sapiens and Nean- derthals could live. Answer: B Part of the passage: [Par C] But then Europe’s climate swung into a cold, inhospitable, dry phase. ‘Neanderthal and Homo sapiens populations had to retreat to refugia (pockets of habitable land). This heightened competition between the two groups,’ explains Chris Stringer, anthropologist at the Natural History Museum in London."}},"words":[{"w":"Roam","pos":"v","def":"to move about or travel, especially without a clear idea of what you are going to do","lvl":"","ex":"You will face extra costs for roaming","ar":"يتجوّل"},{"w":"Erupt","pos":"v","def":"to start suddenly and violently","lvl":"","ex":"At the end of a hot summer, violence erupted in the inner cities","ar":"ينفجر / يثور"},{"w":"Plummet","pos":"v","def":"to fall quickly and suddenly","lvl":"","ex":"House prices plummeted in recent months","ar":"يهبط بشدة"},{"w":"Inhospitable","pos":"adj","def":"describes an area that is not suitable for humans to live in","lvl":"","ex":"They had to trek for miles through inhospitable countryside","ar":"غير صالح للعيش"},{"w":"Stocky","pos":"adj","def":"describes a man, whose body is wide across the shoulders and chest and who is short","lvl":"","ex":"The man was described as short and stocky and very strong","ar":"ممتلئ قوي البنية"},{"w":"Robust","pos":"adj","def":"string and healthy, or strong and unlikely to break or fail","lvl":"","ex":"He looks robust and healthy enough","ar":"قوي ومتين"},{"w":"Thirst","pos":"n","def":"a string wish","lvl":"C2","ex":"He has always had a thirst for adventure","ar":"رغبة شديدة"},{"w":"Wear down","pos":"v","def":"to make someone feel tired and less able to deal successfully with a situation","lvl":"","ex":"Both sides are trying to wear the other down by being obstinate in the negotiations","ar":"يُنهك"}]},{"n":27,"pp":3,"title":"The new way to be a fifth-grader","untitled":false,"intro":"by Clive Thompson Khan Academy is changing the rules of education.","paras":[{"L":null,"t":"I peer over his shoulder at his laptop screen to see the math problem the fifth-grader is pondering. It’s a trigonometry problem. Carpenter, a serious-faced ten-year-old, pauses for a second, fidgets, then clicks on “0 degrees.” The computer tells him that he’s correct. “It took a while for me to work it out,” he admits sheepishly. The software then generates another problem, followed by another, until eventually he’s done ten in a row.","foot":false},{"L":null,"t":"Last November, his teacher, Kami Thordarson, began using Khan Academy in her class. It is an educational website on which students can watch some 2,400 videos. The videos are anything but sophisticated. At seven to 14 minutes long, they consist of a voiceover by the site’s founder, Salman Khan, chattily describing a mathematical concept or explaining how to solve a problem, while his hand-scribbled formulas and diagrams appear on screen. As a student, you can review a video as many times as you want, scrolling back several times over puzzling parts and fast-forwarding through the boring bits you already know. Once you’ve mastered a video, you can move on to the next one.","foot":false},{"L":null,"t":"Initially, Thordarson thought Khan Academy would merely be a helpful supplement to her normal instruction. But it quickly became far more than that. She is now on her way to “flipping” the way her class works. This involves replacing some of her lectures with Khan’s videos, which students can watch at home. Then in class, they focus on working on the problem areas together. The idea is to invert the normal rhythms of school, so that lectures are viewed in the children’s own time and homework is done at school. It sounds weird, Thordarson admits, but this reversal makes (line 40*) sense when you think about it. It is when they are doing homework that students are really grappling with a subject and are most likely to want someone to talk to. And Khan Academy provides teachers with a dashboard application that lets them see the instant a student gets stuck.","foot":false},{"L":null,"t":"For years, teachers like Thordarson have complained about the frustrations of teaching to the “middle” of the class. They stand at the whiteboard trying to get 25 or more students to learn at the same pace. Advanced students get bored and tune out, lagging ones get lost and tune out, and pretty soon half the class is not paying attention. Since the rise of personal computers in the 1980s, educators have hoped that technology could save the day by offering lessons tailored to each child. Schools have spent millions of dollars on sophisticated classroom technology, but the effort has been in vain. The one-to-one instruction it requires is, after all, prohibitively expensive. What country can afford such a luxury?","foot":false},{"L":null,"t":"Khan never intended to overhaul the school curricula and he doesn’t have a consistent, comprehensive plan for doing so. Nevertheless, some of his fans believe that he has stumbled onto the solution to education’s middle-of-the-class mediocrity. Most notable among them is Bill Gates, whose foundation has invested $1.5 million in Khan’s site. Students have pointed out that Khan is particularly good at explaining all the hidden, small steps in math problems – steps that teachers often gloss over. He has an uncanny ability to inhabit the mind of someone who doesn’t already understand something.","foot":false},{"L":null,"t":"However, not all educators are enamoured with Khan and his site. Gary Stager, a long-time educational consultant and advocate of laptops in classrooms, thinks Khan Academy is not innovative at all. The videos and software modules, he contends, are just a high-tech version of the outdated teaching techniques–lecturing and drilling. Schools have become “joyless test-prep factories,” he says, and Khan Academy caters to this dismal trend.","foot":false},{"L":null,"t":"As Sylvia Martinez, president of an organization focusing on technology in the classroom, puts it, “The things they’re doing are really just rote.” Flipping the classroom isn’t an entirely new idea, Martinez says, and she doubts that it would work for the majority of pupils: “I’m sorry, but if they can’t understand the lecture in a classroom, they’re not going to grasp it better when it’s done through a video at home.”","foot":false},{"L":null,"t":"Another limitation of Khan’s site is that the drilling software can only handle questions where the answers are unambiguously right or wrong, like math or chemistry; Khan has relatively few videos on messier, grey-area subjects like history. Khan and Gates admit there is no easy way to automate the teaching of writing–even though it is just as critical as math.","foot":false},{"L":null,"t":"Even if Khan is truly liberating students to advance at their own pace, it is not clear that schools will be able to cope. The very concept of grade levels implies groups of students moving along together at an even pace. So what happens when, using Khan Academy, you wind up with a ten-year-old who has already mastered high-school physics? Khan’s programmer, Ben Kamens, has heard from teachers who have seen Khan Academy presentations and loved the idea but wondered whether they could modify it “to stop students from becoming this advanced.”","foot":false},{"L":null,"t":"Khan’s success has injected him into the heated wars over school reform. Reformers today, by and large, believe student success should be carefully tested, with teachers and principals receiving better pay if their students advance more quickly. In essence, Khan doesn’t want to change the way institutions teach; he wants to change how people learn, whether they’re in a private school or a public school–or for that matter, whether they’re a student or an adult trying to self-educate in Ohio, Brazil, Russia, or India. One member of Khan’s staff is spearheading a drive to translate the videos into ten major languages. It’s classic start-up logic: do something novel, do it with speed, and the people who love it will find you.","foot":false}],"groups":[{"a":27,"b":31,"k":"mcq","instr":["Choose the correct letter, A, B, C or D.","Write the correct letter in boxes 27–31 on your answer sheet."],"items":[{"n":27,"t":"What do you learn about the student in the first paragraph?","opts":[{"k":"A","t":"He has not used the maths software before."},{"k":"B","t":"He did not expect his answer to the problem to be correct."},{"k":"C","t":"He was not initially doing the right maths problem."},{"k":"D","t":"He did not immediately know how to solve the maths problem."}]},{"n":28,"t":"What does the writer say about the content of the Khan Academy videos?","opts":[{"k":"A","t":"They have been produced in a professional manner."},{"k":"B","t":"They include a mix of verbal and visual features."},{"k":"C","t":"Some of the maths problems are too easy."},{"k":"D","t":"Some of the explanations are too brief."}]},{"n":29,"t":"What does this reversal refer to in line 40*?","opts":[{"k":"A","t":"going back to spending fewer hours in school"},{"k":"B","t":"students being asked to explain answers to teachers"},{"k":"C","t":"swapping the activities done in the class and at home"},{"k":"D","t":"the sudden improvement in students’ maths performance"}]},{"n":30,"t":"What does the writer say about teaching to the ‘middle’ of the class?","opts":[{"k":"A","t":"Teachers become too concerned about weaker students."},{"k":"B","t":"Technology has not until now provided a solution to the problem."},{"k":"C","t":"Educators have been unwilling to deal with the issues."},{"k":"D","t":"Students in this category quickly become bored."}]},{"n":31,"t":"Students praise Khan’s videos because they","opts":[{"k":"A","t":"show
