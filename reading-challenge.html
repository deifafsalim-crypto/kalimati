discipline","ar":"تخصّص / مجال دراسة"},{"w":"Manipulate","pos":"v","def":"to control something or someone to your advantage, often unfairly or dishonestly","lvl":"","ex":"Throughout her career she was very successfully manipulated by the media","ar":"يتلاعب / يتحكّم"},{"w":"Perspective","pos":"n","def":"a particular way of considering something","lvl":"C1","ex":"Her attitude lends a fresh perspective to the subject","ar":"منظور / وجهة نظر"},{"w":"Paramount","pos":"adj","def":"more important than anything else","lvl":"C2","ex":"There are many priorities, but reducing the budget deficit is paramount","ar":"في غاية الأهمية"},{"w":"Condemn","pos":"v","def":"to criticize something or someone strongly, usually for moral reasons","lvl":"C2","ex":"The terrorist action has been condemned as an act of barbarism and cowardice","ar":"يُدين / ينتقد بشدة"},{"w":"Precious","pos":"adj","def":"of great value because of being rare, expensive, or important","lvl":"","ex":"a precious gift, a precious moment/memory","ar":"ثمين"},{"w":"Ironically","pos":"adv","def":"interesting, strange, or funny because of being very different from what you would usually expect","lvl":"C2","ex":"it is ironic that although many items are now cheaper to make, fewer people can afford to buy them","ar":"من المفارقة"},{"w":"Stem from","pos":"v","def":"to start or develop as the result of something","lvl":"","ex":"Her problems stem from her difficult childhood","ar":"ينبع من / ينتج عن"},{"w":"Suspend","pos":"v","def":"to stop something from being active, either temporarily or permanently","lvl":"C1","ex":"The ferry service has been suspended for the day because of the bad weather","ar":"يعلّق / يوقف مؤقتًا"},{"w":"Unwittingly","pos":"adv","def":"without knowing or planning","lvl":"","ex":"The two women claimed they were the unwitting victims of a drugs dealer who planted a large quantity of heroin in their luggage","ar":"دون قصد"},{"w":"Proclaim","pos":"v","def":"to announce something publicly or officially, especially something positive","lvl":"","ex":"","ar":"يُعلن رسميًا"},{"w":"In the face of","pos":"","def":"in a situation where you have to deal with something unpleasant or difficult","lvl":"","ex":"They won in the face of stiff competition from all over the country","ar":"في مواجهة"},{"w":"Benevolent","pos":"adj","def":"kind and smart","lvl":"","ex":"He was a benevolent old man and wouldn’t hurt a fly","ar":"خيّر / عطوف"},{"w":"Distorted","pos":"adj","def":"changed from the usual, original, natural, or intended form","lvl":"","ex":"This report gives a somewhat distorted impression of what actually happened","ar":"مشوَّه / محرَّف"},{"w":"Aspiration","pos":"n","def":"something that you hope to achieve","lvl":"C2","ex":"I have never had any political aspirations","ar":"طموح"},{"w":"Feeble","pos":"adj","def":"not effective and good","lvl":"C2","ex":"a feeble joke or excuse","ar":"ضعيف / غير فعّال"},{"w":"Preoccupation","pos":"n","def":"an idea or subject that someone thinks about most of the time","lvl":"","ex":"My main preoccupation now is trying to keep life normal for the sake of my two boys","ar":"انشغال / هاجس"},{"w":"Come to fore","pos":"","def":"to be emphasized or made more noticeable","lvl":"","ex":"This argument needs to come to the fore when you rewrite your paper.","ar":"يبرز / يتصدّر المشهد"}]},{"n":7,"pp":1,"title":"The way the brain buys","untitled":false,"intro":"Supermarkets take great care over the way the goods they sell are arranged. This is because they know a lot about how to persuade people to buy things.","paras":[{"L":null,"t":"When you enter a supermarket, it takes some time for the mind to get into a shopping mode. This is why the area immediately inside the entrance of a supermarket is known as the ‘decompression zone’. People need to slow down and take stock of the surroundings, even if they are regulars. Supermarkets do not expect to sell much here, so it tends to be used more for promotion. So the large items piled up here are designed to suggest that there are bargains further inside the store, and shoppers are not necessarily expected to buy them. Walmart, the world’s biggest retailer, famously employs ‘greeters’ at the entrance to its stores. A friendly welcome is said to cut shoplifting. It is harder to steal from nice people.","foot":false},{"L":null,"t":"Immediately to the left in many supermarkets is a ‘chill zone’, where customers can enjoy browsing magazines, books and DVDs. This is intended to tempt unplanned purchases and slow customers down. But people who just want to do their shopping quickly will keep walking ahead, and the first thing they come to is the fresh fruit and vegetables section. However, for shoppers, this makes no sense. Fruit and vegetables can be easily damaged, so they should be bought at the end, not the beginning, of a shopping trip. But psychology is at work here: selecting these items makes people feel good, so they feel less guilty about reaching for less healthy food later on.","foot":false},{"L":null,"t":"Shoppers already know that everyday items, like milk, are invariably placed towards the back of a store to provide more opportunity to tempt customers to buy things which are not on their shopping list. This is why pharmacies are also generally at the back. But supermarkets know shoppers know this, so they use other tricks, like placing popular items halfway along a section so that people have to walk all along the aisle looking for them. The idea is to boost ‘dwell time’: the length of time people spend in a store.","foot":false},{"L":null,"t":"Having walked to the end of the fruit-and-vegetable aisle, shoppers arrive at counters of prepared food, the fishmonger, the butcher and the deli. Then there is the in-store bakery, which can be smelt before it is seen. Even small supermarkets now use in-store bakeries. Mostly these bake pre-prepared items and frozen ingredients which have been delivered to the supermarket previously, and their numbers have increased, even though central bakeries that deliver to a number of stores are much more efficient. They do it for the smell of freshly baked bread, which arouses people’s appetites and thus encourages them to purchase not just bread but also other food, including ready meals.","foot":false},{"L":null,"t":"Retailers and producers talk a lot about the ‘moment of truth’. This is not a philosophical idea, but the point when people standing in the aisle decide to buy something and reach to get it. At the instant coffee section, for example, branded products from the big producers are arranged at eye level while cheaper ones are lower down, along with the supermarket’s own-label products. But shelf positioning is fiercely fought over, not just by those trying to sell goods, but also by those arguing over how best to manipulate shoppers. While many stores reckon eye level is the top spot, some think a little higher is better. Others think goods displayed at the end of aisles sell the most because they have the greatest visibility. To be on the right-hand side of an eye-level selection is often considered the very best place, because most people are right-handed and most people’s eyes drift rightwards. Some supermarkets reserve that for their most expensive own-label goods.","foot":false},{"L":null,"t":"Scott Bearse, a retail expert with Deloitte Consulting in Boston, Massachusetts, has led projects observing and questioning tens of thousands of customers about how they feel about shopping. People say they leave shops empty-handed more often because they are ‘unable to decide’ than because prices are too high, says Mr Bearse. Getting customers to try something is one of the best ways of getting them to buy, adds Mr Bearse. Deloitte found that customers who use fitting rooms in order to try on clothes buy the product they are considering at a rate of 85% compared with 58% for those that do not do so.","foot":false},{"L":null,"t":"Often a customer struggling to decide which of two items is best ends up not buying either. In order to avoid a situation where a customer decides not to buy either product, a third ‘decoy’ item, which is not quite as good as the other two, is placed beside them to make the choice easier and more pleasurable. Happier customers are more likely to buy.","foot":false}],"groups":[{"a":1,"b":4,"k":"gap","instr":["Label the diagram below.","Choose NO MORE THAN THREE WORDS from the passage for each answer.","Write your answers in boxes 1–4 on your answer sheet."],"items":[],"opts":[],"ctx":["‘decompression zone’ for 1 …………… , not sales","‘chill zone’ for 2 …………… , such as magazines, books, DVDs","counters selling 3 …………… situated opposite entrance","4 …………… often placed in central areas of aisles"],"mode":"diagram","ctitle":"Layout of typical supermarket","img":"d7"},{"a":5,"b":10,"k":"tf","instr":["Do the following statements agree with the information given in the reading passage?","In boxes 5–10 on your answer sheet, write"],"items":[{"n":5,"t":"The ‘greeters’ at Walmart increase sales.","opts":[]},{"n":6,"t":"People feel better about their shopping if they buy fruit and vegetables before they buy other food.","opts":[]},{"n":7,"t":"In-store bakeries produce a wider range of products than central bakeries.","opts":[]},{"n":8,"t":"Supermarkets find right-handed people easier to persuade than left-handed people.","opts":[]},{"n":9,"t":"The most frequent reason for leaving shops without buying something is price.","opts":[]},{"n":10,"t":"‘Decoy’ items are products which the store expects customers to choose.","opts":[]}],"opts":[],"ctx":[]},{"a":11,"b":13,"k":"gap","instr":["Complete the flow chart below.","Choose NO MORE THAN TWO WORDS from the passage for each answer.","Write your answers in boxes 11–13 on your answer sheet."],"items":[],"opts":[],"ctx":["The supermarket is sent 11 …………… and other items which have been prepared earlier.","Baking bread in-store produces an aroma.","Shoppers’ 12 …………… are stimulated.","They are then keener to buy food, including bread and 13 …………… ."],"mode":"flow","ctitle":"In-store bread production process"}],"ans":{"1":{"raw":"promotion","v":"promotion","ex":"‘decompression zone’ for ..............., not sales Answer: promotion Part of the passage: When you enter a supermarket, it takes some time for the mind to get into a shopping mode. This is why the area immediately inside the entrance of a supermarket is known as the ‘decompression zone’. People need to slow down and take stock of the surroundings, even if they are regulars. Supermarkets do not expect to sell much here, so it tends to be used more for promotion."},"2":{"raw":"unplanned purchases","v":"unplanned purchases","ex":"‘chill zone’ for ..............., such as magazines, books, DVDs Answer: unplanned purchases Part of the passage: Immediately to the left in many supermarkets is a ‘chill zone’, where customers can enjoy browsing magazines, books and DVDs. This is intended to tempt unplanned purchases and slow customers down."},"3":{"raw":"fruit and vegetables","v":"fruit and vegetables","ex":"counters selling ............... situated opposite entrance Answer: fruit and vegetables Part of the passage: But people who just want to do their shopping quickly will keep walking ahead, and the first thing they come to is the fresh fruit and vegetables section. However, for shoppers, this makes no sense."},"4":{"raw":"popular items","v":"popular items","ex":"............... often placed in central areas of aisles Answer: popular items Part of the passage: Shoppers already know that everyday items, like milk, are invari- ably placed towards the back of a store to provide more opportunity to tempt customers to buy things which are not on their shopping list. This is why pharmacies are also gener- ally at the back. But supermarkets know shoppers know this, so they use other tricks, like placing popular items halfway along a section so that people have to walk all along the aisle looking for them. The idea is to boost ‘dwell time’: the length of time people spend in a store. Explanation: central areas of aisles = halfway along a section"},"5":{"raw":"Not Given","v":"NG","ex":"The ‘greeters’ at Walmart increase sales. Meaning: Does sales increase because of the ‘greeters’ Walmart? Can they help to increase sales? Part of the passage: Walmart, the world’s biggest retailer, famously employs ‘greeters’ at the entrance to its stores. A friendly welcome is said to cut shoplifting. It is harder to steal from nice people. Answer: Not Given Explanation: The text says it cuts (decreases) shoplifting, but there is no enough infor- mation to conclude that having ‘greeters’ increases sales. Maybe it does, maybe it does not. We don’t know it for sure."},"6":{"raw":"True","v":"T","ex":"People feel better about their shopping if they buy fruit and vegetables be- fore they buy other food. Meaning: Does it feel better to buy fruit and vegetables before buying other food while shopping at a supermarket? Part of the passage: Fruit and vegetables can be easily damaged, so they should be bought at the end, not the beginning, of a shopping trip. But psychology is at work here: selecting these items makes people feel good, so they feel less guilty about reaching for less healthy food later on. Answer: True Explanation: Let’s say you want to buy ice-cream (less healthy), so according to the text, if you buy fruit and vegetables first, you are more likely to feel better and less guilty about reaching for this ice cream."},"7":{"raw":"Not Given","v":"NG","ex":"In-store bakeries produce a wider range of products than central bakeries. Meaning: In-store bakeries are compared to central bakeries, and according to the statement, they produce a greater range of products (such as bread, pies, cakes etc). Let’s see if this is true, false or not given. Part of the passage: Even small supermarkets now use in-store bakeries. Mostly these bake pre-prepared items and frozen ingredients which have been delivered to the super- market previously, and their numbers have increased, even though central bakeries that deliver to a number of stores are much more efficient. They do it for the smell of freshly baked bread, which arouses people’s appetites and thus encourages them to purchase not just bread but also other food, including ready meals. Answer: Not Given Explanation: The text says central bakeries are much more efficient, but does not mention the range of products. Efficiency is about performance in relation to resources and time, but the range of products is different."},"8":{"raw":"Not Given","v":"NG","ex":"Supermarkets find right-handed people easier to persuade than left-handed people. Meaning: Are right-handed people are easily persuaded (manipulated) than the lefties? Part of the passage: To be on the right-hand side of an eye-level selection is often considered the very best place, because most people are right-handed and most people’s eyes drift rightwards. Answer: Not Given Explanation: Whenever you have a comparison of two things (in this case, right-hand- ed vs left-handed people), you should always make sure both are mentioned in the passage. If not, then the statement is most likely not given. So in the part of the passage given above, there is nothing about left-handed people. Moreover, it does not say any- thing about right-handed people being easily persuaded. The only claim the text has made is that most people are right-handed."},"9":{"raw":"False","v":"F","ex":"The most frequent reason for leaving shops without buying something is price. Meaning: Is price the most common reason for leaving shops without buying something? In other words, is price the most important factor in deciding whether or not to buy? Part of the passage: People say they leave shops empty-handed more often because they are ‘unable to decide’ than because prices are too high, says Mr Bearse. Answer: False Explanation: According to the passage, the number one reason why people leave empty-handed is that they are ‘unable to decide’ what to buy (they have too many choices), not because of the price. So the statement is clearly contradicted."},"10":{"raw":"False","v":"F","ex":"‘Decoy’ items are products which the store expects customers to choose Meaning: Do stores expect customers to buy ‘decoy’ items? Part of the passage: Often a customer struggling to decide which of two items is best ends up not buying either. In order to avoid a situation where a customer decides not to buy either product, a third ‘decoy’ item, which is not quite as good as the other two, is placed beside them to make the choice easier and more pleasurable. Happier customers are more likely to buy. Answer: False Explanation: ‘decoy’ items are placed to make the choice easier; it means they are not desirable products and stores do NOT expect customers to buy these items. It is, in fact, exactly the opposite: stores want customers to buy other items with the help of ‘decoy’ products."},"11":{"raw":"frozen ingredients","v":"frozen ingredients","ex":"The supermarket is sent …………… and other items which have been prepared earlier. Answer: frozen ingredients Explanation: The supermarket is sent = ...which have been delivered to the super- market; other items which have been prepared earlier = pre-prepared items;"},"12":{"raw":"appetites","v":"appetites","ex":"Shoppers’ …………… are stimulated. Answer: appetites Explanation: to stimulate = to arouse;"},"13":{"raw":"ready meals","v":"ready meals","ex":"They are then keener to buy food, including bread and …………… . Answer: ready meals Explanation: keener to buy food, including bread and ready meals = encourages them to purchase not bread, but also other food, including ready meals"}},"words":[{"w":"Persuade","pos":"v","def":"to make someone do or believe something by giving them a good reason to do it","lvl":"B1","ex":"Using a bunch of bananas, the zoo-keeper persuaded the monkey back into its cage.","ar":"يقنع"},{"w":"Take stock of","pos":"","def":"to think carefully about a situation or event and form an opinion about it, so that you can decide what to do","lvl":"","ex":"After two years spent teaching overseas, she returned home for a month to take stock of her life (C2)","ar":"يقيّم الوضع / يتأمّل"},{"w":"Pile up","pos":"v","def":"to arrange objects into a pile","lvl":"","ex":"We piled plenty of logs up next to the fire","ar":"يكدّس"},{"w":"Bargain","pos":"n","def":"something on sale at a lower price than its true value","lvl":"","ex":"This coat was half-price – a real bargain","ar":"صفقة / سلعة رخيصة"},{"w":"Tempt","pos":"v","def":"to make someone want to have or do something, especially something that is unnecessary or wrong","lvl":"","ex":"The offer of free credit tempted her into buying a new car","ar":"يغري"},{"w":"Invariably","pos":"adv","def":"always","lvl":"C2","ex":"The train is invariably late.","ar":"دائمًا / بلا استثناء"},{"w":"Fierce","pos":"adj","def":"strong and powerful","lvl":"","ex":"Fierce winds prevented the race from taking place.","ar":"شرس / قوي"},{"w":"Display","pos":"v","def":"to arrange something or a collection of things so that they can be seen by the public","lvl":"B1","ex":"Family photographs were displayed on the wall.","ar":"يعرض"},{"w":"Empty-handed","pos":"adj","def":"without bringing or taking anything","lvl":"","ex":"We can’t go the party empty-handed","ar":"خالي اليدين"},{"w":"Struggle","pos":"v","def":"to experience difficulty and make a very great effort in order to do something","lvl":"B2","ex":"the dog had been struggling to get free of the wire noose","ar":"يكافح / يجد صعوبة"},{"w":"End up","pos":"v","def":"to finally be in a particular place or situation","lvl":"B1","ex":"They are travelling across Europe by train and are planning to end up in Moscow","ar":"ينتهي به الأمر إلى"}]},{"n":8,"pp":2,"title":"The truth about lying","untitled":false,"intro":"Over the years Richard Wiseman has tried to unravel the truth about deception – investigating the signs that give away a liar.","paras":[{"L":"A","t":"In the 1970s, as part of a large-scale research programme exploring the area of interspecies communication, Dr Francine Patterson from Stanford University attempted to teach two lowland gorillas called Michael and Koko a simplified version of Sign Language. According to Patterson, the great apes were capable of holding meaningful conversations, and could even reflect upon profound topics, such as love and death. During the project, their trainers believe they uncovered instances where the two gorillas’ linguistic skills seemed to provide reliable evidence of intentional deceit. In one example, Koko broke a toy cat, and then signed to indicate that the breakage had been caused by one of her trainers. In another episode, Michael ripped a jacket belonging to a trainer and, when asked who was responsible for the incident, signed ‘Koko’. When the trainer expressed some scepticism, Michael appeared to change his mind, and indicated that Dr Patterson was actually responsible, before finally confessing.","foot":false},{"L":"B","t":"Other researchers have explored the development of deception in children. Some of the most interesting experiments have involved asking youngsters not to take a peek at their favourite toys. During these studies, a child is led into a laboratory and asked to face one of the walls. The experimenter then explains that he is going to set up an elaborate toy a few feet behind them. After setting up the toy, the experimenter says that he has to leave the laboratory, and asks the child not to turn around and peek at the toy. The child is secretly filmed by hidden cameras for a few minutes, and then the experimenter returns and asks them whether they peeked. Almost all three-year-olds do, and then half of them lie about it to the experimenter. By the time the children have reached the age of five, all of them peek and all of them lie. The results provide compelling evidence that lying starts to emerge the moment we learn to speak.","foot":false},{"L":"C","t":"So what are the tell-tale signs that give away a lie? In 1994, the psychologist Richard Wiseman devised a large-scale experiment on a TV programme called Tomorrow’s World. As part of the experiment, viewers watched two interviews in which Wiseman asked a presenter in front of the cameras to describe his favourite film. In one interview, the presenter picked Some Like It Hot and he told the truth; in the other interview, he picked Gone with the Wind and lied. The viewers were then invited to make a choice – to telephone in to say which film he was lying about. More than 30,000 calls were received, but viewers were unable to tell the difference and the vote was a 50/50 split. In similar experiments, the results have been remarkably consistent – when it comes to lie detection, people might as well simply toss a coin. It doesn’t matter if you are male or female, young or old; very few people are able to detect deception.","foot":false},{"L":"D","t":"Why is this? Professor Charles Bond from the Texas Christian University has conducted surveys into the sorts of behaviour people associate with lying. He has interviewed thousands of people from more than 60 countries, asking them to describe how they set about telling whether someone is lying. People’s answers are remarkably consistent. Almost everyone thinks liars tend to avert their gaze, nervously wave their hands around and shift about in their seats. There is, however, one small problem. Researchers have spent hour upon hour carefully comparing films of liars and truth-tellers. The results are clear. Liars do not necessarily look away from you; they do not appear nervous and move their hands around or shift about in their seats. People fail to detect lies because they are basing their opinions on behaviours that are not actually associated with deception.","foot":false},{"L":"E","t":"So what are we missing? It is obvious that the more information you give away, the greater the chances of some of it coming back to haunt you. As a result, liars tend to say less and provide fewer details than truth-tellers. Looking back at the transcripts of the interviews with the presenter, his lie about Gone with the Wind contained about 40 words, whereas the truth about Some Like It Hot was nearly twice as long. People who lie also try psychologically to keep a distance from their falsehoods, and so tend to include fewer references to themselves in their stories. In his entire interview about Gone with the Wind, the presenter only once mentioned how the film made him feel, compared with the several references to his feelings when he talked about Some Like It Hot.","foot":false},{"L":"F","t":"The simple fact is that the real clues to deceit are in the words that people use, not the body language. So do people become better lie detectors when they listen to a liar, or even just read a transcript of their comments? The interviews with the presenter were also broadcast on radio and published in a newspaper, and although the lie-detecting abilities of the television viewers were no better than chance, the newspaper readers were correct 64% of the time, and the radio listeners scored an impressive 73% accuracy rate.","foot":false}],"groups":[{"a":14,"b":19,"k":"head","instr":["The reading passage has six paragraphs, A–F.","Choose the correct heading for each paragraph from the list of headings below.","Write the correct number, i–viii, in boxes 14–19 on your answer sheet."],"items":[{"n":14,"t":"Paragraph A","opts":[]},{"n":15,"t":"Paragraph B","opts":[]},{"n":16,"t":"Paragraph C","opts":[]},{"n":17,"t":"Paragraph D","opts":[]},{"n":18,"t":"Paragraph E","opts":[]},{"n":19,"t":"Paragraph G","opts":[]}],"opts":[{"k":"i","t":"some of the things liars really do"},{"k":"ii","t":"when do we begin to lie?"},{"k":"iii","t":"how wrong is it to lie?"},{"k":"iv","t":"exposing some false beliefs"},{"k":"v","t":"which forum of communication best exposes a lie?"},{"k":"vi","t":"do only humans lie?"},{"k":"vii","t":"dealing with known liars"},{"k":"viii","t":"a public test of our ability to spot a lie"}],"ctx":[],"optTitle":"List of headings"},{"a":20,"b":23,"k":"match","instr":["Look at the following statements and the list of experiments below.","Match each statement with the correct experiment, A–C.","Write the correct letter, A–C, in boxes 20–23 on your answer sheet.","NB You may use any letter more than once."],"items":[{"n":20,"t":"Someone who was innocent was blamed for something.","opts":[]},{"n":21,"t":"Those involved knew they were being filmed.","opts":[]},{"n":22,"t":"Some objects were damaged.","opts":[]},{"n":23,"t":"Some instructions were ignored.","opts":[]}],"opts":[{"k":"A","t":"the gorilla experiment"},{"k":"B","t":"the experiment with children"},{"k":"C","t":"the TV experiment"}],"ctx":[],"optTitle":"List of Experiments"},{"a":24,"b":26,"k":"gap","instr":["Complete the sentences below.","Choose ONE WORD ONLY from the passage for each answer.","Write your answers in boxes 24–26 on your answer sheet."],"items":[{"n":24,"t":"Filming liars has shown that they do not display …………… behaviour.","opts":[]},{"n":25,"t":"Liars tend to avoid talking about their own …………… .","opts":[]},{"n":26,"t":"Signs of lying are exposed in people’s …………… rather than their movements.","opts":[]}],"opts":[],"ctx":[]}],"ans":{"14":{"raw":"VI do only humans lie?","v":"vi","ex":"Paragraph A Part of the passage: According to Patterson, the great apes were capable of holding meaningful conversations, and could even reflect upon profound topics, such as love and death. During the project, their trainers believe they uncovered instances where the two gorillas’ linguistic skills seemed to provide reliable evidence of intentional deceit. In one example, Koko broke a toy cat, and then signed to indicate that the breakage had been caused by one of her trainers. Main idea in paragraph A: Animals are also capable of intentional deceit (lie). Answer: VI do only humans lie?"},"15":{"raw":"II when do we begin to lie?","v":"ii","ex":"Paragraph B Part of the passage: By the time the children have reached the age of five, all of them peek and all of them lie. The results provide compelling evidence that lying starts to emerge the moment we learn to speak. Main idea in paragraph B: The time when we start to lie Answer: II when do we begin to lie?"},"16":{"raw":"VIII a public test of our ability to spot a lie","v":"viii","ex":"Paragraph C Paragraph: So what are the tell-tale signs that give away a lie? In 1994, the psychologist Richard Wiseman devised a large-scale experiment on a TV programme called Tomor- row’s World. As part of the experiment, viewers watched two interviews in which Wise- man asked a presenter in front of the cameras to describe his favourite film. In one inter- view, the presenter picked Some Like It Hot and he told the truth; in the other interview, he picked Gone with the Wind and lied. The viewers were then invited to make a choice – to telephone in to say which film he was lying about. More than 30,000 calls were re- ceived, but viewers were unable to tell the difference and the vote was a 50/50 split. In similar experiments, the results have been remarkably consistent – when it comes to lie detection, people might as well simply toss a coin. It doesn’t matter if you are male or female, young or old; very few people are able to detect deception. Main idea in paragraph C: The whole paragraph describes a TV experiment to see if viewers can tell the difference between a lie and truth. Answer: VIII a public test of our ability to spot a lie"},"17":{"raw":"IV exposing some false beliefs","v":"iv","ex":"Paragraph D Part of the passage: The results are clear. Liars do not necessarily look away from you; they do not appear nervous and move their hands around or shift about in their seats. People fail to detect lies because they are basing their opinions on behaviours that are not actually associated with deception. Main idea in paragraph D: Common misconceptions about what liars do Answer: IV exposing some false beliefs"},"18":{"raw":"i some of the things liars really do","v":"i","ex":"Paragraph E Paragraph: So what are we missing? It is obvious that the more information you give away, the greater the chances of some of it coming back to haunt you. As a result, liars tend to say less and provide fewer details than truth-tellers. Looking back at the tran- scripts of the interviews with the presenter, his lie about Gone with the Wind contained about 40 words, whereas the truth about Some Like It Hot was nearly twice as long. People who lie also try psychologically to keep a distance from their falsehoods, and so tend to include fewer references to themselves in their stories. In his entire interview about Gone with the Wind, the presenter only once mentioned how the film made him feel, compared with the several references to his feelings when he talked about Some Like It Hot. Main idea in paragraph E: What really sets liars apart from truth-tellers? Answer: i some of the things liars really do"},"19":{"raw":"V which forum of communication best exposes a lie","v":"v","ex":"Paragraph F Part of the passage: The simple fact is that the real clues to deceit are in the words that people use, not the body language. So do people become better lie de- tectors when they listen to a liar, or even just read a transcript of their comments? Main idea in paragraph F: You can tell from the words, not the body language Answer: V which forum of communication best exposes a lie"},"20":{"raw":"A The Gorilla experiment","v":"A","ex":"Someone who was innocent was blamed for something. Part of the passage [Par A]: In another episode, Michael ripped a jacket belonging to a trainer and, when asked who was responsible for the incident, signed ‘Koko’. When the trainer expressed some scepticism, Michael appeared to change his mind, and indicated that Dr Patterson was actually responsible, before finally confessing. Answer: A The Gorilla experiment"},"21":{"raw":"C The TV experiment","v":"C","ex":"Those involved knew they were being filmed. Part of the passage [Par C]: As part of the experiment, viewers watched two interviews in which Wiseman asked a presenter in front of the cameras to describe his favourite film. Answer: C The TV experiment"},"22":{"raw":"A The Gorilla experiment","v":"A","ex":"Some objects were damaged. Part of the passage [Par A]: In one example, Koko broke a toy cat, and then signed to indicate that the breakage had been caused by one of her trainers. In another episode, Michael ripped a jacket belonging to a trainer and, when asked who was responsible for the incident, signed ‘Koko’. Answer: A The Gorilla experiment"},"23":{"raw":"B the experiment with children","v":"B","ex":"Some instructions were ignored. Part of the passage [Par B]: After setting up the toy, the experimenter says that he has to leave the laboratory, and asks the child not to turn around and peek at the toy. The child is secretly filmed by hidden cameras for a few minutes, and then the experimenter returns and asks them whether they peeked. Almost all three-year-olds do, and then half of them lie about it to the experimenter. Answer: B the experiment with children"},"24":{"raw":"nervous","v":"nervous","ex":"Filming liars has shown that they do not display …………… behaviour. Part of the passage [Par D]: Researchers have spent hour upon hour carefully com- paring films of liars and truth-tellers. The results are clear. Liars do not necessarily look away from you; they do not appear nervous and move their hands around or shift about in their seats. Answer: nervous Explanation: looking away, moving their hands around, shifting about in their seats are all examples of nervous behaviour. But it is hard to find because the word behaviour is not clearly given in this context."},"25":{"raw":"feelings","v":"feelings","ex":"Liars tend to avoid talking about their own …………… . Part of the passage [Par E]: People who lie also try psychologically to keep a distance from their falsehoods, and so tend to include fewer references to themselves in their stories. In his entire interview about Gone with the Wind, the presenter only once mentioned how the film made him feel, compared with the several references to his feelings when he talked about Some Like It Hot. Answer: feelings Explanation: possible wrong answers are falsehoods or references, but neither collocates with the word ‘own’."},"26":{"raw":"words","v":"words","ex":"Signs of lying are exposed in people’s …………… rather than their movements. Part of the passage [Par F]: The simple fact is that the real clues to deceit are in the words that people use, not the body language. Answer: words Explanation: their movements = body language; rather than = not Bonus Band 7+ questions: Q 18, Q 24 and Q 25"}},"words":[{"w":"Reflect upon","pos":"v","def":"to think carefully, especially about possibilities and opinions","lvl":"B2","ex":"The manager demanded time to reflect on what to do","ar":"يتأمّل في"},{"w":"Confess","pos":"v","def":"to admit that you have done something wrong or something that you feel guilty or bad about","lvl":"","ex":"She confessed to her husband that she had sold her wedding ring","ar":"يعترف"},{"w":"Take a peek at","pos":"v","def":"to look, especially for a short time or while trying to avoid being seen","lvl":"C2","ex":"That’s why I decided to take a peek into Adam’s medical records","ar":"يختلس نظرة"},{"w":"Compelling","pos":"adj","def":"if a reason, argument is compelling, it makes you believe it or accept it because it is so strong","lvl":"","ex":"Its fairly compelling argument for going","ar":"مقنع"},{"w":"toss a coin","pos":"v","def":"to throw a coin up into the air and guess which side will land facing up, as a way of making a decision","lvl":"C1","ex":"Let’s toss up to see who will go first","ar":"يرمي عملة (قرعة)"},{"w":"Gaze","pos":"n","def":"a long look, usually of a particular kind","lvl":"C2","ex":"a steady gaze; an innocent gaze","ar":"نظرة طويلة / تحديق"},{"w":"Haunt","pos":"v","def":"to cause repeated suffering or anxiety","lvl":"","ex":"Fighting in Vietnam was an experience that would haunt him for the rest of his life","ar":"يطارد / يؤرّق"},{"w":"Clue","pos":"n","def":"a sign or some information that helps you to find the answer to a problem","lvl":"","ex":"Police are still looking for clue in their search for the missing girl","ar":"دليل / مفتاح الحل"}]},{"n":9,"pp":3,"title":"The Beetlewing dress","untitled":true,"intro":"An astonishingly intricate project is being undertaken to restore a legendary theatrical dress, Angela Wintle explains.","paras":[{"L":null,"t":"On December 28th, 1888, the curtain rose on a daring new stage revival of Shakespeare’s Macbeth at the Lyceum Theatre in London. Topping the bill, playing Lady Macbeth, a main character in the play, was Ellen Terry. She was the greatest and most adored English actress of the age. But she didn’t achieve this devotion through her acting ability alone. She knew the power of presentation and carefully cultivated her image. That first night was no exception. When she walked on stage for the famous banqueting scene, her appearance drew a collective gasp from the audience.","foot":false},{"L":null,"t":"She was dressed in the most extraordinary clothes ever to have graced a British stage: a long, emerald and sea-green gown with tapering sleeves, surmounted by a velvet cloak, which glistened and sparkled eerily in the limelight. Yet this was no mere stage trickery. The effect had been achieved using hundreds of wings from beetles. The gown – later named the ‘Beetlewing dress’ – became one of the most iconic and celebrated costumes of the age.","foot":false},{"L":null,"t":"Terry was every bit as remarkable as her costumes. At 31, she became a leading lady at the Lyceum Theatre and for two decades, she set about bringing culture to the masses. The productions she worked on were extravagant and daring. Shakespeare’s plays were staged alongside blood-and-thunder melodramas and their texts were ruthlessly cut. Some people were critical, but they missed the point. The innovations sold tickets and brought new audiences to see masterpiece that they would never otherwise have seen.","foot":false},{"L":null,"t":"However, it was a painter who immortalised her. John Singer Sargent had been so struck by Terry’s appearance at that first performance that he asked her to model for him, and his famous portrait of 1889, now at the Tate Gallery in London, showed her with a glint in her eye, holding a crown over her flame red hair. But while the painting remains almost as fresh as the day it was painted, the years have not been so kind to the dress. Its delicate structure, combined with the cumulative effects of time, has meant it is now in an extremely fragile condition. Thus, two years ago, a fundraising project was launched by Britain’s National Trust 1 to pay for its conservation.","foot":false},{"L":null,"t":"It turned to textile conservator Zenzie Tinker to do the job. Zenzie loves historical dress because of the link with the past. ‘Working on costumes like the Beetlewing dress gives you a real sense of the people who wore them; you can see the sweat stains and wear marks. But it’s quite unusual to know who actually wore a garment. That’s the thing that makes the Beetlewing project so special.’","foot":false},{"L":null,"t":"Before any of Zenzie’s conservation work can begin, she and her team will conduct a thorough investigation to help determine what changes have been made to the dress and when. This will involve close examination of the dress for signs of damage and wear, and will be aided by comparing it with John Singer Sargent’s painting and contemporary photographs. Then Zenzie and the National Trust will decide how far back to take the reconstruction, as some members feel that even the most recent changes are now part of the history of the dress.","foot":false},{"L":null,"t":"The first stages in the actual restoration will involve delicate surface cleaning, using a small vacuum suction device. Once the level of reconstruction has been determined, the original crocheted 2 overdress will be stitched onto a dyed net support before repairs begin. ‘It’s going to be extraordinarily difficult, because the original cloth is quite stretchy, so we’ve deliberately chosen net because that has a certain amount of flexibility in it too,’ says Zenzie. When the dress is displayed, none of our work will be noticeable, but we’ll retain all the evidence on the reverse so that future experts will be able to see exactly what we’ve done – and I’ll produce a detailed report.’","foot":false},{"L":null,"t":"Zenzie has estimated that the project, costing about £30,000, will require more than 700 hours’ work. ‘It will be a huge undertaking and I don’t think the Trust has ever spent quite as much on a costume before,’ she says. ‘But this dress is unique. It’s very unusual to see this level of workmanship on a theatrical costume, and it must have looked spectacular on stage.’ If Terry was alive today, there’s no doubt she would be delighted. Unlike many other actresses, she valued her costumes because she kept and reused them time and time again. ‘I’d like to think she’d see our contribution as part of the ongoing history of the dress,’ says Zenzie.","foot":false},{"L":null,"t":"A conservation organisation whose work includes the funding of projects designed to protect and pre- serve Britain’s cultural heritage Produced using wool and a special needle with a hook at the end adapted from Sussex Life magazine","foot":true}],"groups":[{"a":27,"b":32,"k":"mcq","instr":["Choose the correct letter, A, B, C or D.","Write the correct letter in boxes 27–32 on your answer sheet."],"items":[{"n":27,"t":"What do you learn about Ellen Terry in the first paragraph?","opts":[{"k":"A","t":"Lady Macbeth was her first leading role."},{"k":"B","t":"The Lyceum was her favourite theatre."},{"k":"C","t":"She tried hard to look good on stage."},{"k":"D","t":"She wanted to look young for her audience."}]},{"n":28,"t":"What is the writer’s purpose in paragraph 2?","opts":[{"k":"A","t":"to describe different responses to the Beetlewing dress"},{"k":"B","t":"to explain why the Beetlewing dress had such a big impact"},{"k":"C","t":"to consider the suitability of the Beetlewing dress for the play"},{"k":"D","t":"to compare the look of the Beetlewing dress on and off the stage"}]},{"n":29,"t":"According to the writer, the main effect of the Lyceum productions was to","opts":[{"k":"A","t":"expose more people to Shakespeare’s plays."},{"k":"B","t":"reduce the interest in other types of production."},{"k":"C","t":"raise the cost of going to the theatre."},{"k":"D","t":"encourage writers to produce more plays."}]},{"n":30,"t":"In the fourth paragraph, what comparison does the writer make between Sargent’s portrait and the Beetlewing dress?","opts":[{"k":"A","t":"The dress has attracted more attention than the painting."},{"k":"B","t":"The dress is worth more money than the painting."},{"k":"C","t":"The painting took longer to produce."},{"k":"D","t":"The painting looks newer."}]},{"n":31,"t":"Zenzie says the Beetlewing project is particularly special because","opts":[{"k":"A","t":"the dress is very old."},{"k":"B","t":"people know who wore the dress."},{"k":"C","t":"the dress was designed by someone famous."},{"k":"D","t":"there is evidence that the dress has been used."}]},{"n":32,"t":"Which of the following is the most suitable title for the passage?","opts":[{"k":"A","t":"A lesson from the past"},{"k":"B","t":"A challenging task"},{"k":"C","t":"An unusual fashion show"},{"k":"D","t":"An unexpected discovery"}]}],"opts":[],"ctx":[]},{"a":33,"b":36,"k":"yn","instr":["Do the following statements agree with the views of the writer in the reading passage?","In boxes 33–36 on your answer sheet, write"],"items":[{"n":33,"t":"The National Trust conducted useful research to assist Zenzie’s plans for the dress.","opts":[]},{"n":34,"t":"There will be some discussion over the changes that Zenzie’s team should make to the dress.","opts":[]},{"n":35,"t":"Zenzie’s estimate for the timing of the project is realistic.","opts":[]},{"n":36,"t":"Ellen Terry’s attitude towards her dresses was typical of her time.","opts":[]}],"opts":[],"ctx":[]},{"a":37,"b":40,"k":"match","instr":["Complete each sentence with the correct ending, A–F, below.","Write the correct letter, A–F, in boxes 37–40 on your answer sheet."],"items":[{"n":37,"t":"Pictures will be used","opts":[]},{"n":38,"t":"A special machine will be used","opts":[]},{"n":39,"t":"A net material has been selected","opts":[]},{"n":40,"t":"Work will be visible on one side","opts":[]}],"opts":[{"k":"A","t":"to show how the team did the repairs on the dress."},{"k":"B","t":"to reduce the time taken to repair the dress."},{"k":"C","t":"to remove the dirt from the top layer of the dress."},{"k":"D","t":"to demonstrate the quality of the team’s work on the dress."},{"k":"E","t":"to match a quality of the original fabric used in the dress."},{"k":"F","t":"to help show where the dress needs repair work."}],"ctx":[]}],"ans":{"27":{"raw":"C She tried hard to look good on stage.","v":"C","ex":"What do you learn about Ellen Terry in the first paragraph? Part of the passage: But she didn’t achieve this devotion through her acting ability alone. She knew the power of presentation and carefully cultivated her image. That first night was no exception. When she walked on stage for the famous banqueting scene, her ap- pearance drew a collective gasp from the audience. Answer: C She tried hard to look good on stage."},"28":{"raw":"B to explain why the Beetlewing dress had such a big impact.","v":"B","ex":"What is the writer’s purpose in paragraph 2? Part of the passage: She was dressed in the most extraordinary clothes ever to have graced a British stage: a long, emerald and sea-green gown with tapering sleeves, sur- mounted by a velvet cloak, which glistened and sparkled eerily in the limelight. Yet this was no mere stage trickery. The effect had been achieved using hundreds of wings from beetles. The gown – later named the ‘Beetlewing dress’ – became one of the most iconic and celebrated costumes of the age. Answer: B to explain why the Beetlewing dress had such a big impact."},"29":{"raw":"A expose more people to Shakespeare’s plays.","v":"A","ex":"According to the writer, the main effect of the Lyceum productions was to Part of the passage: Terry was every bit as remarkable as her costumes. At 31, she became a leading lady at the Lyceum Theatre and for two decades, she set about bringing culture to the masses. The productions she worked on were extravagant and daring. Shakespeare’s plays were staged alongside blood-and-thunder melodramas and their texts were ruthlessly cut. Some people were critical, but they missed the point. The innovations sold tickets and brought new audiences to see masterpieces that they would never otherwise have seen. Answer: A expose more people to Shakespeare’s plays."},"30":{"raw":"D The painting looks newer.","v":"D","ex":"In the fourth paragraph, what comparison does the writer make between Sargent’s portrait and the Beetlewing dress? Part of the passage: But while the painting remains almost as fresh as the day it was painted, the years have not been so kind to the dress. Its delicate structure, combined with the cumulative effects of time, has meant it is now in an extremely fragile condition. Answer: D The painting looks newer."},"31":{"raw":"B people know who wore the dress.","v":"B","ex":"Zenzie says the Beetlewing project is particularly special because Part of the passage: Zenzie loves historical dress because of the link with the past. ‘Working on costumes like the Beetlewing dress gives you a real sense of the people who wore them; you can see the sweat stains and wear marks. Answer: B people know who wore the dress."},"32":{"raw":"B A challenging task.","v":"B","ex":"Which of the following is the most suitable title for the passage? Answer: B A challenging task. Explanation: “Best title” questions should be approached after reading the whole passage, but in this particular passage, a student can easily guess the correct answer by carefully reading the subtitle and the last paragraph."},"33":{"raw":"Not Given","v":"NG","ex":"The National Trust conducted useful research to assist Zenzie’s plans for the dress. Meaning: Was the research conducted by the National Trust to assist Zenzie’s plan useful? Answer: Not Given Part of the passage: ...Thus, two years ago, a fundraising project was launched by Britain’s National Trust to pay for its conservation….Before any of Zenzie’s conservation work can begin, she and her team will conduct a thorough investigation to help determine what changes have been made to the dress and when. ...Then Zenzie and the National Trust will decide how far back to take the reconstruction, as some members feel that even the most recent changes are now part of the history of the dress. Explanation: National Trust was mentioned twice, but there is no information on any kind of research they conducted. But the text mentions about Zenzie’s investigation, so some students might think this is false because the research was conducted by Zenzie’s team, not National Trust. It is a wrong approach, both sides could have conducted their own research and just because the text does not talk about National Trust’s research, it does not mean it was not conducted, let alone useful or not."},"34":{"raw":"Yes","v":"Y","ex":"There will be some discussion over the changes that Zenzie’s team should make to the dress. Meaning: Will there be a discussion about the changes that Zenzie’s team should make? Answer: Yes Part of the passage: Then Zenzie and the National Trust will decide how far back to take the reconstruction, as some members feel that even the most recent changes are now part of the history of the dress. Explanation: They will decide about the extent of the change they should make to the dress."},"35":{"raw":"Not Given","v":"NG","ex":"Zenzie’s estimate for the timing of the project is realistic. Meaning: is Zenzie’s estimate for the timing of the project realistic? Answer: Not Given Part of the passage: Zenzie has estimated that the project, costing about £30,000, will require more than 700 hours’ work. ‘It will be a huge undertaking and I don’t think the Trust has ever spent quite as much on a costume before,’ she says. Explanation: The text mentions the amount of time expected to be spent: 700 hours, but does not offer any opinion whether it is realistic or not."},"36":{"raw":"No","v":"N","ex":"Ellen Terry’s attitude towards her dresses was typical of her time. Meaning: Did actresses in her time had the same attitude towards their dresses? Answer: No Part of the passage: Unlike many other actresses, she valued her costumes because she kept and reused them time and time again. ‘I’d like to think she’d see our contribution as part of the ongoing history of the dress,’ says Zenzie. Explanation: Unlike is the key word here, so her attitude was different to that of many actresses at the time."},"37":{"raw":"F to help show where the dress needs repair work.","v":"F","ex":"Pictures will be used Part of the passage: This will involve close examination of the dress for signs of dam- age and wear, and will be aided by comparing it with John Singer Sargent’s painting and contemporary photographs. Answer: F to help show where the dress needs repair work."},"38":{"raw":"C to remove the dirt from the top layer of the dress.","v":"C","ex":"A special machine will be used Part of the passage: The first stages in the actual restoration will involve delicate surface cleaning, using a small vacuum suction device. Answer: C to remove the dirt from the top layer of the dress."},"39":{"raw":"E to match a quality of the original fabric used in the dress.","v":"E","ex":"A net material has been selected Part of the passage: because the original cloth is quite stretchy, so we’ve deliberately chosen net because that has a certain amount of flexibility in it too,’ says Zenzie. Answer: E to match a quality of the original fabric used in the dress."},"40":{"raw":"A to show how the team did the repairs on the dress.","v":"A","ex":"Work will be visible on one side Part of the passage: When the dress is displayed, none of our work will be noticeable, but we’ll retain all the evidence on the reverse so that future experts will be able to see exactly what we’ve done – and I’ll produce a detailed report.’ Answer: A to show how the team did the repairs on the dress."}},"words":[{"w":"Astonishing","pos":"adj","def":"very surprising","lvl":"B2","ex":"Her first love enjoyed an astonishing success","ar":"مذهل"},{"w":"Intricate","pos":"adj","def":"having a lot of small parts or details that are arranged in a complicated way and are therefore sometimes difficult to understand","lvl":"","ex":"The watch mechanism is extremely intricate and very difficult to repair","ar":"معقّد ودقيق"},{"w":"Restore","pos":"v","def":"to return something or someone to an earlier good condition or position","lvl":"B2","ex":"The badly neglected paintings have all been carefully restored","ar":"يرمّم / يعيد"},{"w":"Revival","pos":"n","def":"the process of becoming more active and popular again","lvl":"C2","ex":"Recently, there has been some revival of interest in ancient music","ar":"إحياء"},{"w":"Devotion","pos":"n","def":"loyalty and love or care for someone or something","lvl":"","ex":"He inspired respect and devotion from his pupils","ar":"تفانٍ / إخلاص"},{"w":"Cultivate","pos":"v","def":"to try to develop and improve something","lvl":"C2","ex":"She has cultivated an image as a tough negotiator","ar":"يعتني بتنمية (صورته)"},{"w":"Gasp","pos":"v","def":"to take a short, quick breath through the mouth, especially because of surprise, pain or shock","lvl":"C2","ex":"When she saw the money hidden in the box, she gasped in surprise","ar":"يشهق"},{"w":"Extravagant","pos":"adj","def":"spending too much money, or using too much of something","lvl":"C2","ex":"The extravagant lifestyle of a movie star","ar":"مسرف / مبالغ فيه"},{"w":"Ruthless","pos":"adj","def":"not thinking or worrying about any pain caused to others","lvl":"C2","ex":"Ruthless ambition; a ruthless dictator","ar":"قاسٍ لا يرحم"},{"w":"Immortalize","pos":"v","def":"to make someone or something so famous that they are remembered for a very long time","lvl":"","ex":"Marlene Dietrich was immortalized through her roles in films","ar":"يخلّد"},{"w":"To be kind to something","pos":"adj","def":"not causing harm or damage","lvl":"","ex":"Kind to the environment: This soap is kinder to the skin","ar":"لا يضرّ بـ"},{"w":"Cumulative","pos":"adj","def":"increasing by one addition after another","lvl":"","ex":"The cumulative effect of using so many chemicals on the land could be disastrous","ar":"تراكمي"},{"w":"Fragile","pos":"adj","def":"easily damaged, broken, or harmed","lvl":"C2","ex":"Be careful with that vase – it’s very fragile","ar":"هشّ"},{"w":"Stretch","pos":"v","def":"to spread over a large area or distance","lvl":"C2","ex":"A huge cloud of dense smoke stretched across the horizon","ar":"يمتدّ"},{"w":"Delighted","pos":"adj","def":"very pleased","lvl":"B1","ex":"Pat was delighted with her new flat","ar":"مسرور جدًا"}]},{"n":10,"pp":1,"title":"Movers and Shakers","untitled":false,"intro":null,"paras":[{"L":null,"t":"Discover the stories behind two enthusiastic entrepreneurs who are creating major waves in the UK business world Retailers often declare that customers are their most important asset. But, while some sound as if they are paying lip service to the idea, Sally Bailey, chief executive of White Stuff, is a true believer. Even the clothing retailer’s website reflects her view, declaring: ‘Lovely clothes for lovely people’. Ms Bailey says: ‘The most important people are those who buy our product. This includes the buyers who select it, and the customers who buy it in our shops. Everything we do is about service to get the product into the customer’s hands.’","foot":false},{"L":null,"t":"So, when research revealed that customers disliked changing rooms that opened directly onto the shop floor, White Stuff amended its floor plans, introducing a false wall that screened off the changing area. ‘It’s not rocket science,’ explains Ms Bailey. ‘You just need to listen to what the customer is saying. We are dedicated to pleasing them. We ask: “What is the best thing we could do?”’ Hence, the introduction of one oversized fitting room in each of White Stuff’s 54 stores to enable mothers to bring their buggies in while they change.","foot":false},{"L":null,"t":"‘When a customer walks into a White Stuff shop, we want them to feel like they are at home,’ says Ms Bailey. ‘There are chairs to sit down on, water coolers, and staff will come along with colouring books to entertain children while the customer browses.’ Even the background music is carefully considered. On Saturdays it has a faster tempo. On Sundays, when customers may prefer a quieter atmosphere, the tone is softer. ‘The music is changed by the hour, according to the day,’ says Ms Bailey.","foot":false},{"L":null,"t":"White Stuff has eschewed the shop design of a traditional fashion retailer, preferring to model its interiors on a Victorian house where Ms Bailey believes her customers aspire to live. Since her arrival, White Stuff has sought locations away from the beaten track and shopping centres are viewed as anathema. ‘To be honest, we do have some stores that are very hard to find,’ says Ms Bailey. ‘In Exeter, for example, there’s the High Street and the shopping centre, but you have to turn left down an alley to find White Stuff, right by an organic butcher and coffee shop.’","foot":false},{"L":null,"t":"Yet White Stuff’s customers, whom Ms Bailey describes as ‘extremely loyal’, are not deterred by these intrepid expeditions. When she took over five years ago, White Stuff had 15 stores and an annual turnover of £14m. Today, turnover is in excess of £55m, with stores generating annual revenues between £500,000 and £2.5m from an average customer spend of £35.","foot":false},{"L":null,"t":"Matt Stockdale, managing director of HomePride, which this year will turn over more than £4m, has the mother of former Tesco buyer Fraser McDonald to thank for his success. Desperate to get the supermarket chain to stock his oven cleaning product, Oven Pride, Mr Stockdale bombarded the buyer with calls.","foot":false},{"L":null,"t":"But it was to no avail: ‘The response was always “Thanks but no thanks”,’ he recalls. ‘So I said, “Let me send some to your mother, your aunt, your grandmother…” and, I think to make me go away, he gave me his mother’s address.’ Two weeks later, Mr Stockdale was in the buyer’s office signing a deal to supply his product to 30 stores. ‘He told me that his mother wanted him to give me a chance but that he didn’t give me much hope,’ says Mr Stockdale. A year later he was supplying 130 Tesco stores. ‘I didn’t realise when I first approached Tesco that it was the UK’s biggest supermarket chain,’ says Mr Stockdale. ‘I just knew that I shopped there.’","foot":false},{"L":null,"t":"The idea for the oven cleaner came in 1999 when, after being made redundant from his job as a sales manager for a telecoms business, Mr Stockdale decided to fulfil a lifelong ambition to run his own company. ‘I looked at a catalogue business first because direct sales was what I knew,’ he says. ‘But I came across chemical companies making products, one of which was an oven cleaner. I was always the one lumbered with cleaning our oven, so I was intrigued.’ He tested one product, a bottle of white fluid, which produced such great results that he started to research the oven cleaner marketplace. ‘I found the hardest thing was to clean the racks,’ says Mr Stockdale.","foot":false},{"L":null,"t":"He decided to create kits to make cleaning racks easy, sourcing packaging, disposable gloves and a bag, into which the racks could be placed with he cleaning fluid. ‘I created 5,000 units and sent one each to Kleeneze, Betterware and QVC, and got nowhere,’ he recalls. Dejected, Mr Stockdale found another sales job but, 15 months later, a fax arrived with a purchase order from Kleeneze. ‘I went to the garage and dusted down the stock,’ he says. Kleeneze sold out within weeks, and placed more orders. Then QVC faxed across an order. ‘I was suddenly on national television, but in eight weeks QVC had sold out,’ he says. ‘I didn’t realise what I had.’ It took a letter from a satisfied customer, asking when the cleaner would be available in shops, to prompt Mr Stockdale to change his strategy and approach high street retailers. Enter Tesco.","foot":false},{"L":null,"t":"In its first year, HomePride turned over £90,000 but soon reached £1.1m. ‘Going into retail changed everything for me,’ says Mr. Stockdale.","foot":false}],"groups":[{"a":1,"b":3,"k":"gap","instr":["Label the diagram below.","Choose NO MORE THAN TWO WORDS from the passage for each answer.","Write your answers in boxes 1–3 on your answer sheet."],"items":[],"opts":[],"ctx":["changing rooms (1 oversized, enough space for 1 …………… )","2 …………… for children","background music ( 3 …………… on Saturdays)"],"mode":"diagram","img":"d10","ctitle":"Shop layout"},{"a":4,"b":8,"k":"tf","instr":["Do the following statements agree with the information given in the reading passage?","In boxes 4–8 on your answer sheets, write"],"items":[{"n":4,"t":"Sally Bailey intends to find locations for White Stuff in shopping centres.","opts":[]},{"n":5,"t":"Sally Bailey started White Stuff.","opts":[]},{"n":6,"t":"The buyer at Tesco initially rejected Oven Pride.","opts":[]},{"n":7,"t":"The buyer’s mother often gives him advice on products.","opts":[]},{"n":8,"t":"Matt Stockdale discovered important information about Tesco after contacting the company.","opts":[]}],"opts":[],"ctx":[]},{"a":9,"b":13,"k":"gap","instr":["Complete the flow chart below.","Choose NO MORE THAN TWO WORDS AND/OR A NUMBER from the passage for each answer.","Write your answers in boxes 9–13 on your answer sheet."],"items":[],"opts":[],"ctx":["Matt Stockdale made redundant from job in telecoms","Thought of starting a catalogue business (experience in 9 ……………)","Saw chemical products and became interested in oven cleaners","Tested a white fluid for cleaning ovens and researched the market","Observed that the biggest problem was how to get 10 …………… clean","Made 11 …………… to solve this problem","Sent his product to various companies","First order came after 12 ……………","Product appeared on TV and sold out","A question asked by a 13 …………… gave him the idea of approaching shops"],"mode":"flow","ctitle":"The story of HomePride"}],"ans":{"1":{"raw":"buggies","v":"buggies","ex":"changing rooms (1 oversized enough space for ………….. ) Answer: buggies Part of the passage: one oversized fitting room … to enable mothers to bring their buggies while they change."},"2":{"raw":"colouring books","v":"colouring books","ex":"…………… for children Answer: colouring books Part of the passage: ...and staff will come along with colouring books to entertain children..."},"3":{"raw":"faster (tempo)","v":"faster (tempo)","ex":"background music (................ on Saturdays) Answer: faster (tempo) Part of the passage: Even the background music is carefully considered. On Saturdays it has a faster tempo."},"4":{"raw":"False","v":"F","ex":"Sally Bailey intends to find locations for White Stuff in shopping centres. Meaning: She wants to find locations for her store in shopping centers. Answer: False Part of the passage: White Stuff has eschewed the shop design of a traditional fashion retailer, preferring to model its interiors on a Victorian house where Ms Bailey believes her customers aspire to live. Since her arrival, White Stuff has sought locations away from the beaten track and shopping centres are viewed as anathema. ‘To be honest, we do have some stores that are very hard to find,’ says Ms Bailey. ‘In Exeter, for example, there’s the High Street and the shopping centre, but you have to turn left down an alley to find White Stuff, right by an organic butcher and coffee shop.’"},"5":{"raw":"False","v":"F","ex":"Sally Bailey started White Stuff. Meaning: Did she found/start White Stuff? Answer: False Part of the passage: Yet White Stuff’s customers, whom Ms Bailey describes as ‘ex- tremely loyal’, are not deterred by these intrepid expeditions. When she took over five years ago, White Stuff had 15 stores and an annual turnover of £14m. Today, turnover is in excess of £55m, with stores generating annual revenues between £500,000 and £2.5m from an average customer spend of £35. Explanation: take over = take control from someone (so it is clear that she’s not the founder)"},"6":{"raw":"True","v":"T","ex":"The buyer at Tesco initially rejected Oven Pride. Meaning: Did the buyer at Tesco said no to Oven Pride at the beginning? Answer: True Part of the passage: Matt Stockdale, managing director of HomePride, which this year will turn over more than £4m, has the mother of former Tesco buyer Fraser McDonald to thank for his success. Desperate to get the supermarket chain to stock his oven cleaning product, Oven Pride, Mr Stockdale bombarded the buyer with calls. But it was to no avail: ‘The response was always “Thanks but no thanks”,’ he recalls. Explanation: Mr Stockdale wanted to sell his product, Oven Pride, so he bombarded the buyer at Tesco with class, but to no avail (without success)."},"7":{"raw":"Not Given","v":"NG","ex":"The buyer’s mother often gives him advice on products. Meaning: Does the buyer’s mother often give his son advice on products? Answer: Not Given Part of the passage: I think to make me go away, he gave me his mother’s address.’ Two weeks later, Mr Stockdale was in the buyer’s office signing a deal to supply his product to 30 stores. ‘He told me that his mother wanted him to give me a chance but that he didn’t give me much hope,’ says Mr Stockdale."},"8":{"raw":"True","v":"T","ex":"Matt Stockdale discovered important information about Tesco after contacting the company. Meaning: Did he discover important information about Tesco after contacting the company? Answer: True Part of the passage: A year later he was supplying 130 Tesco stores. ‘I didn’t realise when I first approached Tesco that it was the UK’s biggest supermarket chain,’ says Mr Stockdale. ‘I just knew that I shopped there.’ Explanation: He found out that it was the biggest supermarket chain after approaching (contacting) the company. Before that he just knew he shopped there and nothing else."},"9":{"raw":"direct sales","v":"direct sales","ex":"Thought of starting a catalogue business (experience in ……………) Answer: direct sales Part of the passage: Mr Stockdale decided to fulfil a lifelong ambition to run his own company. ‘I looked at a catalogue business first because direct sales was what I knew,’ he says."},"10":{"raw":"(the) racks","v":"(the) racks","ex":"Observed that the biggest problem was how to get …………… clean Answer: (the) racks Part of the passage: ‘I found the hardest thing was to clean the racks,’ says Mr Stockdale."},"11":{"raw":"kits","v":"kits","ex":"Made …………… to solve this problem Answer: kits Part of the passage: He decided to create kits to make cleaning racks easy"},"12":{"raw":"15 months","v":"15 months","ex":"First order came after …………… Answer: 15 months Part of the passage: Dejected, Mr Stockdale found another sales job but, 15 months later, a fax arrived with a purchase order from Kleeneze.","alts":["15 months","fifteen months"]},"13":{"raw":"(satisfied) customer","v":"(satisfied) customer","ex":"A question asked by a …………… gave him the idea of approaching shops Answer: (satisfied) customer Part of the passage: It took a letter from a satisfied customer, asking when the clean- er would be available in shops, to prompt Mr Stockdale to change his strategy and ap- proach high street retailers. Enter Tesco."}},"words":[{"w":"Enthusiastic","pos":"adj","def":"having a feeling of energetic interest in a particular subject or activity and an eagerness to be involved in it","lvl":"B2","ex":"One of the good things about teaching young children is their enthusiasm","ar":"متحمّس"},{"w":"Declare","pos":"v","def":"to announce something clearly, firmly, publicly, or officially","lvl":"B2","ex":"They declared their support for the proposal","ar":"يعلن"},{"w":"Asset","pos":"n","def":"something valuable belonging to a person or organization that can be used for the payment of debts","lvl":"C1","ex":"A company’s assets can consist of cash, investments, specialist knowledge","ar":"ميزة / أصل قيّم"},{"w":"Lip service","pos":"n","def":"to say you agree with something but do nothing to support it","lvl":"","ex":"She claims to be in favor of training, but so far, she’s only paid lip ser- vice to the idea","ar":"كلام بلا فعل"},{"w":"Amend","pos":"v","def":"to change the words of a text, especially a law or a legal document","lvl":"C2","ex":"MPs were urged to amend the law to prevent another oil tanker disaster","ar":"يعدّل"},{"w":"Eschew","pos":"v","def":"to avoid something intentionally, or to give something up","lvl":"","ex":"We won’t have discussions with this group unless they eschew violence","ar":"يتجنّب"},{"w":"Anathema","pos":"n","def":"something that is strongly disliked or disapproved of","lvl":"","ex":"Credit controls are anathema to the government","ar":"شيء مكروه جدًا"},{"w":"Deter","pos":"v","def":"to prevent someone from doing something or to make someone less enthusiastic about doing something by making it difficult for them to do it","lvl":"","ex":"These measures are designed to deter an enemy attack","ar":"يردع / ينفّر"},{"w":"Intrepid","pos":"adj","def":"extremely brave and showing no fear of dangerous situations","lvl":"","ex":"A team of intrepid explorers","ar":"جريء / مقدام"},{"w":"Desperate","pos":"adj","def":"needing or wanting something very much","lvl":"B2","ex":"They are desperate for help","ar":"يائس / في حاجة ماسّة"},{"w":"Bombard","pos":"v","def":"to direct so many things at someone, especially to ask them so many questions, that they find it difficult to deal with them","lvl":"","ex":"The children bombarded her with questions","ar":"يُمطر بـ (أسئلة/اتصالات)"},{"w":"Avail","pos":"n","def":"use, purpose, advantage or profit","lvl":"","ex":"We tried to persuade her not to resign, but to no avail (did not succeed)","ar":"فائدة (to no avail = بلا جدوى)"},{"w":"Redundant","pos":"adj","def":"having lost your job because your employer no longer needs you","lvl":"B2","ex":"To keep the company alive, half the workforce is being made redundant","ar":"مُسرَّح من العمل"},{"w":"Lifelong","pos":"adj","def":"lasting for the whole of a person’s life","lvl":"C2","ex":"She was a lifelong member of the Labor party","ar":"مدى الحياة"},{"w":"Ambition","pos":"n","def":"a strong wish to achieve something","lvl":"B1","ex":"His ambition ultimately to run his own business","ar":"طموح"},{"w":"Lumbered with","pos":"","def":"if you get lumbered with something, you have to deal with something or someone that you do not want to","lvl":"","ex":"I always seem to get lumbered with the job of cleaning up after a party","ar":"مُثقَل بـ"},{"w":"Disposable","pos":"adj","def":"describes a product that is intended to be thrown away after use","lvl":"C2","ex":"disposable nappies; a disposable camera","ar":"يُستعمل مرة واحدة"}]},{"n":11,"pp":2,"title":"Establishing your birthrights","untitled":false,"intro":"Position in the family can play a huge role in shaping character, finds Clover Stroud","paras":[{"L":"A","t":"Last week I was given a potent reminder of how powerful birth order might be in determining a child’s character. My son, Jimmy Joe, nine, and my daughter, Dolly, six, were re-enacting a TV talent show. Jimmy Joe elected himself judge and Dolly was a contestant. Authoritative and unyielding, he wielded a clipboard, delivering harsh criticisms that would make a real talent show judge flinch. Initially Dolly loved the attention, but she soon grew tired of his dominance, instigating a pillow fight, then a fist fight. It ended, inevitably, in tears. A visiting friend, with an older, more successful sister, declared it ‘classic first child behaviour of dominance and supposed authority’. Dolly’s objection to her brother’s self-appointed role as leader was justified, he announced, while Jimmy Joe’s superiority was characteristic of the forceful personality of firstborns. Birth order, he said, wasn’t something they could just shrug off.","foot":false},{"L":"B","t":"Debate about the significance of birth order goes right to the heart of the nature versus nurture argument and is, consequently, surrounded by huge controversy. This controversy has raged since the 19th century, when Austrian psychiatrist Alfred Adler argued that birth order can define the way someone deals with life. He identified firstborns as driven and often suffering from a sense of having been ‘dethroned’ by a second child. Younger children, he stated, were hampered by having been more pampered than older siblings. It’s a view reiterated by Professor Frank Sulloway’s influential work, Born to Rebel. Sulloway, a leading proponent of the birth order idea, argued it has a definitive effect on the ‘Big Five’ personality traits of openness, conscientiousness, extroversion, agreeableness and neuroticism.","foot":false},{"L":"C","t":"According to the birth-order theory, first children are usually well-organised high achievers. However, they can have an overdeveloped sense of entitlement and be unyielding. Second children are sometimes very competitive through rivalry with the older sibling. They’re also good mediators and negotiators, keen to keep everyone happy. Middle children, tagged the ‘easy’ ones, have good diplomacy skills. They suffer from a tendency to feel insignificant beside other siblings and often complain of feeling invisible to their parents. Youngest children are often the most likely to rebel, feeling the need to ‘prove’ themselves. They’re often extroverts and are sometimes accused of being selfish. Twins inevitably find it harder to see themselves as individuals, unless their parents have worked hard to identify them as such. It’s not unusual for one twin to have a slightly dominant role over the other and take the lead role.","foot":false},{"L":"D","t":"But slapping generalised labels on a child is dangerous; they change all the time, often taking turns at being the ‘naughty one’ or the ‘diligent one’. However, as one of five children, I know how hard it is to transcend the tags you earn according to when you were born. It is unsurprising then that my eldest sister is the successful entrepreneur, and that, despite covering all the big bases of adult life like marriage, kids and property, my siblings will probably always regard me as their spoilt younger sister.","foot":false},{"L":"E","t":"‘As the oldest of three, I’ve found it hard not to think of my own three children as having the same personality types that the three of us had when I was growing up,’ says Lisa Cannan, a teacher. ‘I identify with my eldest son, who constantly takes the lead in terms of organisation and responsibility. My daughter, the middle child, is more cerebral than her brothers. She’s been easier than them. She avoids confrontation, so has an easy relationship with both boys. My youngest is gorgeous but naughty. I know I’m partly to blame for this, as I forgive him things the elder two wouldn’t get away with.’","foot":false},{"L":"F","t":"As a parent, it’s easy to feel guilty about saddling a child with labels according to birth order, but as child psychologist Stephen Bayliss points out, these characteristics might be better attributed to parenting styles, rather than a child’s character. He says that if a parent is worried about having encouraged, for example, an overdeveloped sense of dominance in an older sibling or spoiled a younger child, then it’s more useful to look at ways this can be addressed than over-analysing why it happened. Bayliss is optimistic that as adults we can overcome any negative connotations around birth order. ‘Look at the way you react to certain situations with your siblings. If you’re unhappy about being treated as a certain type of personality, try to work out if it’s a role that you’ve willingly accepted. If you’re unhappy with the role, being dynamic about focusing on your own reactions, rather than blaming theirs, will help you overcome it. Change isn’t easy but nobody need be the victim of their biography.’","foot":false}],"groups":[{"a":14,"b":19,"k":"head","instr":["The reading passage has six paragraphs, A–F.","Choose the correct heading for each paragraph from the list of headings below.","Write the correct number, i–ix, in boxes 14–19 on your answer sheet."],"items":[{"n":14,"t":"Paragraph A","opts":[]},{"n":15,"t":"Paragraph B","opts":[]},{"n":16,"t":"Paragraph C","opts":[]},{"n":17,"t":"Paragraph D","opts":[]},{"n":18,"t":"Paragraph E","opts":[]},{"n":19,"t":"Paragraph F","opts":[]}],"opts":[{"k":"i","t":"Children’s views on birth order"},{"k":"ii","t":"Solutions are more important than causes"},{"k":"iii","t":"Characteristics common to all children regardless of birth order"},{"k":"iv","t":"Doubts about birth-order theory but personal experience supporting it"},{"k":"v","t":"A theory that is still supported"},{"k":"vi","t":"Birth-order characteristics continuing as children get older"},{"k":"vii","t":"A typical example of birth-order behaviour in practice"},{"k":"viii","t":"Exceptions to the rule of birth order"},{"k":"ix","t":"A detailed description of each child in families in general"}],"ctx":[],"optTitle rank Sulloway Part of the passage [Par B]: Sulloway, a leading proponent of the birth order idea, argued it has a definitive effect on the ‘Big Five’ personality traits of openness, consci- entiousness, extroversion, agreeableness and neuroticism."},"23":{"raw":"D Stephen Bayliss","v":"D","ex":"It is possible for people to stop feeling bad about how family members behave with them. Answer: D Stephen Bayliss Part of the passage [Par F]: Bayliss is optimistic that as adults we can overcome any negative connotations around birth order. ‘Look at the way you react to certain situations with your siblings. If you’re unhappy about being treated as a certain type of personality, try to work out if it’s a role that you’ve willingly accepted. If you’re unhappy with the role, being dynamic about focusing on your own reactions, rather than blaming theirs, will help you overcome it. Change isn’t easy but nobody need be the victim of their biography.’"},"24":{"raw":"entitlement","v":"entitlement","ex":"First-born children have expectations that are too high with regard to……… . Answer: entitlement Part of the passage [Par C]: According to the birth-order theory, first children are usually well-organised high achievers. However, they can have an overdeveloped sense of entitlement and be unyielding."},"25":{"raw":"easy","v":"easy","ex":"Middle children are often considered …………… by their parents. Answer: easy Part of the passage [Par C]: Middle children, tagged the ‘easy’ ones, have good diplomacy skills."},"26":{"raw":"selfish","v":"selfish","ex":"Youngest children may be described as …………… by other people. Answer: selfish Part of the passage [Par C]: Youngest children are often the most likely to rebel, feeling the need to ‘prove’ themselves. They’re often extroverts and are sometimes accused of being selfish."}},"words":[{"w":"Re-enact","pos":"v","def":"if you re-enact an event, you try to make it happen again in exactly the same way that it happened first time, often as an enter
