"k":"D","t":"increasing the size of many farms"},{"k":"E","t":"placing less reliance on honeybees"}],"ctx":[],"count":2,"q":"mentioned in the article? Which TWO methods of combating the problems caused by CCD and habitat loss are"}],"ans":{"14":{"raw":"V An impossible task for any human","v":"v","ex":"Section A Answer: V An impossible task for any human Part of the passage: Row upon row, tomato plants stand in formation inside a green- house. To reproduce, most flowering plants depend on a third party to transfer pollen between their male and female parts. Some require extra encouragement to give up that golden dust. The tomato flower, for example, needs a violent shake, a vibration roughly equivalent to 30 times the pull of Earth’s gravity, explains Arizona entomologist Stephen Buchmann. Growers have tried numerous ways to rattle pollen from tomato blossoms. They have used shaking tables, air blowers and blasts of sound. But natural means seem to work better."},"15":{"raw":"VIII Some obvious and less obvious pollen carriers","v":"viii","ex":"Section B Answer: VIII Some obvious and less obvious pollen carriers Part of the passage: It is no surprise that nature’s design works best. What’s aston- ishing is the array of workers that do it: more than 200,000 individual animal species, by varying strategies, help the world’s 240,000 species of flowering plants make more flowers. Flies and beetles are the original pollinators, going back to when flowering plants first appeared 130 million years ago. As for bees, scientists have identified some 20,000 distinct species so far. Hummingbirds, butterflies, moths, wasps and ants are also up to the job. Even non-flying mammals do their part: sugar-loving opossums, some rainforest monkeys, and lemurs in Madagascar, all with nimble hands that tear open flower stalks and furry coats to which pollen sticks. Most surprising, some lizards, such as geckos, lap up nectar and pollen and then transport the stuff on their faces and feet as they forage onward."},"16":{"raw":"VI The preferred pollinator","v":"vi","ex":"Section C Answer: VI The preferred pollinator Part of the passage: All that messy diversity, unfortunately, is not well suited to the mono- crops and mega-yields of modern commercial farmers. Before farms got so big, says conservation biologist Claire Kremen of the University of California, Berkeley, ‘we didn’t have to manage pollinators. They were all around because of the diverse landscapes. Now you need to bring in an army to get pollination done.’ The European honeybee was first imported to the US some 400 years ago. Now at least a hundred commercial crops rely almost entirely on managed honeybees, which beekeepers raise and rent out to tend to big farms. And although other species of bees are five to ten times more efficient, on a per-bee basis, at pollinating certain fruits, honeybees have bigger colonies, cover longer distances, and tolerate management and movement better than most insects. They’re not picky – they’ll spend their time on almost any crop. It’s tricky to calculate what their work is truly worth; some economists put it at more than $200 billion globally a year."},"17":{"raw":"X An unexpected setback","v":"x","ex":"Section D Answer: X An unexpected setback Part of the passage: Industrial-scale farming, however, may be wearing down the sys- tem. Honeybees have suffered diseases and parasite infestations for as long as they’ve been managed, but in 2006 came an extreme blow. Around the world, bees began to disappear over the winter in massive numbers. Beekeepers would lift the lid of a hive and be amazed to find only the queen and a few stragglers, the worker bees gone. In the US, a third to half of all hives crashed; some beekeepers reported colony losses near 90 per- cent. The mysterious culprit was named colony collapse disorder (CCD) and it remains an annual menace – and an enigma."},"18":{"raw":"I Looking for clues","v":"i","ex":"Section E Answer: I Looking for clues Part of the passage: When it first hit, many people, from agronomists to the public, assumed that our slathering of chemicals on agricultural fields was to blame for the mystery. Indeed, says Jeff Pettis of the USDA Bee Research Laboratory, ‘we do find more disease in bees that have been exposed to pesticides, even at low levels.’ But it is likely that CCD involves multiple stressors. Poor nutrition and chemical exposure, for instance, might wear down a bee’s immunities before a virus finishes the insect off. It’s hard to tease apart factors and outcomes, Pettis says. New studies reveal that fun- gicides – not previously thought toxic to bees – can interfere with microbes that break down pollen in the insects’ guts, affecting nutrient absorption and thus long-term health and longevity. Some findings pointed to viral and fungal pathogens working together. ‘I only wish we had a single agent causing all the declines,’ Pettis says, ‘that would make our work much easier.’"},"19":{"raw":"III Solutions to a more troublesome issue","v":"iii","ex":"Section F Answer: III Solutions to a more troublesome issue Part of the passage: However, habitat loss and alteration, he says, are even more of a menace to pollinators than pathogens. Claire Kremen encourages farmers to cultivate the flora surrounding farmland to help solve habitat problems. ‘You can’t move the farm,’ she says, ‘but you can diversify what grows in its vicinity: along roads, even in tractor yards.’ Planting hedgerows and patches of native flowers that bloom at different times and seeding fields with multiple plant species rather than monocrops ‘not only is better for native pollinators, but it’s just better agriculture,’ she says. Pesticide-free wildflower havens, adds Buchmann, would also bolster populations of useful insects. Fortunately, too, ‘there are far more generalist plants than specialist plants, so there’s a lot of redun- dancy in pollination,’ Buchmann says. ‘Even if one pollinator drops out, there are often pretty good surrogates left to do the job.’ The key to keeping our gardens growing strong, he says, is letting that diversity thrive."},"20":{"raw":"IX The undesirable alternative","v":"ix","ex":"Section G Answer: IX The undesirable alternative Part of the passage: Take away that variety, and we’ll lose more than honey. ‘We wouldn’t starve,’ says Kremen. ‘But what we eat, and even what we wear – pollinators, after all, give us some of our cotton and flax – would be limited to crops whose pollen travels by other means. ‘In a sense,’ she says, ‘our lives would be dictated by the wind.’ It’s vital that we give pollinators more of what they need and less of what they don’t, and ease the burden on managed bees by letting native animals do their part, say scientists."},"21":{"raw":"flies and beetles","v":"flies and beetles","ex":"Both …………… were the first creatures to pollinate the world’s plants. Answer: flies and beetles Part of the passage [Par B]: Flies and beetles are the original pollinators, going back to when flowering plants first appeared 130 million years ago."},"22":{"raw":"furry coats","v":"furry coats","ex":"Monkeys transport pollen on their …………… . Answer: furry coats Part of the passage [Par B]: even non-flying mammals do their part: sugar-loving opossums, some rainforest monkeys, and lemurs in Madagascar, all with nimble hands that tear open flower stalks and furry coats to which pollen sticks."},"23":{"raw":"longer distances","v":"longer distances","ex":"Honeybees are favored pollinators among bee species partly because they travel ………… . Answer: longer distances Part of the passage [Par C]: honeybees have bigger colonies, cover longer distances"},"24":{"raw":"worker bees","v":"worker bees","ex":"A feature of CCD is often the loss of all the …………… . Answer: worker bees Part of the passage [Par D]: Beekeepers would lift the lid of a hive and be amazed to find only the queen and a few stragglers, the worker bees gone (= disappeared)"},"25":{"raw":"C cultivating a wide range of flowering plants","v":"C","ex":"Answer: C cultivating a wide range of flowering plants Why is C correct? Part of the passage [Par F]: encourages farmers to cultivate the flora surrounding farmland to help solve habitat problems. Answer: E placing less reliance on honeybees Why is E correct? Part of the passage [Par G]: and ease the burden on managed bees by letting native animals do their part, say scientists.","set":["C","E"]},"26":{"raw":"E placing less reliance on honeybees","v":"E","ex":"Answer: C cultivating a wide range of flowering plants Why is C correct? Part of the passage [Par F]: encourages farmers to cultivate the flora surrounding farmland to help solve habitat problems. Answer: E placing less reliance on honeybees Why is E correct? Part of the passage [Par G]: and ease the burden on managed bees by letting native animals do their part, say scientists.","set":["C","E"]}},"words":[{"w":"Forage","pos":"v","def":"to go from one place searching, especially for food","lvl":"","ex":"The children had been living on the streets, foraging for scraps and sleeping rough","ar":"يبحث عن الطعام"},{"w":"To do one’s part","pos":"v","def":"to do what one is responsible for doing or is able to do","lvl":"","ex":"I have done my part, and now it is time for him to do his","ar":"يقوم بدوره"},{"w":"Messy","pos":"adj","def":"describes a situation that is confusing and unpleasant","lvl":"","ex":"A war will be a long and messy business","ar":"فوضوي / معقّد"},{"w":"Picky","pos":"adj","def":"describes someone who is very careful about choosing only what they like","lvl":"","ex":"The children are such picky eaters","ar":"انتقائي / صعب الإرضاء"},{"w":"Wear down","pos":"v","def":"to make something gradually disappear or become thinner by using or rubbing it","lvl":"","ex":"The old stone steps had been worn down by years of use","ar":"يُضعف / يستنزف تدريجيًا"},{"w":"Menace","pos":"n","def":"something that is likely to cause harm","lvl":"","ex":"Drunk drivers are a menace to everyone","ar":"تهديد / خطر"},{"w":"Slather","pos":"v","def":"to spread something thickly on something else","lvl":"","ex":"She slathered lotion on her body","ar":"يدهن بكثافة"},{"w":"In the vicinity of","pos":"n","def":"approximately","lvl":"","ex":"The team is believed to have paid in the vicinity of 3 million dollars for Domingo","ar":"في حدود / تقريبًا"},{"w":"Redundancy","pos":"n","def":"a situation in which something is unnecessary because it is more than needed","lvl":"","ex":"The aircraft has seven computer systems running in parallel, so as to provide enough redundancy to cope with computer breakdowns","ar":"عدم الحاجة / زيادة عن اللزوم"},{"w":"Starve","pos":"v","def":"to cause someone to become very weak or die because there is not enough food to eat","lvl":"C1","ex":"Whole communities starved to death during the long drought","ar":"يتضوّر جوعًا / يُجوّع"},{"w":"Burden","pos":"n","def":"something difficult or unpleasant that you have to deal with or worry about","lvl":"C1","ex":"My elderly mother worries that she’s a burden to me","ar":"عبء"}]},{"n":21,"pp":3,"title":"The Earth and Space Foundation","untitled":false,"intro":null,"paras":[{"L":null,"t":"The community that focuses its efforts on the exploration of space has largely been different from the community focused on the study and protection of the Earth’s environment, despite the fact that both fields of interest involve what might be referred to as ‘scientific exploration’. The reason for this dichotomous existence is chiefly historical. The exploration of the Earth has been occurring over many centuries, and the institutions created to do it are often very different from those founded in the second part of the 20th century to explore space. This separation is also caused by the fact that space exploration has attracted experts from mainly non-biological disciplines – primarily engineers and physicists – but the study of Earth and its environment is a domain heavily populated by biologists.","foot":false},{"L":null,"t":"The separation between the two communities is often reflected in attitudes. In the environmental community, it is not uncommon for space exploration to be regarded as a waste of money, distracting governments from solving major environmental problems here at home. In the space exploration community, it is not uncommon for environmentalists to be regarded as introspective people who divert attention from the more expansive visions of the exploration of space – the ‘new frontier’. These perceptions can also be negative in consequence because the full potential of both communities can be realised better when they work together to solve problems. For example, those involved in space exploration can provide the satellites to monitor the Earth’s fragile environments, and environmentalists can provide information on the survival of life in extreme environments.","foot":false},{"L":null,"t":"In the sense that Earth and space exploration both stem from the same human drive to understand our environment and our place within it, there is no reason for the split to exist. A more accurate view of Earth and space exploration is to see them as a continuum of exploration with many interconnected and mutually beneficial links. The Earth and Space Foundation, a registered charity, was established for the purposes of fostering such links through field research and by direct practical action.","foot":false},{"L":null,"t":"Projects that have been supported by the Foundation include environmental projects using technologies resulting from space exploration: satellite communications, GPS, remote sensing, advanced materials and power sources. For example, in places where people are faced with destruction of the forests on which their livelihood depends, rather than rejecting economic progress and trying to save the forests on their intrinsic merit, another approach is to enhance the value of the forests – although these schemes must be carefully assessed to be successful. In the past, the Foundation provided a grant to a group of expeditions that used remote sensing to plan eco-tourism routes in the forests of Guatemala, thus providing capital to the local communities through the tourist trade. This novel approach is now making the protection of the forests a sensible economic decision.","foot":false},{"L":null,"t":"The Foundation funds expeditions making astronomical observations from remote, difficult-to-access Earth locations, archaeological field projects studying the development of early civilisations that made significant contributions to astronomy and space sciences, and field expeditions studying the way in which views of the astronomical environment shaped the nature of past civilisations. A part of Syria – ‘the Fertile Crescent’ – was the birthplace of astronomy, accountancy, animal domestication and many other fundamental developments of human civilisation. The Foundation helped fund a large archaeology project by the Society for Syrian Archaeology at the University of California, Los Angeles, in collaboration with the Syrian government that used GPS and satellite imagery to locate mounds or ’tels’, containing artefacts and remnants of early civilisations. These collections are being used to build a better picture of the nature of the civilisations that gave birth to astronomy.","foot":false},{"L":null,"t":"Field research also applies the Earth’s environmental and biological resources to the human exploration and settlement of space. This may include the use of remote environments on Earth, as well as physiological and psychological studies in harsh environments. In one research project, the Foundation provided a grant to an international caving expedition to study the psychology of explorers subjected to long- term isolation in caves in Mexico. The psychometric tests on the cavers were used to enhance US astronaut selection criteria by the NASA Johnson Space Center.","foot":false},{"L":null,"t":"Space-like environments on Earth help us understand how to operate in the space environment or help us characterise extraterrestrial environments for future scientific research. In the Arctic, a 24-kilometre-wide impact crater formed by an asteroid or comet 23 million years ago has become home to a Mars analogue programme. The Foundation helped fund the NASA Haughton–Mars Project to use this crater to test communications and exploration technologies in preparation for the human exploration of Mars.The crater, which sits in high Arctic permafrost, provides an excellent replica of the physical processes occurring on Mars, a permafrosted, impact-altered planet. Geologists and biologists can work at the site to help understand how impact craters shape the geological characteristics and possibly biological potential of Mars.","foot":false},{"L":null,"t":"In addition to its fieldwork and scientific activities, the Foundation has award programmes. These include a series of awards for the future human exploration of Mars, a location with a diverse set of exploration challenges. The awards will honour a number of ‘firsts’ on Mars that include landing on the surface, undertaking an overland expedition to the Martian South Pole, undertaking an overland expedition to the Martian North Pole, climbing Olympus Mons, the highest mountain in the solar system, and descending to the bottom of Valles Marineris, the deepest canyon on Mars. The Foundation will offer awards for expeditions further out in the solar system once these Mars awards have been claimed. Together, they demonstrate that the programme really has no boundary in what it could eventually support, and they provide longevity for the objectives of the Foundation.","foot":false}],"groups":[{"a":27,"b":31,"k":"yn","instr":["Do the following statements agree with the views of the writer in the reading passage?","In boxes 27–31 on your answer sheet, write"],"items":[{"n":27,"t":"Activities related to environmental protection and space exploration have a common theme.","opts":[]},{"n":28,"t":"It is unclear why space exploration evolved in a different way from environmental studies on Earth.","opts":[]},{"n":29,"t":"Governments tend to allocate more money to environmental projects than space exploration.","opts":[]},{"n":30,"t":"Unfortunately, the environmental and space exploration communities have little to offer each other in terms of resources.","opts":[]},{"n":31,"t":"The Earth and Space Foundation was set up later than it was originally intended.","opts":[]}],"opts":[],"ctx":[]},{"a":32,"b":35,"k":"mcq","instr":["Choose the correct letter, A, B, C or D.","Write the correct letter in boxes 32–35 on your answer sheet."],"items":[{"n":32,"t":"What was the significance of the ’novel approach’ adopted in the Guatemala project?","opts":[{"k":"A","t":"It minimised the need to protect the forests."},{"k":"B","t":"It reduced the impact of tourists on the forests."},{"k":"C","t":"It showed that preserving the forests can be profitable."},{"k":"D","t":"It gave the Foundation greater control over the forests."}]},{"n":33,"t":"GPS and satellite imagery were used in the Syrian project to","opts":[{"k":"A","t":"help archaeologists find ancient items."},{"k":"B","t":"explore land that is hard to reach."},{"k":"C","t":"reduce the impact of archaeological activity."},{"k":"D","t":"evaluate some early astronomical theories."}]},{"n":34,"t":"One of the purposes of the Foundation’s awards is to","opts":[{"k":"A","t":"attract non-scientists to its work."},{"k":"B","t":"establish priorities for Mars exploration."},{"k":"C","t":"offer financial incentives for space exploration."},{"k":"D","t":"establish the long-term continuity of its activities."}]},{"n":35,"t":"What is the writer’s purpose in the passage?","opts":[{"k":"A","t":"to persuade people to support the Foundation"},{"k":"B","t":"to explain the nature of the Foundation’s work"},{"k":"C","t":"to show how views on the Foundation have changed"},{"k":"D","t":"to reject earlier criticisms of the Foundation’s work"}]}],"opts":[],"ctx":[]},{"a":36,"b":40,"k":"match","instr":["Complete the summary using the words, A–I, below.","Write the correct letter, A–I, in boxes 36–40 on your answer sheet."],"items":[],"opts":[{"k":"A","t":"comparable"},{"k":"D","t":"ideal"},{"k":"G","t":"scientific"},{"k":"B","t":"extreme"},{"k":"E","t":"unexpected"},{"k":"H","t":"extended"},{"k":"C","t":"connected"},{"k":"F","t":"beneficial"},{"k":"I","t":"individual"}],"ctx":["Some studies have looked at how humans function in 36 …………… situations. In one project, it was decided to review cave explorers in Mexico who tolerate 37 …………… periods on their own. It is also possible to prepare for space exploration by studying environments on Earth that are 38 …………… to those on Mars. A huge crater in the Arctic is the 39 …………… place to test the technologies needed to explore Mars and gather other relevant 40 …………… information."],"mode":"sum","ctitle":"Field research: Applying the Earth’s environment to the settlement of space"}],"ans":{"27":{"raw":"Yes","v":"Y","ex":"Activities related to environmental protection and space exploration have a common theme. Answer: Yes Part of the passage: The community that focuses its efforts on the exploration of space has largely been different from the community focused on the study and protection of the Earth’s environment, despite the fact that both fields of interest involve what might be referred to as ‘scientific exploration’."},"28":{"raw":"No","v":"N","ex":"It is unclear why space exploration evolved in a different way from environ- mental studies on Earth. Answer: No Part of the passage: The reason for this dichotomous existence is chiefly historical. The exploration of the Earth has been occurring over many centuries, and the institutions created to do it are often very different from those founded in the second part of the 20th century to explore space. This separation is also caused by the fact that space explo- ration has attracted experts from mainly non-biological disciplines – primarily engineers and physicists – but the study of Earth and its environment is a domain heavily populated by biologists."},"29":{"raw":"Not Given","v":"NG","ex":"Governments tend to allocate more money to environmental projects than space exploration. Answer: Not Given Part of the passage: In the environmental community, it is not uncommon for space exploration to be regarded as a waste of money, distracting governments from solving major environmental problems here at home. In the space exploration community, it is not uncommon for environmentalists to be regarded as introspective people who divert attention from the more expansive visions of the exploration of space – the ‘new frontier’. Explanation: The passage does not compare the allocated budget"},"30":{"raw":"No","v":"N","ex":"Unfortunately, the environmental and space exploration communities have little to offer each other in terms of resources. Answer: No Part of the passage: These perceptions can also be negative in consequence because the full potential of both communities can be realised better when they work together to solve problems. For example, those involved in space exploration can provide the satellites to monitor the Earth’s fragile environments, and environmentalists can provide information on the survival of life in extreme environments."},"31":{"raw":"Not Given","v":"NG","ex":"The Earth and Space Foundation was set up later than it was originally intended. Answer: Not Given Part of the passage: The Earth and Space Foundation, a registered charity, was established for the purposes of fostering such links through field research and by direct practical action. Explanation: No mention of original intended date"},"32":{"raw":"C It showed that preserving the forests can be profitable.","v":"C","ex":"What was the significance of the ’novel approach’ adopted in the Guatemala project? Answer: C It showed that preserving the forests can be profitable. Part of the passage: …the Foundation provided a grant to a group of expeditions that used remote sensing to plan eco-tourism routes in the forests of Guatemala, thus pro- viding capital to the local communities through the tourist trade. This novel approach is now making the protection of the forests a sensible economic decision."},"33":{"raw":"A help archaeologists find ancient items.","v":"A","ex":"GPS and satellite imagery were used in the Syrian project to Answer: A help archaeologists find ancient items. Part of the passage: A part of Syria – ‘the Fertile Crescent’ – was the birthplace of astronomy, accountancy, animal domestication and many other fundamental develop- ments of human civilisation. The Foundation helped fund a large archaeology project by the Society for Syrian Archaeology at the University of California, Los Angeles, in collaboration with the Syrian government that used GPS and satellite imagery to locate mounds or ’tels’, containing artefacts and remnants of early civilisations. These collec- tions are being used to build a better picture of the nature of the civilisations that gave birth to astronomy."},"34":{"raw":"D establish the long-term continuity of its activities.","v":"D","ex":"One of the purposes of the Foundation’s awards is to Answer: D establish the long-term continuity of its activities. Part of the passage: The Foundation will offer awards for expeditions further out in the solar system once these Mars awards have been claimed. Together, they demonstrate that the programme really has no boundary in what it could eventually support, and they provide longevity for the objectives of the Foundation."},"35":{"raw":"B to explain the nature of the Foundation’s work","v":"B","ex":"What is the writer’s purpose in the passage? Answer: B to explain the nature of the Foundation’s work Explanation: POE (Process of Elimination) It becomes clearer when you fully under- stand the passage that the author is not trying to persuade people to support the Foun- dation (A), nor wants to show views on the Foundation have changed (C). Finally, the text does not talk about any criticism of the Foundation’s work, and surely the author is not rejecting those early criticisms (D)."},"36":{"raw":"B extreme","v":"B","ex":"Some studies have looked at how humans function in …………… situations. Answer: B extreme Part of the passage: This may include the use of remote environments on Earth, as well as physiological and psychological studies in harsh environments."},"37":{"raw":"H extended","v":"H","ex":"In one project, it was decided to review cave explorers in Mexico who tolerate …………… periods on their own. Answer: H extended Part of the passage: In one research project, the Foundation provided a grant to an international caving expedition to study the psychology of explorers subjected to long-term isolation in caves in Mexico. The psychometric tests on the cavers were used to enhance US astronaut selection criteria by the NASA Johnson Space Center."},"38":{"raw":"A comparable","v":"A","ex":"It is also possible to prepare for space exploration by studying environments on Earth that are …………… to those on Mars. Answer: A comparable Part of the passage: Space-like environments on Earth help us understand how to operate in the space environment or help us characterise extraterrestrial environments for future scientific research."},"39":{"raw":"D ideal","v":"D","ex":"A huge crater in the Arctic is the …………… place to test the technologies needed to explore Mars… Answer: D ideal Part of the passage: The Foundation helped fund the NASA Haughton–Mars Project to use this crater to test communications and exploration technologies in preparation for the human exploration of Mars. The crater, which sits in high Arctic permafrost, provides an excellent replica of the physical processes occurring on Mars, a permafrosted, impact-al- tered planet."},"40":{"raw":"G scientific","v":"G","ex":"and gather other relevant …………… information. Answer: G scientific Part of the passage: Geologists and biologists can work at the site to help understand how impact craters shape the geological characteristics and possibly biological potential of Mars."}},"words":[{"w":"Chiefly","pos":"adv","def":"mainly","lvl":"","ex":"The island chiefly attracts upmarket tourists","ar":"أساسًا / غالبًا"},{"w":"Divert","pos":"v","def":"to cause someone or something to change direction","lvl":"C2","ex":"Traffic will be diverted through the side streets while the main road is resurfaced","ar":"يحوّل"},{"w":"Stem from","pos":"v","def":"to start to develop as a result of something","lvl":"C1","ex":"Her problems stem from difficult childhood","ar":"ينبع من"},{"w":"Split","pos":"v","def":"to divide into two or more parts, especially along a particular line","lvl":"B2","ex":"The prize was split between Susan and Kate","ar":"ينقسم / يفصل"},{"w":"Foster","pos":"v","def":"to encourage the development or growth of ideas or feelings","lvl":"","ex":"I am trying to foster an interest in classical music in my children","ar":"يعزّز / ينمّي"},{"w":"Remnant","pos":"n","def":"small piece or amount of something that is left a larger original piece or amount","lvl":"","ex":"The remnants of last night’s meal","ar":"بقايا"},{"w":"Extraterrestrial","pos":"adj","def":"coming from outside the planet Earth","lvl":"","ex":"Extraterrestrial beings","ar":"من خارج الأرض"}]},{"n":22,"pp":1,"title":"The environmental impact of the clothing industry","untitled":false,"intro":null,"paras":[{"L":null,"t":"On a Saturday afternoon, a group of teenage girls leaf through glossy fashion magazines at an American shopping mall. Their shopping bags are brimming with new purchases as they walk excitedly about what’s in style this summer. Far away in Tanzania, a young man wears a T-shirt bearing the logo of an American basketball team while shopping at the local second-hand goods market. Although seemingly disparate, these two scenes are connected through the surprising life cycle of clothing. How does a T-shirt sold in a US shopping mall to promote an American sports team end up being worn by a teenager in Africa?","foot":false},{"L":null,"t":"Globalisation, consumerism, and recycling all converge to connect these scenes. Globalisation has made it possible to produce clothing at increasingly lower prices, prices so low that many consumers consider this clothing to be disposable. Some call it ‘fast fashion’, the clothing equivalent of fast food. Fuelling the demand are fashion magazines that help create the desire for new ‘must-have’ for each season. ‘Girls especially are insatiable when it comes to fashion. They have to have the latest thing,’ says Mayra Diaz, mother of a 10-year-old girl.","foot":false},{"L":null,"t":"Yet fast fashion leaves a pollution footprint, generating both environmental and occupational hazards. For example, polyester, the most widely used manufactured fibre, is made from petroleum. With the rise in production in the fashion industry, demand for man-made fibres has nearly doubled in the last 15 years. The manufacture of polyester and other synthetic fabrics is an energy-intensive process requiring large amounts of crude oil and releasing emissions which can cause or aggravate respiratory disease.The Environmental Protection Agency (EPA) considers many textile manufacturing facilities to be hazardous waste generators.","foot":false},{"L":null,"t":"These issues do not apply only to the production of man-made fabrics. Cotton, one of the most popular fibres used in clothing manufacture, also has a significant environmental footprint. This crop accounts for a quarter of all the pesticides used in the United States. Much of the cotton produced in the United States is exported to China and other countries with low labour costs, where the material is woven into fabrics, cut and assembled according to the fashion industry’s specifications. In her 2005 book The Travels of a T-shirt in the Global Economy, Pietra Rivoli, a professor at Georgetown University, writes that each year Americans purchase approximately one billion garments made in China, the equivalent of four pieces of clothing for every US citizen.","foot":false},{"L":null,"t":"Once bought, an estimated 21% of annual clothing purchases stay in the home, increasing the stocks of clothing and other textiles held by consumers, according to Recycling of Low Grade Clothing Waste, by consultant Oakdene Hollins. The report calls this stockpiling an increase in the ‘national wardrobe’, which is considered to represent a potentially large quantity of latent waste that will eventually enter the solid waste stream. According to the EPA Office of Solid Waste, Americans throw away more than 68 pounds of clothing and textiles per person per year, and this represents about 4% of the municipal solid waste. But this figure is rapidly growing.","foot":false},{"L":null,"t":"In her book Waste and Want: A Social History of Trash, Susan Strasser, a professor of history at the University of Delaware, traces the ‘progressive obsolescence’ of clothing and other consumer goods to the 1920s. Before then, and especially during World War I, most clothing was repaired, mended or tailored to fit other family members, or recycled within the home as rags or quilts. During that war, clothing manufacturers reduced the varieties, sizes and colours of their productions and even urged designers to create styles that would use less fabric and avoid needles decoration. The US government’s conservation campaign used slogans such as ‘Make economy fashionable lest it become obligatory’ and resulted in an approximate 10% reduction in the production of trash.","foot":false},{"L":null,"t":"However, the spirit of conservation did not last long; by the mid-1920s, consumerism was back in style. During World War II, consumption rose with increased employment as the United States mobilised for the war. Industrialisation brought consumerism with it as an integral part of the economy. When it comes to clothing, the rate of purchase and disposal has dramatically increased, so the path that a T-shirt travels from the sales floor to the landfill site has become shorter. Yet even today, the journey of a piece of clothing does not always end at the landfill site. A proportion of clothing purchases are recycled, mainly in three ways: clothing may be resold by the primary consumer to other consumers at a lower price, it may be exported in bulk for sale in developing countries, or it may be chemically or mechanically recycled into raw material that can be used to produce insulation.","foot":false},{"L":null,"t":"Domestic resale has boomed in the era of the internet. Many people sell directly to other individuals through auction websites such as eBay. Another increasingly popular outlet is charity and thrift shops, though only about one-fifth of the clothing donated to charities is directly used or sold in their thrift shops. Says Rivoli, ‘There are nowhere near enough people in America to absorb the mountains of cast-offs, even if they were given away.’ So charities find another way to fund their programmes, using the clothing that they cannot sell. About 45% of these textiles continue their life as clothing, just not domestically. Certain brands and rare collectible items are imported by Japan. Clothing that is not considered vintage or high-end is baled for export to developing nations. For Tanzania, where used clothing is sold at the markets that dot the country, these items are the number one import from the United States. Observers such as Rivoli predict that the trend toward increasing exports of used clothing to developing countries will continue to accelerate because of the rise of consumerism in the United States and Europe and the falling prices of new clothing.","foot":false}],"groups":[{"a":1,"b":5,"k":"match","instr":["Look at the following statements and the list of people below.","Match each statement with the correct person, A–D.","Write the correct letter, A–D, in boxes 1–5 on your answer sheet.","NB You may use any letter more than once."],"items":[{"n":1,"t":"The amount of recycled clothing available in the US exceeds demand.","opts":[]},{"n":2,"t":"Countries like Tanzania will receive even more used clothing from North America in the future.","opts":[]},{"n":3,"t":"A change in manufacturers’ attitudes helped decrease the amount of waste that was generated","opts":[]},{"n":4,"t":"Our gender has an influence on our increased desire to shop.","opts":[]},{"n":5,"t":"A future waste problem may occur because people add to the clothes they already own each year.","opts":[]}],"opts":[{"k":"A","t":"Mayra Diaz"},{"k":"B","t":"Pietra Rivoli"},{"k":"C","t":"Oakdene Hollins"},{"k":"D","t":"Susan Strasser"}],"ctx":[],"optTitle":"List of people"},{"a":6,"b":8,"k":"multi","instr":["Choose THREE of these letters, A–G.","Write the correct letters, A–G, in boxes 6–8 on your answer sheet.","writer of the passage?"],"items":[],"opts":[{"k":"A","t":"increased health problems"},{"k":"B","t":"increases in petrol prices"},{"k":"C","t":"increased use of chemicals"},{"k":"D","t":"reduced wages for workers"},{"k":"E","t":"lower profits for small local manufacturers"},{"k":"F","t":"negative effects on other industries"},{"k":"G","t":"production of unwanted dangerous materials"}],"ctx":[],"count":3,"q":"Which THREE possible consequences of the fashion industry are mentioned by the"},{"a":9,"b":13,"k":"gap","instr":["Answer the questions below.","Choose NO MORE THAN TWO WORDS AND/OR A NUMBER from the passage for each answer.","Write your answers in boxes 9–13 on your answer sheet."],"items":[{"n":9,"t":"What is the name of one material that is not natural?","opts":[]},{"n":10,"t":"What percentage of household garbage is made up of clothes?","opts":[]},{"n":11,"t":"In what era did Americans stop reusing old clothes?","opts":[]},{"n":12,"t":"What has caused the selling of used clo
