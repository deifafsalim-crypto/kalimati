lp animals with those traits to survive and bear young. This is evolution by artificial selection. Most domestic animals are natu- rally social. Their wild ancestors lived in groups, with individuals responding to each oth- er – some led, others followed. In domestic animals, the tendency to submit to others is especially strong. Generations of breeding have encouraged them to let people take the lead. Main idea in paragraph C: Domesticated horses develop qualities that humans prefer. Possible headings: ii Developing desirable characteristics iii Playing a less essential role Comment: When searching for the most suitable heading, make sure the heading you choose reflects the main idea. For paragraph B, some students may be trapped and think domesticated horses play a less essential role than wild horses. It is true that this paragraph compares these two different types, but does not claim one is more essential than the other. iii Playing a less essential role Comment: The main idea of the paragraph is expressed at the beginning and it is about the different traits (qualities) that domesticated horses have. And these traits are developed because that is what humans desire in their domesticated horses: Q 3. Section C: ii Developing desirable characteristics Comment: There is another question we can answer using the information in this paragraph: Q 10. Methods of artificial selection have changed over the centuries. Meaning: Have people changed their methods of artificial selection over the centuries? Answer: We don’t know. Therefore, Not Given Explanation: This paragraph applies the law of ‘natural selection’ to ‘artificial selection’ where humans, not the nature, select the desirable traits. However, it does not mention any methods being changed over time."},"11":{"raw":"front","v":"front","ex":"Highlighted in red = Question 5 Highlighted in blue = Question 11 Part of the passage [Par E]: Horses are built for power. Their muscular bodies are heavier in the front than in the back, making them well balanced to pull heavy loads. Yet they can also be agile and quick – fit to carry out difficult tasks at top speed. So for more than a thousand years, people have called on the power of horses to cultivate the land and manage livestock. Main idea in paragraph E: Horses have been used in agriculture for over a thousand years. Comment: It is a short paragraph, and the main idea is expressed at the end with help of the signal word ‘so’. Previous sentences support this main idea. Again because the paragraph is short, the most suitable heading is easy to spot: Q 5. Section E: vii Horses in agriculture Comment: There is a sentence-completion question from this paragraph: Q 11. Having greater weight at the ……………… helps horses to pull heavy items. Part of the passage [Par E]: Their muscular bodies are heavier in the front than in the back, making them well balanced to pull heavy loads. Comment: Having greater weight = their muscular bodies are heavier Comment: Helps horses to pull heavy items = making them well balanced to pull heavy loads Answer: front"},"12":{"raw":"endurance","v":"endurance","ex":"Highlighted in red = Question 6 Highlighted in blue = Questions 12 and 13 Part of the passage [Par F]: For most of human history, there was no faster way to travel over land than on a horse. When it comes to carrying people and their possessions, horses have two important advantages – they can run very fast and very far. Their speed and endurance are unusual for a creature so large, making them the most suitable animals to carry people and goods around the world. Horses offer other advantages as well. Since they eat grass, they can go almost anywhere that humans can, eating as they go. And unlike cows and camels, which must sit and rest to digest food, a horse’s digestive system allows it to graze and walk the whole day without stopping. By carrying people, goods and ideas between civilizations, horses changed history. Main idea in paragraph F: Horses were the best way to travel on land for most of the human history. Possible headings: ix An ideal form of transport i ZO The fastest breeds of horses Comment: Even though paragraph F talks about speed, it only mentions it as one of the advantages of travelling on horses. And it definitely does NOT compare different breeds of horses based on speed. i The fastest breeds of horses Comment: The main idea of the paragraph is how horses were ideal form of transport and it is supported by giving a number of reasons: They are fast (speed), they can go far (endurance), and most importantly, they can go without stopping while eating (grazing): Q 6. Section F: ix An ideal form of transport Comment: We have two more sentence-completion questions taken out of this paragraph: Q 12. As well as being quicker, horses have greater ………….… than most other large animals. Part of the passage [Par F]: Their speed and endurance are unusual for a creature so large, making them the most suitable animals to carry people and goods around the world. Comment: As well as being quicker = their speed and Comment: They have two advantages over other large animals: speed and endurance. Since speed is already given in the question, the noun we are looking for is endurance. Answer: endurance Q 13. Because of the way their ……………… works, horses can keep moving all day long. Part of the passage [Par F]: a horse’s digestive system allows it to graze and walk the whole day without stopping. Answer: digestive system"},"13":{"raw":"digestive system","v":"digestive system","ex":"Highlighted in red = Question 6 Highlighted in blue = Questions 12 and 13 Part of the passage [Par F]: For most of human history, there was no faster way to travel over land than on a horse. When it comes to carrying people and their possessions, horses have two important advantages – they can run very fast and very far. Their speed and endurance are unusual for a creature so large, making them the most suitable animals to carry people and goods around the world. Horses offer other advantages as well. Since they eat grass, they can go almost anywhere that humans can, eating as they go. And unlike cows and camels, which must sit and rest to digest food, a horse’s digestive system allows it to graze and walk the whole day without stopping. By carrying people, goods and ideas between civilizations, horses changed history. Main idea in paragraph F: Horses were the best way to travel on land for most of the human history. Possible headings: ix An ideal form of transport i ZO The fastest breeds of horses Comment: Even though paragraph F talks about speed, it only mentions it as one of the advantages of travelling on horses. And it definitely does NOT compare different breeds of horses based on speed. i The fastest breeds of horses Comment: The main idea of the paragraph is how horses were ideal form of transport and it is supported by giving a number of reasons: They are fast (speed), they can go far (endurance), and most importantly, they can go without stopping while eating (grazing): Q 6. Section F: ix An ideal form of transport Comment: We have two more sentence-completion questions taken out of this paragraph: Q 12. As well as being quicker, horses have greater ………….… than most other large animals. Part of the passage [Par F]: Their speed and endurance are unusual for a creature so large, making them the most suitable animals to carry people and goods around the world. Comment: As well as being quicker = their speed and Comment: They have two advantages over other large animals: speed and endurance. Since speed is already given in the question, the noun we are looking for is endurance. Answer: endurance Q 13. Because of the way their ……………… works, horses can keep moving all day long. Part of the passage [Par F]: a horse’s digestive system allows it to graze and walk the whole day without stopping. Answer: digestive system"}},"words":[{"w":"Landscape","pos":"n","def":"a large area of countryside, especially in relation to its appearance","lvl":"B1","ex":"The landscape is dotted with the tents of campers and hikers","ar":"منظر طبيعي / أرض"},{"w":"Thrive","pos":"v","def":"to grow, develop or be successful","lvl":"C1","ex":"His business thrived in the years before the war","ar":"يزدهر"},{"w":"Descend from","pos":"v","def":"to be related to a particular person or group of people who lived in the past","lvl":"C2","ex":"Her father is descended from Greek loyalty","ar":"ينحدر من"},{"w":"Encounter","pos":"v","def":"to experience something, especially something unpleasant","lvl":"B2","ex":"When did you first encounter these difficulties?","ar":"يصادف / يواجه"},{"w":"Profoundly","pos":"adv","def":"deeply or extremely","lvl":"C2","ex":"Society has changed so profoundly over the last 50 years","ar":"بعمق / بشدة"},{"w":"Offspring","pos":"n","def":"the young of an animal","lvl":"C2","ex":"In the case of guinea pig, the number of offspring varies between two and five","ar":"نسل / صغار الحيوان"},{"w":"Take the lead","pos":"v","def":"start winning the competition or to accept the responsibility for doing something","lvl":"","ex":"She took the lead ten miles into the marathon","ar":"يتولّى القيادة"},{"w":"Outmoded","pos":"adj","def":"no longer modern, useful or necessary","lvl":"","ex":"Outmoded working practices are being phased out","ar":"عتيق / لم يعد مفيدًا"},{"w":"Load","pos":"n","def":"the amount of weight carried, especially by a vehicle or an animal","lvl":"B2","ex":"The maximum load for this elevator is eight persons","ar":"حمولة"},{"w":"Agile","pos":"adj","def":"able to move your body easily and quickly","lvl":"","ex":"Monkeys are very agile climbers","ar":"رشيق"},{"w":"Cultivate","pos":"v","def":"to prepare land and grow crops on it","lvl":"C1","ex":"Most of the land there is too poor to cultivate","ar":"يزرع الأرض"},{"w":"Endurance","pos":"n","def":"the ability to keep doing something difficult or painful for a long time","lvl":"C2","ex":"Running a marathon is a test of human endurance","ar":"قدرة على التحمّل"},{"w":"Warfare","pos":"n","def":"the activity of fighting a war, often including the weapons","lvl":"","ex":"guerrilla/naval/nuclear/trench warfare","ar":"الحرب / القتال"}]},{"n":5,"pp":2,"title":"Business case study: Rebranding Shopper’s Stop","untitled":false,"intro":null,"paras":[{"L":null,"t":"On April 24, 2008, one of India’s oldest retail chains Shopper’s Stop Ltd unveiled its new logo as a part of its rebranding strategy. The chain undertook the rebranding exercise in a bid to go upmarket, and reposition itself as a ‘bridge to luxury’ store as opposed to its earlier image of a premium retailer. This would mean raising the already high quality of its products, and targeting more affluent consumers. Commenting on the change, B.S. Nagesh, Customer Care Associate and Managing Director, Shopper’s Stop, said, ‘Change is essential. Our consumers are changing; their preferences are constantly evolving. They are getting younger. And so, we have to change along with them. The change in identity is just the beginning of a wave of strategic movements being made in people, practices, introduction of new ways of shopping, technology, investment in customer relationship management, and analytics.’","foot":false},{"L":null,"t":"Shopper’s Stop was founded by K Raheja Corporation in October 1991, with its first store in Mumbai. From selling men’s ready-to-wear clothing it soon evolved into a complete family lifestyle store. As of 2008, Shopper’s Stop had 1.3 million square feet of retail space spread across 24 stores in 11 cities in India, with a retail turnover of over 12.07 billion rupees (approx. US$245m).","foot":false},{"L":null,"t":"According to analysts, in the mid-2000s Shopper’s Stop started to lose its market value as it failed to keep pace with changing customer preferences. It faced competition from several retailers such as Globus, Westside and Lifestyle, who were catering to the same segment of customers.","foot":false},{"L":null,"t":"Changing consumer behaviour and the growing demand from youngsters for trendy products made Shopper’s Stop consider the option of rebranding itself.","foot":false},{"L":null,"t":"It conducted a series of workshops called ‘Trial Room’, to understand the preferences of groups of invited consumers. The workshops revealed that what was needed was a change in the look and feel of the brand. For Shopper’s Stop, rebranding meant not just a change of logo, but the execution of new business strategies, with the core principles remaining intact. According to Ravi Deshpande, Chief Creative Officer with Contract Advertising, the agency which designed the new campaign for Shopper’s Stop, ‘The retailer needed its brand idea to change, in order to connect to younger people. The purpose was also to cut the age of the brand, as fresh ideas do help in making people look differently at the brand.’","foot":false},{"L":null,"t":"As a part of the rebranding efforts, Shopper’s Stop introduced a new rectangular logo designed by Ray+Keshavan. Though the logo was changed, the black and white colour scheme was retained. Govind Shrikhande, Customer Care Associate and Chief Executive of Shopper’s Stop, said, ‘It is more classical, rich, and authoritative – something Shopper’s customers connect with. Black and white gives us a strong brand recall value.’ The tagline was also changed from ‘Shopping and Beyond’ to ‘Start Something New’, which implied that customers should try out something different, and upgrade themselves according to the demands of the changing world.","foot":false},{"L":null,"t":"As a part of its new philosophy of providing the customers with a new shopping experience, Shopper’s Stop came up with several initiatives. One plan was to increase the area of each store from around 40,000-45,000 square feet to 75,000-85,000 square feet. It also started a new concept in the retail industry by setting up trial rooms with day and night lighting options, so that consumers could check how garments would look during the day and in the night.","foot":false},{"L":null,"t":"The other initiatives included a new dress code of black and white for the employees, and training sessions to help employees tackle demanding customers with varied tastes. Shopper’s Stop also introduced a company anthem for the staff, penned by renowned lyricist Gulzar, and sung by popular Indian singer Sonu Nigam. It was played every morning across all outlets in the country as a song of celebration. Shopper’s Stop brought out collectible shopping bags with different themes and launched the first in the series based on the theme ‘Fashion for the Age’. To make shopping an enjoyable experience for its customers, it launched an in-store radio station in association with Blue Frog Media, which aired popular melodies across all its stores in India, while radio presenters offered tips on fashion and wellness. It also planned to start its online portal by the end of 2008, to enable customers to shop online.","foot":false},{"L":null,"t":"In addition to these initiatives, Shopper’s Stop also started an environmental awareness campaign called ‘Think Green’. As part of this initiative, it planted more than 500 trees and distributed 1,500,000 seed sachets among its customers. Besides, a series of print and television commercials in black and white, with an environmental message that also conveyed Shopper’s Stop’s repositioning, were launched.","foot":false},{"L":null,"t":"Shopper’s Stop planned to invest around 15 billion rupees to increase the number of outlets to 48 by 2011. It had earmarked 200 million rupees for the rebranding and repositioning exercise. But not everyone favoured the changes. Customers said that from their point of view, there was no major change in terms of price or special offers. Some analysts were of the view that the new logo had nothing unique to offer except for a change in shape. Some even wondered why the retailer had decided to rebrand itself, considering that it was doing reasonably well and had just completed a successful year.","foot":false}],"groups":[{"a":14,"b":19,"k":"match","instr":["Complete each sentence with the correct ending, A–I, below.","Write the correct letter, A–I, in boxes 14–19 on your answer sheet."],"items":[{"n":14,"t":"In rebranding, Shopper’s Stop’s objective was to attract","opts":[]},{"n":15,"t":"The mid-2000s saw an alteration in","opts":[]},{"n":16,"t":"In the mid-2000s young people were increasingly interested in buying","opts":[]},{"n":17,"t":"Workshops showed that Shopper’s Stop needed to modify","opts":[]},{"n":18,"t":"The new advertising campaign was intended to give the Shopper’s Stop brand","opts":[]},{"n":19,"t":"The new tagline was intended to encourage consumers to buy","opts":[]}],"opts":[{"k":"A","t":"its brand image"},{"k":"B","t":"designs that were popular in other parts of the world"},{"k":"C","t":"customers who had stayed loyal to the company"},{"k":"D","t":"the items that consumers tended to buy"},{"k":"E","t":"products that they hadn’t tried before"},{"k":"F","t":"a younger image"},{"k":"G","t":"the shape of the logo"},{"k":"H","t":"customers with more money to spend"},{"k":"I","t":"fashionable goods"}],"ctx":[]},{"a":20,"b":22,"k":"tf","instr":["Do the following statements agree with the information given in Reading Passage 2?","In boxes 20–22 on your answer sheet, write"],"items":[{"n":20,"t":"When Shopper’s Stop first opened it sold products for all the family.","opts":[]},{"n":21,"t":"Shopper’s Stop and Globus targeted similar sections of the market.","opts":[]},{"n":22,"t":"The advertising campaign was used to launch new products.","opts":[]}],"opts":[],"ctx":[]},{"a":23,"b":24,"k":"multi","instr":["Choose TWO letters, A–E.","Write the correct letters in boxes 23 and 24 on your answer sheet."],"items":[],"opts":[{"k":"A","t":"redecorating its stores"},{"k":"B","t":"changing the lighting in certain areas of its stores"},{"k":"C","t":"recruiting additional staff"},{"k":"D","t":"offering online fashion advice"},{"k":"E","t":"broadcasting music throughout the stores"}],"ctx":[],"count":2,"q":"customers? Which TWO of the following activities were among Shopper’s Stop’s initiatives to help"},{"a":25,"b":26,"k":"multi","instr":["Choose TWO letters, A–E.","Write the correct letters in boxes 25 and 26 on your answer sheet."],"items":[],"opts":[{"k":"A","t":"The company had spent too much on the rebranding."},{"k":"B","t":"The company lost customers to its competitors because of the rebranding."},{"k":"C","t":"The rebranding did not save consumers money."},{"k":"D","t":"The logo was too similar to some other companies’ logos."},{"k":"E","t":"The rebranding was unnecessary at that time."}],"ctx":[],"count":2,"q":"Which TWO of the following comments are reported about Shopper’s Stop’s rebranding?"}],"ans":{"14":{"raw":"H customers with more money to spend","v":"H","ex":"In rebranding, Shopper’s Stop’s objective was to attract. Part of the passage: On April 24, 2008, one of India’s oldest retail chains Shopper’s Stop Ltd unveiled its new logo as a part of its rebranding strategy. The chain under- took the rebranding exercise in a bid to go upmarket, and reposition itself as a ‘bridge to luxury’ store as opposed to its earlier image of a premium retailer. This would mean raising the already high quality of its products, and targeting more affluent consumers. Answer: H customers with more money to spend Explanation: to go upmarket = to offer goods and products intended for people who are quite rich; affluent = rich; According to the first paragraph, the goal behind rebranding was to attract even richer customers."},"15":{"raw":"D the items that consumers tended to buy","v":"D","ex":"The mid - 2000s saw an alteration in Part of the passage: According to analysts, in the mid-2000s Shopper’s Stop started to lose its market value as it failed to keep pace with changing customer preferences. It faced competition from several retailers such as Globus, Westside and Lifestyle, who were catering to the same segment of customers Answer: D the items that consumers tended to buy Explanation: alteration = change; customer preferences= the things customers tend to buy; In the question stem the word ‘saw’ means ‘experienced’; we can also use this structure in Task 1 writing."},"16":{"raw":"I fashionable goods","v":"I","ex":"In the mid-2000s young people were increasingly interested in buying. Part of the passage: Changing consumer behaviour and the growing demand from youngsters for trendy products made Shopper’s Stop consider the option of rebranding itself. Answer: I fashionable goods Explanation: growing demand = increasingly interested; trendy products = fashionable items;"},"17":{"raw":"A its brand image","v":"A","ex":"Workshops showed that Shopper’s Stop needed to modify. Part of the passage: It conducted a series of workshops called ‘Trial Room’, to under- stand the preferences of groups of invited consumers. The workshops revealed that what was needed was a change in the look and feel of the brand. Answer: A its brand image Explanation: show = reveal; need to modify = what was needed was a change;"},"18":{"raw":"F a younger image","v":"F","ex":"The new advertising campaign was intended to give the Shopper’s Stop brand. Part of the passage: According to Ravi Deshpande, Chief Creative Officer with Contract Advertising, the agency which designed the new campaign for Shopper’s Stop, ‘The re- tailer needed its brand idea to change, in order to connect to younger people. The purpose was also to cut the age of the brand, as fresh ideas do help in making people look differently at the brand.’ Answer: F a younger image Explanation: to cut the age of the brand = to make the brand younger (as it was already old); A new brand image was intended to attract more young people."},"19":{"raw":"E products that they hadn’t tried before","v":"E","ex":"The new tagline was intended to encourage consumers to buy. Part of the passage: The tagline was also changed from ‘Shopping and Beyond’ to ‘Start Something New’, which implied that customers should try out something different, and upgrade themselves according to the demands of the changing world. Answer: E products that they hadn’t tried before Explanation: Do not be discouraged if you see unfamiliar words. Do I need to know the word ‘tagline’ to answer the question? Of course, not! The answer is very easy to spot: try out something different = products that they hadn’t tried before;"},"20":{"raw":"No, THEREFORE, False","v":"F","ex":"When Shopper’s Stop first opened it sold products for all the family. Meaning: When Shopper’s Stop first opened, did it sell products for all the family? Answer: No, THEREFORE, False Part of the passage: Shopper’s Stop was founded by K Raheja Corporation in October 1991, with its first store in Mumbai. From selling men’s ready-to-wear clothing it soon evolved into a complete family lifestyle store. Explanation: They first specialized in men’s ready-to-wear clothing before becoming a complete family lifestyle store."},"21":{"raw":"Yes, THEREFORE, True","v":"T","ex":"Shopper’s Stop and Globus targeted similar sections of the market. Meaning: Did these two stores target similar sections of the market (similar custom- ers)? Answer: Yes, THEREFORE, True Part of the passage: It faced competition from several retailers such as Globus, Westside and Lifestyle, who were catering to the same segment of customers. Explanation: cater to = serve; segment of customers = sections of the market;"},"22":{"raw":"We don’t know, THEREFORE, Not Given","v":"NG","ex":"The advertising campaign was used to launch new products. Meaning: Was it used to launch (start) new products? Answer: We don’t know, THEREFORE, Not Given Part of the passage: The tagline was also changed from ‘Shopping and Beyond’ to ‘Start Something New’, which implied that customers should try out something different, and upgrade themselves according to the demands of the changing world. Explanation: It is true that customers are encouraged to try out something new, but it does not talk about any specific new product launch."},"23":{"raw":"B changing the lighting in certain areas of its stores.","v":"B","ex":"Answer: B changing the lighting in certain areas of its stores. Part of the passage: As a part of its new philosophy of providing the customers with a new shopping experience, Shopper’s Stop came up with several initiatives. One plan was to increase the area of each store from around 40,000-45,000 square feet to 75,000-85,000 square feet. It also started a new concept in the retail industry by set- ting up trial rooms with day and night lighting options, so that consumers could check how garments would look during the day and in the night. Answer: E broadcasting music throughout the stores. Part of the passage: The other initiatives included a new dress code of black and white for the employees, and training sessions to help employees tackle demanding customers with varied tastes. Shopper’s Stop also introduced a company anthem for the staff, penned by renowned lyricist Gulzar, and sung by popular Indian singer Sonu Nigam. It was played every morning across all outlets in the country as a song of celebration.","set":["B","E"]},"24":{"raw":"E broadcasting music throughout the stores.","v":"E","ex":"Answer: B changing the lighting in certain areas of its stores. Part of the passage: As a part of its new philosophy of providing the customers with a new shopping experience, Shopper’s Stop came up with several initiatives. One plan was to increase the area of each store from around 40,000-45,000 square feet to 75,000-85,000 square feet. It also started a new concept in the retail industry by set- ting up trial rooms with day and night lighting options, so that consumers could check how garments would look during the day and in the night. Answer: E broadcasting music throughout the stores. Part of the passage: The other initiatives included a new dress code of black and white for the employees, and training sessions to help employees tackle demanding customers with varied tastes. Shopper’s Stop also introduced a company anthem for the staff, penned by renowned lyricist Gulzar, and sung by popular Indian singer Sonu Nigam. It was played every morning across all outlets in the country as a song of celebration.","set":["B","E"]},"25":{"raw":"C The rebranding did not save consumers money.","v":"C","ex":"Answer: C The rebranding did not save consumers money. Part of the passage: Shopper’s Stop planned to invest around 15 billion rupees to increase the number of outlets to 48 by 2011. It had earmarked 200 million rupees for the rebranding and repositioning exercise. But not everyone favoured the changes. Customers said that from their point of view, there was no major change in terms of price or special offers. Answer: E The rebranding was unnecessary at that time. Part of the passage: Some analysts were of the view that the new logo had nothing unique to offer except for a change in shape. Some even wondered why the retailer had decided to rebrand itself, considering that it was doing reasonably well and had just completed a successful year.","set":["C","E"]},"26":{"raw":"E The rebranding was unnecessary at that time.","v":"E","ex":"Answer: C The rebranding did not save consumers money. Part of the passage: Shopper’s Stop planned to invest around 15 billion rupees to increase the number of outlets to 48 by 2011. It had earmarked 200 million rupees for the rebranding and repositioning exercise. But not everyone favoured the changes. Customers said that from their point of view, there was no major change in terms of price or special offers. Answer: E The rebranding was unnecessary at that time. Part of the passage: Some analysts were of the view that the new logo had nothing unique to offer except for a change in shape. Some even wondered why the retailer had decided to rebrand itself, considering that it was doing reasonably well and had just completed a successful year.","set":["C","E"]}},"words":[{"w":"Rebranding","pos":"n","def":"the process of changing the way that an organization, company, or product is seen by the public","lvl":"","ex":"Businesses may decide to rebrand for several reasons","ar":"إعادة بناء العلامة التجارية"},{"w":"Unveil","pos":"v","def":"to show something new or make it known for the first time","lvl":"","ex":"A new government policy on forests is due to be unveiled in April","ar":"يكشف عن"},{"w":"Undertake","pos":"v","def":"to do or begin to do something, especially something that will take a long time or be difficult","lvl":"C1","ex":"Students are required to undertake simple experiments","ar":"يتولّى / يقوم بـ"},{"w":"In a bid to do something","pos":"","def":"in an attempt","lvl":"C2","ex":"In a bid to attract youngsters to schools, the government will organize an awareness program.","ar":"في محاولة لـ"},{"w":"Upmarket","pos":"adj","def":"describes goods and products that are of very high quality and intended to be brought by people who are quite rich","lvl":"","ex":"an upmarket brand name","ar":"راقٍ (منتجات غالية)"},{"w":"Affluent","pos":"adj","def":"having a lot of money or owning a lot of things","lvl":"C1","ex":"affluent nations/neighborhoods","ar":"ثري / ميسور"},{"w":"Turnover","pos":"n","def":"the amount of business that a company does in a period of time","lvl":"C1","ex":"Large supermarkets have high turnovers (their goods sell very quickly)","ar":"حجم المبيعات"},{"w":"Keep pace with","pos":"","def":"to develop or progress at the same rate as something else","lvl":"","ex":"The government is not allowing salaries to keep pace with inflation","ar":"يواكب"},{"w":"Cater to","pos":"v","def":"to try to satisfy one that is not popular or not generally acceptable","lvl":"C1","ex":"This legislation simply caters to racism","ar":"يلبّي احتياجات"},{"w":"Segment","pos":"n","def":"any of the parts which something (especially a circle or sphere) can be divided or into which it is naturally divided","lvl":"","ex":"the salad was decorated with segments of orange","ar":"شريحة / قسم"},{"w":"Execution","pos":"n","def":"the act of doing or performing something, especially in a planned way","lvl":"","ex":"Sometimes in the execution of their duty the police have to use firearms.","ar":"تنفيذ"},{"w":"Core","pos":"adj","def":"the basic and most important part of something","lvl":"C2","ex":"The lack of government funding is at the core of the problem","ar":"أساسي / جوهري"},{"w":"Intact","pos":"adj","def":"complete and in the original state","lvl":"C2","ex":"The church was destroyed in the bombing but the altar survived intact","ar":"سليم كما هو"},{"w":"Retain","pos":"v","def":"to keep or continue to have something","lvl":"C2","ex":"She has lost her battle to retain control of the company","ar":"يحتفظ بـ"},{"w":"Air","pos":"v","def":"to broadcast something or be broadcasted on radio or television","lvl":"","ex":"The game will be aired live on CBS at 7:00 pm tonight","ar":"يبثّ (إعلانًا)"},{"w":"Convey","pos":"v","def":"to express a thought, feeling, or idea so that it is understood by other people","lvl":"C1","ex":"His poetry conveys a great sense of religious devotion","ar":"ينقل / يعبّر عن"},{"w":"Earmark (v) (often passive)","pos":"","def":"to keep or intend something for a particular purpose","lvl":"","ex":"Five billion dollars of this year’s budget is already earmarked for hospital improvements","ar":"يخصّص لغرض معيّن"}]},{"n":6,"pp":3,"title":"The changing value of maps","untitled":true,"intro":null,"paras":[{"L":"A","t":"Maps vary enormously, from imposing images of the world and its parts to private jottings intended to give an approximate idea of the twentieth-century Antarctic. The materials on which maps are to be found, similarly range from scraps of paper to plaster walls, by way of parchment, copper coins, mosaics, marble, woollen tapestries, silk, gold and more. Attitudes towards maps also vary greatly, and are subject to modification over time.","foot":false},{"L":"B","t":"In recent decades, the view that maps should be assessed primarily in terms of their geometrical accuracy has radically changed. At the same time, they have become available to a range of disciplines. This development has been encouraged by the growing popularity of interdisciplinary studies and by the increasing awareness and appreciation of the importance of the visual – which may be a consequence of the spread of television and the internet, and the ease with which images can be created and manipulated in a digital environment. Academic historians of all types – social, political, diplomatic and fine art, literature specialists, and family historians take an interest in maps and find that they sometimes offer perspectives on their subjects that are not possible from other sources.","foot":false},{"L":"C","t":"All have contributed to a re-evaluation of the subject. It is accepted that for some purposes, such as administration and terrestrial and maritime navigation, mathematical accuracy still plays a major and even sometimes a paramount role in cartography. In other contexts, such as maps of underground railway systems, or maps used for propaganda purposes, such accuracy is irrelevant, and at times even undesirable. Conversely, the very aspects that tended traditionally to be condemned or disregarded, such as distortions and decoration, become of enormous significance. They can give particularly precious insights into the mentalities of past ages, and the views and lives of their creators, as well as being packed with more general cultural information such as the receptiveness to artistic fashions.","foot":false},{"L":"D","t":"For many map enthusiasts the fascination of maps ironically stems from their necessary lack of truth. They can be regarded as the most successful pieces of fiction ever to be created because most users instinctively suspend disbelief until they find that the map they are using does not give truthful information. Yet it has to be that way. Given the impossibility of representing the total reality, with all its complexity, on a flat surface, hard decisions have to be taken as to what features to select for accurate representation, or indeed for representation at all. For most of the time this process of selection is almost instinctive. The mapmaker knows the purpose he intends for his map, and beyond that he is unwittingly guided by the values and assumptions of the time in which he lives – unless these are in conflict with his own value systems, as was the case with Nicholas Philpot Leader in 1827. The map of Ireland (then part of the UK) that Leader commissioned was intended as a strong attack on the then British government.","foot":false},{"L":"E","t":"In order to meet the map’s purpose, the information that is represented will be prioritized according to importance as perceived by the mapmaker – and not necessarily in accordance with actual geographical size. Even on modern national topographic mapping, such features as motorways will be shown far larger than they actually are because they are important to drivers and users will expect to see them without difficulty. Conversely, large features that are considered unimportant might be completely ignored or reduced in size, like parks and other public spaces in some town maps. Often maps will show things that are invisible in the real world, such as relative financial affluence, as in Charles Booth’s maps of London in the nineteenth century, or the geology far below the surface of the planet, as in an 1823 map of the land around Bath.","foot":false},{"L":"F","t":"Sometimes the purpose of the map is even simpler and has nothing to do with geography. The Hereford World Map proclaims the insignificance of man in the face of the divine and the eternal. The plan of Ostia harbour of AD 64 primarily serves as a demonstration of the Emperor Nero’s benevolence. Sometimes, as in depictions of the imaginary land of Utopia, physical reality is totally absent or so distorted as to be geographically meaningless. Instead the map serves as a commentary on the gap between the aspirations and the feeble achievements of mankind. The quality of a map must be judged by its ability to serve its purpose, and not simply by its scientific precision, and in that context aesthetic and design considerations are every bit as important as the mathematical, and often more so.","foot":false},{"L":"G","t":"Plainly, to interpret maps as having followed a path of ever-increasing scientific perfection over time is to miss the main point. In fact, they have responded to the mentalities, and met the requirements of the societies in which they have been created. In ancient Greece and Babylon, and in eighteenth- and twentieth-century Europe, the preoccupation with precision and the scientific indeed predominated. In early modern China and nineteenth-century Europe the administrative use of mapping came to the fore. By contrast, for long periods of time and in many civilizations, the major preoccupation was to define and to depict man’s place in relationship to a religious view of the universe. This was particularly evident in medieval Europe and Aztec Mexico. Clearly, maps can only be fully understood in their social context.","foot":false}],"groups":[{"a":27,"b":31,"k":"para","instr":["Reading Passage 3 has seven paragraphs, A–G.","Which paragraph contains the following information?","Write the correct letter, A–G, in boxes 27–31 on your answer sheet."],"items":[{"n":27,"t":"Examples of maps showing features that cannot be seen on the ground.","opts":[]},{"n":28,"t":"A list of media that have been used in the creation of maps.","opts":[]},{"n":29,"t":"Examples of the main function of maps in various periods and places.","opts":[]},{"n":30,"t":"A contrast between different types of maps with regard to a requirement for accuracy.","opts":[]},{"n":31,"t":"S nswer: Paragraph B Part of the passage [Par B]: In recent decades, the view that maps should be as- sessed primarily in terms of their geometrical accuracy has radically changed. At the same time, they have become available to a range of disciplines."},"32":{"raw":"H to contrast ideal and actual human development","v":"H","ex":"maps of Utopia Part of the passage [Par F]: Sometimes, as in depictions of the imaginary land of Utopia, physical reality is totally absent or so distorted as to be geographically meaning- less. Instead the map serves as a commentary on the gap between the aspirations and the feeble achievements of mankind. Answer: H to contrast ideal and actual human development"},"33":{"raw":"D to show variations in wealth","v":"D","ex":"Charles Booth’s maps of London Part of the passage [Par E]: Often maps will show things that are invisible in the real world, such as relative financial affluence, as in Charles Booth’s maps of London in the nineteenth century… Answer: D to show variations in wealth"},"34":{"raw":"C to express political criticism","v":"C","ex":"map commissioned by Nicholas Philpot Leader Part of the passage [Par D]: …unless these are in conflict with his own value systems, as was the case with Nicholas Philpot Leader in 1827. The map of Ireland (then part of the UK) that Leader commissioned was intended as a strong attack on the then British government. Answer: C to express political criticism"},"35":{"raw":"E to show differences below ground level","v":"E","ex":"map of Bath area Part of the passage [Par E]: Often maps will show things that are invisible in the real world, ...., or the geology far below the surface of the planet, as in an 1823 map of the land around Bath. Answer: E to show differences below ground level"},"36":{"raw":"I to assist in the management of the country","v":"I","ex":"early modern Chinese maps Part of the passage [Par G]: In early modern China and nineteenth-century Europe the administrative use of mapping came to
