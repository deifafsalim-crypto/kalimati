tainment","lvl":"","ex":"Police officers re-enacted the crime in an attempt to get witnesses to come forward","ar":"يعيد تمثيل"},{"w":"Authoritative","pos":"adj","def":"showing that you are confident, in control, and expect to be respected and obeyed","lvl":"","ex":"She has an authoritative manner that at times is almost arrogant","ar":"واثق وصاحب سلطة"},{"w":"Unyielding","pos":"adj","def":"completely unwilling to change a decision, opinion, demand and etc.","lvl":"","ex":"Korea is unyielding in its demands for a new treaty","ar":"لا يلين"},{"w":"Instigate","pos":"v","def":"to cause an event or situation to happen by making a set of actions or a formal process begin","lvl":"","ex":"The government will instigate new measures to combat terrorism","ar":"يحرّض / يُطلق"},{"w":"Inevitable","pos":"adj","def":"certain to happen and unable to be avoided or prevented","lvl":"C1","ex":"The accident was the inevitable result of carelessness","ar":"حتمي"},{"w":"Shrug off","pos":"v","def":"to treat something as if it is not important or not a problem","lvl":"","ex":"The stock market shrugged off the economic gloom and rose by 1.5 percent","ar":"يتجاهل / لا يبالي"},{"w":"Rage","pos":"n","def":"a period of extreme or violent anger","lvl":"B2","ex":"Her sudden towering rages were terrifying","ar":"غضب شديد"},{"w":"Hamper","pos":"v","def":"to prevent someone doing something easily","lvl":"","ex":"Fierce storms have been hampering rescue efforts and there is now little chance of finding more survivors","ar":"يعيق"},{"w":"Reiterate","pos":"v","def":"to say something again, once or several times","lvl":"","ex":"The government has reiterated its refusal to compromise with terrorists","ar":"يكرّر"},{"w":"Entitlement","pos":"n","def":"something that you have a right to do or have, or the right to do or have something","lvl":"","ex":"pension entitlements: holiday entitlements","ar":"الإحساس بالاستحقاق"},{"w":"Transcend","pos":"v","def":"to go further, rise above, or be more important or better than something, especially a limit","lvl":"","ex":"The best films are those which transcend national or cultural barriers","ar":"يتجاوز / يسمو على"},{"w":"Confrontation","pos":"n","def":"a fight or argument","lvl":"C2","ex":"She actually enjoys confrontation, whereas I prefer a quiet life","ar":"مواجهة / شجار"},{"w":"Attribute to","pos":"v","def":"to say or think that something is the result or work of something or someone else","lvl":"C2","ex":"The doctors have attributed the cause of illness to an unknown virus","ar":"ينسب إلى"},{"w":"Get away with (ph.v)","pos":"","def":"to succeed in avoiding punishment for something","lvl":"B2","ex":"If I thought I could get away with it, I wouldn’t pay any tax at all","ar":"يفلت من العقاب"},{"w":"Work out","pos":"v","def":"to understand something or to find the answer to something by thinking about it","lvl":"C2","ex":"There will be a full investigation to work out what caused the accident","ar":"يكتشف / يفهم"},{"w":"Dynamic","pos":"adj","def":"having a lot of ideas and enthusiasm","lvl":"B2","ex":"She’s young and dynamic and will be a great addition to the team","ar":"نشيط ومليء بالأفكار"}]},{"n":12,"pp":3,"title":"Making a loss is the height of fashion","untitled":false,"intro":null,"paras":[{"L":null,"t":"In this topsy-turvy world, selling a dress at an enormous discount turns out to be very good business indeed, says William Langley Given that a good year in the haute couture business is one where you lose even more money than usual, the prevailing mood in Paris last week was of buoyancy. The big- name designers were falling over themselves to boast of how many outfits they had sold at below cost price, and how this proved that the fashion business was healthier than ever. Jean-Paul Gaultier reported record sales, “but we don’t make any money out of it,” the designer assured journalists backstage. “No matter how successful you are, you can’t make a profit from couture,” explained Jean-Jacques Picart, a veteran fashion PR man, and co-founder of the now-bankrupt Lacroix house.","foot":false},{"L":null,"t":"Almost 20 years have passed since the bizarre economics of the couture business were first exposed. Outraged that he was losing money on evening dresses costing tens of thousands of pounds, the couturier Jean-Louis Scherrer – to howls of “treason” from his colleagues – published a detailed summary of his costs. One outfit he described contained over half a mile of gold thread, 18,000 sequins, and had required hundreds of hours of hand-stitching in an atelier. A fair price would have been £50,000, but the couturier could only get £35,000 for it. Rather than riding high on the follies of the super-rich, he and his team could barely feed their hungry families.","foot":false},{"L":null,"t":"The result was an outcry and the first of a series of government- and industry- sponsored inquiries into the surreal world of ultimate fashion. The trade continues to insist that – relatively speaking – couture offers you more than you pay for, but it’s not as simple as that. When such a temple of old wealth starts talking about value for money, it isn’t to convince anyone that dresses costing as much as houses are a bargain. Rather, it is to preserve the peculiar mystique, lucrative associations and threatened interests that couture represents.","foot":false},{"L":null,"t":"Essentially, the arguments couldn’t be simpler. On one side are those who say that the business will die if it doesn’t change. On the other are those who say it will die if it does. What’s not in doubt is that haute couture – the term translates as “high sewing” – is a spectacular anachronism. Colossal in its costs, tiny in its clientele and questionable in its influence, it still remains one of the great themes of Parisian life. In his book, The Fashion Conspiracy, Nicholas Coleridge estimates that the entire couture industry rests on the whims of less than 30 immensely wealthy women, and although the number may have grown in recent years with the new prosperity of Asia, the number of couture customers worldwide is no more than 4,000.","foot":false},{"L":null,"t":"To qualify as couture, a garment must be entirely handmade by one of the 11 Paris couture houses registered to the Chambre Syndicale de la Haute Couture. Each house must employ at least 20 people, and show a minimum of 75 new designs a year. So far, so traditional, but the Big Four operators – Chanel, Dior, Givenchy and Gaultier – increasingly use couture as a marketing device for their far more profitable ready-to- wear, fragrance and accessory lines.","foot":false},{"L":null,"t":"It isn’t hard to see how this works in practice. “Haute couture is what gives our business its essential essence of luxury,” says Bernard Arnault, the head of LVMH, which owns both Dior and Givenchy. “The cash it soaks up is largely irrelevant. Set against the money we lose has to be the value of the image couture gives us. Look at the attention the collections attract. It is where you get noticed. You have to be there. It’s where we set our ideas in motion.”","foot":false},{"L":null,"t":"The big idea being the one known in the trade as “name association”. Couture outfits may be unaffordable, even unwearable, but the whiff of glamour and exclusivity is hard to resist. The time-starved modern woman who doesn’t make enough in a year to afford a single piece of couture can still buy a share of the dream for the price of a Chanel lipstick or a Givenchy scarf.","foot":false},{"L":null,"t":"For all this, couture has been in decline – the optimists would say readjusting to changed conditions – for years. The number of houses registered to the Syndicale has halved in the last two decades. Pierre Cardin once had almost 500 people working full time on couture, but by the 1980s the number had fallen to 50, and today the house is no longer registered.","foot":false},{"L":null,"t":"Modern life tells the story. Younger women, even the seriously wealthy ones, find ready-to-wear clothes invariably more practical and usually more fun. Couture’s market has dwindled. “Haute couture is a joke,” scoffs Pierre Bergé, the former head of Yves St Laurent – another house that no longer creates it. “Anyone who tells you it still matters is fantasising. You can see it dropping dead all around you. Nobody buys it any more. The prices are ridiculous. The rules for making it are nonsensical. It belongs to another age. Where are today’s couturiers? A real couturier is someone who founds and runs their own house. No one does that anymore.”","foot":false},{"L":null,"t":"Why, then, are the surviving couture houses smiling? Because they trade in fantasy, and, in these times, more people want to fantasise. “We’ve received so many orders we may not be able to deliver them all,” says Sidney Toledano, head of Dior. So, the clothes are rolled out and the couture losses roll in, and everyone agrees that it’s good business.","foot":false}],"groups":[{"a":27,"b":31,"k":"mcq","instr":["Choose the correct letter, A, B, C or D","Write the correct letter in boxes 27–31 on your answer sheet."],"items":[{"n":27,"t":"What is the main topic of the first paragraph?","opts":[{"k":"A","t":"the difference between haute couture and other areas of the fashion industry"},{"k":"B","t":"contrasting views on haute couture"},{"k":"C","t":"the losses made on haute couture"},{"k":"D","t":"the negative attitude towards haute couture of people in the fashion industry"}]},{"n":28,"t":"The writer says that Jean-Louis Scherrer","opts":[{"k":"A","t":"upset other couturiers."},{"k":"B","t":"was in a worse financial position than other couturiers."},{"k":"C","t":"was one of the best-known couturiers."},{"k":"D","t":"stopped producing haute couture dresses."}]},{"n":29,"t":"The writer says that the outfit Jean-Louis Scherrer described","opts":[{"k":"A","t":"was worth the price that was paid for it."},{"k":"B","t":"cost more to make than it should have."},{"k":"C","t":"was never sold to anyone."},{"k":"D","t":"should have cost more to buy than it did."}]},{"n":30,"t":"In the third paragraph, the writer states that haute couture makers","opts":[{"k":"A","t":"think that the term ‘value for money’ has a particular meaning for them."},{"k":"B","t":"prefer to keep quiet about the financial aspects of the business."},{"k":"C","t":"have changed because of inquiries into how they operate."},{"k":"D","t":"want to expand their activities to attract new customers."}]},{"n":31,"t":"The writer says in the fourth paragraph that there is disagreement over","opts":[{"k":"A","t":"the popularity of haute couture."},{"k":"B","t":"the future of haute couture."},{"k":"C","t":"the real costs of haute couture."},{"k":"D","t":"the changes that need to be made in haute couture."}]}],"opts":[],"ctx":[]},{"a":32,"b":36,"k":"yn","instr":["Do the following statements agree with the views of the writer in the reading passage?","In boxes 32–36 on your answer sheet, write"],"items":[{"n":32,"t":"The way that companies use haute couture as a marketing device is clear.","opts":[]},{"n":33,"t":"Only wealthy people are attracted by the idea of ‘name association’.","opts":[]},{"n":34,"t":"Pierre Cardin is likely to return to producing haute couture.","opts":[]},{"n":35,"t":"Some women who can afford haute couture clothes buy other clothes instead.","opts":[]},{"n":36,"t":"It is hard to understand why some haute couture companies are doing well.","opts":[]}],"opts":[],"ctx":[]},{"a":37,"b":40,"k":"match","instr":["Complete each sentence with the correct ending, A–F, below.","Write the correct letter, A–F, in boxes 37–40 on your answer sheet."],"items":[{"n":37,"t":"In his book, Nicholas Coleridge claims that","opts":[]},{"n":38,"t":"The head of LVMH believes that","opts":[]},{"n":39,"t":"The former head of Yves St Laurent feels that","opts":[]},{"n":40,"t":"The head of Dior states that","opts":[]}],"opts":[{"k":"A","t":"there is great demand for haute couture."},{"k":"B","t":"people who defend haute couture are wrong."},{"k":"C","t":"the cost of haute couture is likely to come down."},{"k":"D","t":"haute couture is dependent on a very small number of customers."},{"k":"E","t":"more companies will start producing haute couture."},{"k":"F","t":"it is important to continue with haute couture."}],"ctx":[]}],"ans":{"27":{"raw":"C the losses made on haute couture.","v":"C","ex":"What is the main topic of the first paragraph? Answer: C the losses made on haute couture. Part of the passage: Given that a good year in the haute couture business is one where you lose even more money than usual, the prevailing mood in Paris last week was of buoyancy. The big-name designers were falling over themselves to boast of how many outfits they had sold at below cost price, and how this proved that the fashion business was healthier than ever. Jean-Paul Gaultier reported record sales, “but we don’t make any money out of it,” the designer assured journalists backstage. “No matter how successful you are, you can’t make a profit from couture,” explained Jean-Jacques Picart, a veteran fashion PR man, and co-founder of the now-bankrupt Lacroix house."},"28":{"raw":"A upset other couturiers.","v":"A","ex":"The writer says that Jean-Louis Scherrer Answer: A upset other couturiers. Part of the passage: Almost 20 years have passed since the bizarre economics of the couture business were first exposed. Outraged that he was losing money on evening dresses costing tens of thousands of pounds, the couturier Jean-Louis Scherrer – to howls of “treason” from his colleagues – published a detailed summary of his costs."},"29":{"raw":"D should have cost more to buy than it did.","v":"D","ex":"The writer says that the outfit Jean-Louis Scherrer described Answer: D should have cost more to buy than it did. Part of the passage: One outfit he described contained over half a mile of gold thread, 18,000 sequins, and had required hundreds of hours of hand-stitching in an atelier. A fair price would have been £50,000, but the couturier could only get £35,000 for it. Rather than riding high on the follies of the super-rich, he and his team could barely feed their hungry families."},"30":{"raw":"A think that the term ‘value for money’ has a particular meaning for them.","v":"A","ex":"In the third paragraph, the writer states that haute couture makers Answer: A think that the term ‘value for money’ has a particular meaning for them. Part of the passage: The result was an outcry and the first of a series of government and industry-sponsored inquiries into the surreal world of ultimate fashion. The trade continues to insist that – relatively speaking – couture offers you more than you pay for, but it’s not as simple as that. When such a temple of old wealth starts talking about value for money, it isn’t to convince anyone that dresses costing as much as houses are a bargain. Rather, it is to preserve the peculiar mystique, lucrative associations and threatened interests that couture represents."},"31":{"raw":"B the future of haute couture.","v":"B","ex":"The writer says in the fourth paragraph that there is disagreement over Answer: B the future of haute couture. Part of the passage: Essentially, the arguments couldn’t be simpler. On one side are those who say that the business will die if it doesn’t change. On the other are those who say it will die if it does. What’s not in doubt is that haute couture – the term translates as “high sewing” – is a spectacular anachronism."},"32":{"raw":"Yes","v":"Y","ex":"The way that companies use haute couture as a marketing device is clear. Meaning: Is it clear that the way companies use haute couture as a marketing device? Answer: Yes Part of the passage: So far, so traditional, but the Big Four operators – Chanel, Dior, Givenchy and Gaultier – increasingly use couture as a marketing device for their far more profitable ready-to-wear, fragrance and accessory lines. It isn’t hard to see how this works in practice."},"33":{"raw":"No","v":"N","ex":"Only wealthy people are attracted by the idea of ‘name association’. Meaning: Are ONLY wealthy people attracted by the idea of ‘name association’? Answer: No Part of the passage: The big idea being the one known in the trade as “name associa- tion”. Couture outfits may be unaffordable, even unwearable, but the whiff of glamour and exclusivity is hard to resist. The time-starved modern woman who doesn’t make enough in a year to afford a single piece of couture can still buy a share of the dream for the price of a Chanel lipstick or a Givenchy scarf."},"34":{"raw":"Not Given","v":"NG","ex":"Pierre Cardin is likely to return to producing haute couture. Meaning: Is he likely to return to business of haute couture? Answer: Not Given Part of the passage: For all this, couture has been in decline – the optimists would say readjusting to changed conditions – for years. The number of houses registered to the Syndicale has halved in the last two decades. Pierre Cardin once had almost 500 people working full time on couture, but by the 1980s the number had fallen to 50, and today the house is no longer registered."},"35":{"raw":"Yes","v":"Y","ex":"Some women who can afford haute couture clothes buy other clothes instead. Meaning: Do some women who can afford haute couture clothes buy other clothes instead? Answer: Yes Part of the passage: Modern life tells the story. Younger women, even the seriously wealthy ones, find ready-to-wear clothes invariably more practical and usually more fun. Couture’s market has dwindled. “Haute couture is a joke,” scoffs Pierre Bergé, the former head of Yves St Laurent – another house that no longer creates it."},"36":{"raw":"No","v":"N","ex":"It is hard to understand why some haute couture companies are doing well. Meaning: Is it hard to understand why some haute couture companies are doing well? Answer: No Part of the passage: Why, then, are the surviving couture houses smiling? Because they trade in fantasy, and, in these times, more people want to fantasise. “We’ve received so many orders we may not be able to deliver them all,” says Sidney Toledano, head of Dior. So, the clothes are rolled out and the couture losses roll in, and everyone agrees that it’s good business."},"37":{"raw":"D haute couture is dependent on a very small number of customers.","v":"D","ex":"In his book, Nicholas Coleridge claims that Answer: D haute couture is dependent on a very small number of customers. Part of the passage: In his book, The Fashion Conspiracy, Nicholas Coleridge esti- mates that the entire couture industry rests on the whims of less than 30 immensely wealthy women, and although the number may have grown in recent years with the new prosperity of Asia, the number of couture customers worldwide is no more than 4,000."},"38":{"raw":"F it is important to continue with haute couture.","v":"F","ex":"The head of LVMH believes that Answer: F it is important to continue with haute couture. Part of the passage: “Haute couture is what gives our business its essential essence of luxury,” says Bernard Arnault, the head of LVMH, which owns both Dior and Givenchy. “The cash it soaks up is largely irrelevant. Set against the money we lose has to be the value of the image couture gives us. Look at the attention the collections attract. It is where you get noticed. You have to be there. It’s where we set our ideas in motion.”"},"39":{"raw":"B people who defend haute couture are wrong.","v":"B","ex":"The former head of Yves St Laurent feels that Answer: B people who defend haute couture are wrong. Part of the passage: Couture’s market has dwindled. “Haute couture is a joke,” scoffs Pierre Bergé, the former head of Yves St Laurent – another house that no longer creates it. “Anyone who tells you it still matters is fantasising. You can see it dropping dead all around you. Nobody buys it any more. The prices are ridiculous. The rules for making it are nonsensical. It belongs to another age. Where are today’s couturiers? A real couturier is someone who founds and runs their own house. No one does that anymore.”"},"40":{"raw":"A there is great demand for haute couture.","v":"A","ex":"The head of Dior states that Answer: A there is great demand for haute couture. Part of the passage: “We’ve received so many orders we may not be able to deliver them all,” says Sidney Toledano, head of Dior. So, the clothes are rolled out and the couture losses roll in, and everyone agrees that it’s good business."}},"words":[{"w":"Topsy-turvy","pos":"adj","def":"in a state of being confused, not well organized or giving importance to unexpected things","lvl":"","ex":"The government’s topsy-turvy priorities mean that spending on education remains low","ar":"مقلوب رأسًا على عقب"},{"w":"Prevailing","pos":"adj","def":"existing in a particular place or at a particular time","lvl":"","ex":"The prevailing attitude","ar":"سائد"},{"w":"Buoyancy","pos":"adj","def":"successful or making a profit","lvl":"","ex":"The housing market remains buoyant","ar":"ازدهار / انتعاش"},{"w":"Fall over oneself","pos":"v","def":"to be very eager to do something","lvl":"","ex":"Publishers are falling over themselves to produce non-fiction for seven-year-olds","ar":"يتسابق لـ / متحمّس جدًا"},{"w":"Boast","pos":"v","def":"to speak too proudly or happily about what you have done or what you own","lvl":"C2","ex":"He didn’t talk about his exam results in case people thought he was boasting","ar":"يتباهى"},{"w":"Outfit","pos":"n","def":"a set of clothes for a particular occasion or activity","lvl":"","ex":"I have got a cowboy outfit for the fancy dress party","ar":"زيّ / طقم ملابس"},{"w":"Bizarre","pos":"adj","def":"very strange and unusual","lvl":"B2","ex":"a bizarre situation","ar":"غريب جدًا"},{"w":"Outrage","pos":"v","def":"to cause someone feel very angry, shocked, or upset","lvl":"","ex":"Local people were outraged at the bombing","ar":"يُغضب بشدة"},{"w":"Ride high on","pos":"","def":"when something important, such as your reputation or money, rides on a particular person or thing, it will be won or achieved if that person or thing is successful","lvl":"","ex":"The future of the company now rides on the new managing director","ar":"ينتعش / يعيش نجاحًا"},{"w":"Folly","pos":"n","def":"the fact of being stupid, or a stupid action, idea","lvl":"","ex":"She said that the idea was folly","ar":"حماقة"},{"w":"Inquiry","pos":"n","def":"an official process to discover the facts about something bad that has happened","lvl":"C2","ex":"Citizens have demanded a full inquiry into the government’s handling of the epidemic","ar":"تحقيق رسمي"},{"w":"Surreal","pos":"adj","def":"strange, not seeming real; like a dream","lvl":"","ex":"Driving through the total darkness was a slightly surreal experience","ar":"غريب كالحلم"},{"w":"Peculiar","pos":"adj","def":"unusual and strange, sometimes in an unpleasant way","lvl":"","ex":"She has the most peculiar ideas","ar":"غريب / شاذ"},{"w":"Lucrative","pos":"adj","def":"(especially of a business, job, activity) producing a lot of money","lvl":"C2","ex":"The merger proved to be very lucrative for both companies","ar":"مربح جدًا"},{"w":"Threaten","pos":"v","def":"to be likely to cause harm or damage to someone or something","lvl":"C1","ex":"Changing patterns of agriculture are threatening the countryside","ar":"يهدّد"},{"w":"Whim","pos":"n","def":"a sudden wish or idea, especially one that cannot be reasonably explained","lvl":"C2","ex":"We booked the holiday on a whim","ar":"نزوة"},{"w":"Immensely","pos":"adv","def":"extremely","lvl":"C1","ex":"He was immensely popular in this day","ar":"بشكل هائل"},{"w":"Dwindle","pos":"v","def":"to become smaller in size or amount, or fewer in number","lvl":"","ex":"The community has dwindled to a tenth of its former size in the last two years","ar":"يتضاءل"},{"w":"Ridiculous","pos":"adj","def":"stupid or unreasonable and deserving to be laughed at","lvl":"B2","ex":"Do I look ridiculous in this hat?","ar":"سخيف"}]},{"n":13,"pp":1,"title":"Meet the hedgehog","untitled":false,"intro":null,"paras":[{"L":"A","t":"In Norwich, England, the first housing development designed for both hedgehogs and people has been built. All through the gardens and fences is a network of pathways and holes installed just for the ancient, spiny creatures. It’s a paradise that Fay Vass, chief executive of the British Hedgehog Preservation Society, calls ‘absolutely fantastic. As for the developers, they have reason to think the animals will help make home sales fantastic, too. Part of the attraction is that many people simply love hedgehogs, particularly in Britain, where children’s book writer Beatrix Potter introduced Mrs. Tiggy-Winkle, a hedgehog character, over a century ago. But part of the attraction is also rooted in science. Studies have helped make clear that hedgehogs are good for gardens, eating vast numbers of slugs and other pests as they forage in the vegetation at night.","foot":false},{"L":"B","t":"Recent scientific studies about hedgehogs have helped explain mysteries as varied as why hedgehogs apply saliva to their entire bodies, how they have survived on the planet for 30 million years, why they chew toxic toad skins and what secrets they may hold about evolution. As one of the most primitive mammals on theplanet, the hedgehog has been helping geneticists understand evolutionary relationships among mammals and even uncover secrets of the human genome 1 . At Duke University, for example, scientists chose the hedgehog and 14 other species to study the lineages of mammals. They determined among other things that marsupials (e.g. kangaroos) are not related to monotremes (the egg-laying platypus and echidna), which had long been a subject of debate. Such questions are not just academic. ‘If you are trying to trace, for example, the evolutionary steps of foetal heart development to better understand how foetal defects occur, it helps to know which mammals are related so that you can make accurate inferences about one mammal from another mammal’s development, says researcher Keith Killian.","foot":false},{"L":"C","t":"Still, much about hedgehogs remains unknown. For one thing, scientists think they haven’t even discovered all the hedgehog species. We know of at least 14,’ says hedgehog researcher Nigel Reeve of Britain’s University of Surrey Roehampton, ‘It’s almost certain that there are more species. The 14 known species are native to Africa and parts of Asia as well as Europe. Some hibernate through cold winters in the north. Others tolerate desert heat near the equator. Some live in urban areas, adapting well to living in close proximity to humans. Others live in areas that rank among the most remote places on the planet.","foot":false},{"L":null,"t":"genome: the complete set of genetic material of a living thing","foot":true},{"L":"D","t":"Hedgehogs spend much of their time alone, but Reeve says it would be a mistake to think of them as solitary. Hedgehogs do approach each other and can detect the presence of others by their scent,’ he says. It is true that they usually do not interact at close quarters, but that does not mean they are unaware of their neighbours They may occasionally scrap over food items and rival males attracted to a female may also have aggressive interactions. Still, it’s fair to say that, in adulthood, hedgehogs meet primarily to mate, producing litters of four or five hoglets as often as twice yearly.","foot":false},{"L":"E","t":"Adult hedgehogs eat just about anything they can find: insects, snakes, bird eggs, small rodents and more. Veterinarians trying to understand gum disease in domesticated hedgehogs have concluded that the varied diet of wild hedgehogs gives them more than nutrition-the hard bodies of insects also scrape the hedgehogs’ teeth clean.","foot":false},{"L":"F","t":"All hedgehogs also share the same defence mechanism: they retract their vulnerable parts-head, feet, belly-into a quill-covered ball, using special skin down their sides and over their heads and feet. Any perceived threat can. make them roll up, including the approach of a biologist, so researchers have invented a new measurement for the animals: ball length. Young hedgehogs have a few extra defence strategies. ‘One is to spring up in the air, says Reeve. ‘A fox would get a face full of bristles. They make a little squeak while they do it.’ Evidence suggests that hedgehogs may also add unpleasant chemicals to their quills to make them even less appealing. In behaviour that may be unique for a vertebrate, they chew substances laden with toxins and then apply frothy saliva to their entire bodies. In one 1977 study, human volunteers pricked themselves with quills from hedgehogs that had coated themselves after chewing on venomous toad skins. The volunteers found those quills much more imitating and painful than clean ones.","foot":false},{"L":"G","t":"However, every year, many thousands of the animals die on roads in Europe and elsewhere as they go about their nightly business. Along with intensive farming and pesticides, road kill has taken its toll on hedgehog populations. One 2002 study found the animal numbers had dropped by between 20 and 30 per cent in a single decade. To help combat the decline, the British have established special clinics for injured hedgehogs, urged that anyone making a bonfire check for the animals underneath first, and ensured that hedgehogs can cope with cattle grids. Recently, they even persuaded McDonald’s to alter the packaging of its McFlurry ice-cream container, which had been trapping foraging hedgehogs.","foot":false},{"L":"H","t":"Ironically, for centuries the English considered these animals as vermin. Even 50 years ago gamekeepers were killing as many as 10,000 a year thinking they were no more than bird-egg-eating pests. In some places today, scientists are coming to the same conclusions all over again. In the 1970s, hedgehogs were introduced to the Hebrides Islands off Scotland to help combat garden slugs. With no natural enemies there, a few hedgehogs soon turned into thousands. Wildlife researchers have watched the hedgehogs reduce the numbers of rare ground - nesting wading birds by feasting on their eggs. Efforts to cull the animals in the past two years have upset Britain’s conservationists who have countered with strategies to relocate the animals.","foot":false}],"groups":[{"a":1,"b":9,"k":"para","instr":["The reading passage has eight sections, A–H.","Which sections contain the following information?","Write the correct letter, A–H, in boxes 1–9 on your answer sheet.","NB You may use any letter more than once."],"items":[{"n":1,"t":"The significance of establishing the relationship between different species.","opts":[]},{"n":2,"t":"The different habitats where hedgehogs can be found.","opts":[]},{"n":3,"t":"The reason why standard forms of measurement cannot be used for the hedgehog.","opts":[]},{"n":4,"t":"A problem associated with hedgehogs kept as pets.","opts":[]},{"n":5,"t":"Two reasons why hedgehogs are popular with people in the UK.","opts":[]},{"n":6,"t":"Four findings from the latest research into hedgehogs.","opts":[]},{"n":7,"t":"The social habits of the hedgehog.","opts":[]},{"n":8,"t":"The number of hedgehog species already identified.","opts":[]},{"n":9,"t":"The name given to baby hedgehogs.","opts":[]}],"opts":[{"k":"A","t":""},{"k":"B","t":""},{"k":"C","t":""},{"k":"D","t":""},{"k":"E","t":""},{"k":"F","t":""},{"k":"G","t":""},{"k":"H","t":""}],"ctx":[]},{"a":10,"b":13,"k":"mcq","instr":["Choose the correct answer A, B, C or D.","Write the correct letter in boxes 10–13 on your answer sheet."],"items":[{"n":10,"t":"The study conducted in 1977 revealed a possible reason why","opts":[{"k":"A","t":"hedgehogs clean their quills."},{"k":"B","t":"hedgehogs chew poisonous animal skins."},{"k":"C","t":"adult hedgehogs do not leap into the air."},{"k":"D","t":"young hedgehogs make a high-pitched noise."}]},{"n":11,"t":"In Britain, which of the following has NOT been done to protect hedgehogs?","opts":[{"k":"A","t":"The opening of hospitals just for hedgehogs."},{"k":"B","t":"Imposing fines for littering in areas where hedgehogs live."},{"k":"C","t":"The alteration of a container produced by a fast-food chain"},{"k":"D","t":"Alerting people to the potential dangers faced by hedgehogs"}]},{"n":12,"t":"What are the ‘conclusions’ that scientists on the Hebrides Islands have reached again?","opts":[{"k":"A","t":"Hedgehog numbers are declining."},{"k":"B","t":"Hedgehogs pose a threat to other wildlife."},{"k":"C","t":"Hedgehogs can safely be introduced there."},{"k":"D","t":"Hedgehogs can be used effectively as a natural predator."}]},{"n":13,"t":"What would conservationists prefer to do on the Hebrides Islands?","opts":[{"k":"A","t":"Introduce a native predator of hedgehogs."},{"k":"B","t":"Kill a small number of hedgehogs."},{"k":"C","t":"Remove ground-nesting birds."},{"k":"D","t":"Move the hedgehogs elsewhere."}]}],"opts":[],"ctx":[]}],"ans":{"1":{"raw":"B","v":"B","ex":"The significance of establishing the relationship between different species. Answer: B Part of the passage: As one of the most primitive mammals on the planet, the hedge- hog has been helping geneticists understand evolutionary relationships among mam- mals and even uncover secrets of the human genome."},"2":{"raw":"C","v":"C","ex":"The different habitats where hedgehogs can be found. Answer: C Part of the passage: The 14 known species are native to Africa and parts of Asia as well as Europe. Some hibernate through cold winters in the north. Others tolerate desert heat near the equator. Some live in urban areas, adapting well to living in close proximity to humans. Others live in areas that rank among the most remote places on the planet."},"3":{"raw":"F","v":"F","ex":"The reason why standard forms of measurement cannot be used for the hedgehog. Answer: F Part of the passage: Any perceived threat can make them roll up, including the ap- proach of a biologist, so researchers have invented a new measurement for the animals: ball length."},"4":{"raw":"E","v":"E","ex":"A problem associated with hedgehogs kept as pets. Answer: E Part of the passage: Veterinarians trying to understand gum disease in domesticated hedgehogs have concluded that the varied diet of wild hedgehogs gives them more than nutrition-the hard bodies of insects also scrape the hedgehogs’ teeth clean."},"5":{"raw":"A","v":"A","ex":"Two reasons why hedgehogs are popular with people in the UK. Answer: A Part of the passage: As for the developers, they have reason to think the animals will help make home sales fantastic, too. Part of the attraction is that many people simply love hedgehogs, particularly in Britain, where children’s book writer Beatrix Potter in- troduced Mrs. Tiggy-Winkle, a hedgehog character, over a century ago. But part of the attraction is also rooted in science. Studies have helped make clear that hedgehogs are good for gardens, eating vast numbers of slugs and other pests as they forage in the vegetation at night. Explanation: Two reasons: 1. British people simply love hedgehogs; 2. These animals are also good for gardens."},"6":{"raw":"B","v":"B","ex":"Four findings from the latest research into hedgehogs. Answer: B Part of the passage: Recent scientific studies about hedgehogs have helped explain mysteries as varied as why hedgehogs apply saliva to their entire bodies, how they have survived on the planet for 30 million years, why they chew toxic toad skins and what secrets they may hold about evolution."},"7":{"raw":"D","v":"D","ex":"The social habits of the hedgehog. Answer: D Part of the passage: Hedgehogs spend much of their time alone, but Reeve says it would be a mistake to think of them as solitary. Hedgehogs do approach each other and can detect the presence of others by their scent,’ he says. It is true that they usually do not interact at close quarters, but that does not mean they are unaware of their neigh- bours They may occasionally scrap over food items and rival males attracted to a female may also have aggressive interactions."},"8":{"raw":"C","v":"C","ex":"The number of hedgehog species already identified. Answer: C Part of the passage: For one thing, scientists think they haven’t even discovered all the hedgehog species. We know of at least 14,’ says hedgehog researcher Nigel Reeve of Britain’s University of Surrey Roehampton."},"9":{"raw":"D","v":"D","ex":"The name given to baby hedgehogs. Answer: D Part of the passage: Still, it’s fair to say that, in adulthood, hedgehogs meet primarily to mate, producing litters of four or five hoglets as often as twice yearly."},"10":{"raw":"B hedgehogs chew poisonous animal skins.","v":"B","ex":"The study conducted in 1977 revealed a possible reason why Answer: B hedgehogs chew poisonous animal skins. Part of the passage [Par F]: Evidence suggests that hedgehogs may also add un- pleasant chemicals to their quills to make them even less appealing. In behaviour that may be unique for a vertebrate, they chew substances laden with toxins and then apply frothy saliva to their entire bodies….volunteers pricked themselves with quills from hedgehogs that had coated themselves after chewing on venomous toad skins. The volunteers found those quills much more imitating and painful than clean ones."},"11":{"raw":"B Imposing fines for littering in areas where hedgehogs live.","v":"B","ex":"In Britain, which of the following has NOT been done to protect hedge- hogs? Answer: B Imposing fines for littering in areas where hedgehogs live. Explanation: This is a slightly more challenging question as you have to find the option which is NOT given in the passage. For this, you need to find all three which are true according to the passage. This can be time-consuming, but that’s the only way. Luckily, the main idea of Par G is about how the British went about protecting these hedgehogs. A The opening of hospitals just for hedgehogs. - [Par G] To help combat the decline, the British have established special clinics for injured hedgehogs C The alteration of a container produced by a fast-food chain. - [Par G] Recently, they even persuaded McDonald’s to alter the packaging of its McFlurry ice-cream container, which had been trapping foraging hedgehogs. D Alerting people to the potential dangers faced by hedgehogs - [Par G] ...urged that anyone making a bonfire check for the animals underneath first, and ensured that hedgehogs can cope with cattle grids."},"12":{"raw":"B Hedgehogs pose a threat to other wildlife.","v":"B","ex":"What are the ‘conclusions’ that scientists on the Hebrides Islands have reached again? Answer: B Hedgehogs pose a threat to other wildlife. Part of the passage [Par H]: In some places today, scientists are coming to the same conclusions... hedgehogs were introduced to the Hebrides Islands... Wildlife researchers have watched the hedgehogs reduce the numbers of rare ground - nesting wading birds by feasting on their eggs."},"13":{"raw":"D Move the hedgehogs elsewhere.","v":"D","ex":"What would conservationists prefer to do on the Hebrides Islands? Answer: D Move the hedgehogs elsewhere."}},"words":[{"w":"Spiny","pos":"adj","def":"covered with spines (long sharp points like needles)","lvl":"","ex":"A spiny cactus","ar":"شائك"},{"w":"Forage","pos":"v","def":"to go from place to place searching, especially for food","lvl":"","ex":"The children had been living on the streets, foraging for scraps and sleeping rough","ar":"يبحث عن الطعام"},{"w":"Primitive","pos":"adj","def":"relating to human society at a very early stage of development, with people living in a simple way without machines or a writing system","lvl":"C1","ex":"Primitive races colonized these islands 2000 years ago","ar":"بدائي"},{"w":"Uncover","pos":"v","def":"to discover something secret or hidden or remove something covering something else","lvl":"C1","ex":"The investigation uncovered evidence of a large-scale illegal trade in wild birds","ar":"يكشف"},{"w":"Hibernate","pos":"v","def":"(of some animals) to spend the winter sleeping","lvl":"","ex":"The turtle hibernates in a shallow burrow for six months of the year","ar":"يُسبت (ينام شتاءً)"},{"w":"Scarp","pos":"v","def":"to get rid of something that is no longer useful or wanted, often using its parts in new ways","lvl":"C2","ex":"Hundreds of nuclear weapons have been scrapped","ar":"يتخلّص من"},{"w":"Retract","pos":"v","def":"to take back an offer or statement or admit that a statement was false","lvl":"","ex":"When questioned on TV, the minister retracted his allegations","ar":"يسحب / يطوي"},{"w":"Perceive","pos":"v","def":"to see something or someone, or to notice something that is obvious","lvl":"C2","ex":"Bill perceived a tiny figure in the distance","ar":"يدرك / يلاحظ"},{"w":"Appealing","pos":"adj","def":"attractive or interesting","lvl":"","ex":"The idea of not having to get up early every morning is rather appealing","ar":"جذّاب"},{"w":"Take toll on something","pos":"v","def":"to harm or damage someone or something, especially in a gradual way","lvl":"","ex":"The recession has taken a heavy toll","ar":"يُلحق ضررًا تدريجيًا بـ"},{"w":"Cope with","pos":"v","def":"to dal successfully with a difficult situation","lvl":"B2","ex":"It must be difficult to cope with three small children and a job","ar":"يتأقلم مع"},{"w":"Counter","pos":"v","def":"to react to something with an opposing opinion or action, or to defend yourself against something","lvl":"","ex":"The prime minister countered the opposition’s claims about health service cuts by saying that the government has increased spending in this area.","ar":"يواجه / يتصدّى لـ"}]},{"n":14,"pp":2,"title":"The house of the future, then and now","untitled":false,"intro":null,"paras":[{"L":"A","t":"The term ‘home of tomorrow’ first came into usage in the 1920s to describe the ‘ideal house for future living (Corn and Horrigan, 1984, p. 62). It quickly emerged as a cultural symbol for the American obsession with the single-family dwelling. In the 1930s and 1940s, advertisers and promoters picked up the concept, and a number of full-scale homes of tomorrow traveled through fairs and department stores. It was in this same era that American consumer culture was consolidated. In the 1920s, there were three competing conceptions of the home of the future. The first, indebted to modernist architecture, depicted the home of tomorrow as a futuristic architectural structure. The second conception was that of the mass-produced, prefabricated house, a dwelling potentially available to every North American. These first two failed to capture the imagination and the dollars of industrialists or of the public, but the third image of the home of the future did. From World War Il until the present, the evolving story of the home of the future is a story of the house as a wonderland of gadgets (Horrigan, 1986, p.154).","foot":false},{"L":"B","t":"In the 1950s, the home of the future was represented in and by one room: the kitchen. Appliance manufacturers, advertisers and women’s magazines teamed up to surround women with images of the technology of tomorrow that would ‘automate’ their lives, and automation became a synonym for reduced domestic labor. In 1958, one author predicted ‘Combustion freezers and electric ovens may someday reduce the job of preparing meals to a push-button operation’ (Ross, 1958, pp.197-8). ‘Before long there will also be self-propelled carpet and floor sweepers, automatic ironers that can fold and stack clothing, laundro-matic units that will wash and dry clothes even as these hang in the closet, dishwashers capable of washing and drying dinnerware and storing it in the cupboard, and many additional push-button marvels.’ (Ross, 1958, p. 200)","foot":false},{"L":null,"t":"The postwar faith in and fascination with science is very apparent in future predictions made in the 1950s. The magazine Popular Mechanics did a special feature in February 1950 entitled, ‘Miracles You’ll See in the Next Fifty Years’. ‘Housewives in 50 years may wash dirty dishes-right down the drain! Cheap plastic would melt in hot water’. They also predicted that the housewife of the future would clean her house by simply turning the hose on everything. Furnishings, rugs, draperies and unscratchable floors would all be made of synthetic fabric or waterproof plastic. After the water had run down a drain in the middle of the floor (later concealed by a rug of synthetic fibre) you would turn on a blast of hot air and dry everything.","foot":false},{"L":null,"t":"The overriding message of the 1950s vision of the house of the future is that one can access the wonders of the future through the purchase of domestic technology today. In an October 1957 issue of Life magazine, the built-in appliances from Westinghouse reflect the ‘shape of tomorrow’. ‘Put them in your home suddenly you’re living in the future.’ As Corn and Horrigan (1984) noted, ‘by focusing on improving technology … the future becomes strictly a matter of things, their invention, improvement, and acquisition’ (p. 11).","foot":false},{"L":"C","t":"What is most striking in the 1960s home of the future is the recognition and incorporation of social and political turmoil into the representation of domestic technology. Technology moves out of the kitchen and spreads to the living room, bedroom and bathroom, While the home of the future was still a wonderland of gadgets, who was using the gadgets, why, and to what effect, was finally being opened up to possible alternatives. Whirlpool dishwashers ran an advertisement in November 1968 in Ladies’ Home Journal explaining, ‘How Whirlpool made my husband a man again’. Readers learned of the crisis of masculinity that can take place if a man helps with the housework. We learn that Barry is a great son, father and husband. He believed that the scrubbing of pots and pans was man’s work and so he helped out at home. However, at work the men that work for him used to laugh behind his back because his hands were rough and red. The Whirlpool two-speed dishwasher stopped all that. Thus, a household appliance can preserve a man’s masculinity by ensuring that he does not have to do ‘women’s work’ in the home.","foot":false},{"L":"D","t":"The broader social context continued to be reflected in the 1970s home of the future, but now the trend was to look backwards for the future, back to a proud pioneer heritage. In stark contrast to the 1950s, ‘old-fashioned’ is no longer used in a pejorative way: it is seen as a cherished value. Over the 1970s, North America experienced a certain erosion of trust in science and technology and there was less utopian speculation about the technologically produced future. The previous unproblematic link between technology, the future and progress was being questioned (Corn, 1986).","foot":false},{"L":null,"t":"From the space-age metals of the 1960s where every object had an electrical cord, we find a return to the traditional. Ideal homes featured wood, inside and out, and an increased emphasis on windows. Domestic technologies were not featured as prominently, and the modernist or ultra-modernist designs of a few years earlier were all but gone. The use of wood, combined with the use of windows, worked to blur the line between outside and inside, bringing the outside into inner or domestic space.","foot":false},{"L":null,"t":"We also see the influence of the Green movement, such as in the deployment of technology for solar-heated homes. The energy crisis was making itself felt, reflecting fears about a future not quite as rosy as that predicted by Popular Mechanics in 1950. Whereas in the 1960s the General Electric Company was exhorting consumers to ‘LiveElectrically’, in the 1970s, the Edison Electric Company found it necessary to address the energy crisis directly in their advertisements.","foot":false},{"L":"E","t":"In 1978, House Beautiful magazine, predicting what the homes of the 1980s would be like, suggested that self - indulgence was the wave of the future. ‘Our senses are awakened, and a new technology is waiting to aid us in giving them a free rein. Bathroom spas and gyms, computerized kitchens, wide screen entertainment, even home discotheques are all on the way.’ By the 1980s, the environmental and social movements of the 1970s were starting to ebb, significantly more women were working outside of the home, and computer technology was becoming more of a reality in the household. All these trends opened the door for a renewed love of technology.","foot":false},{"L":null,"t":"The line between work and leisure became blurred in the 1980s. Forget about not being able to fit exercise into a hectic workday, in 1982, you can work and work out simultaneously. The Walking Desk, a computer workstation for the office at home, has a treadmill, stationary bike and stair climber installed underneath. On her most productive day, a worker should be able to walk four to five miles and burn as many as fifteen hundred calories while maintaining a normal workload.The desk will also come with a compact-disc player and color monitor for viewing nature scenes on a computer break. Thus, in addition to turning exercise into work, we see that nature is being brought into the home for breaks. One never has to leave the home, but the imperative is still clearly productive.","foot":false}],"groups":[{"a":14,"b":18,"k":"head","instr":["The reading passage has five sections, A–E.","Choose the correct heading for each section from the list of headings below.","Write the correct number, i–viii, in boxes 14–18 on your answer sheet."],"items":[{"n":14,"t":"Section A","opts":[]},{"n":15,"t":"Section B","opts":[]},{"n":16,"t":"Section C","opts":[]},{"n":17,"t":"Section D","opts":[]},{"n":18,"t":"Section E","opts":[]}],"opts":[{"k":"i","t":"Outdoor spaces in the house of tomorrow"},{"k":"ii","t":"The house of the future helps with the battle of the sexes"},{"k":"iii","t":"The compact home of tomorrow"},{"k":"iv","t":"The multipurpose home of tomorrow"},{"k":"v","t":"Housework declines in the house of the future"},{"k":"vi","t":"Mixed success for visions of the future"},{"k":"vii","t":"The future lies in the past"},{"k":"viii","t":"A change of structure in the home of tomorrow"}],"ctx":[],"optTitle":"List of headings"},{"a":19,"b":26,"k":"match","instr":["Look at the following list of statements (questions 19–26)","Match each statement or prediction with the correct time period, A–E.","Write the correct letter, A–E, in boxes 19–26 on your answer sheet.","NB You may use any letter more than once."],"items":[{"n":19,"t":"There was a loss of faith in automation.","opts":[]},{"n":20,"t":"Advertisers believed that houses would be made in a factory.","opts":[]},{"n":21,"t":"There were fewer housewives.","opts":[]},{"n":22,"t":"One writer envisaged furniture being made from fully washable materials.","opts":[]},{"n":23,"t":"There was an increased awareness of the environment.","opts":[]},{"n":24,"t":"There was a link between our interest in the future and increased consumerism.","opts":[]},{"n":25,"t":"One magazine predicted that disposable plates would be used.","opts":[]},{"n":26,"t":"A new expression for ‘the perfect home’ was introduced.","opts":[]}],"opts":[{"k":"A","t":"1920s"},{"k":"B","t":"1930s and 1940s"},{"k":"C","t":"1950s"},{"k":"D","t":"1970s"},{"k":"E","t":"1980s"}],"ctx":[],"optTitle":"List of time periods"}],"ans":{"14":{"raw":"VI Mixed success for visions of the future","v":"vi","ex":"Section A Answer: VI Mixed success for visions of the future Part of the passage: In the 1920s, there were three competing conceptions of the home of the future. ...These first two failed to capture the imagination and the dollars of industrialists or of the public, but the third image of the home of the future did. Explanation: Visions = conceptions; mixed success = two failed, one succeeded."},"15":{"raw":"V Housework declines in the house of the future","v":"v","ex":"Section B Answer: V Housework declines in the house of the future Part of the passage: In the 1950s, the home of the future was represented in and by one room: the kitchen. Appliance manufacturers, advertisers and women’s magazines teamed up to surround women with images of the technology of tomorrow that would ‘automate’ their lives, and automation became a synonym for reduced domestic labor."},"16":{"raw":"II The house of the future helps with the battle of the sexes","v":"ii","ex":"Section C Answer: II The house of the future helps with the battle of the sexes Part of the passage: The Whirlpool two-speed dishwasher stopped all that. Thus, a household appliance can preserve a man’s masculinity by ensuring that he does not have to do ‘women’s work’ in the home."},"17":{"raw":"VII The future lies in the past","v":"vii","ex":"Section D Answer: VII The future lies in the past Part of the passage: The broader social context continued to be reflected in the 1970s home of the future, but now the trend was to look backwards for the future, back to a proud pioneer heritage."},"18":{"raw":"IV The multipurpose home of tomorrow","v":"iv","ex":"Section E Answer: IV The multipurpose home of tomorrow Part of the passage: Thus, in addition to turning exercise into work, we see that nature is being brought into the home for breaks. One never has to leave the home, but the imperative is still clearly productive."},"19":{"raw":"D 1970s","v":"D","ex":"There was a loss of faith in automation. Answer: D 1970s Part of the passage [Par D]: Over the 1970s, North America experienced a certain erosion of trust in science and technology and there was less utopian speculation about the technologically produced future. The previous unproblematic link between technology, the future and progress was being questioned."},"20":{"raw":"A 1920s","v":"A","ex":"Advertisers believed that houses would be made in a factory. Answer: A 1920s Part of the passage [Par A]: In the 1920s, there were three competing conceptions of the home of the future. The first, indebted to modernist architecture, depicted the home of tomorrow as a futuristic architectural structure. The second conception was that of the mass-produced, prefabricated house, a dwelling potentially available to every North American."},"21":{"raw":"E 1980s","v":"E","ex":"There were fewer housewives. Answer: E 1980s Part of the passage [Par E]: By the 1980s, the environmental and social movements of the 1970s were starting to ebb, significantly more women were working outside of the home."},"22":{"raw":"C 1950s","v":"C","ex":"One writer envisaged furniture being made from fully washable materials. Answer: C 1950s Part of the passage [Par B]: The postwar faith in and fascination with science is very apparent in future predictions made in the 1950s. The magazine Popular Mechanics did a special feature in February 1950 entitled, ‘Miracles You’ll See in the Next Fifty Years’. ‘Housewives in 50 years may wash dirty dishes-right down the drain! Cheap plas- tic would melt in hot water’. They also predicted that the housewife of the future would clean her house by simply turning the hose on everything. Furnishings, rugs, draperies and unscratchable floors would all be made of synthetic fabric or waterproof plastic.After the water had run down a drain in the middle of the floor (later concealed by a rug of synthetic fibre) you would turn on a blast of hot air and dry everything."},"23":{"raw":"D 1970s","v":"D","ex":"There was an increased awareness of the environment. Answer: D 1970s Part of the passage [Par D]: We also see the influence of the Green movement, such as in the deployment of technology for solar-heated homes. The energy crisis was making itself felt, reflecting fears about a future not quite as rosy as that predicted by Popular Mechanics in 1950. Whereas in the 1960s the General Electric Company was exhorting consumers to ‘Live Electrically’, in the 1970s, the Edison Electric Company found it necessary to address the energy crisis directly in their advertisements."},"24":{"raw":"C 1950s","v":"C","ex":"There was a link between our interest in the future and increased consumerism. Answer: C 1950s Part of the passage [Par B]: The overriding message of the 1950s vision of the house of the future is that one can access the wonders of the future through the purchase of domestic technology today. ‘by focusing on improving technology … the future becomes strictly a matter of things, their invention, improvement, and acquisition’."},"25":{"raw":"C 1950s","v":"C","ex":"One magazine predicted that disposable plates would be used. Answer: C 1950s Part of the passage [Par B]: The magazine Popular Mechanics did a special feature in February 1950 entitled, ‘Miracles You’ll See in the Next Fifty Years’. ‘Housewives in 50 years may wash dirty dishes-right down the drain! Cheap plastic would melt in hot water’."},"26":{"raw":"A 1920s","v":"A","ex":"A new expression for ‘the perfect home’ was introduced. Answer: A 1920s Part of the passage [Par A]: The term ‘home of tomorrow’ first came into usage in the 1920s to describe the ‘ideal house for future living."}},"words":[{"w":"Obsession","pos":"n","def":"something or someone that you think about all the time","lvl":"B2","ex":"An unhealthy obsession with death","ar":"هوس"},{"w":"Consolidate","pos":"v","def":"to become or cause something to become stronger, and more certain","lvl":"","ex":"The success of their major product consolidated the firm’s position in the market","ar":"يعزّز / يرسّخ"},{"w":"Futuristic","pos":"adj","def":"strange and very modern, or intended or seeming to come from some imagined time in the future","lvl":"","ex":"Her latest novel is a futuristic thriller, set some time in the late 21st century","ar":"مستقبلي"},{"w":"Indebted to","pos":"v","def":"grateful because of help given","lvl":"","ex":"We are deeply indebted to you for your help","ar":"مدين بالفضل لـ"},{"w":"Dwelling","pos":"n","def":"a house or place to live in","lvl":"","ex":"There is an estimated shortfall five million dwellings across the country","ar":"مسكن"},{"w":"Team up","pos":"v","def":"to join another person, or form a group with other people, in order to do something together","lvl":"","ex":"They teamed up for a charity performance","ar":"يتعاون مع"},{"w":"Overriding","pos":"adj","def":"more important than anything else","lvl":"","ex":"The government’s overriding concern is to reduce inflation","ar":"الأهم من كل شيء"},{"w":"Striking","pos":"adj","def":"very unusual or easily noticed, and therefore attracting a lot of attention","lvl":"B2","ex":"She bears a striking resemblance to her mother","ar":"لافت"},{"w":"Pejorative","pos":"adj","def":"disapproving or suggesting that something is not good or is of no importance","lvl":"","ex":"Make sure students realize that “fat” is a pejorative word","ar":"تحقيري"},{"w":"Cherish","pos":"v","def":"to love, protect and care for someone or something that is important to you","lvl":"","ex":"Although I cherish my children, I do allow them their independence","ar":"يعتزّ بـ"},{"w":"Prominently","pos":"adv","def":"describes something that is in a position in which it is easily noticed","lvl":"C2","ex":"New books are displayed in a prominent position on tables at the front of the shop","ar":"بشكل بارز"},{"w":"Self-indulgence","pos":"n","def":"allowing yourself to have or do anything that you enjoy","lvl":"","ex":"I know its self-indulgence of me, but I will just have another chocolate","ar":"الانغماس في الملذّات"},{"w":"Free rein","pos":"n","def":"the freedom to do, say or feel what you want","lvl":"","ex":"The young film-makers were given free rein to experiment with new themes and techniques","ar":"حرية تامة"},{"w":"Hectic","pos":"adj","def":"full of activity, or very busy and fast","lvl":"C1","ex":"A hectic schedule","ar":"محموم / مزدحم"},{"w":"Workload","pos":"n","def":"the amount of work to be done, especially by a particular person or machine in a period of time","lvl":"","ex":"Teachers are always complaining about their heavy workloads","ar":"عبء العمل"}]},{"n":15,"pp":3,"title":"First words","untitled":false,"intro":"There are over 6, 000 different languages today, but how did language evolve in the first place?","paras":[{"L":null,"t":"Pinpointing the origin of language might seem like idle speculation, because sound does not fossilise. However, music, chit-chat and even humor may have been driving forces in the evolution of language, and gossip possibly freed our ancestors from sitting around wondering what to say next.","foot":false},{"L":null,"t":"There are over 6,000 different languages today, and the main language families are thought to have arisen as modern humans wandered about the globe in four great migrations beginning 100,000 years ago. But how did language evolve in the first place? Potential indicators of early language are written in our genetic code, behavior and culture. The genetic evidence is a gene called FOXP2, in which mutations appear to be responsible for speech defects. FOXP2 in humans differs only slightly from the gene in chimpanzees, and may be about 200,000 years old, slightly older than the earliest modern humans. Such a recent origin for language seems at first rather silly. How could our speechless Homo sapiens ancestors colonize the ancient world, spreading from Africa to Asia, and perhaps making a short sea-crossing to Indonesia, without language? Well, language can have two meanings: the infinite variety of sentences that we string together, and the pointing and grunting communication that we share with other animals.","foot":false},{"L":null,"t":"Marc Hauser (Harvard University) and colleagues argue that the study of animal behavior and communication can teach us how the faculty of language in the narrow human sense evolved. Other animals don’t come close to understanding our sophisticated thought processes. Nevertheless, the complexity of human expression may have started off as simple stages in animal ‘thinking’ or problem-solving. For example, number processing (how many lions are we up against?), navigation (time to fly south for the winter), or social relations (we need teamwork to build this shelter). In other words, we can potentially track language by looking at the behavior of other animals. William Noble and lain Davidson (University of New England) look for the origin of language in early symbolic behavior and the evolutionary selection in fine motor control. For example, throwing and making stone tools could have developed into simple gestures like pointing that eventually entailed a sense of self-awareness. They argue that language is a form of symbolic communication that has its roots in behavioral evolution. Even if archaic humans were physically capable of speech (a hyoid bone for supporting the larynx and tongue has been found in a Neanderthal skeleton), we cannot assume symbolic communication. They conclude that language is a feature of anatomically modern humans, and an essential precursor of the earliest symbolic pictures in rock art, ritual burial, major sea-crossings, structured shelters and hearths-all dating, they argue, to the last 100,000 years.","foot":false},{"L":null,"t":"But the archaeological debate of when does not really help us with what was occurring in those first chats. Robin Dunbar (University of Liverpool) believes they were probably talking about each other-in other words, gossiping. He discovered a relationship between an animal’s group size and its neocortex (the thinking part of the brain), and tried to reconstruct grooming times and group sizes for early humans based on overall size of fossil skulls. Dunbar argues that gossip provides the social glue permitting humans to live in cohesive groups up to the size of about 150, found in population studies among hunter-gatherers, personal networks and corporate organizations. Apes are reliant on grooming to stick together, and that basically constrains their social complexity to groups of 50. Gelada baboons stroke and groom each other for several hours per day. Dunbar thus concludes that, if humans had no speech faculty, we would need to devote 40 per cent of the day to physical grooming, just to meet our social needs.","foot":false},{"L":null,"t":"Humans manage large social networks by ‘verbal grooming’ or gossiping- chatting with friends over coffee, for example. So the ‘audience’ can be much bigger than for grooming or one-on-one massage. Giselle Bastion, who recently completed her PhD at Flinders University, argues that gossip has acquired a bad name, being particularly associated with women and opposed by men who are defending their supposedly objective world. Yet it’s no secret that men gossip too. We are all bent on keeping track of other people and maintaining alliances. But how did we graduate from grooming to gossip? Dunbar notes that just as grooming releases opiates that create a feeling of wellbeing in monkeys and apes, so do the smiles and laughter associated with human banter.","foot":false},{"L":null,"t":"Dean Falk (Florida State University) suggests that, before the first smattering of language there was motherese, that musical gurgling between a mother and her baby, along with a lot of eye contact and touching. Early human babies could not cling on to their mother as she walked on two feet, so motherese evolved to soothe and control infants. Motherese is a small social step up from the contact calls of primates, but at this stage grooming probably still did most of the bonding.","foot":false},{"L":null,"t":"So when did archaic human groups get too big to groom each other? Dunbar suggests that nomadic expansion out of Africa, maybe 500,000 years ago, demanded larger group sizes and language sophistication to form the various alliances necessary for survival. Davidson and Noble, who reject Dunbar’s gossip theory, suggest that there was a significant increase in brain size from about 400,000 years ago, and this may correlate with increasing infant dependence. Still, it probably took a long time before a mother delivered humanity’s maiden speech. Nevertheless. once the words were out, and eventually put on paper, they acquired an existence of their own. Reading gossip magazines and newspapers today is essentially one-way communication with total strangers - a far cry from the roots of language.","foot":false}],"groups":[{"a":27,"b":31,"k":"mcq","instr":["Choose the correct answer A, B, C or D.","Write the correct letter in boxes 27–31 on your answer sheet."],"items":[{"n":27,"t":"In paragraph 1, the writer uses the term ‘idle speculation’ to refer to the study of","opts":[{"k":"A","t":"why people began to use music."},{"k":"B","t":"where language first evolved."},{"k":"C","t":"when people began to talk."},{"k":"D","t":"how humor first began."}]},{"n":28,"t":"What does the writer tell us about FOXP2?","opts":[{"k":"A","t":"It helps prevent speech problems."},{"k":"B","t":"It is the same in chimpanzees as in humans."},{"k":"C","t":"It could have first occurred 100,000 years ago."},{"k":"D","t":"It could have first occurred 200,000 years ago."}]},{"n":29,"t":"In paragraph 2, what notion does the writer refer to as being ‘rather silly’?","opts":[{"k":"A","t":"That language began such a long time ago."},{"k":"B","t":"That man could travel around the world unable to talk."},{"k":"C","t":"That chimpanzees may have been able to talk."},{"k":"D","t":"That communication between chimpanzees pre-dates man."}]},{"n":30,"t":"Why does the writer refer to ‘lions’ in paragraph 3?","opts":[{"k":"A","t":"To illustrate the type of communication needs faced by early man."},{"k":"B","t":"To indicate how vulnerable early man was to predators."},{"k":"C","t":"To provide evidence of other species existing at the same time."},{"k":"D","t":"To show the relationship between early humans and other animals."}]},{"n":31,"t":"Gelada baboons are mentioned in order to show that","opts":[{"k":"A","t":"using grooming to form social bonds limits the size of a social group."},{"k":"B","t":"early humans would probably have lived in groups of up to 50."},{"k":"C","t":"baboons’ social groups are larger than those of early humans."},{"k":"D","t":"baboons spend 40 per cent of their time grooming each other."}]}],"opts":[],"ctx":[]},{"a":32,"b":40,"k":"match","instr":["Look at the following statements (questions 32-40) below and the list of people.","Match each statement with the correct person or people, A–E.","Write the correct letter, A–E, in boxes 32–40 on your answer sheet.","NB You may use any letter more than once."],"items":[{"n":32,"t":"There is physical evidence of increased human intelligence up to 400,000 years ago.","opts":[]},{"n":33,"t":"In the modern world, gossiping is seen in a negative way.","opts":[]},{"n":34,"t":"Language must have developed before art and travel.","opts":[]},{"n":35,"t":"The development of human language can be gauged by studying other species.","opts":[]},{"n":36,"t":"Gossiping makes humans feel good.","opts":[]},{"n":37,"t":"The actions of early humans could have evolved into a form of communication.","opts":[]},{"n":38,"t":"The first language emerged through a parent talking to an infant.","opts":[]},{"n":39,"t":"Gossip was the first purpose of human communication.","opts":[]},{"n":40,"t":"Early humans used language to help them live together.","opts":[]}],"opts":[{"k":"A","t":"Hauser"},{"k":"B","t":"Noble and Davidson"},{"k":"C","t":"Dunbar"},{"k":"D","t":"Bastion"},{"k":"E","t":"Falk"}],"ctx":[],"optTitle":"List of people"}],"ans":{"27":{"raw":"C when people began to talk.","v":"C","ex":"In paragraph 1, the writer uses the term ‘idle speculation’ to refer to the study of Answer: C when people began to talk. Part of the passage: Pinpointing the origin of language might seem like idle speculation, because sound does not fossilise."},"28":{"raw":"D It could have first occurred 200,000 years ago.","v":"D","ex":"What does the writer tell us about FOXP2? Answer: D It could have first occurred 200,000 years ago. Part of the passage: FOXP2 in humans differs only slightly from the gene in chimpan- zees, and may be about 200,000 years old, slightly older than the earliest modern hu- mans."},"29":{"raw":"B That man could travel around the world unable to talk.","v":"B","ex":"In paragraph 2, what notion does the writer refer to as being ‘rather silly’? Answer: B That man could travel around the world unable to talk. Part of the passage: How could our speechless Homo sapiens ancestors colonize the ancient world, spreading from Africa to Asia, and perhaps making a short sea-crossing to Indonesia, without language?"},"30":{"raw":"A To illustrate the type of communication needs faced by early man.","v":"A","ex":"Why does the writer refer to ‘lions’ in paragraph 3? Answer: A To illustrate the type of communication needs faced by early man. Part of the passage: Nevertheless, the complexity of human expression may have start- ed off as simple stages in animal ‘thinking’ or problem-solving. For example, number processing (how many lions are we up against?)..."},"31":{"raw":"A using grooming to form social bonds limits the size of a social group.","v":"A","ex":"Gelada baboons are mentioned in order to show that Answer: A using grooming to form social bonds limits the size of a social group. Part of the passage: Apes are reliant on grooming to stick together, and that basically constrains their social complexity to groups of 50."},"32":{"raw":"B Noble and Davidson","v":"B","ex":"There is physical evidence of increased human intelligence up to 400,000 years ago. Answer: B Noble and Davidson Part of the passage: Davidson and Noble, who reject Dunbar’s gossip theory, suggest that there was a significant increase in brain size from about 400,000 years ago, and this may correlate with increasing infant dependence."},"33":{"raw":"D Bastion","v":"D","ex":"In the modern world, gossiping is seen in a negative way. Answer: D Bastion Part of the passage: Giselle Bastion, who recently completed her PhD at Flinders University, argues that gossip has acquired a bad name, being particularly associated with women and opposed by men who are defending their supposedly objective world."},"34":{"raw":"B Noble and Davidson","v":"B","ex":"Language must have developed before art and travel. Answer: B Noble and Davidson Part of the passage: William Noble and lain Davidson … conclude that language is a feature of anatomically modern humans, and an essential precursor of the earliest symbolic pictures in rock art, ritual burial, major sea-crossings, structured shelters and hearths-all dating, they argue, to the last 100,000 years."},"35":{"raw":"A Hauser","v":"A","ex":"The development of human language can be gauged by studying other species. Answer: A Hauser Part of the passage: Marc Hauser (Harvard University) and colleagues argue that the study of animal behavior and communication can teach us how the faculty of language in the narrow human sense evolved. Other animals don’t come close to understanding our sophisticated thought processes. Nevertheless, the complexity of human expression may have started off as simple stages in animal ‘thinking’ or problem-solving. For ex- ample, number processing (how many lions are we up against?), navigation (time to fly south for the winter), or social relations (we need teamwork to build this shelter). In other words, we can potentially track language by looking at the behavior of other animals."},"36":{"raw":"C Dunbar","v":"C","ex":"Gossiping makes humans feel good. Answer: C Dunbar Part of the passage: Dunbar notes that just as grooming releases opiates that create a feeling of wellbeing in monkeys and apes, so do the smiles and laughter associated with human banter."},"37":{"raw":"B Noble and Davidson","v":"B","ex":"The actions of early humans could have evolved into a form of communication. Answer: B Noble and Davidson Part of the passage: William Noble and lain Davidson (University of New England) look for the origin of language in early symbolic behavior and the evolutionary selection in fine motor control. For example, throwing and making stone tools could have developed into simple gestures like pointing that eventually entailed a sense of self-awareness. They argue that language is a form of symbolic communication that has its roots in behavioral evolution."},"38":{"raw":"E Falk","v":"E","ex":"The first language emerged through a parent talking to an infant. Answer: E Falk Part of the passage: Dean Falk (Florida State University) suggests that, before the first smattering of language there was motherese, that musical gurgling between a mother and her baby, along with a lot of eye contact and touching."},"39":{"raw":"C Dunbar","v":"C","ex":"Gossip was the first purpose of human communication. Answer: C Dunbar Part of the passage: Robin Dunbar (University of Liverpool) believes they were proba- bly talking about each other-in other words, gossiping."},"40":{"raw":"C Dunbar","v":"C","ex":"Early humans used language to help them live together. Answer: C Dunbar Part of the passage: Dunbar argues that gossip provides the social glue permitting hu- mans to live in cohesive groups up to the size of about 150, found in population studies among hunter-gatherers, personal networks and corporate organizations."}},"words":[{"w":"Pinpoint","pos":"v","def":"to discover or describe the exact facts about something","lvl":"C2","ex":"Emergency workers at the site are still unable to pinpoint the cause of the explosion","ar":"يحدّد بدقة"},{"w":"Idle","pos":"adj","def":"without any particular purpose","lvl":"C2","ex":"There is no idle threat","ar":"عبثي / بلا هدف"},{"w":"Speculation","pos":"n","def":"the activity of guessing possible answers to a question without having enough information to be certain","lvl":"C1","ex":"Rumors that they are about to marry have been dismissed as pure speculation","ar":"تخمين"},{"w":"Infinite","pos":"adj","def":"without limits; extremely large or great","lvl":"C2","ex":"An infinite number/variety","ar":"لا نهائي"},{"w":"String together (ph.v)","pos":"","def":"to arrange a group of things into a series","lvl":"","ex":"He can hardly string together, let alone write poetry","ar":"يرتّب / يربط معًا"},{"w":"Sophisticated","pos":"adj","def":"clever in a complicated way and therefore able to do complicated tasks","lvl":"B2","ex":"These are among the most sophisticated weapons in the world","ar":"متطوّر"},{"w":"Entail","pos":"v","def":"to make something necessary, or to involve something","lvl":"","ex":"Such a large investment inevitably entails some risk","ar":"يتطلّب / يستلزم"},{"w":"Precursor","pos":"n","def":"something that happened or existed before another thing, especially if it either developed into it or had an influence on it","lvl":"","ex":"Sulphur dioxide is the main precursor of acid rain","ar":"سلف / مقدّمة لـ"},{"w":"Bent on","pos":"v","def":"to be determined to do or have something","lvl":"","ex":"He was bent on getting married as soon as possible","ar":"عازم على"},{"w":"Cling on","pos":"v","def":"to try very hard to keep something","lvl":"C2","ex":"He clung on to power for another ten years","ar":"يتمسّك بـ"},{"w":"Soothe","pos":"v","def":"to make someone feel calm or less worried","lvl":"","ex":"To soothe a crying baby","ar":"يهدّئ"},{"w":"Correlate with","pos":"v","def":"if two or more facts, numbers, etc. correlate or are correlated, there is a relationship between them","lvl":"","ex":"Stress levels and heart diseases are strongly correlated","ar":"يرتبط بـ"}]},{"n":16,"pp":1,"title":"Going Nowhere Fast","untitled":false,"intro":"THIS is ludicrous! We can talk to people anywhere in the world or fly to meet them in a few hours. We can even send probes to other planets. But when it comes to getting around our cities, we depend on systems that have scarcely changed since the days of Gottlieb Daimler.","paras":[{"L":null,"t":"In recent years, the pollution belched out by millions of vehicles has dominated the debate about transport. The problem has even persuaded California—that home of car culture—to curb traffic growth. But no matter how green they become, cars are unlikely to get us around crowded cities any faster. And persuading people to use trains and buses will always be an uphill struggle. Cars, after all, are popular for very good reasons, as anyone with small children or heavy shopping knows.","foot":false},{"L":null,"t":"So politicians should be trying to lure people out of their cars, not forcing them out. There’s certainly no shortage of alternatives. Perhaps the most attractive is the concept known as personal rapid transit (PRT), independently invented in the US and Europe in the 1950s.","foot":false},{"L":null,"t":"The idea is to go to one of many stations and hop into a computer-controlled car which can whisk you to your destination along a network of guideways. You wouldn’t have to share your space with strangers, and with no traffic lights, pedestrians or parked cars to slow things down, PRT guideways can carry far more traffic, nonstop, than any inner city road.","foot":false},{"L":null,"t":"It’s a wonderful vision, but the odds are stacked against PRT for a number of reasons. The first cars ran on existing roads, and it was only after they became popular—and after governments started earning revenue from them—that a road network designed specifically for motor vehicles was built. With PRT, the infrastructure would have to come first—and that would cost megabucks. What’s more, any transport system that threatened the car’s dominance would be up against all those with a stake in maintaining the status quo, from private car owners to manufacturers and oil multinationals. Even if PRTs were spectacularly successful in trials, it might not make much difference. Superior technology doesn’t always triumph, as the VHS versus Betamax and Windo
