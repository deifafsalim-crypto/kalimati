f the passage: So what happens when, using Khan Academy, you wind up with a ten-year-old who has already mastered high-school physics? Khan’s programmer, Ben Kamens, has heard from teachers who have seen Khan Academy presentations and loved the idea but wondered whether they could modify it “to stop students from becom- ing this advanced.”"}},"words":[{"w":"Peer over","pos":"v","def":"to look carefully or with difficulty","lvl":"C2","ex":"The driver was peering into the distance trying to read the road sign","ar":"يحدّق بتمعّن"},{"w":"Ponder","pos":"v","def":"to think carefully about something, especially for a noticeable length of time","lvl":"C2","ex":"She sat back for a minute to ponder her next move in the game","ar":"يتأمّل"},{"w":"Work out","pos":"v","def":"to understand something or to find the answer to something by thin king about it","lvl":"C2","ex":"There will be a full investigation to work out what caused the accident","ar":"يحلّ / يكتشف"},{"w":"Sheepishly","pos":"adv","def":"embarrassed because you know that you have done something wrong or silly","lvl":"","ex":"She gave me a sheepish smile and apologized","ar":"بخجل"},{"w":"Chattily","pos":"adv","def":"liking to talk a lot in a friendly, informal way","lvl":"C1","ex":"A chatty talk","ar":"بأسلوب ودّي ثرثار"},{"w":"Grapple","pos":"v","def":"to try to deal with or understand a difficult problem or subject","lvl":"","ex":"Today, many Americans are still grappling with the issue of race","ar":"يصارع / يحاول فهم"},{"w":"Frustration","pos":"n","def":"the feeling of being annoyed or less confident because you cannot achieve what you want, or something that makes you feel like this","lvl":"B2","ex":"This job has more than its fair share of frustrations","ar":"إحباط"},{"w":"Tailor","pos":"v","def":"to make or prepare something following particular instructions","lvl":"","ex":"Arrangements can be tailored to meet individual requirements","ar":"يصمّم حسب الحاجة"},{"w":"Overhaul","pos":"v","def":"to repair or improve something so that every part of it works as it should","lvl":"","ex":"I got the engine overhauled","ar":"يُصلح شاملًا"},{"w":"Comprehensive","pos":"adj","def":"complete and including everything that is necessary","lvl":"C1","ex":"We offer you a comprehensive training in all aspects of the business","ar":"شامل"},{"w":"Stumble into","pos":"v","def":"to discover something by chance or to meet someone by chance","lvl":"C2","ex":"Workmen stumbled upon a mosaic while digging foundations for a new building","ar":"يصادف بالصدفة"},{"w":"Enamored","pos":"adj","def":"liking something a lot","lvl":"","ex":"I have to say I am not exactly enamored with this part of the country","ar":"مُعجب جدًا"},{"w":"Unambiguous","pos":"adj","def":"expressed in a way that makes it completely clear what is meant","lvl":"","ex":"The minister promised a clear and unambiguous statement on the future of the coal industry","ar":"واضح لا لبس فيه"}]},{"n":28,"pp":1,"title":"Andrea Palladio: Italian Architect","untitled":false,"intro":null,"paras":[{"L":null,"t":"new exhibition celebrates Palladio’s architecture 500 years on Vicenza is a pleasant, prosperous city in the Veneto, 60 km west of Venice. Its grand families settled and farmed the area from the 16th century. But its principal claim to fame is Andrea Palladio, who is such an influential architect that a neoclassical style is known as Palladian. The city is a permanent exhibition of some of his finest buildings, and as he was born – in Padua, to be precise – 500 years ago, the International Centre for the Study of Palladio’s Architecture has an excellent excuse for mounting la grande mostra, the big show.","foot":false},{"L":null,"t":"The exhibition has the special advantage of being held in one of Palladio’s buildings, Palazzo Barbaran da Porto. Its bold façade is a mixture of rustication and decoration set between two rows of elegant columns. On the second floor the pediments are alternately curved or pointed, a Palladian trademark. The harmonious proportions of the atrium at the entrance lead through to a dramatic interior of fine fireplaces and painted ceilings. Palladio’s design is simple, clear and not over-crowded. The show has been organised on the same principles, according to Howard Burns, the architectural historian who co-curated it.","foot":false},{"L":null,"t":"Palladio’s father was a miller who settled in Vicenza, where the young Andrea was apprenticed to a skilled stonemason. How did a humble miller’s son become a world renowned architect? The answer in the exhibition is that, as a young man, Palladio excelled at carving decorative stonework on columns, doorways and fireplaces. He was plainly intelligent, and lucky enough to come across a rich patron, Gian Giorgio Trissino, a landowner and scholar, who organised his education, taking him to Rome in the 1540s, where he studied the masterpieces of classical Roman and Greek architecture and the work of other influential architects of the time, such as Donato Bramante and Raphael.","foot":false},{"L":null,"t":"Burns argues that social mobility was also important. Entrepreneurs, prosperous from agriculture in the Veneto, commissioned the promising local architect to design their country villas and their urban mansions. In Venice the aristocracy were anxious to co-opt talented artists, and Palladio was given the chance to design the buildings that have made him famous – the churches of San Giorgio Maggiore and the Redentore, both easy to admire because they can be seen from the city’s historical centre across a stretch of water.","foot":false},{"L":null,"t":"He tried his hand at bridges – his unbuilt version of the Rialto Bridge was decorated with the large pediment and columns of a temple – and, after a fire at the Ducal Palace, he offered an alternative design which bears an uncanny resemblance to the Banqueting House in Whitehall in London. Since it was designed by Inigo Jones, Palladio’s first foreign disciple, this is not as surprising as it sounds.","foot":false},{"L":null,"t":"Jones, who visited Italy in 1614, bought a trunk full of the master’s architectural drawings; they passed through the hands of the Dukes of Burlington and Devonshire before settling at the Royal Institute of British Architects in 1894. Many are now on display at Palazzo Barbaran. What they show is how Palladio drew on the buildings of ancient Rome as models. The major theme of both his rural and urban building was temple architecture, with a strong pointed pediment supported by columns and approached by wide steps.","foot":false},{"L":null,"t":"Palladio’s work for rich landowners alienates unreconstructed critics on the Italian left, but among the papers in the show are designs for cheap housing in Venice. In the wider world, Palladio’s reputation has been nurtured by a text he wrote and illustrated, “Quattro Libri dell’Architettura”. His influence spread to St Petersburg and to Charlottesville in Virginia, where Thomas Jefferson commissioned a Palladian villa he called Monticello.","foot":false},{"L":null,"t":"Vicenza’s show contains detailed models of the major buildings and is leavened by portraits of Palladio’s teachers and clients by Titian, Veronese and Tintoretto; the paintings of his Venetian buildings are all by Canaletto, no less. This is an uncompromising exhibition; many of the drawings are small and faint, and there are no sideshows for children, but the impact of harmonious lines and satisfying proportions is to impart in a viewer a feeling of benevolent calm. Palladio is history’s most therapeutic architect.","foot":false},{"L":null,"t":"“Palladio, 500 Anni: La Grande Mostra” is at Palazzo Barbaran da Porto, Vicenza, until January 6th 2009. The exhibition continues at the Royal Academy of Arts, London, from January 31st to April 13th, and travels afterwards to Barcelona and Madrid.","foot":false}],"groups":[{"a":1,"b":7,"k":"tf","instr":["Do the following statements agree with the information given in Readin  Palladio excelled at carving decorative stonework on columns, doorways and fire- places."},"9":{"raw":"Gian Giorgio Trissino","v":"Gian Giorgio Trissino","ex":"Who arranged Palladio’s architectural studies? Answer: Gian Giorgio Trissino Part of the passage: He was plainly intelligent, and lucky enough to come across a rich patron, Gian Giorgio Trissino, a landowner and scholar, who organised his educa- tion, taking him to Rome in the 1540s, where he studied the masterpieces of classical Roman and Greek architecture and the work of other influential architects of the time, such as Donato Bramante and Raphael. Explanation: arranged Palladio’s architertural studies = organised his education."},"10":{"raw":"Inigo Jones","v":"Inigo Jones","ex":"Who was the first non-Italian architect influenced by Palladio? Answer: Inigo Jones Part of the passage: He tried his hand at bridges – his unbuilt version of the Rialto Bridge was decorated with the large pediment and columns of a temple – and, after a fire at the Ducal Palace, he offered an alternative design which bears an uncanny resemblance to the Banqueting House in Whitehall in London. Since it was designed by Inigo Jones, Palladio’s first foreign disciple, this is not as surprising as it sounds. Jones, who visited Italy in 1614, bought a trunk full of the master’s architectural draw- ings; they passed through the hands of the Dukes of Burlington and Devonshire before settling at the Royal Institute of British Architects in 1894. Many are now on display at Palazzo Barbaran."},"11":{"raw":"temple (architecture)","v":"temple (architecture)","ex":"What type of Ancient Roman buildings most heavily influenced Palladio’s work? Answer: temple (architecture) Part of the passage: What they show is how Palladio drew on the buildings of ancient Rome as models. The major theme of both his rural and urban building was temple ar- chitecture, with a strong pointed pediment supported by columns and approached by wide steps."},"12":{"raw":"Quattro Libri dell’Architettura","v":"Quattro Libri dell’Architettura","ex":"What did Palladio write that strengthened his reputation? Answer: Quattro Libri dell’Architettura Part of the passage: Palladio’s work for rich landowners alienates unreconstructed crit- ics on the Italian left, but among the papers in the show are designs for cheap housing in Venice. In the wider world, Palladio’s reputation has been nurtured by a text he wrote and illustrated, “Quattro Libri dell’Architettura”. His influence spread to St Petersburg and to Charlottesville in Virginia, where Thomas Jefferson commissioned a Palladian villa he called Monticello. Explanation: strengthened his reputation = Palladio’s reputation has been nurtured by","alts":["Quattro Libri","I Quattro Libri","Quattro Libri dell’Architettura","Quattro Libri dell'Architettura"]},"13":{"raw":"benevolent calm","v":"benevolent calm","ex":"In the writer’s opinion, what feeling will visitors to the exhibition experi- ence? Answer: benevolent calm Part of the passage: This is an uncompromising exhibition; many of the drawings are small and faint, and there are no sideshows for children, but the impact of harmonious lines and satisfying proportions is to impart in a viewer a feeling of benevolent calm."}},"words":[{"w":"Prosperous","pos":"adj","def":"successful, usually by earning a lot of money","lvl":"C1","ex":"In a prosperous country like this, no one should go hungry","ar":"مزدهر"},{"w":"Apprentice","pos":"n","def":"someone who has agreed to work for a skilled person for a particular period of time","lvl":"","ex":"Most of the work was done by apprentices","ar":"متدرّب (صبي حرفة)"},{"w":"Commission","pos":"v","def":"to formally choose someone to do a special piece of work","lvl":"","ex":"The newspaper commissioned a series of articles on the worst of the fashion industry","ar":"يكلّف بعمل"},{"w":"Promising","pos":"adj","def":"shows signs that it is going to be successful or enjoyable","lvl":"C1","ex":"They won the award for the most promising new band of the year","ar":"واعد"},{"w":"Resemblance","pos":"n","def":"the fact that two people or things look like each other or are similar in some other way","lvl":"C2","ex":"There was a clear family resemblance between all the brothers","ar":"تشابه"},{"w":"Alienate","pos":"v","def":"to make someone feel that they are different and do not belong to a group","lvl":"","ex":"Disagreements can alienate teenagers from their families","ar":"يُنفّر"},{"w":"Leaven","pos":"v","def":"to make something less boring","lvl":"","ex":"Even a speech on a serious subject should be leavened with a little humor","ar":"يضفي حيوية"},{"w":"Uncompromising","pos":"adj","def":"if people or their beliefs are uncompromising, they are fixed and don not change, especially when faced with opposition","lvl":"","ex":"The city council has taken an uncompromising stand against the proposals for the new building","ar":"لا يساوم"},{"w":"Impart","pos":"v","def":"to give something a particular feeling, quality, or taste","lvl":"","ex":"Preservatives can impart color and flavor to a product","ar":"يضفي / ينقل"},{"w":"Benevolent","pos":"adj","def":"kind and helpful","lvl":"","ex":"He was a benevolent old man and wouldn’t hurt a fly","ar":"خيّر / عطوف"}]},{"n":29,"pp":2,"title":"Corporate Social Responsibility","untitled":false,"intro":null,"paras":[{"L":null,"t":"Broadly speaking, proponents of CSR have used four arguments to make their case: moral obligation, sustainability, license to operate, and reputation. The moral appeal – arguing that companies have a duty to be good citizens and to “do the right thing” – is prominent in the goal of Business for Social Responsibility, the leading nonprofit CSR business association in the United States. It asks that its members “achieve commercial success in ways that honour ethical values and respect people, communities, and the natural environment.” Sustainability emphasises environmental and community stewardship.","foot":false},{"L":"A","t":"An excellent definition was developed in the 1980s by Norwegian Prime Minister Gro Harlem Brundtland and used by the World Business Council for Sustainable Development: “Meeting the needs of the present without compromising the ability of future generations to meet their own needs.” Nowadays, governments and companies need to account for the social consequences of their actions. As a result, corporate social responsibility (CSR) has become a priority for business leaders around the world. When a well-run business applies its vast resources and expertise to social problems that it understands and in which it has a stake, it can have a greater impact than any other organization. The notion of license to operate derives from the fact that every company needs tacit or explicit permission from governments, communities, and numerous other stakeholders to justify CSR initiatives to improve a company’s image, strengthen its brand, enliven morale and even raise the value of its stock.","foot":false},{"L":"B","t":"To advance CSR, we must root it in a broad understanding of the interrelationship between a corporation and society. Successful corporations need a healthy society. Education, health care, and equal opportunity are essential to a productive workforce. Safe products and working conditions not only attract customers but lower the internal costs of accidents. Efficient utilization of land, water, energy, and other natural resources makes business more productive. Good government, the rule of law, and property rights are essential for efficiency and innovation. Strong regulatory standards protect both consumers and competitive companies from exploitation. Ultimately, a healthy society creates expanding demand for business, as more human needs are met and aspirations grow. Any business that pursues its ends at the expense of the society in which it operates will find its success to be illusory and ultimately temporary. At the same time, a healthy society needs successful companies. No social program can rival the business sector when it comes to creating the jobs, wealth, and innovation that improve standards of living and social conditions over time.","foot":false},{"L":"C","t":"A company’s impact on society also changes over time, as social standards evolve and science progresses. Asbestos, now understood as a serious health risk, was thought to be safe in the early 1900s, given the scientific knowledge then available. Evidence of its risks gradually mounted for more than 50 years before any company was held liable for the harms it can cause. Many firms that failed to anticipate the consequences of this evolving body of research have been bankrupted by the results. No longer can companies be content to monitor only the obvious social impacts of today. Without a careful process for identifying evolving social effects of tomorrow, firms may risk their very survival.","foot":false},{"L":"D","t":"No business can solve all of society’s problems or bear the cost of doing so. Instead, each company must select issues that intersect with its particular business. Other social agendas are best left to those companies in other industries, NGOs, or government institutions that are better positioned to address them. The essential test that should guide CSR is not whether a cause is worthy but whether it presents an opportunity to create shared value – that is, a meaningful benefit for society that is also valuable to the business. Each company can identify the particular set of societal problems that it is best equipped to help resolve and from which it can gain the greatest competitive benefit.","foot":false},{"L":"E","t":"The best corporate citizenship initiatives involve far more than writing a check: They specify clear, measurable goals and track results over time. A good example is General Electronics’s program to adopt underperforming public high schools near several of its major U.S. facilities. The company contributes between $250,000 and $1 million over a five-year period to each school and makes in-kind donations as well. GE managers and employees take an active role by working with school administrators to assess needs and mentor or tutor students. In an independent study of ten schools in the program between 1989 and 1999, nearly all showed significant improvement, while the graduation rate in four or the five worst performing schools doubled from an average of 30% to 60%. Effective corporate citizenship initiatives such as this one create goodwill and improve relations with local governments and other important constituencies. What’s more, GE’s employees feel great pride in their participation. Their effect is inherently limited, however. No matter how beneficial the program is, it remains incidental to the company’s business, and the direct effect on GE’s recruiting and retention is modest.","foot":false},{"L":"F","t":"Microsoft’s Working Connections partnership with the American Association of Community Colleges (AACC) is a good example of a shared-value opportunity arising from investments in context. The shortage of information technology workers is a significant constraint on Microsoft’s growth; currently, there are more than 450,000 unfilled IT positions in the United States alone. Community colleges, with an enrollment of 11.6 million students, representing 45% of all U.S. undergraduates, could be a major solution. Microsoft recognizes, however, that community colleges face special challenges: IT curricula are not standardized, technology used in classrooms is often outdated, and there are no systematic professional development programs to keep faculty up to date. Microsoft’s $50 million five-year initiative was aimed at all three problems. In addition to contributing money and products, Microsoft sent employee volunteers to colleges to assess needs, contribute to curriculum development, and create faculty development institutes. Microsoft has achieved results that have benefited many communities while having a direct-and potentially significant-impact on the company.","foot":false},{"L":"G","t":"At the heart of any strategy is a unique value proposition: a set of needs a company can meet for its chosen customers that others cannot. The most strategic CSR occurs when a company adds a social dimension to its value proposition, making social impact integral to the overall strategy. Consider Whole Foods Markel, whose value proposition is to sell organic, natural, and healthy food products to customers who are passionate about food and the environment. The company’s sourcing emphasises purchases from local farmers through each store’s procurement process. Buyers screen out foods containing any of nearly 100 common ingredients that the company considers unhealthy or environmentally damaging. The same standards apply to products made internally. Whole Foods’ commitment to natural and environmentally friendly operating practices extends well beyond sourcing. Stores are constructed using a minimum of virgin raw materials. Recently, the company purchased renewable wind energy credits equal to 100% of its electricity use in all of its stores and facilities, the only Fortune 500 company to offset its electricity consumption entirely. Spoiled produce and biodegradable waste are trucked to regional centers for composting. Whole Foods’ vehicles are being converted to run on biofuels. Even the cleaning products used in its stores are environmentally friendly. And through its philanthropy, the company has created the Animal Compassion Foundation to develop more natural and humane ways of raising farm animals. In short, nearly every aspect of the company’s value chain reinforces the social dimensions of its value proposition, distinguishing Whole Foods from its competitors.","foot":false}],"groups":[{"a":14,"b":20,"k":"head","instr":["Reading passage 2 has seven paragraphs, A–G.","Choose the correct heading for each paragraph from the list of headings below.","Write the correct number, i–viii, in boxes 14–20 on your answer sheet."],"items":[{"n":14,"t":"Paragraph A","opts":[]},{"n":15,"t":"Paragraph B","opts":[]},{"n":16,"t":"Paragraph C","opts":[]},{"n":17,"t":"Paragraph D","opts":[]},{"n":18,"t":"Paragraph E","opts":[]},{"n":19,"t":"Paragraph F","opts":[]},{"n":20,"t":"Paragraph G","opts":[]}],"opts":[{"k":"i","t":"How CSR may help one business to expand"},{"k":"ii","t":"CSR in many aspects of a company’s business"},{"k":"iii","t":"A CSR initiative without a financial gain"},{"k":"iv","t":"Lack of action by the state of social issues"},{"k":"v","t":"Drives or pressures motivate companies to address CSR"},{"k":"vi","t":"The past illustrates business are responsible for future outcomes"},{"k":"vii","t":"Companies applying CSR should be selective"},{"k":"viii","t":"Reasons that business and society benefit each other"}],"ctx":[],"optTitle":"List of Headings"},{"a":21,"b":22,"k":"gap","instr":["Complete the summary below.","Choose NO MORE THAN TWO WORDS from the passage for each answer.","Write your answers in boxes 21–22 on your answer sheet."],"items":[],"opts":[],"ctx":["Promotion of CSR requires the understanding of interdependence between business and society. Corporations workers’ productivity generally needs health care, education, and given 21 ………… . Restrictions imposed by government and companies both protect consumers from being treated unfairly. Improvement of the safety standard can reduce the 22 ………… of accidents in the workplace. Similarly, society becomes a pool of more human needs and aspirations."],"mode":"sum","ctitle":"The implement of CSR, HOW?"},{"a":23,"b":26,"k":"match","instr":["Look at the following opinions or deeds (Questions 23–26) and the list of companies below.","Match each opinion or deed with the correct company, A, B or C.","Write the correct letter in boxes 23–26 on your answer sheet.","NB You may use any letter more than once."],"items":[{"n":23,"t":"The disposable waste","opts" imensions of its value proposition, distinguishing Whole Foods from its com- petitors. Explanation: The last sentence of paragraph G acts as a summary of listed ideas about CSR in many aspects of a company’s business (here we have Whole Foods as an example). By scanning the whole paragraph, you could see that CSR appears in the company’s sourcing, stores, how they use renewable wind energy, how they handle spoiled products, etc."},"21":{"raw":"equal opportunity","v":"equal opportunity","ex":"Corporations workers’ productivity generally needs health care, education, and given ………… restrictions imposed by government and companies both pro- tect consumers from being treated unfairly. Answer: equal opportunity Keywords in Question Similar words in Passage Corporations workers’ Education, health care, and equal opportunity are productivity general- essential to a productive workforce. ly needs health care, education, and given ………… Explanation: The answer must be a Noun, which is classified in the same group with health care and education. Therefore, we just find the noun standing near these keywords to find the answer."},"22":{"raw":"internal costs","v":"internal costs","ex":"Improvement of the safety standard can reduce the ………… of accidents in the workplace. Answer: internal costs Keywords in Question Similar words in Passage Improvement of the safety Safe products and working conditions not only standard can reduce the attract customers but lower the internal costs of ………… of accidents in the accidents. workplace. Explanation: The fourth sentence in paragraph B contains all the keywords in ques- tion 21, so we can assume that the answer must be somewhere here. The answer must be a Noun, which is related to accidents and follow the verb re- duce. Therefore, internal costs is the proper answer we are looking for."},"23":{"raw":"C Whole Foods Market","v":"C","ex":"The disposable waste Answer: C Whole Foods Market Keywords in Question Similar words in Passage The disposable waste Spoiled produce and biodegradable waste are trucked to regional centers for composting. Explanation: We found the paraphrased phrase of the question’s keywords in the last paragraph and it all focus on Whole Food Market."},"24":{"raw":"C Whole Food Market","v":"C","ex":"The way company purchases as goods Answer: C Whole Food Market Keywords in Question Similar words in Passage The way company purchas- The company’s sourcing emphasises purchases es as goods from local farmers through each store’s procurement process. Buyers screen out foods containing any of nearly 100 common ingredients that the company considers unhealthy or environmentally damaging. The same standards apply to products made inter- nally. Explanation: We found the paraphrased phrase of the question’s keywords in the last paragraph and it all focus on Whole Food Market."},"25":{"raw":"A General Electronics","v":"A","ex":"Helping the undeveloped Answer: A General Electronics Keywords in Question Similar words in Passage Helping the undeveloped A good example is General Electronics’s program to adopt underperforming public high schools near several of its major U.S. facilities. Explanation: We found the paraphrased phrase of the question’s keywords in para- graph E and it all focus on General Electronics."},"26":{"raw":"B Microsoft","v":"B","ex":"Ensuring the people have the latest information Answer: B Microsoft Keywords in Question Similar words in Passage Ensuring the people IT curricula are not standardized, technology used have the latest informa- in classrooms is often outdated, and there are no tion systematic professional development programs to keep faculty up to date. Microsoft’s $50 million five-year initiative was aimed at all three problems Explanation: Let’s take a look at paragraph F. The first half of this paragraph mentioned some problems including the lack of professional development programs to keep faculty (the people) up to date (have the latest information) and one of Microsoft’s aims is to make sure that the faculty is kept up to date. In addition, Microsoft is the only company among the three mentioned in the passage relating to information and technology field."}},"words":[{"w":"To make case","pos":"v","def":"to argue that something is the best thing to do, giving your reasons","lvl":"","ex":"We will only publish a new edition if you can make a convincing case for it","ar":"يقدّم حجة لـ"},{"w":"Prominent","pos":"adj","def":"describes something that is in a position in which it is easily seen","lvl":"C2","ex":"New books are displayed in a prominent position on tables at the front of the shop","ar":"بارز"},{"w":"Stewardship","pos":"n","def":"the way in which a person controls or organizes it","lvl":"","ex":"The company has been very successful while it has been under the stewardship","ar":"الإشراف والرعاية"},{"w":"Compromise","pos":"v","def":"to accept that you will reduce your demands or change your opinion in order to reach an agreement","lvl":"B1","ex":"Party unit is threatened when members will not compromise","ar":"يتنازل / حل وسط"},{"w":"Mount","pos":"v","def":"to gradually increase, rise, or get bigger","lvl":"C2","ex":"The children’s excitement is mounting as Christmas gets nearer","ar":"يتزايد"},{"w":"Liable","pos":"adj","def":"having (legal) responsibility for something or someone","lvl":"C1","ex":"The law holds parents liable if a child does not attend school","ar":"مسؤول قانونيًا"},{"w":"Retention","pos":"n","def":"the continued use, existence, or possession of something or someone","lvl":"C2","ex":"Two influential senators have argued for the retention of the unpopular tax","ar":"الاحتفاظ بـ"},{"w":"Reinforce","pos":"v","def":"to make something stronger","lvl":"C2","ex":"The pockets on my jeans are reinforced with double stitching","ar":"يعزّز"}]},{"n":30,"pp":3,"title":"The significant role of mother tongue in education","untitled":false,"intro":null,"paras":[{"L":null,"t":"One consequence of population mobility is an increasing diversity within schools. To illustrate, in the city of Toronto in Canada, 58% of kindergarten pupils come from homes where English is not the usual language of communication. Schools in Europe and North America have experienced this diversity for years, and educational policies and practices vary widely between countries and even within countries. Some political parties and groups search for ways to solve the problem of diverse communities and their integration in schools and society. However, they see few positive consequences for the host society and worry that this diversity threatens the identity of the host society. Consequently, they promote unfortunate educational policies that will make the “problem” disappear. If students retain their culture and language, they are viewed as less capable of identifying with the mainstream culture and learning the mainstream language of the society.","foot":false},{"L":null,"t":"The challenge for educators and policy-makers is to shape the evolution of national identity in such a way that the rights of all citizens (including school children) are respected, and the cultural, linguistic, and economic resources of the nation are maximised. To waste the resources of the nation by discouraging children from developing their mother tongues is quite simply unintelligent from the point of view of national self-interest. A first step in providing an appropriate education for culturally and linguistically diverse children is to examine what the existing research says about the role of children’s mother tongues in their educational development.","foot":false},{"L":null,"t":"In fact, the research is very clear. When children continue to develop their abilities in two or more languages throughout their primary school, they gain a deeper understanding of language and how to use it effectively. They have more practice in processing language, especially when they develop literacy in both. More than 150 research studies conducted during the past 35 years strongly support what Goethe, the famous eighteenth-century German philosopher, once said: the person who knows only one language does not truly know that language. Research suggests that bilingual children may also develop more flexibility in their thinking as a result of processing information through two different languages.","foot":false},{"L":null,"t":"The level of development of children’s mother tongue is a strong predictor of their second language development. Children who come to school with a solid foundation in their mother tongue develop stronger literacy abilities in the school language. When parents and other caregivers (e.g. grandparents) are able to spend time with their children and tell stories or discuss issues with them in a way that develops their mother tongue, children come to school well-prepared to learn the school language and succeed educationally. Children’s knowledge and skills transfer across language from the mother tongue to the school language. Transfer across language can be two-way: both languages nurture each other when the educational environment permits children access to both languages.","foot":false},{"L":null,"t":"Some educators and parents are suspicious of mother tongue-based teaching programs because they worry that they take time away from the majority language. For example, in a bilingual program where 50% of the time is spent teaching through children’s home language and 50% through the majority language, surely children won’t progress as far in the latter? One of the most strongly established findings of educational research, however, is that well-implemented bilingual programs can promote literacy and subject-matter knowledge in a minority language without any negative effects on children’s development in the majority language. Within Europe, the Foyer program in Belgium, which develops children’s speaking and literacy abilities in three languages (their mother tongue, Dutch and French), most clearly illustrates the benefits of bilingual and trilingual education (see Cummins, 2000).","foot":false},{"L":null,"t":"It is easy to understand how this happens. When children are learning through a minority language, they are learning concepts and intellectual skills too. Pupils who know how to tell the time in their mother tongue understand the concept of telling time. In order to tell time in the majority language, they do not need to re-learn the concept. Similarly, at more advanced stages, there is transfer across languages in other skills such as knowing how to distinguish the main idea from the supporting details of a written passage or story, and distinguishing fact from opinion. Studies of secondary school pupils are providing interesting findings in this area, and it would be worth extending this research.","foot":false},{"L":null,"t":"Many people marvel at how quickly bilingual children seem to “pick up” conversational skills in the majority language at school (although it takes much longer for them to catch up with native speakers in academic language skills). However, educators are oftenmuch less aware of how quickly children can lose their ability to use their mother tongue, even in the home context. The extent and rapidity of language loss will vary according to the concentration of families from a particular linguistic group in the neighbourhood. Where the mother tongue is used extensively in the community, then language loss among children will be less. However, where language communities are not concentrated in particular neighbourhoods, children can lose their ability to communicate in their mother tongue within 2-3 years of starting school. They may retain receptive skills in the language but they will use the majority language in speaking with their peers and siblings and in responding to their parents. By the time children become adolescents, the linguistic division between parents and children has become an emotional chasm. Pupils frequently become alienated from the cultures of both home and school with predictable results.","foot":false}],"groups":[{"a":27,"b":30,"k":"mcq","instr":["Choose the correct letter, A, B, C or D.","Write the correct letter in boxes 27–30 on your answer sheet."],"items":[{"n":27,"t":"What point did the writer make in the second paragraph?","opts":[{"k":"A","t":"Some present studies on children’s mother tongues are misleading."},{"k":"B","t":"A culturally rich education programme benefits some children more than others."},{"k":"C","t":"Bilingual children can make a valuable contribution to the wealth of a country."},{"k":"D","t":"The law on mother tongue use at school should be strengthened."}]},{"n":28,"t":"Why does the writer refer to something that Goethe said?","opts":[{"k":"A","t":"to lend weight to his argument"},{"k":"B","t":"to contradict some research"},{"k":"C","t":"to introduce a new concept"},{"k":"D","t":"to update current thinking"}]},{"n":29,"t":"The writer believes that when young children have a firm grasp of their mother tongue","opts":[{"k":"A","t":"they can teach older family members what they learnt at school."},{"k":"B","t":"they go on to do much better throughout their time at school."},{"k":"C","t":"they can read stories about their cultural background."},{"k":"D","t":"they develop stronger relationships with their family than with their peers."}]},{"n":30,"t":"Why are some people suspicious about mother tongue-based teaching programmes?","opts":[{"k":"A","t":"They worry that children will be slow to learn to read in either language."},{"k":"B","t":"They think that children will confuse words in two languages."},{"k":"C","t":"They believe that the programmes will make children less interested in their lessons."},{"k":"D","t":"They fear that the programmes will use up valuable time in the school day."}]}],"opts":[],"ctx":[]},{"a":31,"b":35,"k":"match","instr":["Complete the summary using the list of words, A–J, below.","Write the correct letter, A <script>
/* ================= core: data, storage, speech, dictionary, AI ================= */
const DAYS=JSON.parse(document.getElementById('dData').textContent);
const DICT=JSON.parse(document.getElementById('dDict').textContent);
const IMG={d7:document.getElementById('img7').textContent,d10:document.getElementById('img10').textContent};
const PROPER=new Set(DICT.p);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const AR_NUM=n=>String(n);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
const ICON={
 spk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>',
 tr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h10M8 3v2m3 0c-1 4-4 7-7 8m3-5c1 2 3 4 6 5M13 21l4-10 4 10m-6.5-3h5"/></svg>',
 stop:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'
};

/* ---------- progress (per viewer, this browser) ---------- */
let P=store.get('r30_p',{days:{},xp:0,streak:0,last:'',nb:[],final:null,fs:18});
function DP(n){return P.days[n]||(P.days[n]={words:{},read:false,test:{a:{},checked:false,score:null,best:null},games:{},mastery:{best:null,passed:false,tries:0},steps:{}})}
function save(){store.set('r30_p',P)}
const dkey=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
function addXP(n){const t=dkey(new Date()),y=dkey(new Date(Date.now()-864e5));if(P.last!==t){P.streak=P.last===y?P.streak+1:1;P.last=t}P.xp+=n;save();renderHud()}
function streakNow(){const t=dkey(new Date()),y=dkey(new Date(Date.now()-864e5));return (P.last===t||P.last===y)?P.streak:0}
const STEPS=[['words','كلمات اليوم'],['read','اقرئي القطعة'],['test','أسئلة الكتاب'],['games','١٣ لعبة'],['mastery','اختبار التمكّن']];
function stepDone(n,k){const p=DP(n);
 if(k==='words')return !!p.steps.words;
 if(k==='read')return !!p.read;
 if(k==='test')return p.test.checked;
 if(k==='games')return Object.keys(p.games).filter(x=>x!=='pron').length>=13;
 if(k==='mastery')return p.mastery.passed;
 return false}
const dayStepsDone=n=>STEPS.filter(s=>stepDone(n,s[0])).length;
const mastered=n=>DP(n).mastery.passed;
function currentDay(){for(const D of DAYS)if(!mastered(D.n))return D.n;return 30}
const nQ=D=>{let c=0;D.groups.forEach(g=>c+=g.b-g.a+1);return c};

/* ---------- speech ---------- */
let enV=null;
function pickV(){try{const v=speechSynthesis.getVoices();enV=v.find(x=>/en-GB/i.test(x.lang)&&/female|libby|sonia|serena|kate|martha/i.test(x.name))||v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{pickV();speechSynthesis.onvoiceschanged=pickV}catch(e){}
let speaking=false;
function speak(t,rate,onend){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';if(enV)u.voice=enV;u.rate=rate||.9;u.onend=()=>{speaking=false;onend&&onend()};speaking=true;speechSynthesis.speak(u)}catch(e){toast('الصوت غير متاح في هذا المتصفح')}}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}speaking=false}

/* ---------- dictionary ---------- */
function lemmaOf(w){
 let k=w.toLowerCase().replace(/[’]/g,"'").replace(/^'+|'+$/g,'');
 k=k.replace(/'s$/,'');
 if(DICT.g[k])return k;
 if(DICT.f[k]&&DICT.g[DICT.f[k]])return DICT.f[k];
 const tries=[[/ies$/,'y'],[/ied$/,'y'],[/ing$/,''],[/ing$/,'e'],[/ed$/,''],[/ed$/,'e'],[/es$/,''],[/s$/,''],[/ly$/,''],[/er$/,''],[/est$/,'']];
 for(const [re,r] of tries){if(re.test(k)){const b=k.replace(re,r);if(DICT.g[b])return b;if(DICT.f[b]&&DICT.g[DICT.f[b]])return DICT.f[b]}}
 return null}
function glossOf(w){
 const k=lemmaOf(w);if(k)return {lem:k,ar:DICT.g[k]};
 const lw=w.toLowerCase();
 if(/-/.test(w)){const parts=w.split('-').map(x=>{const l=lemmaOf(x);return l?DICT.g[l].split(' / ')[0]:x});return {lem:lw,ar:parts.join(' + ')}}
 if(PROPER.has(lw)||/^[A-Z]/.test(w))return {lem:lw,ar:'اسم علم (شخص أو مكان أو جهة)'};
 return {lem:lw,ar:''}}
/* word-list match for a clicked token */
function wlMatch(D,w){const lw=w.toLowerCase();const lem=lemmaOf(w)||lw;
 return D.words.find(x=>{const head=x.w.toLowerCase().replace(/\(.*?\)/g,'').trim();const first=head.replace(/^(a|to|the)\s+/,'').split(/\s+/)[0];return first===lw||first===lem||(lemmaOf(first)||first)===lem})}
const WL_KEY=x=>{const head=x.w.toLowerCase().replace(/\(.*?\)/g,'').replace(/[’']s\b/g,'').trim();const ws=head.split(/[\s]+/).filter(w=>!/^(a|an|the|to|of|for|with|on|in|into|at|up|out|off|from|somebody|someone|something|oneself|one|yourself|be|do|take|put|get|make|come|keep|end|step|pick|work|leap|hop|cling|team|fall|ride|stem|add|wear|lead|bury|peer|stumble|attribute|boost|cope|correlate|descend|compile|stare|reflect|account|cater|channel|forge|string|bent|belch)$/.test(w));const c=ws.length?ws.sort((a,b)=>b.length-a.length)[0]:head.split(/\s+/)[0];return lemmaOf(c)||c};
const WL_FIRST=D=>{if(D._wl)return D._wl;const s=new Set();D.words.forEach(x=>{s.add(WL_KEY(x));const h=x.w.toLowerCase().replace(/\(.*?\)/g,'').trim();if(!/\s/.test(h))s.add(lemmaOf(h)||h)});return D._wl=s};

/* ---------- AI (optional, via Claude) ---------- */
let AI=null,AI_STATE='loading';
(async()=>{await Promise.resolve();try{if(window.claude&&window.claude.use){AI=await window.claude.use('sample');AI_STATE=AI?'ready':'off'}else AI_STATE='off'}catch(e){AI_STATE='off'}renderHud()})();
function aiErr(e){const c=e&&e.code;return c==='rate_limited'?'طلبات كثيرة الحين، جرّبي بعد دقيقة.':c==='not_granted'?'ما تم السماح للمدرّبة الذكية بالعمل في هذي الصفحة.':'ما قدرت أوصل للمدرّبة الذكية الحين'+(c?' ('+c+')':'')+'. جرّبي مرة ثانية.'}
async function askAI(prompt,tier){const r=await AI(prompt,{modelTier:tier||'quick'});return String(r&&r.text||'').trim()}

/* ---------- tokenising English text into clickable words ---------- */
function tokHTML(text,D){
 const wl=D?WL_FIRST(D):null;
 return String(text==null?'':text).split(/([A-Za-z]+(?:[’'-][A-Za-z]+)*)/).map((p,i)=>{if(i%2===0)return esc(p);const l=lemmaOf(p)||p.toLowerCase();return `<span class="w${wl&&wl.has(l)?' wl':''}" data-w="${esc(p)}">${esc(p)}</span>`}).join('')}
function splitSent(t){return String(t).split(/(?<=[.!?]["”’']?)\s+(?=[A-Z“‘"'(])/).filter(x=>x.trim())}

/* ================= book questions: render, answer, grade, explain ================= */
const KIND_AR={tf:'صح / خطأ / غير مذكور',yn:'نعم / لا / غير مذكور',mcq:'اختيار من متعدد',multi:'اختاري أكثر من حرف',head:'عناوين الفقرات',para:'أي فقرة فيها المعلومة؟',match:'توصيل',gap:'أكملي الفراغ'};
const HINT={
 tf:'TRUE = القطعة تقول نفس المعنى. FALSE = القطعة تقول العكس. NOT GIVEN = ما فيه معلومة تأكد أو تنفي.',
 yn:'نفس فكرة TRUE/FALSE لكن عن رأي الكاتب: YES يوافق رأيه، NO يعاكس رأيه، NOT GIVEN ما نعرف رأيه.',
 mcq:'اقرئي السؤال، دوّري الكلمة المفتاحية في القطعة، واقرئي الجملة اللي قبلها وبعدها قبل ما تختارين.',
 multi:'لازم تختارين العدد المطلوب بالضبط. كل حرف صحيح عليه درجة.',
 head:'اقرئي أول جملتين وآخر جملة من الفقرة، ودوّري الفكرة الرئيسية مو تفصيلة صغيرة.',
 para:'ممكن نفس الفقرة تتكرر. دوّري المعنى مو نفس الكلمات (paraphrase).',
 match:'دوّري الاسم أو الكلمة المفتاحية في القطعة، وطابقي المعنى.',
 gap:'التزمي بعدد الكلمات المسموح، وانسخي الكلمة من القطعة بنفس تهجئتها.'};
const TFV={tf:[['T','TRUE'],['F','FALSE'],['NG','NOT GIVEN']],yn:[['Y','YES'],['N','NO'],['NG','NOT GIVEN']]};
const GAPRE=/(?:[…]{2,}|\.{4,})[…\.]*/;
function normA(s){return String(s||'').toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9%' ]+/g,' ').replace(/\s+/g,' ').trim().replace(/^(the|a|an) /,'')}
function variants(a){
 const out=new Set();const raw=String(a.v||'');
 const alts=raw.split(/\s+\/\s+|\s+OR\s+/);(a.alts||[]).forEach(x=>alts.push(x));
 alts.forEach(x=>{
  out.add(normA(x.replace(/[()]/g,'')));out.add(normA(x.replace(/\([^)]*\)/g,'')));
  const m=x.match(/^\s*([\d,.]+%?)\s+\w+/);if(m)out.add(normA(m[1]));
  const am=x.replace(/[()]/g,'').match(/^(\w+) and (\w+)$/);if(am)out.add(normA(am[2]+' and '+am[1]));
 });
 out.delete('');return out}
function gapOK(a,val){if(!val)return false;const v=normA(val);return variants(a).has(v)||variants(a).has(v.replace(/,/g,''))}
function groupOf(D,n){return D.groups.find(g=>n>=g.a&&n<=g.b)}
function grade(D,A){
 const res={};let score=0,total=0;
 D.groups.forEach(g=>{
  if(g.k==='multi'){
   const ansSet=String(D.ans[g.a].v).includes(',')?String(D.ans[g.a].v).split(','):(D.ans[g.a].set||[D.ans[g.a].v]);
   const u=String(A[g.a]||'').split(',').filter(Boolean);
   const nums=[];for(let n=g.a;n<=g.b;n++)nums.push(n);
   if(nums.length===1){const ok=u.length===ansSet.length&&u.every(x=>ansSet.includes(x));res[g.a]=ok;total++;if(ok)score++;return}
   const hits=u.filter(x=>ansSet.includes(x)).length;
   nums.forEach((n,i)=>{const ok=i<hits;res[n]=ok;total++;if(ok)score++});return}
  for(let n=g.a;n<=g.b;n++){
   const a=D.ans[n];const v=A[n];let ok=false;
   if(g.k==='gap')ok=gapOK(a,v);
   else if(g.k==='head')ok=String(v||'').toLowerCase()===String(a.v).toLowerCase();
   else ok=v!=null&&String(v)===String(a.v);
   res[n]=ok;total++;if(ok)score++}
 });
 return {res,score,total}}
const BAND=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5],[0,2]];
function bandOf(score,total){const raw=Math.round(score/total*40);return BAND.find(b=>raw>=b[0])[1]}

function gapInput(D,n,ctx){

  return `<span class="gnum">${n}</span><select class="gapsel" data-q="${n}" data-scope="${ctx.scope}" aria-label="Question ${n}" ${ctx.checked?'disabled':''}><option value="">—</option>${g.opts.map(o=>`<option value="${o.k}" ${a===o.k?'selected':''}>${o.k} · ${esc(o.t)}</option>`).join('')}</select>`}
 return `<span class="gnum">${n}</span><input class="${cls}" data-q="${n}" data-scope="${ctx.scope}" value="${esc(a)}" aria-label="Question ${n}" autocomplete="off" spellcheck="false" ${ctx.checked?'disabled':''}>`}
function withGaps(D,text,ctx,g){
 // replace "12 ……" (or "12……") inside context text with an input for question 12
 return esc(text).replace(/(\d{1,2})\s*(?:[…]{2,}|\.{4,})[…\.]*/g,(m,num)=>{const n=+num;return (n>=g.a&&n<=g.b)?gapInput(D,n,ctx):m})}
function choiceBtns(n,list,ctx,correct,col){

function verdict(D,n,ctx){
 if(!ctx.checked)return '';const a=D.ans[n];const ok=ctx.res[n];

function explParts(ex){
 const LBL={'Answer':'الإجابة','Part of the passage':'من القطعة','Explanation':'الشرح','Comment':'تعليق','Meaning':'المعنى','Main idea':'الفكرة الرئيسية','Possible headings':'عناوين محتملة'};
 const re=/(Answers?|Part of the passage(?:\s*\[[^\]]*\])?|Explanation|Comment|Meaning|Main idea in paragraph [A-J]|Possible headings|Highlighted in \w+ = Question \d+)\s*:/g;
 const out=[];let m,last=null,lastIdx=0;
 while((m=re.exec(ex))){if(last)out.push([last,ex.slice(lastIdx,m.index).trim()]);last=m[1];lastIdx=re.lastIndex}
 if(last)out.push([last,ex.slice(lastIdx).trim()]);
 return out.filter(p=>!/^Highlighted/.test(p[0])&&p[1]).map(([k,v])=>{const key=Object.keys(LBL).find(x=>k.startsWith(x));return [LBL[key]||k,v]})}
function explHTML(D,n,ctx){
 const a=D.ans[n];const parts=explParts(a.ex||'');
 const ai=ctx.ai&&ctx.ai[n];
 return `<div class="expl">${parts.length?parts.slice(0,8).map(([k,v])=>`<div><span class="k">${k}</span><div class="src">${tokHTML(v,D)}</div></div>`).join(''):`<div class="src">${tokHTML(a.ex||'',D)}</div>`}${ai?`<div class="ai">${esc(ai)}</div>`:''}</div>`}
function partOf(D,n){const p=explParts(D.ans[n].ex||'').find(x=>x[0]==='من القطعة');return p?p[1]:''}

 if(g.items.length){

   if(g.k==='gap'){

   else if(g.k==='tf'||g.k==='yn')body=`<div class="qt">${tokHTML(it.t,D)}</div>${choiceBtns(n,TFV[g.k],ctx,D.ans[n].v)}`;
   else if(g.k==='mcq')body=`<div class="qt">${tokHTML(it.t,D)}</div>${choiceBtns(n,it.opts.map(o=>[o.k,`<b>${o.k}</b>${esc(o.t)}`]),ctx,D.ans[n].v,true)}`;
   else body=`<div class="qt">${tokHTML(it.t,D)}</div>${choiceBtns(n,g.opts.map(o=>[o.k,`<b>${esc(o.k)}</b>`]),ctx,D.ans[n].v)}`;
   h+=`<div class="qitem">${qn}<div>${body}${verdict(D,n,ctx)}</div></div>`});
  return h+'</section>'}
 // context groups: flow chart, summary, notes, table, diagram
 if(g.ctitle)h+=`<div class="ctitle">${esc(g.ctitle)}</div>`;
 if(g.mode==='diagram')h+=`<img class="diagram" src="${IMG[g.img]}" alt="Diagram for questions ${g.a}–${g.b}">`;
 if(g.mode==='flow'){h+=`<div class="flow">${g.ctx.map((l,i)=>`${i?'<div class="arr"></div>':''}<div class="box">${withGaps(D,l,ctx,g)}</div>`).join('')}</div>`}
 else if(g.mode==='table'){const T=g.table;h+=`<div class="tablewrap"><table class="qt2"><thead><tr>${T.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${T.rows.map(r=>`<tr><th>${esc(r[0])}</th><td>${r[1].map(x=>'• '+withGaps(D,x,ctx,g)).join('<br>')}</td><td>${r[2].map(x=>'• '+withGaps(D,x,ctx,g)).join('<br>')}</td></tr>`).join('')}</tbody></table></div>`}
 else if(g.mode==='sum')h+=`<div class="ctx">${g.ctx.map(l=>withGaps(D,l,ctx,g)).join(' ')}</div>`;
 else h+=`<div class="notes">${g.ctx.map(l=>`<div>${withGaps(D,l,ctx,g)}</div>`).join('')}</div>`;
 if(g.k==='match'&&g.opts.length)h+=`<div class="optbox cols"><h5>الكلمات المتاحة</h5><ol>${g.opts.map(o=>`<li><b>${o.k}</b> ${esc(o.t)}</li>`).join('')}</ol></div>`;
 if(ctx.checked){for(let n=g.a;n<=g.b;n++)h+=`<div class="qitem"><span class="qn ${ctx.res[n]?'ok':'no'}">${n}</span><div>${verdict(D,n,ctx)}</div></div>`}

function passageHTML(D,hl,tools){
 hl=hl||new Set();
 const paras=D.paras.map((p,pi)=>{
  const sents=splitSent(p.t).map((s,si)=>`<span class="s${hl.has(pi+':'+si)?' hl':''}" data-s="${pi}:${si}">${tokHTML(s,D)}</span>`).join(' ');
  return `<div class="para${p.foot?' foot':''}" id="p${D.n}_${pi}"><div class="lab">${p.L||''}</div><div>${sents}${tools&&!p.foot?`<div class="ptools"><button class="icon-btn" data-sayp="${pi}">${ICON.spk} اسمعي الفقرة</button>${AI?`<button class="icon-btn" data-trp="${pi}">${ICON.tr} ${S.ptr[D.n+':'+pi]?'إخفاء الترجمة':'ترجمي الفقرة'}</button>`:''}</div>`:''}${S.ptr[D.n+':'+pi]&&S.ptrOn&&S.ptrOn[D.n+':'+pi]?`<div class="tr" dir="rtl">${esc(S.ptr[D.n+':'+pi])}</div>`:''}</div></div>`}).join('');
 return `<h3>${esc(D.title)}</h3>${D.intro?`<p class="intro">${tokHTML(D.intro,D)}</p>`:''}${paras}`}
function findAnswer(D,n){
 const a=D.ans[n];const hay0=partOf(D,n)||(a.ex||'');if(!hay0)return null;
 const N=s=>s.toLowerCase().replace(/-\s+/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
 const hay=' '+N(hay0)+' ';const hl=new Set();let first=null;
 D.paras.forEach((p,pi)=>splitSent(p.t).forEach((s,si)=>{const w=N(s).split(' ');if(w.length<4)return;let hit=0,tot=0;for(let i=0;i+4<=w.length;i++){tot++;if(hay.includes(' '+w.slice(i,i+4).join(' ')+' '))hit++}if(hit>=2&&hit/tot>=.25){hl.add(pi+':'+si);if(!first)first=pi+':'+si}}));
 return hl.size?{hl,first}:null}

function othersW(D,not,n,key){const pool=shuffle(ALLW().filter(w=>!not.includes(hw(w))&&w.day!==D.n));const seen=new Set();const out=[];for(const w of pool){const k=key(w);if(!seen.has(k)){seen.add(k);out.push(w)}if(out.length>=n)break}return out}
function sents(D){if(D._s)return D._s;const out=[];D.paras.forEach((p,pi)=>{if(p.foot)return;splitSent(p.t).forEach(s=>{s=s.trim();if(s.length>25)out.push({s,pi})})});return D._s=out}

/* ---------- pronunciation coach ---------- */
const PRON_RULES=[
 [/p/,/b/,'حرف P بدون صوت من الحلق: ضمّي شفايفك وطلّعي نفَس قوي مثل نفخة (p-p-p). B فيه صوت.'],
 [/v/,/f|b/,'حرف V: عضّي شفتك التحتية بأسنانك الفوق بخفّة وطلّعي صوت (vvv). F نفس الشي بدون صوت.'],
 [/th/,/t|d|s|z|f/,'TH: طلّعي طرف لسانك بين أسنانك شوي ونفّسي (مثل ث أو ذ).'],
 [/^kn|mb$|^wr|gh/,null,'انتبهي للحروف الصامتة: k في kn، و b في آخر mb، و w في wr، و gh غالبًا ما تنطق.'],
 [/[^aeiou ]{3}/,null,'فيها ثلاث حروف ساكنة ورا بعض: لا تحطين حركة (ا أو إ) بينها، انطقيها متصلة.'],
 [/tion|sion/,null,'tion و sion تنطق «شن» (ʃən).'],
 [/ough|augh/,null,'ough/augh لها نطق خاص، اسمعي النموذج بالبطيء وكرّري.'],
 [/^s[ptkcl]/,null,'كلمة تبدأ بـ s وبعدها ساكن: لا تقولين «إس» قبلها، ابدئي بالـ s مباشرة.']
];
function editDist(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i].concat(Array(n).fill(0)));for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function letterDiff(target,heard){/* mark target letters that the heard word kept (LCS) */
 const a=target.toLowerCase(),b=heard.toLowerCase();const m=a.length,n=b.length;const L=Array.from({length:m+1},()=>Array(n+1).fill(0));
 for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
 const keep=Array(m).fill(false);let i=0,j=0;while(i<m&&j<n){if(a[i]===b[j]){keep[i]=true;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
 return target.split('').map((c,k)=>c===' '?' ':`<span class="${keep[k]?'okw':'miss'}">${esc(c)}</span>`).join('')}
function pronTips(target,heard){const t=target.toLowerCase(),h=(heard||'').toLowerCase();const out=[];
 PRON_RULES.forEach(([re,alt,tip])=>{if(re.test(t)&&(!alt||!re.test(h)||alt.test(h)))out.push(tip)});
 if(!out.length)out.push('اسمعي النموذج بالبطيء، ركّزي على المقطع اللي تحته خط أحمر، وكرّري ٣ مرات قبل ما تحاولين.');

  <div class="stat"><span class="ic" style="background:var(--sun)">${SVG.star}</span><div><b>${stars}</b><span>أيام متمكّنة</span></div></div>

 </section>
 ${WEEKS.map(([t,sub,a,b,v],wi)=>`<section class="week" style="--wk:var(${v})"><h3><span class="wn">${wi+1}</span>${t} <small>${sub} · Day ${a+1}–${b}</small></h3><div class="days">${DAYS.slice(a,b).map(x=>{const k=dayStepsDone(x.n);const ms=mastered(x.n);return `<button class="dtile${x.n===cd?' cur':''}${ms?' star':''}" data-day="${x.n}"><span class="n"><span class="num">${x.n}</span>${ms?'<span class="star" style="font-size:22px" aria-label="متمكّنة">★</span>':`<span class="small muted">Passage ${x.pp}</span>`}</span><span class="t">${esc(x.title)}</span><span class="dots" aria-label="${k} من 5 خطوات">${STEPS.map(s=>`<i class="${stepDone(x.n,s[0])?'on':''}"></i>`).join('')}</span></button>`}).join('')}</div></section>`).join('')}`}

/* ---------- day ---------- */
function dayView(){
 const D=DAYS[S.day-1];const k=dayStepsDone(D.n);const SC=['--coral','--sun','--skyc','--mint','--grape'];
 const head=`<section class="banner" style="--wk:var(${wkVar(D.n)})"><span class="bubble" style="width:200px;height:200px;right:-50px;top:-80px"></span><span class="bubble" style="width:120px;height:120px;left:20%;bottom:-60px"></span><div class="stack" style="gap:6px;position:relative;min-width:0"><button class="icon-btn" data-back="1" style="align-self:flex-start">→ كل الأيام</button><span class="eyebrow">Day ${D.n} · Reading Passage ${D.pp}${D.untitled?' · عنوان من عندنا':''}</span><h2>${esc(D.title)}</h2></div>
 ${mastered(D.n)?'<div class="mbadge" style="position:relative"><div class="medal gold">★</div><b>يوم متمكّن</b></div>':`<div class="bprog" style="position:relative"><b>${k} من 5 خطوات</b><div class="meter"><i style="width:${k/5*100}%"></i></div></div>`}</section>
 <nav class="stepbar" aria-label="خطوات اليوم">${STEPS.map(([kk,l],i)=>`<button class="stepbtn${stepDone(D.n,kk)?' done':''}" style="--sc:var(${SC[i]})" data-step="${kk}" aria-current="${S.step===kk}"><span class="k">${stepDone(D.n,kk)?'✓':i+1}</span>${l}</button>`).join('')}</nav>`;
 const body={words:wordsStep,read:readStep,test:testStep,games:gamesStep,mastery:masteryStep}[S.step](D);
 return head+body}
function nextStepBtn(D,cur){const i=STEPS.findIndex(s=>s[0]===cur);if(i>=STEPS.length-1)return '';return `<div class="row" style="justify-content:flex-end"><button class="btn ghost" data-step="${STEPS[i+1][0]}">الخطوة التالية: ${STEPS[i+1][1]} ←</button></div>`}
function wordsStep(D){
 const p=DP(D.n);const known=D.words.filter(w=>p.words[hw(w)]).length;
 return `<section class="card stack"><div class="row" style="justify-content:space-between"><div><h3>كلمات اليوم من كتابك (${D.words.length})</h3><p class="small muted">اسمعي كل كلمة، اقرئي المعنى والمثال، ثم اضغطي «حفظتها». هذي الكلمات مخطوط تحتها في القطعة.</p></div><span class="pill">${known}/${D.words.length} حفظتيها</span></div>
 <div class="wgrid">${D.words.map((w,wi)=>{const k=!!p.words[hw(w)];return `<article class="wcard${k?' known':''}" style="--wc:var(${['--coral','--skyc','--mint','--grape','--rose','--sun'][wi%6]})"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="w">${esc(hw(w))}</span><button class="icon-btn" data-say="${esc(hw(w))}" aria-label="استمعي">${ICON.spk}</button></div><div class="ar">${esc(w.ar)} ${w.pos?`<span class="pill">${esc(w.pos)}</span>`:''} ${w.lvl?`<span class="pill">${w.lvl}</span>`:''}</div>${w.def?`<div class="def">${esc(w.def)}</div>`:''}${w.ex?`<div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div class="ex" style="flex:1">${esc(w.ex)}</div><button class="icon-btn" data-say="${esc(w.ex)}" aria-label="استمعي للمثال">${ICON.spk}</button></div>`:''}<button class="btn sm ${k?'soft':'ghost'}" data-know="${esc(hw(w))}">${k?'حفظتها ✓':'حفظتها'}</button></article>`}).join('')}</div>
 <div class="row"><button class="btn" data-wdone="1">${p.steps.words?'خلصت الكلمات ✓':'خلصت الكلمات'}</button><button class="btn ghost" data-play="flash">العبي بطاقات الكلمات</button></div></section>${nextStepBtn(D,'words')}`}
function readStep(D){
 const p=DP(D.n);
 return `<section class="card stack"><div class="row" style="justify-content:space-between"><div><h3>اقرئي القطعة</h3><p class="small muted">اضغطي أي كلمة: تسمعين نطقها وتشوفين معناها بالعربي. تحت كل فقرة زر للاستماع وزر للترجمة.</p></div>
 <div class="row"><span class="fsz" role="group" aria-label="حجم الخط"><button data-fs="-1" aria-label="أصغر">A−</button><button data-fs="1" aria-label="أكبر">A+</button></span><button class="btn sm ghost" data-readall="1">${speaking?ICON.stop+' أوقفي':ICON.spk+' اسمعي القطعة'}</button></div></div>
 <p class="hint">طريقة القراءة الذكية: اقرئي العنوان وأول جملة من كل فقرة (Skimming) في دقيقتين، ثم ارجعي اقرئي بالتفصيل. الكلمات المخطوط تحتها هي كلمات اليوم.</p></section>
 <article class="reader" style="--fs:${P.fs||18}px">${passageHTML(D,null,true)}</article>
 <div class="row"><button class="btn" data-readdone="1">${p.read?'قرأتها ✓':'قرأتها كاملة'}</button></div>${nextStepBtn(D,'read')}`}
function testStep(D){
 const p=DP(D.n);const t=p.test;const g=t.checked?grade(D,t.a):null;
 const ctx={A:t.a,checked:t.checked,res:g?g.res:{},scope:'b',open:S.open,ai:S.aiex};
 const total=nQ(D);const filled=Object.keys(t.a).filter(k=>t.a[k]!=null&&t.a[k]!=='').length;
 const sheet=[];for(let n=D.groups[0].a;n<=D.groups[D.groups.length-1].b;n++){const gr=groupOf(D,n);const f=gr.k==='multi'?!!t.a[gr.a]:(t.a[n]!=null&&t.a[n]!=='');sheet.push(`<span class="${t.checked?(g.res[n]?'ok':'no'):(f?'f':'')}">${n}</span>`)}
 const T=S.timer;const tm=T&&T.day===D.n?T.left:20*60;
 let top=`<section class="card stack"><div class="row" style="justify-content:space-between"><div><h3>أسئلة الكتاب: Questions ${D.groups[0].a}–${D.groups[D.groups.length-1].b}</h3><p class="small muted">مثل الاختبار الحقيقي: ٢٠ دقيقة للقطعة. اكتبي إجاباتك ثم اضغطي «صحّحي».</p></div>
 <div class="row"><span class="chip">الوقت <b class="timer" id="tmr">${fmt(tm)}</b></span>${t.checked?'':`<button class="btn sm ghost" data-timer="1">${T&&T.running&&T.day===D.n?'إيقاف مؤقت':'شغّلي المؤقت'}</button>`}</div></div>
 <div class="sheetbar" aria-label="ورقة الإجابة">${sheet.join('')}</div>`;
 if(t.checked){top+=`<div class="score"><div><span class="big">${g.score}</span><span class="muted"> / ${g.total}</span></div><div class="band"><span class="small muted">Band تقريبي</span><b>${bandOf(g.score,g.total)}</b></div><p class="small muted" style="flex:1;min-width:200px">هذا تقدير لو كانت كل الـ٤٠ سؤال بنفس مستواك. افتحي «شرح الكتاب» و«وين الجواب» تحت كل سؤال غلط.</p></div><div class="row"><button class="btn ghost" data-retest="1">امسحي وأعيدي الحل</button><button class="btn" data-step="games">العبي ألعاب اليوم ←</button></div>`}
 top+=`</section>`;
 const qs=D.groups.map(gr=>groupHTML(D,gr,ctx)).join('');
 return top+`<div class="pane-switch row"><button class="btn sm ${S.pane==='q'?'':'ghost'}" data-pane="q">الأسئلة</button><button class="btn sm ${S.pane==='p'?'':'ghost'}" data-pane="p">القطعة</button></div>
 <div class="testgrid" data-pane="${S.pane}"><article class="reader" id="treader">${passageHTML(D,S.hl&&S.hl.day===D.n?S.hl.set:null)}</article><div class="qcol stack">${qs}${t.checked?'':`<div class="row"><button class="btn" data-check="1">صحّحي (${filled}/${total})</button></div>`}</div></div>`}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function gamesStep(D){
 const p=DP(D.n);if(S.game&&S.game.day===D.n&&!S.game.mastery)return playView();
 
 return `<section class="card stack"><div class="row" style="justify-content:space-between"><div><h3>١٣ لعبة + لعبة النطق</h3><p class="small muted">كل لعبة مبنية من كلمات اليوم وجمل القطعة نفسها، وكل مرة أسئلة جديدة.</p></div><span class="pill">${Object.keys(p.games).filter(x=>x!=='pron').length}/13 لعبتيها</span></div>
 <div class="games">${GAMES.map((g,i)=>{const b=p.games[g.id];const col=['--coral','--sun','--mint','--skyc','--grape','--rose'][i%6];const ic={pron:'mic',flash:'cards',mean:'words',def:'book',listen:'ear',spell:'pen',excloze:'words',pcloze:'book',porder:'list',scan:'search',num:'hash',hawk:'eye',build:'list',dict:'ear'}[g.id];return `<button class="game" style="--gc:var(${col})" data-play="${g.id}"><span class="gb"><span class="gi">${SVG[ic]}</span>${b!=null?`<span class="best">أفضل ${b}%</span>`:`<span class="muted">${g.isNew?'جديدة':i+' · '+g.sk}</span>`}</span><h4>${g.ar}</h4><p>${g.d}</p></button>`}).join('')}</div></section>${nextStepBtn(D,'games')}`}
function masteryStep(D){
 const p=DP(D.n);if(S.game&&S.game.day===D.n&&S.game.mastery)return playView();
 const m=p.mastery;
 return `<section class="card stack"><div class="mbadge"><div class="medal${m.passed?' gold':''}">${m.passed?'★':'١٠٠'}</div><div><h3>اختبار التمكّن: Day ${D.n}</h3><p class="small muted">${m.passed?'أنتِ متمكّنة من هذا اليوم. تقدرين تعيدينه للمراجعة متى ما بغيتي.':'لازم ١٠٠٪ عشان تاخذين النجمة. إذا غلطتي، تشوفين الشرح وتعيدين، وأخطاؤك ترجع لك في المحاولة الجاية.'}</p></div></div>
 <ul class="small" style="margin:0;padding-inline-start:20px"><li>${p.test.checked?'أسئلة الكتاب اللي غلطتي فيها + أسئلة ثانية من نفس القطعة':'كل أسئلة الكتاب لهذا اليوم (ما حليتيها بعد)'}</li><li>٧ أسئلة مفردات من كلمات اليوم</li><li>٣ أسئلة مسح سريع (أي فقرة؟)</li></ul>
 <div class="row"><button class="btn" data-mastery="1">${m.tries?'ابدئي محاولة جديدة':'ابدئي الاختبار'}</button>${m.best!=null?`<span class="small muted">أفضل نتيجة: ${m.best}% · المحاولات: ${m.tries}</span>`:''}</div>
 ${p.test.checked?'':'<p class="hint">نصيحة: حلّي «أسئلة الكتاب» أول، عشان الاختبار يركّز على أخطاءك بس.</p>'}</section>`}

/* ---------- game engine ---------- */
function startGame(D,id){stopSpeak();S.game={id,day:D.n,rounds:id==='mastery'?masteryRounds(D):buildRounds(D,id),i:0,score:0,picked:null,done:false,mastery:id==='mastery',wrong:[]};render();try{$('#main').scrollIntoView({block:'start'})}catch(e){}}
function playView(){
 const G=S.game;const D=DAYS[G.day-1];const name=G.mastery?'اختبار التمكّن':G.id==='nb'?'مراجعة دفتري':GAMES.find(g=>g.id===G.id).ar;
 const n=G.rounds.length;
 if(G.done||G.i>=n){return endView(G,D,name)}
 const R=G.rounds[G.i];
 return `<section class="card play"><div class="row" style="justify-content:space-between"><button class="icon-btn" data-gback="1">→ رجوع</button><span class="eyebrow">${name}</span><span class="pill">${G.i+1} / ${n} · صح ${G.score}</span></div><div class="meter"><i style="width:${G.i/n*100}%"></i></div>${roundHTML(R,G,D)}</section>`}
function fbHTML(ok,why,R,D){
 let ex='';
 if(R&&R.bq){const a=D.ans[R.bq];const part=partOf(D,R.bq);ex=`${ok?'':`<div>الإجابة: <b class="en">${esc(a.raw||a.v)}</b></div>`}${part?`<div class="small"><span class="muted">من القطعة:</span> <span class="en">${esc(part.slice(0,420))}${part.length>420?'…':''}</span></div>`:''}`}
 return `<div class="fb ${ok?'ok':'no'}"><p><b>${ok?'صح!':'ولا يهمّك، تعلّمي منها:'}</b> ${why||''}</p>${ex}</div><div class="row">${R&&R.sayAfter?`<button class="icon-btn" data-say="${esc(R.sayAfter)}">${ICON.spk} اسمعي الجملة</button>`:''}<button class="btn" data-next="1">التالي ←</button></div>`}
function roundHTML(R,G,D){
 const done=G.picked!=null;
 if(R.kind==='choice'){
  return `<div class="prompt">${R.prompt}</div><div class="opts"${R.list?' style="grid-template-columns:1fr"':''}>${R.opts.map((o,k)=>{let c='opt'+(o.en?' en':'');if(done){if(o.val===R.ans)c+=' right';else if(o.val===G.picked)c+=' wrong'}return `<button class="${c}" data-pick="${k}" ${done?'disabled':''} ${R.list?'style="text-align:left"':''}>${esc(o.label)}</button>`}).join('')}</div>${done?fbHTML(G.picked===R.ans,R.why,R,D):''}`}
 if(R.kind==='flash'){const w=R.w;
  return `<div class="prompt flip" data-flip="1" role="button" tabindex="0" aria-label="اقلبي البطاقة">${R.flipped?`<div class="stack" style="align-items:center"><div class="big">${esc(hw(w))}</div><div style="font-size:22px;font-weight:600;color:var(--accent)">${esc(w.ar)}</div><div class="sent" style="font-size:15px">${esc(w.def||'')}</div>${w.ex?`<div class="sent muted" style="font-size:15px;font-style:italic">${esc(w.ex)}</div>`:''}</div>`:`<div class="stack" style="align-items:center"><div class="big">${esc(hw(w))}</div><span class="small muted">تذكّري المعنى، ثم اضغطي البطاقة</span></div>`}</div>
  <div class="row" style="justify-content:center"><button class="icon-btn" data-say="${esc(hw(w))}">${ICON.spk} الكلمة</button>${w.ex?`<button class="icon-btn" data-say="${esc(w.ex)}">${ICON.spk} المثال</button>`:''}</div>${R.flipped?`<div class="row" style="justify-content:center"><button class="btn" data-fk="1">عرفتها</button><button class="btn ghost" data-fk="0">ما عرفتها</button></div>`:''}`}
 if(R.kind==='type'){
  const isG=R.mode==='gap';
  let h=isG?`<div class="prompt">${R.prompt}</div>`:`<div class="prompt"><p>${R.mode==='spell'?'اسمعي الكلمة واكتبيها بالإنجليزي:':'اسمعي الجملة واكتبيها كاملة:'}</p><div class="row" style="margin-top:8px"><button class="btn" data-say="${esc(R.say)}">${ICON.spk} استمعي</button><button class="btn ghost" data-say="${esc(R.say)}" data-slow="1">أبطأ</button></div></div>`;
  h+=`<label class="small muted" for="tin">${isG?'إجابتك (من القطعة)':'اكتبي هنا'}</label><input id="tin" class="input en" value="${esc(R.typed||'')}" autocomplete="off" spellcheck="false" ${done?'disabled':''}>`;
  if(!done)h+=`<div class="row"><button class="btn" data-tcheck="1">تحقّقي</button>${isG?'<button class="icon-btn" data-peekall="1">افتحي القطعة</button>':''}</div>`;
  else{if(R.mode==='dict'){const d=diffWords(R.target,R.typed||'');h+=`<div class="prompt sent diff">${d.html}</div>`+fbHTML(G.picked==='ok',`${d.ok} من ${d.total} كلمة صحيحة.`,R,D)}
   else if(R.mode==='spell')h+=fbHTML(G.picked==='ok',`التهجئة الصحيحة: <b class="en">${esc(R.target)}</b> = ${esc(R.w.ar)}`,R,D);
   else h+=fbHTML(G.picked==='ok','',R,D)}
  return h}
 if(R.kind==='pron'){
  const last=R.tries[R.tries.length-1];const can=!done&&R.tries.length<3;
  let h=`<div class="prompt" style="text-align:center"><div class="big">${esc(R.target)}</div><div style="font-size:18px;font-weight:600;color:var(--accent);margin-top:4px">${esc(R.ar||'')}</div><div class="row" style="justify-content:center;margin-top:10px"><button class="btn" data-say="${esc(R.target)}">${ICON.spk} اسمعي النطق الصحيح</button><button class="btn ghost" data-say="${esc(R.target)}" data-slow="1">بطيء جدًا</button></div></div>`;
  if(can){h+=`<div class="hint"><b>كيف تنطقين؟</b> ${HAS_SR?'اضغطي زر الميكروفون وقولي الكلمة. إذا ما اشتغل، ':''}اضغطي في المربع تحت، ثم زر الميكروفون في كيبورد جوالك (الإملاء الصوتي)، وقولي الكلمة بوضوح. اللي يكتبه الجوال هو اللي «سمعه» منك.</div>
   <div class="row" style="flex-wrap:nowrap">${HAS_SR?`<button class="btn sun" data-mic="1" aria-label="انطقي بالميكروفون">${SVG.mic}</button>`:''}<input id="tin" class="input en" placeholder="Speak here…" value="" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
   <div class="row"><button class="btn" data-pcheck="1">قيّمي نطقي</button><span class="small muted">المحاولة ${R.tries.length+1} من 3</span><button class="icon-btn" data-pskip="1">تخطّي</button></div>`}
  if(last){const v=last.v;const col=v==='ok'?'ok':v==='close'?'':'no';
   h+=`<div class="fb ${col||'ok'}" style="${v==='close'?'background:color-mix(in srgb,var(--sun) 22%,var(--surface))':''}"><p><b>${v==='ok'?'نطقك صحيح! ممتاز':v==='close'?'قريبة جدًا! صلّحي جزء بسيط':'الجهاز سمع كلمة ثانية'}</b></p>
   <p class="small">سمعتك تقولين: <b class="en">${esc(last.h||'—')}</b></p>${v!=='ok'?`<p class="small">الكلمة الصحيحة (الأحمر هو الجزء اللي ما وضح): <span class="en ldiff" style="font-size:22px;font-family:var(--read);letter-spacing:.5px">${letterDiff(R.target,last.h)}</span></p><ul class="small" style="margin:0;padding-inline-start:18px">${pronTips(R.target,last.h).map(t=>`<li>${t}</li>`).join('')}</ul>`:''}
   ${R.ai?`<div class="ai" style="margin-top:6px">${esc(R.ai)}</div>`:(v!=='ok'&&AI?`<button class="icon-btn" data-pai="1" ${R.aiBusy?'disabled':''}>${R.aiBusy?'المدرّبة تكتب…':'نصيحة نطق من المدرّبة الذكية'}</button>`:'')}</div>`}
  if(done)h+=`<div class="row"><button class="btn" data-next="1">التالي ←</button></div>`;
  return h}
 if(R.kind==='build'){
  let h=`<div class="prompt"><p>رتّبي الكلمات عشان تطلع جملة من القطعة. اضغطي كلمة لتضيفيها.</p></div><div class="slot">${R.built.map((ti,pos)=>`<button class="tile" data-unb="${pos}" ${done?'disabled':''}>${esc(R.toks[ti])}</button>`).join('')}</div><div class="tiles">${R.order.map(ti=>`<button class="tile" data-tile="${ti}" ${R.built.includes(ti)||done?'disabled':''}>${esc(R.toks[ti])}</button>`).join('')}</div>`;
  if(!done)h+=`<div class="row"><button class="btn" data-bcheck="1" ${R.built.length===R.toks.length?'':'disabled'}>تحقّقي</button><button class="icon-btn" data-say="${esc(R.full)}">${ICON.spk} مساعدة: اسمعيها</button><button class="icon-btn" data-breset="1">امسحي</button></div>`;
