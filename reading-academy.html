roved by local authorities."},{"L":"","t":"Now the site has been covered by a two-meter layer of partially treated sewage material which has been mixed with colliery waste. This will be converted into usable soil by about 21,000 Lumbricus terrestris (garden lobworms) and Aporrectodea longa (black-headed worms) that have been let loose on the site."},{"L":"","t":"The specially raised hermaphrodites, which are self-impregnating, will spend the next five to ten years chewing their way through the topping layer to create a soil structure able to sustain long-term plant growth. Without them, the process could take up to 60 years."},{"L":"","t":"Researchers at Bell College of Technology in nearby Hamilton examined the use of earthworms in land regrading and found that even in the hostile mixture of coal-tip waste and partially treated sewage, earthworms were able to speed up the process of soil recomposition."},{"L":"","t":"They selected different varieties of deep-burrowing earthworm species, whose bulk feeding and casting actions, as well as their ability to improve the mineral content of soil, would increase the rate of reformulation much faster than the natural process."},{"L":"","t":"Sean Ince of Bell’s department of biology says: “The idea is that earthworms will contribute in an accumulative way to further soil binding, and that they will aerate and add nitrogen to the soil covering the Hallside site.”"},{"L":"","t":"At the same time, Scottish Greenbelt has begun planting the area with 250,000 trees – including willow and alder – specially selected for their ability to grow on degraded land. These will have the dual function of extracting contaminants from the soil through their roots and being harvested for wood burning or chipboard manufacture."},{"L":"","t":"By using the cash raised from wood harvesting, David Craven, director of Scottish Greenbelt, says he expects Hallside to be self-financing. ‘The first tranche of trees was planted in April, and they are now over six feet tall, despite dry weather through the summer’, he says. ‘The fields are being planted on a four-year rotation basis and will be used to help us meet our costs.’"},{"L":"","t":"Craven says the cost of land bio-remediation – the labour-intensive process of removing soil for chemical and bacterial cleansing – could have been 30 million pounds."},{"L":"","t":"At Bell College, Ince says: “There’s a whole legacy of toxic soil contamination going back many years. There is physical degradation of the soil as well as contamination from metals, including lead, chromium and arsenic.” Sampling of the soil at regular intervals over the next few years will give an indication of the level of contaminants. Within less than 20 years the land could be re-integrated into the community."},{"L":"","t":"Hopes of a successful outcome at Hallside have paved the way for similar regeneration plans for the nearby Gartcosh steelworks and at Glengarnock in Ayrshire."}],"groups":[{"a":1,"b":6,"k":"tf","instr":["Do the following statements agree with the information given in the passage?","Write TRUE if the statement agrees with the information, FALSE if the statement contradicts the information, NOT GIVEN if there is no information on this."],"items":[{"n":1,"t":"The Hallside site has been disused for a long period of time.","opts":[]},{"n":2,"t":"After over one hundred years of producing steel at Hallside, it was possible to use the land to build on.","opts":[]},{"n":3,"t":"Reclaiming Hallside was planned by a local landscaping company and Scottish Greenbelt.","opts":[]},{"n":4,"t":"A local landscaping company created a sustainable soil structure to put up a farm.","opts":[]},{"n":5,"t":"There are two types of worms being used to make the soil usable at Hallside.","opts":[]},{"n":6,"t":"Bell College researchers selected different types of worms that transformed the Hallside site into commercial and residential areas.","opts":[]}],"opts":[],"ctx":[]},{"a":7,"b":13,"k":"gap","instr":["Answer the questions.","Choose NO MORE THAN THREE WORDS from the passage for each answer."],"items":[{"n":7,"t":"In research at Bell College, what were used to quicken soil recomposition?","opts":[]},{"n":8,"t":"What will enrich the soil to cover the Hallside site in addition to air?","opts":[]},{"n":9,"t":"How will the contaminants be removed from the soil?","opts":[]},{"n":10,"t":"What does the director of Scottish Greenbelt expect the Hallside site to be in future years?","opts":[]},{"n":11,"t":"How much could bio-remediation at Hallside cost?","opts":[]},{"n":12,"t":"Who could reuse the land at Hallside within less than 20 years?","opts":[]},{"n":13,"t":"What plans may take place at nearby steelworks?","opts":[]}],"opts":[],"ctx":[]}],"ans":{"1":{"v":"T","ex":"Part of the passage: Hallside’s closure in 1979… The site’s 30 hectares were left abandoned until 1990 Explanation: disused = abandoned، من 1979 إلى 1990."},"2":{"v":"F","ex":"Part of the passage: too contaminated with heavy metals… to support any kind of brick-and-mortar development Explanation: الأرض كانت ملوثة وما ينفع البناء عليها."},"3":{"v":"T","ex":"Part of the passage: a rescue plan put together by local landscaping and earthmoving company, HL Banks, and the regional developer, Scottish Greenbelt Explanation: planned = put together."},"4":{"v":"NG","ex":"Explanation: ما فيه ذكر لمزرعة."},"5":{"v":"T","ex":"Part of the passage: Lumbricus terrestris (garden lobworms) and Aporrectodea longa (black-headed worms) Explanation: نوعين من الديدان."},"6":{"v":"NG","ex":"Explanation: ما فيه ذكر لمناطق تجارية وسكنية. الخطة غابات وطاقة متجددة."},"7":{"v":"earthworms","ex":"Part of the passage: earthworms were able to speed up the process of soil recomposition Explanation: quicken = speed up.","alts":["worms","deep-burrowing earthworms"]},"8":{"v":"nitrogen","ex":"Part of the passage: they will aerate and add nitrogen to the soil Explanation: aerate = يضيف هواء، والثاني nitrogen."},"9":{"v":"through their roots","ex":"Part of the passage: extracting contaminants from the soil through their roots Explanation: removed = extracting.","alts":["through roots","their roots","by trees","roots"]},"10":{"v":"self-financing","ex":"Part of the passage: he expects Hallside to be self-financing Explanation: تمويل ذاتي. الكلمة بالشَرطة كلمة وحدة.","alts":["self financing"]},"11":{"v":"30 million pounds","ex":"Part of the passage: could have been 30 million pounds Explanation: رقم + كلمة = ثلاث كلمات.","alts":["£30 million","30 million"]},"12":{"v":"the community","ex":"Part of the passage: Within less than 20 years the land could be re-integrated into the community. Explanation: المجتمع.","alts":["community"]},"13":{"v":"similar regeneration (plans)","ex":"Part of the passage: similar regeneration plans for the nearby Gartcosh steelworks Explanation: similar regeneration plans.","alts":["similar regeneration plans","regeneration plans","regeneration"]}},"words":[{"w":"derelict","pos":"adj","def":"in very bad condition because it has not been used","ex":"The long-derelict site of a steelworks.","ar":"مهجور ومتهالك","lvl":""},{"w":"reclaim","pos":"v","def":"to make land suitable for use again","ex":"A plan to reclaim the site of the former steelworks.","ar":"يستصلح (الأرض)","lvl":""},{"w":"accelerate","pos":"v","def":"to make something happen faster","ex":"Worms are used to accelerate soil regeneration.","ar":"يسرّع","lvl":""},{"w":"contaminated","pos":"adj","def":"made dirty or poisonous","ex":"The land was contaminated with heavy metals.","ar":"ملوّث","lvl":""},{"w":"abandoned","pos":"adj","def":"left and no longer used","ex":"The site was left abandoned until 1990.","ar":"متروك / مهجور","lvl":""},{"w":"sustain","pos":"v","def":"to keep something going over time","ex":"A soil structure able to sustain long-term plant growth.","ar":"يدعم / يحافظ على","lvl":""},{"w":"extract","pos":"v","def":"to remove or take out something","ex":"Trees extract contaminants through their roots.","ar":"يستخرج","lvl":""},{"w":"degradation","pos":"n","def":"the process of something becoming worse","ex":"There is physical degradation of the soil.","ar":"تدهور","lvl":""}],"n":16,"untitled":false},{"key":"t1p2","kind":"full","test":1,"pp":2,"title":"A Silent Force","intro":null,"paras":[{"L":"A","t":"There is a legend that St Augustine in the fourth century AD was the first individual to be seen reading silently rather than aloud, as had been the practice until now. Reading has come a long way since Augustine’s day. There was a time when it was a menial job of scribes and priests, not the mark of civilization it became in Europe during the renaissance, when it was seen as one of the attributes of the civilized individual."},{"L":"B","t":"Modern nations are now seriously affected by their levels of literacy. While the Western world has seen a noticeable decline in these areas, other less developed countries have advanced and, in some cases, overtaken the West. India, for example, now has a large pool of educated workers. European countries have been satisfied with their achievements for too long and have allowed other countries to overtake them in certain areas."},{"L":"C","t":"It is difficult in the modern world to do anything other than a basic job without being able to read. Reading as a skill is the key to an educated workforce, which in turn is the basis of economic advancement, particularly in the present technological age. Studies have shown that by increasing the literacy and numeracy skills of primary school children in the UK, the benefit to the economy generally is in billions of pounds. The skill of reading is now no more just an intellectual or leisure activity, but rather a fully-fledged economic force."},{"L":"D","t":"Part of the problem with reading is that it is a skill which is not appreciated in most developed societies. This is an attitude that has condemned large sections of the population in most Western nations to illiteracy. It might surprise people in countries outside the West to learn that in the United Kingdom, and indeed in some other European countries, the literacy rate has fallen to below that of so-called less developed countries."},{"L":"E","t":"There are also forces conspiring against reading in our modern society. It is not seen as cool among a younger generation more at home with computer screens or a mobile phone. The solitude of reading is not very appealing. Students at school, college or university who read a lot are called ‘bookworms’. The term indicates the contempt in which reading and learning are held in certain circles or subcultures. It is a criticism, like all such attacks, driven by the insecurity of those who are not literate or are semi-literate. Criticism is also a means, like all bullying, of keeping peers in place so that they do not step out of line. Peer pressure among young people is so powerful that it often kills any attempts to change attitudes to habits like reading."},{"L":"F","t":"How should people be encouraged to read more? It can easily be done by increasing basic reading skills at an early age and encouraging young people to borrow books from schools. Some schools have classroom libraries as well as school libraries. It is no good waiting until pupils are in their secondary school to encourage an interest in books; it needs to be pushed at an early age. Reading comics and magazines is frowned upon, but surely, what people, whether they be adults or children, read is of little import. What is significant is the fact that they are reading. Someone who reads a comic today may have the courage to pick up a more substantial book later."},{"L":"G","t":"But perhaps the best idea would be to stop the negative attitudes to reading from forming in the first place. Taking children to local libraries brings them into contact with an environment where they can become relaxed among books. If primary school children were also taken in groups into bookshops, this might also entice them to want their own books. A local bookshop, like some local libraries, could perhaps arrange book readings for children which, being away from the classroom, would make the reading activity more of an adventure. On a more general note, most countries have writers of national importance. By increasing the standing of national writers in the eyes of the public, through local and national writing competitions, people would be drawn more to the printed word. Catch them young and, perhaps, they just might then all become bookworms."}],"groups":[{"a":14,"b":19,"k":"head","instr":["The passage has seven paragraphs, A–G. Choose the most suitable heading for paragraphs A–F from the list of headings below.","Example: Paragraph G – Answer: x. Any heading may be used more than once. There are more headings than paragraphs."],"items":[{"n":14,"t":"Paragraph A","opts":[]},{"n":15,"t":"Paragraph B","opts":[]},{"n":16,"t":"Paragraph C","opts":[]},{"n":17,"t":"Paragraph D","opts":[]},{"n":18,"t":"Paragraph E","opts":[]},{"n":19,"t":"Paragraph F","opts":[]}],"opts":[{"k":"i","t":"How reading helps in improving technology"},{"k":"ii","t":"Reading has been the sign of civilized individuals"},{"k":"iii","t":"The author’s attitude towards the decline in reading"},{"k":"iv","t":"High number of educated workers in India"},{"k":"v","t":"Reading: the bedrock of economic development"},{"k":"vi","t":"The economies of modern nations are impacted by literacy"},{"k":"vii","t":"Falling of literacy rates in developed societies due to people’s attitude"},{"k":"viii","t":"How bookshops are effective in encouraging teenagers to read"},{"k":"ix","t":"The negative attitude of young people towards reading"},{"k":"x","t":"Motivating young people to read"}],"ctx":[]},{"a":20,"b":27,"k":"yn","instr":["Do the following statements agree with the claims of the writer in the passage?","Write YES if the statement agrees with the claims of the writer, NO if the statement contradicts the claims of the writer, NOT GIVEN if it is impossible to say what the writer thinks about this."],"items":[{"n":20,"t":"According to legend, St Augustine was the first person to be seen reading aloud.","opts":[]},{"n":21,"t":"The Western world has noticed a considerable rise in their literacy levels.","opts":[]},{"n":22,"t":"In this modern world, reading is considered a basic force for advancing the economy.","opts":[]},{"n":23,"t":"The level of literacy in less developed countries is considerably higher than in all countries of Europe.","opts":[]},{"n":24,"t":"Peer pressure among adolescents can influence one’s habits like reading.","opts":[]},{"n":25,"t":"Children should be discouraged from reading magazines and comics.","opts":[]},{"n":26,"t":"Taking school children to libraries and bookshops may instill an interest in reading.","opts":[]},{"n":27,"t":"School children can do well in reading after completing school.","opts":[]}],"opts":[],"ctx":[]}],"ans":{"14":{"v":"ii","ex":"Part of the passage: not the mark of civilization it became in Europe during the renaissance, when it was seen as one of the attributes of the civilized individual Explanation: آخر جملة في A."},"15":{"v":"vi","ex":"Part of the passage: Modern nations are now seriously affected by their levels of literacy. Explanation: أول جملة في B. «India» فخ: تفصيلة."},"16":{"v":"v","ex":"Part of the passage: Reading as a skill is the key to an educated workforce, which in turn is the basis of economic advancement Explanation: bedrock = basis."},"17":{"v":"vii","ex":"Part of the passage: it is a skill which is not appreciated in most developed societies… the literacy rate has fallen Explanation: attitude + falling literacy."},"18":{"v":"ix","ex":"Part of the passage: It is not seen as cool among a younger generation Explanation: نظرة الشباب السلبية."},"19":{"v":"x","ex":"Part of the passage: How should people be encouraged to read more? Explanation: encouraged = motivating."},"20":{"v":"N","ex":"Part of the passage: the first individual to be seen reading silently rather than aloud Explanation: silently مو aloud."},"21":{"v":"N","ex":"Part of the passage: the Western world has seen a noticeable decline Explanation: decline عكس rise."},"22":{"v":"Y","ex":"Part of the passage: The skill of reading is now… a fully-fledged economic force. Explanation: economic force."},"23":{"v":"NG","ex":"Part of the passage: in the United Kingdom, and indeed in some other European countries, the literacy rate has fallen to below that of so-called less developed countries Explanation: بعض الدول بس، مو «كل» دول أوروبا، وما ذكر «بشكل كبير»."},"24":{"v":"Y","ex":"Part of the passage: Peer pressure among young people is so powerful that it often kills any attempts to change attitudes to habits like reading. Explanation: adolescents = young people."},"25":{"v":"N","ex":"Part of the passage: what people… read is of little import. What is significant is the fact that they are reading. Explanation: الكاتب يشوف المهم إنهم يقرون، ما يمنعهم."},"26":{"v":"Y","ex":"Part of the passage: Taking children to local libraries… taken in groups into bookshops, this might also entice them Explanation: entice = instill an interest."},"27":{"v":"NG","ex":"Explanation: ما فيه كلام عن بعد التخرج."}},"words":[{"w":"literacy","pos":"n","def":"the ability to read and write","ex":"Modern nations are affected by their levels of literacy.","ar":"محو الأمية / القدرة على القراءة والكتابة","lvl":""},{"w":"decline","pos":"n","def":"a gradual decrease","ex":"The Western world has seen a noticeable decline.","ar":"تراجع","lvl":""},{"w":"menial","pos":"adj","def":"boring and needing little skill","ex":"Reading was once a menial job of scribes.","ar":"وضيع / بسيط","lvl":""},{"w":"workforce","pos":"n","def":"all the people who work in a country or company","ex":"Reading is the key to an educated workforce.","ar":"القوى العاملة","lvl":""},{"w":"illiteracy","pos":"n","def":"the inability to read or write","ex":"Large sections of the population were condemned to illiteracy.","ar":"الأمية","lvl":""},{"w":"contempt","pos":"n","def":"a feeling that something is worthless","ex":"The term indicates the contempt in which reading is held.","ar":"احتقار","lvl":""},{"w":"peer pressure","pos":"n","def":"influence from people of your own age","ex":"Peer pressure among young people is very powerful.","ar":"ضغط الأقران","lvl":""},{"w":"entice","pos":"v","def":"to persuade someone by offering something pleasant","ex":"Bookshops might entice children to want their own books.","ar":"يغري / يجذب","lvl":""}],"n":17,"untitled":false},{"key":"t1p3","kind":"full","test":1,"pp":3,"title":"Older and Younger Minds","intro":"Certain mental functions slow down with age, but the brain compensates in ways that can keep seniors as sharp as youngsters.","paras":[{"L":"1","t":"Jake, aged 16, has a terrific relationship with his grandmother Rita, who is 70. They live close by, and they even take a Spanish class together twice a week at a local college. After class they sometimes stop at a café for a snack. On one occasion Rita tells Jake, “I think it’s great how fast you pick up new grammar. It takes me a lot longer.” Jake replies, “Yeah, but you don’t seem to make as many silly mistakes on the quizzes as I do. How do you do that?”"},{"L":"2","t":"In that moment, Rita and Jake stumbled across an interesting set of differences between older and younger minds. Popular psychology says that as people age their brains ‘slow down’. The implication, of course, is that elderly men and women are not as mentally agile as middle-aged adults or even teenagers. However, although certain brain functions such as perception and reaction time do indeed take longer, that slowing down does not necessarily undermine mental sharpness. Indeed, evidence shows that older people are just as mentally fit as younger people because their brains compensate for some kinds of declines in creative ways that young minds do not exploit."},{"L":"3","t":"Just as people’s bodies age at different rates, so do their minds. As adults advance in age, the perception of sights, sounds and smells takes a bit longer, and laying down new information into memory becomes more difficult. The ability to retrieve memories also quickly slides and it is sometimes harder to concentrate and maintain attention."},{"L":"4","t":"On the other hand, the ageing brain can create significant benefits by tapping into its extensive hoard of accumulated knowledge and experience. The biggest trick that older brains employ is to use both hemispheres simultaneously to handle tasks for which younger brains rely predominately on one side. Electronic images taken by cognitive scientists at the University of Michigan, for example, have demonstrated that even when doing basic recognition or memorization exercise, seniors exploit the left and right side of the brain more extensively than men and women who are decades younger. Drawing on both sides of the brain gives them a tactical edge, even if the speed of each hemisphere’s process is slower."},{"L":"5","t":"In another experiment, Michael Falkenstein, of the University of Dortmund in Germany, found that when elders were presented with new computer exercises, they paused longer before reacting and took longer to complete the tasks, yet they made 50% fewer errors, probably because of their more deliberate pace."},{"L":"6","t":"One analogy for these results might be the question of who can type a paragraph ‘better’: a 16-year-old who glides along at 60 words per minute but has to double back to correct a number of mistakes or a 70-year-old who strikes keys at only 40 words per minute but spends less time fixing errors? In the end, if ‘better’ is defined as completing a clean paragraph, both people may end up taking the same amount of time."},{"L":"7","t":"Computerized tests support the notion that accuracy can offset speed. In one so-called distraction exercise, subjects were told to look at a screen, wait for an arrow that pointed in a certain direction to appear, and then use a mouse to click on the arrow as soon as it appeared on the screen. Just before the correct symbol appeared, however, the computer displayed numerous other arrows aimed in various other directions. Although younger subjects cut through the confusion faster when the correct arrow suddenly popped up, they more frequently clicked on incorrect arrows in their haste."},{"L":"8","t":"Older test takers are equally capable of other tasks that do not depend on speed, such as language comprehension and processing. In these cases, however, the elders utilize the brain’s available resources in a different way. Neurologists at Northwest University came to this conclusion after analyzing 50 people ranging from age 23 to 78. The subjects had to lie down in a magnetic resonance imaging (MRI) machine and concentrate on two different lists of printed words posted side by side in front of them. By looking at the lists, they were to find pairs of words that were similar in either meaning or spelling."},{"L":"9","t":"The eldest participants did just as well on the tests as the youngest did, and yet the MRI scans indicated that in the elders’ brains, the areas which are responsible for language recognition and interpretation were much less active. The researchers did find that older people had more activity in brain regions responsible for attentiveness. Darren Gleitman, who headed the study, concluded that older brains solved the problems just as effectively but by different means."}],"groups":[{"a":28,"b":30,"k":"mcq","instr":["Choose the correct letter, A, B, C or D."],"items":[{"n":28,"t":"The dialogue between Jake and Rita illustrates an example of","opts":[{"k":"A","t":"the changes that happen in our brains over time."},{"k":"B","t":"how people learn languages."},{"k":"C","t":"the idea that it is not harder to learn a language when we are young."},{"k":"D","t":"the significance of youngsters and seniors when doing activities together."}]},{"n":29,"t":"What idea does the analogy demonstrate in paragraph six?","opts":[{"k":"A","t":"Being accurate can improve over time."},{"k":"B","t":"Speed is more important than accuracy."},{"k":"C","t":"Working very fast does not always save time."},{"k":"D","t":"Working slower is better than working faster."}]},{"n":30,"t":"In one distraction exercise of the computerized test, the subjects must","opts":[{"k":"A","t":"write the text as fast as possible."},{"k":"B","t":"respond to the specific symbol on the screen."},{"k":"C","t":"draw the arrows in similar directions around the screen."},{"k":"D","t":"click on each arrow that is displayed on the screen."}]}],"opts":[],"ctx":[]},{"a":31,"b":34,"k":"match","instr":["Complete each sentence with the correct ending, A–F."],"items":[{"n":31,"t":"The University of Michigan’s researchers illustrated that","opts":[]},{"n":32,"t":"As stated in popular psychology","opts":[]},{"n":33,"t":"Scientists at Northwest University concluded that","opts":[]},{"n":34,"t":"Michael Falkenstein found that","opts":[]}],"opts":[{"k":"A","t":"the speed of our brain declines with age."},{"k":"B","t":"older people take longer to finish tasks but with greater accuracy."},{"k":"C","t":"although older people use their brains differently, they attain the same result."},{"k":"D","t":"old people can deal well with modern technology."},{"k":"E","t":"the older we become the more difficult it is to concentrate."},{"k":"F","t":"old people use the two sides of their brain more than the young."}],"ctx":[],"optTitle":"Sentence endings"},{"a":35,"b":39,"k":"gap","instr":["Complete the summary below.","Choose NO MORE THAN ONE WORD from the passage for each answer."],"items":[],"opts":[],"ctx":["The bodies and minds of people grow at different 35 …… . As they grow older their brains take longer to process 36 …… and their ability for recalling memories also declines. However, the brains of older people do have 37 …… . First, they can call upon both the 38 …… and experience which is already stored in their brain. Second, they can use both sides of their brain at once, although the speed of each side is 39 …… ."],"mode":"sum"},{"a":40,"b":40,"k":"mcq","instr":["Choose the correct letter, A, B, C or D."],"items":[{"n":40,"t":"Which of the following is the best title for the passage?","opts":[{"k":"A","t":"Experience versus speed"},{"k":"B","t":"How we learn languages"},{"k":"C","t":"Speed of older and younger minds"},{"k":"D","t":"Knowledge versus experience"}]}],"opts":[],"ctx":[]}],"ans":{"28":{"v":"A","ex":"Part of the passage: Rita and Jake stumbled across an interesting set of differences between older and younger minds Explanation: الحوار مثال على الفرق بين العقول مع العمر."},"29":{"v":"C","ex":"Part of the passage: both people may end up taking the same amount of time Explanation: السريع يرجع يصلّح أغلاطه، فالسرعة ما وفّرت وقت."},"30":{"v":"B","ex":"Part of the passage: wait for an arrow that pointed in a certain direction to appear, and then use a mouse to click on the arrow Explanation: specific symbol = the correct arrow."},"31":{"v":"F","ex":"Part of the passage: seniors exploit the left and right side of the brain more extensively Explanation: both sides."},"32":{"v":"A","ex":"Part of the passage: Popular psychology says that as people age their brains ‘slow down’. Explanation: slow down = speed declines."},"33":{"v":"C","ex":"Part of the passage: older brains solved the problems just as effectively but by different means Explanation: الفقرة 9."},"34":{"v":"B","ex":"Part of the passage: they paused longer… took longer to complete the tasks, yet they made 50% fewer errors Explanation: أبطأ لكن أدق."},"35":{"v":"rates","ex":"Part of the passage: Just as people’s bodies age at different rates, so do their minds. Explanation: at different rates."},"36":{"v":"information","ex":"Part of the passage: laying down new information into memory becomes more difficult Explanation: process information."},"37":{"v":"benefits","ex":"Part of the passage: the ageing brain can create significant benefits Explanation: However = عكس السلبيات ← benefits."},"38":{"v":"knowledge","ex":"Part of the passage: its extensive hoard of accumulated knowledge and experience Explanation: knowledge and experience."},"39":{"v":"slower","ex":"Part of the passage: even if the speed of each hemisphere’s process is slower Explanation: although ← slower."},"40":{"v":"A","ex":"Explanation: القطعة كلها تقارن الدقة والخبرة عند الكبار بالسرعة عند الصغار."}},"words":[{"w":"agile","pos":"adj","def":"able to move or think quickly","ex":"Elderly people are not as mentally agile as teenagers.","ar":"سريع الحركة / سريع البديهة","lvl":""},{"w":"undermine","pos":"v","def":"to make something weaker gradually","ex":"Slowing down does not necessarily undermine mental sharpness.","ar":"يضعف / يقوّض","lvl":""},{"w":"compensate","pos":"v","def":"to provide something good to balance something bad","ex":"Their brains compensate for some kinds of declines.","ar":"يعوّض","lvl":""},{"w":"retrieve","pos":"v","def":"to find and bring back information","ex":"The ability to retrieve memories slides.","ar":"يسترجع","lvl":""},{"w":"accumulated","pos":"adj","def":"collected over a period of time","ex":"An extensive hoard of accumulated knowledge.","ar":"متراكم","lvl":""},{"w":"analogy","pos":"n","def":"a comparison that shows how two things are similar","ex":"One analogy for these results is typing a paragraph.","ar":"تشبيه / مقارنة","lvl":""},{"w":"offset","pos":"v","def":"to balance the effect of something","ex":"Accuracy can offset speed.","ar":"يعادل / يعوّض","lvl":""},{"w":"haste","pos":"n","def":"great speed, often causing mistakes","ex":"They clicked on incorrect arrows in their haste.","ar":"عجلة / تسرّع","lvl":""}],"n":18,"untitled":false},{"key":"t2p1","kind":"full","test":2,"pp":1,"title":"Environmental Impact of Online Shopping","intro":"Online shopping may not be as green as you think. Here’s how shopping online can have a surprisingly large carbon footprint.","paras":[{"L":"1","t":"In the past few decades, the way we shop has changed dramatically. We used to buy our goods in traditional shops, on the high street or in department stores. Now, customers are increasingly buying online, where they can order whatever they want directly to their door with the click of a mouse. One in seven sales are now made online and studies suggest that by 2021, global online retail will reach an enormous US$4.8 trillion. As companies race to improve their internet shopping experience, the trend towards shopping online is predicted to continue."},{"L":"2","t":"But what is the impact of all this online shopping on the environment? You might think that online shopping is greener than in-store shopping. After all, an online store does not use the electricity that a traditional store might use, and it doesn’t require the customer to drive anywhere. Items are often delivered to several homes at once, so you would think the carbon savings must be significant. Take the typical home delivery round in the UK, for example. Supermarket drivers often do 120 deliveries on an 80-kilometre round, producing 20 kilograms of CO2 in total. In contrast, a 21-kilometre drive to the store and back for one household would generate 24 times more CO2!"},{"L":"3","t":"However, the reality is slightly more complex than that. Many home deliveries fail the first time, and the driver has to make a second or third attempt to deliver the purchase. Customers who choose speedy delivery or those who buy single items from different places also contribute towards increasing the carbon footprint."},{"L":"4","t":"The carbon footprint also goes up if the customer chooses to return the item. A study in Germany showed that as many as one in three online purchases are returned. According to another study, merchandise worth nearly US$326 million is returned each year in the USA. Two billion kilograms of this ends up in landfill, leading to 13 tons of CO2 being released."},{"L":"5","t":"Clothing is one product that has high return rates. Unlike in a walk-in store, the online shopper cannot try things on before buying. So, companies offer free returns to make it easier for shoppers to purchase the same item of clothing in different sizes and colours. Customers try them at home, keep one and return the rest. However, when clothes are returned, they are not always cleaned and put back for sale. This is because many companies have found it cheaper to simply throw away the returned items than to pay someone to sort the damaged goods from the unwanted ones. In these cases, the returned clothes, which might be in perfect condition, end up in landfills or burnt."},{"L":"6","t":"When we take all these factors into consideration, we realise that online shopping isn’t necessarily as green as people might think. That last kilometre to your door is costly, for companies and for the environment. There is some positive news, as various online retailers are starting to lower their carbon footprint by investing in electric delivery vehicles. However, the question of how to deal with returns efficiently and without waste is a challenge that many companies have not wanted to face. As online shoppers become aware of what companies are doing, and campaign groups demand urgent action in the face of the climate and ecological emergency, there is increasing pressure for companies to take responsibility for the environmental impact of their activities."}],"groups":[{"a":1,"b":5,"k":"mcq","instr":["Choose the correct answer A, B, C, or D."],"items":[{"n":1,"t":"How do consumers buy products at present?","opts":[{"k":"A","t":"In-store"},{"k":"B","t":"Online"},{"k":"C","t":"Barter"},{"k":"D","t":"Boycott"}]},{"n":2,"t":"What is the misconception about virtual shopping?","opts":[{"k":"A","t":"It saves the environment."},{"k":"B","t":"It eats much of a person’s savings."},{"k":"C","t":"It helps people to spend wisely."},{"k":"D","t":"It consumes much energy."}]},{"n":3,"t":"How do home deliveries affect the carbon footprint?","opts":[{"k":"A","t":"Speedy delivery lessens it."},{"k":"B","t":"Buying only once does not aggravate it."},{"k":"C","t":"Multiple delivery attempt decreases it."},{"k":"D","t":"Multiple delivery attempt increases it."}]},{"n":4,"t":"What is the effect of burning or burying returned clothes and products?","opts":[{"k":"A","t":"It releases 3 tons of CO2."},{"k":"B","t":"It absorbs 10 tons of CO2."},{"k":"C","t":"It releases 13 tons of CO2."},{"k":"D","t":"It saves 13 tons of CO2."}]},{"n":5,"t":"What is the companies’ positive action to address the carbon footprint problem?","opts":[{"k":"A","t":"resort to an alternative energy"},{"k":"B","t":"minimize delivery of products"},{"k":"C","t":"invest in electric delivery vehicles"},{"k":"D","t":"make an info graph for consumers"}]}],"opts":[],"ctx":[]},{"a":6,"b":10,"k":"gap","instr":["Complete each sentence with NO MORE THAN TWO WORDS or a NUMBER from the passage for each answer."],"items":[{"n":6,"t":"Using technology through the click of a ……, a customer can make purchases virtually.","opts":[]},{"n":7,"t":"Because of online shopping, a huge amount of merchandise worth almost …… is returned each year in the USA alone.","opts":[]},{"n":8,"t":"It is more cost-effective for companies to simply …… away returned items.","opts":[]},{"n":9,"t":"Managing returns …… remains a challenge that companies must cope with.","opts":[]},{"n":10,"t":"Online shoppers and non-government organizations call on companies to take full …… for their activities against the environment.","opts":[]}],"opts":[],"ctx":[]},{"a":11,"b":13,"k":"gap","instr":["Answer the questions below.","Choose NO MORE THAN TWO WORDS or a NUMBER from the passage for each answer."],"items":[{"n":11,"t":"What is the projected income from online sales for 2021?","opts":[]},{"n":12,"t":"What do companies offer to encourage shoppers to purchase their clothing items online?","opts":[]},{"n":13,"t":"What do online shoppers and concerned groups demand to save the environment?","opts":[]}],"opts":[],"ctx":[]}],"ans":{"1":{"v":"B","ex":"Part of the passage: Now, customers are increasingly buying online Explanation: at present = Now."},"2":{"v":"A","ex":"Part of the passage: You might think that online shopping is greener than in-store shopping. Explanation: misconception = اعتقاد خاطئ: إنه أصدق للبيئة."},"3":{"v":"D","ex":"Part of the passage: the driver has to make a second or third attempt… also contribute towards increasing the carbon footprint Explanation: المحاولات المتعددة تزيده."},"4":{"v":"C","ex":"Part of the passage: leading to 13 tons of CO2 being released Explanation: released = releases."},"5":{"v":"C","ex":"Part of the passage: various online retailers are starting to lower their carbon footprint by investing in electric delivery vehicles Explanation: positive news."},"6":{"v":"mouse","ex":"Part of the passage: with the click of a mouse Explanation: Paragraph 1."},"7":{"v":"$326 million","ex":"Part of the passage: merchandise worth nearly US$326 million is returned each year in the USA Explanation: almost = nearly.","alts":["US$326 million","326 million","$326m"]},"8":{"v":"throw","ex":"Part of the passage: many companies have found it cheaper to simply throw away the returned items Explanation: cost-effective = cheaper."},"9":{"v":"efficiently","ex":"Part of the passage: how to deal with returns efficiently and without waste is a challenge Explanation: Paragraph 6."},"10":{"v":"responsibility","ex":"Part of the passage: there is increasing pressure for companies to take responsibility Explanation: take responsibility."},"11":{"v":"$4.8 trillion","ex":"Part of the passage: by 2021, global online retail will reach an enormous US$4.8 trillion Explanation: projected = توقع.","alts":["US$4.8 trillion","4.8 trillion"]},"12":{"v":"free returns","ex":"Part of the passage: companies offer free returns to make it easier for shoppers to purchase Explanation: Paragraph 5."},"13":{"v":"urgent action","ex":"Part of the passage: campaign groups demand urgent action Explanation: concerned groups = campaign groups."}},"words":[{"w":"dramatically","pos":"adv","def":"in a sudden and very noticeable way","ex":"The way we shop has changed dramatically.","ar":"بشكل كبير ومفاجئ","lvl":""},{"w":"retail","pos":"n","def":"the sale of goods to the public","ex":"Global online retail will reach US$4.8 trillion.","ar":"البيع بالتجزئة","lvl":""},{"w":"carbon footprint","pos":"n","def":"the amount of carbon dioxide produced by an activity","ex":"Online shopping can have a large carbon footprint.","ar":"البصمة الكربونية","lvl":""},{"w":"merchandise","pos":"n","def":"goods that are bought and sold","ex":"Merchandise worth US$326 million is returned each year.","ar":"بضائع","lvl":""},{"w":"landfill","pos":"n","def":"a place where waste is buried in the ground","ex":"Two billion kilograms ends up in landfill.","ar":"مكب نفايات","lvl":""},{"w":"misconception","pos":"n","def":"a wrong idea or belief","ex":"It is a misconception that online shopping is always green.","ar":"فكرة خاطئة","lvl":""},{"w":"efficiently","pos":"adv","def":"in a way that works well without waste","ex":"How to deal with returns efficiently is a challenge.","ar":"بكفاءة","lvl":""},{"w":"urgent","pos":"adj","def":"needing to be dealt with immediately","ex":"Campaign groups demand urgent action.","ar":"عاجل","lvl":""}],"n":19,"untitled":false},{"key":"t2p2","kind":"full","test":2,"pp":2,"title":"Cause of Brain Freeze Revealed","intro":"Jennifer Welsh. Brain freeze is a nearly universal experience that researchers now believe is related to local changes in brain blood flow.","paras":[{"L":"A","t":"The majority of people have likely experienced brain freeze – the debilitating, instantaneous pain in the temples after eating something frozen – but researchers didn’t really understand what causes it, until now."},{"L":"B","t":"Previous studies have found that migraine sufferers are more likely to get brain freeze than people who do not get migraines. Because of this, the researchers thought the two might share some kind of common mechanism or cause, so they decided to use brain freeze to study migraines."},{"L":"C","t":"Headaches like migraines are difficult to study because they are unpredictable. Researchers are not able to monitor a whole one from start to finish in the lab. They can give drugs to induce migraines, but those can also have side effects that interfere with the results. However, brain freeze can quickly and easily be used to start a headache in the lab, and it also ends quickly, which makes monitoring the entire event easy."},{"L":"D","t":"The researchers brought on brain freeze in the lab by having 13 healthy volunteers sip ice water through a straw, right up against the roof of their mouth. The volunteers raised their hands when they felt the familiar brain freeze come on and raised them again once it disappeared."},{"L":"E","t":"The researchers monitored the blood flow through their brains using an ultrasound-like process on the skull. They saw an increased blood flow to the brain through a blood vessel called the anterior cerebral artery, which is located in the middle of the brain behind the eyes. This increase in flow and resulting increase in size in this artery brought on the pain associated with brain freeze."},{"L":"F","t":"When the artery constricts, reining in the response to this increased flow, the pain disappears. The dilation, then quick constriction, of this blood vessel may be a type of self-defense for the brain, the researchers suggested."},{"L":"G","t":"\"The brain is one of the relatively important organs in the body, and it needs to be working all the time,\" study researcher Jorge Serrador, of Harvard Medical School, said in a statement. \"It’s fairly sensitive to temperature, so vasodilation [the widening of the blood vessels] might be moving warm blood inside tissue to make sure the brain stays warm.\""},{"L":"H","t":"This influx of blood can’t be cleared as quickly as it comes in during the brain freeze, so it could raise the pressure inside the skull and induce pain that way. As the pressure and temperature in the brain rise, the blood vessel constricts, reducing pressure in the brain before it reaches dangerous levels."}],"groups":[{"a":14,"b":18,"k":"head","instr":["The passage has eight paragraphs, A–H. Choose the most suitable heading for paragraphs B–F from the list of headings below.","Note: There are more headings than paragraphs."],"items":[{"n":14,"t":"Paragraph B","opts":[]},{"n":15,"t":"Paragraph C","opts":[]},{"n":16,"t":"Paragraph D","opts":[]},{"n":17,"t":"Paragraph E","opts":[]},{"n":18,"t":"Paragraph F","opts":[]}],"opts":[{"k":"i","t":"How blood flow contributes to pain"},{"k":"ii","t":"Preference for ice cream"},{"k":"iii","t":"Participation of volunteers"},{"k":"iv","t":"Challenges in studying headaches"},{"k":"v","t":"Ice cream brain freeze"},{"k":"vi","t":"Patients susceptible to brain freeze"},{"k":"vii","t":"Narrowing of the arteries"},{"k":"viii","t":"Valuable and hardworking body part"}],"ctx":[]},{"a":19,"b":23,"k":"tf","instr":["Do the following statements agree with the information given in the passage?","Write TRUE if the statement agrees with the information, FALSE if the statement contradicts the information, NOT GIVEN if there is no information on this."],"items":[{"n":19,"t":"Most people know the pain of brain freeze.","opts":[]},{"n":20,"t":"It takes a long time to monitor how brain freeze occurs.","opts":[]},{"n":21,"t":"The anterior cerebral artery shows how blood flow causes brain freeze.","opts":[]},{"n":22,"t":"Jorge Serrador is one of the participants in the research.","opts":[]},{"n":23,"t":"The brain reacts easily to temperature.","opts":[]}],"opts":[],"ctx":[]},{"a":24,"b":26,"k":"gap","instr":["Answer the questions below.","Choose NO MORE THAN FOUR WORDS from the passage for each answer."],"items":[{"n":24,"t":"What increases when brain freeze occurs?","opts":[]},{"n":25,"t":"In which part of the brain can the anterior cerebral artery be found?","opts":[]},{"n":26,"t":"What happens to the blood vessel when brain freeze pain disappears?","opts":[]}],"opts":[],"ctx":[]}],"ans":{"14":{"v":"vi","ex":"Part of the passage: migraine sufferers are more likely to get brain freeze Explanation: susceptible = more likely to get."},"15":{"v":"iv","ex":"Part of the passage: Headaches like migraines are difficult to study because they are unpredictable. Explanation: difficult to study = challenges."},"16":{"v":"iii","ex":"Part of the passage: having 13 healthy volunteers sip ice water through a straw Explanation: المتطوعين."},"17":{"v":"i","ex":"Part of the passage: This increase in flow and resulting increase in size in this artery brought on the pain Explanation: blood flow + pain."},"18":{"v":"vii","ex":"Part of the passage: When the artery constricts… the pain disappears. Explanation: constricts = narrowing."},"19":{"v":"T","ex":"Part of the passage: The majority of people have likely experienced brain freeze Explanation: majority = most."},"20":{"v":"F","ex":"Part of the passage: it also ends quickly, which makes monitoring the entire event easy Explanation: سهل وسريع، عكس الجملة."},"21":{"v":"T","ex":"Part of the passage: They saw an increased blood flow to the brain through a blood vessel called the anterior cerebral artery… This increase in flow and resulting increase in size in this artery brought on the pain Explanation: الزيادة في تدفق الدم عبر هذا الشريان هي اللي تسبب الألم."},"22":{"v":"NG","ex":"Part of the passage: study researcher Jorge Serrador, of Harvard Medical School Explanation: مفتاح الكتاب: NOT GIVEN. القطعة تقول إنه باحث في الدراسة، لكن ما تقول إذا كان من المشاركين (المتطوعين) أو لا."},"23":{"v":"T","ex":"Part of the passage: It’s fairly sensitive to temperature Explanation: sensitive = reacts easily."},"24":{"v":"blood flow","ex":"Part of the passage: They saw an increased blood flow to the brain Explanation: Paragraph E.","alts":["blood flow to the brain","the blood flow"]},"25":{"v":"middle of the brain","ex":"Part of the passage: which is located in the middle of the brain behind the eyes Explanation: لا تتجاوزين ٤ كلمات.","alts":["middle","the middle of the brain","behind the eyes","in the middle"]},"26":{"v":"constricts","ex":"Part of the passage: When the artery constricts… the pain disappears Explanation: Paragraph F.","alts":["it constricts"]}},"words":[{"w":"debilitating","pos":"adj","def":"making someone very weak","ex":"Brain freeze is a debilitating pain in the temples.","ar":"مُنهِك / مُعيق","lvl":""},{"w":"instantaneous","pos":"adj","def":"happening immediately","ex":"The instantaneous pain after eating something frozen.","ar":"فوري / لحظي","lvl":""},{"w":"mechanism","pos":"n","def":"the way something works","ex":"The two might share a common mechanism.","ar":"آلية","lvl":""},{"w":"unpredictable","pos":"adj","def":"likely to change suddenly","ex":"Migraines are difficult to study because they are unpredictable.","ar":"لا يمكن توقعه","lvl":""},{"w":"induce","pos":"v","def":"to cause something to happen","ex":"Drugs can induce migraines.","ar":"يُحدث / يسبّب","lvl":""},{"w":"artery","pos":"n","def":"a tube that carries blood from the heart","ex":"The anterior cerebral artery is behind the eyes.","ar":"شريان","lvl":""},{"w":"constrict","pos":"v","def":"to become narrower","ex":"When the artery constricts, the pain disappears.","ar":"يضيق / ينقبض","lvl":""},{"w":"influx","pos":"n","def":"a large amount arriving suddenly","ex":"This influx of blood can’t be cleared quickly.","ar":"تدفّق","lvl":""}],"n":20,"untitled":false},{"key":"t2p3","kind":"full","test":2,"pp":3,"title":"On kids and masks, I’m following my gut","intro":"S. E. Cupp (CNN)","paras":[{"L":"","t":"It’s happening. The US Centers for Disease Control and Prevention has liberated Americans who are fully vaccinated against Covid-19 from our masks. Indoors and out, in most situations, we can finally roam face out again."},{"L":"","t":"After a year of stuffy-face condensation, fogged-up glasses, smeared lipstick, \"mascne\" and \"I can’t tell who that is\" polite nodding, won’t it be spectacular to feel the sun on our cheeks and the wind on our teeth?"},{"L":"","t":"Of course, all of the nuisances that came with masking up were worth it to keep us safe from the virus (and there are many circumstances – flying in an airplane, for example – in which I’m likely to continue the practice in the future)."},{"L":"","t":"But the urgency of mask-wearing also prompted an embarrassing cultural low for America, as former President Donald Trump and his supporters – most recently former Alaska governor Sarah Palin – politicized the science of health and safety by mocking masks as unnecessary, unmanly and … wait for it … an affront to personal liberty. Fox’s Tucker Carlson even grotesquely implored his millions of viewers to call the police on parents whose kids wear masks outside. Good riddance to all that garbage, hopefully."},{"L":"","t":"Except now that vaccinated adults and teens can revel in their rediscovered lower faces, we still don’t know what to do about our kids. Children under the age of 12 aren’t eligible yet for vaccines, so how do we keep protecting them? The answers from experts aren’t exactly clear."},{"L":"","t":"Dr. Anthony Fauci, the nation’s top infectious disease expert, said that children should continue wearing masks, particularly indoors. Dr. Lucy McBride, an internist in Washington, DC, wrote in the Atlantic that she tells her patients not to mask kids outside, that \"for most young people, the social and emotional benefits of taking masks off outdoors greatly outweigh the personal and public-health advantages of keeping them on.\" That seems like a fair point but notice she didn’t say that there aren’t any public-health advantages to masking – there are, and the science has been very clear on that."},{"L":"","t":"Schools are debating what to do about masks in classrooms for the fall, and states and local municipalities are making changes to their rules (in schools and for businesses and public places where children under 12 are likely to go). What does this all mean? It appears to mean that masking up our kids will be a largely situational endeavor, and that it will mostly be up to parents to decide."},{"L":"","t":"That’s fine with me, to be honest. While clear and decisive guidance from experts is always preferable, there are plenty of reasons why parents should follow their instincts and do what’s best for their kids and their communities. In my Connecticut town, for example, the two-week positivity rate is a mere .08%. My 6-year-old will continue to wear a mask at school, in stores, and outdoors if playing with a lot of kids. But for small playdates in our yard and other socially distant outdoor activities, we will continue to allow him to go maskless."},{"L":"","t":"If there were a Covid spike, or a higher positivity rate here, I’d feel differently. As we have from the beginning, with masks, school, travel and everything else, we follow the data, and decide accordingly."},{"L":"","t":"The great thing about children is they’re adaptable. My son never protests about wearing a mask and has just as much fun when he’s wearing it as he does without it. I realize that’s not the case for every kid – and not easy for every parent. We all just keep doing our best. No one wants their kids in masks forever – they need to see other kids’ faces and feel as though their expressions are being seen. The time will come, I’m certain, when masks are mostly a thing of the past. But until then, we’ll just have to continue to play it safe with our kids and do what we’ve always done – follow our gut."}],"groups":[{"a":27,"b":31,"k":"match","instr":["Match each statement with the correct name, A–F."],"items":[{"n":27,"t":"Kids must wear masks.","opts":[]},{"n":28,"t":"Report parents to the police if they require their children to wear masks.","opts":[]},{"n":29,"t":"Wearing a mask is not important, and it also reduces manliness.","opts":[]},{"n":30,"t":"Children should not wear masks outdoors.","opts":[]},{"n":31,"t":"People who completed their vaccine jabs do not need to wear masks.","opts":[]}],"opts":[{"k":"A","t":"The US Centers for Disease Control and Prevention"},{"k":"B","t":"Sarah Palin"},{"k":"C","t":"Tucker Carlson"},{"k":"D","t":"Dr. Anthony Fauci"},{"k":"E","t":"Dr. Lucy McBride"},{"k":"F","t":"Parents"}],"ctx":[],"optTitle":"List of Names"},{"a":32,"b":36,"k":"yn","instr":["Do the following statements agree with the claims of the writer in the passage?","Write YES if the statement agrees with the claims of the writer, NO if the statement contradicts the claims of the writer, NOT GIVEN if it is impossible to say what the writer thinks about this."],"items":[{"n":32,"t":"All the inconvenience of wearing a mask is nothing compared to our health and safety.","opts":[]},{"n":33,"t":"The urgency of wearing a mask is a proud moment for America.","opts":[]},{"n":34,"t":"Schools argue about the “wearing of mask” policy in classrooms.","opts":[]},{"n":35,"t":"Parents are hesitant whether to encourage or stop their children from wearing masks.","opts":[]},{"n":36,"t":"Children do mind wearing masks.","opts":[]}],"opts":[],"ctx":[]},{"a":37,"b":40,"k":"gap","instr":["Complete the summary with words from the passage.","Write NO MORE THAN FOUR WORDS for each answer."],"items":[],"opts":[],"ctx":["The US Center for Disease Control and Prevention has given approval for fully vaccinated individuals to stop wearing masks. This applies to adults and teenagers, but not 37 …… . However, some experts are divided about this “wearing of mask” policy. This is an issue not only for the schools to debate, but also the 38 …… which make changes to their rules in schools and public places. It also calls for the 39 …… to decide. Being guided by the experts’ opinion, parental 40 …… remain their defense in deciding what is best for their children."],"mode":"sum"}],"ans":{"27":{"v":"D","ex":"Part of the passage: Dr. Anthony Fauci… said that children should continue wearing masks Explanation: Fauci."},"28":{"v":"C","ex":"Part of the passage: Tucker Carlson even grotesquely implored his millions of viewers to call the police on parents Explanation: Carlson."},"29":{"v":"B","ex":"Part of the passage: most recently former Alaska governor Sarah Palin – politicized the science… by mocking masks as unnecessary, unmanly Explanation: Palin."},"30":{"v":"E","ex":"Part of the passage: she tells her patients not to mask kids outside Explanation: McBride."},"31":{"v":"A","ex":"Part of the passage: has liberated Americans who are fully vaccinated against Covid-19 from our masks Explanation: CDC."},"32":{"v":"Y","ex":"Part of the passage: all of the nuisances that came with masking up were worth it to keep us safe Explanation: nuisances = inconvenience."},"33":{"v":"N","ex":"Part of the passage: prompted an embarrassing cultural low for America Explanation: embarrassing عكس proud."},"34":{"v":"Y","ex":"Part of the passage: Schools are debating what to do about masks in classrooms Explanation: debating = argue."},"35":{"v":"NG","ex":"Explanation: الكاتبة تقول القرار للأهل، لكن ما تقول إنهم مترددين."},"36":{"v":"N","ex":"Part of the passage: My son never protests about wearing a mask Explanation: ابنها ما يمانع."},"37":{"v":"kids","ex":"Part of the passage: we still don’t know what to do about our kids Explanation: مفتاح الكتاب: kids.","alts":["children","children under 12","children under the age of 12"]},"38":{"v":"states and local municipalities","ex":"Part of the passage: states and local municipalities are making changes to their rules Explanation: أربع كلمات بالضبط."},"39":{"v":"parents","ex":"Part of the passage: it will mostly be up to parents to decide Explanation: up to parents to decide."},"40":{"v":"instincts","ex":"Part of the passage: parents should follow their instincts Explanation: parental instincts."}},"words":[{"w":"liberate","pos":"v","def":"to make someone free","ex":"The CDC has liberated vaccinated Americans from masks.","ar":"يحرّر","lvl":""},{"w":"nuisance","pos":"n","def":"something annoying","ex":"All of the nuisances that came with masking up were worth it.","ar":"إزعاج","lvl":""},{"w":"mock","pos":"v","def":"to laugh at someone in an unkind way","ex":"They mocked masks as unnecessary.","ar":"يسخر من","lvl":""},{"w":"eligible","pos":"adj","def":"allowed to do or receive something","ex":"Children under 12 aren’t eligible yet for vaccines.","ar":"مؤهَّل / يحق له","lvl":""},{"w":"outweigh","pos":"v","def":"to be greater or more important than","ex":"The benefits greatly outweigh the advantages of keeping them on.","ar":"يفوق (في الأهمية)","lvl":""},{"w":"instinct","pos":"n","def":"a natural feeling about what to do","ex":"Parents should follow their instincts.","ar":"غريزة / إحساس داخلي","lvl":""},{"w":"adaptable","pos":"adj","def":"able to change to suit new situations","ex":"The great thing about children is they’re adaptable.","ar":"قابل للتكيّف","lvl":""},{"w":"situational","pos":"adj","def":"depending on the situation","ex":"Masking up our kids will be a situational endeavor.","ar":"حسب الموقف","lvl":""}],"n":21,"untitled":false},{"key":"t3p1","kind":"full","test":3,"pp":1,"title":"The Dragon and the Net","intro":null,"paras":[{"L":"A","t":"As more and more Chinese are gaining access to the Internet, China’s authorities are finding themselves with a digital dilemma. The new technology is transforming the way we do everything. However, because of its lack of central control, the Chinese authorities are wary. They see the spread of the global network of information as offering both positive and negative aspects."},{"L":"B","t":"The negatives threaten to facilitate contact and collusion among far-flung opponents of the Socialist Government and to transmit subversive opinions, unwelcome information, and unapproved news. For example, a group of computer hackers (people who try to gain unauthorized access to computer systems) have promised to destroy China’s network systems. This anonymous group, calling themselves ‘Legion of the Underground’, is angry about China’s human rights abuses and wants to pressurize the Government. Pornography is an additional threat to the ‘spiritual civilization’ that China’s leaders wish to build."},{"L":"C","t":"The positives are the benefits of easier academic exchanges, scientific co-operation, and the transfer of technical and business information. The mundane work of China’s bureaucrats and secret policemen should become easier with greater use of the technology. The police are already rumored to be sufficiently wired to know when a foreigner checks into a hotel in any big city. Even if they are not, they at least benefit from the public belief that their surveillance is effective."},{"L":"D","t":"At present not all Chinese people have access to the Internet, but this is rapidly changing. It is estimated that early next decade the number of Internet users will rise to over 800 million. Before 2014, the Internet was only used by those in academic and scientific fields, but use has become more widespread. Use of the Internet is spreading rapidly, and some observers think that the government’s forecast of 900 million users by the year 2020 was too small and the real number will be much higher."},{"L":"E","t":"Officials have the problem of trying to promote what they see as good in the use of the Internet while restricting what they do not like. The authorities fear the lack of centralised control which characterises the Internet and have taken steps to try and limit what the public can do. Recently a formal set of regulations on Internet usage was introduced which replaced temporary guidelines. The new rules forbid the user from doing anything online to harm national unity or incite the overthrow of China’s socialist system. Sex, gambling, terrorism, and other assorted sins are likewise forbidden. Needless to say, any form of political expression is absolutely banned."},{"L":"F","t":"Since they have ultimate control over the country’s main data pipelines leading to the Internet, the authorities have two ways to enforce the rules. One is to monitor what Chinese surfers do online in order to find and punish those breaking the rules. The other is to block the electronic path to objectionable material with filtering software. Among the sites currently blocked are those of several western news organizations, including CNN and TIME Magazine."},{"L":"G","t":"Yet both methods are, in the long run, losing battles. Monitoring Internet traffic is a tedious and time-consuming affair that will only become more difficult as the volume increases. As for filtering, even though China is using ever more sophisticated software (much of it provided by American firms), clever users can defeat it. Moreover, the young, electronically talented workers needed to provide this supervisory role are likely to be more inclined (and certainly better paid) selling their services to the private sector rather than the government’s Internet nannies."},{"L":"H","t":"Chinese service-providers say that most users are trying to get ahead in life rather than topple the government. They are checking share prices, looking for business leads and doing much of their browsing on Chinese language software and accessing Chinese rather than foreign websites. In essence, their character seems to be in keeping with the rest of the world. They are just exploring the convenience of access to information and ease of communication."},{"L":"I","t":"Others say Internet users need not be explicitly subversive in order to transform China. The change, they say, will not come from the Internet’s firebrands, but rather from its presentation of varied views and voices. A technology consultant in Beijing observed that the most recent graduates from Beijing University have a markedly different outlook from their predecessors."},{"L":"J","t":"Over the past decade, the number of Chinese Internet users has grown at a remarkable pace. As of the first quarter of 2020, the total volume of Internet users in the world’s most populous country had amounted to approximately 904 million, up from 829 million at the end of 2018. Apart from extended access to broadband Internet connections, mobile Internet took up a large share in internet user growth. The share of users in the country accessing the Internet via mobile devices had significantly exceeded that of those via desktop. About 98.6 percent of Chinese internet users accessed the web via mobile phone."}],"groups":[{"a":1,"b":5,"k":"gap","instr":["Below is a summary of the first three paragraphs of the passage. Complete the summary.","Choose NO MORE THAN THREE WORDS from the passage for each answer."],"items":[],"opts":[],"ctx":["Internet users in China have increased rapidly and the government is facing problems. Because the Internet does not have 1 …… the Chinese authorities are becoming nervous. They see advantages as well as disadvantages. One disadvantage is that it may promote 2 …… among people from around the world who oppose the socialist government. On the other hand, the Internet also offers some benefits, for instance, easier co-operation in academic and scientific fields as well as communication of 3 …… information. Using this technology also makes the work of secret policemen become 4 …… to monitor people’s activities. For instance, it is believed that as soon as a 5 …… arrives at a big city hotel, the police have access to this information."],"mode":"sum"},{"a":6,"b":10,"k":"head","instr":["Choose the most suitable heading for paragraphs F–J from the list of headings below.","Note: There are more headings than paragraphs."],"items":[{"n":6,"t":"Paragraph F","opts":[]},{"n":7,"t":"Paragraph G","opts":[]},{"n":8,"t":"Paragraph H","opts":[]},{"n":9,"t":"Paragraph I","opts":[]},{"n":10,"t":"Paragraph J","opts":[]}],"opts":[{"k":"i","t":"Varied views leading to change"},{"k":"ii","t":"Problems with supervising Internet traffic"},{"k":"iii","t":"Disadvantages of the Internet"},{"k":"iv","t":"Global network"},{"k":"v","t":"Only good intentions of the users"},{"k":"vi","t":"Most populous country in the world"},{"k":"vii","t":"Internet access with mobile device"},{"k":"viii","t":"Ways to enforce Internet control"}],"ctx":[]},{"a":11,"b":13,"k":"mcq","instr":["Choose the correct letter A, B, C or D."],"items":[{"n":11,"t":"As Internet use spreads, what is the Chinese government’s main worry regarding its opponents?","opts":[{"k":"A","t":"easy for critics to contact each other"},{"k":"B","t":"more human rights abuses"},{"k":"C","t":"spread of pornography"},{"k":"D","t":"more Chinese gaining access"}]},{"n":12,"t":"What kind of political system does China have?","opts":[{"k":"A","t":"Capitalist"},{"k":"B","t":"Monarchy"},{"k":"C","t":"Socialist"},{"k":"D","t":"Democratic"}]},{"n":13,"t":"How do the opinions of the recent graduates of Beijing University compare with those of their predecessors?","opts":[{"k":"A","t":"exactly the same"},{"k":"B","t":"very different"},{"k":"C","t":"different"},{"k":"D","t":"almost the same"}]}],"opts":[],"ctx":[]}],"ans":{"1":{"v":"central control","ex":"Part of the passage: because of its lack of central control, the Chinese authorities are wary Explanation: wary = nervous."},"2":{"v":"contact and collusion","ex":"Part of the passage: facilitate contact and collusion among far-flung opponents Explanation: promote = facilitate."},"3":{"v":"technical and business","ex":"Part of the passage: the transfer of technical and business information Explanation: communication = transfer."},"4":{"v":"easier","ex":"Part of the passage: should become easier with greater use of the technology Explanation: become ___ ← صفة."},"5":{"v":"foreigner","ex":"Part of the passage: to know when a foreigner checks into a hotel in any big city Explanation: Paragraph C.","alts":["a foreigner"]},"6":{"v":"viii","ex":"Part of the passage: the authorities have two ways to enforce the rules Explanation: Paragraph F."},"7":{"v":"ii","ex":"Part of the passage: Monitoring Internet traffic is a tedious and time-consuming affair Explanation: Paragraph G."},"8":{"v":"v","ex":"Part of the passage: most users are trying to get ahead in life rather than topple the government Explanation: نوايا طيبة."},"9":{"v":"i","ex":"Part of the passage: will not come from the Internet’s firebrands, but rather from its presentation of varied views and voices Explanation: varied views."},"10":{"v":"vii","ex":"Part of the passage: About 98.6 percent of Chinese internet users accessed the web via mobile phone. Explanation: «Most populous country» فخ: تفصيلة."},"11":{"v":"A","ex":"Part of the passage: facilitate contact and collusion among far-flung opponents Explanation: critics = opponents."},"12":{"v":"C","ex":"Part of the passage: opponents of the Socialist Government Explanation: Socialist."},"13":{"v":"B","ex":"Part of the passage: have a markedly different outlook from their predecessors Explanation: markedly = very."}},"words":[{"w":"dilemma","pos":"n","def":"a difficult situation with two hard choices","ex":"China’s authorities have a digital dilemma.","ar":"معضلة","lvl":""},{"w":"wary","pos":"adj","def":"careful because you think something may be dangerous","ex":"The Chinese authorities are wary.","ar":"حذر","lvl":""},{"w":"facilitate","pos":"v","def":"to make something easier","ex":"The Internet may facilitate contact among opponents.","ar":"يسهّل","lvl":""},{"w":"mundane","pos":"adj","def":"ordinary and boring","ex":"The mundane work of bureaucrats.","ar":"روتيني / عادي","lvl":""},{"w":"surveillance","pos":"n","def":"careful watching of people","ex":"They benefit from the belief that their surveillance is effective.","ar":"مراقبة","lvl":""},{"w":"enforce","pos":"v","def":"to make people obey a rule","ex":"The authorities have two ways to enforce the rules.","ar":"يفرض / يطبّق","lvl":""},{"w":"tedious","pos":"adj","def":"boring and long","ex":"Monitoring Internet traffic is a tedious affair.","ar":"مملّ","lvl":""},{"w":"predecessor","pos":"n","def":"a person who had a position before someone else","ex":"Graduates have a different outlook from their predecessors.","ar":"سَلَف / اللي قبله","lvl":""}],"n":22,"untitled":false},{"key":"t3p2","kind":"full","test":3,"pp":2,"title":"Obesity in the Western World","intro":null,"paras":[{"L":"A","t":"Obesity is a huge problem in many Western countries and one which now attracts considerable medical interest as researchers take up the challenge to find a ‘cure’ for the common condition of being seriously overweight. However, rather than take responsibility for their weight, obese people have often sought solace in the excuse that they have a slow metabolism, a genetic hiccup which sentences more than half the Australian population (63% of men and 47% of women) to a life of battling with their weight. The argument goes like this: it doesn’t matter how little they eat; they gain weight because their bodies break down food and turn it into energy more slowly than those with a so-called normal metabolic rate."},{"L":"B","t":"‘This is nonsense,’ says Dr Susan Jebb from the Dunn Nutrition Unit at Cambridge in England. Despite the persistence of this metabolism myth, science has known for several years that the exact opposite is in fact true. Fat people have faster metabolisms than thin people. ‘What is very clear,’ says Dr Jebb, ‘is that overweight people actually burn off more energy. They have more cells, bigger hearts, bigger lungs and they all need more energy just to keep going.’"},{"L":"C","t":"It took only one night, spent in a sealed room at the Dunn Unit, to disabuse one of their patients of the beliefs of a lifetime: her metabolism was fast, not slow. By sealing the room and measuring the exact amount of oxygen she used, researchers were able to show her that her metabolism was not the culprit. It wasn’t the answer she expected and probably not the one she wanted, but she took the news philosophically."},{"L":"D","t":"Although the metabolism myth has been completely disproved, science has far from discounted our genes as being responsible for making us whatever weight we are, fat or thin. One of the world’s leading obesity researchers, geneticist Professor Stephen O’Rahilly, goes so far as to say we are on the threshold of a complete change in the way we view not only morbid obesity, but also everyday overweight. Prof. O’Rahilly’s groundbreaking work in Cambridge has proven that obesity can be caused by our genes. ‘These people are not weak-willed, slothful or lazy,’ says Prof. O’Rahilly. ‘They have a medical condition due to a genetic defect and that causes them to be obese.’"},{"L":"E","t":"In Australia, the University of Sydney’s Professor Ian Caterson says while major genetic defects may be rare, many people probably have minor genetic variations that combine to dictate weight and are responsible for things such as how much we eat, the amount of exercise we do and the amount of energy we need. When you add up all these little variations, the result is that some people are genetically predisposed to putting on weight. He says while the fast/slow metabolism debate may have been settled, that doesn’t mean some other subtle change in the metabolism gene won’t be found in overweight people. He is confident that science will, eventually, be able to ‘cure’ some forms of obesity but the only effective way for the vast majority of overweight and obese people to lose weight is a change of diet and an increase in exercise."},{"L":"F","t":"Despite the $500 million a year Australians spend trying to lose weight and the $830 million it costs the community in health care, obesity is at epidemic proportions here, as it is in all Western nations. Until recently, research and treatment for obesity had concentrated on behaviour modification, drugs to decrease appetite and surgery. How the drugs worked was often not understood and many caused severe side effects and even death in some patients. Surgery for obesity has also claimed many lives."},{"L":"G","t":"It has long been known that a part of the brain called the hypothalamus is responsible for regulating hunger, among other things. But it wasn’t until 1994 that Professor Jeffery Friedman from Rockefeller University in the US sent science in a new direction by studying an obese mouse. Prof. Friedman found that unlike its thin brothers, the fat mouse did not produce a hitherto unknown hormone called leptin. Manufactured by the fat cells, leptin acts as a messenger, sending signals to the hypothalamus to turn off the appetite. Previously, the fat cells were thought to be responsible simply for storing fat. Prof. Friedman gave the fat mouse leptin and it lost 30% of its body weight in two weeks."},{"L":"H","t":"On the other side of the Atlantic, Prof. O’Rahilly read about this research with great excitement. For many months two blood samples had lain in the bottom of his freezer, taken from two extremely obese young cousins. He hired a doctor to develop a test for leptin in human blood, which eventually resulted in the discovery that neither of the children’s blood contained the hormone. When one cousin was given leptin, she lost a stone in weight and Prof. O’Rahilly made medical history. Here was the first proof that a genetic defect could cause obesity in humans: our genes are responsible! But leptin deficiency turned out to be an extremely rare condition and there is a lot more research to be done before the ‘magic’ cure for obesity is ever found."}],"groups":[{"a":14,"b":19,"k":"para","instr":["The passage has eight paragraphs, A–H.","Which paragraph contains the following information? Write the correct letter, A–H."],"items":[{"n":14,"t":"An experiment to expose the falseness of the metabolism myth","opts":[]},{"n":15,"t":"Unfavourable effects of certain treatments for obesity","opts":[]},{"n":16,"t":"A reference to overweight people burning off more energy","opts":[]},{"n":17,"t":"A reference to a popular assumption related to the main cause of obesity","opts":[]},{"n":18,"t":"Replication of animal research on human beings","opts":[]},{"n":19,"t":"A reference to a hormone that is needed to lose weight","opts":[]}],"opts":[{"k":"A","t":""},{"k":"B","t":""},{"k":"C","t":""},{"k":"D","t":""},{"k":"E","t":""},{"k":"F","t":""},{"k":"G","t":""},{"k":"H","t":""}],"ctx":[]},{"a":20,"b":23,"k":"tf","instr":["Do the following statements agree with the information given in the passage?","Write TRUE if the statement agrees with the information, FALSE if the statement contradicts the information, NOT GIVEN if there is no information on this."],"items":[{"n":20,"t":"Obese people use less energy than thin people.","opts":[]},{"n":21,"t":"Obesity has been effectively managed in Australia because of their enormous spending on community health care.","opts":[]},{"n":22,"t":"Surgical interventions are safer than medication.","opts":[]},{"n":23,"t":"A chemical which regulates hunger is produced by fat cells.","opts":[]}],"opts":[],"ctx":[]},{"a":24,"b":27,"k":"gap","instr":["Complete each sentence with NO MORE THAN TWO WORDS from the passage for each answer."],"items":[{"n":24,"t":"According to Professor O’Rahilly, …… can now be viewed with a completely new perspective.","opts":[]},{"n":25,"t":"Generally, major …… are very rare; however, a combination of several minor hereditary factors affects our food and exercise habits.","opts":[]},{"n":26,"t":"An experiment on an …… carried out by Professor Friedman resulted in a new direction in research.","opts":[]},{"n":27,"t":"Many researchers believe that …… are responsible for obesity in animals and human beings.","opts":[]}],"opts":[],"ctx":[]}],"ans":{"14":{"v":"C","ex":"Part of the passage: By sealing the room and measuring the exact amount of oxygen she used Explanation: تجربة الغرفة المغلقة."},"15":{"v":"F","ex":"Part of the passage: many caused severe side effects and even death in some patients Explanation: unfavourable effects = side effects."},"16":{"v":"B","ex":"Part of the passage: overweight people actually burn off more energy Explanation: Paragraph B."},"17":{"v":"A","ex":"Part of the passage: obese people have often sought solace in the excuse that they have a slow metabolism Explanation: الاعتقاد الشائع."},"18":{"v":"H","ex":"Part of the passage: He hired a doctor to develop a test for leptin in human blood Explanation: من الفأر إلى الإنسان."},"19":{"v":"G","ex":"Part of the passage: a hitherto unknown hormone called leptin Explanation: Paragraph G."},"20":{"v":"F","ex":"Part of the passage: overweight people actually burn off more energy Explanation: العكس."},"21":{"v":"F","ex":"Part of the passage: Despite the $500 million… obesity is at epidemic proportions here Explanation: رغم الصرف، السمنة وباء."},"22":{"v":"NG","ex":"Part of the passage: Surgery for obesity has also claimed many lives. Explanation: الاثنين خطيرين، وما فيه مقارنة."},"23":{"v":"T","ex":"Part of the passage: Manufactured by the fat cells, leptin acts as a messenger, sending signals to the hypothalamus to turn off the appetite. Explanation: chemical = hormone."},"24":{"v":"obesity","ex":"Part of the passage: we are on the threshold of a complete change in the way we view not only morbid obesity Explanation: Paragraph D.","alts":["morbid obesity"]},"25":{"v":"genetic defects","ex":"Part of the passage: while major genetic defects may be rare Explanation: Paragraph E."},"26":{"v":"obese mouse","ex":"Part of the passage: by studying an obese mouse Explanation: an ___ ← obese mouse."},"27":{"v":"genes","ex":"Part of the passage: our genes are responsible! Explanation: Paragraph H.","alts":["our genes"]}},"words":[{"w":"obese","pos":"adj","def":"very fat, in a way that is unhealthy","ex":"Obese people have often sought solace in an excuse.","ar":"بدين جدًا","lvl":""},{"w":"metabolism","pos":"n","def":"the chemical processes by which the body uses food","ex":"Fat people have faster metabolisms than thin people.","ar":"الأيض / معدل الحرق","lvl":""},{"w":"myth","pos":"n","def":"a false belief","ex":"The metabolism myth has been completely disproved.","ar":"خرافة","lvl":""},{"w":"culprit","pos":"n","def":"the cause of a problem","ex":"Her metabolism was not the culprit.","ar":"المتسبّب / المذنب","lvl":""},{"w":"genetic","pos":"adj","def":"related to genes","ex":"They have a medical condition due to a genetic defect.","ar":"وراثي / جيني","lvl":""},{"w":"predisposed","pos":"adj","def":"likely to suffer from something","ex":"Some people are genetically predisposed to putting on weight.","ar":"لديه قابلية / مهيّأ","lvl":""},{"w":"appetite","pos":"n","def":"the feeling of wanting to eat","ex":"Leptin sends signals to turn off the appetite.","ar":"شهية","lvl":""},{"w":"deficiency","pos":"n","def":"a lack of something necessary","ex":"Leptin deficiency turned out to be extremely rare.","ar":"نقص","lvl":""}],"n":23,"untitled":false},{"key":"t3p3","kind":"full","test":3,"pp":3,"title":"Apples & Burgers","intro":"McDonald’s buys so much food that its product decisions affect United States farmers.","tbl":{"head":["","Beef","Potatoes","Lettuce","Tomatoes","Fresh apples","Grapes"],"rows":[["Approx. annual purchase by McDonald’s (’05 expected), pounds","1 billion","1 billion","110 million","50 million","54 million","11 million"],["’04 U.S. production, pounds","24.5 billion","45.6 billion","220 billion","72 billion","10 billion","12 billion"],["McDonald’s share","4.1%","2.2%","0.05%","0.07%","0.5%","0.09%"]],"note":"(A planned fruit-and-walnut salad will contain apples and grapes.)"},"paras":[{"L":"A","t":"Each day, 50,000 shiny red Gala apples work their way through a sprawling factory in Swedesboro, New Jersey, where 26 machines wash, core, peel, seed, slice, and chill the
