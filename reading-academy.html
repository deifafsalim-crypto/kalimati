e numerous تحتاج اسم جمع بعدها."},"8":{"v":"C","ex":"Part of the passage: effectively bridged the gap between scientific treatise and popular entertainment Explanation: bridged the gap = showed the link. الفقرة 5."},"9":{"v":"B","ex":"Part of the passage: She was named a Messenger of Peace by the United Nations in 2002 and a Dame of the British Empire by Queen Elizabeth II in 2003. Explanation: الفقرة 6 عن الجوائز."},"10":{"v":"D","ex":"Part of the passage: she always holds and radiates hope, and passionately believes in humanity’s ability to evolve and change our ways Explanation: آخر جملة في الفقرة 7."}},"words":[{"w":"credentials","pos":"n","def":"education, achievements and experience that prove one’s ability","ex":"My daughter’s excellent credentials helped her to get her dream job.","ar":"المؤهلات","lvl":""},{"w":"kinship","pos":"n","def":"a strong relationship or connection","ex":"There is a special kind of kinship among soldiers.","ar":"قرابة / صلة قوية","lvl":""},{"w":"realm","pos":"n","def":"an area or sphere of interest or activity","ex":"Astronauts travel into an unknown realm to study more about space.","ar":"عالم / مجال","lvl":""},{"w":"primates","pos":"n","def":"members of the most developed and intelligent group of mammals","ex":"This was one of the most trailblazing studies of primates.","ar":"الرئيسيات (القردة وأشباهها)","lvl":""},{"w":"trailblazing","pos":"adj","def":"introducing new ideas for people to follow","ex":"Her study was trailblazing.","ar":"رائد / فاتح طريق جديد","lvl":""},{"w":"research","pos":"n","def":"a detailed study of a subject","ex":"Scientists are carrying out various types of research to find a cure.","ar":"بحث علمي","lvl":""},{"w":"species","pos":"n","def":"a set of animals or plants that have similar characteristics","ex":"The Arabian oryx is an endangered species.","ar":"نوع (من الكائنات)","lvl":""},{"w":"venture into","pos":"phr v","def":"to do something or go somewhere even though it involves risk","ex":"She ventured into the little-known world of wild chimpanzees.","ar":"يغامر بالدخول إلى","lvl":""},{"w":"ethology","pos":"n","def":"the study of animal behavior","ex":"She received a Ph.D. in ethology from Cambridge University.","ar":"علم سلوك الحيوان","lvl":""},{"w":"unorthodox","pos":"adj","def":"different from what is usual or accepted","ex":"She took an unorthodox approach in her field research.","ar":"غير تقليدي","lvl":""}],"n":8,"untitled":false,"pp":1},{"key":"u8","kind":"unit","no":8,"title":"What is the Largest Desert on Earth?","intro":null,"u":{"en":"Finding Information in Paragraphs","ar":"أي فقرة فيها المعلومة؟","color":"--skyc","icon":"search","focus":"Answering matching information questions","info_en":["You need to find the paragraph that contains the paraphrased information in the question.","The information can be a reason, a description, an explanation, a comparison, an example, or a definition.","Your answer is the letter of the relevant paragraph. Some questions may relate to more than one paragraph.","The questions do not follow the order of information in the passage."],"info_ar":["تدوّرين أي فقرة فيها المعلومة المكتوبة بصياغة ثانية (paraphrase).","المعلومة ممكن تكون: سبب، وصف، شرح، مقارنة، مثال، أو تعريف. ركّزي على نوعها.","الجواب حرف الفقرة، وممكن نفس الفقرة تتكرر.","الأسئلة هنا ما تمشي بترتيب القطعة، ولهذا غالبًا تحلينها بعد باقي الأسئلة."],"steps":[["Read through the questions and underline the keywords.","اقرئي الأسئلة وحطي خط تحت الكلمات المفتاحية."],["Skim through the passage, marking any parts that match the keywords in the questions.","اقرئي القطعة بسرعة وعلّمي الأجزاء اللي تطابق."],["Beginning with the first question, find the idea that is similar to that presented in each question.","ابدئي بالسؤال الأول ودوّري الفكرة المشابهة."]],"tip":"Look for the TYPE of information: “a comparison”, “an example”, “a definition”. Words like “not just… it is also…” often signal a definition.","warm":[{"k":"choose","q":"Exercise 1: “Centuries ago, most journeys were in the 20 km range, the distance easily accessible by animals such as horses and donkeys. Today, about 90 percent of inland cargo around the world is carried by trucks.” What is it about?","opts":["A comparison of the past and present transportation methods","A contrast of modern and old technology","An example of old kinds of transport"],"a":0,"why":"Centuries ago مقابل Today = مقارنة."},{"k":"choose","q":"“There are now around two billion cars in the world, and the number is rising each year. The average distance driven by car users is also increasing.”","opts":["How cars are driven","The growing use of motor vehicles","The significant use of cars"],"a":1,"why":"the number is rising + increasing = growing use."},{"k":"choose","q":"“Speed reading is not just about reading fast. It is also about how much information one can remember.”","opts":["How much to read in speed reading","The fastest reading speeds","A definition of speed reading"],"a":2,"why":"not just… It is also… = تعريف."}],"no":8},"paras":[{"L":"A","t":"When you hear the word desert, what comes to mind? Chances are, you’d think of sun, sand, and very little in the way of rain. Perhaps cacti, vultures, mesas, and scorpions come to mind as well, or possibly camels and oases? But in truth, deserts come in all shapes and sizes, and vary considerably from one part of the world to the next."},{"L":"B","t":"Like all of Earth’s climates, it all comes down to some basic characteristics that they share – which in this case, involves being barren, dry, and hostile to life. For this reason, you might be surprised to learn that the largest desert in the world is actually in Antarctica. How’s that for a curveball?"},{"L":"C","t":"To break it down, a desert is a region that is simply very dry because it receives little to no water. To be considered a desert, an area must receive less than 250 millimeters of annual precipitation. But precipitation can take the form of rain, snow, mist, or fog – literally any form of water being transferred from the atmosphere to the earth."},{"L":"D","t":"Deserts are often some of the hottest and most inhospitable places on Earth, as exemplified by the Sahara Desert in Africa, the Gobi Desert in northern China and Mongolia, and Death Valley in California. But they can also be cold, windswept landscapes where little to no snow ever falls – like in the Antarctic and Arctic."},{"L":"E","t":"So in the end, being hot has little to do with it. In fact, it would be more accurate to say that deserts are characterized by little to no moisture and extremes in temperature. All told, deserts make up one-third of the surface of the Earth. But most of that is found in the polar regions."},{"L":"F","t":"In terms of sheer size, the Antarctic Desert is the largest desert on Earth, measuring a total of 13.8 million square kilometers. Antarctica is the coldest, windiest, and most isolated continent on Earth, and is considered a desert because its annual precipitation can be less than 51 mm in the interior."},{"L":"G","t":"It’s covered by a permanent ice sheet that contains 90% of the Earth’s fresh water. Only 2% of the continent isn’t covered by ice, and this land is strictly along the coasts, where all the life that is associated with the land mass (i.e., penguins, seals, and various species of birds) reside. The other 98% of Antarctica is covered by ice which averages 1.6 km in thickness."},{"L":"H","t":"Interestingly, the second-largest desert in the world is also notoriously cold – The Arctic Desert. Located above 75 degrees north latitude, the Arctic Desert covers a total area of about 13.7 million square km (5.29 million square mi). Here, the total amount of precipitation is below 250mm (10 inches), which is predominantly in the form of snow."},{"L":"I","t":"The average temperature in the Arctic Desert is -20 °C, reaching as low as -50 °C in the winter. But perhaps the most interesting aspect of the Arctic Desert is its sunshine patterns. During the summer months, the sun doesn’t set for a period of 60 days. These are then followed in the winter by a period of prolonged darkness."},{"L":"J","t":"The third largest desert in the world is the more familiar Sahara, with a total size of 9.4 million square km. The average annual rainfall ranges from very low (in the northern and southern fringes of the desert) to nearly non-existent over the central and the eastern part. All told, most of the Sahara receives less than 20 mm (0.79 in)."},{"L":"K","t":"Temperatures are also quite intense in the Sahara and can rise to more than 50 °C. Interestingly, this is not the hottest desert on the planet though. The hottest temperature ever recorded on Earth was 70.7 °C (159 °F), which was taken in the Lut Desert of Iran. These measurements were part of a global temperature survey conducted by scientists at NASA’s Earth Observatory during the summers of 2003 to 2009."},{"L":"L","t":"In short, deserts are not just sand dunes and places where you might come across Bedouins and Berbers. They are common to every continent of the world and can take the form of sandy deserts or icy deserts. In the end, the defining characteristic is their pronounced lack of moisture."}],"groups":[{"a":1,"b":8,"k":"para","instr":["The passage has twelve paragraphs, A–L.","Which paragraphs concentrate on the following information? Choose the correct letter, A–L."],"items":[{"n":1,"t":"Second in ranking in land area","opts":[]},{"n":2,"t":"Almost without water","opts":[]},{"n":3,"t":"Different examples of a desert","opts":[]},{"n":4,"t":"Comparatively familiar","opts":[]},{"n":5,"t":"Common understanding of a desert","opts":[]},{"n":6,"t":"Pronounced characteristic of deserts","opts":[]},{"n":7,"t":"Two-month sunshine","opts":[]},{"n":8,"t":"It’s not the heat!","opts":[]}],"opts":[{"k":"A","t":""},{"k":"B","t":""},{"k":"C","t":""},{"k":"D","t":""},{"k":"E","t":""},{"k":"F","t":""},{"k":"G","t":""},{"k":"H","t":""},{"k":"I","t":""},{"k":"J","t":""},{"k":"K","t":""},{"k":"L","t":""}],"ctx":[]}],"ans":{"1":{"v":"H","ex":"Part of the passage: the second-largest desert in the world is also notoriously cold – The Arctic Desert Explanation: Second in ranking = second-largest."},"2":{"v":"C","ex":"Part of the passage: a desert is a region that is simply very dry because it receives little to no water Explanation: almost without water = little to no water."},"3":{"v":"D","ex":"Part of the passage: as exemplified by the Sahara Desert in Africa, the Gobi Desert in northern China and Mongolia, and Death Valley in California Explanation: exemplified = أمثلة."},"4":{"v":"J","ex":"Part of the passage: The third largest desert in the world is the more familiar Sahara Explanation: comparatively familiar = the more familiar."},"5":{"v":"A","ex":"Part of the passage: Chances are, you’d think of sun, sand, and very little in the way of rain. Explanation: وش يجي في بالك لما تسمعين كلمة صحراء = الفهم الشائع."},"6":{"v":"L","ex":"Part of the passage: In the end, the defining characteristic is their pronounced lack of moisture. Explanation: pronounced characteristic = the defining characteristic."},"7":{"v":"I","ex":"Part of the passage: During the summer months, the sun doesn’t set for a period of 60 days. Explanation: 60 يوم = شهرين."},"8":{"v":"E","ex":"Part of the passage: So in the end, being hot has little to do with it. Explanation: It’s not the heat = being hot has little to do with it."}},"words":[{"w":"inhospitable","pos":"adj","def":"harsh, difficult, and unsuitable for people to live in","ex":"The land is an inhospitable environment for most fish.","ar":"قاسٍ / غير صالح للعيش","lvl":""},{"w":"accurate","pos":"adj","def":"exact and correct","ex":"The news report was accurate because it provided the complete facts.","ar":"دقيق","lvl":""},{"w":"precipitation","pos":"n","def":"rain, snow, sleet, or hail","ex":"A desert receives less than 250 millimeters of annual precipitation.","ar":"هطول (مطر أو ثلج)","lvl":""},{"w":"notoriously","pos":"adv","def":"in a way that is well known for being bad","ex":"The Arctic Desert is notoriously cold.","ar":"بشكل معروف (بصفة سيئة)","lvl":""},{"w":"familiar","pos":"adj","def":"well known; easy to recognize","ex":"This place seems familiar, for I feel I have been here before.","ar":"مألوف","lvl":""},{"w":"prolonged","pos":"adj","def":"continuing for a long time, longer than expected","ex":"If a problem is not handled, we experience difficulties for a prolonged time.","ar":"مطوّل / ممتد","lvl":""},{"w":"intense","pos":"adj","def":"extreme in degree; very strong","ex":"The patient said he never felt such intense pain.","ar":"شديد","lvl":""},{"w":"lack","pos":"n","def":"the state of not having enough of something","ex":"All the activity and lack of sleep is putting a strain on our health.","ar":"نقص / عدم وجود","lvl":""},{"w":"barren","pos":"adj","def":"land that is too poor to produce plants","ex":"Deserts are barren, dry, and hostile to life.","ar":"قاحل","lvl":""}],"n":9,"untitled":false,"pp":1},{"key":"u9","kind":"unit","no":9,"title":"From Da Vinci to Churchill: What our doodles can mean","intro":"As a new exhibition shows, doodles can be a powerful form of creative expression, writes Clare Thorpe.","u":{"en":"Matching Features","ar":"مطابقة الخصائص (الأشخاص)","color":"--grape","icon":"people","focus":"Answering feature-matching questions","info_en":["You match statements to items in a box. The statements are in random order and numbered 1, 2, 3; the items are labelled A, B, C.","The items in the box follow the order they appear in the passage.","The most common feature is matching people; others include languages, historical events, or dates.","There is only ONE answer for each question. You may use any letter more than once."],"info_ar":["غالبًا تطابقين أقوال أو أفكار مع أشخاص.","الأسماء في الصندوق مرتبة حسب ظهورها في القطعة، فاستغلي هذا وابدئي منها.","نفس الحرف ممكن يتكرر لأكثر من سؤال، وممكن حرف ما يُستخدم.","الأقوال مكتوبة بصياغة ثانية، فدوّري المعنى مو نفس الكلمات."],"steps":[["Start with the items in the box because these are in passage order. Highlight them in the passage. Some may appear more than once.","ابدئي بالأسماء: لوّنيها في القطعة (ممكن تتكرر)."],["Carefully read the statements and underline the keywords.","اقرئي الجمل وحطي خط تحت الكلمات المفتاحية."],["Read around the first item (A) in the passage and read the statements quickly to see whether any matches.","اقرئي حول الاسم الأول وشوفي أي جملة تطابق كلامه."],["Write “A” next to the correct statement(s). Repeat with the next item.","حطي الحرف عند الجملة، وكرّري مع الاسم اللي بعده."]],"tip":"Names are easy to scan for: they start with capital letters. Then read the quote around each name carefully.","warm":[{"k":"match","q":"Exercise 1: Match each statement with the correct person.","text":"Recently, advertising has been more preoccupied with grabbing attention and sustaining interest than with transferring persuasive messages. According to Sean Brierley, this has largely been due to a perception that advertising needed to stand out and appeal through humorous, artistic or educational content in order to be well received by consumers. Others attacked this view: “Advertising used to be about persuading people to want your product. Now the task seems to be to make people admire your advertising,” complained one industry commentator, Wilkins. This kind of debate is not new. Rosser Reeves called “art” advertising on the TV in the 1950s ‘vampire video’, arguing that it distracts the viewer from the product and makes the commercial’s selling message less effective.","opts":["Brierley","Wilkins","Reeves"],"items":[["It is unfortunate that the focus of advertising has changed.",1],["A heavy focus on the advertisement, rather than the product, is unsuccessful.",2],["These days we expect advertisements to be attractive and entertain us.",0]],"why":"Wilkins «complained» ← مؤسف. Reeves: يشتت عن المنتج ← غير ناجح. Brierley: لازم يكون مضحك أو فني ← جذاب ومسلي."}],"no":9},"paras":[{"L":"","t":"For Queen Victoria, it was donkeys. For Winston Churchill, it was airplanes. For Leonardo da Vinci, it was everything from crude drawings to the first workings of his groundbreaking laws of frictions. Throughout history, humans – whether royalty or a bored office worker – have doodled."},{"L":"","t":"Usually relegated to the margins of notebooks or the back of envelopes, the doodle is often considered something messy, throwaway, and unconsidered. If life is what happens when you’re making other plans, then doodles are the result of your mind being somewhere else – a phone call, a meeting, a daydream. Yet in those scrawls – be it shapes, animals, lines, names – can be something powerful, with what they reveal and how they allow us to express our creativity. Hence, why a new art project is taking doodles out of the margins and placing them centre-stage."},{"L":"","t":"Frequencies, by Turner Prize-winning artist Oscar Murillo, collects together 40,000 canvases that have been marked, scribbled and drawn on by more than 100,000 children from around the world. Since 2013 Murillo has sent blank canvases to over 300 schools in more than 30 countries. The aim is to capture \"the conscious and unconscious energy of young minds at their most absorbent, optimistic and conflicted\" and the results are currently on show for the first time in their entirety in Murillo’s former school in Hackney, east London. \"The blank canvas is like a recording device,\" he tells BBC Culture. \"You leave it there for six months at a minimum and then you simply allow for an individual to interact with that, however they wish. They are my collaborators, these almost 100,000 children.\""},{"L":"","t":"In the dictionary, a doodle is defined as an \"aimless or casual scribble, design or sketch\" or a \"minor work\". Yet these \"casual scribbles\" are something humans have been doing for thousands of years – at least 73,000, in fact, with the first human drawing believed to be a Stone Age crayon doodle in a South African cave. Dutch scholar Erik Kwakkel has studied some of the oldest doodles on paper, finding comical faces, caricatures and geometrical shapes in the margins of Medieval manuscripts. \"Doodled squiggly lines and mini drawings are encountered frequently in Medieval books, mostly in the margins or on flyleaves,\" he writes, highlighting one sketch found in the lower margin of a manuscript of Juvenal’s Satires that resembles our stick figures today."},{"L":"","t":"Doodling has been shown to reduce stress, improve short term memory and feel rewarding. \"Doodling has this liberating quality for many people,\" says Sunni Brown, author of The Doodle Revolution. \"It’s a spontaneous act of just letting yourself be who you are.\" But perhaps one of its biggest functions is as a way to unlock unconscious creativity. \"You’re not prescribing the outcome and you’re not striving for a goal; you’re just allowing and inviting the mind to shift into a different modality and that is a very sweet spot for getting unconscious information to become available.\""},{"L":"","t":"British-born, New York-based artist Jon Burgerman has built a successful career from doodling, with his work appearing everywhere from phone cases to walls to inside the White House. \"I’m unashamedly a doodler,\" he says, arguing that doodling can be an antidote to the pervasive idea of perfectionism. \"We get to an age when we’re studying art and creating art where we feel the thing we’re drawing has to resemble something, that there’s a right and wrong to the output that we’re creating,\" he says. \"And doodling really celebrates the process. It doesn’t matter so much what the end result is. A lot of doodles are messy and loose and shambolic and that’s okay, because the process of creating it is perhaps more important than the outcome.\""}],"groups":[{"a":1,"b":4,"k":"match","instr":["Match each statement with the correct person, A–E.","You may use any letter more than once."],"items":[{"n":1,"t":"Doodling allows people to freely express themselves and their creativity.","opts":[]},{"n":2,"t":"A canvas is a collection of ideas expressed in a unique, personalized form.","opts":[]},{"n":3,"t":"Doodling has long been part of man’s history.","opts":[]},{"n":4,"t":"Enjoying the doodling process is more beneficial than the end result.","opts":[]}],"opts":[{"k":"A","t":"Clare Thorpe"},{"k":"B","t":"Oscar Murillo"},{"k":"C","t":"Erik Kwakkel"},{"k":"D","t":"Sunni Brown"},{"k":"E","t":"Jon Burgerman"}],"ctx":[],"optTitle":"List of People"}],"ans":{"1":{"v":"D","ex":"Part of the passage: \"It’s a spontaneous act of just letting yourself be who you are.\" Explanation: Sunni Brown: letting yourself be who you are = freely express themselves."},"2":{"v":"B","ex":"Part of the passage: \"The blank canvas is like a recording device,\" he tells BBC Culture. Explanation: Oscar Murillo: اللوحة تسجّل اللي يحطه كل طفل بطريقته."},"3":{"v":"C","ex":"Part of the passage: \"Doodled squiggly lines and mini drawings are encountered frequently in Medieval books Explanation: Erik Kwakkel درس الشخبطة في كتب العصور الوسطى = جزء من التاريخ."},"4":{"v":"E","ex":"Part of the passage: the process of creating it is perhaps more important than the outcome Explanation: Jon Burgerman: process > outcome."}},"words":[{"w":"royalty","pos":"n","def":"people belonging to the family of a king or a queen","ex":"The philanthropist was treated like royalty at the ceremony.","ar":"العائلة المالكة","lvl":""},{"w":"doodle","pos":"v","def":"to scribble or draw absent-mindedly","ex":"Some students doodled on their notebooks while brainstorming.","ar":"يخربش / يشخبط","lvl":""},{"w":"relegate","pos":"v","def":"to put something in a less important place","ex":"Doodles are usually relegated to the margins of notebooks.","ar":"يُنزل إلى مكانة أقل","lvl":""},{"w":"reveal","pos":"v","def":"to show or make something known","ex":"Facial expressions usually reveal how we feel.","ar":"يكشف / يُظهر","lvl":""},{"w":"creativity","pos":"n","def":"the use of imagination to make something new or artistic","ex":"Creativity is developed by constant use of imagination.","ar":"الإبداع","lvl":""},{"w":"entirety","pos":"n","def":"the whole of something","ex":"The results are on show for the first time in their entirety.","ar":"كامل الشيء / بأكمله","lvl":""},{"w":"collaborator","pos":"n","def":"a person who works with others on a project","ex":"They are my collaborators, these almost 100,000 children.","ar":"شريك في العمل","lvl":""},{"w":"spontaneous","pos":"adj","def":"done naturally, without planning","ex":"It’s a spontaneous act of just letting yourself be who you are.","ar":"عفوي","lvl":""}],"n":10,"untitled":false,"pp":1},{"key":"u10","kind":"unit","no":10,"title":"Bicycle","intro":null,"u":{"en":"Labelling a Diagram","ar":"تسمية أجزاء الرسم","color":"--coral","icon":"bike","focus":"Completing diagrams","info_en":["You name parts of a diagram using up to three words and/or a number from the passage.","The parts to be labelled have an arrow and the question number beside them.","The answers may not be in passage order but are usually grouped together in one part of the passage, where the diagram is described.","Use only words from the passage, no more than instructed, spelt correctly."],"info_ar":["تكتبين اسم الجزء اللي عليه سهم ورقم، بكلمات من القطعة نفسها.","الأجوبة ممكن ما تكون بالترتيب، لكنها عادةً في جزء واحد من القطعة اللي يوصف الشي.","استغلي الأسماء المكتوبة على الرسم (مثل Chain, Crank)، تدلّك على المكان.","انتبهي لكلمات المكان: in the middle, in the corner, next to, above/below, attached to.","اكتبي الكلمة كاملة مثل القطعة: television مو TV."],"steps":[["Read the instructions carefully to check the number of words you can write.","اقرئي التعليمات وعدد الكلمات."],["Look at the diagram to form a general idea of the content.","شوفي الرسم عشان تفهمين عن ايش."],["Note any labels provided already, as these can help you find answers.","استفيدي من الأسماء المكتوبة على الرسم."],["Decide what kind of information is needed in each gap (a place, a process, a part…).","حددي نوع المعلومة المطلوبة."],["Focus on expressions of place such as in the middle, in the corner, next to, above/below, leads to.","ركّزي على تعابير المكان."]],"tip":"“TV” is wrong if the passage says “television”: copy the word exactly as it is in the passage.","warm":[{"k":"type","q":"Exercise 1: “In the bedroom, there is a row of beds along one wall, and three chairs in the middle of the room from which the family can watch the television.” Label: what is along one wall? (max 3 words)","a":["row of beds","beds","a row of beds"],"why":"(row of) beds"},{"k":"type","q":"What can the family watch from the chairs? (max 3 words)","a":["television","the television"],"why":"television (TV غلط: لازم الكلمة كاملة مثل القطعة)."},{"k":"type","q":"“In the kitchen, there is an open fire in the centre of the room, a bench for grinding corn, and two storage bins in the corner.” What is in the corner? (max 3 words)","a":["storage bins","two storage bins"],"why":"(two) storage bins"},{"k":"choose","q":"How many expressions of place are in the Casanayan paragraph? (situated high, along, in the middle of, from which, in the centre of, in the corner…)","opts":["3","6","9"],"a":1,"why":"٦ تعابير مكان."}],"no":10},"paras":[{"L":"","t":"A bicycle or a bike is a machine for getting from place to place. Most bicycles have two wheels which are made up of a complete assembly of hub, spokes, and rim set in a frame. The frame is the main structural part of the bicycle, commonly made of steel, aluminum, titanium, or carbon fiber. Most bicycle parts are attached to the frame. The frame includes handlebars. A handlebar is a device connected by a tube used for steering the bicycle. There is also a small triangular seat attached to the bicycle’s frame, which supports the cyclist’s body. Millions of people throughout the world ride bicycles for fun, for exercise, for sport (called cycling), and for transportation."},{"L":"","t":"To ride a bicycle, the rider sits on the seat and places the feet on the pedals. The pedals are attached to the crank, which is the component that the cyclist rotates while pedaling to spin the chain which in turn provides the bicycle’s power. The pedals are connected by a chain to the back wheel. When the rider pushes on the pedals, the back wheel turns. This moves the bicycle forward. The rider steers by moving the handlebars."},{"L":"","t":"Bicycles may have coaster brakes or hand brakes. On a bicycle with coaster brakes, a rider stops by pedaling backward. Hand brakes are controlled using levers on the handlebars. When a rider squeezes the levers, pads squeeze against the wheels and the bicycle stops."},{"L":"","t":"Some bicycles also have gears, or speeds. Shifting or changing gears lets the rider keep a steady pedaling speed when traveling on different surfaces. Higher gears make pedaling harder but allow the bicycle to go faster. A rider may shift the bicycle into a higher gear when riding on smooth, flat ground. Lower gears make pedaling easier but slow down the bicycle. A rider may shift to a lower gear when riding up a hill."}],"groups":[{"a":1,"b":6,"k":"gap","instr":["Label the diagram below.","Use NO MORE THAN TWO WORDS from the passage for each answer."],"items":[],"opts":[],"ctx":["1 ……","2 ……","3 ……","4 ……","5 ……","6 ……"],"mode":"diagram","img":"bike"}],"ans":{"1":{"v":"wheel","ex":"Part of the passage: Most bicycles have two wheels which are made up of a complete assembly of hub, spokes, and rim set in a frame. Explanation: السهم ١ على الإطار الخلفي كامل (hub + spokes + rim) = wheel.","alts":["back wheel","wheels","rear wheel"]},"2":{"v":"frame","ex":"Part of the passage: The frame is the main structural part of the bicycle Explanation: السهم ٢ على الهيكل الرئيسي."},"3":{"v":"handlebars","ex":"Part of the passage: A handlebar is a device connected by a tube used for steering the bicycle. Explanation: السهم ٣ على المقود.","alts":["handlebar"]},"4":{"v":"seat","ex":"Part of the passage: There is also a small triangular seat attached to the bicycle’s frame, which supports the cyclist’s body. Explanation: السهم ٤ على المقعد.","alts":["triangular seat"]},"5":{"v":"pedals","ex":"Part of the passage: the rider sits on the seat and places the feet on the pedals. The pedals are attached to the crank Explanation: السهم ٥ عند الـ crank، والدواسات متصلة فيه.","alts":["pedal"]},"6":{"v":"hand brakes","ex":"Part of the passage: Hand brakes are controlled using levers on the handlebars. Explanation: السهم ٦ على المقبض فوق المقود = levers للـ hand brakes.","alts":["hand brake","levers"]}},"words":[{"w":"frame","pos":"n","def":"a rigid structure that holds parts together","ex":"The frame of the window secures all its parts together.","ar":"هيكل / إطار","lvl":""},{"w":"steady","pos":"adj","def":"firmly fixed or not changing","ex":"A painter keeps a steady hand to maintain an even stroke of his brush.","ar":"ثابت / منتظم","lvl":""},{"w":"shift","pos":"v","def":"to move from one position to another","ex":"She shifted position slightly to get a better view of the stage.","ar":"يغيّر / ينقل","lvl":""},{"w":"push","pos":"v","def":"to use force to move something","ex":"This young man is not strong enough to push such a large table.","ar":"يدفع","lvl":""},{"w":"steer","pos":"v","def":"to control the direction of a vehicle","ex":"The rider steers by moving the handlebars.","ar":"يوجّه / يقود","lvl":""},{"w":"attach","pos":"v","def":"to fix or join something to something else","ex":"The pedals are attached to the crank.","ar":"يثبّت / يربط","lvl":""},{"w":"rotate","pos":"v","def":"to turn around a central point","ex":"The cyclist rotates the crank while pedaling.","ar":"يدوّر","lvl":""},{"w":"squeeze","pos":"v","def":"to press something firmly","ex":"When a rider squeezes the levers, the bicycle stops.","ar":"يضغط / يعصر","lvl":""},{"w":"gear","pos":"n","def":"a set of wheels with teeth that control speed","ex":"Higher gears make pedaling harder but allow the bicycle to go faster.","ar":"ترس / غيار (السرعة)","lvl":""}],"n":11,"untitled":false,"pp":1},{"key":"s1","kind":"utest","unit":2,"title":"Swallows in Migration","intro":null,"paras":[{"L":"1","t":"Every April, along with many other species of birds, the swallow arrives to spend the summer months in northern Europe, Russia, Iran, and parts of Siberia. Here, it will breed and raise its young. The swallow is well known throughout its range for several reasons. Firstly, it is very distinctive, with its forked tail and characteristic acrobatic swooping flight. Secondly, it is very common, and like its near relative the house martin, lives in close proximity to human habitation, at least in rural areas. It is, however, rarely encountered in towns or cities."},{"L":"2","t":"For hundreds of years, people have observed swallows, noted their arrival and their patterns of feeding. In several countries, these observations have passed into the language as proverbs or sayings. In England, people comment on unpredictable late spring weather saying, “One swallow does not a summer make”. Similarly, if the “swallows are flying low”, this was held to predict rainy, even stormy weather. There may be some truth in this observation, though it is the insects the swallows feed on that seem to be more susceptible to the fall in barometric pressure that heralds a storm. Insects keep low in these conditions, and so do the swallows that hunt them. At the end of the summer season, when the swallows are about to leave, they frequently flock together in large numbers on convenient high open perches, like roof ridges and telegraph wires. When people remark that “the swallows are gathering”, they mean that autumn has arrived."},{"L":"3","t":"At some point in mid-September the swallows leave together, usually all on the same day. One day there are thousands, the next there are none, and none will be seen again until the following spring. For centuries, this was a complete mystery to people. The Hampshire naturalist Gilbert White, writing in the late 18th century, believed that the swallows dived into ponds and rivers in autumn and remained in the bottom mud the whole winter, re-emerging the following spring. This idea seems extraordinary to us, but White was not a stupid man: many of his other observations of natural life were informed and accurate. In this case, however, he simply had no means of determining the truth and was forced to make a random guess. The idea that swallows migrate to central or southern Africa would have seemed as fanciful to him as his theory seems to us."},{"L":"4","t":"Although we now know that swallows migrate, there are still unanswered questions. Why do they go so far? Why not stay on the shores of the Mediterranean? The majority continue to equatorial Africa, and some even further south. It appears that populations of swallows that have been breeding in different countries also spend the winter in different areas. Those from France, Germany, and much of Western Europe have mostly been traced to East Africa, Kenya, or Tanzania, for example. Above all, how does a bird weighing approximately twenty grams find its way across mountain ranges, ocean, and desert to winter in the south, and then return the following year to the very location in which it was born, in some cases to the very same nest?"},{"L":"5","t":"Birds can navigate by the sun and are also able to detect the magnetic field of the earth. Species that migrate at night are also able to navigate by the stars. By these means, they travel long distances. The close navigation that brings them back to the same field or nest appears to be related to memory of local landmarks imprinted on the minds of young birds as they crisscross the area in the weeks before departure."},{"L":"6","t":"Nevertheless, the journey is very dangerous. Long sea crossings, where there is little available food or water, are generally avoided. In Western Europe, most swallows cross to Africa via the Straits of Gibraltar or fly the length of Italy before tackling the relatively short crossing to Tunisia in North Africa. However, in storms they may be blown hundreds of kilometers off course. Exhausted swallows sometimes come to rest on ships way out in the Atlantic Ocean. They have to cross mountain ranges too, where again the weather may be unpredictable and food scarce. Along the coast of North Africa, many young swallows become the prey of Eleonora’s falcons, which time their breeding to coincide with the migration southwards of young birds. But the most dangerous part of the journey is the crossing of the Sahara Desert. Here, there is little food or water, sandstorms may delay and exhaust the already weakened birds, and many die. It is estimated that around 50 percent of adult birds die, and up to 80 percent of young birds, but enough survive to ensure the continuation of the species."}],"groups":[{"a":1,"b":7,"k":"gap","instr":["Answer the questions.","Choose NO MORE THAN THREE WORDS from the Reading Passage for each answer."],"items":[{"n":1,"t":"In which month do swallows arrive in Northern Europe to breed and raise their young?","opts":[]},{"n":2,"t":"Which small creatures do swallows feed on?","opts":[]},{"n":3,"t":"What does the swallows’ leaving together in mid-September suggest to people?","opts":[]},{"n":4,"t":"Who was Gilbert White?","opts":[]},{"n":5,"t":"How do birds that migrate at night navigate?","opts":[]},{"n":6,"t":"Where do swallows from Western Europe cross to?","opts":[]},{"n":7,"t":"Where do tired swallows rest in the Atlantic Ocean?","opts":[]}],"opts":[],"ctx":[]},{"a":8,"b":13,"k":"mcq","instr":["Choose the correct letter."],"items":[{"n":8,"t":"Which of the following is NOT a characteristic of a swallow?","opts":[{"k":"A","t":"It has a forked tail."},{"k":"B","t":"It is related to the house martin."},{"k":"C","t":"It lives in rural areas."},{"k":"D","t":"It lives only in urban areas."}]},{"n":9,"t":"For a long time, swallows’ presence in an area and their eating habits have been associated with","opts":[{"k":"A","t":"good luck."},{"k":"B","t":"weather and seasons."},{"k":"C","t":"bad luck."},{"k":"D","t":"money and fame."}]},{"n":10,"t":"Which of the following can birds do other than navigate by the sun?","opts":[{"k":"A","t":"detect the magnetic field of the earth"},{"k":"B","t":"fly non-stop across the Atlantic Ocean"},{"k":"C","t":"make rain and thunderstorms possible"},{"k":"D","t":"bring good luck to people"}]},{"n":11,"t":"Which of the following are the predators of young swallows in North Africa?","opts":[{"k":"A","t":"eagles"},{"k":"B","t":"Eleonora’s falcons"},{"k":"C","t":"fishermen"},{"k":"D","t":"snakes"}]},{"n":12,"t":"The birds’ North African journey is believed to be the most difficult in the","opts":[{"k":"A","t":"Atlantic Ocean."},{"k":"B","t":"Mediterranean Sea."},{"k":"C","t":"Sahara Desert."},{"k":"D","t":"Red Sea."}]},{"n":13,"t":"A higher percentage of deaths is among …… birds.","opts":[{"k":"A","t":"adult"},{"k":"B","t":"young"},{"k":"C","t":"male"},{"k":"D","t":"female"}]}],"opts":[],"ctx":[]}],"ans":{"1":{"v":"April","ex":"Part of the passage: Every April, along with many other species of birds, the swallow arrives Explanation: الفقرة 1، أول كلمة تقريبًا."},"2":{"v":"insects","ex":"Part of the passage: it is the insects the swallows feed on Explanation: feed on = تتغذى على. الفقرة 2.","alts":["the insects"]},"3":{"v":"(a) complete mystery","ex":"Part of the passage: For centuries, this was a complete mystery to people. Explanation: حسب مفتاح الكتاب: رحيلها المفاجئ كان لغز كامل للناس. الفقرة 3.","alts":["mystery"]},"4":{"v":"(a) Hampshire naturalist","ex":"Part of the passage: The Hampshire naturalist Gilbert White Explanation: الوصف قبل الاسم مباشرة. ثلاث كلمات بالضبط.","alts":["naturalist","the Hampshire naturalist"]},"5":{"v":"(by the) stars","ex":"Part of the passage: Species that migrate at night are also able to navigate by the stars. Explanation: at night = في الليل ← by the stars. الفقرة 5."},"6":{"v":"Africa","ex":"Part of the passage: most swallows cross to Africa via the Straits of Gibraltar Explanation: cross to Africa. الفقرة 6.","alts":["North Africa","Tunisia"]},"7":{"v":"on ships","ex":"Part of the passage: Exhausted swallows sometimes come to rest on ships way out in the Atlantic Ocean. Explanation: tired = exhausted.","alts":["ships"]},"8":{"v":"D","ex":"Part of the passage: It is, however, rarely encountered in towns or cities. Explanation: NOT: هي نادرًا تُشاهد في المدن، فخيار «تعيش في المدن فقط» غلط."},"9":{"v":"B","ex":"Part of the passage: this was held to predict rainy, even stormy weather Explanation: الأمثال عن الطقس (stormy weather) والفصول (autumn has arrived)."},"10":{"v":"A","ex":"Part of the passage: Birds can navigate by the sun and are also able to detect the magnetic field of the earth. Explanation: other than = بالإضافة إلى."},"11":{"v":"B","ex":"Part of the passage: many young swallows become the prey of Eleonora’s falcons Explanation: predators = اللي يصطادونها، prey = الفريسة."},"12":{"v":"C","ex":"Part of the passage: But the most dangerous part of the journey is the crossing of the Sahara Desert. Explanation: most difficult = most dangerous."},"13":{"v":"B","ex":"Part of the passage: around 50 percent of adult birds die, and up to 80 percent of young birds Explanation: 80% أكبر من 50%."}},"words":[{"w":"migrate","pos":"v","def":"to travel to a different place at the same time each year","ex":"Swallows migrate to central or southern Africa.","ar":"يهاجر","lvl":""},{"w":"breed","pos":"v","def":"to produce young animals","ex":"Here, it will breed and raise its young.","ar":"يتكاثر","lvl":""},{"w":"distinctive","pos":"adj","def":"easy to recognize because it is different","ex":"The swallow is very distinctive, with its forked tail.","ar":"مميز","lvl":""},{"w":"proximity","pos":"n","def":"the state of being near","ex":"It lives in close proximity to human habitation.","ar":"قُرب","lvl":""},{"w":"susceptible","pos":"adj","def":"easily affected by something","ex":"Insects are susceptible to the fall in barometric pressure.","ar":"سريع التأثر","lvl":""},{"w":"navigate","pos":"v","def":"to find the way to a place","ex":"Birds can navigate by the sun.","ar":"يهتدي / يحدد الاتجاه","lvl":""},{"w":"exhausted","pos":"adj","def":"extremely tired","ex":"Exhausted swallows sometimes rest on ships.","ar":"منهك","lvl":""},{"w":"prey","pos":"n","def":"an animal that is hunted by another animal","ex":"Young swallows become the prey of Eleonora’s falcons.","ar":"فريسة","lvl":""},{"w":"mystery","pos":"n","def":"something that is difficult to understand or explain","ex":"For centuries, this was a complete mystery to people.","ar":"لغز","lvl":""}],"n":12,"untitled":false,"pp":1},{"key":"s2","kind":"utest","unit":4,"title":"Is it Really OK to Eat Food that’s Fallen on the Floor?","intro":"Paul Dawson","paras":[{"L":"A","t":"When you drop a piece of food on the floor, is it really OK to eat if you pick it up within five seconds? This urban food myth contends that if food spends just a few seconds on the floor, dirt and germs won’t have much of a chance to contaminate it. Research in my lab has focused on how food and food contact surfaces become contaminated, and we’ve done some work on this piece of wisdom."},{"L":"B","t":"While the “five-second rule” might not seem like the most pressing issue for food scientists to get to the bottom of, it’s still worth investigating food myths like this one because they shape our beliefs about when food is safe to eat."},{"L":"C","t":"So is five seconds on the floor the critical threshold that separates an edible morsel from a case of food poisoning? It’s a bit more complicated than that. It depends on just how much bacteria can make it from floor to food in a few seconds and just how dirty the floor is."},{"L":"D","t":"A well-known, but inaccurate story about Julia Child may have contributed to this food myth. Some viewers of her cooking show, The French Chef, insist they saw Child drop lamb (or a chicken or a turkey, depending on the version of the tale) on the floor and pick it up, with the advice that if they were alone in the kitchen, their guests would never know. In fact, it was a potato pancake, and it fell on the stovetop, not on the floor. Child put it back in the pan, saying “But you can always pick it up and if you are alone in the kitchen, who is going to see?” But the misremembered story persists."},{"L":"E","t":"It’s harder to pin down the origins of the oft-quoted five-second rule, but a 2003 study reported that 70% of women and 56% of men surveyed were familiar with the five-second rule and that women were more likely than men to eat food that had been dropped on the floor. So, what does science tell us about what a few seconds on the floor means for the safety of your food?"},{"L":"F","t":"The earliest research report on the five-second rule is attributed to Jillian Clarke, a high school student participating in a research apprenticeship at the University of Illinois. Clarke and her colleagues inoculated floor tiles with bacteria then placed food on the tiles for varying times. They reported bacteria were transferred from the tile to gummy bears and cookies within five seconds but didn’t report the specific number of bacteria that made it from the tile to the food."},{"L":"G","t":"In 2007, my lab at Clemson University published a study – the only peer-reviewed journal paper on this topic – in the Journal of Applied Microbiology. We wanted to know if the length of time food is in contact with a contaminated surface affected the rate of transfer of bacteria to the food."},{"L":"H","t":"To find out, we inoculated squares of tile, carpet, or wood with Salmonella. Five minutes after that, we placed either bologna or bread on the surface for five, 30 or 60 seconds, and then measured the number of bacteria transferred to the food. We repeated this exact protocol after the bacteria had been on the surface for two, four, eight and 24 hours."},{"L":"I","t":"We found that the number of bacteria transferred to either kind of food didn’t depend much on how long the food was in contact with the contaminated surface – whether for a few seconds or for a whole minute. The overall number of bacteria on the surface mattered more, and this decreased over time after the initial inoculation. It looks like what’s at issue is less how long your food languishes on the floor and much more how infested with bacteria that patch of floor happens to be."},{"L":"J","t":"We also found that the kind of surface made a difference as well. Carpets, for instance, seem to be slightly better places to drop your food than wood or tile. When carpet was inoculated with Salmonella, less than 1% of the bacteria were transferred. But when the food was in contact with tile or wood, 48%-70% of bacteria transferred."},{"L":"K","t":"Last year, a study from Aston University in the UK used nearly identical parameters to our study and found similar results testing contact times of three and 30 seconds on similar surfaces. They also reported that 87% of people asked either would eat or have eaten food dropped on the floor."},{"L":"L","t":"From a food safety standpoint, if you have millions or more cells on a surface, 0.1% is still enough to make you sick. Also, certain types of bacteria are extremely virulent, and it takes only a small number to make you sick. For example, 10 cells or fewer of an especially virulent strain of E. coli can cause severe illness and death in people with compromised immune systems. But the chance of these bacteria being on most surfaces is very low."},{"L":"M","t":"And it’s not just dropping food on the floor that can lead to bacterial contamination. Bacteria are carried by various “media,” which can include raw food, moist surfaces where bacteria have been left, our hands or skin and from coughing or sneezing."},{"L":"N","t":"Hands, foods and utensils can carry individual bacterial cells, colonies of cells or cells living in communities contained within a protective film that provide protection. These microscopic layers of deposits containing bacteria are known as biofilms and they are found on most surfaces and objects."},{"L":"O","t":"Biofilm communities can harbor bacteria longer and are very difficult to clean. Bacteria in these communities also have an enhanced resistance to sanitizers and antibiotics compared to bacteria living on their own."},{"L":"P","t":"So the next time you consider eating dropped food, the odds are in your favor that you can eat that morsel and not get sick. But in the rare chance that there is a microorganism that can make you sick on the exact spot where the food dropped, you can be fairly sure the bug is on the food you are about to put in your mouth."},{"L":"Q","t":"Research (and common sense) tell us that the best thing to do is to keep your hands, utensils, and other surfaces clean."}],"groups":[{"a":1,"b":5,"k":"head","instr":["The passage has seventeen paragraphs, A–Q. Choose the correct headings for paragraphs B–F from the list of headings below.","Example: Paragraph G – Answer: iv. Note: There are more headings than paragraphs."],"items":[{"n":1,"t":"Paragraph B","opts":[]},{"n":2,"t":"Paragraph C","opts":[]},{"n":3,"t":"Paragraph D","opts":[]},{"n":4,"t":"Paragraph E","opts":[]},{"n":5,"t":"Paragraph F","opts":[]}],"opts":[{"k":"i","t":"Time duration and the presence of germs"},{"k":"ii","t":"Clarke’s food microbe research"},{"k":"iii","t":"Investigating food safety"},{"k":"iv","t":"A study published in a microbiology journal"},{"k":"v","t":"A story of clumsy food handling"},{"k":"vi","t":"Percentage of awareness between genders"},{"k":"vii","t":"Infection caused by germs"},{"k":"viii","t":"Kitchen safety rules"}],"ctx":[]},{"a":6,"b":12,"k":"tf","instr":["Do the following statements agree with the information given in the passage?","Write TRUE if the statement agrees with the information, FALSE if the statement contradicts the information, NOT GIVEN if there is no information on this."],"items":[{"n":6,"t":"Women pick up and eat food from the floor more often than men.","opts":[]},{"n":7,"t":"Clarke’s study indicated the specific number of floor bacteria that infected food dropped on the floor.","opts":[]},{"n":8,"t":"Germs on the floor can infect a dropped biscuit in five seconds.","opts":[]},{"n":9,"t":"A food conference was conducted in 2007 to warn people about the dangers of picking up and eating food from the floor.","opts":[]},{"n":10,"t":"The degree of floor bacteria infestation determines how contaminated the food will become.","opts":[]},{"n":11,"t":"Deadly E. coli bacteria are found on every surface.","opts":[]},{"n":12,"t":"The floor and other channels are sources of germs.","opts":[]}],"opts":[],"ctx":[]}],"ans":{"1":{"v":"iii","ex":"Part of the passage: it’s still worth investigating food myths like this one because they shape our beliefs about when food is safe to eat Explanation: investigating + safe to eat = Investigating food safety."},"2":{"v":"i","ex":"Part of the passage: So is five seconds on the floor the critical threshold… It depends on just how much bacteria can make it from floor to food in a few seconds Explanation: الوقت (five seconds) ووجود البكتيريا."},"3":{"v":"v","ex":"Part of the passage: A well-known, but inaccurate story about Julia Child may have contributed to this food myth. Explanation: قصة الطبّاخة اللي طاح منها الأكل = A story of clumsy food handling."},"4":{"v":"vi","ex":"Part of the passage: a 2003 study reported that 70% of women and 56% of men surveyed were familiar with the five-second rule Explanation: نسب الرجال والنساء = Percentage of awareness between genders."},"5":{"v":"ii","ex":"Part of the passage: The earliest research report on the five-second rule is attributed to Jillian Clarke Explanation: بحث Clarke عن البكتيريا والأكل."},"6":{"v":"T","ex":"Part of the passage: women were more likely than men to eat food that had been dropped on the floor Explanation: more likely = more often."},"7":{"v":"F","ex":"Part of the passage: but didn’t report the specific number of bacteria that made it from the tile to the food Explanation: القطعة تقول ما ذكرت العدد، عكس الجملة."},"8":{"v":"F","ex":"Part of the passage: They reported bacteria were transferred from the tile to gummy bears and cookies within five seconds Explanation: مفتاح الكتاب: FALSE، وحجته إن القطعة تقول within five seconds (خلال ١ إلى ٥ ثواني) مو in five seconds بالضبط. ملاحظة أمانة: هذا السؤال فيه نقاش، وكثير يشوفون المعنى قريب من TRUE. في الامتحان الحقيقي الأسئلة أوضح من كذا."},"9":{"v":"NG","ex":"Part of the passage: In 2007, my lab at Clemson University published a study Explanation: في 2007 فيه دراسة منشورة، ما فيه أي مؤتمر."},"10":{"v":"T","ex":"Part of the passage: much more how infested with bacteria that patch of floor happens to be Explanation: the degree of infestation = how infested."},"11":{"v":"F","ex":"Part of the passage: But the chance of these bacteria being on most surfaces is very low. Explanation: القطعة تقول احتمال وجودها قليل جدًا، مو على كل سطح."},"12":{"v":"T","ex":"Part of the passage: it’s not just dropping food on the floor that can lead to bacterial contamination. Bacteria are carried by various “media,” Explanation: other channels = various media."}},"words":[{"w":"contaminate","pos":"v","def":"to make something dirty or harmful by adding germs or chemicals","ex":"Dirt and germs won’t have much of a chance to contaminate it.","ar":"يلوّث","lvl":""},{"w":"myth","pos":"n","def":"an idea that many people believe but that is not true","ex":"This urban food myth contends that a few seconds on the floor is safe.","ar":"خرافة / اعتقاد خاطئ","lvl":""},{"w":"threshold","pos":"n","def":"the level at which something starts to happen","ex":"Is five seconds the critical threshold?","ar":"حدّ / عتبة","lvl":""},{"w":"inaccurate","pos":"adj","def":"not correct or exact","ex":"A well-known, but inaccurate story about Julia Child.","ar":"غير دقيق","lvl":""},{"w":"transfer","pos":"v","def":"to move from one place to another","ex":"Bacteria were transferred from the tile to the food.","ar":"ينتقل / ينقل","lvl":""},{"w":"virulent","pos":"adj","def":"extremely harmful and quick to spread","ex":"Certain types of bacteria are extremely virulent.","ar":"شديد الخطورة (مرض)","lvl":""},{"w":"resistance","pos":"n","def":"the ability not to be harmed by something","ex":"Bacteria in biofilms have an enhanced resistance to sanitizers.","ar":"مقاومة","lvl":""},{"w":"utensil","pos":"n","def":"a tool used in the kitchen","ex":"Keep your hands, utensils, and other surfaces clean.","ar":"أداة مطبخ","lvl":""}],"n":13,"untitled":false,"pp":1},{"key":"s3","kind":"utest","unit":6,"title":"Exercise and COVID-19","intro":"Jake Panasevich. While long COVID can cause serious heart issues in anyone, evidence indicates that routine exercisers experience less severe symptoms compared to those who don’t exercise.","paras":[{"L":"1","t":"Last August, Lauren Bull, an 18-year-old freshman soccer player at Bloomsburg University in eastern Pennsylvania, tested positive for COVID-19. After two weeks in quarantine, she went for a light jog and had to stop. She felt out of breath, pressure in her chest and a rapid heart rate. Furthermore, her heart would race simply from standing up and walking up stairs. She went to her doctor, who completed an electrocardiogram, which measures the rhythm of the heart, and an echocardiogram, an ultrasound of the heart that provides information on the structure and function of the heart. The results were normal. However, an MRI of her heart showed signs of post COVID-19 myocarditis, or heart inflammation, which can be deadly. \"They told me, ‘If you overdo it, the reality is that your heart could literally explode,’\" Bull says. \"Mentally, it did hit me hard.\""},{"L":"2","t":"Bloomsburg University athletic training staff coordinated with a team of doctors at nearby Geisinger Medical Center to develop a safe return to play for student athletes who had COVID-19. It included a three-month rehab protocol, gradually reacclimatising athletes with COVID-19 to exercise. Bull’s process was similar but included a longer rehab process due to her myocarditis."},{"L":"3","t":"According to Bloomsburg University athletic trainer Syrena Hess, Bull started right after her myocarditis diagnosis by casually walking on a treadmill and biking. She then increased her output until she was at 50% intensity. Intensity is measured by perceived exertion and using a pulse oximeter to make sure her oxygen saturation was normal and that she didn’t exceed 50% of her maximum heart rate."},{"L":"4","t":"Over 45 days, Bull progressed incrementally to 90% of her maximum heart rate, where she ran for 25 minutes with a heart rate of around 180, a near full-sprint effort for the duration. Activity would stop if she felt any chest pain, abnormal fatigue, an unsafe rapid heart rate or shortness of breath."},{"L":"5","t":"Then with clearance from her doctors, Bull began weightlifting and soccer drills. She then completed a high intensity interval running test, known as a beep test, where she ran for a segmented time and walked between sets, picking up speed each round. By March, after being re-examined by her cardiologist and completing a full panel of tests, she safely returned to working out at her maximum competitive threshold with the team."},{"L":"6","t":"Bull had an extensive series of tests performed before she could safely return to full exercise. Her cardiac MRI was clear, as was her Holter monitor – a wearable device that monitors heart rhythm over several days – a stress test and bloodwork. \"Then I felt better about it, and I was a little more confident,\" Bull says. \"But it was nerve wracking at first.\""},{"L":"7","t":"Bull believes that because she was on a consistent exercise regimen of running, strength training and soccer drills prior to her diagnosis, it helped her recover faster and with no episodes of severe symptoms, even with myocarditis. And there’s emerging research that substantiates her claims. A study published in the April edition of the British Journal of Sports Medicine observed nearly 50,000 adults with COVID-19. Researchers found those who met the U.S. Department of Health and Human Services’ physical activity guidelines of at least 150 minutes per week of moderate to vigorous physical activity showed significantly lower risks of hospitalization, ICU admission and death due to COVID-19."},{"L":"8","t":"Dr. Robert E. Sallis, a family and sports medicine physician at Kaiser Permanente Medical Center in Fontana California, was the principal investigator of the study. He believes that, for cases like Bull’s, being physically active prior to a COVID-19 infection is critical for a healthy recovery. \"The bottom line from our data is that physical inactivity is the biggest modifiable risk factor of severe COVID,\" Sallis says. \"It’s likely why she didn’t die from it.\""},{"L":"9","t":"While the exact mechanism by which exercise exerts this effect is not completely understood, Sallis believes it’s a combination of strengthening the heart, lungs, and vascular system, along with benefits for the brain and mental health."},{"L":"10","t":"Two recent studies, one published in the American Heart Association’s journal, examining over 3,000 collegiate athletes with COVID-19, the other in JAMA Cardiology that observed 789 professional athletes with COVID-19, found less than 1% of athletes suffered from heart-related issues. It is worth noting that the athletes studied also represent a younger population who typically experience fewer problems with COVID."},{"L":"11","t":"\"The more recent studies have suggested that the risk of severe cardiac health is really low in athletes,\" Sallis says. \"I’ve got to believe that a big factor is their athletic activity. The potential is greater in those who aren’t so fit and active.\""},{"L":"12","t":"Sallis says that while it’s common for patients to show some transient and minor heart inflammation post COVID-19, like the flu, it typically resolves after a few weeks. However, it can be life threatening if not handled properly, so all COVID patients should be on the lookout for cardiac symptoms (such as palpitations, chest pain, light-headedness) as they slowly return to exercise."},{"L":"13","t":"Bull re-entered a fitness routine knowing the potentially fatal risks of pushing her heart during activity. She took it slowly and followed her program of testing and communicating if she experienced any symptoms. \"It’s scary, and it’s different for everybody,\" Bull says. \"But if you take the right measures, be aware of it. Follow the protocol. Take it slowly and definitely don’t push through because that could make it worse.\""},{"L":"14","t":"The fact that exercise, a habit that’s completely within our control, plays a major role in helping to lessen our risk of fatal COVID-19 complications is a positive call to action; one that Sallis believes was omitted during the pandemic."},{"L":"15","t":"\"Unfortunately, most of the messaging has been around just hide in the house, wear a mask, distance and wait for a vaccine,\" Sallis says. \"And that’s been a huge mistake. We speak very little, which is very typical in health care today, about personal responsibility, and people need to take control of their health and the best way to do it is by being active.\""},{"L":"16","t":"Sallis emphasizes the importance of hitting the 150-minute marker for weekly exercise. A brisk walk at a moderate pace, where you’re walking fast enough that you couldn’t sing, but not so fast that you couldn’t talk, should be the goal. If you go more intensely, you get more benefit for a given time, but you don’t have to go that hard to get the benefit."},{"L":"17","t":"Bull is back to competing with her soccer team, and with the support of her training staff, doctors, family, team, and community, she feels confident moving forward."}],"groups":[{"a":1,"b":7,"k":"yn","instr":["Do the statements agree with the views of the author in the passage?","Write YES if the statement agrees with the views of the author, NO if the statement contradicts the views of the author, NOT GIVEN if it is impossible to say what the author thinks about this."],"items":[{"n":1,"t":"Lauren Bull willingly underwent electrocardiogram and echocardiogram tests to record her heartbeat.","opts":[]},{"n":2,"t":"Bloomsburg University athletic department is reluctant to assist previously-Covid-infected athletes.","opts":[]},{"n":3,"t":"Dr. Sallis extensively travelled to share his Covid-19 research.","opts":[]},{"n":4,"t":"Regular exercise promotes mental health.","opts":[]},{"n":5,"t":"Poor handling of myocarditis can be deadly.","opts":[]},{"n":6,"t":"Social responsibility needs to be de-emphasized in the fight to survive the pandemic.","opts":[]},{"n":7,"t":"Covid-19 will most likely reoccur if recovering patients do not take some form of regular exercise.","opts":[]}],"opts":[],"ctx":[]},{"a":8,"b":14,"k":"gap","instr":["Complete the summary with words from the passage.","Write NO MORE THAN TWO WORDS or a NUMBER for each answer."],"items":[],"opts":[],"ctx":["Myocarditis or heart inflammation is a possible after-effect of 8 …… . Infected athletes like Lauren Bull had to take supervised exercise gradually, from simple walking, biking, weightlifting to 9 …… . Covid patients like her who regularly exercise prior to the virus infection 10 …… faster from the disease. This report is supported by the British Journal of Sports Medicine, that revealed how 11 …… minutes of weekly exercise can keep people from hospitalization. The American Heart Association journal and JAMA Cardiology also reported that 12 …… than 1% of younger players experienced health problems with Covid-19. The tendency to get sick is 13 …… in those inactive people. Dr. Sallis therefore urges everyone to exercise, a habit that is within their 14 …… . It can be as simple as brisk walking and does not necessarily need to be as strenuous as the athletes’ activity."],"mode":"sum"}],"ans":{"1":{"v":"Y","ex":"Part of the passage: She went to her doctor, who completed an electrocardiogram Explanation: هي بنفسها راحت للطبيب (willingly)."},"2":{"v":"N","ex":"Part of the passage: Bloomsburg University athletic training staff coordinated with a team of doctors… to develop a safe return to play Explanation: الجامعة ساعدت، عكس reluctant (متردد)."},"3":{"v":"NG","ex":"Explanation: ما فيه أي ذكر لسفر الدكتور."},"4":{"v":"Y","ex":"Part of the passage: along with benefits for the brain and mental health Explanation: الفقرة 9."},"5":{"v":"Y","ex":"Part of the passage: it can be life threatening if not handled properly Explanation: poor handling = not handled properly، deadly = life threatening."},"6":{"v":"N","ex":"Part of the passage: We speak very little… about personal responsibility, and people need to take control of their health Explanation: الكاتب ينقل إن المسؤولية لازم تزيد مو تقل."},"7":{"v":"NG","ex":"Explanation: القطعة ما تقول إن المرض يرجع لو ما تمرّن."},"8":{"v":"COVID-19","ex":"Part of the passage: an MRI of her heart showed signs of post COVID-19 myocarditis Explanation: post COVID-19 = بعد كوفيد.","alts":["covid 19","covid","COVID-19 infection"]},"9":{"v":"soccer drills","ex":"Part of the passage: Bull began weightlifting and soccer drills Explanation: بعد weightlifting جت soccer drills."},"10":{"v":"recover","ex":"Part of the passage: it helped her recover faster Explanation: Covid patients… ___ faster ← فعل: recover."},"11":{"v":"150","ex":"Part of the passage: at least 150 minutes per week of moderate to vigorous physical activity Explanation: رقم."},"12":{"v":"less","ex":"Part of the passage: found less than 1% of athletes suffered from heart-related issues Explanation: ___ than 1% ← less."},"13":{"v":"greater","ex":"Part of the passage: The potential is greater in those who aren’t so fit and active. Explanation: inactive = aren’t so fit and active."},"14":{"v":"control","ex":"Part of the passage: exercise, a habit that’s completely within our control Explanation: within their control."}},"words":[{"w":"quarantine","pos":"n","def":"a period of time when a person is kept apart to stop a disease spreading","ex":"After two weeks in quarantine, she went for a light jog.","ar":"حجر صحي","lvl":""},{"w":"inflammation","pos":"n","def":"a condition in which part of the body becomes red, swollen and painful","ex":"Myocarditis, or heart inflammation, can be deadly.","ar":"التهاب","lvl":""},{"w":"gradually","pos":"adv","def":"slowly, over a period of time","ex":"The protocol gradually reacclimatised athletes to exercise.","ar":"تدريجيًا","lvl":""},{"w":"intensity","pos":"n","def":"the strength or level of an activity","ex":"She increased her output until she was at 50% intensity.","ar":"شدّة","lvl":""},{"w":"regimen","pos":"n","def":"a fixed plan of exercise, diet or treatment","ex":"She was on a consistent exercise regimen.","ar":"نظام (تمارين أو علاج)","lvl":""},{"w":"substantiate","pos":"v","def":"to provide evidence that something is true","ex":"There’s emerging research that substantiates her claims.","ar":"يُثبت / يدعم بالأدلة","lvl":""},{"w":"transient","pos":"adj","def":"lasting only for a short time","ex":"Patients show some transient and minor heart inflammation.","ar":"مؤقت / عابر","lvl":""},{"w":"omit","pos":"v","def":"to leave out or not include","ex":"Sallis believes it was omitted during the pandemic.","ar":"يُهمل / يحذف","lvl":""},{"w":"brisk","pos":"adj","def":"quick and full of energy","ex":"A brisk walk at a moderate pace should be the goal.","ar":"سريع ونشيط","lvl":""}],"n":14,"untitled":false,"pp":1},{"key":"s4","kind":"utest","unit":8,"title":"How Multitasking Fuels Original Thinking","intro":"David Robson. Multitasking is generally seen as a stressor that reduces performance. But busy periods of juggling tasks can actually fuel our creativity.","paras":[{"L":"A","t":"Whenever I sit down to write, I like to clear long periods for concentrated work. No emails, phone calls or meetings – just me and the blank page. If I do have to tackle many other tasks, I try to have a short break to cleanse my mind before I begin again. That’s because I always assumed that creativity was dependent on entering ‘the zone’ – and that required a kind of meditative peace and quiet beforehand."},{"L":"B","t":"However, it seems I may have been completely mistaken in my approach. According to a compelling new study, busy periods of multitasking – just the kind of activities I try to avoid – can actually fuel our subsequent creativity. Thanks to a ‘spillover effect’, the energy and excitement of hectic jobs can lead to more original idea generation."},{"L":"C","t":"Importantly, this brain boost seems to apply to many different types of creation – from the generation of original business plans to the culinary flourishes of expert chefs – suggesting that people of many different professions might benefit."},{"L":"D","t":"Shimul Melwani, a professor of organisational behaviour at University of North Carolina’s Kenan-Flagler Business School, who co-authored a paper with her PhD student Chaitali Kapadia, says the findings show that if we can all be “a bit more opportunistic in the way we use multitasking”, perhaps we’ll come to see our busiest moments as a force for innovation, rather than a cause of stress."},{"L":"E","t":"In the past, psychologists have taken a decidedly dim view of multitasking. Many studies have shown that the brain struggles to juggle two activities at once, and instead moves quickly between them – with a loss in accuracy each time it shifts its attention. If you are writing an email as you talk on the phone, for example, you temporarily lose the capacity to process the conversation as you type out the sentence. “You more or less become a little bit deaf,” says Iring Koch, a psychology professor at RWTH Aachen University in Germany. Alternatively, the shift in focus will lead to a momentary lapse in your writing, resulting in a typo or a non-sequitur. For optimum accuracy, you should therefore devote your full attention to each activity in turn."},{"L":"F","t":"These studies all focused on the immediate consequences of multitasking, whereas Melwani and Kapadia were interested in what came after. Creativity often involves tying together disparate thoughts and ideas, and that can benefit from a more diffuse mindset, rather than a rigid focus. We know, for instance, that asking people to contemplate contradictory ideas and conflicting perspectives can increase the flexibility and originality of their thinking for precisely this reason."},{"L":"G","t":"Multitasking can also lead us to feel energised and alert. This is reflected in our physiology; the more tasks we attempt to do, the higher our heart rate, for example. That energy, the researchers suspected, could also improve the generation of ideas."},{"L":"H","t":"Melwani and Kapadia put this to test in a string of experiments. The first experiment had students take part in a conference call and respond to email. To examine the effects of multitasking, some of the students were asked to answer the email while they took part in the conference call, while others were allowed to do the two tasks sequentially – without any mental juggling."},{"L":"I","t":"Afterwards, the participants all took the alternative uses test (AUT) – a standard measure of creativity that involves finding new ways to use a familiar household object, like a brick. They might suggest that it is a paperweight, for example, or a weapon, or a diving aid – answers that were then rated for their originality by independent judges. In line with their theory, Melwani and Kapadia found that the multitasking students did indeed come up with more novel ideas than those who had been allowed to focus on each task in turn."},{"L":"J","t":"Importantly, the researchers also tested the participants on a word game that required analytical rather than creative thinking – but saw no improvement in their performance. This shows that there’s something unique about the creative process itself that was affected."},{"L":"K","t":"For further evidence, the researchers next turned to the TV cooking show Chopped. In each episode, professional chefs are presented with sets of “mystery ingredients” and asked to design and cook appetisers, entrees and desserts based on what they are given. Cooking each dish requires a certain amount of multitasking – and Melwani and Kapadia wanted to see whether this would affect the chefs’ inventiveness in the next round."},{"L":"L","t":"“It was almost perfectly designed for the type of creativity that we wanted to explore,” says Kapadia, who is now an assistant professor at Florida International University, US."},{"L":"M","t":"To test their hypothesis, the researchers recruited professional chefs to judge the contestants’ multitasking and the creativity of their recipes. The results were once again exactly as they had predicted. Chefs who multitasked more during the appetiser round designed more original entrees, and those who multitasked more in the entree round tended to make more inventive desserts."},{"L":"N","t":"Intrigued, Kapadia contacted some of the contestants to discuss their experiences on the show. Anecdotally, their experiences certainly seemed to fit with their theory – that the multitasking left them feeling energised, which in turn helped to inspire their later creativity. “It fits with our model really well.”"},{"L":"O","t":"Melwani and Kapadia’s findings coincide with an intriguing study from Stephen Wee Hun Lim at the National University of Singapore. He found that people’s reported levels of “media multitasking” – the habit of sending a WhatsApp or checking TikTok while watching TV, for example – correlated with measures of creativity, such as the AUT. Further research will be needed to prove a causal link, but it is possible that the regular juggling of multiple media could lead the brain to be a bit more flexible in its thinking, he says."},{"L":"P","t":"Melwani now deliberately schedules a more creative task after a period of home-schooling, so that the energy and increased cognitive flexibility will “spill over” into her idea generation and execution. Managers might do well to remember this too: scheduling a brainstorm after another energising task, for example."},{"L":"Q","t":"Recognising these potential benefits of multitasking might help us to frame our busiest moments a bit more positively. “It could increase our sense of efficacy,” says Melwani. We’ve already seen how procrastination can be rehabilitated, thanks to its creative benefits; now it seems that multitasking may be due a similar image change. “It is nice to know that it isn’t always bad.”"}],"groups":[{"a":1,"b":4,"k":"gap","instr":["Complete each sentence with NO MORE THAN TWO WORDS from the passage."],"items":[{"n":1,"t":"The author believes that creativity comes to a person who is in ……, having a moment of solitude and concentration for a task.","opts":[]},{"n":2,"t":"The …… negates the author’s perception that multitasking impedes creativity.","opts":[]},{"n":3,"t":"Shimul Melwani and Chaitali Kapadia’s study shows that the busiest moments are an opportunity for ……","opts":[]},{"n":4,"t":"Many studies reported that the brain …… when it does two things at the same time.","opts":[]}],"opts":[],"ctx":[]},{"a":5,"b":8,"k":"match","instr":["Complete each sentence with the correct ending, A–F, from the box below."],"items":[{"n":5,"t":"The physiological effect of multitasking like","opts":[]},{"n":6,"t":"Melwani and Kapadia’s first experiment showed that","opts":[]},{"n":7,"t":"Chefs who multitasked","opts":[]},{"n":8,"t":"Knowing the benefits of multitasking reminds us","opts":[]}],"opts":[{"k":"A","t":"stress and fatigue affect good performance."},{"k":"B","t":"participants who simultaneously used varied social media tools and technology developed their mental flexibility."},{"k":"C","t":"showcased their innovativeness in creating several dishes."},{"k":"D","t":"faster heart rate is believed to improve idea generation."},{"k":"E","t":"to view activities from a broader perspective."},{"k":"F","t":"contradictory evidence that made them abandon their project."}],"ctx":[],"optTitle":"Sentence endings"},{"a":9,"b":13,"k":"para","instr":["Which paragraphs, A–Q, concentrate on the following information?"],"items":[{"n":9,"t":"Similarity of results between two different studies","opts":[]},{"n":10,"t":"Negative view of multitasking","opts":[]},{"n":11,"t":"People in different professions can benefit from active brain power.","opts":[]},{"n":12,"t":"Favourable after-effect of multitasking","opts":[]},{"n":13,"t":"Supporting evidence from contestants","opts":[]}],"opts":[{"k":"A","t":""},{"k":"B","t":""},{"k":"C","t":""},{"k":"D","t":""},{"k":"E","t":""},{"k":"F","t":""},{"k":"G","t":""},{"k":"H","t":""},{"k":"I","t":""},{"k":"J","t":""},{"k":"K","t":""},{"k":"L","t":""},{"k":"M","t":""},{"k":"N","t":""},{"k":"O","t":""},{"k":"P","t":""},{"k":"Q","t":""}],"ctx":[]}],"ans":{"1":{"v":"the zone","ex":"Part of the passage: I always assumed that creativity was dependent on entering ‘the zone’ Explanation: Paragraph A.","alts":["zone"]},"2":{"v":"spillover effect","ex":"Part of the passage: Thanks to a ‘spillover effect’, the energy and excitement of hectic jobs can lead to more original idea generation. Explanation: Paragraph B."},"3":{"v":"innovation","ex":"Part of the passage: perhaps we’ll come to see our busiest moments as a force for innovation Explanation: Paragraph D."},"4":{"v":"struggles","ex":"Part of the passage: the brain struggles to juggle two activities at once Explanation: Paragraph E."},"5":{"v":"D","ex":"Part of the passage: the more tasks we attempt to do, the higher our heart rate… That energy… could also improve the generation of ideas Explanation: Paragraph G: physiology + heart rate."},"6":{"v":"B","ex":"Part of the passage: the multitasking students did indeed come up with more novel ideas Explanation: مفتاح الكتاب: B (Paragraphs H, I)."},"7":{"v":"C","ex":"Part of the passage: Chefs who multitasked more during the appetiser round designed more original entrees Explanation: Paragraph M."},"8":{"v":"E","ex":"Part of the passage: Recognising these potential benefits of multitasking might help us to frame our busiest moments a bit more positively. Explanation: Paragraph Q."},"9":{"v":"O","ex":"Part of the passage: Melwani and Kapadia’s findings coincide with an intriguing study from Stephen Wee Hun Lim Explanation: coincide = similarity."},"10":{"v":"E","ex":"Part of the passage: In the past, psychologists have taken a decidedly dim view of multitasking. Explanation: dim view = نظرة سلبية."},"11":{"v":"C","ex":"Part of the passage: suggesting that people of many different professions might benefit Explanation: Paragraph C."},"12":{"v":"F","ex":"Part of the passage: Melwani and Kapadia were interested in what came after Explanation: after-effect = what came after."},"13":{"v":"N","ex":"Part of the passage: Kapadia contacted some of the contestants to discuss their experiences on the show Explanation: contestants = المتسابقين."}},"words":[{"w":"multitasking","pos":"n","def":"doing several things at the same time","ex":"Multitasking is generally seen as a stressor.","ar":"تعدد المهام","lvl":""},{"w":"compelling","pos":"adj","def":"very convincing","ex":"According to a compelling new study…","ar":"مقنع جدًا","lvl":""},{"w":"subsequent","pos":"adj","def":"happening after something else","ex":"Multitasking can fuel our subsequent creativity.","ar":"لاحق","lvl":""},{"w":"hectic","pos":"adj","def":"very busy and full of activity","ex":"The energy of hectic jobs can lead to original ideas.","ar":"مزدحم / محموم","lvl":""},{"w":"juggle","pos":"v","def":"to try to deal with several activities at once","ex":"The brain struggles to juggle two activities at once.","ar":"يوفّق بين عدة أشياء","lvl":""},{"w":"disparate","pos":"adj","def":"very different from each other","ex":"Creativity involves tying together disparate thoughts.","ar":"متباين / مختلف","lvl":""},{"w":"hypothesis","pos":"n","def":"an idea that has not yet been proved","ex":"To test their hypothesis, they recruited professional chefs.","ar":"فرضية","lvl":""},{"w":"coincide","pos":"v","def":"to be the same or similar; to happen at the same time","ex":"Their findings coincide with a study from Singapore.","ar":"يتوافق / يتزامن","lvl":""},{"w":"novel","pos":"adj","def":"new and original","ex":"The students came up with more novel ideas.","ar":"جديد ومبتكر","lvl":""}],"n":15,"untitled":false,"pp":1},{"key":"t1p1","kind":"full","test":1,"pp":1,"title":"Worms Put New Life into Derelict Site","intro":"Poisoned soil at an old steelwork is being cleansed by thousands of worms, writes Mimi Chakraborty.","paras":[{"L":"","t":"Thousands of deep-burrowing earthworms are to help turn the long-derelict site of a steelworks into woodland and a renewable energy park."},{"L":"","t":"As part of a pioneering, low-cost plan to reclaim the site of the former Hallside steelworks at Cambuslang near Glasgow, worms are being used to accelerate the process of soil regeneration and to transform the land, over time, into an attractive and financially productive site."},{"L":"","t":"Hallside’s closure in 1979 put an end to more than 100 years of steel production. The surrounding land had become heavily compacted and was too contaminated with heavy metals such as chromium, cadmium, and lead to support any kind of brick-and-mortar development."},{"L":"","t":"The site’s 30 hectares were left abandoned until 1990, when a rescue plan put together by local landscaping and earthmoving company, HL Banks, and the regional developer, Scottish Greenbelt, was app
