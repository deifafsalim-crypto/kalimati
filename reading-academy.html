m. At the end of the line, they are dunked in a solution of calcium ascorbate and then deposited into green bags featuring a jogging Ronald McDonald. The bags make their way in refrigerated trucks to cavernous distribution centers and then to thousands of McDonald’s restaurants in the eastern United States. No more than 14 days after leaving the plant, the fruit will take the place of French fries in some child’s Happy Meal."},{"L":"B","t":"The apple slices, called Apple Dippers, are a symbol of how McDonald’s is trying to offer healthier foods to its customers. McDonald’s has also introduced ‘premium salads’ that will soon be joined by a salad of grapes, walnuts – and, of course, apples. No one knows whether these new offerings will assuage the concerns of public health officials and other critics of McDonald’s highly processed fat and calorie-laden sandwiches, drinks, and fries. So far, they have not entirely done so. But this much is already clear: just as its hamburgers and French fries have made McDonald’s the largest buyer of beef and potatoes in America, its new focus on fresh fruits and vegetables is making it a major player in the $80 billion American produce industry."},{"L":"C","t":"Some believe that McDonald’s could influence not only the volume, variety and prices of fruit and produce in the United States, but also how they are grown. The company now buys more fresh apples than any other restaurant or food service operation, by far. This year, it expects to buy 24,500,000 kilograms of fresh apples – 54 million pounds, or about 135 million individual pieces of fruit. That is up from zero apples just two years ago. (This does not include fruit used to make juice and pies, which use a different quality of apple.)"},{"L":"D","t":"McDonald’s is also among the top five food service buyers of grapes, tomatoes, and spring mix lettuce. Of course, other fast-food chains have similar salads and fruit choices, but they have not had a comparable influence on the market because of their smaller size. Burger King, for example, has 7,600 restaurants in the United States, while Wendy’s has 5,900. McDonald’s has 13,700."},{"L":"E","t":"Missa Bay, the company that runs the Swedesboro plant, one of six McDonald’s apple slicing facilities around the United States, could not be happier about that. In a few months, Missa Bay will also be supplying roughly one-quarter of the 13,700 restaurants with sliced green apples for the new fruit salad. These two items will increase Missa Bay’s revenue by at least 10 percent this year."},{"L":"F","t":"Just as the enormous size of McDonald’s once helped the company turn the nation’s beef, chicken and potato industries into highly mechanized, consistent, and low-cost businesses, McDonald’s is using its purchasing power to build a reliable supply of fresh fruits and vegetables that meet its exacting specifications. At the U.S. Apple Association’s annual marketing conference in Chicago, the McDonald’s director of quality systems in the United States told a crowd of growers that if they wanted to work with McDonald’s, they should grow Cameo and Pink Lady apples. Already, Cameo production in Washington State is up 58 percent in the current crop year from a year earlier, according to the Yakima Valley Growers-Shippers Association."},{"L":"G","t":"Eventually, a bigger supply of certain varieties will drive prices down, which will be good for McDonald’s. But at present, the company’s huge presence in the market is keeping prices high. However, if the new power that McDonald’s exerts over the produce industry ends up reducing prices and squeezing profit margins, said James R. Cranney Jr., vice-president of the apple association, it would be a trade-off that many growers and producers seem willing to accept. ‘Apple consumption has been flat over the past 10 to 15 years,’ he said. ‘This is exactly what the apple industry needs because we think it’s going to increase consumption.’"}],"groups":[{"a":28,"b":33,"k cDonald’s is trying to offer healthier foods Explanation: Paragraph B."},"30":{"v":"N","ex":"Part of the passage: that will soon be joined by a salad of grapes, walnuts – and, of course, apples Explanation: soon = لسّه ما انضافت."},"31":{"v":"N","ex":"Part of the passage: So far, they have not entirely done so. Explanation: مفتاح الكتاب: NO، لأن القطعة تقول إنها لحد الحين ما طمّنتهم بالكامل."},"32":{"v":"NG","ex":"Explanation: ما فيه ذكر للمبيعات."},"33":{"v":"Y","ex":"Part of the passage: have made McDonald’s the largest buyer of beef and potatoes in America Explanation: Paragraph B."},"34":{"v":"apples","ex":"Part of the passage: 50,000 shiny red Gala apples Explanation: Paragraph A.","alts":["gala apples"]},"35":{"v":"dunked","ex":"Part of the passage: they are dunked in a solution of calcium ascorbate Explanation: Paragraph A."},"36":{"v":"calcium ascorbate","ex":"Part of the passage: a solution of calcium ascorbate Explanation: Paragraph A."},"37":{"v":"refrigerated trucks","ex":"Part of the passage: The bags make their way in refrigerated trucks Explanation: Paragraph A."},"38":{"v":"French fries","ex":"Part of the passage: the fruit will take the place of French fries Explanation: replace = take the place of.","alts":["fries"]},"39":{"v":"apples, grapes","ex":"Part of the passage: A planned fruit-and-walnut salad will contain apples and grapes. Explanation: من الجدول.","alts":["apples and grapes","grapes and apples","grapes, apples"]},"40":{"v":"2.2 %","ex":"Part of the passage: McDonald’s share: Potatoes 2.2% Explanation: من الجدول.","alts":["2.2%","2.2","2.2 percent"]}},"words":[{"w":"sprawling","pos":"adj","def":"spreading over a large area","ex":"A sprawling factory in New Jersey.","ar":"مترامي الأطراف","lvl":""},{"w":"dunk","pos":"v","def":"to put something into liquid quickly","ex":"They are dunked in a solution of calcium ascorbate.","ar":"يغمس","lvl":""},{"w":"refrigerated","pos":"adj","def":"kept cold","ex":"The bags travel in refrigerated trucks."," <script>
/* ================= core: data, storage, speech, dictionary, AI ================= */
const DAYS=JSON.parse(document.getElementById('dData').textContent);
const DICT=JSON.parse(document.getElementById('dDict').textContent);
const IMG={bike:document.getElementById('imgBike').textContent};
const PROPER=new Set(DICT.p);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const AR_NUM=n=>String(n);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
const ICON={
 spk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>',
 tr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h10M8 3v2m3 0c-1 4-4 7-7 8m3-5c1 2 3 4 6 5M13 21l4-10 4 10m-6.5-3h5"/></svg>',
 stop:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'
};

/* ---------- progress (per viewer, this browser) ---------- */
let P=store.get('ielts_rd_p',{days:{},xp:0,streak:0,last:'',nb:[],final:null,fs:18,fulls:{}});P.fulls=P.fulls||{};
function DP(n){const p=P.days[n]||(P.days[n]={words:{},read:false,test:{a:{},checked:false,score:null,best:null},games:{},mastery:{best:null,passed:false,tries:0},steps:{}});p.warm=p.warm||{};return p}
function save(){store.set('ielts_rd_p',P)}
const dkey=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
function addXP(n){const t=dkey(new Date()),y=dkey(new Date(Date.now()-864e5));if(P.last!==t){P.streak=P.last===y?P.streak+1:1;P.last=t}P.xp+=n;save();renderHud()}
function streakNow(){const t=dkey(new Date()),y=dkey(new Date(Date.now()-864e5));return (P.last===t||P.last===y)?P.streak:0}
const STEPS_U=[['learn','افهمي السؤال'],['words','الكلمات'],['read','القطعة'],['warm','تسخين'],['test','أسئلة الامتحان'],['games','١٣ لعبة'],['mastery','التمكّن']];
const STEPS_T=[['words','الكلمات'],['read','القطعة'],['test','اختبار الوحدة'],['games','١٣ لعبة'],['mastery','التمكّن']];
const stepsOf=D=>D.kind==='unit'?STEPS_U:STEPS_T;
let STEPS=STEPS_U;
const byKey=k=>DAYS.find(D=>D.key===k);
const PATH=['u0','u1','u2','s1','u3','u4','s2','u5','u6','s3','u7','u8','s4','u9','u10'].map(k=>byKey(k).n);
const STAGES=[['المرحلة الأولى','المهارات الأساسية','--grape',['u0','u1','u2','s1']],['المرحلة الثانية','الفكرة الرئيسية والحقائق','--coral',['u3','u4','s2']],['المرحلة الثالثة','الآراء والملخّصات','--mint',['u5','u6','s3']],['المرحلة الرابعة','الجمل والفقرات','--skyc',['u7','u8','s4']],['المرحلة الخامسة','الأشخاص والرسوم','--sun',['u9','u10']]];
const unitOf=D=>D.kind==='unit'?D:DAYS.find(x=>x.kind==='unit'&&x.u.no===D.unit);
const colOf=D=>D.kind==='unit'?D.u.color:'--rose';
const lname=D=>D.kind==='unit'?(D.u.no?'Unit '+D.u.no:'Skills'):D.kind==='utest'?'Unit '+D.unit+' Test':'Test '+D.test+' · Passage '+D.pp;
const testOf=D=>D.kind==='unit'?DAYS.find(x=>x.kind==='utest'&&x.unit===D.u.no):null;
function stepDone(n,k){const p=DP(n);const D=DAYS[n-1];
 if(k==='learn')return !!p.steps.learn;
 if(k==='words')return !!p.steps.words;
 if(k==='read')return !!p.read;
 if(k==='warm')return !!p.steps.warm;
 if(k==='test')return p.test.checked;
 if(k==='games')return GAMES.filter(g=>g.id!=='pron'&&p.games[g.id]!=null).length>=13;
 if(k==='mastery')return p.mastery.passed;
 return false}
const dayStepsDone=n=>stepsOf(DAYS[n-1]).filter(s=>stepDone(n,s[0])).length;
const mastered=n=>DP(n).mastery.passed;
function currentDay(){for(const n of PATH)if(!mastered(n))return n;return PATH[PATH.length-1]}
function nextInPath(n){const i=PATH.indexOf(n);return i>=0&&i<PATH.length-1?PATH[i+1]:null}
const nQ=D=>{let c=0;D.groups.forEach(g=>c+=g.b-g.a+1);return c};

/* ---------- speech ---------- */
let enV=null;
function pickV(){try{const v=speechSynthesis.getVoices();enV=v.find(x=>/en-GB/i.test(x.lang)&&/female|libby|sonia|serena|kate|martha/i.test(x.name))||v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{pickV();speechSynthesis.onvoiceschanged=pickV}catch(e){}
let speaking=false;
function speak(t,rate,onend){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';if(enV)u.voice=enV;u.rate=rate||.9;u.onend=()=>{speaking=false;onend&&onend()};speaking=true;speechSynthesis.speak(u)}catch(e){toast('الصوت غير متاح في هذا المتصفح')}}
function stopSpeak(){try{speechSynthesis.cancel()}catch(e){}speaking=false}

/* ---------- dictionary ---------- */
function lemmaOf(w){
 let k=w.toLowerCase().replace(/[’]/g,"'").replace(/^'+|'+$/g,'');
 k=k.replace(/'s$/,'');
 if(DICT.g[k])return k;
 if(DICT.f[k]&&DICT.g[DICT.f[k]])return DICT.f[k];
 const tries=[[/ies$/,'y'],[/ied$/,'y'],[/ing$/,''],[/ing$/,'e'],[/ed$/,''],[/ed$/,'e'],[/es$/,''],[/s$/,''],[/ly$/,''],[/er$/,''],[/est$/,'']];
 for(const [re,r] of tries){if(re.test(k)){const b=k.replace(re,r);if(DICT.g[b])return b;if(DICT.f[b]&&DICT.g[DICT.f[b]])return DICT.f[b]}}
 return null}
function glossOf(w){
 const k=lemmaOf(w);if(k)return {lem:k,ar:DICT.g[k]};
 const lw=w.toLowerCase();
 if(/-/.test(w)){const parts=w.split('-').map(x=>{const l=lemmaOf(x);return l?DICT.g[l].split(' / ')[0]:x});return {lem:lw,ar:parts.join(' + ')}}
 if(PROPER.has(lw)||/^[A-Z]/.test(w))return {lem:lw,ar:'اسم علم (شخص أو مكان أو جهة)'};
 return {lem:lw,ar:''}}
/* word-list match for a clicked token */
function wlMatch(D,w){const lw=w.toLowerCase();const lem=lemmaOf(w)||lw;
 return D.words.find(x=>{const head=x.w.toLowerCase().replace(/\(.*?\)/g,'').trim();const first=head.replace(/^(a|to|the)\s+/,'').split(/\s+/)[0];return first===lw||first===lem||(lemmaOf(first)||first)===lem})}
const WL_KEY=x=>{const head=x.w.toLowerCase().replace(/\(.*?\)/g,'').replace(/[’']s\b/g,'').trim();const ws=head.split(/[\s]+/).filter(w=>!/^(a|an|the|to|of|for|with|on|in|into|at|up|out|off|from|somebody|someone|something|oneself|one|yourself|be|do|take|put|get|make|come|keep|end|step|pick|work|leap|hop|cling|team|fall|ride|stem|add|wear|lead|bury|peer|stumble|attribute|boost|cope|correlate|descend|compile|stare|reflect|account|cater|channel|forge|string|bent|belch)$/.test(w));const c=ws.length?ws.sort((a,b)=>b.length-a.length)[0]:head.split(/\s+/)[0];return lemmaOf(c)||c};
const WL_FIRST=D=>{if(D._wl)return D._wl;const s=new Set();D.words.forEach(x=>{s.add(WL_KEY(x));const h=x.w.toLowerCase().replace(/\(.*?\)/g,'').trim();if(!/\s/.test(h))s.add(lemmaOf(h)||h)});return D._wl=s};

/* ---------- tokenising English text into clickable words ---------- */
function tokHTML(text,D){
 const wl=D?WL_FIRST(D):null;
 return String(text==null?'':text).split(/([A-Za-z]+(?:[’'-][A-Za-z]+)*)/).map((p,i)=>{if(i%2===0)return esc(p);const l=lemmaOf(p)||p.toLowerCase();return `<span class="w${wl&&wl.has(l)?' wl':''}" data-w="${esc(p)}">${esc(p)}</span>`}).join('')}
function splitSent(t){return String(t).split(/(?<=[.!?]["”’']?)\s+(?=[A-Z“‘"'(])/).filter(x=>x.trim())}

const KIND_AR={tf:'صح / خطأ / غير مذكور',yn:'نعم / لا / غير مذكور',mcq:'اختيار من متعدد',multi:'اختاري أكثر من حرف',head:'عناوين الفقرات',para:'أي فقرة فيها المعلومة؟',match:'توصيل',gap:'أكملي الفراغ'};
const HINT={
 tf:'TRUE = القطعة تقول نفس المعنى. FALSE = القطعة تقول العكس. NOT GIVEN = ما فيه معلومة تأكد أو تنفي.',
 yn:'نفس فكرة TRUE/FALSE لكن عن رأي الكاتب: YES يوافق رأيه، NO يعاكس رأيه، NOT GIVEN ما نعرف رأيه.',
 mcq:'اقرئي السؤال، دوّري الكلمة المفتاحية في القطعة، واقرئي الجملة اللي قبلها وبعدها قبل ما تختارين.',
 multi:'لازم تختارين العدد المطلوب بالضبط. كل حرف صحيح عليه درجة.',
 head:'اقرئي أول جملتين وآخر جملة من الفقرة، ودوّري الفكرة الرئيسية مو تفصيلة صغيرة.',
 para:'ممكن نفس الفقرة تتكرر. دوّري المعنى مو نفس الكلمات (paraphrase).',
 match:'دوّري الاسم أو الكلمة المفتاحية في القطعة، وطابقي المعنى.',
 gap:'التزمي بعدد الكلمات المسموح، وانسخي الكلمة من القطعة بنفس تهجئتها.'};
const TFV={tf:[['T','TRUE'],['F','FALSE'],['NG','NOT GIVEN']],yn:[['Y','YES'],['N','NO'],['NG','NOT GIVEN']]};
const GAPRE=/(?:[…]{2,}|\.{4,})[…\.]*/;
function normA(s){return String(s||'').toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9%' ]+/g,' ').replace(/\s+/g,' ').trim().replace(/^(the|a|an) /,'')}
function variants(a){
 const out=new Set();const raw=String(a.v||'');
 const alts=raw.split(/\s+\/\s+|\s+OR\s+/);(a.alts||[]).forEach(x=>alts.push(x));
 alts.forEach(x=>{
  out.add(normA(x.replace(/[()]/g,'')));out.add(normA(x.replace(/\([^)]*\)/g,'')));
  const m=x.match(/^\s*([\d,.]+%?)\s+\w+/);if(m)out.add(normA(m[1]));
  const am=x.replace(/[()]/g,'').match(/^(\w+) and (\w+)$/);if(am)out.add(normA(am[2]+' and '+am[1]));
 });
 out.delete('');return out}
function gapOK(a,val){if(!val)return false;const v=normA(val);return variants(a).has(v)||variants(a).has(v.replace(/,/g,''))}
function groupOf(D,n){return D.groups.find(g=>n>=g.a&&n<=g.b)}
function grade(D,A){
 const res={};let score=0,total=0;
 D.groups.forEach(g=>{
  if(g.k==='multi'){
   const ansSet=String(D.ans[g.a].v).includes(',')?String(D.ans[g.a].v).split(','):(D.ans[g.a].set||[D.ans[g.a].v]);
   const u=String(A[g.a]||'').split(',').filter(Boolean);
   const nums=[];for(let n=g.a;n<=g.b;n++)nums.push(n);
   if(nums.length===1){const ok=u.length===ansSet.length&&u.every(x=>ansSet.includes(x));res[g.a]=ok;total++;if(ok)score++;return}
   const hits=u.filter(x=>ansSet.includes(x)).length;
   nums.forEach((n,i)=>{const ok=i<hits;res[n]=ok;total++;if(ok)score++});return}
  for(let n=g.a;n<=g.b;n++){
   const a=D.ans[n];const v=A[n];let ok=false;
   if(g.k==='gap')ok=gapOK(a,v);
   else if(g.k==='head')ok=String(v||'').toLowerCase()===String(a.v).toLowerCase();
   else ok=v!=null&&String(v)===String(a.v);
   res[n]=ok;total++;if(ok)score++}
 });
 return {res,score,total}}
const BAND=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5],[0,2]];
function bandOf(score,total){const raw=Math.round(score/total*40);return BAND.find(b=>raw>=b[0])[1]}

/* ---------- controls ---------- */
function gapInput(D,n,ctx){
 const a=ctx.A[n]||'';let cls='gapin';
 if(ctx.checked)cls+=ctx.res[n]?' ok':' no';

 if(g.k==='match'&&!g.items.length){
  return `<span class="gnum">${n}</span><select class="gapsel" data-q="${n}" data-scope="${ctx.scope}" aria-label="Question ${n}" ${ctx.checked?'disabled':''}><option value="">—</option>${g.opts.map(o=>`<option value="${o.k}" ${a===o.k?'selected':''}>${o.k} · ${esc(o.t)}</option>`).join('')}</select>`}
 return `<span class="gnum">${n}</span><input class="${cls}" data-q="${n}" data-scope="${ctx.scope}" value="${esc(a)}" aria-label="Question ${n}" autocomplete="off" spellcheck="false" ${ctx.checked?'disabled':''}>`}
function withGaps(D,text,ctx,g){
 // replace "12 ……" (or "12……") inside context text with an input for question 12
 return esc(text).replace(/(\d{1,2})\s*(?:[…]{2,}|\.{4,})[…\.]*/g,(m,num)=>{const n=+num;return (n>=g.a&&n<=g.b)?gapInput(D,n,ctx):m})}
function choiceBtns(n,list,ctx,correct,col){

 return `<div class="choices${col?' col':''}">${list.map(([k,label])=>{let c='choice';if(String(v)===String(k))c+=' on';if(ctx.checked){if(String(k)===String(correct))c+=' right';else if(String(v)===String(k))c+=' wrong'}return `<button class="${c}" data-qa="${n}" data-v="${esc(k)}" data-scope="${ctx.scope}" ${ctx.checked?'disabled':''}>${label}</button>`}).join('')}</div>`}
function verdict(D,n,ctx){
 if(!ctx.checked)return '';const a=D.ans[n];const ok=ctx.res[n];
 return `<div class="verdict"><span class="pill" style="background:${ok?'var(--ok-soft)':'var(--bad-soft)'}">${ok?'صح':'الإجابة الصحيحة'}</span>${ok?'':`<span class="ans">${esc(a.raw||a.v)}</span>`}<button class="icon-btn" data-expl="${n}" data-scope="${ctx.scope}">شرح الكتاب</button><button class="icon-btn" data-where="${n}" data-scope="${ctx.scope}">وين الجواب في القطعة؟</button>${AI?`<button class="icon-btn" data-aiex="${n}" data-scope="${ctx.scope}">اشرحي لي بالعربي</button>`:''}</div>${ctx.open&&ctx.open[n]?explHTML(D,n,ctx):''}`}
function explParts(ex){
 const LBL={'Answer':'الإجابة','Part of the passage':'من القطعة','Explanation':'الشرح','Comment':'تعليق','Meaning':'المعنى','Main idea':'الفكرة الرئيسية','Possible headings':'عناوين محتملة'};
 const re=/(Answers?|Part of the passage(?:\s*\[[^\]]*\])?|Explanation|Comment|Meaning|Main idea in paragraph [A-J]|Possible headings|Highlighted in \w+ = Question \d+)\s*:/g;
 const out=[];let m,last=null,lastIdx=0;
 while((m=re.exec(ex))){if(last)out.push([last,ex.slice(lastIdx,m.index).trim()]);last=m[1];lastIdx=re.lastIndex}
 if(last)out.push([last,ex.slice(lastIdx).trim()]);
 return out.filter(p=>!/^Highlighted/.test(p[0])&&p[1]).map(([k,v])=>{const key=Object.keys(LBL).find(x=>k.startsWith(x));return [LBL[key]||k,v]})}
function explHTML(D,n,ctx){
 const a=D.ans[n];const parts=explParts(a.ex||'');
 const ai=ctx.ai&&ctx.ai[n];
 return `<div class="expl">${parts.length?parts.slice(0,8).map(([k,v])=>`<div><span class="k">${k}</span><div class="src">${tokHTML(v,D)}</div></div>`).join(''):`<div class="src">${tokHTML(a.ex||'',D)}</div>`}${ai?`<div class="ai">${esc(ai)}</div>`:''}</div>`}
function partOf(D,n){const p=explParts(D.ans[n].ex||'').find(x=>x[0]==='من القطعة');return p?p[1]:''}

  h+=`<p class="qt">${tokHTML(g.q||'',D)}</p><p class="small muted">اختاري ${g.count===3?'ثلاثة':'حرفين'} بالضبط (${v.length}/${g.count})</p><div class="choices col">${g.opts.map(o=>{let c='choice';if(v.includes(o.k))c+=' on';if(ctx.checked){if(ans.includes(o.k))c+=' right';else if(v.includes(o.k))c+=' wrong'}return `<button class="${c}" data-multi="${g.a}" data-v="${o.k}" data-scope="${ctx.scope}" ${ctx.checked?'disabled':''}><b>${o.k}</b>${esc(o.t)}</button>`}).join('')}</div>`;

 if(g.items.length){

   else if(g.k==='tf'||g.k==='yn')body=`<div class="qt">${tokHTML(it.t,D)}</div>${choiceBtns(n,TFV[g.k],ctx,D.ans[n].v)}`;
   else if(g.k==='mcq')body=`<div class="qt">${tokHTML(it.t,D)}</div>${choiceBtns(n,it.opts.map(o=>[o.k,`<b>${o.k}</b>${esc(o.t)}`]),ctx,D.ans[n].v,true)}`;
   else body=`<div class="qt">${tokHTML(it.t,D)}</div>${choiceBtns(n,g.opts.map(o=>[o.k,`<b>${esc(o.k)}</b>`]),ctx,D.ans[n].v)}`;
   h+=`<div class="qitem">${qn}<div>${body}${verdict(D,n,ctx)}</div></div>`});

 else if(g.mode==='table'){const T=g.table;h+=`<div class="tablewrap"><table class="qt2"><thead><tr>${T.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${T.rows.map(r=>`<tr><th>${esc(r[0])}</th><td>${r[1].map(x=>'• '+withGaps(D,x,ctx,g)).join('<br>')}</td><td>${r[2].map(x=>'• '+withGaps(D,x,ctx,g)).join('<br>')}</td></tr>`).join('')}</tbody></table></div>`}
 else if(g.mode==='sum')h+=`<div class="ctx">${g.ctx.map(l=>withGaps(D,l,ctx,g)).join(' ')}</div>`;
 else h+=`<div class="notes">${g.ctx.map(l=>`<div>${withGaps(D,l,ctx,g)}</div>`).join('')}</div>`;
 if(g.k==='match'&&g.opts.length)h+=`<div class="optbox cols"><h5>الكلمات المتاحة</h5><ol>${g.opts.map(o=>`<li><b>${o.k}</b> ${esc(o.t)}</li>`).join('')}</ol></div>`;
 if(ctx.checked){for(let n=g.a;n<=g.b;n++)h+=`<div class="qitem"><span class="qn ${ctx.res[n]?'ok':'no'}">${n}</span><div>${verdict(D,n,ctx)}</div></div>`}

function passageHTML(D,hl,tools){
 hl=hl||new Set();
 const paras=D.paras.map((p,pi)=>{
  const sents=splitSent(p.t).map((s,si)=>`<span class="s${hl.has(pi+':'+si)?' hl':''}" data-s="${pi}:${si}">${tokHTML(s,D)}</span>`).join(' ');
  return `<div class="para${p.foot?' foot':''}" id="p${D.n}_${pi}"><div class="lab">${p.L||''}</div><div>${sents}${tools&&!p.foot?`<div class="ptools"><button class="icon-btn" data-sayp="${pi}">${ICON.spk} اسمعي الفقرة</button>${AI?`<button class="icon-btn" data-trp="${pi}">${ICON.tr} ${S.ptr[D.n+':'+pi]?'إخفاء الترجمة':'ترجمي الفقرة'}</button>`:''}</div>`:''}${S.ptr[D.n+':'+pi]&&S.ptrOn&&S.ptrOn[D.n+':'+pi]?`<div class="tr" dir="rtl">${esc(S.ptr[D.n+':'+pi])}</div>`:''}</div></div>`}).join('');
 const T=D.tbl;const tb=T?`<div class="tablewrap"><table class="qt2 ptable"><thead><tr>${T.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${T.rows.map(r=>`<tr>${r.map((x,i)=>i?`<td>${esc(x)}</td>`:`<th>${esc(x)}</th>`).join('')}</tr>`).join('')}</tbody></table></div>${T.note?`<p class="small">${esc(T.note)}</p>`:''}`:'';
 return `<h3>${esc(D.title)}</h3>${D.intro?`<p class="intro">${tokHTML(D.intro,D)}</p>`:''}${tb}${paras}`}
function findAnswer(D,n){
 const a=D.ans[n];const hay0=partOf(D,n)||(a.ex||'');if(!hay0)return null;
 const N=s=>s.toLowerCase().replace(/-\s+/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
 const hay=' '+N(hay0)+' ';const hl=new Set();let first=null;
 D.paras.forEach((p,pi)=>splitSent(p.t).forEach((s,si)=>{const w=N(s).split(' ');if(w.length<4)return;let hit=0,tot=0;for(let i=0;i+4<=w.length;i++){tot++;if(hay.includes(' '+w.slice(i,i+4).join(' ')+' '))hit++}if(hit>=2&&hit/tot>=.25){hl.add(pi+':'+si);if(!first)first=pi+':'+si}}));
 return hl.size?{hl,first}:null}

function editDist(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i].concat(Array(n).fill(0)));for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}

 const a=target.toLowerCase(),b=heard.toLowerCase();const m=a.length,n=b.length;const L=Array.from({length:m+1},()=>Array(n+1).fill(0));
 for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);

function bookRound(D,n){

 if(g.k==='head'){const right=g.opts.find(o=>o.k.toLowerCase()===String(a.v).toLowerCase());const others=shuffle(g.opts.filter(o=>o!==right)).slice(0,3);return choiceRound({...base,prompt:`<p class="small muted">Question ${n}: أنسب عنوان لهذي الفقرة؟</p><div class="sent">${esc(it.t)}</div>`,opts:shuffle([right,...others]).filter(Boolean).map(o=>({label:o.k+'  '+o.t,val:o.k,en:1})),ans:right?right.k:a.v,list:1,peekL:(it.t.match(/[A-J]$/)||[])[0]})}

 if(g.k==='match'){const pr=it?esc(it.t):lineWith();return choiceRound({...base,prompt:`<p class="small muted">Question ${n}${g.optTitle?' · '+esc(g.optTitle):''}</p><div class="sent">${pr}</div>`,opts:g.opts.map(o=>({label:o.k+'  '+o.t,val:o.k,en:1})),ans:a.v,list:g.opts.some(o=>o.t.length>25)?1:0})}
 if(g.k==='multi'){const set=String(a.v).includes(',')?String(a.v).split(','):(a.set||[a.v]);return {...base,kind:'multi',bqs:[],prompt:`<p class="small muted">Questions ${g.a}${g.b>g.a?'–'+g.b:''} · اختاري ${set.length===3?'ثلاثة':'حرفين'}</p><div class="sent">${esc(g.q||'')}</div>`,opts:g.opts,ans:set,sel:[]}}

function masteryRounds(D){
 const p=DP(D.n);const all=[];D.groups.forEach(g=>{if(g.k==='multi'){all.push(g.a);return}for(let n=g.a;n<=g.b;n++)all.push(n)});
 let qs;const prevWrong=p.mastery.wrong||[];
 if(p.test.checked){const res=grade(D,p.test.a).res;const wrong=all.filter(n=>!res[n]);qs=[...new Set([...prevWrong,...wrong])];const rest=shuffle(all.filter(n=>!qs.includes(n)));qs=qs.concat(rest.slice(0,Math.max(4,8-qs.length)))}
 else qs=all;
 qs=qs.map(n=>{const g=groupOf(D,n);return g.k==='multi'?g.a:n});qs=[...new Set(qs)];

 const voc=shuffle(BUILD.mean(D)).slice(0,4).concat(shuffle(BUILD.def(D)).slice(0,3)).concat(shuffle(BUILD.scan(D)).slice(0,3));
 return shuffle(R).concat(shuffle(voc))}

function qkinds(D){if(D.kind==='unit')return QKINDS[D.key]||['gap'];return [...new Set(D.groups.map(g=>g.k).filter(k=>k!=='multi'))]}

function bestPara(L,text){const W=new Set((text||'').toLowerCase().match(/[a-z]{4,}/g)||[]);let best=-1,bi=0;L.paras.forEach((p,i)=>{const c=(p.t.toLowerCase().match(/[a-z]{4,}/g)||[]).filter(w=>W.has(w)).length;if(c>best){best=c;bi=i}});return L.paras[bi].t}

function qtypeRounds(D){
 const K=qkinds(D);const pool=[];
 DAYS.forEach(L=>{if(L.kind==='full'&&!P.fulls[L.test])return;L.groups.forEach(g=>{if(!K.includes(g.k)||g.k==='multi')return;
  if(g.k==='gap'&&D.key==='u6'&&g.mode!=='sum')return;
  if(g.k==='head'){pool.push({board:1,L,g});for(let n=g.a;n<=g.b;n++)pool.push({L,n,g});return}
  for(let n=g.a;n<=g.b;n++)pool.push({L,n,g})})});
 const own=pool.filter(x=>x.L.n===D.n);const rest=shuffle(pool.filter(x=>x.L.n!==D.n));
 const boards=shuffle(pool.filter(x=>x.board)).slice(0,2);
 const singles=shuffle(own.filter(x=>!x.board)).slice(0,3).concat(rest.filter(x=>!x.board)).slice(0,10-boards.length);
 const R=singles.map(({L,n,g})=>{const r=bookRound(L,n);r.day=L.n;
  if(g.k==='para'){const others=shuffle(g.opts.map(o=>o.k).filter(k=>k!==L.ans[n].v)).slice(0,3);r.opts=shuffle([L.ans[n].v,...others]).map(k=>{const t=paraOf(L,k);return {label:'Paragraph '+k+': '+(t.length>330?t.slice(0,327)+'…':t),val:k,en:1}});r.list=1;r.prompt=`<p class="small muted">أي فقرة فيها هذي المعلومة؟ (${esc(L.title)})</p><div class="sent big2">${esc(qtext(L,n))}</div>`}
  else if(g.k==='head'){const letter=(qtext(L,n).match(/Paragraph ([A-Q])/)||[])[1];r.prompt=`<p class="small muted">أنسب عنوان لهذي الفقرة؟ (${esc(L.title)})</p><div class="exbox"><b class="en">Paragraph ${letter}</b><div class="en">${esc(paraOf(L,letter))}</div></div>`}
  else r.prompt+=(g.mode==='diagram'?`<img class="diagram" src="${IMG[g.img]}" alt="Diagram">`:'')+exHTML(L,n);

 if(G&&!G.done){const R=G.rounds[G.i];if(!R||R.kind!=='board')return;
  if(d.bh&&G.picked==null){R.sel=R.sel===d.bh?null:d.bh;render();return}
  if(d.bp&&G.picked==null){const n=+d.bp;if(R.sel){for(const k in R.place)if(R.place[k]===R.sel)delete R.place[k];R.place[n]=R.sel;R.sel=null}else delete R.place[n];render();return}
  if(d.breset2){R.place={};R.sel=null;render();return}
  if(d.bcheck2){const L=DAYS[R.L-1];answerRound(R.items.every(it=>R.place[it.n]===L.ans[it.n].v)?'ok':'no');return}
 }
});
setInterval(()=>{const G=S.game;if(!G||G.done)return;const R=G.rounds[G.i];if(!R||!R.timed||G.picked!=null||R.timedOut)return;
 if(!document.getElementById('qtl'))return;
 R.tl=Math.max(0,R.tl-1);const e=$('#qtl');if(e)e.textContent=R.tl;const bar=$('#qtbar');if(bar)bar.style.width=(R.tl/R.tmax*100)+'%';
 if(R.tl===0){R.timedOut=true;if(R.kind==='type'){const i=$('#tin');R.typed=i?i.value:''}answerRound(R.kind==='choice'?'__timeout':'no')}},1000);
