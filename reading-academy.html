<!doctype html><html lang="ar" dir="rtl"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><nav aria-label="التنقل" style="max-width:1120px;margin:16px auto"><a href="./index.html" style="color:var(--accent);font-weight:700;text-decoration:underline">← العودة إلى كلماتي</a></nav>
<title>أكاديمية القراءة IELTS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600&display=swap">
<style>
/* Layout: a calm study desk. Sage-grey ground, white "paper" sheets, one deep-teal accent, a yellow highlighter for answers. */
:root{
 --bg:#F3F6FB; --surface:#FFFFFF; --sheet:#FAFCFF; --ink:#1C2340; --muted:#5E6684; --line:#E2E7F2;
 --accent:#11808F; --accent-ink:#FFFFFF; --accent-soft:#DDF3F3; --sky:#E6F1FF; --sky-ink:#1F5FA8;
 --mark:#FFE58A; --mark-ink:#5B4300; --ok:#1FA971; --ok-soft:#DDF7EA; --bad:#E5533D; --bad-soft:#FFE6E1; --gold:#F2A900;
 --coral:#FF6F61; --sun:#FFB938; --mint:#2EC4A0; --skyc:#4D9CFF; --grape:#8C6CF0; --rose:#F25C9A;
 --hero1:#0D6E7D; --hero2:#1E9E9A; --hero3:#55C6A9;
 --shadow:rgba(28,35,64,.08);
 --ui:"Readex Pro","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
 --read:"Literata",Georgia,"Times New Roman",serif;
 --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#10162A; --surface:#182037; --sheet:#1B2440; --ink:#E9ECF7; --muted:#A3ABC6; --line:#2A3452;
 --accent:#4FD1C5; --accent-ink:#06201F; --accent-soft:#173A40; --sky:#182D4A; --sky-ink:#A9CBFF;
 --mark:#6B5612; --mark-ink:#FFE9A6; --ok:#4FD69A; --ok-soft:#14352A; --bad:#FF8A76; --bad-soft:#3F211D; --gold:#FFC94D;
 --coral:#FF8A7E; --sun:#FFC85C; --mint:#4FD8B6; --skyc:#73B2FF; --grape:#A994FF; --rose:#FF7DB2;
 --hero1:#0B4E5A; --hero2:#137A78; --hero3:#2E9C86;
 --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#10162A; --surface:#182037; --sheet:#1B2440; --ink:#E9ECF7; --muted:#A3ABC6; --line:#2A3452;
 --accent:#4FD1C5; --accent-ink:#06201F; --accent-soft:#173A40; --sky:#182D4A; --sky-ink:#A9CBFF;
 --mark:#6B5612; --mark-ink:#FFE9A6; --ok:#4FD69A; --ok-soft:#14352A; --bad:#FF8A76; --bad-soft:#3F211D; --gold:#FFC94D;
 --coral:#FF8A7E; --sun:#FFC85C; --mint:#4FD8B6; --skyc:#73B2FF; --grape:#A994FF; --rose:#FF7DB2;
 --hero1:#0B4E5A; --hero2:#137A78; --hero3:#2E9C86;
 --shadow:rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.7;margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
.en{direction:ltr;unicode-bidi:isolate;text-align:left}
.muted{color:var(--muted)}
.small{font-size:13.5px}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:.5px}
.brand h1{font-size:19px;font-weight:600}
.brand p{font-size:12.5px;color:var(--muted)}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13.5px;white-space:nowrap}
.chip b{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px;align-self:flex-start;max-width:100%}
.tab{flex:0 0 auto;border:0;background:none;border-radius:999px;padding:7px 16px;font-size:14.5px;color:var(--muted)}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 4px 14px var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 16px;font-size:14.5px;font-weight:500}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.btn.sm{padding:5px 11px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:3px 9px;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.icon-btn svg{width:15px;height:15px}
.btn svg{width:16px;height:16px;vertical-align:-3px;margin-inline-end:4px}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;background:var(--accent-soft);color:var(--ink)}
.eyebrow{font-size:12.5px;letter-spacing:.6px;color:var(--accent);font-weight:600}
/* plan */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px}
.hero .today h2{font-size:24px}
.today .meta{display:flex;gap:8px;flex-wrap:wrap}
.meter{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:6px}
.steps5{display:flex;gap:6px;flex-wrap:wrap}
.steps5 span{font-size:12.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps5 span.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.week{display:flex;flex-direction:column;gap:8px}
.week h3{font-size:15px;color:var(--muted);font-weight:500}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.dtile{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.dtile:hover{border-color:var(--accent)}
.dtile .n{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.dtile .t{font-family:var(--read);font-size:15px;direction:ltr;text-align:left;line-height:1.35;min-height:2.7em}
.dtile.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.star{color:var(--gold);font-size:15px}
/* day */
.dayhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}
.dayhead h2{font-family:var(--read);font-size:27px;font-weight:600;direction:ltr;text-align:left}
.stepbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.stepbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 13px;font-size:14px;display:flex;gap:7px;align-items:center}
.stepbtn .k{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:12px;font-variant-numeric:tabular-nums}
.stepbtn.done .k{background:var(--ok);color:#fff}
.stepbtn[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
/* words */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.wcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--sheet);display:flex;flex-direction:column;gap:6px;min-width:0}
.wcard .w{font-family:var(--read);font-size:19px;font-weight:600;direction:ltr;text-align:left}
.wcard .ar{font-size:16px;font-weight:500;color:var(--accent)}
.wcard .def,.wcard .ex{font-family:var(--read);font-size:14.5px;direction:ltr;text-align:left}
.wcard .ex{color:var(--muted);font-style:italic}
.wcard.known{border-color:var(--ok);background:var(--ok-soft)}
/* reader */
.reader{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px clamp(16px,4vw,40px);font-family:var(--read);direction:ltr;text-align:left;font-size:var(--fs,18px);line-height:1.8}
.reader h3{font-family:var(--read);font-size:1.35em;text-align:center;margin-bottom:6px}
.reader .intro{font-style:italic;color:var(--muted);text-align:center;margin-bottom:14px}
.para{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;margin-bottom:16px}
.para .lab{font-family:var(--ui);font-weight:700;color:var(--accent);font-size:15px;padding-top:4px}
.para .ptools{display:flex;gap:6px;margin-top:6px;font-family:var(--ui);direction:rtl;justify-content:flex-end}
.para .tr{font-family:var(--ui);direction:rtl;text-align:right;background:var(--sky);color:var(--ink);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:15px;line-height:1.8}
.foot{font-size:.8em;color:var(--muted)}
.w{cursor:pointer;border-radius:3px}
.w:hover{background:var(--accent-soft)}
.w.wl{border-bottom:2px solid var(--accent)}
.hl{background:var(--mark);color:var(--mark-ink);border-radius:3px;box-shadow:0 0 0 2px var(--mark)}
.fsz{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.fsz button{border:0;background:var(--sheet);padding:3px 10px;font-size:13px}
/* test */
.testgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.testgrid .reader{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 30px);overflow:auto;font-size:16px}
.pane-switch{display:none}
.qgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.qhead{font-weight:600;font-size:15px}
.instr{font-family:var(--read);direction:ltr;text-align:left;font-size:14.5px;color:var(--muted);font-style:italic}
.hint{font-size:13.5px;background:var(--sky);color:var(--sky-ink);border-radius:10px;padding:8px 12px}
.optbox{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;background:var(--sheet)}
.optbox h5{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:500}
.optbox ol{list-style:none;margin:0;padding:0;direction:ltr;text-align:left;font-family:var(--read);font-size:14.5px;display:grid;gap:3px}
.optbox li b{display:inline-block;min-width:34px;color:var(--accent);font-family:var(--ui)}
.optbox.cols ol{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.qitem{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0}
.qn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--sheet)}
.qn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.qn.no{background:var(--bad);border-color:var(--bad);color:#fff}
.qt{font-family:var(--read);direction:ltr;text-align:left;font-size:15.5px}
.choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;direction:ltr}
.choice{border:1.5px solid var(--line);background:var(--sheet);border-radius:9px;padding:4px 11px;font-size:14px;text-align:left}
.choice.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.choice.right{border-color:var(--ok);background:var(--ok-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choices.col{flex-direction:column;align-items:stretch}
.choices.col .choice{font-family:var(--read);font-size:14.5px}
.choice b{font-family:var(--ui);color:var(--accent);margin-right:6px}
.gapin{font:inherit;font-family:var(--ui);font-size:14.5px;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:1px 6px;width:9.5em;max-width:100%;color:var(--ink);direction:ltr}
.gapin.ok{border-color:var(--ok);background:var(--ok-soft)}
.gapin.no{border-color:var(--bad);background:var(--bad-soft)}
.gapsel{font:inherit;font-size:14px;border:1.5px solid var(--accent);border-radius:7px;background:var(--accent-soft);color:var(--ink);padding:1px 4px;max-width:100%}
.gnum{font-family:var(--ui);font-weight:700;font-size:12px;background:var(--ink);color:var(--surface);border-radius:5px;padding:0 5px;margin-right:4px}
.ctx{font-family:var(--read);direction:ltr;text-align:left;font-size:15.5px;line-height:2.1}
.ctitle{font-family:var(--read);font-weight:600;text-align:center;direction:ltr}
.flow{display:flex;flex-direction:column;align-items:center;gap:0}
.flow .box{border:1.5px solid var(--ink);border-radius:8px;padding:6px 12px;background:var(--sheet);max-width:560px;width:100%;text-align:center;font-family:var(--read);direction:ltr;font-size:15px;line-height:2}
.flow .arr{height:20px;width:2px;background:var(--ink);position:relative;margin-bottom:6px}
.flow .arr::after{content:"";position:absolute;bottom:-6px;left:-5px;border:6px solid transparent;border-top-color:var(--ink)}
.notes{display:flex;flex-direction:column;gap:4px;font-family:var(--read);direction:ltr;text-align:left;font-size:15px;line-height:2}
.tablewrap{overflow-x:auto}
table.qt2{border-collapse:collapse;direction:ltr;font-family:var(--read);font-size:14.5px;min-width:520px;width:100%}
table.qt2 th,table.qt2 td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left;line-height:2}
table.qt2 th{background:var(--accent-soft)}
.diagram{max-width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
.verdict{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;margin-top:6px}
.verdict .ans{font-family:var(--read);direction:ltr}
.expl{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:6px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.expl .src{font-family:var(--read);direction:ltr;text-align:left;font-size:14px}
.expl .k{font-weight:600;color:var(--accent);font-size:12.5px}
.ai{background:var(--sky);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.9}
.score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.score .big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.band{border:2px solid var(--accent);border-radius:12px;padding:4px 14px;text-align:center}
.band b{display:block;font-size:24px;line-height:1.2}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.sheetbar{display:flex;flex-wrap:wrap;gap:4px}
.sheetbar span{width:28px;height:28px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.sheetbar span.f{border-color:var(--accent);background:var(--accent-soft)}
.sheetbar span.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.sheetbar span.no{background:var(--bad);border-color:var(--bad);color:#fff}
/* games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.game{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:start;display:flex;flex-direction:column;gap:4px;min-width:0}
.game:hover{border-color:var(--accent)}
.game h4{font-size:15.5px}
.game p{font-size:13px;color:var(--muted);line-height:1.6}
.game .gb{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.game .best{color:var(--ok);font-weight:600}
.play{display:flex;flex-direction:column;gap:14px}
.prompt{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:16px}
.prompt .big{font-family:var(--read);font-size:26px;font-weight:600;direction:ltr;text-align:center}
.prompt .sent{font-family:var(--read);direction:ltr;text-align:left;font-size:17px;line-height:1.9}
.blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;text-align:center;min-width:0}
.opt.en{font-family:var(--read);direction:ltr}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-size:14.5px}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.flip{min-height:150px;display:grid;place-items:center;text-align:center;cursor:pointer}
.tiles{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.tile{border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;padding:4px 10px;font-family:var(--read);font-size:15.5px}
.tile:disabled{opacity:.3}
.slot{min-height:46px;border:1.5px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.order{display:flex;flex-direction:column;gap:6px}
.order button{text-align:left;direction:ltr;font-family:var(--read);font-size:14.5px;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 10px;display:flex;gap:8px}
.order button .o{font-family:var(--ui);min-width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px}
.order button.picked .o{background:var(--accent);color:var(--accent-ink)}
.input{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--sheet);color:var(--ink);width:100%}
.input.en{font-family:var(--read)}
.diff span{border-radius:4px;padding:0 2px}
.ldiff .miss{color:var(--bad);text-decoration:underline 3px;background:none}
.ldiff .okw{color:var(--ok)}
.diff .miss{background:var(--bad-soft);color:var(--bad)}
.diff .okw{background:var(--ok-soft)}
/* mastery */
.mbadge{display:flex;gap:12px;align-items:center}
.mbadge .medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;background:var(--accent-soft);color:var(--accent);border:2px solid var(--accent)}
.mbadge .medal.gold{background:var(--mark);color:var(--mark-ink);border-color:var(--gold)}
/* sheet popup */
.wsheet{position:fixed;inset:auto 0 0 0;z-index:30;display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.wsheet>div{width:100%;max-width:600px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px var(--shadow);padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px;max-height:75vh;overflow:auto}
.wsheet .ww{font-family:var(--read);font-size:26px;font-weight:600;direction:ltr}

/ is / mandated / by / the / government = 8"},{"k":"type","q":"How many words? “Visiting new places has both advantages and disadvantages.”","a":["8","eight"],"why":"Visiting / new / places / has / both / advantages / and / disadvantages = 8"},{"k":"type","q":"How many words? “I think this activity is time-consuming.”","a":["6","six"],"why":"time-consuming كلمة وحدة = 6 كلمات."},{"k":"type","q":"How many words? “There are now about 100 thousand people living on the island.”","a":["11","eleven"],"why":"100 ينحسب كلمة وحدة = 11 كلمة."},{"k":"order","q":"Exercise 3: Put the questions in the same order as the information in the paragraph.","text":"Childhood obesity is rapidly becoming a global epidemic. The US continues to lead the way, with as many as 37% of its children and adolescents carrying too much fat. But other countries are rapidly catching up. According to the statistics presented at the European Congress on Obesity in Finland, more than 20% of European youngsters between the ages of 5 and 17 are either overweight or obese. Asia lags behind the US and Europe in its obesity statistics. Up to 10% of China’s 290 million children are already believed to be overweight or obese, and that percentage is expected to have doubled a decade from now. So, across Asia too, childhood obesity is on the rise, and a less marked trend has been documented even in urbanized areas of sub-Saharan Africa.","items":["What percentage of children and teenagers of the US is overweight?","Do Asia and Europe have equal proportions of obese children?","It is forecast that the proportion of obese children in China will reach 20% in ten years’ time. What evidence of this is given?","Is there a downward trend in childhood obesity in some African towns and cities?"],"why":"الترتيب: أمريكا ← أوروبا وآسيا ← الصين ← أفريقيا. الأسئلة في الاختبار دايمًا تمشي بنفس الترتيب."},{"k":"pick","q":"Part 3, Exercise 1: Tap the KEYWORDS in the question.","text":"Who is against the proposed idea of giving vaccination to children below 12 years old?","a":["Who","against","giving","vaccination","below","12","years","old"],"why":"الكلمات المفتاحية: Who, against, giving vaccination, below 12 years old."},{"k":"pick","q":"Tap the KEYWORDS in the question.","text":"In the future, what may become the deciding factor for students choosing a university?","a":["future","what","deciding","factor","choosing","university"],"why":"future, what, deciding factor, choosing a university"}],"no":1},"paras":[{"L":"","t":"From the earliest times, people have devised highly ingenious methods for conserving water where it is scarce. In the Sahara in Africa, where two-thirds of the sparse population live in permanent settlements, many of the oases that provide natural supplies of water have been enlarged by human industry. In some places, gently sloping channels called foggaras run below the surface, collecting ground water that flows to a central oasis. In other places, artesian wells are used to irrigate date palms and other crops that grow in the shade they provide. In Egypt, only one percent of all water enters the domestic supply. The remainder is used to irrigate farm crops."}],"groups":[{"a":1,"b":4,"k":"gap","instr":["Answer the questions below.","Choose NO MORE THAN THREE WORDS from the text for each answer."],"items":[{"n":1,"t":"Where do some people in the Sahara live?","opts":[]},{"n":2,"t":"What sources of water have people developed?","opts":[]},{"n":3,"t":"What do people use for irrigation in the Sahara?","opts":[]},{"n":4,"t":"How much of the water in Egypt is supplied to people’s homes?","opts":[]}],"opts":[],"ctx":[]}],"ans":{"1":{"v":"(in) permanent settlements","ex":"Part of the passage: two-thirds of the sparse population live in permanent settlements Explanation: الكلمة المفتاحية live موجودة بنفسها في القطعة، وبعدها مباشرة الجواب."},"2":{"v":"oases","ex":"Part of the passage: many of the oases that provide natural supplies of water have been enlarged by human industry Explanation: sources of water = natural supplies of water (مرادف). اللي طوّرها الإنسان هي الواحات.","alts":["the oases","oasis"]},"3":{"v":"artesian wells","ex":"Part of the passage: artesian wells are used to irrigate date palms Explanation: irrigation في السؤال = irrigate في القطعة (نفس الكلمة بشكل ثاني)."},"4":{"v":"(only) one percent","ex":"Part of the passage: In Egypt, only one percent of all water enters the domestic supply Explanation: people’s homes = domestic supply.","alts":["1 percent","1%","one per cent","only 1%","only 1 percent"]}},"words":[{"w":"ingenious","pos":"adj","def":"something cleverly and originally invented and well suited to its purpose","ex":"Oman Electric Company has found ingenious ways of saving energy.","ar":"مبتكر / ذكي","lvl":""},{"w":"scarce","pos":"adj","def":"insufficient for the demand, difficult to find or occurring in limited quantities","ex":"The floods damaged the crops, so food is becoming scarce.","ar":"نادر / شحيح","lvl":""},{"w":"sparse","pos":"adj","def":"only present in small numbers and often spread over a large area","ex":"The population of Masirah island is sparse; there are only about 100 people living there.","ar":"قليل ومتناثر","lvl":""},{"w":"settlement","pos":"n","def":"a place, previously uninhabited, where people establish a community","ex":"Towns are expanded to establish permanent settlements for the homeless.","ar":"مستوطنة / تجمّع سكني","lvl":""},{"w":"oasis","pos":"n","def":"a fertile area in a desert where water is found","ex":"In the Libyan desert, people get water from a nearby oasis.","ar":"واحة (الجمع oases)","lvl":""},{"w":"irrigate","pos":"v","def":"to supply water to land or crops, typically by means of channels","ex":"Canals are constructed to irrigate farm crops.","ar":"يروي (الأرض أو الزرع)","lvl":""},{"w":"domestic","pos":"adj","def":"for use in the home rather than in an industrial environment","ex":"The company manufactured home appliances for domestic use.","ar":"منزلي","lvl":""},{"w":"remainder","pos":"n","def":"a part of something that is left over when other parts have been used","ex":"Most employees work in Muscat; the remainder is in Sohar.","ar":"الباقي / البقية","lvl":""},{"w":"conserve","pos":"v","def":"to protect something from harm or loss; to use it carefully","ex":"People have devised methods for conserving water.","ar":"يحافظ على / يوفّر","lvl":""}],"n":2,"untitled":false,"pp":1},{"key":"u2","kind":"unit","no":2,"title":"UNICEF, Malnutrition and Micronutrients","intro":null,"u":{"en":"Multiple Choice","ar":"الاختيار من متعدد","color":"--sun","icon":"list","focus":"Answering multiple-choice questions","info_en":["This question type tests your ability to understand main ideas, specific information, or details in a passage.","There are two parts: the stem and the choices/options. The stem may be a complete question or the start of a sentence.","You choose one answer out of four options, two out of five, or three out of six.","The questions follow the order of information in the passage."],"info_ar":["السؤال له جزئين: الـ stem (السؤال أو بداية الجملة) والخيارات.","أحيانًا تختارين جواب واحد من ٤، وأحيانًا جوابين من ٥ أو ثلاثة من ٦. اقرئي التعليمات زين.","الأسئلة بنفس ترتيب القطعة.","الفخ المعتاد: خيار فيه نفس كلمات القطعة بس المعنى غلط. دوّري المعنى مو الكلمة."],"steps":[["Save time by reading only the stem of the question.","وفّري وقت: اقرئي الـ stem بس أول شي، لا تقرين الخيارات."],["Underline the keyword/s in the stem.","حطي خط تحت الكلمة المفتاحية في السؤال."],["Scan the passage, looking for the keywords.","امسحي القطعة تدوّرين الكلمة المفتاحية."],["Once you have found the keyword/s, carefully read the sentence/s containing them.","لما تلقينها، اقرئي الجملة اللي فيها بتركيز."],["Go back to the question, read the choices, and then choose the correct answer.","ارجعي للخيارات واختاري."]],"tip":"The Reading Test: survey the passage (2 min), analyse the questions (3 min), skim and underline (5 min), then answer.","warm":[{"k":"order","q":"Exercise 2: Put the questions in the same order as the information in the paragraph.","text":"The key to good communication is to pay attention to what other people have to say. Good communicators are not those who like the sound of their own voice. Communication is all about establishing a rapport with your colleagues, boss, or customers. The ability to sell is the ultimate test of communication skills; but in the modern world of sales, salesmen do not sell. Customers choose to buy. You must empathize with the customer and build a relationship. Listening to the information you are given and asking the right questions are very important. Not listening costs money in the hard world of sales. The ability to listen is as important on the top floor as it is on the shop floor. If you ask what makes a good manager, people almost always say “they listen to what we have to say and consider our needs.”","items":["What is good communication?","How important are communication skills in sales?","What is good management?"],"why":"أول ثلاث جمل عن التواصل الجيد، بعدين المبيعات، وآخر جملة عن المدير."},{"k":"choose","q":"How many answers do you choose when the instructions say “Choose THREE of the six options”?","opts":["One","Two","Three"],"a":2,"why":"لازم تختارين العدد المطلوب بالضبط."},{"k":"choose","q":"What should you read FIRST in a multiple-choice question?","opts":["All four options","Only the stem of the question","The whole passage carefully"],"a":1,"why":"الخطوة الأولى: اقرئي الـ stem بس عشان توفّرين وقت."}],"no":2},"paras":[{"L":"","t":"UNICEF has continued to be at the forefront of advocacy and support for the implementation of programmes to combat child malnutrition. A condition for designing effective programmes to fight malnutrition is understanding the causes of the problems and recognizing how complex they are."},{"L":"","t":"IODINE: Some of the most rapid and important progress in UNICEF programmes is in salt iodisation. The strategy of universal salt iodisation (USI) has been widely accepted in all regions, and the goal of USI by the end of 2015 was met in Latin America and in many countries in other regions. During that year, several countries with a high prevalence of iodine deficiency in which salt iodisation was previously thought to be impossible, such as Pakistan and Indonesia, started to iodise at least half of all salt reaching consumers. To achieve this, UNICEF offices supported a range of innovative and flexible approaches, for example the establishment of an “Iodised Salt Support Facility” in Pakistan, to provide training, supplies and quality control to the salt crushers in the country. Enormous progress was seen not only in getting iodine into salt but also in the promulgation of laws to give teeth to monitoring and quality control efforts. A technical monograph on practical ways of monitoring salt iodisation programmes was developed jointly with WHO and ICCIDD."},{"L":"","t":"VITAMIN A: WHO-UNICEF estimates now indicate that over 250 million children still suffer from vitamin A deficiency. The known effects of this on the immune system and thus on child mortality make this a high-priority challenge for UNICEF. In 2015, UNICEF supported surveys of vitamin A status that resulted in widespread deficiency being recognized for the first time in Egypt, Botswana, and South Africa. With support from the Micronutrient Initiative in Canada, UNICEF launched projects in 14 countries that would enable innovation in systems of distribution of vitamin A supplements and improvements in monitoring the mortality of supplementation. Several countries have built on the successful experience of Guatemala in fortification of sugar with vitamin A. UNICEF supports dietary diversification and consumption of appropriate fruit and vegetables as one of the most potentially sustainable ways for communities to overcome micronutrient malnutrition. Research completed in 2015 with UNICEF assistance pointed to the need to pay further attention to the types of vegetables grown and the type of cooking in order to maximise the impact of home gardening on the vitamin A status of children."},{"L":"","t":"IRON: The statement on strategies for reducing iron deficiency anemia, developed, and adopted by WHO and UNICEF in 2015, called for general supplementation with iron in any population of pregnant women or young children where the prevalence of anemia exceeds 30%. UNICEF supported a meeting, jointly with the Thrasher Research Fund and Cornell University, to explore ways of increasing the micronutrient content of foods commonly consumed in countries where micronutrient malnutrition is common. Plant breeders, soil scientists and human nutritionists met to consider the problem and agreed that the micronutrient content of foods had been neglected in the breeding of high yielding (green revolution) varieties of cereals such as rice. With the realization of the tremendous importance of the micronutrient content of staple food crops to human development, plant breeders agreed that future breeding work should take micronutrient goals into account."}],"groups":[{"a":1,"b":4,"k":"mcq","instr":["Choose A, B, C, or D for each answer."],"items":[{"n":1,"t":"In which country was an “Iodised Salt Support Facility” established?","opts":[{"k":"A","t":"Indonesia"},{"k":"B","t":"Latin America"},{"k":"C","t":"Pakistan"},{"k":"D","t":"Botswana"}]},{"n":2,"t":"Which common food ingredient has had vitamin A added to it?","opts":[{"k":"A","t":"sugar"},{"k":"B","t":"rice flour"},{"k":"C","t":"salt"},{"k":"D","t":"maize meal"}]},{"n":3,"t":"Why does UNICEF support fruit and vegetable consumption and a more varied diet?","opts":[{"k":"A","t":"It is cost-effective."},{"k":"B","t":"It is sustainable."},{"k":"C","t":"It is easily obtainable."},{"k":"D","t":"It is cheaper."}]},{"n":4,"t":"In what aspect of the green revolution was micronutrient content not fully taken into account?","opts":[{"k":"A","t":"development of high-yielding varieties of cereals"},{"k":"B","t":"excessive use of pesticides"},{"k":"C","t":"programmes designed to influence consumer choice"},{"k":"D","t":"application of chemical fertilisers"}]}],"opts":[],"ctx":[]}],"ans":{"1":{"v":"C","ex":"Part of the passage: the establishment of an “Iodised Salt Support Facility” in Pakistan Explanation: الاسم بين علامات تنصيص، امسحي القطعة عليه بسرعة وبتلقينه في فقرة IODINE."},"2":{"v":"A","ex":"Part of the passage: Several countries have built on the successful experience of Guatemala in fortification of sugar with vitamin A. Explanation: added to it = fortification (تدعيم). الملح انضاف له يود مو فيتامين A، وهذا فخ."},"3":{"v":"B","ex":"Part of the passage: UNICEF supports dietary diversification and consumption of appropriate fruit and vegetables as one of the most potentially sustainable ways Explanation: a more varied diet = dietary diversification، والسبب المذكور: sustainable."},"4":{"v":"A","ex":"Part of the passage: the micronutrient content of foods had been neglected in the breeding of high yielding (green revolution) varieties of cereals such as rice Explanation: not fully taken into account = neglected."}},"words":[{"w":"forefront","pos":"n","def":"the leading or most important position","ex":"The WHO has continued to be at the forefront of finding effective vaccination protection.","ar":"الصدارة / الطليعة","lvl":""},{"w":"prevalence","pos":"n","def":"the fact that something is widespread and occurs commonly","ex":"Most Western countries have recorded a high prevalence of obesity in adolescents.","ar":"انتشار","lvl":""},{"w":"innovative","pos":"adj","def":"new and advanced","ex":"Health sectors have supported a range of innovative approaches to improve primary health care.","ar":"مبتكَر","lvl":""},{"w":"launch","pos":"v","def":"to start an important activity or make something available to the public","ex":"UNICEF must launch projects that will overcome malnutrition among children.","ar":"يُطلق / يبدأ","lvl":""},{"w":"fortification","pos":"n","def":"the process of adding something to make it stronger","ex":"Experts support the fortification of sugar with vitamin A.","ar":"تدعيم / تقوية (الطعام بالفيتامينات)","lvl":""},{"w":"diversification","pos":"n","def":"the process of increasing the variety of something","ex":"Governments introduced the diversification of high-yielding varieties of rice.","ar":"تنويع","lvl":""},{"w":"sustainable","pos":"adj","def":"able to be maintained for a long period of time","ex":"Exercise and a healthy diet are sustainable ways to maintain good health.","ar":"مستدام","lvl":""},{"w":"impact","pos":"n","def":"an effect or influence","ex":"Regular exercise has a positive impact on physical and psychological health.","ar":"أثر / تأثير","lvl":""},{"w":"explore","pos":"v","def":"to inquire into or discuss in detail","ex":"We need to explore all possible cures for the disease.","ar":"يستكشف / يبحث في","lvl":""},{"w":"breeding","pos":"n","def":"producing or developing new plants or animals","ex":"Micronutrients had been neglected in the breeding of cereals.","ar":"تهجين / استيلاد (النباتات والحيوانات)","lvl":""}],"n":3,"untitled":false,"pp":1},{"key":"u3","kind":"unit","no":3,"title":"The Trouble with Fries","intro":null,"u":{"en":"Matching Paragraph Headings","ar":"مطابقة عناوين الفقرات","color":"--mint","icon":"heading","focus":"Matching headings","info_en":["This type of question needs skimming skill and tests understanding of text organization and the main idea of each paragraph.","You will be given a numbered list of headings (i, ii, iii...). The headings are short phrases or statements which summarise a paragraph.","Paragraph = main idea (topic sentence) and writer’s focus, followed by supporting ideas/details.","There are more headings than paragraphs, and only one heading fits one paragraph."],"info_ar":["هنا يختبرون فهمك للفكرة الرئيسية لكل فقرة، مو التفاصيل.","العناوين أرقامها رومانية: i, ii, iii, iv, v...","دايمًا فيه عناوين زيادة عن الفقرات، يعني بيبقى عنوان أو أكثر ما يستخدم.","الأسئلة هنا ما تمشي بترتيب القطعة.","فخ مشهور: عنوان فيه كلمة موجودة في الفقرة بس هي تفصيلة صغيرة مو الفكرة الرئيسية."],"steps":[["Read the list of headings and underline the keyword/s in each heading.","اقرئي قائمة العناوين وحطي خط تحت الكلمة المفتاحية في كل عنوان."],["Skim the whole passage to get a general idea of what it is about.","اقرئي القطعة كلها بسرعة عشان تعرفين موضوعها."],["Underline the main idea and key vocabulary in each paragraph. Ignore words you do not understand.","حددي الفكرة الرئيسية لكل فقرة، وتجاهلي الكلمات اللي ما تعرفينها."],["Concentrate only on the paragraphs referred to. Select the heading that best describes the main idea.","ركّزي على الفقرات المطلوبة بس، واختاري العنوان اللي يوصف الفكرة الرئيسية."],["Usually there is an example. Remember: only one heading fits one paragraph.","غالبًا فيه مثال محلول، شيلي عنوانه من القائمة."]],"tip":"The questions for matching headings do not follow the order of information in the passage. Your knowledge of main ideas will help you.","warm":[{"k":"choose","q":"Paragraph A: “The family has often been regarded as the cornerstone of the society. In premodern and modern societies alike, it has been seen as the most basic unit of social organization and one which carries out vital tasks such as socializing children.” What is the topic of the paragraph?","opts":["Children","The family","Modern societies"],"a":1,"why":"الموضوع = The family، والكاتب يشوفها أساس المجتمع (cornerstone)."},{"k":"choose","q":"Does Paragraph A become more specific or more general?","opts":["More specific","More general"],"a":0,"why":"تبدأ بفكرة عامة (cornerstone) وبعدين تفاصيل (socializing children)."},{"k":"choose","q":"Paragraph C: “To have a society that is family-friendly, anti-discrimination laws will need to be introduced… In a world like this, there would be less divorce and crime, but we would be earning and producing less.” What does this paragraph do?","opts":["gives information or a description","develops an argument","states cause and effect"],"a":2,"why":"لو صار كذا ← بيصير كذا: سبب ونتيجة."},{"k":"type","q":"Exercise 3: Write a heading for this paragraph: “Nicholson defines the traditional family as the unit of parents and children who live together. The bond between husband and wife is seen as particularly important, and the family feels itself to be separate from other relatives. This family is often referred to as the nuclear family.”","a":["the traditional family","the nuclear family","traditional family","nuclear family"],"why":"العنوان: The traditional family (The nuclear family)."}],"no":3},"paras":[{"L":"A","t":"In 1954, a man named Ray Kroc, who made his living selling milkshake machines, began hearing about a restaurant that had no fewer than eight of his machines in operation, meaning that it could make forty shakes simultaneously. Kroc was astounded. He flew from Chicago to Los Angeles, and drove to San Bernardino, where he found a small octagonal building on a corner lot. He sat in his car and watched as the workers showed up for the morning shift. As lunchtime approached, customers began streaming into the parking lot, lining up for bags of hamburgers. Kroc approached a blonde in a convertible. \"How often do you come here?\" he asked."},{"L":"B","t":"\"Anytime I am in the neighborhood,\" she replied, and Kroc would say later, \"it was not her appeal but the obvious relish with which she devoured the hamburger that made my pulse begin to hammer with excitement.\" He came back the next morning, and this time set up inside the kitchen, watching the griddle man, the food preparers, and, above all, the French fry operation, because it was the French fries that captured his imagination. They were made from top-quality Idaho potatoes, deep-fried to a golden brown, and salted with a shaker. They were crispy on the outside and buttery soft on the inside, and that day Kroc had a vision of a chain of restaurants selling golden fries from one end of the country to the other. He asked the two brothers who owned the hamburger stand if he could buy their franchise rights. They said yes. Their names were Mac and Dick McDonald."},{"L":"C","t":"Ray Kroc was the great visionary of American fast food, the one who brought the lessons of the manufacturing world to the restaurant business. Before the fifties, it was impossible to buy fries of consistent quality. Ray Kroc was the man who changed that. \"The French fry,\" he once wrote, \"would become almost sacrosanct for me, its preparation a ritual to be followed religiously.\" A potato that has too great a percentage of water will come out soggy at the end of the frying process. It was Kroc who sent out field men, armed with hydrometers, to make sure that all his suppliers were producing potatoes in the optimal solids range of twenty to twenty-three per cent. Freshly harvested potatoes, furthermore, are rich in sugars, and if you slice them up and deep-fry them without curing, the sugars will caramelize and brown the outside of the fry long before the inside is cooked."},{"L":"D","t":"Perhaps his most enduring achievement, though, was the so-called potato computer, developed for McDonald’s by a former electrical engineer, which precisely calibrated the optimal cooking time for a batch of fries. (The key: when a batch of cold raw potatoes is dumped into a vat of cooking oil, the temperature of the fat will drop and then slowly rise. Once the oil has risen three degrees, the fries are ready.) Previously, making high-quality French fries had been an art. The potato computer, the hydrometer, and the curing bins made it a science. By the time Kroc was finished, he had figured out how to turn potatoes into an inexpensive snack that would always be hot, salty, flavorful, and crispy, no matter where or when you bought it."},{"L":"E","t":"This was the first fast-food revolution, the mass production of food that had reliable mass appeal. But today, as the McDonald’s franchise approaches its fiftieth anniversary, it is clear that fast food needs a second revolution; as many Americans now die every year from obesity-related illnesses – heart disease and complications of diabetes – as from smoking, and the fast-food toll grows heavier every year. In the fine new book \"Fast Food Nation,\" the journalist Eric Schlosser writes of McDonald’s and Burger King in the tone usually reserved for chemical companies, sweatshops, and arms dealers, and, as shocking as that seems at first, it is perfectly appropriate. Ray Kroc’s French fries are killing us. Can fast food be fixed?"}],"groups":[{"a":1,"b":3,"k":"head","instr":["The passage has five paragraphs, A–E. Choose the correct headings for paragraphs B–D from the list of headings below.","Note: There are more headings than paragraphs."],"items":[{"n":1,"t":"Paragraph B","opts":[]},{"n":2,"t":"Paragraph C","opts":[]},{"n":3,"t":"Paragraph D","opts":[]}],"opts":[{"k":"i","t":"Fries fever"},{"k":"ii","t":"A creative businessman"},{"k":"iii","t":"Restaurant and customers"},{"k":"iv","t":"A closed deal"},{"k":"v","t":"The contribution of science to snacks"}],"ctx":[]}],"ans":{"1":{"v":"iv","ex":"Part of the passage: He asked the two brothers who owned the hamburger stand if he could buy their franchise rights. They said yes. Explanation: آخر جمل الفقرة B: طلب يشتري حقوق الامتياز ووافقوا = صفقة انقفلت (A closed deal). «Fries fever» فخ لأن البطاطس تفصيلة."},"2":{"v":"ii","ex":"Part of the passage: Ray Kroc was the great visionary of American fast food, the one who brought the lessons of the manufacturing world to the restaurant business. Explanation: أول جملة (topic sentence): visionary = شخص مبدع يشوف المستقبل = A creative businessman."},"3":{"v":"v","ex":"Part of the passage: The potato computer, the hydrometer, and the curing bins made it a science. Explanation: الفقرة D عن potato computer اللي حوّل القلي من فن إلى علم = The contribution of science to snacks."}},"words":[{"w":"crispy","pos":"adj","def":"food that is pleasingly crunchy","ex":"Customers often ask for extra crispy onion with their chicken biryani.","ar":"مقرمش","lvl":""},{"w":"obesity","pos":"n","def":"the condition of being heavily overweight","ex":"Obesity can cause hypertension and cardiovascular problems.","ar":"السمنة","lvl":""},{"w":"approach","pos":"v","def":"to come near to someone or something","ex":"A police officer approached the motorist after the car accident.","ar":"يقترب من","lvl":""},{"w":"enduring","pos":"adj","def":"continuing or lasting for a long time","ex":"The legacy of an effective president is enduring.","ar":"دائم / باقٍ","lvl":""},{"w":"devour","pos":"v","def":"to eat something hungrily or quickly","ex":"The hungry boy devoured half of his burger in one bite.","ar":"يلتهم","lvl":""},{"w":"simultaneously","pos":"adv","def":"happening at the same time as something else","ex":"Different sporting events were held simultaneously during the Olympics.","ar":"في نفس الوقت","lvl":""},{"w":"franchise","pos":"n","def":"permission given to a person or group to sell a company’s products or use its name","ex":"He asked the brothers if he could buy their franchise rights.","ar":"امتياز تجاري (فرنشايز)","lvl":""},{"w":"visionary","pos":"n","def":"a creative person who thinks ahead to the future","ex":"A good president is a visionary who brings progress to the whole nation.","ar":"صاحب رؤية","lvl":""},{"w":"sacrosanct","pos":"adj","def":"treated with great honour and respect; must not be changed","ex":"The French fry would become almost sacrosanct for me.","ar":"مقدّس / لا يُمس","lvl":""},{"w":"caramelize","pos":"v","def":"to turn sugar in food brown and sweet by heating it","ex":"Caramelized onions make the dish sweeter.","ar":"يتكرمل","lvl":""}],"n":4,"untitled":false,"pp":1},{"key":"u4","kind":"unit","no":4,"title":"The Importance of Family in Modern Society","intro":null,"u":{"en":"True, False, Not Given","ar":"صح / خطأ / غير مذكور","color":"--skyc","icon":"check","focus":"Identifying information","info_en":["This question type tests if you can identify whether statements about the facts in the passage are correct or not.","Do not use your own knowledge: the answers must be from the passage.","In each statement there is a TOPIC and an IDEA. Identify them when you analyse the question.","TRUE = the passage confirms the statement. FALSE = the passage says the opposite. NOT GIVEN = the writer gives no information.","Write the answer in full (True, not T) and spell it correctly. The questions follow the order of the passage."],"info_ar":["لا تجاوبين من معلوماتك العامة. الحكم على القطعة بس.","كل جملة فيها موضوع (topic) وفكرة (idea).","TRUE: القطعة تقول نفس المعنى. FALSE: القطعة تقول العكس.","NOT GIVEN له ٣ حالات: الموضوع موجود بس الفكرة مو مذكورة، أو الفكرة موجودة بس مو عن نفس الموضوع، أو ما فيه شي عن الاثنين.","True/False للحقائق، وYes/No لآراء الكاتب. لا تخلطين بينهم، واكتبي الكلمة كاملة."],"steps":[["Read the topic and the idea in the question carefully.","اقرئي الموضوع والفكرة في الجملة بتركيز."],["Underline the keyword/s in the question.","حطي خط تحت الكلمات المفتاحية."],["Skim the passage to locate the part where the writer presents the topic and idea.","دوّري المكان اللي يتكلم فيه الكاتب عن نفس الموضوع."],["Decide whether the idea is the same or the opposite. If you cannot find any information, the answer may be NOT GIVEN. Check this carefully.","نفس المعنى ← TRUE، عكسه ← FALSE، ما لقيتي ← NOT GIVEN. تأكدي زين قبل."]],"tip":"True – False = factual detail questions. Yes – No = opinion questions.","warm":[{"k":"choose","q":"Exercise 1: A student wrote “T” for a TRUE answer. Is the form correct?","opts":["Yes, T is fine","No, it must be the full word: True"],"a":1,"why":"لازم تكتبين الكلمة كاملة: True."},{"k":"choose","q":"A student wrote “No information” for a NOT GIVEN answer. Is the form correct?","opts":["Yes","No, it should be: Not Given"],"a":1,"why":"الصيغة الصحيحة Not Given."},{"k":"choose","q":"The instruction says TRUE / FALSE / NOT GIVEN. A student wrote “Yes”. Is the form correct?","opts":["Yes","No, it should be True"],"a":1,"why":"Yes/No لأسئلة الرأي بس. هنا لازم True."},{"k":"choose","q":"Exercise 2: Text: “I am very happy today. I have had a great lunch after teaching my favourite class.” Statement: “The teacher has eaten.”","opts":["TRUE","FALSE","NOT GIVEN"],"a":0,"why":"have had a great lunch = has eaten."},{"k":"choose","q":"Same text. Statement: “The teacher had some fruit.”","opts":["TRUE","FALSE","NOT GIVEN"],"a":2,"why":"الموضوع (الأستاذة) موجود، لكن الفكرة (الفواكه) مو مذكورة ← NOT GIVEN."}],"no":4},"paras":[{"L":"","t":"The community benefits when the family relieves it of the burden of supporting members of that family. Healthy families produce people who make positive contributions to the community. Parents tend to get involved with their community more often than people living alone. What’s more, they teach their children at a young age that the only way they can control what kind of community they live in is to contribute to it. When parents contribute to their community by donating money or other support, they model an attitude of caring. They show their children that providing money, food, or supplies to the community helps support it so it can serve everyone better. Parents can contribute to society by working to ensure that their family gets the best possible educational opportunities. They may donate funds or use their social network to help a college-age student find a job. Their emotional and practical help might be even more important than financial support."}],"groups":[{"a":1,"b":5,"k":"tf","instr":["Do the following statements agree with the information given in the passage?","Write TRUE if the statement agrees with the information, FALSE if the statement contradicts the information, NOT GIVEN if there is no information on this."],"items":[{"n":1,"t":"Society gains from responsible families.","opts":[]},{"n":2,"t":"Parents tend to detach themselves from community responsibility.","opts":[]},{"n":3,"t":"It is the private organisation that educates all people of every generation.","opts":[]},{"n":4,"t":"Parents can serve as a role model for their children.","opts":[]},{"n":5,"t":"Families can provide spiritual guidance to the community.","opts":[]}],"opts":[],"ctx":[]}],"ans":{"1":{"v":"T","ex":"Part of the passage: The community benefits when the family relieves it of the burden of supporting members of that family. Explanation: gains = benefits، و society = community."},"2":{"v":"F","ex":"Part of the passage: Parents tend to get involved with their community more often than people living alone. Explanation: القطعة تقول العكس: الأهل يشاركون (involved) مو ينعزلون (detach)."},"3":{"v":"NG","ex":"Explanation: ما فيه أي ذكر للمؤسسات الخاصة (private organisation)."},"4":{"v":"T","ex":"Part of the passage: When parents contribute to their community by donating money or other support, they model an attitude of caring. Explanation: model an attitude = serve as a role model."},"5":{"v":"NG","ex":"Explanation: ما فيه ذكر للإرشاد الروحي (spiritual guidance). القطعة تذكر دعم عاطفي وعملي ومالي بس."}},"words":[{"w":"benefit","pos":"v","def":"to receive help or an advantage from something","ex":"Protection from the virus is one benefit of vaccination.","ar":"يستفيد","lvl":""},{"w":"relieve","pos":"v","def":"to make pain or a problem less severe","ex":"Doctors prescribe medicines to relieve the physical suffering of patients.","ar":"يخفّف","lvl":""},{"w":"financial","pos":"adj","def":"relating to money","ex":"Their emotional help might be more important than financial support.","ar":"مالي","lvl":""},{"w":"ensure","pos":"v","def":"to make certain that something will happen","ex":"To ensure that they are protected, people need to follow health protocols.","ar":"يضمن / يتأكد","lvl":""},{"w":"involve","pos":"v","def":"to make someone part of an activity","ex":"Parents tend to get involved with their community.","ar":"يُشرك / يشارك","lvl":""},{"w":"model","pos":"v","def":"to serve as an example of behaviour","ex":"Parents should model appropriate behaviour to their children.","ar":"يكون قدوة / يقدّم نموذجًا","lvl":""},{"w":"burden","pos":"n","def":"a heavy load or responsibility","ex":"The family relieves the community of the burden of supporting its members.","ar":"عبء","lvl":""},{"w":"opportunity","pos":"n","def":"a chance to do something","ex":"We have to grab every golden opportunity given to us.","ar":"فرصة","lvl":""},{"w":"contribute","pos":"v","def":"to give money, help or ideas to something","ex":"Parents can contribute to society in many ways.","ar":"يساهم","lvl":""}],"n":5,"untitled":false,"pp":1},{"key":"u5","kind":"unit","no":5,"title":"Population and Environment: A Global Challenge","intro":null,"u":{"en":"Yes, No, Not Given","ar":"نعم / لا / غير مذكور","color":"--coral","icon":"quote","focus":"Identifying writers’ views","info_en":["This type of question tests understanding of the writer’s opinion.","The questions are statements, all of which express an opinion.","YES = the writer expresses the opinion. NO = the writer contradicts it. NOT GIVEN = it is impossible to know what the writer thinks.","Each answer must be written in full, not abbreviated."],"info_ar":["هنا السؤال عن رأي الكاتب أو ادعاءاته (claims)، مو الحقائق.","YES: الكاتب يقول نفس الرأي. NO: الكاتب يقول عكسه. NOT GIVEN: ما نعرف وش رأيه.","انتبهي للكلمات الصغيرة اللي تغيّر المعنى: only, all, further, partly, particularly.","استخدمي الكلمات المفتاحية عشان تلقين المكان في القطعة."],"steps":[["Read the first question and focus on the topic and the idea.","اقرئي أول جملة وركّزي على الموضوع والفكرة."],["Underline the keyword/s in the question.","حطي خط تحت الكلمات المفتاحية."],["Skim the passage and locate the part where the writer mentions the topic and idea.","دوّري وين الكاتب تكلم عن نفس الموضوع."],["Decide whether the idea is the same or the opposite.","قرري: نفس الرأي ولا عكسه؟"],["If you cannot find any information, the answer may be NOT GIVEN. Check this carefully.","ما لقيتي شي؟ احتمال NOT GIVEN، تأكدي."],["Continue with the remaining questions.","كمّلي باقي الأسئلة بالترتيب."]],"tip":"YES, NO, NOT GIVEN questions refer to information in the reading passage. Use keywords to help you find the correct answers.","warm":[{"k":"sort","q":"Exercise 1: Fact or opinion?","cats":["Fact","Opinion"],"items":[["Oman Air has the best airport services.",1],["Dubai International Airport serves international destinations.",0],["Qatar Airways has won a prize for the “Best First-Class Service”.",0]],"why":"«الأفضل» رأي ما عليه دليل. الفوز بجائزة حقيقة."},{"k":"choose","q":"Exercise 2: “Since then, controls on outbound travel have been relaxed further, partly through the simplification of passports and visa applications, which has helped the demand for independent travel, particularly among young people.” Statement: “There is more than one way in which controls have been relaxed.” Which word gives the answer YES?","opts":["further","partly","particularly"],"a":1,"why":"partly = جزئيًا، يعني فيه طرق ثانية بعد."},{"k":"choose","q":"Same sentence. Statement: “Young people are the only group that want to travel independently.” Answer: NO. Which word decides it?","opts":["further","partly","particularly"],"a":2,"why":"particularly = خصوصًا، مو «فقط». فالشباب مو المجموعة الوحيدة."}],"no":5},"paras":[{"L":"","t":"We humans are remarkable creatures. From our humble beginnings in small pockets of Africa, we have evolved over millennia to colonise almost every corner of our planet. We are clever and resilient."},{"L":"","t":"In 2015 the world population was more than 7.3 billion people. That’s more than seven billion, three hundred million bodies that need to be fed, clothed, kept warm and ideally, nurtured and educated. More than 7.3 billion individuals who, while busy consuming resources, are also producing vast quantities of waste, and our numbers continue to grow. The United Nations estimates that the world population will reach 9.2 billion by 2050."}],"groups":[{"a":1,"b":4,"k":"yn","instr":["Do the following statements agree with the claims of the writer in the passage?","Write YES if the statement agrees with the claims of the writer, NO if the statement contradicts the claims of the writer, NOT GIVEN if it is impossible to say what the writer thinks about this."],"items":[{"n":1,"t":"Humans are intelligent beings.","opts":[]},{"n":2,"t":"The world population in 2015 was less than seven billion.","opts":[]},{"n":3,"t":"Huge amounts of garbage are produced by the growing population.","opts":[]},{"n":4,"t":"The United Nations encourage recycling to address the earth’s environmental problems.","opts":[]}],"opts":[],"ctx":[]}],"ans":{"1":{"v":"Y","ex":"Part of the passage: We are clever and resilient. Explanation: intelligent = clever، والكاتب يقولها كرأي."},"2":{"v":"N","ex":"Part of the passage: In 2015 the world population was more than 7.3 billion people. Explanation: الكاتب يقول أكثر من ٧٫٣ مليار، يعني عكس «أقل من سبعة»."},"3":{"v":"Y","ex":"Part of the passage: while busy consuming resources, are also producing vast quantities of waste Explanation: huge amounts of garbage = vast quantities of waste."},"4":{"v":"NG","ex":"Explanation: الأمم المتحدة مذكورة بس عن توقع عدد السكان، ما فيه شي عن إعادة التدوير."}},"words":[{"w":"estimate","pos":"v","def":"to roughly calculate the value or number of something","ex":"One way to budget is to estimate the cost of a product.","ar":"يقدّر (تقريبًا)","lvl":""},{"w":"remarkable","pos":"adj","def":"unusual, exceptional, or striking","ex":"Because of her remarkable achievements, she has been awarded a scholarship.","ar":"مميز / لافت","lvl":""},{"w":"vast","pos":"adj","def":"of very great extent or quantity","ex":"Oman has vast desert areas, stretching for hundreds of kilometers.","ar":"هائل / شاسع","lvl":""},{"w":"evolve","pos":"v","def":"to develop gradually from a simple to a more complex form","ex":"We have evolved over millennia to colonise almost every corner of our planet.","ar":"يتطوّر","lvl":""},{"w":"consume","pos":"v","def":"to use up resources such as food, fuel or energy","ex":"People are busy consuming resources.","ar":"يستهلك","lvl":""},{"w":"colonise","pos":"v","def":"to settle in and establish control over an area","ex":"The Spaniards were the first Europeans to colonise large areas of the Philippines.","ar":"يستعمر / يستوطن","lvl":""},{"w":"resilient","pos":"adj","def":"able to recover quickly from difficult conditions","ex":"He is truly resilient; he can easily overcome challenges.","ar":"صامد / سريع التعافي","lvl":""},{"w":"population","pos":"n","def":"the number of people living in a place","ex":"The world population will reach 9.2 billion by 2050.","ar":"عدد السكان","lvl":""}],"n":6,"untitled":false,"pp":1},{"key":"u6","kind":"unit","no":6,"title":"The Rise of Fake News","intro":null,"u":{"en":"Summary Completion","ar":"إكمال الملخّص","color":"--sun","icon":"doc","focus":"Completing summaries","info_en":["This type of question tests your understanding of the main ideas.","You complete the summary by writing no more than three words and/or a number from the passage in each space.","Use only words from the passage, spelt exactly as they are in the passage.","Type 1: complete with a certain number of words from the passage. Type 2: choose from a box of possible answers.","Before looking for the words, note grammatical clues (articles, prepositions) and decide: noun, verb or adjective?"],"info_ar":["الملخّص يعيد صياغة جزء من القطعة، وأنتِ تعبين الفراغات بكلمات من القطعة نفسها وبنفس التهجئة.","نوعين: تكتبين كلمات من القطعة، أو تختارين من صندوق كلمات.","قبل ما تدوّرين، شوفي اللي قبل الفراغ واللي بعده: a/an/the ← اسم، to ← فعل، is/very ← صفة.","الرقم ينحسب كلمة، والكلمة اللي فيها شَرطة كلمة وحدة. وانتبهي: & تنحسب كلمة."],"steps":[["Read through the incomplete summary to have an idea of what it is about.","اقرئي الملخّص كامل عشان تعرفين عن ايش."],["Underline the keywords in the summary.","حطي خط تحت الكلمات المفتاحية."],["Read the words around each gap to decide on the grammar form needed.","شوفي حول كل فراغ: وش نوع الكلمة المطلوبة؟"],["Check the instructions: the maximum number of words or numbers.","تأكدي من عدد الكلمات المسموح."],["Skim the passage and focus on the part being tested.","حددي الجزء من القطعة اللي يغطيه الملخّص."],["Scan for the answers using the keywords.","امسحي القطعة بالكلمات المفتاحية."],["Reread the summary to check your answers, both grammatically and in meaning.","اقرئي الملخّص مرة ثانية: الجملة صحيحة قواعديًا وتعطي معنى؟"]],"tip":"Summary completion questions follow the order of information. Sequence words such as first, next, another and finally will help you.","warm":[{"k":"sort","q":"Exercise 1: Grammar review. Is each word a noun, a verb or an adjective (in its most common use)?","cats":["Noun","Verb","Adjective"],"items":[["teachers",0],["journeys",0],["opportunities",0],["growth",0],["employ",1],["enjoy",1],["climb",1],["consistent",2],["environmental",2],["harmful",2]],"why":"بعض الكلمات تقدر تكون أكثر من نوع (impact, use, thought). والاسم أحيانًا يشتغل كصفة: job opportunities."},{"k":"choose","q":"Exercise 2: “Every day millions of people (1) ____ into their cars and set off on (2) ____ to work…” What type of word is needed in gap 2?","opts":["verb","noun","adjective"],"a":1,"why":"بعد set off on نحتاج اسم: journeys."},{"k":"choose","q":"“…few of them are inclined to spare a thought for the (4) ____ impacts of driving.” Which word from the box fits?","opts":["environmental","enjoy","cars"],"a":0,"why":"بين the واسم impacts نحتاج صفة: environmental."},{"k":"choose","q":"Exercise 3: The instructions say NO MORE THAN THREE WORDS. Which student answer is wrong?","opts":["form of CO2","for manufacturing & service","non-essential cars","0.5 % growth"],"a":1,"why":"for / manufacturing / & / service = أربع كلمات. والرمز & ينحسب كلمة."}],"no":6},"paras":[{"L":"","t":"The story about Hillary Clinton is one of the most famous examples of the growing phenomenon dubbed ‘fake news’. The conspiracy theory about the pizzeria began to appear on websites and social networks in late October before the US election. This was quickly denounced by publications, such as The New York Times and The Washington Post. However, many people thought that these papers were themselves lying for political ends and instead of disappearing, the fake story snowballed. Tweets from ‘Representative Steven Smith of the 15th District of Georgia’ claimed that the mainstream media were telling falsehoods. Even though both this name and district were invented, the message was re-tweeted many times. A YouTube refutation of the New York Times article got 250,000 hits."},{"L":"","t":"Fake news stories can be hard to control for several reasons. Many people mistrust established news sources and others just don’t read them, so the debunking of a fake story by a serious newspaper or TV channel has limited effect. In addition, the Internet is very hard to police. When users are caught misusing one media platform, they simply go to another one or start up a website themselves."},{"L":"","t":"There are also various reasons why people create fake news. Some have political motives, to belittle or incriminate their opponents. Other websites, like The Onion, deliberately publish fake news as satire – humorous comment on society and current affairs. Another group is in it for the profit: many people clicking on entertaining fake news stories can bring in a lot of advertising revenue. One man running fake news sites from Los Angeles said he was making up to US$30,000 a month in this way. There are also those, like the small-town teenagers in Macedonia who wrote fake news stories about Donald Trump, who seem to be motivated partly by money and partly by boredom."},{"L":"","t":"So, what can we do to stop fake news spreading? First, make sure that the websites you read are legitimate, for example by looking carefully at the domain name and the About Us section. Check the sources of any quotes or figures given in the story. Remember that amazing stories about famous people will be covered by the mainstream media if they are true. Only share stories you know are true and let your friends know, tactfully, when they unknowingly share fake news. Together we can turn around the post-truth world!"}],"groups":[{"a":1,"b":4,"k":"gap","instr":["Complete the summary with words from the passage.","Write only ONE WORD for each answer."],"items":[],"opts":[],"ctx":["Managing fake news is not easy due to people’s 1 …… of legal news outlets, disinterest in reading established news and the authorities’ difficulty in policing 2 …… content. Political motives, 3 …… and boredom are the main reasons of fake news proliferation. To stop its spread, people are encouraged to read 4 …… websites, share accurate stories and gently remind friends to do the same."],"mode":"sum"}],"ans":{"1":{"v":"mistrust","ex":"Part of the passage: Many people mistrust established news sources and others just don’t read them Explanation: بعد people’s نحتاج اسم. القطعة فيها mistrust (تُستخدم هنا كاسم بمعنى عدم الثقة)."},"2":{"v":"internet","ex":"Part of the passage: In addition, the Internet is very hard to police. Explanation: policing = police (فعل). ووش اللي صعب مراقبته؟ الإنترنت.","alts":["Internet"]},"3":{"v":"profit","ex":"Part of the passage: Another group is in it for the profit Explanation: الأسباب: سياسية، الربح، الملل. وmoney تنقبل بعد.","alts":["money"]},"4":{"v":"legitimate","ex":"Part of the passage: First, make sure that the websites you read are legitimate Explanation: قبل websites نحتاج صفة: legitimate (شرعية/موثوقة)."}},"words":[{"w":"fake","pos":"adj","def":"not real or genuine","ex":"Fake products are confiscated from the market.","ar":"مزيّف","lvl":""},{"w":"established","pos":"adj","def":"having achieved recognition and wide acceptance","ex":"The Times of Oman is one form of established media.","ar":"معروف ومعترف به","lvl":""},{"w":"debunking","pos":"n","def":"the action of showing that something is false","ex":"The debunking of a fake story by a serious newspaper has limited effect.","ar":"كشف زيف (خبر أو فكرة)","lvl":""},{"w":"police","pos":"v","def":"to control an area or activity and keep order","ex":"The Internet is very hard to police.","ar":"يراقب ويضبط","lvl":""},{"w":"profit","pos":"n","def":"money that you earn from business","ex":"Food businesses gain huge profit from the sales of their products.","ar":"ربح","lvl":""},{"w":"legitimate","pos":"adj","def":"legal, lawful, or real","ex":"Sultan Qaboos University is a legitimate educational institution.","ar":"شرعي / موثوق","lvl":""},{"w":"domain","pos":"n","def":"a website address","ex":"Good internet research entails visiting a credible domain.","ar":"اسم النطاق (عنوان موقع)","lvl":""},{"w":"mainstream","pos":"n","def":"the ideas and media that most people accept or follow","ex":"Amazing stories will be covered by the mainstream media if they are true.","ar":"التيار السائد / الإعلام الرئيسي","lvl":""},{"w":"tactfully","pos":"adv","def":"in a polite and sensitive way","ex":"She refused his offer tactfully, allowing him to keep his pride.","ar":"بلباقة","lvl":""}],"n":7,"untitled":false,"pp":1},{"key":"u7","kind":"unit","no":7,"title":"The Great Ethologist","intro":null,"u":{"en":"Sentence Completion","ar":"إكمال الجُمل","color":"--mint","icon":"doc","focus":"Completing sentences","info_en":["Type 1: sentences (paraphrased or direct) from the passage are completed with words from the passage, spelt correctly.","Check the number of words required. The gap can come at the beginning, in the middle, or at the end of the sentence.","Before you look for the answer, predict the type of word that is missing. The questions follow the order of the passage.","Type 2: choose the correct sentence ending from a box. There will be extra endings that you do not need."],"info_ar":["نوعين: تكمّلين الجملة بكلمات من القطعة، أو تختارين نهاية الجملة من صندوق.","الفراغ ممكن يكون في أول الجملة أو نصها أو آخرها.","توقّعي نوع الكلمة قبل لا تدوّرين: اسم؟ فعل؟ صفة؟","في نوع الصندوق: النهاية الصحيحة لازم تكون صح في المعنى وصح في القواعد مع بداية الجملة. ودايمًا فيه نهايات زيادة."],"steps":[["Read the instructions.","اقرئي التعليمات وعدد الكلمات."],["Note the position of the spaces in the sentences.","لاحظي وين الفراغ في الجملة."],["Decide what kind of word/s is/are needed, noting grammatical clues like articles or prepositions.","حددي نوع الكلمة من اللي قبلها وبعدها."],["Underline the keywords around each gap to find the relevant part of the passage.","استخدمي الكلمات حول الفراغ عشان تلقين المكان."],["Decide which words or numbers should be written.","اختاري الكلمة من القطعة."],["Read the completed sentence to make sure it is grammatically correct and makes sense.","اقرئي الجملة كاملة: صحيحة ومنطقية؟"]],"tip":"Option A “recurrence of domestic violence” cannot complete “The economy can decline because…” – it is grammatically wrong. Grammar helps you remove wrong endings.","warm":[{"k":"choose","q":"Exercise 1: “____ is the next proposed date for the College Entry Level Test.” What type of word is needed?","opts":["noun (a date)","verb","adjective"],"a":0,"why":"الجملة تحتاج فاعل، وهو تاريخ، مثلاً September 10."},{"k":"choose","q":"“The aim of the entrance test is to ____ the academic level of each candidate.”","opts":["noun","verb","adjective"],"a":1,"why":"بعد to يجي فعل: assess / determine."},{"k":"choose","q":"Exercise 2: “The economy of a country can decline because…”","opts":["recurrence of domestic violence.","the prices of basic commodities are not stable."],"a":1,"why":"بعد because نحتاج جملة كاملة (فاعل + فعل). الخيار A غلط قواعديًا."}],"no":7},"paras":[{"L":"1","t":"The study of animal behaviour has always been of great interest to many, and this passion has helped mankind to understand the animal kingdom better. The credit goes to all those great ethologists like Karl von Frisch, Konrad Lorenz, Nikolaas Tinbergen, Ivan Pavlov, Jane Goodall, and many others who paved the way to breaking the conditioned thinking about many aspects related to animal behaviour, mating, communication, and culture. Valerie Jane Morris-Goodall, best known simply as Jane Goodall, is known for her years of living among chimpanzees in Tanzania. This created one of the most trailblazing studies of primates in modern times. Born on April 3, 1934, in London, England, she was interested in animal behavior from an early age. When Jane was about eight, she read the Tarzan and Dr. Dolittle series and, in love with Africa, dreamed of traveling to work with the animals featured in her favorite books."},{"L":"2","t":"Jane was unable to afford college after graduation and instead elected to attend secretarial school in South Kensington, where she perfected her typing, shorthand, and bookkeeping skills. At age 23, she left for Africa to visit a friend, whose family lived on a farm outside Nairobi, Kenya. In March 1957 Jane boarded a ship called the Kenya Castle to visit her friend and her family. There, Jane met famed paleoanthropologist Dr. Louis Seymour Bazett Leakey, who offered her a job and sent her to the Gombe Stream Game Reserve (what is today Gombe Stream National Park) in Tanzania to study wild chimpanzees. Jane continued to work in the field and, with Leakey’s help, began her doctoral program without an undergraduate degree in 1962. Her academic credentials were solidified when she received a Ph.D. in ethology from Cambridge University in 1965."},{"L":"3","t":"It was in July 1960, at the age of 26, when Jane Goodall travelled from England to what is now Tanzania and ventured into the little-known world of wild chimpanzees. Equipped with little more than a notebook, binoculars, and her fascination with wildlife, Jane Goodall braved a realm of unknowns to give the world a remarkable window into humankind’s closest living relatives. Through nearly 60 years of groundbreaking work, Dr. Jane Goodall has not only shown us the urgent need to protect chimpanzees from extinction; she has also redefined species conservation to include the needs of local people and the environment."},{"L":"4","t":"When she entered the forest of Gombe, the world knew very little about chimpanzees, and even less about their unique genetic kinship to humans. She took an unorthodox approach in her field research, immersing herself in their habitat and their lives to experience their complex society as a neighbour rather than a distant observer, and coming to understand them not only as species, but also as individuals with emotions and long-term bonds. Dr. Goodall’s discovery in 1960 that chimpanzees make and use tools is considered one of the greatest achievements of twentieth-century scholarship. She also found that the animals are omnivorous, not vegetarian. Her field research at Gombe transformed our understanding of chimpanzees and redefined the relationship between humans and animals in ways that continue to emanate around the world. Over the years, Goodall was able to correct several misunderstandings about chimpanzees."},{"L":"5","t":"Goodall’s fieldwork led to the publication of numerous articles and books. In the Shadow of Man, her first major work, appeared in 1971. The book, essentially a field study of chimpanzees, effectively bridged the gap between scientific treatise and popular entertainment. She summarized her years of observation in The Chimpanzees of Gombe: Patterns of Behavior (1986). She founded her own organization, the Jane Goodall Institute, to carry forward her pioneering work, as well as its Roots & Shoots programme, which aims to encourage and motivate young people to take action on issues that matter to them in their own communities."},{"L":"6","t":"In recognition of her achievements, the 86-year-old global icon, ethologist and environmentalist has received numerous honors and awards, including the Gold Medal of Conservation from the San Diego Zoological Society in 1974, the J. Paul Getty Wildlife Conservation Prize in 1984, the Schweitzer Medal of the Animal Welfare Institute in 1987, the National Geographic Society Centennial Award in 1988, and the Kyoto Prize in Basic Sciences in 1990. She was named a Messenger of Peace by the United Nations in 2002 and a Dame of the British Empire by Queen Elizabeth II in 2003."},{"L":"7","t":"Today she travels the world, speaking about the threats facing chimpanzees and environmental crises, urging each of us to act on behalf of all living things and the planet we share. Her lecture tours and TV specials have made her a familiar figure to millions of people around the world. What is striking about Jane is that, even with all the problems that we face, she always holds and radiates hope, and passionately believes in humanity’s ability to evolve and change our ways."}],"groups":[{"a":1,"b":5,"k":"gap","instr":["Complete the sentences below with words taken from the reading passage.","Write NO MORE THAN THREE WORDS for each answer."],"items":[{"n":1,"t":"Experts on animal behavior are called ……","opts":[]},{"n":2,"t":"Jane Goodall is famous for spending a portion of her life with …… in Tanzania.","opts":[]},{"n":3,"t":"With nothing but a notebook, binoculars, and a …… for animals, Jane Goodall courageously entered the unknown life of mankind’s nearest extant relative.","opts":[]},{"n":4,"t":"Immersion was the …… approach Goodall had taken to conduct a deeper investigation of animals.","opts":[]},{"n":5,"t":"The greatest accomplishment of her study was the discovery of the chimpanzee’s ability to make and …… tools.","opts":[]}],"opts":[],"ctx":[]},{"a":6,"b":10,"k":"match","instr":["Complete each sentence with the correct ending, A–G, from the box below."],"items":[{"n":6,"t":"The claim about chimpanzees being vegetarian","opts":[]},{"n":7,"t":"Jane Goodall has corrected the numerous","opts":[]},{"n":8,"t":"The book about chimpanzees entitled “In the Shadow of Man”","opts":[]},{"n":9,"t":"Because of dedication to her work, Jane Goodall","opts":[]},{"n":10,"t":"Despite many challenges, Jane Goodall","opts":[]}],"opts":[{"k":"A","t":"long standing misconceptions about chimpanzees."},{"k":"B","t":"received multiple awards and recognition from the United Nations and Queen Elizabeth II."},{"k":"C","t":"showed the link between science and entertainment."},{"k":"D","t":"remains hopeful and optimistic of mankind’s capacity for change."},{"k":"E","t":"was nullified by an observation of them eating not only plants but also animals."},{"k":"F","t":"has been proved to be true by scientific evidence."},{"k":"G","t":"was reproached for not taking her bachelor’s degree."}],"ctx":[],"optTitle":"Sentence endings"}],"ans":{"1":{"v":"ethologists","ex":"Part of the passage: The credit goes to all those great ethologists like Karl von Frisch Explanation: Experts on animal behavior = ethologists. الفقرة 1."},"2":{"v":"chimpanzees","ex":"Part of the passage: is known for her years of living among chimpanzees in Tanzania Explanation: famous for = is known for.","alts":["wild chimpanzees"]},"3":{"v":"fascination","ex":"Part of the passage: Equipped with little more than a notebook, binoculars, and her fascination with wildlife Explanation: بعد a نحتاج اسم: fascination. الفقرة 3."},"4":{"v":"unorthodox","ex":"Part of the passage: She took an unorthodox approach in her field research, immersing herself in their habitat Explanation: بين the و approach نحتاج صفة: unorthodox (غير تقليدي)."},"5":{"v":"use","ex":"Part of the passage: Dr. Goodall’s discovery in 1960 that chimpanzees make and use tools Explanation: make and use tools. الفقرة 4."},"6":{"v":"E","ex":"Part of the passage: She also found that the animals are omnivorous, not vegetarian. Explanation: omnivorous = يأكل نبات ولحم، فادعاء أنها نباتية انلغى (nullified)."},"7":{"v":"A","ex":"Part of the passage: Over the years, Goodall was able to correct several misunderstandings about chimpanzees. Explanation: misunderstandings = misconceptions. وth
