<style>
/* Layout: a calm study desk. Sage-grey ground, white "paper" sheets, one deep-teal accent, a yellow highlighter for answers. */
:root{
 --bg:#F3F6FB; --surface:#FFFFFF; --sheet:#FAFCFF; --ink:#1C2340; --muted:#5E6684; --line:#E2E7F2;

 --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#10162A; --surface:#182037; --sheet:#1B2440; --ink:#E9ECF7; --muted:#A3ABC6; --line:#2A3452;
 --accent:#4FD1C5; --accent-ink:#06201F; --accent-soft:#173A40; --sky:#182D4A; --sky-ink:#A9CBFF;
 --mark:#6B5612; --mark-ink:#FFE9A6; --ok:#4FD69A; --ok-soft:#14352A; --bad:#FF8A76; --bad-soft:#3F211D; --gold:#FFC94D;
 --coral:#FF8A7E; --sun:#FFC85C; --mint:#4FD8B6; --skyc:#73B2FF; --grape:#A994FF; --rose:#FF7DB2;
 --hero1:#0B4E5A; --hero2:#137A78; --hero3:#2E9C86;
 --shadow:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#10162A; --surface:#182037; --sheet:#1B2440; --ink:#E9ECF7; --muted:#A3ABC6; --line:#2A3452;
 --accent:#4FD1C5; --accent-ink:#06201F; --accent-soft:#173A40; --sky:#182D4A; --sky-ink:#A9CBFF;
 --mark:#6B5612; --mark-ink:#FFE9A6; --ok:#4FD69A; --ok-soft:#14352A; --bad:#FF8A76; --bad-soft:#3F211D; --gold:#FFC94D;
 --coral:#FF8A7E; --sun:#FFC85C; --mint:#4FD8B6; --skyc:#73B2FF; --grape:#A994FF; --rose:#FF7DB2;
 --hero1:#0B4E5A; --hero2:#137A78; --hero3:#2E9C86;
 --shadow:rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{direction:rtl;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.7;margin:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

.en{direction:ltr;unicode-bidi:isolate;text-align:left}

.small{font-size:13.5px}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:14px}

.tabs{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px;align-self:flex-start;max-width:100%}

.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 4px 14px var(--shadow)}

.steps5{display:flex;gap:6px;flex-wrap:wrap}

.dayhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end}

.stepbtn.done .k{background:var(--ok);color:#fff}
.stepbtn[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
/* words */
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}

.reader{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:22px clamp(16px,4vw,40px);font-family:var(--read);direction:ltr;text-align:left;font-size:var(--fs,18px);line-height:1.8}

.reader .intro{font-style:italic;color:var(--muted);text-align:center;margin-bottom:14px}
.para{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;margin-bottom:16px}

.pane-switch{display:none}
.qgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.qhead{font-weight:600;font-size:15px}
.instr{font-family:var(--read);direction:ltr;text-align:left;font-size:14.5px;color:var(--muted);font-style:italic}
.hint{font-size:13.5px;background:var(--sky);color:var(--sky-ink);border-radius:10px;padding:8px 12px}
.optbox{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;background:var(--sheet)}
.optbox h5{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:500}

.optbox.cols ol{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.qitem{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.qitem:first-of-type{border-top:0}
.qn{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--sheet)}
.qn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.qn.no{background:var(--bad);border-color:var(--bad);color:#fff}

.choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;direction:ltr}

.choice.right{border-color:var(--ok);background:var(--ok-soft)}

.choices.col{flex-direction:column;align-items:stretch}

.gapin{font:inherit;font-family:var(--ui);font-size:14.5px;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:6px 6px 0 0;padding:1px 6px;width:9.5em;max-width:100%;color:var(--ink);direction:ltr}
.gapin.ok{border-color:var(--ok);background:var(--ok-soft)}
.gapin.no{border-color:var(--bad);background:var(--bad-soft)}
.gapsel{font:inherit;font-size:14px;border:1.5px solid var(--accent);border-radius:7px;background:var(--accent-soft);color:var(--ink);padding:1px 4px;max-width:100%}
.gnum{font-family:var(--ui);font-weight:700;font-size:12px;background:var(--ink);color:var(--surface);border-radius:5px;padding:0 5px;margin-right:4px}
.ctx{font-family:var(--read);direction:ltr;text-align:left;font-size:15.5px;line-height:2.1}
.ctitle{font-family:var(--read);font-weight:600;text-align:center;direction:ltr}
.flow{display:flex;flex-direction:column;align-items:center;gap:0}
.flow .box{border:1.5px solid var(--ink);border-radius:8px;padding:6px 12px;background:var(--sheet);max-width:560px;width:100%;text-align:center;font-family:var(--read);direction:ltr;font-size:15px;line-height:2}

.tablewrap{overflow-x:auto}

.diagram{max-width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}

.score{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

.band{border:2px solid var(--accent);border-radius:12px;padding:4px 14px;text-align:center}

.timer{font-variant-numeric:tabular-nums;font-weight:600}
.sheetbar{display:flex;flex-wrap:wrap;gap:4px}
.sheetbar span{width:28px;height:28px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.sheetbar span.f{border-color:var(--accent);background:var(--accent-soft)}
.sheetbar span.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.sheetbar span.no{background:var(--bad);border-color:var(--bad);color:#fff}
/* games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.game{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:start;display:flex;flex-direction:column;gap:4px;min-width:0}
.game:hover{border-color:var(--accent)}
.game h4{font-size:15.5px}
.game p{font-size:13px;color:var(--muted);line-height:1.6}
.game .gb{display:flex;justify-content:space-between;align-items:center;font-size:12.5px}
.game .best{color:var(--ok);font-weight:600}
.play{display:flex;flex-direction:column;gap:14px}
.prompt{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:16px}
.prompt .big{font-family:var(--read);font-size:26px;font-weight:600;direction:ltr;text-align:center}
.prompt .sent{font-family:var(--read);direction:ltr;text-align:left;font-size:17px;line-height:1.9}
.blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px;text-align:center;min-width:0}
.opt.en{font-family:var(--read);direction:ltr}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:10px;padding:10px 12px;font-size:14.5px}
.fb.ok{background:var(--ok-soft)}
.fb.no{background:var(--bad-soft)}
.flip{min-height:150px;display:grid;place-items:center;text-align:center;cursor:pointer}
.tiles{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.tile{border:1.5px solid var(--line);background:var(--sheet);border-radius:8px;padding:4px 10px;font-family:var(--read);font-size:15.5px}
.tile:disabled{opacity:.3}
.slot{min-height:46px;border:1.5px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.order{display:flex;flex-direction:column;gap:6px}
.order button{text-align:left;direction:ltr;font-family:var(--read);font-size:14.5px;border:1.5px solid var(--line);background:var(--sheet);border-radius:10px;padding:8px 10px;display:flex;gap:8px}
.order button .o{font-family:var(--ui);min-width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px}

.input{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--sheet);color:var(--ink);width:100%}
.input.en{font-family:var(--read)}
.diff span{border-radius:4px;padding:0 2px}
.ldiff .miss{color:var(--bad);text-decoration:underline 3px;background:none}
.ldiff .okw{color:var(--ok)}
.diff .miss{background:var(--bad-soft);color:var(--bad)}
.diff .okw{background:var(--ok-soft)}

.mbadge{display:flex;gap:12px;align-items:center}
.mbadge .medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;background:var(--accent-soft);color:var(--accent);border:2px solid var(--accent)}
.mbadge .medal.gold{background:var(--mark);color:var(--mark-ink);border-color:var(--gold)}

.wsheet{position:fixed;inset:auto 0 0 0;z-index:30;display:flex;justify-content:center;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.wsheet>div{width:100%;max-width:600px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px var(--shadow);padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px;max-height:75vh;overflow:auto}

/* strategy */
.strat{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}

 .hero{grid-template-columns:1fr}
 .testgrid{grid-template-columns:1fr}

 .testgrid[data-pane="p"] .qcol{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== v2: bright study-quest look ===== */
#main{display:flex;flex-direction:column;gap:18px;min-width:0}
.days{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1000px){.days{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}}
body{background:radial-gradient(900px 500px at 100% -10%,color-mix(in srgb,var(--sun) 18%,transparent),transparent 60%),radial-gradient(800px 500px at -10% 20%,color-mix(in srgb,var(--skyc) 14%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
.logo{background:linear-gradient(135deg,var(--coral),var(--sun));color:#fff;border-radius:14px;box-shadow:0 6px 14px color-mix(in srgb,var(--coral) 35%,transparent)}
.chip{border:0;box-shadow:0 3px 10px var(--shadow);font-weight:500}
.chip.c1{background:color-mix(in srgb,var(--coral) 16%,var(--surface))}
.chip.c2{background:color-mix(in srgb,var(--sun) 22%,var(--surface))}
.chip.c3{background:color-mix(in srgb,var(--grape) 16%,var(--surface))}
.tabs{border:0;box-shadow:0 4px 14px var(--shadow)}
.tab[aria-current="true"]{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff}
.card{border:0;box-shadow:0 8px 24px var(--shadow)}
.btn{border:0;box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent);transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn.ghost{border:1.5px solid var(--accent);box-shadow:none}
.btn.sun{background:var(--sun);color:#2B1D00;box-shadow:0 6px 16px color-mix(in srgb,var(--sun) 45%,transparent);font-weight:700;font-size:16.5px;padding:12px 24px;border-radius:14px}
/* hero */
.hero2{position:relative;overflow:hidden;border-radius:26px;padding:28px clamp(18px,4vw,36px);color:#fff;background:linear-gradient(135deg,var(--hero1),var(--hero2) 55%,var(--hero3));box-shadow:0 18px 40px color-mix(in srgb,var(--hero1) 35%,transparent);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:center}
.hero2 .bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.hero2 .eyebrow{color:var(--sun);letter-spacing:.8px}
.hero2 h2{font-size:clamp(24px,4vw,34px);font-weight:700}
.hero2 .ttl{font-family:var(--read);font-size:clamp(20px,3vw,26px);direction:ltr;text-align:right;opacity:.95}
.hero2 .sp{display:flex;gap:6px;flex-wrap:wrap}
.hero2 .sp span{font-size:13px;padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.14)}
.hero2 .sp span.done{background:var(--sun);color:#2B1D00;font-weight:600}
.ring{position:relative;width:150px;height:150px;flex:0 0 auto}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.2}
.ring .in b{font-size:34px;display:block}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center;background:var(--surface);box-shadow:0 8px 20px var(--shadow)}
.stat .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.stat .ic svg{width:24px;height:24px}
.stat b{font-size:22px;display:block;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
/* journey */
.week{background:var(--surface);border-radius:22px;padding:16px;box-shadow:0 8px 22px var(--shadow);border-top:5px solid var(--wk)}
.week h3{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:16.5px;font-weight:600}
.week h3 .wn{width:30px;height:30px;border-radius:10px;background:var(--wk);color:#fff;display:grid;place-items:center;font-size:14px}
.week h3 small{color:var(--muted);font-weight:400;font-size:13px}
.dtile{border:0;background:color-mix(in srgb,var(--wk) 9%,var(--sheet));border-radius:16px;padding:12px;transition:transform .15s,box-shadow .15s}
.dtile:hover{transform:translateY(-3px);box-shadow:0 10px 20px var(--shadow)}
.dtile .num{width:38px;height:38px;border-radius:50%;background:var(--wk);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
.dtile.cur{box-shadow:0 0 0 3px var(--wk),0 10px 22px var(--shadow)}
.dtile.cur .num{animation:pulse 1.8s ease-in-out infinite}
.dtile.star{background:linear-gradient(135deg,color-mix(in srgb,var(--sun) 30%,var(--sheet)),var(--sheet))}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--wk) 50%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.dots i.on{background:var(--wk)}
/* day banner */
.banner{position:relative;overflow:hidden;border-radius:24px;padding:22px clamp(18px,4vw,30px);color:#fff;background:linear-gradient(135deg,var(--wk),color-mix(in srgb,var(--wk) 55%,var(--hero1)));box-shadow:0 14px 32px color-mix(in srgb,var(--wk) 35%,transparent);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.banner h2{font-family:var(--read);font-size:clamp(24px,4vw,32px);direction:ltr;text-align:left;font-weight:600}
.banner .eyebrow{color:#fff;opacity:.9}
.banner .icon-btn{background:rgba(255,255,255,.18);border:0;color:#fff}
.banner .bubble{position:absolute;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.banner .medal{background:var(--sun);color:#2B1D00;border-color:#fff}
.bprog{min-width:180px;display:flex;flex-direction:column;gap:6px}
.bprog .meter{background:rgba(255,255,255,.25)}
.bprog .meter i{background:var(--sun)}
.stepbtn{border:0;background:var(--surface);box-shadow:0 4px 12px var(--shadow);border-radius:14px;padding:8px 14px}
.stepbtn .k{background:var(--sc);color:#fff}
.stepbtn[aria-current="true"]{background:var(--sc);color:#fff}
.stepbtn[aria-current="true"] .k{background:#fff;color:var(--sc)}
.stepbtn.done .k{background:var(--ok);color:#fff}
/* games */
.game{border:0;border-radius:18px;padding:14px;background:color-mix(in srgb,var(--gc) 11%,var(--surface));box-shadow:0 6px 16px var(--shadow);transition:transform .15s}
.game:hover{transform:translateY(-3px) rotate(-.4deg)}
.game .gi{width:42px;height:42px;border-radius:13px;background:var(--gc);color:#fff;display:grid;place-items:center;font-weight:700}
.game .gi svg{width:22px;height:22px}
.game .best{background:var(--ok);color:#fff;padding:1px 8px;border-radius:999px}
.play .meter i{background:linear-gradient(90deg,var(--mint),var(--skyc))}
.opt{border-radius:14px;border-width:2px;transition:transform .12s}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.wcard{border:0;border-radius:16px;background:var(--surface);box-shadow:0 6px 16px var(--shadow);border-top:4px solid var(--wc)}
.wcard.known{border-top-color:var(--ok)}
.wcard .ar{color:var(--wc)}
.qgroup{border:0;box-shadow:0 8px 22px var(--shadow);border-top:4px solid var(--accent)}
.reader{border:0;box-shadow:0 8px 22px var(--shadow)}
.strat .card{border-top:5px solid var(--sc)}
@media (max-width:860px){.hero2{grid-template-columns:1fr}.ring{justify-self:center}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---- IELTS academy additions ---- */

": false}, {"key": "l5", "title": "Starting, Extending & Linking", "ar": "كيف تبدئين وتطوّلين جوابك", "color": "--sun", "icon": "link", "pages": "29–36 (+ نصائح من المنصة)", "cards": [{"h": "لا تجاوبين بكلمة وحدة", "t": "Do you like reading? ← Yes. هذا جواب ضعيف! جاوبي واشرحي واعطي مثال. نسمي هالطريقة A-R-E: Answer (الجواب)، Reason (السبب)، Example (مثال). هذي نصيحة من المنصة تساعدك تطبّقين اللي في الملف.", "en": ["Yes, I do. I’m an avid reader, because books help me to relax. For instance, I read before I go to bed every night."]}, {"h": "كسب الوقت بذكاء", "t": "لما تحتاجين ثواني تفكرين، استخدمي عبارة طبيعية بدل الصمت أو «ممم». مثل اللي في إجابات الملف: Oh, that’s an interesting question. I guess… / To tell you the truth…", "en": ["Oh, that’s an interesting question. I guess there are a lot of things.", "To tell you the truth, I’m crazy about shopping."]}, {"h": "اربطي أفكارك", "t": "because, so, For instance, What’s more, but, Probably that’s why, But most importantly. شوفي كيف إجابات الأصدقاء في الملف مليانة روابط.", "en": ["We enjoy each other’s company, so we see each other almost daily… What’s more, we live very close to each other.", "But most importantly, they are people who are near and dear to my heart."]}, {"h": "نوّعي الأزمنة في الجواب", "t": "الملف يقول: عشان ننوع في الأزمنة. ابدئي بالحاضر، وبعدين ماضي أو مضارع تام.", "en": ["I often paint. I decided to have a go at painting because my daughter was taking classes. Yeah, so, I’ve been painting for about 2 years now."]}], "ex": [{"k": "order", "q": "Put the A-R-E answer in order.", "items": ["Yes, I do. I’m an avid reader.", "I read because books help me to relax.", "For instance, I read before I go to bed every night."], "why": "Answer ← Reason ← Example."}, {"k": "choose", "q": "Which answer is better for Part 1? \"Do you like shopping?\"", "opts": ["To tell you the truth, I’m crazy about shopping, even if I’m on a tight budget.", "Yes.", "Shopping."], "a": 0, "why": "جواب كامل بعبارة طبيعية وتفاصيل."}, alise. It helps me to chill out. I find that it helps me to get into shape. It allows me to hang out with friends. It’s quite a nice way to get close to nature.", "en": ["It helps me to chill out.", "It allows me to hang out with friends."]}], "ex": [{"k": "fill", "q": "Complete.", "s": "I am [[fond]] of playing video games because they help me relax.", "opts": ["fond", "keen", "passion", "into"], "why": "fond of."}, {"k": "fill", "q": "Complete.", "s": "I’m keen [[on]] photography.", "opts": ["on", "of", "about", "in"], "why": "keen on."}, {"k": "fill", "q": "Complete.", "s": "I’m passionate [[about]] painting.", "opts": ["about", "on", "of", "for"], "why": "passionate about."}, {"k": "sort", "q": "Indoor or outdoor?", "cats": ["Indoor", "Outdoor"], "items": [["board games", 0], ["jogging", 1], ["watching films", 0], ["gardening", 1], ["video games", 0], ["skiing", 1]], "why": "داخل البيت ولا برا."}, {"k": "choose", "q": "\"I’m new to it\" means…", "opts": ["I started it recently", "I’m very good at it", "I don’t like it"], "a": 0, "why": "جديدة عليه."}, {"k": "choose", "q": "Which phrase shows a benefit of a hobby?", "opts": ["It allows me to hang out with friends.", "I am new to it.", "I decided to try my hand at it."], "a": 0, "why": "الفائدة: أطلع مع ربعي."}], "bank": ["free", "sport"], "samples": [6, 10, 29], "types": [], "phase": 3, "graph": false}, {"key": "l7", "title": "Topic: Family & Friends", "ar": "مفردات: العائلة والأصدقاء", "color": "--rose", "icon": "link", "pages": "34–36", "cards": [{"h": "العائلة", "t": "immediate family: العائلة اللي في نفس البيت. extended family: الأجداد والأعمام والخوال وأولادهم. in-laws: أهل الزوج أو الزوجة. on my mother’s side / my father’s side. spread out: متفرقين. it runs in the family: وراثة.", "en": ["I live with my immediate family.", "My family is spread out all over America.", "Well, yes, it runs in the family. On my mother’s side, everyone gets annoyed very quickly."]}, {"h": "التربية", "t": "bring up / upbringing: news online."], "labels": ["Q1"], "q": "Media and News: How do you get your news?", "words": 32, "img": null, "note": [], "task": 1}, {"part": 2, "type": "p2", "title": "Describe a memorable holiday you have had.", "ar": "عطلة ما تنتسى", "q": "Describe a memorable holiday you have had.", "bul": ["Where you went", "Who you went with", "What you did", "And explain why it was memorable."], "model": ["I’d like to talk about a holiday I had in Salalah, in the south of Oman, two summers ago.", "I went with my immediate family: my parents, my sister and my two brothers. We drove there, which took about twelve hours, but it was a piece of cake because we kept singing and telling stories in the car.", "During the trip, we visited the waterfalls and the green mountains, and we had a picnic almost every day. We also stayed in a small cottage close to the sea, so we could hear the waves at night.", "The reason why it was so memorable is that it was the first holiday we had all together after my brother came back from studying abroad. What I remember most is sitting on the beach and laughing until midnight. All in all, it was a once-in-a-lifetime experience, and I will never forget it."], "page": "2", "n": 24, "paras": ["I’d like to talk about a holiday I had in Salalah, in the south of Oman, two summers ago.", "I went with my immediate family: my parents, my sister and my two brothers. We drove there, which took about twelve hours, but it was a piece of cake because we kept singing and telling stories in the car.", "During the trip, we visited the waterfalls and the green mountains, and we had a picnic almost every day. We also stayed in a small cottage close to the sea, so we could hear the waves at night.", "The reason why it was so memorable is that it was the first holiday we had all together after my brother came back from studying abroad. What I remember most is sitting on the beach and laughing until midnight. All in all, it was a once-in-a-lifetime experience, and I will never forget it."], "labels": ["Opening", "Body", "Body", "Ending"], "words": 149, "img": null, "note": [], "task": 2}, {"part": 2, "type": "p2", "title": "Describe a place you have visited that you liked.", "ar": "مكان زرتيه وحبيتيه", "q": "Describe a place you have visited that you liked.", "bul": ["Where is it?", "Why did you go there?", "What did you do there?", "Explain why you liked it."], "model": ["I’d like to talk about Jebel Akhdar, which is a mountain area in the north of Oman.", "I went there last winter with three of my close friends, because we wanted to escape the heat of the city and get close to nature.", "We rented a small cottage, and we spent the days hiking through the villages and picking pomegranates. In the evening, we sat around a fire and drank hot tea.", "The reason why I liked it so much is that the weather was cool and refreshing, and the views were absolutely breathtaking. It was so peaceful that I completely forgot about work. If I had more time, I would go back every month."], "page": "13", "n": 25, "paras": ["I’d like to talk about Jebel Akhdar, which is a mountain area in the north of Oman.", "I went there last winter with three of my close friends, because we wanted to escape the heat of the city and get close to nature.", "We rented a small cottage, and we spent the days hiking through the villages and picking pomegranates. In the evening, we sat around a fire and drank hot tea.", "The reason why I liked it so much is that the weather was cool and refreshing, and the views were absolutely breathtaking. It was so peaceful that I completely forgot about work. If I had more time, I would go back every month."], "labels": ["Opening", "Body", "Body", "Ending"], "words": 115, "img": null, "note": [], "task": 2}, {"part": 2, "type": "p2", "title": "Describe an event you attended that you found memorable.", "ar": "مناسبة حضرتيها", "q": "Describe an event you attended that you found memorable.", "bul": ["What was the event?", "When and where did it happen?", "Who was there?", "Why was it memorable?"], "model": ["I’m going to talk about my cousin’s wedding, which took place last spring in a big hall in Muscat.", "Almost all of my extended family was there, as well as many of the bride’s friends, so there were more than five hundred guests.", "The hall was decorated with thousands of flowers, and there was traditional music and dancing. I helped my aunt to welcome the guests, so I was in charge of the reception area.", "It was memorable because it was the first time I saw all my relatives in one place after many years. What’s more, my cousin is my confidant, and seeing her so happy made me really emotional. I will never forget that night."], "page": "13", "n": 26, "paras": ["I’m going to talk about my cousin’s wedding, which took place last spring in a big hall in Muscat.", "Almost all of my extended family was there, as well as many of the bride’s friends, so there were more than five hundred guests.", "The hall was decorated with thousands of flowers, and there was traditional music and dancing. I helped my aunt to welcome the guests, so I was in charge of the reception area.", "It was memorable because it was the first time I saw all my relatives in one place after many years. What’s more, my cousin is my confidant, and seeing her so happy made me really emotional. I will never forget that night."], "labels": ["Opening", "Body", "Body", "Ending"], "words": 117, "img": null, "note": [], "task": 2}, {"part": 2, "type": "p2", "title": "Describe a person who has influenced you.", "ar": "شخص أثّر فيك", "q": "Describe a person who has influenced you.", "bul": ["Who is the person?", "How did you meet this person?", "What is special about this person?", "Explain how this person influenced you."], "model": ["I’d like to talk about my English teacher in secondary school, Ms Fatma.", "I met her when I was fifteen, when she started teaching our class. At first, I was quite shy and I didn’t enjoy English at all.", "What is special about her is that she was patient and creative. For instance, she used songs and games in every lesson, and she always encouraged us to speak, even when we made mistakes.", "She influenced me a lot, because she made me fall in love with the language. In fact, the reason why I became an English teacher is her. Now I try to teach my own students the way she taught me."], "page": "13", "n": 27, "paras": ["I’d like to talk about my English teacher in secondary school, Ms Fatma.", "I met her when I was fifteen, when she started teaching our class. At first, I was quite shy and I didn’t enjoy English at all.", "What is special about her is that she was patient and creative. For instance, she used songs and games in every lesson, and she always encouraged us to speak, even when we made mistakes.", "She influenced me a lot, because she made me fall in love with the language. In fact, the reason why I became an English teacher is her. Now I try to teach my own students the way she taught me."], "labels": ["Opening", "Body", "Body", "Ending"], "words": 113, "img": null, "note": [], "task": 2}, {"part": 2, "type": "p2", "title": "Describe a goal you have set for yourself.", "ar": "هدف حطيتيه لنفسك", "q": "Describe a goal you have set for yourself.", "bul": ["What is the goal?", "Why did you set this goal?", "What steps have you taken to achieve it?", "Explain how achieving this goal will benefit you."], "model": ["I’d like to talk about my goal of getting a band seven in IELTS.", "I set this goal last year, because I want to apply for a master’s degree, and most universities ask for a band seven.", "So far, I have taken several steps. I have been studying for about six months, I watch speaking tests on YouTube, and I record my voice every day so that I can check my grammar and vocabulary.", "Achieving this goal will benefit me in many ways. It will help me to study abroad, and it will also give me a competitive edge when I apply for better jobs. Most importantly, it will make me more confident when I speak English."], "page": "13", "n": 28, "paras": ["I’d like to talk about my goal of getting a band seven in IELTS.", "I set this goal last year, because I want to apply for a master’s degree, and most universities ask for a band seven.", "So far, I have taken several steps. I have been studying for about six months, I watch speaking tests on YouTube, and I record my voice every day so that I can check my grammar and vocabulary.", "Achieving this goal will benefit me in many ways. It will help me to study abroad, and it will also give me a competitive edge when I apply for better jobs. Most importantly, it will make me more confident when I speak English."], "labels": ["Opening", "Body", "Body", "Ending"], "words": 117, "img": null, "note": [], "task": 2}, {"part": 2, "type": "p2", "title": "Describe a hobby or interest you enjoy.", "ar": "هواية تحبينها", "q": "Describe a hobby or interest you enjoy.", "bul": ["What is it?", "How did you become interested in it?", "What do you do as part of this hobby?", "Explain why you enjoy it."], "model": ["I’d like to talk about painting, which is a hobby I’m passionate about.", "I became interested in it about two years ago, because my daughter was taking classes, so I decided to have a go at painting too. I was new to it, but I loved it from the first day.", "As part of this hobby, I paint whenever I get the chance, usually on Friday afternoons. I mostly paint landscapes, and sometimes I join an online class to learn new techniques.", "I enjoy it because it helps me to chill out after a long week. It’s quite a nice way to express my feelings, and I’ve been painting for about two years now, so I can see how much I have improved."], "page": "14, 29", "n": 29, "paras": ["I’d like to talk about painting, which is a hobby I’m passionate about.", "I became interested in it about two years ago, because my daughter was taking classes, so I decided to have a go at painting too. I was new to it, but I loved it from the first day.", "As part of this hobby, I paint whenever I get the chance, usually on Friday afternoons. I mostly paint landscapes, and sometimes I join an online class to learn new techniques.", "I enjoy it because it helps me to chill out after a long week. It’s quite a nice way to express my feelings, and I’ve been painting for about two years now, so I can see how much I have improved."], "labels": ["Opening", "Body", "Body", "Ending"], "words": 123, "img": null, "note": [], "task": 2}, {"part": 2, "type": "p2", "title": "Describe a piece of technology that you find useful.", "ar": "جهاز تكنولوجي مفيد", "q": "Describe a piece of technology that you find useful.", "bul": ["What is it?", "How do you use it?", "How has it improved your life?", "Explain why it is useful to you."], "model": ["I’d like to talk about my laptop, which I bought about three years ago.", "I use it every day, both for work and for fun. I prepare my lessons on it, I attend online meetings, and in the evening I watch documentaries or study for IELTS.", "It has improved my life a lot. Before I had it, I used to print everything and carry heavy books. Now everything is saved in one place, so I can work from anywhere.", "It is useful to me because it saves time and makes me more organised. If I didn’t have it, I would probably need twice as long to prepare my lessons."], "page": "14", "n": 30, "paras": ["I’d like to talk about my laptop, which I bought about three years ago.", "I use it every day, both for work and for fun. I prepare my lessons on it, I attend online meetings, and in the evening I watch documentaries or study for IELTS.", "It has improved my life a lot. Before I had it, I used to print everything and carry heavy books. Now everything is saved in one place, so I can work from anywhere.", "It is useful to me because it saves time and makes me more organised. If I didn’t have it, I would probably need twice as long to prepare my lessons."], "labels": [" eves. What’s more, the material is light, so it is comfortable in hot weather.", "When I wear it, I feel confident and elegant. I usually wear it to special occasions, like weddings or family gatherings, and people always ask me where I bought it."], "labels": ["Opening", "Body", "Body", "Ending"], "words": 94, "img": null, "note": [], "task": 2}, {"part": 2, "type": "p2", "title": "Describe a job you would like to have in the future.", "ar": "وظيفة تبينها في المستقبل", "q": "Describe a job you would like to have in the future.", "bul": ["What is the job?", "Why do you want this job?", "What qualifications are needed for this job?", "Explain why you think you would be good at this job."], "model": ["I’d like to talk about becoming a university lecturer in English language teaching.", "I want this job because I’m passionate about education, and I would like to train new teachers, not only teach children.", "For this job, you need at least a master’s degree, and usually a PhD, as well as a high IELTS score and some teaching experience.", "I think I would be good at this job because I have been teaching for several years, so I understand the challenges teachers face. I am also patient and creative, and I really enjoy helping people to improve."], "page": "15", "n": 35, "paras": ["I’d like to talk about becoming a university lecturer in English language teaching.", "I want this job because I’m passionate about education, and I would like to train new teachers, not only teach children.", "For this job, you need at least a master’s degree, and usually a PhD, as well as a high IELTS score and some teaching experience.", "I think I would be good at this job because I have been teaching for several years, so I understand the challenges teachers face. I am also patient and creative, and I really enjoy helping people to improve."], "labels": ["Opening", "Body", "Body", "Ending"], "words": 97, "img": null, "note": [], "task": 2}, {"part": 2, "type": "p2", "title": "Describe a historical figure you admire.", "ar": "شخصية تاريخية تعجبك", "q": "Describe a historical figure you admire.", "bul": ["Who is the person?", "What did they do?", "Why do you admire them?", "Explain their impact on history."], "model": ["I’d like to talk about Ibn Battuta, a famous traveller from Morocco who lived in the fourteenth century.", "He spent almost thirty years travelling around the world. He visited Africa, the Middle East, India and China, and later he wrote a book about his journeys.", "I admire him because he was brave and curious. At that time, travelling was very dangerous, but he never gave up.", "His impact on history is huge, because his book is one of the most important records of life in the Middle Ages. Thanks to him, historians know a lot about the cultures of that time."], "page": "15", "n": 36, "paras": ["I’d like to talk about Ibn Battuta, a famous traveller from Morocco who lived in the fourteenth century.", "He spent almost thirty years travelling around the world. He visited Africa, the Middle East, India and China, and later he wrote a book about his journeys.", "I admire him because he was brave and curious. At that time, travelling was very dangerous, but he never gave up.", "His impact on history is huge, because his book is one of the most important records of life in the Middle Ages. Thanks to him, historians know a lot about the cultures of that time."], "labels": ["Opening", "Body", "Body", "Ending"], "words": 101, "img": null, "note": [], "task": 2}, {"part": 2, "type": "p2", "title": "Describe a piece of music that is important to you.", "ar": "أغنية / مقطوعة مهمة لك", "q": "Describe a piece of music that is important to you.", "bul": ["What is the music?", "When did you first hear it?", "How does it make you feel?", "Explain why it is important to you."], "model": ["I’d like to talk about a traditional song that my grandmother used to sing to us.", "I first heard it when I was a small child, when I used to sleep at her house every weekend.", "Whenever I hear it now, it makes me feel calm and a little bit emotional, because it reminds me of my childhood.", "It is important to me because my grandmother passed away a few years ago, and this song is like a memory of her. I have recorded it on my phone, and sometimes I play it for my own children."], "page": "16", "n": 37, "paras": ["I’d like to talk about a traditional song that my grandmother used to sing to us.", "I first heard it when I was a small child, when I used to sleep at her house every weekend.", "Whenever I hear it now, it makes me feel calm and a little bit emotional, because it reminds me of my childhood.", "It is important to me because my grandmother passed away a few years ago, and this song is like a memory of her. I have recorded it on my phone, and sometimes I play it for my own children."], "labels": ["Opening", "Body", "Body", "Ending"], "words": 97, "img": null, "note": [], "task": 2}, {"part": 2, "type": "p2", "title": "Describe a restaurant you enjoy going to.", "ar": "مطعم تحبينه", "q": "Describe a restaurant you enjoy going to.", "bul": ["Where is it located?", "What type of food do they serve?", "Why do you like going there?", "Explain what makes it special."], "model": ["I’d like to talk about a small seafood restaurant located next to the beach in my hometown.", "They serve fresh fish and traditional Omani dishes, such as grilled kingfish with rice and spicy sauce.", "I like going there because the food is delicious and the prices are reasonable. What’s more, the staff are really friendly, and they know my family well.", "What makes it special is the view. You can sit outside and watch the sunset while you eat. I usually go there with my friends at weekends, and it’s quite a nice way to chill out after a busy week."], "page": "16", "n": 38, "paras": ["I’d like to talk about a small seafood restaurant located next to the beach in my hometown.", "They serve fresh fish and traditional Omani dishes, such as grilled kingfish with rice and spicy sauce.", "I like going there because the food is delicious and the prices are reasonable. What’s more, the staff are really friendly, and they know my family well.", "What makes it special is the view. You can sit outside and watch the sunset while you eat. I usually go there with my friends at weekends, and it’s quite a nice way to chill out after a busy week."], "labels": ["Opening", "Body", "Body", "Ending"], "words": 101, "img": null, "note": [], "task": 2}, {"part": 2, "type": "p2", "title": "Describe an achievement you are proud of.", "ar": "إنجاز تفتخرين فيه", "q": "Describe an achievement you are proud of.", "bul": ["What is the achievement?", "How did you achieve it?", "How did you feel after achieving it?", "Explain why you are proud of it."], "model": ["I’d like to talk about the time my team won second place in a national science competition at university.", "We achieved it by working day and night for a whole month. We designed a small device that saves water in gardens, and we practised our presentation many times.", "After the results were announced, I felt so proud and relieved. I couldn’t believe it, because there were more than eighty other teams.", "I’m proud of it because it showed me that hard work pays off. What’s more, it gave me the confidence to start my own projects, and I will never forget that moment."], "page": "16", "n": 39, "paras": ["I’d like to talk about the time my team won second place in a national science competition at university.", "We achieved it by working day and night for a whole month. We designed a small device that saves water in gardens, and we practised our presentation many times.", "After the results were announced, I felt so proud and relieved. I couldn’t believe it, because there were more than eighty other teams.", "I’m proud of it because it showed me that hard work pays off. What’s more, it gave me the confidence to start my own projects, and I will never forget that moment."], "labe /* ---------- dictionary ---------- */
function lemmaOf(w){
 let k=w.toLowerCase().replace(/[’]/g,"'").replace(/^'+|'+$/g,'');
 k=k.replace(/'s$/,'');
 if(DICT.g[k])return k;
 if(DICT.f[k]&&DICT.g[DICT.f[k]])return DICT.f[k];
 const tries=[[/ies$/,'y'],[/ied$/,'y'],[/ing$/,''],[/ing$/,'e'],[/ed$/,''],[/ed$/,'e'],[/es$/,''],[/s$/,''],[/ly$/,''],[/er$/,''],[/est$/,'']];
 for(const [re,r] of tries){if(re.test(k)){const b=k.replace(re,r);if(DICT.g[b])return b;if(DICT.f[b]&&DICT.g[DICT.f[b]])return DICT.f[b]}}
 return null}
function glossOf(w){
 const k=lemmaOf(w);if(k)return {lem:k,ar:DICT.g[k]};
 const lw=w.toLowerCase();
 if(/-/.test(w)){const parts=w.split('-').map(x=>{const l=lemmaOf(x);return l?DICT.g[l].split(' / ')[0]:x});return {lem:lw,ar:parts.join(' + ')}}
 if(PROPER.has(lw)||/^[A-Z]/.test(w))return {lem:lw,ar:'اسم علم (شخص أو مكان أو جهة)'};
 return {lem:lw,ar:''}}
function tokHTML(text){
 return String(text==null?'':text).split(/([A-Za-z]+(?:[’'-][A-Za-z]+)*)/).map((p,i)=>i%2===0?esc(p):`<span class="w" data-w="${esc(p)}">${esc(p)}</span>`).join('')}
function splitSent(t){return String(t).split(/(?<=[.!?]["”’']?)\s+(?=[A-Z“‘"'(])/).filter(x=>x.trim())}

/* ---------- language-bank matcher (highlights useful language in any text) ---------- */
const MATCH=(()=>{const L=[];BANK.items.forEach(it=>{(it.f||[]).forEach(f=>{if(f.length>2&&!/^(million|billion|about|stage|stages|first|along|near|centre|then|next|highest|lowest|while|compare|illustrate|the same|like)$/i.test(f))L.push([f,it.id])});});
 ['then','next','while','highest','lowest','about','first'].forEach(f=>{const it=BANK.items.find(x=>(x.f||[]).includes(f));if(it)L.push([f,it.id])});
 L.sort((a,b)=>b[0].length-a[0].length);
 return L.map(([f,id])=>{let src='\\b'+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+')+'\\b';if(BI[id].k==='approx')src+='(?=\\s+(?:[A-Za-z-]+\\s+){0,2}[$£]?\\d)';return [new RegExp(src,'gi'),id]})})();
function bankHits(text){const hits=[];MATCH.forEach(([re,id])=>{re.lastIndex=0;let m;while((m=re.exec(text))){const a=m.index,b=a+m[0].length;if(!hits.some(h=>a<h[1]&&b>h[0]))hits.push([a,b,id])}});return hits.sort((x,y)=>x[0]-y[0])}
function hlHTML(text,on){if(!on)return tokHTML(text);const H=bankHits(text);let out='',i=0;H.forEach(([a,b,id])=>{out+=tokHTML(text.slice(i,a))+`<span class="bl c-${BI[id].k}" data-bi="${id}">${tokHTML(text.slice(a,b))}</span>`;i=b});return out+tokHTML(text.slice(i))}

  c+=`She is playing the game "${gname(S.game)}". Current question: ${strip(R.prompt||R.full||R.target||'')}`;if(R.opts)c+=` Options: ${R.opts.map(o=>o.label).join(' | ')}.`;if(S.game.picked!=null&&R.kind==='choice')c+=` She chose "${(R.opts.find(o=>o.val===S.game.picked)||{}).label}". The correct answer is "${(R.opts.find(o=>o.val===R.ans)||{}).label}".`;return c}
 if(S.room==='plan'&&S.les){const L=LBY[S.les];c+=`Lesson: ${L.title} (${L.ar}), book pages ${L.pages}. Step: ${S.step}.\nLesson content:\n${L.cards.map(x=>'- '+x.h+': '+x.t+(x.en.length?' Book: '+x.en.join(' / '):'')).join('\n')}`;

  return c}
 if(S.room==='samples'&&S.sam){const s=SBY[S.sam];const p=SP(s.n);c+=`Writing ${s.task===2?'Task 2 essay':'Task 1 report'} question ${s.n} (${TYPES[s.type][1]}). Question: ${s.q}${s.title?' Chart title: '+s.title:''}${s.task===1?' (She can see the chart image; you cannot. If she asks about numbers that are not in the model answer below, ask her to type them.)':''}\n${s.paras.length?`Model answer (${s.words} words, ${s.src==='plat'?'written for the platform':'from the file'}):\n${s.paras.map((x,i)=>'['+s.labels[i]+'] '+x).join('\n')}`:'The file has no model answer for this question.'}`;
  if(p.text.trim())c+=`\n\nHer own report (${wcount(p.text)} words):\n"""${p.text}"""`;if(p.check)c+=`\nAutomatic checker: ${p.check.list.map(x=>(x.ok?'OK ':'MISSING ')+x.t).join('; ')}`;c+=`\nShe is on the step: ${S.sstep}.`;return c}
 if(S.room==='bank'){const c2=CATS[S.bcat];return `Language bank section: ${c2.en} (${c2.ar}). Items: ${BANK.items.filter(x=>x.k===S.bcat).map(x=>x.e+' = '+x.a).join('; ')}`}
 if(S.room==='tests')return 'She is on the tests page (mixed test, 37-sentence prepositions test, timed exam simulation).';
 if(S.room==='nb')return `Her notebook words: ${P.nb.slice(0,30).map(x=>x.w).join(', ')||'none yet'}.`;

async function coachSend(text,tier){text=String(text||'').trim();if(!text||COACH.busy)return;
 if(!AI){COACH.err='off';drawCoach();return}

 const keep=COACH.turns.filter(t=>!t.pending).slice(-12);
 const input=[{role:'user',content:RULES+'\n'+coachCtx()}].concat(keep);
 if(input[1]&&input[1].role==='assistant')input.splice(1,1);
 const ctl=new AbortController();COACH.ctl=ctl;const bubble=COACH.turns[COACH.turns.length-1];
 try{const r=await AI(input,{cache:false,signal:ctl.signal,modelTier:tier||'quick',onText:({text})=>{bubble.content=text;bubble.pending=0;paintLast()}});bubble.content=r.text;if(r.truncated)bubble.content+='\n\n(الجواب طويل وانقطع. اطلبي الباقي.)';addXP(1)}
 catch(e){bubble.content=(e&&e.text)||'';if(!bubble.content)COACH.turns.pop();COACH.err=(e&&COACH_ERR[e.code]!=null)?COACH_ERR[e.code]:'ما قدرت أوصل للمدرّبة الحين'+(e&&e.code?' ('+e.code+')':'')+'. جرّبي مرة ثانية.';if(e&&e.code==='not_granted')COACH.err='denied'}
 bubble.pending=0;COACH.busy=false;COACH.ctl=null;drawCoach()}

const VQ={on:false,paused:false,id:null,items:[],k:0,title:'',g:null,tok:0,timer:null,noAr:false,help:false,rk:-1};
let arV=null,VOICES=0;
const HAS_TTS=typeof window!=='undefined'&&'speechSynthesis' in window;
function pickAr(){try{const v=speechSynthesis.getVoices();VOICES=v.length;arV=v.find(x=>/^ar[-_](OM|SA|AE|KW|QA|BH)/i.test(x.lang))||v.find(x=>/^ar/i.test(x.lang))||null}catch(e){VOICES=0}return VOICES}
try{pickAr();speechSynthesis.addEventListener('voiceschanged',pickAr)}catch(e){}
const vrate=()=>P.vrate||1;
const VRATES=[[.8,'أبطأ'],[1,'عادي'],[1.2,'أسرع']];
/* split a text into Arabic and English runs so each is read by the right voice */
function vsegs(text,g){const out=[];const t=String(text||'').replace(/<[^>]+>/g,' ').replace(/[•«»←→✓✗✦▶■★·]/g,' ').replace(/ـ/g,'').replace(/\s+/g,' ').replace(/\.\s*\./g,'.');
 const re=/[A-Za-z][A-Za-z0-9 ,.'’%$£()\-:;!?\/&+=]*/g;let i=0,m;
 const pushAr=s=>{s=s.replace(/[()\[\]{}]/g,' ');if(/[؀-ۿ0-9٠-٩]/.test(s))out.push({t:s.trim(),lang:'ar',g})};
 while((m=re.exec(t))){pushAr(t.slice(i,m.index));const en=m[0].replace(/[\s,.:;(\-]+$/,'');if(/[A-Za-z]/.test(en))out.push({t:en.trim(),lang:'en',g});i=m.index+m[0].length}
 pushAr(t.slice(i));
 const merged=[];out.forEach(x=>{const l=merged[merged.length-1];if(l&&l.lang===x.lang&&l.g===x.g)l.t+=' '+x.t;else merged.push(x)});return merged}
/* long text → short pieces (Chrome stops long utterances) */
function vchunks(t,lang){t=String(t).replace(/\s+/g,' ').trim();if(t.length<=190)return [t];
 const parts=t.split(lang==='ar'?/(?<=[.،؟!:؛])\s+/:/(?<=[.;:!?])\s+|(?<=,)\s+/);const out=[];let cur='';
 parts.forEach(p=>{if(cur&&(cur+' '+p).length>190){out.push(cur);cur=p}else cur=cur?cur+' '+p:p});if(cur)out.push(cur);
 return out.flatMap(x=>{if(x.length<=240)return [x];const r=[];let c='';x.split(' ').forEach(y=>{if(c&&(c+' '+y).length>190){r.push(c);c=y}else c=c?c+' '+y:y});if(c)r.push(c);return r})}
function vmark(g){VQ.g=g;document.querySelectorAll('.vreading').forEach(e=>e.classList.remove('vreading'));if(g==null)return;const el=document.querySelector(`[data-vg="${g}"]`);if(el){el.classList.add('vreading');try{const r=el.getBoundingClientRect();const p=document.getElementById('vplayer');const ph=p?p.offsetHeight+24:200;if(r.top<60||r.top>innerHeight-ph-80)window.scrollTo({top:scrollY+r.top-80,behavior:'smooth'})}catch(e){}}}
function vbtnState(){document.querySelectorAll('[data-vplay]').forEach(b=>{const on=VQ.on&&VQ.id===b.dataset.vplay;b.classList.toggle('on',on);b.innerHTML=on?ICON.stop+' أوقفي':(b.dataset.lbl||ICON.spk+' اسمعي')})}
const VTITLE=id=>/^les:[^:]+:\d+$/.test(id)?'شرح البطاقة':/^les:/.test(id)?'شرح الدرس':id==='tips'?'نصائح قبل الكتابة':id==='check'?'ملاحظات المدقق':id==='model'?'شرح الإجابة':/^para:/.test(id)?'شرح الفقرة':/^bi:/.test(id)?'شرح العبارة':id==='bcat'?'شرح القسم':id==='tour'?'كيف أستخدم المنصة':/^ex:/.test(id)?'التمرين':/^c\d/.test(id)?'رد المدرّبة':id==='q'?'السؤال':'الشرح';
function vstarts(){const s=[];VQ.items.forEach((x,i)=>{if(i===0||x.g==null||x.g!==VQ.items[i-1].g)s.push(i)});return s}
function playVoice(items,id,title){stopSpeak();items=(items||[]).filter(x=>x&&x.t&&String(x.t).trim());if(!items.length)return;
 if(!HAS_TTS){toast('الصوت غير متاح في هذا المتصفح');return}
 pickAr();const ex=[];items.forEach(it=>vchunks(it.t,it.lang).forEach(c=>ex.push({t:c,lang:it.lang,g:it.g})));
 Object.assign(VQ,{items:ex,k:0,on:true,paused:false,id,title:title||VTITLE(id),rk:-1,noAr:VOICES>0&&!arV&&ex.some(x=>x.lang==='ar')});
 try{speechSynthesis.cancel()}catch(e){}speaking=true;vbtnState();vplayIt()}
function vdone(){Object.assign(VQ,{on:false,paused:false,id:null});VQ.tok++;clearTimeout(VQ.timer);speaking=false;vmark(null);vbtnState();drawPlayer()}
function vplayIt(){clearTimeout(VQ.timer);if(!VQ.on||VQ.paused)return;if(VQ.k>=VQ.items.length){vdone();return}
 const it=VQ.items[VQ.k];const tok=++VQ.tok;vmark(it.g);drawPlayer();
 const adv=()=>{if(tok!==VQ.tok||!VQ.on||VQ.paused)return;VQ.k++;vplayIt()};
 const hold=()=>{VQ.timer=setTimeout(adv,Math.min(9000,Math.max(1800,it.t.length*62/vrate())))};
 if(it.lang==='ar'&&VQ.noAr){hold();return}
 const u=new SpeechSynthesisUtterance(it.t);
 if(it.lang==='ar'){u.lang=arV?arV.lang:'ar-SA';if(arV)u.voice=arV;u.rate=.95*vrate()}else{u.lang='en-GB';if(enV)u.voice=enV;u.rate=.88*vrate()}
 let started=false;u.onstart=()=>{started=true};u.onend=adv;u.onerror=e=>{if(e&&/interrupted|canceled/.test(e.error||''))return;adv()};
 try{speechSynthesis.speak(u)}catch(e){hold();return}
 /* watchdog: some browsers silently drop the first utterance after cancel → retry once, then move on */
 VQ.timer=setTimeout(()=>{if(tok!==VQ.tok||started||!VQ.on||VQ.paused)return;if(VQ.rk!==VQ.k){VQ.rk=VQ.k;try{speechSynthesis.cancel()}catch(e){}vplayIt()}else{VQ.tok++;try{speechSynthesis.cancel()}catch(e){}const t2=VQ.tok;VQ.timer=setTimeout(()=>{if(t2===VQ.tok){VQ.k++;vplayIt()}},Math.min(6000,Math.max(1500,it.t.length*55)))}},2200)}
function vpause(){if(!VQ.on)return;VQ.paused=!VQ.paused;VQ.tok++;clearTimeout(VQ.timer);if(VQ.paused){try{speechSynthesis.cancel()}catch(e){}drawPlayer()}else{VQ.rk=-1;vplayIt()}}
function vjump(dir){if(!VQ.on)return;const s=vstarts();let gi=0;s.forEach((v,i)=>{if(v<=VQ.k)gi=i});
 let k=dir>0?(s[gi+1]!=null?s[gi+1]:VQ.items.length):(VQ.k>s[gi]?s[gi]:s[Math.max(0,gi-1)]);
 VQ.tok++;clearTimeout(VQ.timer);try{speechSynthesis.cancel()}catch(e){}VQ.k=k;VQ.paused=false;VQ.rk=-1;vplayIt()}
function vspeed(){const i=VRATES.findIndex(r=>r[0]===vrate());P.vrate=VRATES[(i+1)%VRATES.length][0];save();document.querySelectorAll('.vrate').forEach(x=>x.classList.toggle('on',+x.dataset.vrate===P.vrate));if(VQ.on&&!VQ.paused){VQ.tok++;try{speechSynthesis.cancel()}catch(e){}vplayIt()}else drawPlayer()}

 if((S.room==='samples'||S.mock)&&S.sam){const s=SBY[S.sam];if(S.sstep==='write'||S.mock)return ['قيّمي جوابي وحسّنيه','أعطيني ٣ أفكار للجواب','كيف أطوّل جوابي؟','وش عبارة ثانية بدل اللي قلتها؟'];if(S.sstep==='model')return ['اشرحي الإجابة النموذجية بالعربي','وش أحسن ٣ عبارات أحفظها منها؟','اكتبي نسخة أبسط منها'];return ['أعطيني خطة للجواب','وش الكلمات المناسبة لهذا الموضوع؟']}
 if(S.room==='plan'&&S.les)return ['اشرحي الدرس ببساطة بالعربي','أعطيني ٣ أمثلة جديدة','اختبريني بسؤالين'];
 return ['كيف أتغلب على الخوف لما أتكلم؟','كيف أذاكر المحادثة في أسبوعين؟','اسأليني سؤال Part 1 وقيّمي جوابي']}
function playById(id){
 if(id.startsWith('shadow:')){const s=SBY[S.sam];const k=+id.split(':')[1];shadowPlay(s.part===2?s.model.join(' '):s.models[k],id);return}
 if(id==='tips'){const s=SBY[S.sam];const items=[{t:'الموضوع:',lang:'ar',g:null},{t:s.title,lang:'en',g:null}];PART_TIPS[s.part].forEach((t,i)=>items.push(...vsegs(t,'tip'+i)));playVoice(items,id,'نصائح قبل ما تتكلمين');return}
 if(id==='tour'){playVoice([
  {t:'هلا بك في مختبر المحادثة. هنا تتعلمين وتتدربين على محادثة الآيلتس من الملف خطوة خطوة.',lang:'ar',g:null},
  {t:'في رحلتي '+LES.length+' دروس: الامتحان والمعايير والقواعد، وأدوات الكلام، ومفردات المواضيع، وPart 2 وPart 3. كل درس فيه شرح وتمارين وألعاب واختبار تمكّن.',lang:'ar',g:null},
  {t:'وفي غرفة المحادثة '+SAM.length+' موضوع من الملف. الممتحن يقرأ لك السؤال، وأنتِ تضغطين المايك وتتكلمين، والمنصة تكتب كلامك وتحلله، وتقدرين تسمعين صوتك.',lang:'ar',g:null},
  {t:'وإذا ما عرفتي وش تقولين، افتحي «ساعديني أتكلم»، فيها بدايات جاهزة وعبارات من الملف.',lang:'ar',g:null},
  {t:'وبعدين اسمعي الإجابة النموذجية وكرري وراها جملة جملة. وجربي محاكاة الامتحان الكامل لما تكونين جاهزة. بالتوفيق!',lang:'ar',g:null}],id);return}
 return playById0(id)}
/* ---------- events for the speaking room ---------- */
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-smic],[data-acheck],[data-qi],[data-qgo],[data-askq],[data-prep],[data-mock],[data-mocknext],[data-mockexit],[data-quick],[data-p2back]');if(!b)return;const d=b.dataset;
 if(d.smic){if(S.sam&&SBY[S.sam].part===2&&!S.p2talk){S.p2talk=1}micStart();return}
 if(d.acheck!=null){if(MIC.on)micStop();const i=+d.acheck;const s=SBY[S.sam];const p=SPK(s.n);const ta=$('#ans');const t=(ta?ta.value:'').trim();if(!t){toast('تكلمي أو اكتبي جوابك أول.');return}p.ans[i]=t;const first=!p.chk[i];p.chk[i]=checkSpeech(t,s,(p.secs||{})[i]||0);if(first)addXP(s.part===2?15:5);save();render();setTimeout(()=>{const e=document.querySelector('.checks');if(e)e.scrollIntoView({behavior:'smooth',block:'center'})},50);return}
 if(d.qi!=null){if(MIC.on)micStop();S.qi=+d.qi;S.sstep='write';render();setTimeout(()=>{askQ(SBY[S.sam],S.qi);const c=document.querySelector('.spk');if(c)c.scrollIntoView({behavior:'smooth',block:'start'})},120);return}
 if(d.qgo!=null){S.qi=+d.qgo;S.sstep='write';SPK(S.sam).look=1;render();setTimeout(()=>askQ(SBY[S.sam],S.qi),150);return}
 if(d.askq!=null){askQ(SBY[S.sam],+d.askq);return}
 if(d.prep){const n=S.sam;if(!S.prep||S.prep.n!==n)S.prep={n,left:60,run:false};S.prep.run=!S.prep.run;if(S.prep.run&&S.prep.left===60)askQ(SBY[n],0);render();return}
 if(d.p2back){S.p2talk=0;render();return}
 if(d.mock){if(MIC.on)micStop();S.mock=mockBuild();S.room='samples';S.p2talk=0;render();setTimeout(()=>{const it=S.mock.items[0];askQ(SBY[it.n],it.qi)},300);return}
 if(d.mocknext){if(MIC.on)micStop();const ta=$('#ans');const it=S.mock.items[S.mock.k];if(ta&&ta.value.trim()){const s=SBY[it.n];const p=SPK(it.n);p.ans[it.qi]=ta.value.trim();if(!p.chk[it.qi]){p.chk[it.qi]=checkSpeech(p.ans[it.qi],s,(p.secs||{})[it.qi]||0);addXP(3)}save()}S.mock.k++;S.p2talk=0;S.prep=null;render();try{window.scrollTo({top:0})}catch(e){}const nx=S.mock.items[S.mock.k];if(nx)setTimeout(()=>askQ(SBY[nx.n],nx.qi),250);return}
 if(d.mockexit){if(MIC.on)micStop();S.mock=null;S.sam=null;render();return}
 if(d.quick){const s=pick(SAM.filter(x=>x.part!==2));openSample(s.n,'write');S.qi=Math.floor(Math.random()*s.qs.length);render();setTimeout(()=>askQ(s,S.qi),200);return}
},true);
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='ans'&&S.sam){SPK(S.sam).ans[S.qi||0]=t.value;const c=$('#wcl');if(c)c.textContent=wcount(t.value);clearTimeout(t._t);t._t=setTimeout(save,500)}if(t.dataset&&t.dataset.note!=null&&S.sam){SPK(S.sam).notes[+t.dataset.note]=t.value;clearTimeout(t._t);t._t=setTimeout(save,500)}});
setInterval(()=>{const T=S.prep;if(T&&T.run&&S.sam===T.n){T.left=Math.max(0,T.left-1);const e=$('#ptmr');if(e)e.textContent=fmt(T.left);if(T.left===0){T.run=false;S.p2talk=1;toast('خلصت الدقيقة! الحين تكلمي دقيقتين.');render()}}},1000);
/* route the samples room through the mock when it is running */
const _render2=render;render=function(){if(S.mock&&S.room==='samples'&&!S.game){renderTabs();renderHud();$('#main').innerHTML=mockView();drawSheet();if(COACH.open)drawCoach();vbtnState();return}_render2()};
const _go=go;go=function(r){if(MIC.on)micStop();S.mock=null;S.p2talk=0;_go(r)};
const _openSample=openSample;openSample=function(n,step){if(MIC.on)micStop();S.qi=0;S.p2talk=0;S.mock=null;_openSample(n,step)};
